tName": "稅務相關法規概要", "number": 2, "question": "依據所得稅法規定,下列所得分類何者正確?", "options": {"A": "政府舉辦獎券中獎獎金屬於競技、競賽及機會中獎之獎金,計入綜合所得總額", "B": "職工福利委員會發放之福利金屬於薪資所得,計入綜合所得總額", "C": "中華民國境內居住之個人與證券商從事結構型商品交易之所得屬於其他所得,按 10%稅率分離課稅", "D": "出售民國 100 年度購買之土地,獲得利益,屬於財產交易所得,按 20%稅率分離課稅"}, "answer": "C", "note": ""}, {"id": "tax-109-3", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 3, "question": "王先生單身,撫養 70 歲的母親。108 年度家庭所得如下:王先生每月底領取薪資 8 萬元,其依勞工退\n休金條例就每月薪資 6%自願提繳退休金;另外,當年度取得員工分紅配股 5,000 股,股票帳簿劃撥\n日的時價為每股 40 元。母親每月領取月退金 3 萬元,並領有身心障礙手冊。全年健保費 6 萬元,其\n餘家庭支出沒有保留憑證。請問王先生申報 109 年度綜合所得淨額為何?", "options": {"A": "902,400 元", "B": "640,000 元", "C": "582,400 元", "D": "362,400 元"}, "answer": "D", "note": ""}, {"id": "tax-109-4", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 4, "question": "依現行各類所得扣繳率標準規定,取得下列所得之扣繳規定,何者正確?", "options": {"A": "政府派駐國外工作人員所領政府發給之薪資按全月給付總額超過新臺幣 5 萬元部分,扣取 5%", "B": "非居住者持有公債、公司債或金融債券之利息,按給付額扣取 10%", "C": "告發或檢舉獎金非居住者按給付額扣取 20%,居住者扣取 10%", "D": "居住者及非居住者取得統一發票中獎獎金,每聯中獎獎金不超過新臺幣 5,000 元時,免予扣繳"}, "answer": "D", "note": ""}, {"id": "tax-109-5", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 5, "question": "依稅法相關規定,居住者 109 年度取得下列各類所得計入綜合所得總額之金額,何者錯誤?", "options": {"A": "個人出售境內上市櫃公司獲得證券交易所得 50 萬元,應計入總額 50 萬元", "B": "多層次傳銷事業個人參加人銷售商品或提供勞務予消費者,全年進貨累積金額達新臺幣 75,000 元,\n應計入總額 0 元", "C": "個人取得稿費 10 萬元,版稅 9 萬元,應計入總額 0.7 萬元", "D": "個人全年領取銀行利息所得 7 萬元,應計入總額 7 萬元"}, "answer": "A", "note": ""}, {"id": "tax-109-6", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 6, "question": "納稅義務人申報 108 年度綜合所得稅時,股利所得採分開計稅之居住者,依所得稅法規定,下列何\n種扣除額不得減除?1身心障礙特別扣除額 2幼兒學前特別扣除額 3長期照顧特別扣除額\n4教育學費特別扣除額 5儲蓄投資特別扣除額", "options": {"A": "12", "B": "23", "C": "45", "D": "35"}, "answer": "B", "note": ""}, {"id": "tax-109-7", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 7, "question": "王先生 109 年度薪資收入 300 萬元,因職業需要花費治裝費 10 萬元,進修費用 5 萬元,均取得合法\n憑證。試問為使所得稅負最低,王先生申報 109 年度薪資所得金額為何?", "options": {"A": "286 萬元", "B": "285 萬元", "C": "280 萬元", "D": "266 萬元"}, "answer": "C", "note": ""}, {"id": "tax-109-8", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 8, "question": "納稅義務人申報綜合所得稅時,計算下列何種所得不得減除必要之成本或費用?", "options": {"A": "每人稿費版稅超過 18 萬元之所得", "B": "個人參加人因下層直銷商向傳銷事業進貨達一定標準自該事業取得之業績獎金", "C": "醫生受僱於某公立醫院獲得之薪資收入", "D": "月領退休金 7 萬元,超過定額免稅部分"}, "answer": "D", "note": ""}, {"id": "tax-109-9", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 9, "question": "章君 108 年度申報綜合所得稅其綜合所得總額為 400 萬元,當年度直接對國內某私立學校捐贈 100 萬\n元,公立學校 50 萬元,又捐贈予某一個合法政黨 30 萬元,試問章君申報列舉扣除額之捐贈金額為若\n干元?", "options": {"A": "130 萬元", "B": "150 萬元", "C": "170 萬元", "D": "180 萬元"}, "answer": "B", "note": ""}, {"id": "tax-109-10", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 10, "question": "王先生 109 年度綜合所得稅申報採用標準扣除額,請問下列那些項目無法列入扣除額?1健保費 2儲蓄\n投資扣除額 3身心障礙扣除額 4就讀私立大學兒子的教育學費扣除額 5捐贈 6財產交易損失", "options": {"A": "123", "B": "456", "C": "15", "D": "26"}, "answer": "C", "note": ""}, {"id": "tax-109-11", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 11, "question": "下列何者非屬稅法規定之個人變動所得?", "options": {"A": "自力經營之林業所得", "B": "保險公司一次給予之保險死亡給付", "C": "受僱從事遠洋漁業,於每次出海後一次分配之報酬", "D": "因耕地出租人收回耕地,而依平均地權條例規定給予之補償"}, "answer": "B", "note": ""}, {"id": "tax-109-12", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 12, "question": "下列何項規定自 108 年度起開始實施?", "options": {"A": "未分配盈餘稅率加徵 5%之營利事業所得稅", "B": "股利及盈餘合計金額按 8.5%計算可抵減稅額", "C": "幼兒學前特別扣除額", "D": "長期照顧特別扣除額"}, "answer": "D", "note": ""}, {"id": "tax-109-13", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 13, "question": "依所得稅法規定,金融資產證券化條例發行之受益證券或資產基礎證券發放之利息所得,對於境內居\n住之個人及營利事業分別如何課稅?", "options": {"A": "個人應併入綜合所得總額,營利事業採分離課稅扣繳率 20%", "B": "個人採分離課稅扣繳率 10%,營利事業須併入營利事業所得額", "C": "個人及營利事業均採分離課稅扣繳率 10%", "D": "個人應併入綜合所得總額,營利事業須併入營利事業所得額"}, "answer": "B", "note": ""}, {"id": "tax-109-14", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 14, "question": "甲公司總機構在美國,經財政部依所得稅法第 25 條規定,核定按營業收入百分比計算所得額,108 年\n度在境內提供技術服務收入有 2.5 億元,則該公司當年度之營利事業所得額及應納稅額各為新臺幣若\n干元?", "options": {"A": "3,750 萬元、750 萬元", "B": "3,750 萬元、712.5 萬元", "C": "2,500 萬元、500 萬元", "D": "2,500 萬元、475 萬元"}, "answer": "A", "note": ""}, {"id": "tax-109-15", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 15, "question": "甲公司總機構設於臺北市,109 年 8 月 15 日發放股利予股東,下列有關不同類型股東,申報繳納所\n得稅方式,何者錯誤?", "options": {"A": "公司發放予境內居住者股東免予扣繳,仍應申報綜合所得稅", "B": "公司發放予非居住者股東應扣繳 21%,採就源扣繳不需申報綜合所得稅", "C": "公司發放予境內法人股東免予扣繳,境內法人應併入營利事業所得額", "D": "公司發放予境外法人股東應扣繳 21%,採就源扣繳不需申報營利事業所得稅"}, "answer": "C", "note": ""}, {"id": "tax-109-16", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 16, "question": "依所得稅法第 43 條之 4 規定,依外國法律設立之公司,下列何者為認定實際管理處所在境內之條件?\n1作成重大經營管理、財務管理及人事管理決策之處所在境內 2在境內擁有房地產 3在境內有實\n際執行主要經營活動 4財務報表製作或儲存處所在境內 5作成重大經營管理、財務管理及人事管\n理決策者為境內居住之個人", "options": {"A": "124", "B": "1234", "C": "2345", "D": "1345"}, "answer": "D", "note": ""}, {"id": "tax-109-17", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 17, "question": "甲公司 108 年度透過私立學校興學基金會指定對A財團法人私立學校捐贈新臺幣 250 萬元;另直接捐\n贈予B財團法人私立學校運動器材用品價值 50 萬元。若該公司當年度之營業毛利為 1,000 萬元,營\n業費用(含捐贈費用)800 萬元,無營業外收入及損失,請問甲公司申報 108 年度營利事業所得稅可\n認列之捐贈總額為新臺幣多少元?", "options": {"A": "909,090 元", "B": "100 萬元", "C": "140 萬元", "D": "150 萬元"}, "answer": "C", "note": ""}, {"id": "tax-109-18", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 18, "question": "假設甲公司逾期繳納補徵之營利事業所得稅,繳納截止日為 6 月 30 日(星期六),該公司於 7 月 6 日\n繳納,依稅法規定應如何處理?", "options": {"A": "按應納稅額加徵 10%滯報金,最低不得少於新臺幣 1,500 元,最高不得超過新臺幣 3 萬元", "B": "按當年度營利事業所得稅率計算金額加徵 20%怠報金,最低不得少於新臺幣 4,500 元,最高不得超\n過新臺幣 9 萬元", "C": "按滯納數額加徵 1%滯納金", "D": "按滯納數額加徵 1%滯納金,另按郵政儲金 1 年期定存利率按日加計利息"}, "answer": "C", "note": ""}, {"id": "tax-109-19", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 19, "question": "甲公司之會計年度採曆年制,106 年度營利事業所得稅於 107 年 12 月完成申報,申報虧損數額 300 萬\n元,依現行所得稅法規定,此筆申報虧損數額可從以後年度純益額中扣除的最後年限為何?", "options": {"A": "111 年度", "B": "116 年度", "C": "117 年度", "D": "不適用盈虧互抵"}, "answer": "D", "note": ""}, {"id": "tax-109-20", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 20, "question": "甲公司總機構設於我國境內,民國 107 年以 6,500 萬元購入房地產,民國 108 年以 6,800 萬元出售,\n計算土地增值稅之土地漲價總數額為 180 萬元,應納土地增值稅為 36 萬元,交易仲介費 136 萬元,\n無其他費用。依所得稅法規定,甲公司該筆交易應如何計入營利事業課稅所得額?", "options": {"A": "以零計入", "B": "虧損 16 萬元作為營利事業所得額減項", "C": "計入營利事業所得額 164 萬元", "D": "虧損 52 萬元作為營利事業所得額減項"}, "answer": "A", "note": ""}, {"id": "tax-109-21", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 21, "question": "依稅捐稽徵法,納稅義務人有溢繳稅額時,其適用退稅相關規定,下列敘述何者正確?", "options": {"A": "因稅捐稽徵機關適用法令錯誤,退稅年限沒有限制,且可加計利息退還", "B": "因納稅義務人自行適用法令錯誤,自繳納之日起 5 年內提出具體證明,可申請無息退還", "C": "因稅捐稽徵機關適用法令錯誤,退稅沒有年限限制,退稅金額無息退還", "D": "因納稅義務人自行適用法令錯誤,自繳納之日起 3 年內提出具體證明,加息退還"}, "answer": "A", "note": ""}, {"id": "tax-109-22", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 22, "question": "下列有關核課期間之敘述,依稅捐稽徵法規定何者錯誤?1在核課期間內,經另發現應徵之稅捐者,\n仍應依法補徵或並予處罰 2對已確定的租稅債權,政府向人民請求履行繳稅之期間 3如地價稅繳\n納期間為 11 月 1 日至 11 月 30 日,其核課期間為 12 月 1 日起算 5 年 4綜合所得稅已於 5 月 15 日\n誠實申報,其核課期間自 5 月 15 日起算 5 年 5公司營利事業所得稅於 5 月 30 日申報但故意逃漏稅\n捐者,其核課期間自 5 月 31 日起算 7 年", "options": {"A": "25", "B": "45", "C": "14", "D": "23"}, "answer": "A", "note": ""}, {"id": "tax-109-23", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 23, "question": "依稅捐稽徵法規定,在中華民國境內居住之個人欠繳稅款達一定金額將被限制出境,但已提供相當擔\n保者,應解除其限制。依同法規定,所稱相當擔保,包括下列何者?1黃金,按九折計算 2上市之\n有價證券,按九折計算 3上櫃之有價證券,按八折計算 4易於變價、無產權糾紛且能足額清償之\n土地 5銀行存款單摺,按存款本金加計利息計值", "options": {"A": "124", "B": "134", "C": "235", "D": "345"}, "answer": "B", "note": ""}, {"id": "tax-109-24", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 24, "question": "依稅捐稽徵法第 5 條規定,財政部依互惠原則與外國政府或國際組織商訂稅務用途資訊交換;如果有\n關機關、機構未依規定進行金融帳戶盡職審查或其他審查並提供締約他方之資訊,依稅捐稽徵法第 46\n條之 1 將由財政部或其授權之機關作何種處罰?", "options": {"A": "新臺幣 30 萬元以上 1 千萬元以下罰鍰", "B": "新臺幣 20 萬元以上 1 千萬元以下罰鍰", "C": "新臺幣 20 萬元以上 1 千萬元以下罰金", "D": "新臺幣 30 萬元以上 1 千萬元以下罰金"}, "answer": "B", "note": ""}, {"id": "tax-109-25", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 25, "question": "依據稅捐稽徵法第 48 條之 1,納稅義務人已向稅捐稽徵機關補報並補繳所漏稅款者,符合一定條件\n可以免除其相關之處罰,下列何者非屬該條文之相關規定?", "options": {"A": "屬未經檢舉之案件", "B": "屬未經稽徵機關或財政部指定之調查人員進行調查之案件", "C": "補繳之應納稅捐,應按繳納稅款期間屆滿之日,依郵政儲金匯業局之 1 年期定期存款利率按日加計利息", "D": "屬情節輕微,或漏稅在一定金額以下者"}, "answer": "D", "note": ""}, {"id": "tax-109-26", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 26, "question": "依稅捐稽徵法規定,下列敘述何者正確?", "options": {"A": "納稅義務人欠繳應納稅捐者,稽徵機關得直接函請內政部移民署限制該欠稅人出境", "B": "納稅義務人欠繳應納稅捐,但已提供相當財產擔保者,稽徵機關得免提供擔保,直接向法院聲請就\n欠稅人財產實施假扣押", "C": "營利事業行政救濟案件欠稅金額在新臺幣 200 萬元以上者,得由財政部函請內政部移民署限制負責\n人出境", "D": "營利事業欠繳應納稅捐者,稽徵機關得通知經濟部限制該營利事業減資或註銷之登記"}, "answer": "D", "note": ""}, {"id": "tax-109-27", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 27, "question": "依稅捐稽徵法規定,財政部得予外國政府或國際組織進行稅務用途資訊交換及提供其他稅務協助,但\n諦約他方有下列何種情形,不得與其進行資訊交換?", "options": {"A": "能夠提供同類對等資訊", "B": "請求資訊能夠提升雙方的公共利益", "C": "與我國無正式邦交國家", "D": "對取得之資訊無法保密"}, "answer": "D", "note": ""}, {"id": "tax-109-28", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 28, "question": "依現行所得稅法及所得基本稅額條例之規定,下列敘述何者正確?", "options": {"A": "個人取得受控外國公司(CFC)所得超過 100 萬元以上者,應就超過部分計入基本所得額", "B": "個人獲配股利所得選擇按 28%分開計稅者,股利所得不用計入基本所得額", "C": "營利事業出售證券交易所得免徵營利事業所得稅,但需計入基本所得額", "D": "個人出售證券交易損失得自綜合所得總額中扣除,亦可自基本所得額中扣除"}, "answer": "C", "note": ""}, {"id": "tax-109-29", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 29, "question": "下列何者不是稅捐稽徵法所稱,應由稅捐稽徵機關依稅籍底冊核定課徵之稅捐?", "options": {"A": "地價稅", "B": "房屋稅", "C": "使用牌照稅", "D": "營業事業所得稅"}, "answer": "D", "note": ""}, {"id": "tax-109-30", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 30, "question": "依所得基本稅額條例,居住者申報 108 年度海外所得之課稅規定,下列敘述何者正確?", "options": {"A": "海外財產交易損失可以在以後 3 年度之財產交易所得扣除", "B": "海外利息所得為 100 萬元不須申報", "C": "海外財產交易損失及所得均以實際成交價格及原始取得成本計算損益,並經稽徵機關核實認定者為限", "D": "大陸地區來源所得屬於海外所得的課徵範圍"}, "answer": "C", "note": ""}, {"id": "tax-109-31", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 31, "question": "甲公司於 109 年 10 月 16 日購置自用乘人小汽車 3,000,000 元,另加計進項稅額 150,000 元供董事長\n使用,按平均法依耐用年數 5 年提列折舊,估計殘值 525,000 元。請問 109 年度折舊金額之帳列數與\n申報數為何?", "options": {"A": "帳列數 123,750 元,申報數 98,750 元", "B": "帳列數 87,500 元,申報數 69,444 元", "C": "帳列數 87,500 元,申報數 65,833 元", "D": "帳列數 131,250 元,申報數 104,166 元"}, "answer": "D", "note": ""}, {"id": "tax-109-32", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 32, "question": "依所得稅法規定,營利事業申報下列那些費用、損失,帳簿憑證完整者,稽徵機關可以核實認定?\n1未超限之交際費 2本業以外之家庭支出 3支付員工薪資 4加徵之滯報金 5廠房的折舊\n費用 6投資損失但出資額未折減", "options": {"A": "135", "B": "246", "C": "356", "D": "145"}, "answer": "A", "note": ""}, {"id": "tax-109-33", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 33, "question": "甲公司 109 年 8 月 1 日銷售一部成本 2,100,000 元之汽車予宋先生,其現銷價格為 2,400,000 元,分期\n付款價格為 2,800,000 元,分 36 個月付款,每月初付款 50,000 元,該公司 109 年度以毛利百分比法\n申報所得稅應認列毛利為若干元?", "options": {"A": "31,250 元", "B": "62,500 元", "C": "300,000 元", "D": "600,000 元"}, "answer": "B", "note": ""}, {"id": "tax-109-34", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 34, "question": "依營利事業所得稅查核準則規定,109 年度營利事業薪資支出(費用)之認列,下列敘述何者錯誤?", "options": {"A": "獨資、合夥事業之資本主、執行業務合夥人及職工之薪資,可核實認列薪資費用", "B": "公司股東、董事或合夥人兼任經理或職員者,可核實認定其薪資支出", "C": "公司發行員工認股權憑證獎酬公司員工者,可核實認定為薪資費用", "D": "營利事業按月定額發給員工伙食代金 2,400 元,可視為員工薪資費用"}, "answer": "D", "note": ""}, {"id": "tax-109-35", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 35, "question": "營利事業費用認列以已實現為原則,依營利事業所得稅查核準則第 63 條,下列何者未實現之費用及\n損失,稽徵機關得予認定?", "options": {"A": "存貨跌價損失、備抵呆帳", "B": "產品售後服務保證負債、勞工退休準備金", "C": "投資損失準備、備抵呆帳", "D": "職工退休基金、長期投資之有價證券跌價損失"}, "answer": "A", "note": ""}, {"id": "tax-109-36", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 36, "question": "依加值型及非加值型營業稅法規定,有關營業稅免稅規定之敘述,下列何者正確?", "options": {"A": "適用免稅貨物或勞務之營業人,得向財政部申請放棄適用免稅,5 年內不得變更", "B": "金條、金塊、金片、金幣於進口及境內銷售均免徵營業稅", "C": "營業人出售之土地及房屋均免徵營業稅", "D": "肥料及飼料進口及境內銷售均免徵營業稅"}, "answer": "B", "note": ""}, {"id": "tax-109-37", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 37, "question": "依加值型及非加值型營業稅法規定,下列敘述何者正確?", "options": {"A": "在我國有固定營業場所之外國營利事業,銷售貨物予境內營業人,營業稅免徵", "B": "在我國有固定營業場所之外國營利事業,銷售電子勞務予境內自然人,營業稅納稅義務人為買受人", "C": "在我國無固定營業場所之外國營利事業,銷售勞務予我國某私立學校研究使用,營業稅免徵", "D": "個人將免稅農業用油轉賣予非農業使用之營業人,營業稅免徵"}, "answer": "C", "note": ""}, {"id": "tax-109-38", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 38, "question": "依加值型及非加值型營業稅法規定,營業人下列何種溢付稅款不得申請退還,應留抵應納營業稅?\n1因合併或解散申請註銷登記者,其溢付之營業稅 2因銷售適用免稅貨物而溢付之營業稅 3因取\n得固定資產而溢付之營業稅 4銷售與保稅區營業人供營運之貨物或勞務而溢付之營業稅 5因境\n內銷售房屋而溢付之營業稅", "options": {"A": "25", "B": "12", "C": "34", "D": "15"}, "answer": "A", "note": ""}, {"id": "tax-109-39", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 39, "question": "甲公司 109 年 7、8 月的進銷交易如下:內銷銷貨定價 8,400,000 元,外銷銷貨 5,000,000 元,進貨\n12,600,000(含稅),購置筆電捐贈財團法人設立之孤兒院 31,500 元(含稅),租用大型汽車載運員工\n上下班支付之租金 210,000 元(含稅),支付汽車油單 40,000 元(未含稅),進口應稅貨物 50,000 元\n(未含稅)。試計算甲公司當期營業稅額為何?", "options": {"A": "留抵稅額 213,500 元", "B": "申請退稅 214,500 元", "C": "留抵稅額 212,500 元", "D": "申請退稅 216,000 元"}, "answer": "B", "note": ""}, {"id": "tax-109-40", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 40, "question": "境外電商營業人銷售電子勞務予境內自然人之年銷售額逾新臺幣多少元,應自行或委託報稅之代理人\n向稽徵機關辦理稅籍登記?", "options": {"A": "24 萬元", "B": "48 萬元", "C": "96 萬元", "D": "120 萬元"}, "answer": "B", "note": ""}, {"id": "tax-109-41", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 41, "question": "採直接扣抵法之兼營營業人進口水果 100 萬元,在國內銷售水果 80 萬元,依加值型及非加值型營業\n稅法有關營業稅之計算及徵收,下列何者正確?", "options": {"A": "進口需繳納 5%營業稅,由海關代徵;在國內銷售應繳 5%,其進口之進項稅額可以扣抵,由國稅局\n徵收", "B": "進口需繳納 5%營業稅,由海關代徵;在國內銷售免徵營業稅,其進口之進項稅額不可以扣抵", "C": "進口及在國內銷售均免徵營業稅,仍須向國稅局申報營業稅", "D": "進口需繳納 5%營業稅,在國內銷售免徵營業稅;其進口之進項稅額可以扣抵,均由國稅局徵收"}, "answer": "B", "note": ""}, {"id": "tax-109-42", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 42, "question": "各行業關於營業稅額計算方式及稅率規定,依加值型及非加值型營業稅法,下列敘述何者錯誤?", "options": {"A": "銀行業按特種稅額計算,經營專屬本業之銷售額,其稅率為 5%", "B": "百貨業按一般稅額計算,其稅率為 5%", "C": "有陪侍服務之咖啡廳,按特種稅額計算,其稅率為 15%", "D": "便利超商,按一般稅額計算,其稅率為 5%"}, "answer": "C", "note": ""}, {"id": "tax-109-43", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 43, "question": "依統一發票使用辦法規定,下列敘述何者正確?1營業人開立不實統一發票,主管稽徵機關應停止其購\n買統一發票 2營業人以貨物與他人交換貨物者,應於換出時,開立統一發票 3營業人滯欠營業稅未\n繳清,主管稽徵機關應停止其購買統一發票 4營業人發行商品禮券,禮券上已載明憑券兌付一定數量\n之貨物者,應於兌換貨物時開立統一發票 5保稅區營業人銷售予課稅區營業人未輸往課稅區而直接出\n口之貨物,免開立統一發票", "options": {"A": "125", "B": "234", "C": "1234", "D": "135"}, "answer": "A", "note": ""}, {"id": "tax-109-44", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 44, "question": "下列何者屬於國稅且採累進稅率之稅目?1綜合所得稅 2遺產稅及贈與稅 3土地增值稅\n4非加值型營業稅", "options": {"A": "12", "B": "134", "C": "123", "D": "13"}, "answer": "A", "note": ""}, {"id": "tax-109-45", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 45, "question": "依現行加值型及非加值型營業稅法規定,下列那些項目的進項稅額得扣抵銷項稅額?1購進貨物捐贈\n政府 2購買主、副食品供應員工伙食 3交際應酬費用 4進貨取得合法統一發票 5購進貨物用\n以酬勞員工 6支付銀行利息費用", "options": {"A": "14", "B": "2356", "C": "456", "D": "246"}, "answer": "A", "note": ""}, {"id": "tax-109-46", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 46, "question": "依遺產及贈與稅法第 46 條規定,納稅義務人有故意以詐欺或其他不正當方法,逃漏遺產稅或贈與稅\n者,除依繼承或贈與發生年度稅率重行核計補徵外,並應處何種處罰?", "options": {"A": "所漏稅額 2 倍以下之罰鍰", "B": "所漏稅額 1 倍至 3 倍之罰鍰", "C": "所漏稅額 1 倍至 3 倍之罰鍰,並處 1 年以上、5 年以下之有期徒刑", "D": "所漏稅額 2 倍以下之罰鍰,並處 5 年以下之有期徒刑"}, "answer": "B", "note": ""}, {"id": "tax-109-47", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 47, "question": "下列有關遺產及贈與稅報繳之敘述,依遺產及贈與稅法規定,何者錯誤?", "options": {"A": "遺產稅之申報期限為死亡之日起 6 個月內", "B": "贈與稅之申報期限為超過免稅額之贈與行為發生後 30 日內", "C": "被繼承人死亡前 3 年贈與其配偶之財產,須併入遺產總額", "D": "贈與稅之應納稅額在 30 萬元以上,確有困難,無法一次繳納現金者,得申請分 18 期以內繳納"}, "answer": "C", "note": ""}, {"id": "tax-109-48", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 48, "question": "依遺產及贈與稅法規定,下列何項目不計入遺產總額?", "options": {"A": "遺囑執行人對政黨團體的政治獻金捐贈", "B": "向主管機關聲明登記之歷史文物", "C": "被繼承人死亡前 6 年繼承尚未繳清稅負之遺產", "D": "執行遺囑之直接必要費用"}, "answer": "B", "note": ""}, {"id": "tax-109-49", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 49, "question": "下列何種情況不是遺產及贈與稅法規定之視同贈與?", "options": {"A": "在請求權時效內無償免除債務,其免除之債務", "B": "以相當之代價,讓與之財產", "C": "以自己之資金無償為他人購置財產者,其資金", "D": "二等親以內親屬間財產之買賣,無法提出已支付價款之證明"}, "answer": "B", "note": ""}, {"id": "tax-109-50", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 50, "question": "王君於 108 年 9 月 1 日死亡,遺有配偶與已成年子女 2 人,其名下財產如下:房屋一棟市價 5,000 萬元\n(土地公告現值 1,800 萬元,房屋評定標準價格 1,200 萬元),國內上市甲公司股票 10 萬股,當日股票收\n盤價每股 100 元。試問遺產稅應納稅額為多少?", "options": {"A": "2,084,000 元", "B": "2,623,800 元", "C": "4,168,000 元", "D": "5,247,600 元"}, "answer": "A", "note": ""}, {"id": "accounting-110-1", "year": "110", "subject": "accounting", "subjectName": "會計學概要", "number": 1, "question": "0.970 0.961 0.943 0.925 1 1.000 1.000 1.000 1.000\n5 4.579 4.451 4.212 3.992 5 5.309 5.416 5.637 5.866\n10 8.530 8.110 7.360 6.710 10 11.463 12.006 13.180 14.486\n複利現值因子 複利終值因子\n期數 3% 4% 6% 8% 期數 3% 4% 6% 8%\n1 0.970 0.961 0.943 0.925 1 1.030 1.040 1.060 1.080\n5 0.862 0.821 0.747 0.680 5 1.159 1.216 1.338 1.469\n10 0.744 0.675 0.558 0.463 10 1.343 1.480 1.790 2.158\n四、以下是丁公司 2020 及 2021 年財務報表資訊:\n丁公司\n財務狀況表\n2020及2021年12月31日\n資產 2021 2020\n機器設備 $60,000 $ 78,000\n累計折舊-機器設備 (29,000) (24,000)\n存貨 30,000 20,000\n應收帳款 33,000 14,000\n現金 37,000 20,000\n資產總額 $131,000 $108,000\n負債及股東權益\n普通股股本 $ 18,000 $ 14,000\n保留盈餘 50,000 38,000\n應付公司債 27,000 33,000\n應付帳款 29,000 15,000\n應付所得稅 7,000 8,000\n負債及股東權益總額 $131,000 $108,000\n丁公司\n綜合損益表\n2021年度\n銷貨收入 $242,000\n銷貨成本 175,000\n銷貨毛利 67,000\n營業費用 24,000\n營業利益 43,000\n利息費用 3,000\n稅前淨利 40,000\n所得稅費用 8,000\n淨利 $32,000\n其他補充資料如下:\nA. 2021 年折舊費用為$13,300。\nB. 2021 年宣告並發放現金股利$20,000。\nC. 2021 年以現金$9,700 出售一台機器設備。該設備取得成本為$18,000,\n該機器設備於處分日的累計折舊為$8,300。\n試作:\n以間接法編製丁公司 2021 年現金流量表。(20 分)\n計算丁公司2021 年的自由現金流量,須列計算過程否則不予計分。(4 分)\n乙、測驗題部分:(50 分) 代號:2602\n本測驗試題為單一選擇題,請選出一個正確或最適當的答案,複選作答者,該題不予計分。\n共20題,每題2.5分,須用2B鉛筆在試卡上依題號清楚劃記,於本試題或申論試卷上作答者,不予計分。\n1 甲、乙及丙三人成立合夥商店,三人商議約定盈餘分配條件包含:1甲、乙、丙之設算薪資\n分別為$30,000、$25,000 及$34,000 2剩餘損益之分配比例為,甲:乙:丙 = 3:3:2。若\nX1 年之盈餘分配結果為甲合夥人共分配得$54,000,則合夥商店在 X1 年之淨利為多少?", "options": {"A": "$64,000", "B": "$89,000", "C": "$144,000", "D": "$153,000"}, "answer": "D", "note": ""}, {"id": "accounting-110-2", "year": "110", "subject": "accounting", "subjectName": "會計學概要", "number": 2, "question": "下列何者正確?", "options": {"A": "甲公司因在 X2 年發現 X1 年之薪資費用少記$5,000,故應作更正分錄,借記薪資費用$5,000", "B": "企業只需利用當期調整後之試算表即可編製現金流量表", "C": "期末調整分錄將同時影響資產負債表項目與綜合損益表項目", "D": "經由結帳程序,企業才能報告正確之綜合損益表"}, "answer": "C", "note": ""}, {"id": "accounting-110-3", "year": "110", "subject": "accounting", "subjectName": "會計學概要", "number": 3, "question": "甲養雞場之經營業務為自市場購入小雞飼養,待養大後再將之運至市場販售。X1 年 3 月,甲\n養雞場自市場以每隻$20 價格買回 500 隻小雞,並支付市場到雞場間的運費$500。估計若當\n天處分該批小雞,則除需支付養雞場至市場的運費$600 外,尚需支付佣金$800。若甲養雞場\n採公允價值法,試問甲養雞場購買該批小雞之入帳金額為多少?", "options": {"A": "$8,100", "B": "$8,600", "C": "$9,500", "D": "$10,000"}, "answer": "B", "note": ""}, {"id": "accounting-110-4", "year": "110", "subject": "accounting", "subjectName": "會計學概要", "number": 4, "question": "甲公司 X1 年期初存貨之成本與零售價分別為$4,150、$5,000,X1 年購入商品之成本與零售\n價分別為$57,600 與$90,000。甲公司採零售價法估計 X1 年期末存貨之成本為$9,750,試問甲\n公司 X1 年之銷貨淨額為多少?", "options": {"A": "$15,000", "B": "$33,800", "C": "$52,000", "D": "$80,000"}, "answer": "D", "note": ""}, {"id": "accounting-110-5", "year": "110", "subject": "accounting", "subjectName": "會計學概要", "number": 5, "question": "甲公司於 4 月 1 日取得乙客戶之票據一紙,面額$36,000,附息 5%,4 個月到期。甲公司於 5\n月 1 日持該票據向銀行貼現,貼現率為 8%。甲公司可自銀行取得多少現金?", "options": {"A": "$35,268", "B": "$35,280", "C": "$35,868", "D": "$35,880"}, "answer": "C", "note": ""}, {"id": "accounting-110-6", "year": "110", "subject": "accounting", "subjectName": "會計學概要", "number": 6, "question": "請閱讀下方原卷的選擇題第 6 題，再選 A、B、C 或 D。", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "C", "note": "", "paper": "110180_1201_會計學概要.pdf", "images": ["pages/110/1201-4.jpg", "pages/110/1201-5.jpg"]}, {"id": "accounting-110-7", "year": "110", "subject": "accounting", "subjectName": "會計學概要", "number": 7, "question": "下列何者正確?", "options": {"A": "企業發放現金股利與發放股票股利,對股東權益之影響均相同", "B": "公司將既有之庫藏股予以註銷,會使股東權益增加", "C": "其他條件不變下,可贖回特別股之價格較不可贖回特別股之價格低", "D": "公司依公司法規定,將當期部分盈餘指撥為法定盈餘公積,此將降低保留盈餘"}, "answer": "C", "note": ""}, {"id": "accounting-110-8", "year": "110", "subject": "accounting", "subjectName": "會計學概要", "number": 8, "question": "甲公司於 X1 年底向乙銀行商借 5 年期之借款$500,000,利率 8%,並與銀行約定自 X2 年起,\n每年年底支付金額$125,000 以支付利息及償還部分本金。試問甲公司 X2 年底資產負債表中,\n有關該借款應揭露多少非流動負債?", "options": {"A": "$91,800", "B": "$300,000", "C": "$323,200", "D": "$415,000"}, "answer": "C", "note": ""}, {"id": "accounting-110-9", "year": "110", "subject": "accounting", "subjectName": "會計學概要", "number": 9, "question": "甲公司在 X1 年底之股東權益如下:\n股東權益\n普通股,面值$10,已發行且流通在外 80,000 股 $800,000\n資本公積—普通股溢價 300,000\n保留盈餘 673,465\nX2 年度股東權益相關資料如下:\n4/1 現金增資發行 10,000 股,每股市價$16。\n7/1 發放 10%股票股利及現金股利$150,000。\n10/1 以每股市價$12 買回庫藏股 3,000 股。\n若甲公司 X2 年之淨利為$233,975,則 X2 年之每股盈餘及 X2 年底之每股帳面價值各為多少?", "options": {"A": "每股盈餘$2.56、每股帳面價值$21.02", "B": "每股盈餘$2.44、每股帳面價值$20.75", "C": "每股盈餘$2.45、每股帳面價值$20.64", "D": "每股盈餘$2.56、每股帳面價值$20.75"}, "answer": "C", "note": ""}, {"id": "accounting-110-10", "year": "110", "subject": "accounting", "subjectName": "會計學概要", "number": 10, "question": "甲公司在 X1 年 4 月 1 日以$85,000 購入設備,預估使用年限 10 年,殘值$3,000,使用直線法\n提列折舊。在 X7 年年初評估該設備尚可使用 5 年,估計殘值為$2,500。該設備在 X7 年底之\n帳面價值應為多少?", "options": {"A": "$29,140", "B": "$30,780", "C": "$33,000", "D": "$54,220"}, "answer": "B", "note": ""}, {"id": "accounting-110-11", "year": "110", "subject": "accounting", "subjectName": "會計學概要", "number": 11, "question": "甲公司 X1 年初持有之存貨包含:直接原料、在製品及製成品,其成本分別為$3,000、$4,800、\n$28,000。X1 年底,直接原料、在製品及製成品存貨之餘額分別為$4,500、$2,400、$30,000。\n甲公司 X1 年度共購買直接原料$58,000,並投入直接人工$96,000 及製造費用$85,000。甲公\n司 X1 年度銷貨成本為多少?", "options": {"A": "$235,500", "B": "$237,500", "C": "$237,900", "D": "$239,900"}, "answer": "C", "note": ""}, {"id": "accounting-110-12", "year": "110", "subject": "accounting", "subjectName": "會計學概要", "number": 12, "question": "X1 年 1 月 1 日,甲公司發行面額$3,000,000、5 年期、年利率 9%的公司債,該公司債於每年\n1 月 1 日及 7 月 1 日支付利息,發行時市場利率為 8%。甲公司採用有效利率法攤銷公司債溢\n折價。X3 年 1 月 1 日甲公司以 102 之收回價格提前收回面額$1,000,000 之公司債。試問 X3\n年 7 月 1 日支付利息後帳面價值金額?(折現率四捨五入至小數點後第五位)", "options": {"A": "2,044,510", "B": "2,036,290", "C": "2,078,619", "D": "2,052,413"}, "answer": "A", "note": ""}, {"id": "accounting-110-13", "year": "110", "subject": "accounting", "subjectName": "會計學概要", "number": 13, "question": "乙公司 X0 年 3 月 30 日撥補零用金,當日零用金保管箱餘現金$1,655,其傳票上的分錄中出\n現「借:現金短溢$325」,此外請款憑證包含:郵資$3,000、運費$8,500、雜支$1,885 以及交\n通費$2,635。試求當初設置零用金之額度為何?", "options": {"A": "$12,000", "B": "$14,230", "C": "$17,350", "D": "$18,000"}, "answer": "D", "note": ""}, {"id": "accounting-110-14", "year": "110", "subject": "accounting", "subjectName": "會計學概要", "number": 14, "question": "丙公司下列交易屬於營業活動之現金流量者有幾項:\n1支付所得稅款 2發行普通股以取得土地\n3可轉換公司債轉換為普通股 4提列攤銷費用\n5以面額發行新股 6取得備供出租資產之現金流出\n7賒購存貨 8持有交易目的之放款\n9以現金償付應付帳款 10出售庫藏股票", "options": {"A": "3 項", "B": "5 項", "C": "6 項", "D": "8 項"}, "answer": "C", "note": ""}, {"id": "accounting-110-15", "year": "110", "subject": "accounting", "subjectName": "會計學概要", "number": 15, "question": "丁公司之會計處理採用應計基礎。結帳後,X7 年度之淨利為$200,000。經會計師進一步分析,\n發現下列事件:\n(1) 丁公司於 X7 年 11 月 1 日時提供甲公司$30,000 之服務,並收取甲公司所開立 10%、3 個\n月的票據$30,000,但期末遺漏調整。\n(2) 丁公司之前購買產物保險時皆直接作為費用入帳,其每年底尚未消耗之保險金額如下:X6\n年 12 月 31 日$20,000、X7 年 12 月 31 日$17,000。若丁公司已結帳,此二事件導致丁公司\n淨利係:", "options": {"A": "高估$2,500", "B": "低估$2,500", "C": "高估$17,500", "D": "低估$17,500"}, "answer": "A", "note": ""}, {"id": "accounting-110-16", "year": "110", "subject": "accounting", "subjectName": "會計學概要", "number": 16, "question": "丙公司在購入後隔年將耐用 10 年設備之折舊方法,由直線法改為年數合計法,相較於更改\n前,對利息保障倍數的影響為:", "options": {"A": "增加", "B": "減少", "C": "無影響", "D": "不一定"}, "answer": "B", "note": ""}, {"id": "accounting-110-17", "year": "110", "subject": "accounting", "subjectName": "會計學概要", "number": 17, "question": "沖銷壞帳對速動比率的影響為:", "options": {"A": "導致比率增加", "B": "導致比率減少", "C": "無影響", "D": "不一定"}, "answer": "C", "note": ""}, {"id": "accounting-110-18", "year": "110", "subject": "accounting", "subjectName": "會計學概要", "number": 18, "question": "假設乙公司期初存貨比期末存貨多$215,000,本期銷貨成本為$1,400,000,本期應付帳款增加\n數為$565,000,在進貨皆為賒購的前提下,則本期償還應付帳款金額為:", "options": {"A": "$430,000", "B": "$620,000", "C": "$727,500", "D": "$835,000"}, "answer": "B", "note": ""}, {"id": "accounting-110-19", "year": "110", "subject": "accounting", "subjectName": "會計學概要", "number": 19, "question": "臺北市立動物園今年誕生新萌主貘花豆,吸引了許多喜愛馬來貘的動物認養人。對於臺北市\n立動物園而言,新生貘貘花豆在會計上係應分類為:", "options": {"A": "生物資產", "B": "流動資產", "C": "不動產、廠房及設備", "D": "其他資產"}, "answer": "C", "note": ""}, {"id": "accounting-110-20", "year": "110", "subject": "accounting", "subjectName": "會計學概要", "number": 20, "question": "會計資訊品質中,最能夠提高資訊使用者決策品質者為:", "options": {"A": "攸關性與忠實表述", "B": "可比性與可了解性", "C": "可驗證性與可了解性", "D": "可比性與及時性"}, "answer": "A", "note": ""}, {"id": "bookkeeping-110-1", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 1, "question": "依記帳士法第 27 條規定的記帳士懲戒處分,其中有關停止執行業務處分的期限為何?又受停止執行業務\n處分累計滿多少年,應予除名?", "options": {"A": "2 至 6 個月;5 年", "B": "2 個月以上,2 年以下;5 年", "C": "2 至 6 個月,3 年", "D": "2 個月以上,2 年以下;6 年"}, "answer": "B", "note": ""}, {"id": "bookkeeping-110-2", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 2, "question": "今年 25 歲的甲於大學畢業後,並未取得記帳士資格,也未依其他法律取得執行報稅業務資格,即擅自執\n行委任報稅及稅務諮詢等業務,請問依記帳士法第 34 條規定,應給予何種處罰?", "options": {"A": "初犯者處新臺幣二萬元以上十萬元以下罰鍰", "B": "初犯者處新臺幣三萬元以上十五萬元以下罰鍰", "C": "初犯者處新臺幣二萬元以上十萬元以下罰金", "D": "初犯者處新臺幣三萬元以上十五萬元以下罰金"}, "answer": "B", "note": ""}, {"id": "bookkeeping-110-3", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 3, "question": "依記帳士法規定,下列何者非為記帳士得執行之業務?", "options": {"A": "受委任辦理各項稅捐稽徵案件之申報", "B": "受理稅務諮詢事項", "C": "受理稅務查核簽證事項", "D": "受委任申請稅務復查事項"}, "answer": "C", "note": ""}, {"id": "bookkeeping-110-4", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 4, "question": "張三於 109 年考取記帳士並取得記帳士證書,106 年以前任職財政部臺北國稅局,108 年調任財政部北區\n國稅局新竹分局,109 年調任財政部中區國稅局臺中分局,110 年轉任彰化縣地方稅務局,在各稅捐機關\n任職期間皆擔任稅務員,於 110 年 12 月 31 日離職,並於 111 年 1 月 1 日起任記帳士,自其離職之日起 3\n年內,不得於何縣、市區域內執行記帳士職務?", "options": {"A": "彰化縣、臺中市、新竹市、臺北市", "B": "彰化縣、臺中市、新竹市", "C": "彰化縣、臺中市", "D": "彰化縣"}, "answer": "D", "note": ""}, {"id": "bookkeeping-110-5", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 5, "question": "吳記帳士於臺中市設立記帳士事務所,登錄執行業務區域為臺中市、彰化縣、苗栗縣、南投縣,有關於吳\n記帳士加入記帳士公會事宜,下列敘述何者正確?", "options": {"A": "必須加入登錄執行業務區域各縣、市記帳士公會及全國聯合會", "B": "必須加入登記開業之臺中市記帳士公會,但跨區執業也須加入記帳士公會全國聯合會", "C": "必須加入登記開業之臺中市記帳士公會,但在彰化縣、苗栗縣、南投縣須設立分所", "D": "必須加入登記開業之臺中市記帳士公會,免設分事務所"}, "answer": "D", "note": ""}, {"id": "bookkeeping-110-6", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 6, "question": "公營事業會計事務之處理,應否適用商業會計法之敘述,下列何者正確?", "options": {"A": "政府持有股份 100%之公營事業者,全部不適用", "B": "全部適用", "C": "全部不適用", "D": "其他法律另有規定者,優先適用其他法律,未規定者,適用商業會計法"}, "answer": "D", "note": ""}, {"id": "bookkeeping-110-7", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 7, "question": "日本 A 公司於臺中市設立分公司,其營業所用資金為新臺幣 5 千萬元,請問該分公司登記之受理機關與商\n業會計事務之管理機關為何?", "options": {"A": "皆為臺中市政府", "B": "分公司登記:臺中市政府;商業會計事務:財政部中區國稅局", "C": "分公司登記:經濟部商業司;商業會計事務:財政部中區國稅局", "D": "皆為經濟部商業司"}, "answer": "D", "note": ""}, {"id": "bookkeeping-110-8", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 8, "question": "崇德公司 110 年 9 月以 200 萬元購進商品一批,另以 110 萬元售予個人王君一批商品,請問崇德公司該二\n商品交易之收支,依商業會計法第 9 條規定,下列敘述何者正確?", "options": {"A": "支付貨款及收取銷售額皆不能使用現金", "B": "支付貨款及收取銷售額都必須採用核定的收支工具", "C": "支付貨款必須採用核定的支付工具,收取銷售額可收取現金", "D": "支付貨款可以現金支付,收取銷售額必須採用核定的支付工具"}, "answer": "C", "note": ""}, {"id": "bookkeeping-110-9", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 9, "question": "傳票上登載之會計項目,下列敘述何者正確?", "options": {"A": "收入傳票:貸方會計項目,支出傳票:借方會計項目", "B": "收入傳票:借方會計項目,支出傳票:貸方會計項目", "C": "收入傳票及支出傳票皆無借方、貸方會計項目", "D": "收入傳票及支出傳票皆有借方、貸方會計項目"}, "answer": "A", "note": ""}, {"id": "bookkeeping-110-10", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 10, "question": "依商業會計法規定,代表商業之負責人、經理人、主辦及經辦會計人員,會被處新臺幣 6 萬元以上 30 萬\n元以下罰鍰之項目有那些:1未依規定設置會計帳簿 2違反商業會計法第 24 條規定,毀損會計帳簿頁\n數 3未依規定期限保存會計帳簿、報表或憑證 4未依規定如期辦理決算 5未依規定簽名或蓋章", "options": {"A": "1235", "B": "1345", "C": "1234", "D": "2345"}, "answer": "C", "note": ""}, {"id": "bookkeeping-110-11", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 11, "question": "依商業會計法第 26 條規定,「股東往來」性質之交易,關於商業帳簿的記載,下列敘述何者正確:1屬財\n產帳戶 2屬人名帳戶 3應載明股東真實姓名 4應載明股東居所列於分戶帳 5應載明股東住所列\n於分戶帳 6應載明股東持股比例於分戶帳", "options": {"A": "134", "B": "2356", "C": "2346", "D": "235"}, "answer": "D", "note": ""}, {"id": "bookkeeping-110-12", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 12, "question": "甲股份有限公司之商業會計事務委任張記帳士處理,因故未編製 109 會計年度決算報表,依商業會計法規\n定,與此事務有關之下列何者,應處新臺幣 3 萬元以上 15 萬元以下罰鍰:1董事長 2董事 3監察人\n4總經理 5張記帳士 6經辦會計 7會計長", "options": {"A": "13457", "B": "14567", "C": "24567", "D": "12467"}, "answer": "B", "note": ""}, {"id": "bookkeeping-110-13", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 13, "question": "水湳建設公司持有以下四筆土地:甲地為建築中備售房屋地基、乙地為目前總公司辦公大樓地基、丙地出\n租並伺機出售、丁地為桃園分公司預定地基,目前閒置未作任何使用,依商業會計法規定,該四筆土地係\n屬何種資產?", "options": {"A": "甲地:流動資產-存貨、乙地:不動產、廠房及設備-土地、丙地:投資性不動產、丁地:其他非流動資產", "B": "甲地:流動資產-存貨、乙地及丁地:不動產、廠房及設備-土地、丙地:投資性不動產", "C": "甲地、乙地及丁地:不動產、廠房及設備-土地、丙地:投資性不動產", "D": "甲地及丙地:流動資產-存貨、乙地及丁地:不動產、廠房及設備-土地"}, "answer": "A", "note": ""}, {"id": "bookkeeping-110-14", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 14, "question": "有關商業主辦會計人員之任免、委託記帳士處理商業會計事務之程序,應否依商業會計法第 5 條規定程序\n處理,下列敘述何者正確?", "options": {"A": "全部商業組織皆須依規定處理", "B": "僅公司組織須依規定處理", "C": "僅股份有限公司組織須依規定處理", "D": "僅獨資、合夥組織須依規定處理"}, "answer": "B", "note": ""}, {"id": "bookkeeping-110-15", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 15, "question": "大鵬電子公司擁有甲、乙兩棟辦公大樓,甲棟供營業使用,乙棟供出租賺取租金,此兩棟大樓可否辦理資\n產重估、認列減損損失?", "options": {"A": "甲、乙兩棟皆可辦理資產重估、認列減損損失", "B": "甲、乙兩棟皆可辦理資產重估、但皆不能認列減損損失", "C": "甲棟可辦理資產重估、認列減損損失,乙棟不能辦理資產重估、但可認列減損損失", "D": "甲、乙兩棟皆不能辦理資產重估、但皆可認列減損損失"}, "answer": "C", "note": ""}, {"id": "bookkeeping-110-16", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 16, "question": "臺北公司 109 年度決算程序辦理於 110 年 4 月 30 日終了,除應永久保存或有關未結會計事項者外,各項\n會計憑證、會計帳簿及財務報表,至少應保存至何時為止?", "options": {"A": "皆至 115 年 4 月 30 日止", "B": "皆至 120 年 4 月 30 日止", "C": "會計憑證至 115 年 4 月 30 日止;會計帳簿及財務報表至 120 年 4 月 30 日止", "D": "會計憑證至 120 年 4 月 30 日止;會計帳簿及財務報表至 115 年 4 月 30 日止"}, "answer": "C", "note": ""}, {"id": "bookkeeping-110-17", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 17, "question": "臺中公司發行甲、乙兩種公司債,甲公司債採溢價發行,乙公司債採折價發行,並按有效利息法攤銷溢折\n價,下列敘述何者正確?", "options": {"A": "甲應付公司債之溢價,列為應付公司債之減項,溢價攤銷作為利息費用調整加項", "B": "乙應付公司債之折價,列為應付公司債之加項,折價攤銷作為利息費用調整減項", "C": "甲應付公司債之溢價,列為應付公司債之加項,溢價攤銷作為利息費用調整減項", "D": "乙應付公司債之折價,列為應付公司債之加項,折價攤銷作為利息費用調整加項"}, "answer": "C", "note": ""}, {"id": "bookkeeping-110-18", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 18, "question": "依商業會計法第 5 條第 2 項之規定,關於公司組織主辦會計之任免,除章程有較高規定外,下列敘述何者\n正確?", "options": {"A": "在有限公司,應有全體股東過半數之同意", "B": "在股份有限公司,應有董事會以董事過半數之出席,及出席董事過三分之二之同意", "C": "在無限公司,應有全體股東二分之一同意", "D": "在兩合公司,應有全體股東過二分之一同意"}, "answer": "A", "note": ""}, {"id": "bookkeeping-110-19", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 19, "question": "適用商業會計法的主體有那些?1公司 2非小規模之獨資、合夥 3小規模之獨資、合夥 4信用合作\n社 5私立學校", "options": {"A": "235", "B": "1234", "C": "124", "D": "125"}, "answer": "C", "note": ""}, {"id": "bookkeeping-110-20", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 20, "question": "依商業會計法第 69 條規定,下列何者有義務備置決算報表於本機構?", "options": {"A": "主辦會計", "B": "監察人", "C": "代表商業之負責人", "D": "經理人"}, "answer": "C", "note": ""}, {"id": "bookkeeping-110-21", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 21, "question": "依商業會計法規定,決算報表應由何者簽名蓋章?1代表商業負責人 2經理人 3主辦會計人員 4經\n辦會計人員", "options": {"A": "4", "B": "124", "C": "123", "D": "134"}, "answer": "C", "note": ""}, {"id": "bookkeeping-110-22", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 22, "question": "依商業會計法規定,決算辦理完竣與決算程序終了之差異為何?", "options": {"A": "兩者並無不同", "B": "決算辦理完竣指決算報表提請股東常會承認或股東或合夥人同意後;而決算程序終了係指會計部門編妥\n決算報表", "C": "決算辦理完竣指會計部門編妥決算報表;而決算程序終了係指決算報表提請股東常會承認或股東或合夥\n人同意後", "D": "決算辦理完竣指會計部門編妥決算報表;而決算程序終了係指決算報表提請董事會或董事同意後"}, "answer": "C", "note": ""}, {"id": "bookkeeping-110-23", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 23, "question": "依商業會計處理準則第 9 條規定,會計帳簿之記載方式,下列敘述何者正確?", "options": {"A": "在同一會計年度內應連續記載,除已用盡外不得更換新帳簿", "B": "跨年度連續記載,除已用盡外不得更換新帳簿", "C": "跨越會計年度內應連續記載,但需要時,若舊帳簿未用盡,仍得更換新帳簿", "D": "在同一會計年度內應連續記載,但需要時,若舊帳簿未用盡,仍得更換新帳簿"}, "answer": "A", "note": ""}, {"id": "bookkeeping-110-24", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 24, "question": "彰化股份有限公司 109 年度財務報表於 110 年 3 月 1 日經股東會通過,該公司竹南廠不幸於 110 年 2 月 1\n日因火災遭受重大損失,此事件之處理依商業會計法規定,下列敘述何者正確?", "options": {"A": "應調整 109 年度財務報表", "B": "109 年度財務報表應予附註揭露", "C": "109 年度財務報表不必做任何處理", "D": "視該公司是否有投保再決定如何處理"}, "answer": "B", "note": ""}, {"id": "bookkeeping-110-25", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 25, "question": "依商業會計法規定,企業債權人對於特定資產之權利,財務報表對此類事項係屬於必要並強制應予:", "options": {"A": "按現時公允價值評價入帳", "B": "附註揭露", "C": "可能性高時才予以入帳", "D": "無需入帳也無需揭露"}, "answer": "B", "note": ""}, {"id": "bookkeeping-110-26", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 26, "question": "依商業會計法規定,有關資產重估的會計處理,下列敘述何者錯誤?", "options": {"A": "商業得依法令規定辦理資產重估價,認列未實現重估增值", "B": "已辦理資產重估者,發生減損時,減損數額認列為當期損失", "C": "減損損失迴轉時,於原認列損失範圍內,認列至當期利益", "D": "已辦理資產重估者,發生減損時,應先減少未實現重估增值;如有不足,認列至當期損失"}, "answer": "B", "note": ""}, {"id": "bookkeeping-110-27", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 27, "question": "依商業會計處理準則規定,有關本期所得稅資產之敘述,下列何者正確?", "options": {"A": "指已支付所得稅金額超過本期及前期應付金額之部分", "B": "指可減除暫時性差異遞轉後期有關之未來期間可回收所得稅金額", "C": "遞延未來期間可回收所得稅金額減除遞延未來期間應支付所得稅金額之餘額", "D": "指未使用課稅損失遞轉後期及未使用所得稅抵減遞轉後期有關之未來期間可回收所得稅金額"}, "answer": "A", "note": ""}, {"id": "bookkeeping-110-28", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 28, "question": "依商業會計處理準則規定,有關負債準備之敘述何者正確?", "options": {"A": "商業因過去事件而負有現時義務,且很有可能需要清償該義務,及該義務之金額能可靠估計時,應認列\n負債準備", "B": "商業因過去事件而負有現時義務,很有可能需要清償該義務時,應認列負債準備", "C": "商業因過去事件而負有現時義務,該義務之金額能可靠估計時,應認列負債準備", "D": "商業因過去事件而負有現時義務,很有可能需要清償該義務,及該義務之金額能可靠估計時,應加以揭露"}, "answer": "A", "note": ""}, {"id": "bookkeeping-110-29", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 29, "question": "依商業會計處理準則規定,保留盈餘不包含下列那一項會計項目?", "options": {"A": "法定盈餘公積", "B": "特別盈餘公積", "C": "未分配盈餘", "D": "資本公積"}, "answer": "D", "note": ""}, {"id": "bookkeeping-110-30", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 30, "question": "依商業會計處理準則規定,其他權益不包含下列那一項會計項目?", "options": {"A": "未實現重估增值", "B": "現金流量避險中屬有效避險部分之避險工具損益", "C": "國外營運機構財務報表換算之兌換差額", "D": "庫藏股票出售損失"}, "answer": "D", "note": ""}, {"id": "bookkeeping-110-31", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 31, "question": "有分支機構之商業,有設置屬該分支機構會計處理,於會計年度終了時,應如何處理本、分支機構之帳目?", "options": {"A": "分開辦理決算", "B": "合併辦理決算", "C": "分支機構不用辦理決算", "D": "由總機構主辦會計決定要分開辦理決算或合併辦理決算"}, "answer": "B", "note": ""}, {"id": "bookkeeping-110-32", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 32, "question": "下列何者不是營業報告書的內容?", "options": {"A": "研究發展狀況", "B": "營業收支預算執行情形", "C": "營業計畫實施成果", "D": "營業狀況差異分析"}, "answer": "D", "note": ""}, {"id": "bookkeeping-110-33", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 33, "question": "下列何種情形,行政機關應給予處分相對人陳述意見之機會?", "options": {"A": "開徵地價稅通知單", "B": "在 COVID-19 疫情期間,因未依規定佩戴口罩所給予之處分", "C": "為避免處分相對人潛逃出境,依法律之限制出境處分", "D": "臺中市政府就某建築指定為古蹟"}, "answer": "D", "note": ""}, {"id": "bookkeeping-110-34", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 34, "question": "若公費留學考試及格人員之錄取函載明,應於取得國外大學入學許可證明時,始得申請核發獎學金,此屬\n何種行政處分之附款?", "options": {"A": "條件", "B": "負擔", "C": "保留行政處分之廢止權", "D": "保留負擔之事後附加或變更"}, "answer": "A", "note": ""}, {"id": "bookkeeping-110-35", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 35, "question": "下列何者非屬行政處分無效之原因?", "options": {"A": "核發證照,當事人申請程序有瑕疵", "B": "許可之行為構成犯罪", "C": "應以證書方式作成而未給予證書", "D": "處分內容對任何人均屬不能實現"}, "answer": "A", "note": ""}, {"id": "bookkeeping-110-36", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 36, "question": "警察於十字路口以手勢指揮交通,與警察對違規駕駛開罰單,此兩項行為依行政程序法第 92 條規定,下\n列敘述何者正確?", "options": {"A": "前者係行政處分,後者係一般處分", "B": "前者係一般處分,後者係行政處分", "C": "兩者皆為一般處分", "D": "兩者皆為行政處分"}, "answer": "B", "note": ""}, {"id": "bookkeeping-110-37", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 37, "question": "行政機關作成行政處分時,關於附款下列敘述何者錯誤?", "options": {"A": "附款不得違背行政處分之目的", "B": "無裁量權之行政處分,皆不得為附款", "C": "有裁量權之行政處分,得為附款", "D": "附款應與該處分之目的具有正當合理之關聯"}, "answer": "B", "note": ""}, {"id": "bookkeeping-110-38", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 38, "question": "依公司法規定,下列敘述何者正確?", "options": {"A": "公司法所稱之中央主管機關為經濟部,在直轄市為直轄市政府", "B": "公司申請設立、變更登記之資本額,應先經律師查核簽證", "C": "中央主管機關不得委任所屬機關、委託或委辦其他機關辦理公司法規定之事項", "D": "公司法所稱之外國公司,謂以營利為目的,非我國居民依照我國法律組織登記之公司"}, "answer": "A", "note": ""}, {"id": "bookkeeping-110-39", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 39, "question": "公司設立登記後,有應登記之事項而不登記,或已登記之事項有變更而不為變更之登記者,其效力如何?", "options": {"A": "無效", "B": "應予撤銷", "C": "應予命令解散", "D": "不得以其事項對抗第三人"}, "answer": "D", "note": ""}, {"id": "bookkeeping-110-40", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 40, "question": "有關公司法對公司權利能力之限制,下列敘述何者正確?", "options": {"A": "公司得為他公司無限責任股東", "B": "公司為保證人時,所擔保之金額不得超過公司實收股本百分之四十", "C": "公開發行股票之公司除以投資為專業或得以章程規定、股東會決議為他公司有限責任股東外,其所有投\n資總額,不得超過本公司實收股本百分之四十", "D": "轉投資之投資總額限制,應計所獲配盈餘或公積增資配股所得之股份"}, "answer": "C", "note": ""}, {"id": "bookkeeping-110-41", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 41, "question": "依商業登記法規定,有關限制行為能力人之商業行為,下列敘述何者正確?", "options": {"A": "限制行為能力人,經法定代理人允許,可獨立營業或成為合夥事業之合夥人", "B": "限制行為能力人倘若能力卓越,經法定代理人允許,可為公司之經理人,代表公司經營業務", "C": "限制行為能力人,因為法律行為受限,故不可獨立營業或成為合夥事業之合夥人", "D": "限制行為能力人,因為法律行為受限,故不可成為股東"}, "answer": "A", "note": ""}, {"id": "bookkeeping-110-42", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 42, "question": "關於分公司之敘述,下列何者錯誤?", "options": {"A": "無營業行為者不須辦理分公司登記", "B": "得以分公司之名義投資購買股票", "C": "分公司所營項目須屬於本公司登記範圍內", "D": "不具有獨立人格"}, "answer": "B", "note": ""}, {"id": "bookkeeping-110-43", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 43, "question": "甲公司投資乙公司,並指定 A 君、B 君及 C 君為代表人,關於甲公司以法人股東身分或以其代表人當選\n為乙公司之董事或監察人,下列敘述何者錯誤?", "options": {"A": "以甲公司身分當選董事並被選任為董事長,指定 A 君代表行使職務", "B": "以甲公司身分當選監察人,指定 A 君代表行使職務,則乙公司登記之監察人為甲公司", "C": "以代表人 A 君、B 君及 C 君身分分別當選為董事,則乙公司登記之董事分別為 A 君、B 君及 C 君", "D": "以代表人 A 君、B 君分別當選為董事,C 君當選監察人"}, "answer": "D", "note": ""}, {"id": "bookkeeping-110-44", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 44, "question": "依公司法第 393 條規定之公司登記文件,任何人得至主管機關之資訊網站查閱,但其中那一事項,須經公\n司同意?", "options": {"A": "執行業務或代表公司之股東", "B": "經理人姓名", "C": "董事、監察人姓名及持股", "D": "公司章程"}, "answer": "D", "note": ""}, {"id": "bookkeeping-110-45", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 45, "question": "關於獨資、合夥事業之商業登記,下列敘述何者正確?", "options": {"A": "商業之資本額未達新臺幣 50 萬元者,免附資本額證明文件", "B": "分支機構終止營業應申請歇業登記", "C": "商業終止營業應申請解散登記", "D": "獨資組織,負責人由甲變更為乙,應申請轉讓登記"}, "answer": "D", "note": ""}, {"id": "bookkeeping-110-46", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 46, "question": "中華民國記帳士職業倫理道德規範,由下列何機關研擬發布?", "options": {"A": "財政部", "B": "立法院", "C": "經濟部", "D": "中華民國記帳士公會全國聯合會"}, "answer": "D", "note": ""}, {"id": "bookkeeping-110-47", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 47, "question": "李記帳士於所得稅結算申報期間,主動至國稅局擔任志工,熱心為納稅人服務,該行為符合記帳士職業倫\n理道德規範之何準則?", "options": {"A": "行為準則之務實", "B": "基本原則之務實", "C": "行為準則之適任", "D": "基本原則之適任"}, "answer": "A", "note": ""}, {"id": "bookkeeping-110-48", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 48, "question": "陳記帳士為精進稅務專業能力,每年皆經常參加國稅局及記帳士公會之相關專業課程,該行為符合記帳士\n職業倫理道德規範之何準則?", "options": {"A": "行為準則之務實", "B": "行為準則之適任", "C": "基本原則之務實", "D": "基本原則之適任"}, "answer": "B", "note": ""}, {"id": "bookkeeping-110-49", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 49, "question": "林記帳士受甲公司委任,為甲公司處理商業會計事務及稅務,甲公司因為向銀行融資,請求林記帳士配合\n作帳調整,但林記帳士堅持依商業會計法、一般公認會計原則及相關法令處理,該行為符合記帳士職業倫\n理道德規範之何準則?", "options": {"A": "行為準則之務實", "B": "基本原則之務實", "C": "行為準則之誠正", "D": "基本原則之誠正"}, "answer": "C", "note": ""}, {"id": "bookkeeping-110-50", "year": "110", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 50, "question": "張記帳士執行業務收取客戶個人資料時,都依個人資料保護法及相關法令處理,該行為符合記帳士職業倫\n理道德規範之何準則?", "options": {"A": "行為準則之誠正", "B": "基本原則之誠正", "C": "行為準則之保密", "D": "基本原則之保密"}, "answer": "C", "note": ""}, {"id": "tax-110-1", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 1, "question": "下列何者屬於綜合所得稅申報之特別扣除額項目?", "options": {"A": "災害損失", "B": "房屋租金支出", "C": "競選經費", "D": "財產交易損失"}, "answer": "D", "note": ""}, {"id": "tax-110-2", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 2, "question": "個人購買短期票券,其到期兌償金超過首次發售價格部分,應如何計徵綜合所得稅?", "options": {"A": "屬於利息所得,應併計到期日當年度之綜合所得總額", "B": "屬於利息所得,除依規定辦理扣繳外,不併計綜合所得總額", "C": "屬於證券交易所得,除依規定辦理扣繳外,不併計綜合所得總額", "D": "屬於證券交易所得,依所得稅法第 4 條之 1 規定,停止課稅"}, "answer": "B", "note": ""}, {"id": "tax-110-3", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 3, "question": "下列何者為營利事業所得稅申報書營業收入調節欄項下,開立統一發票金額之加項?", "options": {"A": "上期結轉本期預收款", "B": "上期應收本期開立發票金額", "C": "本期溢開發票金額", "D": "代收款"}, "answer": "A", "note": ""}, {"id": "tax-110-4", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 4, "question": "營利事業為員工投保團體健康保險,其由營利事業負擔之保險費,每人每月最多在新臺幣多少元以內,免\n視為員工之薪資所得?", "options": {"A": "500 元", "B": "1,000 元", "C": "1,500 元", "D": "2,000 元"}, "answer": "D", "note": ""}, {"id": "tax-110-5", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 5, "question": "甲公司採用分期付款方式銷貨並以毛利百分比法認列銷貨利益,本年度期初分期付款未實現毛利為 100 萬\n元,期初應收分期付款餘額為 200 萬元,本年度銷貨總額為 500 萬元,銷貨毛利為 300 萬元,分期付款收\n款總額為 350 萬元,則該公司本年度認列之分期付款銷貨利益為多少元?", "options": {"A": "200 萬元", "B": "250 萬元", "C": "300 萬元", "D": "350 萬元"}, "answer": "A", "note": ""}, {"id": "tax-110-6", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 6, "question": "依據統一發票使用辦法第 22 條之規定,營業人對當期購買之統一發票賸餘空白未使用部分,應如何處理?", "options": {"A": "得報請稽徵機關核准,留供下期繼續使用", "B": "應繳回稽徵機關", "C": "應予截角作廢保存", "D": "應予以銷毀"}, "answer": "C", "note": ""}, {"id": "tax-110-7", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 7, "question": "依據統一發票使用辦法第 12 條之規定,營業人以貨物與他人交換貨物者,應於何時開立統一發票?", "options": {"A": "換出貨物時", "B": "取得換入貨物時", "C": "以取得換入貨物時或換出貨物時之較先者", "D": "以取得換入貨物時或換出貨物時之較後者"}, "answer": "A", "note": ""}, {"id": "tax-110-8", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 8, "question": "依據所得稅法第 110 條之規定,納稅人未辦理結算申報,而經稽徵機關調查有應課稅之所得額者,除補徵\n稅款外,應照補徵稅額處幾倍以下之罰鍰?", "options": {"A": "2 倍以下", "B": "3 倍以下", "C": "4 倍以下", "D": "5 倍以下"}, "answer": "B", "note": ""}, {"id": "tax-110-9", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 9, "question": "營利事業預先提列備抵呆帳者,其呆帳損失之認列,下列敘述何者正確?", "options": {"A": "僅得以應收帳款為限", "B": "金融業按其債權餘額 2%估列", "C": "實際發生呆帳損失超過標準者,得按前一年度實際發生呆帳比率估列", "D": "分期付款銷貨採毛利百分比法計算損益者,不得提列"}, "answer": "D", "note": ""}, {"id": "tax-110-10", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 10, "question": "假設甲公司帳載營業毛利 900 萬元,營業費用 700 萬元,其中捐贈費用 100 萬元包括以下三筆:透過興學\n基金會未指定學校捐贈 20 萬元,指定某私立大學 60 萬元,及自行捐贈某私立大學 20 萬元。甲公司當年\n度可認列之捐贈費用金額為多少?", "options": {"A": "80 萬元", "B": "96 萬元", "C": "98 萬元", "D": "100 萬元"}, "answer": "B", "note": ""}, {"id": "tax-110-11", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 11, "question": "依營利事業查核準則規定,營利事業繳納以下何種稅款,得列為費用或損失?", "options": {"A": "營利事業所得稅", "B": "進口關稅", "C": "買賣契稅", "D": "非加值型營業稅"}, "answer": "D", "note": ""}, {"id": "tax-110-12", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 12, "question": "有關營利事業列報交際費之敘述,下列何者錯誤?", "options": {"A": "使用藍色申報書者,其交際費認列之限額高於使用普通申報書者", "B": "委託會計師查核簽證申報者,得適用使用藍色申報書之列支限額", "C": "列報限額採超額累進之方式", "D": "經營外銷業務取得外匯收入者,得在不超過當年度外銷結匯收入總額 2%範圍內,列支特別交際費"}, "answer": "C", "note": ""}, {"id": "tax-110-13", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 13, "question": "營利事業採用完工百分比法計算工程損益時,其計算方法不包括下列何者?", "options": {"A": "工程收益比例法", "B": "工程成本比例法", "C": "工時進度比例法", "D": "產出單位比例法"}, "answer": "A", "note": ""}, {"id": "tax-110-14", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 14, "question": "營業人之交易,下列何者免徵營業稅?1國內出售黃金條塊 2進口黃金條塊 3國內銷售生鮮農產品\n4進口生鮮農產品", "options": {"A": "14", "B": "24", "C": "123", "D": "234"}, "answer": "C", "note": ""}, {"id": "tax-110-15", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 15, "question": "依據所得稅法第 14 條之規定,著作人自行出版銷售著作之收入屬於何種所得?", "options": {"A": "營利所得", "B": "執行業務所得", "C": "財產交易所得", "D": "其他所得"}, "answer": "B", "note": ""}, {"id": "tax-110-16", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 16, "question": "甲公司為加值型營業稅之營業人,當期國內應稅銷售額為 600 萬元,外銷銷售額 100 萬元,因進貨及費用\n而取得之進項稅額為 25 萬元,上期累積留抵税額 10 萬元,則該公司本期營業稅:1應納稅額 5 萬元 2\n應退稅額 5 萬元 3留抵稅額 5 萬元 4退稅限額 5 萬元", "options": {"A": "14", "B": "24", "C": "134", "D": "234"}, "answer": "B", "note": ""}, {"id": "tax-110-17", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 17, "question": "有關小規模營業人之敘述,下列何者錯誤?", "options": {"A": "銷售額由主管稽徵機關查定", "B": "由主管稽徵機關每三個月填發繳款書通知繳納一次", "C": "進項稅額皆不得扣減應納稅額", "D": "免申報營利事業所得稅"}, "answer": "C", "note": ""}, {"id": "tax-110-18", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 18, "question": "營業人專營免稅營業項目者,下列敘述何者正確?1免辦理營業登記 2免開立統一發票 3免辦理營業\n稅申報 4進項稅額不得申請退還", "options": {"A": "1234", "B": "234", "C": "34", "D": "4"}, "answer": "D", "note": ""}, {"id": "tax-110-19", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 19, "question": "甲公司為兼營營業人,假設其當期加值型營業稅應稅銷售額 30 萬元,免稅銷售額 30 萬元,零稅率銷售額\n30 萬元,則進項稅額不得扣抵比例為何?", "options": {"A": "33%", "B": "33.33%", "C": "66.66%", "D": "67%"}, "answer": "A", "note": ""}, {"id": "tax-110-20", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 20, "question": "納稅義務人應納稅捐逾 30 日仍未繳納,應由稅捐稽徵機關移送強制執行,其依現行法可以暫緩強制執行\n者,下列敘述何者錯誤?", "options": {"A": "已依稅捐稽徵法第 35 條規定申請復查者", "B": "對於復查決定之應納稅額繳納三分之一,依法提起訴願者", "C": "就應納稅額提供相當擔保,經稽徵機關核准者", "D": "稽徵機關已就納稅義務人相當於復查決定應納稅額之財產,通知有關機關,不得為移轉或設定他項權利者"}, "answer": "B", "note": ""}, {"id": "tax-110-21", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 21, "question": "甲君因欠繳綜合所得稅導致其所有之土地遭法院拍賣,假設甲君尚未繳納或償還之項目包括:1欠繳之所\n得稅 2該筆土地的地價稅 3銀行抵押債務 4普通債務 則以上債權之清償順序應為下列何者?", "options": {"A": "1234", "B": "1324", "C": "2314", "D": "2134"}, "answer": "C", "note": ""}, {"id": "tax-110-22", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 22, "question": "有關稅捐核課期間之敘述,下列何者錯誤?", "options": {"A": "依法應由納稅義務人申報繳納之稅捐,未在規定期間內申報,其核課期間為五年", "B": "依法應由納稅義務人實貼之印花稅,核課期間為五年", "C": "應由稅捐稽徵機關依稅籍底冊或查資料核定課徵之稅捐,其核課期間為五年", "D": "故意以詐欺或其他不正當方法逃漏稅捐者,其核課期間為七年"}, "answer": "A", "note": ""}, {"id": "tax-110-23", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 23, "question": "有關納稅義務人對核定之稅捐如有不服,其申請復查之期限,下列敘述何者錯誤?(假設以下日期均非例假日)", "options": {"A": "核定稅額通知書有應納稅款,繳納期限為 4 月 25 日者,復查期限為 5 月 25 日", "B": "核定稅額通知書有應納稅款,繳納期限為 10 月 15 日者,復查期限為 11 月 14 日", "C": "核定通知書無應納稅款,核定通知書於 5 月 1 日送達者,復查期限為 5 月 31 日", "D": "核定通知書無應納稅款,核定通知書於 9 月 15 日送達者,復查期限為 10 月 14 日"}, "answer": "D", "note": ""}, {"id": "tax-110-24", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 24, "question": "我國遺產稅的課徵採用超額累進的稅率結構,其稅率為下列何者?", "options": {"A": "10%,15%,20%", "B": "10%,20%,30%", "C": "20%,30%,40%", "D": "30%,40%,50%"}, "answer": "A", "note": ""}, {"id": "tax-110-25", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 25, "question": "有關遺產稅免稅額之規定,下列何者錯誤?", "options": {"A": "被繼承人為中華民國國民者,免稅額為 1,200 萬元", "B": "被繼承人非中華民國國民者,免稅額減半計算", "C": "被繼承人為軍警公教人員因執行職務死亡者,免稅額加倍計算", "D": "物價指數上漲率累積達一定的程度時,會進行指數化調整"}, "answer": "B", "note": ""}, {"id": "tax-110-26", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 26, "question": "贈與稅的應納稅額最少在多少元以上,納稅義務人確有困難無法一次繳納現金者,可以申請分期繳納?", "options": {"A": "30 萬元", "B": "50 萬元", "C": "80 萬元", "D": "100 萬元"}, "answer": "A", "note": ""}, {"id": "tax-110-27", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 27, "question": "依據遺產及贈與稅法第 24 條之規定,贈與稅的申報期限為下列何者?", "options": {"A": "年度結束後 1 個月內", "B": "每次贈與行為發生日次日起 10 日內", "C": "同年度贈與總額超過免稅額之贈與行為發生日次日起 20 日內", "D": "同年度贈與總額超過免稅額之贈與行為發生日次日起 30 日內"}, "answer": "D", "note": ""}, {"id": "tax-110-28", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 28, "question": "依所得稅法相關規定,下列何項特別扣除額係以個人為單位?1長期照顧 2儲蓄投資 3教育學費 4\n保險費 5幼兒學前", "options": {"A": "123", "B": "134", "C": "135", "D": "1345"}, "answer": "C", "note": ""}, {"id": "tax-110-29", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 29, "question": "依現行所得稅法規定,有關所得類別之敘述,下列何者正確?", "options": {"A": "與證券商從事結構型商品交易之所得,屬於財產交易所得", "B": "受僱於台大醫院之醫師所領取之酬勞屬於執行業務所得", "C": "有奬儲蓄券之中奬奬金為機會中奬所得", "D": "警察破案奬金屬於薪資所得"}, "answer": "D", "note": ""}, {"id": "tax-110-30", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 30, "question": "依現行所得稅法規定,下列何項所得必須併入綜合所得總額課徵綜合所得稅?1出售上市股票之交易所得\n2個人取自營利事業贈與之財產 3百貨公司周年慶中奬奬品 4國家考試命題酬勞 5銀行利息所得", "options": {"A": "123", "B": "134", "C": "235", "D": "345"}, "answer": "C", "note": ""}, {"id": "tax-110-31", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 31, "question": "丙公司 110 年期初備抵呆帳餘額為 4 萬元,期末有應收帳款 300 萬元及應收票據 200 萬元,則丙公司申報\n110 年營利事業所得稅時,可申報呆帳多少元?", "options": {"A": "4 萬", "B": "3 萬", "C": "2 萬", "D": "1 萬"}, "answer": "D", "note": ""}, {"id": "tax-110-32", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 32, "question": "陳先生與陳太太夫妻綜合所得稅係採合併計稅合併申報,陳先生有作詞收入 25 萬元及演講收入 12 萬元,\n陳太太有作曲收入 10 萬元,依所得稅法相關規定,夫妻二人今年應課稅收入為多少萬元?", "options": {"A": "47", "B": "29", "C": "19", "D": "7"}, "answer": "C", "note": ""}, {"id": "tax-110-33", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 33, "question": "綜合所得稅之各類所得計算,下列何者無必要成本及費用之減除?1自力耕作、漁、牧、林、礦之所得\n2競技、競賽及機會中奬之奬金 3薪資所得 4退職所得 5股利所得", "options": {"A": "2345", "B": "345", "C": "45", "D": "145"}, "answer": "C", "note": ""}, {"id": "tax-110-34", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 34, "question": "張翠山一家人 110 年有股利所得如下:張翠山 40 萬元、其妻殷素素 50 萬元、其子張無忌(19 歲)20 萬\n元,其 110 年股利所得可抵減稅額為多少元?", "options": {"A": "100,000", "B": "93,500", "C": "85,000", "D": "80,000"}, "answer": "D", "note": ""}, {"id": "tax-110-35", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 35, "question": "甲公司總機構在日本,其 110 年在我國境內提供技術服務收入 2 億元,經財政部核定按營業收入百分比計\n算所得,而甲公司以前年度核定虧損 1,000 萬元,則依所得稅法規定,該公司 110 年度營利事業所得稅額\n為多少元?", "options": {"A": "3,000 萬元", "B": "2,000 萬元", "C": "600 萬元", "D": "400 萬元"}, "answer": "C", "note": ""}, {"id": "tax-110-36", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 36, "question": "依所得稅法相關規定,營利事業之支出,下列何者不得列為費用或損失?1遭受不可抗力之災害損失未受\n有保險賠償部分 2資本之利息 3營利事業所得稅 4營業上設備之修理支出 5 萬元,其所增加之價值\n非二年內耗竭", "options": {"A": "123", "B": "234", "C": "23", "D": "14"}, "answer": "C", "note": ""}, {"id": "tax-110-37", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 37, "question": "下列何者得免用統一發票?1營業人取得之賠償收入 2娛樂業之門票收入 3獨資事業 4電視臺之\n廣告播映", "options": {"A": "12", "B": "34", "C": "23", "D": "123"}, "answer": "A", "note": ""}, {"id": "tax-110-38", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 38, "question": "營利事業之帳簿憑證因公司會計人員帶回家以致滅失者,稽徵機關如何計算其所得額?", "options": {"A": "依該事業前三個年度經稽徵機關核定純益率之平均數核定", "B": "若帳簿憑證在辦理結算申報後,未經稽徵機關調查核定前滅失,依申報所得額核定", "C": "依該事業前三個年度申報之平均數核定", "D": "依同業利潤標準核定"}, "answer": "D", "note": ""}, {"id": "tax-110-39", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 39, "question": "納稅義務人,有下列何種情形,除追繳稅款外,按所漏稅額處五倍以下罰鍰,並得停止其營業?1虛報進項\n稅額 2經核定應使用統一發票而不使用 3未依規定申請稅籍登記而營業 4於帳簿為虛偽不實之記載", "options": {"A": "13", "B": "24", "C": "34", "D": "12"}, "answer": "A", "note": ""}, {"id": "tax-110-40", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 40, "question": "下列何者非我國加值型及非加值型營業稅之課稅範圍?", "options": {"A": "國際運輸事業自中華民國境內載運貨物出境者", "B": "外國保險業自中華民國境內保險業承保再保險", "C": "貨物自國外進入海關管理之物流中心", "D": "銷售貨物之交付須移運者,其起運地在中華民國境內"}, "answer": "C", "note": ""}, {"id": "tax-110-41", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 41, "question": "下列何者之營業稅稅率為百分之一?1理髮業 2農產品批發市場之承銷人 3計程車業 4有陪侍服\n務之茶室", "options": {"A": "12", "B": "34", "C": "13", "D": "24"}, "answer": "C", "note": ""}, {"id": "tax-110-42", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 42, "question": "依加值型及非加值型營業稅法規定,進口菸品於計算其營業稅應納稅額時,其稅基為何?", "options": {"A": "不包括菸品之菸稅額及菸品健康福利捐", "B": "包括菸品之菸稅額,但不包括菸品健康福利捐", "C": "同時包括菸品之菸稅額及菸品健康福利捐", "D": "包括菸品健康福利捐,但不包括菸品之菸稅額"}, "answer": "C", "note": ""}, {"id": "tax-110-43", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 43, "question": "下列何種情況溢付之營業稅得申請退還?1因銷售免稅貨物或勞務 2因購置自用乘人小汽車 3因進\n口機器設備 4因合併註銷登記", "options": {"A": "12", "B": "34", "C": "13", "D": "24"}, "answer": "B", "note": ""}, {"id": "tax-110-44", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 44, "question": "下列情形何者非視為銷售貨物?", "options": {"A": "營業人以其產製供銷售之貨物,轉供營業人自用", "B": "營業人將貨物抵償債務", "C": "營業人委託他人代銷貨物者", "D": "因信託行為成立,委託人與受託人間移轉信託財產"}, "answer": "D", "note": ""}, {"id": "tax-110-45", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 45, "question": "下列何種情形,免課贈與稅?", "options": {"A": "以顯著不相當之代價,讓與不動產予他人", "B": "兄弟之間買賣不動產且無法提出已支付價款之確實證明", "C": "債務人依消費者債務清理條例更生、清算,以致債權無法十足取償", "D": "他益信託契約"}, "answer": "C", "note": ""}, {"id": "tax-110-46", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 46, "question": "被繼承人之下列財產,何者無需列入遺產總額?1捐贈給臺北市政府之遺產 2遺產中作農業使用之農業\n用地 3以部分遺產成立基金會 4被繼承人遺產中經政府闢為公眾通行道路之土地", "options": {"A": "1234", "B": "123", "C": "124", "D": "14"}, "answer": "D", "note": ""}, {"id": "tax-110-47", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 47, "question": "擔保稅款之擔保品計價,下列何者錯誤?", "options": {"A": "黃金,按九折計算", "B": "政府發行經規定可十足提供公務擔保之公債,按面額計值", "C": "經中央銀行掛牌之外幣,按八折計算", "D": "上市或上櫃之有價證券,按九折計算"}, "answer": "D", "note": ""}, {"id": "tax-110-48", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 48, "question": "納稅義務人已於 110 年 5 月 30 日申報綜合所得稅,且無故意以詐欺或其他不正當方法逃漏稅捐,核課期\n間至何時截止?", "options": {"A": "115 年 5 月 29 日", "B": "115 年 5 月 30 日", "C": "115 年 5 月 31 日", "D": "115 年 12 月 31 日"}, "answer": "A", "note": ""}, {"id": "tax-110-49", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 49, "question": "營利事業分期付款銷貨採下列那種方法計算損益者,有關銷貨收入之應收債權,不得提列備抵呆帳?", "options": {"A": "毛利百分比法", "B": "普通銷貨法", "C": "差價攤計法", "D": "全部毛利法"}, "answer": "A", "note": ""}, {"id": "tax-110-50", "year": "110", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 50, "question": "依所得稅法相關規定,營利事業認列捐贈之費用,下列敘述何者錯誤?", "options": {"A": "對公益慈善團體之捐贈不得超過所得額 10%", "B": "直接對大陸地區之捐贈不得列為費用或損失", "C": "對偏遠地區舉辦之文化創意活動的捐贈支出,不受金額限制", "D": "對國立大學之捐贈不受金額限制"}, "answer": "C", "note": ""}, {"id": "accounting-111-1", "year": "111", "subject": "accounting", "subjectName": "會計學概要", "number": 1, "question": "財務報表須具備的品質特性包含攸關性與忠實表述,其中忠實表述所應具備之特性,下列何者\n錯誤?", "options": {"A": "中立性", "B": "免於錯誤", "C": "審慎性", "D": "完整性"}, "answer": "C", "note": ""}, {"id": "accounting-111-2", "year": "111", "subject": "accounting", "subjectName": "會計學概要", "number": 2, "question": "下列那一項比率較無法衡量公司之長期償債能力?", "options": {"A": "流動資產/流動負債*100%", "B": "負債總額/權益總額*100%", "C": "負債總額/資產總額*100%", "D": "利息保障倍數"}, "answer": "A", "note": ""}, {"id": "accounting-111-3", "year": "111", "subject": "accounting", "subjectName": "會計學概要", "number": 3, "question": "將日記簿上的會計分錄所牽涉到的會計項目及其金額,依項目別一一抄寫到分類帳的程序,稱為:", "options": {"A": "分錄", "B": "過帳", "C": "調整", "D": "結帳"}, "answer": "B", "note": ""}, {"id": "accounting-111-4", "year": "111", "subject": "accounting", "subjectName": "會計學概要", "number": 4, "question": "下列何者不是合夥企業的特徵?", "options": {"A": "合夥人互為代理", "B": "合夥企業財產為全體合夥人所共有", "C": "合夥人對企業的債務負有限清償責任", "D": "合夥企業不是法律個體"}, "answer": "C", "note": ""}, {"id": "accounting-111-5", "year": "111", "subject": "accounting", "subjectName": "會計學概要", "number": 5, "question": "基隆公司 12 月份的銀行對帳單顯示,12 月底餘額為$3,000,000,銀行在 12 月份支付支票的款項共\n計$840,000,但基隆公司 12 月份實際開出之支票金額共計$1,200,000。基隆公司與銀行核對後發現,\n11 月底的未兌現支票之金額合計為$96,000,這些未兌現支票均於 12 月兌現。假設沒有其他造成銀\n行對帳單餘額與公司帳上餘額發生差異的事項,則基隆公司 12 月底正確的銀行存款餘額為何?", "options": {"A": "$2,544,000", "B": "$2,640,000", "C": "$2,736,000", "D": "$2,904,000"}, "answer": "A", "note": ""}, {"id": "accounting-111-6", "year": "111", "subject": "accounting", "subjectName": "會計學概要", "number": 6, "question": "高雄公司因資金週轉需求,110 年 11 月 1 日將應收帳款$500,000 出售予甲銀行,甲銀行支付 85%\n的帳款金額給高雄公司,另收取 5%的手續費,帳款由甲銀行代收,倘若應收帳款收不回來,則甲\n銀行對高雄公司無追索權,試問下列關於高雄公司 110 年 11 月 1 日之會計處理敘述,何者正確?", "options": {"A": "貸:應收帳款$425,000", "B": "貸:應收帳款$500,000", "C": "貸:應付帳款$425,000", "D": "貸:應付帳款$450,000"}, "answer": "B", "note": ""}, {"id": "accounting-111-7", "year": "111", "subject": "accounting", "subjectName": "會計學概要", "number": 7, "question": "宜蘭公司發行的股份計有普通股 30,000 股,每股面額$10;非累積完全參加特別股 9,000 股,每股\n面額$20,股利率為 8%。宜蘭公司過去二年的股本結構沒有改變,也未發過股利。該公司股東會\n決議今年發放現金股利$60,000,請問分配給普通股股東的股利為何?", "options": {"A": "$14,400", "B": "$22,500", "C": "$28,500", "D": "$37,500"}, "answer": "D", "note": ""}, {"id": "accounting-111-8", "year": "111", "subject": "accounting", "subjectName": "會計學概要", "number": 8, "question": "下表是台東公司今年的部分資產負債表資料:\n12 月 31 日 1 月 1 日\n應收利息 $2,000 $8,000\n預收租金 $5,000 $3,000\n若今年損益表中的利息收入及租金收入共計$10,000,則今年現金基礎的利息收入及租金收入共計\n多少?", "options": {"A": "$2,000", "B": "$6,000", "C": "$14,000", "D": "$18,000"}, "answer": "D", "note": ""}, {"id": "accounting-111-9", "year": "111", "subject": "accounting", "subjectName": "會計學概要", "number": 9, "question": "綠島公司今年的直接人工成本共計$120,000,加工成本共計$180,000,主要成本共計$210,000。\n若今年的製成品成本合計為$300,000,期末在製品成本為$50,000,請問今年的期初在製品成本\n為何?", "options": {"A": "$0", "B": "$20,000", "C": "$80,000", "D": "$140,000"}, "answer": "C", "note": ""}, {"id": "accounting-111-10", "year": "111", "subject": "accounting", "subjectName": "會計學概要", "number": 10, "question": "台中農產公司專門飼養乳牛,牛奶為其主要產品,111 年 11 月共生產 200,000 公升牛奶,每公升\n牛奶之公允價值為$50 元,出售成本每公升$5 元,採集牛奶之員工薪資為$100,000 元,其他支出\n為$50,000 元,試問台中農產公司採集牛奶 200,000 公升之分錄,下列何者正確?", "options": {"A": "借:消耗性生物資產$10,000,000", "B": "借:消耗性生物資產$9,000,000", "C": "借:農產品$10,000,000", "D": "借:農產品$9,000,000"}, "answer": "D", "note": ""}, {"id": "accounting-111-11", "year": "111", "subject": "accounting", "subjectName": "會計學概要", "number": 11, "question": "請閱讀下方原卷的選擇題第 11 題，再選 A、B、C 或 D。", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "D", "note": "", "paper": "111180_1301_會計學概要.pdf", "images": ["pages/111/1301-3.jpg"]}, {"id": "accounting-111-12", "year": "111", "subject": "accounting", "subjectName": "會計學概要", "number": 12, "question": "苗栗公司於 X1 年初以$150,000 購入機器一部,苗栗公司估計機器的耐用年限為 5 年,殘值為\n$25,000,採直線法提列折舊。X2 年底該機器有減損跡象,如果立即出售該機器,估計公允價值\n減出售成本為$90,000。如果繼續使用該機器,則未來淨現金流入的折現值為$91,000。X3 年底苗\n栗公司評估減損跡象已不復存在,且機器的公允價值減出售成本為$76,000,未來淨現金流入的折\n現值為$75,000。假設機器的殘值與耐用年限之估計不變,則 X3 年底苗栗公司應認列的減損迴轉\n利益為何?", "options": {"A": "$0", "B": "$6,000", "C": "$7,000", "D": "$9,000"}, "answer": "B", "note": ""}, {"id": "accounting-111-13", "year": "111", "subject": "accounting", "subjectName": "會計學概要", "number": 13, "question": "下列有關於無形資產之論述,何者正確?", "options": {"A": "無形資產中之專利權認列時,應以其市場價值入帳", "B": "版權、客戶名單以及品牌名稱皆是屬於無形資產", "C": "研究發展費用無論是研究階段或是發展階段之支出,皆不可資本化為無形資產", "D": "無形資產之攤銷大多採用直線法,其表達的帳面價值等同市場價值"}, "answer": "B", "note": ""}, {"id": "accounting-111-14", "year": "111", "subject": "accounting", "subjectName": "會計學概要", "number": 14, "question": "花蓮公司自 X1 年開始營業,主要的營業活動是生產及銷售掌上型電子遊戲機,並對於出售的產\n品提供 3 年的保固服務。該公司估計:出售的產品在銷售後第一年被送回維修之費用約為銷貨收\n入的 2%,在銷售後第二年被送回維修之費用約為銷貨收入的 3%,在銷售後第三年被送回維修之\n費用約為銷貨收入的 5%。前三年遊戲機的銷貨金額及實際保固服務支出資料如下:\n年度 銷貨收入 實際保固服務支出\nX1 $300,000 $ 5,000\nX2 390,000 15,000\nX3 420,000 40,000\n請問 X3 年底的保固負債準備餘額為何?", "options": {"A": "$33,600", "B": "$42,000", "C": "$51,000", "D": "$53,100"}, "answer": "C", "note": ""}, {"id": "accounting-111-15", "year": "111", "subject": "accounting", "subjectName": "會計學概要", "number": 15, "question": "台北公司於 X2 年 1 月 1 日發行面額$14,000、票面利率 5%、4 年期公司債,每年年底付息一次。\n若應付公司債 X3 年初的帳面金額為$13,626,X3 年底的帳面金額為$13,744。請問該公司債發行\n時的市場利率為何?", "options": {"A": "4%", "B": "5%", "C": "6%", "D": "7%"}, "answer": "C", "note": ""}, {"id": "accounting-111-16", "year": "111", "subject": "accounting", "subjectName": "會計學概要", "number": 16, "question": "蘭嶼公司自今年開始營業,今年共生產 300 單位之製成品,該公司今年的支出包括直接原料\n$75,000,直接人工$60,000,變動製造費用$30,000,固定製造費用$37,500,變動銷管費用$20,000,\n固定銷管費用$25,000。若期末在製品成本為$0,今年出售 240 單位的製成品,請問期末製成品成\n本為何?", "options": {"A": "$33,000", "B": "$40,500", "C": "$49,500", "D": "$162,000"}, "answer": "B", "note": ""}, {"id": "accounting-111-17", "year": "111", "subject": "accounting", "subjectName": "會計學概要", "number": 17, "question": "台北公司 110 年 1 月 1 日有 500,000 股普通股流通在外,其 110 年度中相關權益交易如下:4 月 1 日\n增資 100,000 股,6 月 1 日發放 10%股票股利,8 月 1 日買回普通股 50,000 股,10 月 1 日減資\n20,000 股,12 月 1 日出售庫藏股 10,000 股。試計算台北公司在衡量 110 年之每股盈餘時,其 110 年\n加權平均流通在外股數為何?", "options": {"A": "585,000 股", "B": "590,000 股", "C": "540,000 股", "D": "607,500 股"}, "answer": "D", "note": ""}, {"id": "accounting-111-18", "year": "111", "subject": "accounting", "subjectName": "會計學概要", "number": 18, "question": "彰化公司今年年初有每股面額$10 之普通股 600,000 股流通在外,以及每股面額$10、股利率 10%\n之累積特別股 100,000 股流通在外。今年 10 月 1 日彰化公司又發行普通股 100,000 股,若該公司\n今年的稅後淨損為$700,000,請問今年的每股盈餘為何?", "options": {"A": "-$1.28", "B": "-$1.12", "C": "-$0.96", "D": "$0"}, "answer": "A", "note": ""}, {"id": "accounting-111-19", "year": "111", "subject": "accounting", "subjectName": "會計學概要", "number": 19, "question": "桃園公司的存貨週轉率為 4,應收帳款週轉率為 10,若 1 年以 365 天計算,請問桃園公司之營業\n週期為何?", "options": {"A": "105 天", "B": "117 天", "C": "128 天", "D": "140 天"}, "answer": "C", "note": ""}, {"id": "accounting-111-20", "year": "111", "subject": "accounting", "subjectName": "會計學概要", "number": 20, "question": "彰化公司專門製造塑膠容器,111 年期初在製品存貨為$80,000,本期投入直接原料為$50,000,直\n接人工$40,000,間接製造費用分攤率為直接人工成本的 70%,年底時發現還有部分產品仍在製程\n中,估計其成本為$60,000,試問彰化公司 111 年之製成品成本為何?", "options": {"A": "$118,000", "B": "$138,000", "C": "$98,000", "D": "$198,000"}, "answer": "B", "note": ""}, {"id": "bookkeeping-111-1", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 1, "question": "記帳士公會依章程所載,置理事 15 人。請問下期改選理事時,現任理事中最多有幾人可連任?", "options": {"A": "5 人", "B": "7 人", "C": "8 人", "D": "沒有限制"}, "answer": "B", "note": ""}, {"id": "bookkeeping-111-2", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 2, "question": "在高雄市登錄執業之記帳士陳小姐欲將其記帳士事務所遷移至臺北市,有關辦理變更登錄之敘述,下\n列何者正確?", "options": {"A": "應於遷移之日起 15 日內辦理變更", "B": "應向財政部高雄國稅局辦理變更", "C": "應檢附臺北市政府之同意函", "D": "應經高雄市記帳士公會核准後方可辦理搬遷"}, "answer": "B", "note": ""}, {"id": "bookkeeping-111-3", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 3, "question": "下列對記帳士法立法目的之敘述,何者正確?1建立記帳士制度 2協助納稅義務人記帳 3協助納\n稅義務人履行納稅義務 4協助公司建立現代化自動稅務管理系統 5協助營利事業建立稅務簽證\n申報制度 6協助稽徵機關簡化稅政", "options": {"A": "123", "B": "145", "C": "234", "D": "456"}, "answer": "A", "note": ""}, {"id": "bookkeeping-111-4", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 4, "question": "下列何者不是記帳士職業倫理道德規範中,要求記帳士應遵守之基本原則?1誠正 2獨立 3適任\n4保密 5務實 6廉潔", "options": {"A": "1345", "B": "2345", "C": "1256", "D": "26"}, "answer": "D", "note": ""}, {"id": "bookkeeping-111-5", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 5, "question": "下列涉及現金之交易,何者違反商業會計法第 9 條有關商業之支出,達一定金額者,應使用之支付工\n具或方法之規定?1甲公司購買機器設備開立 350 萬元支票給賣方 2乙銀行將其核准之貸款金額\n200 萬元存入客戶帳戶 3丙公司以現金 150 萬元支付購買辦公室之頭期款 4丁公司出售汽車而自\n某君收到 110 萬元現金 5戊公司以活期存款取款條自銀行提領 105 萬元現金支付廠商貨款", "options": {"A": "13", "B": "24", "C": "35", "D": "15"}, "answer": "C", "note": ""}, {"id": "bookkeeping-111-6", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 6, "question": "依商業會計法規定,有關公司組織之主辦會計人員任免規定,下列敘述何者正確?", "options": {"A": "如為股份有限公司,應由股東會以股東過半數之出席,及出席股東過半數之同意", "B": "如為有限公司,應有全體股東過半數之同意", "C": "如為兩合公司,應有全體股東過半數之同意", "D": "公司章程規定之主辦會計任免程序,不得與法令規定不同"}, "answer": "B", "note": ""}, {"id": "bookkeeping-111-7", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 7, "question": "依商業會計處理準則第 24 條規定,下列那一種資產,於資產減損後,當有證據顯示以前期間所認列\n之減損損失,可能已不存在或減少時,資產帳面金額仍不予迴轉?", "options": {"A": "投資性不動產", "B": "以成本衡量之權益工具投資", "C": "採權益法之投資", "D": "不動產、廠房及設備"}, "answer": "B", "note": ""}, {"id": "bookkeeping-111-8", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 8, "question": "有關「會計帳簿」之敘述,下列何者正確?", "options": {"A": "總分類帳簿是所有商業必須設置之帳簿", "B": "日記簿是特種序時帳簿", "C": "商業更換新帳簿時,於舊帳簿空白首頁加蓋「空白作廢」戳記即可", "D": "會計帳簿所記載之財物帳戶,應載明保管人員姓名"}, "answer": "A", "note": ""}, {"id": "bookkeeping-111-9", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 9, "question": "依商業會計法第 42 條規定,受贈資產按公允價值入帳,並視其性質,列入不同的會計項目。下列何\n者並不包含在其中?", "options": {"A": "收入", "B": "遞延收入", "C": "資本公積", "D": "保留盈餘"}, "answer": "D", "note": ""}, {"id": "bookkeeping-111-10", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 10, "question": "下列敘述何者正確?", "options": {"A": "商業有支付員工退休金之義務者,得於員工在職期間依法提列退休金準備,認列為當期費用", "B": "當期銷貨成本應與所獲得之當期銷貨收入相配合", "C": "商業若發生損失時,可列為遞延損失,逐年攤銷為費用", "D": "申報營利事業所得稅時,各項所得依稅法規定所作的調整應入帳"}, "answer": "B", "note": ""}, {"id": "bookkeeping-111-11", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 11, "question": "下列何項敘述,違反商業會計法之規定?", "options": {"A": "有分支機構之商業,於會計年度終了時,應將其本、分支機構之帳目,各自單獨辦理決算,以利績\n效考核", "B": "商業負責人應於會計年度終了後 6 個月內,將商業之決算報表提請承認", "C": "代表商業之負責人應將各項決算報表備置於本機構", "D": "商業之利害關係人,得因正當理由,聲請法院選派檢查員,檢查該商業之帳簿報表及憑證"}, "answer": "A", "note": ""}, {"id": "bookkeeping-111-12", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 12, "question": "依商業會計處理準則第 18 條規定,下列何者應列為「不動產、廠房及設備」項下?1為賺取資本增\n值所持有之不動產 2用於生產之機器設備 3生產性植物 4供管理目的所持有之建築物 5供\n運輸使用之車輛", "options": {"A": "12345", "B": "僅245", "C": "1245", "D": "2345"}, "answer": "D", "note": ""}, {"id": "bookkeeping-111-13", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 13, "question": "有關資產重估價之規定,下列敘述何者正確?", "options": {"A": "流動資產遇有物價上漲達 25%時,得依規定實施資產重估價", "B": "遞耗資產不可辦理資產重估價", "C": "經重估之資產應自重估年度起,按其重估後之價值計提折舊", "D": "無形資產重估後發生之增值,應列為未實現重估增值"}, "answer": "D", "note": ""}, {"id": "bookkeeping-111-14", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 14, "question": "對於商業欲變更會計年度,應否呈請主管機關同意之規定,商業會計法與所得稅法之規定是否相同?", "options": {"A": "二者皆規定需先呈請核准,方得變更會計年度", "B": "二者皆規定不需呈請核准", "C": "商業會計法規定不需,但所得稅法規定必需", "D": "商業會計法規定必需,但所得稅法規定不需"}, "answer": "C", "note": ""}, {"id": "bookkeeping-111-15", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 15, "question": "下列何種情況下,商業得不另製記帳憑證,而以原始憑證作為記帳憑證?1整理結算 2會計事務較\n簡 3結算後轉入帳目 4原始憑證已符合記帳需要", "options": {"A": "12", "B": "13", "C": "23", "D": "24"}, "answer": "D", "note": ""}, {"id": "bookkeeping-111-16", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 16, "question": "有關公司名稱預查審核之相關規定,下列敘述何者正確?", "options": {"A": "名稱預查申請,一次不得填列超過 3 個公司名稱", "B": "預查申請案經核准者保留期間為 6 個月", "C": "外國公司之名稱可以原外文名稱登記", "D": "公司內部依法定程序選用外文名稱後,即須辦理登記"}, "answer": "B", "note": ""}, {"id": "bookkeeping-111-17", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 17, "question": "下列敘述何者正確?", "options": {"A": "公司不得為他公司無限責任股東或合夥事業之合夥人", "B": "公司如為他公司有限責任股東時,其所有投資總額,不得超過本公司淨值 40%", "C": "公司間或與行號間有短期融通資金之必要者,得貸與公司資金。但融資金額不得超過貸與企業實收\n股本額 40%", "D": "公司負責人違反保證之規定時,應與公司負連帶賠償責任"}, "answer": "A", "note": ""}, {"id": "bookkeeping-111-18", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 18, "question": "從事網路拍賣業者,是否須辦理商業登記?", "options": {"A": "以公司型態經營者,應按公司法辦理設立登記", "B": "以獨資型態經營者,每月銷售勞務未達 8 萬元者免辦理商業登記", "C": "未僱用他人之網路拍賣業者,不需辦理商業登記", "D": "若以兼職方式從事網路拍賣,無論營業額多寡,皆不須辦理商業登記"}, "answer": "A", "note": ""}, {"id": "bookkeeping-111-19", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 19, "question": "在行政程序法中,有關行政處分之「撤銷」與「廢止」之差異,下列何者錯誤?", "options": {"A": "行政處分經廢止後,原則上自廢止時起,失其效力", "B": "得撤銷之行政處分,一旦宣告撤銷,該處分溯及既往失其效力", "C": "受益人未履行行政處分所附之負擔者,其廢止得溯及既往失其效力", "D": "撤銷針對合法之行政處分,廢止針對違法之行政處分"}, "answer": "D", "note": ""}, {"id": "bookkeeping-111-20", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 20, "question": "有關行政處分於法定救濟期間經過後,得重新申請撤銷、廢止或變更之規定,下列敘述何者正確?", "options": {"A": "相對人發現處分作成後始存在之有利新證據,得申請程序重開", "B": "相對人因重大過失而未能在救濟程序中主張其事由者得申請程序重開", "C": "相對人自法定救濟期間經過後已逾 2 年者,不得申請程序重開", "D": "程序重開僅限於相對人始得申請"}, "answer": "A", "note": ""}, {"id": "bookkeeping-111-21", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 21, "question": "關於記帳士懲戒,下列敘述何者錯誤?", "options": {"A": "取得記帳士考試及格證書並向主管機關申請登錄完成,惟未加入記帳士公會即開始執行業務者,應\n交付懲戒", "B": "違反記帳士公會章程之規定,情節重大者,記帳士公會得報請財政部交付懲戒", "C": "記帳士懲戒委員會應將交付懲戒事件通知被付懲戒記帳士,被付懲戒記帳士應於收到通知之次日起\n20 日內,提出答辯或陳述意見,逾期記帳士懲戒委員會得逕行決議", "D": "被付懲戒記帳士對於記帳士懲戒委員會之決議不服者,得於決議書送達之翌日起 30 日內,向記帳\n士懲戒委員會請求覆審"}, "answer": "D", "note": ""}, {"id": "bookkeeping-111-22", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 22, "question": "甲記帳士受乙公司委任辦理營業稅申報並幫助乙公司以不正當方法逃漏稅捐,經檢察官提起公訴,下\n列敘述何者錯誤?", "options": {"A": "財政部應將甲記帳士交付記帳士懲戒委員會懲戒", "B": "甲記帳士倘經法院判決執行記帳士業務,犯偽造文書罪,處有期徒刑 1 年 6 個月,宣告緩刑 2 年確\n定,仍得充任記帳士", "C": "甲記帳士倘經法院判決執行記帳士業務,犯偽造文書罪,處有期徒刑 1 年 6 個月確定,財政部應廢\n止甲之記帳士證書", "D": "甲記帳士倘經法院判決執行記帳士業務,犯偽造文書罪,處有期徒刑 1 年 6 個月確定且已服刑完\n畢,終身不得再充任記帳士及請領記帳士證書"}, "answer": "D", "note": ""}, {"id": "bookkeeping-111-23", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 23, "question": "關於記帳士執行業務,下列敘述何者錯誤?", "options": {"A": "記帳士不得受委任辦理各項稅捐之查核簽證申報及訴願、行政訴訟事項", "B": "記帳士執行業務設置簿冊,應載明委任人及委任案件內容、酬金數額及委任日期並保存 5 年", "C": "記帳士受委任後,有正當事由須終止契約者,應於 10 日前通知委任人", "D": "記帳士接受委任辦理稅捐稽徵案件申請事項,應將與委任人訂立之委任書隨同代理案件附送受理\n機關"}, "answer": "C", "note": ""}, {"id": "bookkeeping-111-24", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 24, "question": "關於記帳士登錄,下列敘述何者錯誤?", "options": {"A": "甲記帳士登錄執行業務之區域為臺南市,其於高雄市執行業務,除應向主管機關登記,並應於高雄\n市設分事務所", "B": "乙記帳士登錄於臺中市 A 地址執業後,因記帳士事務所搬遷至臺中市 B 地址,應於搬遷之日起 30\n日內向原登錄機關申報備查", "C": "丙曾任財政部臺北國稅局稅務員,其自該局離職之日起 3 年內,不得於臺北市登錄執行記帳士業務", "D": "丁記帳士經財政部廢止記帳士證書,應註銷登錄"}, "answer": "A", "note": ""}, {"id": "bookkeeping-111-25", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 25, "question": "財政部查獲張三未通過記帳士考試,且非屬依法登錄得繼續執行業務之記帳及報稅代理人,卻擅自幫\n營業人辦理營業稅申報,其於本次遭查獲前,業經財政部以相同事由裁處罰鍰 3 次,本次(第 4 次)\n再被查獲,應如何處罰?", "options": {"A": "裁處罰鍰新臺幣 3 萬元以上、15 萬元以下", "B": "移送刑責", "C": "移送強制執行", "D": "交付記帳士懲戒委員會懲戒"}, "answer": "B", "note": ""}, {"id": "bookkeeping-111-26", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 26, "question": "下列何者非商業會計法第 43 條規定之存貨成本計算方法?", "options": {"A": "先進先出法", "B": "後進先出法", "C": "平均法", "D": "個別認定法"}, "answer": "B", "note": ""}, {"id": "bookkeeping-111-27", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 27, "question": "有關商業會計事務登帳之規定,下列敘述何者錯誤?", "options": {"A": "應依發生次序逐日登帳", "B": "至遲不超過 2 個月", "C": "明定會計事項之入帳時限,係為確保時效性", "D": "未按時登帳,目前並無相關罰則"}, "answer": "D", "note": ""}, {"id": "bookkeeping-111-28", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 28, "question": "關於記帳及編製報表基礎,稅法與商業會計法規定不相同時,商業之財務會計,應如何處理?", "options": {"A": "以稅法規定為準", "B": "以商業會計法為準", "C": "稅法或商業會計法擇一適用", "D": "稅法或商業會計法混合適用"}, "answer": "B", "note": ""}, {"id": "bookkeeping-111-29", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 29, "question": "除有未結會計事項者外,商業會計法規定會計帳簿應於年度決算程序辦理終了後,至少保存幾年?", "options": {"A": "5 年", "B": "10 年", "C": "15 年", "D": "20 年"}, "answer": "B", "note": ""}, {"id": "bookkeeping-111-30", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 30, "question": "記帳士參與財政部或財政部各地區國稅局舉辦座談會,就稅制及稅政提出相關建言,符合記帳士職業\n倫理道德規範下列那一項行為準則?", "options": {"A": "尊嚴", "B": "務實", "C": "專業", "D": "公正"}, "answer": "B", "note": ""}, {"id": "bookkeeping-111-31", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 31, "question": "記帳士應以尊嚴、謹慎及負責態度,依法令執行記帳士業務並持續進修,提升專業能力及服務品質,\n符合記帳士職業倫理道德規範下列那些行為準則?", "options": {"A": "尊嚴、品質", "B": "尊嚴、專業", "C": "誠正、專業", "D": "誠正、適任"}, "answer": "D", "note": ""}, {"id": "bookkeeping-111-32", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 32, "question": "關於公司登記效力之敘述,下列何者錯誤?", "options": {"A": "公司登記完成後,取得法人人格,可以為權利義務之主體", "B": "公司登記完成後取得使用公司名稱之專用權,他公司不得使用相同之公司名稱", "C": "公司登記完成後取得公司營業權,得以公司名義經營業務或為其他法律行為", "D": "股份有限公司改選董事,未向經濟部辦理變更登記,新任董事與公司間有償委任契約無效"}, "answer": "D", "note": ""}, {"id": "bookkeeping-111-33", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 33, "question": "關於公司登記,下列敘述何者正確?", "options": {"A": "股份有限公司除法令另有規定外,應於代表公司之負責人就任後 15 日內,向主管機關申請設立之\n登記", "B": "公司登記,其代理人以會計師為限", "C": "公司申請停業登記,其停業期間每次最長不得超過 6 個月", "D": "主管機關對於公司法各項登記之申請,認為有不合法定程式者,得逕予否准登記"}, "answer": "A", "note": ""}, {"id": "bookkeeping-111-34", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 34, "question": "商業登記法關於商業登記事項之規定,下列敘述何者錯誤?", "options": {"A": "商業登記法之適用對象為獨資或合夥方式經營之事業", "B": "民宿經營者免辦商業登記", "C": "商業所在地主管機關於資訊網站公告之商業登記事項,與登記不符者,以公告為準", "D": "某甲 16 歲,得檢附其法定代理人之同意書,登記為獨資商號負責人"}, "answer": "C", "note": ""}, {"id": "bookkeeping-111-35", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 35, "question": "關於商業登記事項之敘述,下列何者與商業登記法之規定相符:", "options": {"A": "因繼承所致之商業變更登記,應自繼承開始後 3 個月內辦理", "B": "乙獨資商號營業地址從桃園市遷移至嘉義縣,應向桃園市商業登記主管機關申請遷址登記", "C": "商業登記之申請,得委任代理人,代理人以律師、會計師及記帳士為限", "D": "商業終止營業時,應自事實發生之日起 15 日內,申請歇業登記"}, "answer": "D", "note": ""}, {"id": "bookkeeping-111-36", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 36, "question": "乙獨資商號營業地址設於桃園市,其商業登記主管機關及商業會計主管機關為何?", "options": {"A": "商業登記主管機關及商業會計主管機關均為經濟部", "B": "商業登記主管機關為經濟部、商業會計主管機關為桃園市政府", "C": "商業登記主管機關及商業會計主管機關均為桃園市政府", "D": "商業登記主管機關為桃園市政府、商業會計主管機關為經濟部"}, "answer": "C", "note": ""}, {"id": "bookkeeping-111-37", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 37, "question": "關於商業會計法規定之會計憑證,下列敘述何者錯誤:", "options": {"A": "會計憑證可分為原始憑證及記帳憑證", "B": "商業銷售貨物或勞務開立之統一發票為商業會計法規定之會計憑證", "C": "記帳憑證之內容應包括商業名稱、傳票名稱、日期、傳票號碼、會計項目名稱、摘要及金額,並經\n相關人員簽名或蓋章", "D": "記帳憑證應由代表商業之負責人簽名或蓋章,不得授權經理人、主辦或經辦會計人員簽名或蓋章"}, "answer": "D", "note": ""}, {"id": "bookkeeping-111-38", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 38, "question": "A 營造廠 111 年 5 月 10 日向未依法辦理登記之非法業者 B 購買礦石,因 B 無法給與原始憑證致未取\n得外來憑證,下列敘述何者正確?", "options": {"A": "A 營造廠應根據事實及金額作成憑證,由其負責人或該負責人指定人員簽名或蓋章,憑以記帳", "B": "A 營造廠未取得原始憑證,應依商業會計法第 78 條第 2 款規定,處新臺幣 1 萬元以上 10 萬元以\n下罰鍰", "C": "A 營造廠未取得進貨憑證,應依稅捐稽徵法第 44 條規定,按查明認定總額處 5%罰鍰", "D": "A 營造廠未取得進貨憑證係可歸責於非法業者 B 之因素,所以 A 營造廠未有應依相關法令處罰之\n問題"}, "answer": "A", "note": ""}, {"id": "bookkeeping-111-39", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 39, "question": "關於商業之會計帳簿,下列何者與商業會計法及商業會計處理準則之規定不符?", "options": {"A": "普通序時帳簿及總分類帳簿,為商業必須設置之會計帳簿;但會計制度健全,使用總分類帳會計項\n目日計表者,得免設普通序時帳簿", "B": "會計事項應按發生次序逐日登帳,至遲不得超過 2 個月", "C": "分類帳簿次頁應設置帳戶目錄", "D": "記帳錯誤如更正後影響總數者,應由更正人在原錯誤上劃紅線二道,將更正之數字或文字書寫於上\n並於更正處簽名或蓋章"}, "answer": "D", "note": ""}, {"id": "bookkeeping-111-40", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 40, "question": "依商業會計法及商業會計處理準則規定,應收帳款之衡量及列示,下列何者錯誤?", "options": {"A": "衡量應收帳款,應以扣除估計之備抵呆帳後餘額為準", "B": "應收帳款收回期間超過 1 年部分,應揭露各年度預期收回之金額", "C": "應收帳款已確定無法收回時,應以備抵呆帳沖轉", "D": "營業及非營業發生之應收帳款,得合併列示"}, "answer": "D", "note": ""}, {"id": "bookkeeping-111-41", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 41, "question": "依商業會計處理準則規定,下列會計項目,何者為流動負債?", "options": {"A": "應付公司債", "B": "付款期間在 1 年以上之應付票據", "C": "尚未支付之本期及前期所得稅", "D": "與應課稅暫時性差異有關之未來期間應付所得稅"}, "answer": "C", "note": ""}, {"id": "bookkeeping-111-42", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 42, "question": "商業會計法規定商業之決算,下列敘述何者錯誤?", "options": {"A": "採曆年制之商業,最遲應於每年 4 月 15 日之前完成決算", "B": "商業每屆決算應編製營業報告書及財務報表", "C": "決算報表應由代表商業之負責人、經理人及主辦會計人員簽名或蓋章負責", "D": "有分支機構之商業,於會計年度終了時,應將其本、分支機構之帳目合併辦理決算"}, "answer": "A", "note": ""}, {"id": "bookkeeping-111-43", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 43, "question": "採曆年制且適用商業會計法之甲合夥商號,其主辦會計人員對於該年度會計上之責任,於何時解除?", "options": {"A": "決算報表經代表甲合夥商號之負責人簽名或蓋章時", "B": "甲合夥商號負責人於該年度次年 6 月底前將商業之決算報表提請合夥人承認時", "C": "合夥人委託會計師審核決算報表完成時", "D": "甲合夥商號之決算報表獲得其合夥人承認,且主辦會計人員無不法或不正當行為時"}, "answer": "D", "note": ""}, {"id": "bookkeeping-111-44", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 44, "question": "商業會計處理準則規定之綜合損益表會計項目,下列敘述何者錯誤?", "options": {"A": "本期內因銷售商品或提供勞務等所獲得之收入,列為營業收入", "B": "營業成本及營業費用不能分別列示者,得合併為營業費用", "C": "利息收入及利息費用得互抵為利息收入或利息費用", "D": "兌換損益及處分投資損益,得以其淨額列示"}, "answer": "C", "note": ""}, {"id": "bookkeeping-111-45", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 45, "question": "下列何者非屬商業會計法之適用範圍?", "options": {"A": "財團法人私立學校", "B": "信用合作社", "C": "有限合夥組織", "D": "公司組織之公營事業"}, "answer": "A", "note": ""}, {"id": "bookkeeping-111-46", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 46, "question": "下列何者非商業會計法規定之商業負責人?", "options": {"A": "有限公司之董事", "B": "獨資組織之出資人或其法定代理人", "C": "公司清算期間之清算人", "D": "在我國境內營業之外國公司董事"}, "answer": "D", "note": ""}, {"id": "bookkeeping-111-47", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 47, "question": "商業會計法對財務報表會計項目之規定,下列何者錯誤?", "options": {"A": "商業得視事實需要,或依法律規定,將會計項目作適當之分類及歸併", "B": "前後期之會計項目分類要一致性,以利比較分析", "C": "應採二年度對照方式,以當年度及上年度金額併列比較", "D": "若本期會計項目分類與上期不一致時,應將本期會計項目修正成上期會計項目,以達到一致性"}, "answer": "D", "note": ""}, {"id": "bookkeeping-111-48", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 48, "question": "某商業於 111 年 12 月 20 日已決定發放員工年終獎金,惟至 112 年 1 月 16 日始發放,依商業會計法\n規定,年終獎金應帳列為那一年度之薪資費用?", "options": {"A": "111 年度", "B": "112 年度", "C": "由該商業負責人本於商業利益自行決定", "D": "報請主管機關核釋"}, "answer": "A", "note": ""}, {"id": "bookkeeping-111-49", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 49, "question": "商業會計法規定商業訂定其會計制度,應衡酌之事項,下列何者錯誤?", "options": {"A": "實際業務情形", "B": "會計事務之性質", "C": "同業競爭需要", "D": "內部控制及管理上之需要"}, "answer": "C", "note": ""}, {"id": "bookkeeping-111-50", "year": "111", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 50, "question": "關於無形資產之評價,下列何者錯誤?", "options": {"A": "購入無形資產,應以淨變現價值入帳", "B": "無形資產自行發展取得者,其後之研究發展支出,應作為當期費用。但中央主管機關另有規定者,\n不在此限", "C": "具有明確經濟效益期限之無形資產,應以合理有系統之方法分期攤銷", "D": "無形資產應以成本減除累計攤銷及累計減損後之帳面金額列示"}, "answer": "A", "note": ""}, {"id": "tax-111-1", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 1, "question": "依稅捐稽徵法規定,納稅義務人逾期繳納稅捐加徵滯納金者,每逾 1 日按滯納數額加徵 1%,總加徵\n率最高為 2 %。上述1、2分別為:", "options": {"A": "2、10", "B": "3、10", "C": "2、15", "D": "3、15"}, "answer": "B", "note": ""}, {"id": "tax-111-2", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 2, "question": "有關稅捐稽徵法新增之核課期間不完成事由,下列敘述何者錯誤?", "options": {"A": "核課期間屆滿後申請復查,自核定稅捐處分經訴願或行政訴訟撤銷須另為處分確定之日起算 1 年內", "B": "核課期間屆滿前 1 年內經訴願或行政訴訟撤銷須另為處分確定者,自核定稅捐處分經訴願或行政訴訟撤\n
