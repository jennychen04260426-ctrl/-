<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>記帳士歷屆｜練習與模擬測驗</title>
<style>
:root{--blue:#1d56a5;--blue2:#2875df;--ink:#152238;--muted:#68768c;--line:#d7e1ef;--bg:#f3f7fd;--good:#148a52;--bad:#c33f3f;--warn:#fff5df;}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink)}
.top{background:linear-gradient(120deg,#123e73,#245f9d);color:#fff;padding:24px 0}.wrap{width:min(1130px,92vw);margin:auto}
.brand{font-size:28px;font-weight:800;letter-spacing:.5px}.sub{margin-top:7px;font-size:14px;opacity:.88}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin:20px 0;box-shadow:0 7px 24px rgba(28,62,112,.055)}
h2{font-size:20px;margin:0 0 14px}.hint{font-size:13px;color:var(--muted)}
.subjects{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.subject-card{border:2px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;transition:.15s;background:#fff}.subject-card.active{border-color:#3479ff;background:#f3f8ff}.subject-card:hover{transform:translateY(-1px)}
.subject-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.subject-title{font-weight:800;font-size:18px}.count{font-size:28px;color:#1256b5;margin-top:12px}.count small{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}label{font-size:13px;font-weight:700;display:block;margin-bottom:6px}select,input{width:100%;padding:11px 12px;border:1px solid #cbd8ea;border-radius:10px;background:#fff;font-size:15px}
.checks{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.check{border:1px solid #d6e2f1;border-radius:10px;padding:9px 12px;font-size:14px}.check input{width:auto;margin-right:6px}
.rangebox{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;margin-top:10px}
.btns{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}button{border:1px solid #c8d7ea;background:#fff;color:#1a3559;border-radius:10px;padding:10px 15px;font-weight:800;cursor:pointer}button.primary{background:#2469e8;color:white;border-color:#2469e8}button.danger{color:#a4283d;border-color:#e4b7c0}button:hover{filter:brightness(.98)}
.statsbar{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:12px}.stat strong{color:var(--ink)}
.quiz{display:none}.quiz.active{display:block}.qtop{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:12px}.progress{height:9px;background:#e8eef7;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:#3479ff;width:0}.qtext{font-size:20px;line-height:1.65;margin:18px 0;font-weight:700}.meta{font-size:13px;color:var(--muted)}
.option{border:1.5px solid #d7e1ef;border-radius:12px;padding:13px 14px;margin:10px 0;cursor:pointer;line-height:1.5;background:#fff}.option:hover{border-color:#87aef1}.option.selected{border-color:#3479ff;background:#edf5ff}.option.correct{border-color:#51aa7d;background:#eefaf3}.option.wrong{border-color:#dd7777;background:#fff1f1}
.feedback{display:none;margin-top:14px;padding:14px;border-radius:12px;background:#f6f9fd;border:1px solid #d9e5f3}.feedback.show{display:block}.answer-good{color:var(--good);font-weight:900}.answer-bad{color:var(--bad);font-weight:900}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}.star{font-size:22px;border:0;background:transparent;padding:4px 8px}.star.on{color:#e59b00}
.tabs{display:flex;gap:8px;flex-wrap:wrap}.modal{display:none}.modal.active{display:block}table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}th,td{border-bottom:1px solid #e4ebf4;padding:10px;text-align:left}th{background:#f7f9fc}
.notice{background:var(--warn);color:#8a5600;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:15px}.empty{color:var(--muted);padding:22px;text-align:center}
@media(max-width:800px){.subjects{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.rangebox{grid-template-columns:1fr}.brand{font-size:22px}.qtext{font-size:18px}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.panel{padding:16px}}
button{font-size:1rem;min-height:44px}button:disabled{cursor:default;opacity:.58}.option{display:block;width:100%;text-align:left;font-weight:500}.option.correct,.option.wrong{opacity:1}.qtext,.option,.review p{white-space:pre-line;overflow-wrap:anywhere}.nav{flex-wrap:wrap}.review{border-top:1px solid var(--line);margin:1rem 0;padding-top:1rem}.review h3{font-size:1rem}.review ol{padding-left:2rem}.review dl{margin:0}.review dt{font-weight:700;margin-top:.6rem}.review dd{margin:0}.modal .panel{overflow-x:auto}.subject-card{font-size:1rem}.hint,.meta{font-size:.88rem}summary{margin:1rem 0;cursor:pointer}a{color:#1456b5}
.scan{display:block;margin:.75rem 0}.scan img{display:block;width:100%;height:auto;border:1px solid var(--line)}</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="brand">📚 記帳士歷屆｜練習與模擬測驗</div><div class="sub">民國 94–115 年 · 歷屆選擇題</div></div></header>
<main class="wrap">
<section id="home">
<div class="panel"><h2>選擇練習題庫 <span class="hint">（可複選）</span></h2>
<div class="subjects"><button class="subject-card active" aria-pressed="true" data-subject="accounting" onclick="toggleSubject(this)">會計學概要</button><button class="subject-card active" aria-pressed="true" data-subject="bookkeeping" onclick="toggleSubject(this)">記帳相關法規概要</button><button class="subject-card active" aria-pressed="true" data-subject="chinese" onclick="toggleSubject(this)">國文</button><button class="subject-card active" aria-pressed="true" data-subject="tax" onclick="toggleSubject(this)">稅務相關法規概要</button></div><div class="statsbar"><span class="stat">已選題庫：<strong id="selectedPool">100</strong> 題</span><span class="stat">錯題：<strong id="wrongCount">0</strong></span><span class="stat">收藏：<strong id="favCount">0</strong></span></div></div>

<div class="panel"><h2>測驗設定</h2><div class="grid">
<div><label>練習模式</label><select id="mode"><option value="practice">即時練習（答完看答案）</option><option value="exam">模擬考（交卷後看答案）</option></select></div>
<div><label>試題年度</label><select id="year"><option value="all">全部年度</option><option value="115" selected>民國 115 年</option><option value="114">民國 114 年</option><option value="113">民國 113 年</option><option value="112">民國 112 年</option><option value="111">民國 111 年</option><option value="110">民國 110 年</option><option value="109">民國 109 年</option><option value="108">民國 108 年</option><option value="107">民國 107 年</option><option value="106">民國 106 年</option><option value="105">民國 105 年</option><option value="104">民國 104 年</option><option value="103">民國 103 年</option><option value="102">民國 102 年</option><option value="101">民國 101 年</option><option value="100">民國 100 年</option><option value="99">民國 99 年</option><option value="98">民國 98 年</option><option value="97">民國 97 年</option><option value="96">民國 96 年</option><option value="95">民國 95 年</option><option value="94">民國 94 年</option></select></div>
<div><label>題目來源</label><select id="source"><option value="all">全部題目</option><option value="wrong">只出錯題</option><option value="fav">只出收藏題</option><option value="unseen">只出未作答題</option></select></div>
<div><label>出題題數</label><select id="count"><option>10</option><option>20</option><option>30</option><option>50</option><option value="all">全部符合題目</option></select></div>
<div><label>考試時間（分鐘）</label><select id="minutes"><option value="0">不限時</option><option value="30">30</option><option value="50">50</option><option value="60">60</option></select></div>
</div>
<div class="checks"><label class="check"><input id="shuffleQ" type="checkbox" checked>題目隨機排序</label><label class="check"><input id="shuffleO" type="checkbox">選項 A-D 隨機排列</label></div>
<div class="rangebox"><div><label>指定題號（可留空）</label><input id="range" placeholder="例如：1-10,15,20-25（會套用到已選科目）"></div><button onclick="document.getElementById('range').value='';refreshEligible()">清除題號</button></div>
<div class="btns"><button class="primary" onclick="startQuiz()">開始練習／測驗</button><button onclick="showView('history')">歷史成績</button><button onclick="showView('wrong')">錯題本</button><button onclick="showView('fav')">收藏題</button></div>
<div id="eligible" class="hint" style="margin-top:12px">符合條件：100 題</div><div class="notice">選擇題依考試年度的答案評分。作答紀錄儲存在此瀏覽器，免登入。申論及作文可在原卷區查閱。</div><details><summary>歷屆試題與答案原卷</summary><div id="papers"></div></details></div>
</section>

<section id="quiz" class="quiz"><div class="panel">
<div class="qtop"><div><strong id="qIndex">第 1 / 10 題</strong><div class="meta" id="qMeta"></div></div><div><span id="timer"></span><button id="favBtn" class="star" onclick="toggleFavCurrent()">☆</button></div></div>
<div class="progress"><div id="bar"></div></div><div class="qtext" id="qText"></div><div id="options"></div><p id="answered" role="status"></p><div id="feedback" class="feedback"></div>
<button onclick="leaveQuiz()">返回設定</button><button onclick="goUnanswered()">跳到未完成題</button><div class="nav"><button onclick="prevQ()">上一題</button><div><button id="submitOne" class="primary" onclick="submitCurrent()">確認答案</button> <button id="nextBtn" onclick="nextQ()">下一題</button></div></div>
</div></section>

<section id="view" class="modal"><div class="panel"><div class="qtop"><h2 id="viewTitle">紀錄</h2><button onclick="closeView()">返回首頁</button></div><div id="viewBody"></div></div></section>
</main>
<script>
const QUESTIONS=[{"id": "accounting-94-1", "year": "94", "subject": "accounting", "subjectName": "會計學概要", "number": 1, "question": "若預付費用於付現時以資產入帳,則其期末之調整分錄需:", "options": {"A": "借記費用", "B": "借記資產", "C": "貸記負債", "D": "貸記費用"}, "answer": "A", "note": ""}, {"id": "accounting-94-2", "year": "94", "subject": "accounting", "subjectName": "會計學概要", "number": 2, "question": "某公司銷貨相關科目之金額如下:\n銷貨收入 $200,000 銷貨折扣 $ 5,000\n銷貨退回與折讓 35,000 銷貨成本 120,000\n則該公司之毛利率應為何?", "options": {"A": "25%", "B": "75%", "C": "40%", "D": "60%"}, "answer": "A", "note": ""}, {"id": "accounting-94-3", "year": "94", "subject": "accounting", "subjectName": "會計學概要", "number": 3, "question": "賣方發出貸項通知單後,所作之分錄為:", "options": {"A": "借記:現金;貸記:銷貨退回與折讓", "B": "借記:應收帳款;貸記:銷貨", "C": "借記:銷貨退回與折讓;貸記:應收帳款", "D": "借記:銷貨;貸記:應收帳款"}, "answer": "C", "note": ""}, {"id": "accounting-94-4", "year": "94", "subject": "accounting", "subjectName": "會計學概要", "number": 4, "question": "甲、乙合夥人之損益分配比例為 6:4,在其資本帳戶餘額分別為甲$40,000、乙$25,000 時,丙經甲、乙\n兩人同意而投資$45,000 於合夥商店,並取得 1/4 之合夥權益。若商譽不入帳,則丙加入後,甲、乙、丙\n三人之資本額分別為:", "options": {"A": "$40,000;$25,000;$45,000", "B": "$50,500;$32,000;$27,500", "C": "$49,500;$33,000;$27,500", "D": "$48,750;$33,750;$27,500"}, "answer": "B", "note": ""}, {"id": "accounting-94-5", "year": "94", "subject": "accounting", "subjectName": "會計學概要", "number": 5, "question": "某公司有 6%、面額$50 之累積特別股 10,000 股以及面額$50 之普通股 20,000 股同時流通在外。若特別股\n已積欠一年股利,且本年宣告$96,000 之現金股利,則分配給特別股及普通股之股利分別是:", "options": {"A": "特別股$30,000,普通股$66,000", "B": "特別股$32,000,普通股$64,000", "C": "特別股$33,000,普通股$63,000", "D": "特別股$60,000,普通股$36,000"}, "answer": "D", "note": ""}, {"id": "accounting-94-6", "year": "94", "subject": "accounting", "subjectName": "會計學概要", "number": 6, "question": "發放股票股利及股票分割後,下列敘述何者錯誤?", "options": {"A": "均不影響股東權益總數", "B": "均使流通在外股數增加", "C": "均使股票面額減少", "D": "股東持股比率均不變"}, "answer": "C", "note": ""}, {"id": "accounting-94-7", "year": "94", "subject": "accounting", "subjectName": "會計學概要", "number": 7, "question": "某公司以$70,000 現金購入一筆土地及房屋,另外支付仲介佣金$5,000,並隨即花$7,000 拆除舊屋,以便\n在購入土地上蓋一辦公大樓,則土地總成本為:", "options": {"A": "$77,000", "B": "$70,000", "C": "$75,000", "D": "$82,000"}, "answer": "D", "note": ""}, {"id": "accounting-94-8", "year": "94", "subject": "accounting", "subjectName": "會計學概要", "number": 8, "question": "某公司本年度銷貨共計$900,000,其中$260,000 為現銷,該公司採用銷貨百分比法,估計壞帳率為 1%,\n調整前備抵壞帳貸餘$2,800,則本年度應提列壞帳費用若干?", "options": {"A": "$9,000", "B": "$6,400", "C": "$3,600", "D": "$2,600"}, "answer": "B", "note": ""}, {"id": "accounting-94-9", "year": "94", "subject": "accounting", "subjectName": "會計學概要", "number": 9, "question": "某公司本年壞帳沖銷與提列分錄如下:\n 備抵壞帳 1,000 \n 應收帳款 1,000 ------ (1) \n 壞帳費用 3,000 \n 備抵壞帳 3,000 ------ (2) \n前述兩分錄對應收帳款淨變現價值之影響分別為:", "options": {"A": "分錄(1):增加;分錄(2):減少", "B": "分錄(1):減少;分錄(2):減少", "C": "分錄(1):不變;分錄(2):不變", "D": "分錄(1):不變;分錄(2):減少"}, "answer": "D", "note": ""}, {"id": "accounting-94-10", "year": "94", "subject": "accounting", "subjectName": "會計學概要", "number": 10, "question": "若某公司期初存貨低估$1,300,期末存貨又低估$700,則當期淨利將會:", "options": {"A": "低估$600", "B": "低估$2,000", "C": "高估$600", "D": "高估$2,000"}, "answer": "C", "note": ""}, {"id": "accounting-94-11", "year": "94", "subject": "accounting", "subjectName": "會計學概要", "number": 11, "question": "某項存貨之成本為$600,重置成本$560,淨變現價值$656,淨變現價值減正常利潤為$620,則按成本與\n市價孰低法評價之存貨金額應為:", "options": {"A": "$656", "B": "$620", "C": "$600", "D": "$560"}, "answer": "C", "note": ""}, {"id": "accounting-94-12", "year": "94", "subject": "accounting", "subjectName": "會計學概要", "number": 12, "question": "甲公司與乙公司以其舊機器設備進行交換,且乙公司尚須支付甲公司$10,000,甲公司機器設備之原始成\n本為$100,000,累計折舊$60,000,公平價值$50,000;乙公司機器設備之原始成本為$100,000,累計折舊\n$40,000,公平價值$40,000。假設該交易符合同類資產交換之條件,則甲公司應認列資產交換損益之金額\n為:", "options": {"A": "不認任何資產交換損益", "B": "承認資產交換利益$10,000", "C": "承認資產交換利益$4,000", "D": "承認資產交換利益$2,000"}, "answer": "D", "note": ""}, {"id": "accounting-94-13", "year": "94", "subject": "accounting", "subjectName": "會計學概要", "number": 13, "question": "B 公司於 X1 年底以現金購買台北公司普通股 6,000 股,每股$18,並支付手續費$1,200 及證交稅$450,作\n為短期證券投資。X2 年 6 月收到每股$1 之現金股利,同年 7 月 10 日以每股$23 售出 3,000 股,支付手續\n費$800 及證交稅$350。則該公司有:", "options": {"A": "出售投資利得$32,050", "B": "出售投資利得$18,000", "C": "出售投資利得$13,025", "D": "出售投資利得$16,850"}, "answer": "C", "note": ""}, {"id": "accounting-94-14", "year": "94", "subject": "accounting", "subjectName": "會計學概要", "number": 14, "question": "甲公司於 X8 年 7 月 1 日以$97,000 購買面額$100,000,5 年期,利率為 6%之公司債作為長期債券投資。\n該公司債每年 7 月 1 日及 1 月 1 日付息。甲公司以直線法攤銷折價,則 X8 年 12 月 31 日攤銷公司債投資\n折價之會計處理為何?", "options": {"A": "借記公司債折價$300", "B": "借記公司債折價$600", "C": "借記長期債券投資$300", "D": "借記長期債券投資$600"}, "answer": "C", "note": ""}, {"id": "accounting-94-15", "year": "94", "subject": "accounting", "subjectName": "會計學概要", "number": 15, "question": "甲公司出售單價$10,000 之隨身聽 2,000 台,保固期為一年,估計維修率為 3%,每台平均修理費為$1,000。\n銷售當年有 40 台回廠修理,實際發生修理費用共計$40,000。則年底資產負債表上估計產品保證負債應為:", "options": {"A": "$0", "B": "$20,000", "C": "$60,000", "D": "$40,000"}, "answer": "B", "note": ""}, {"id": "accounting-94-16", "year": "94", "subject": "accounting", "subjectName": "會計學概要", "number": 16, "question": "下列敘述何者錯誤?", "options": {"A": "估計負債是指尚不能確定是否會發生之負債", "B": "訴訟案件可能敗訴之賠款屬於或有負債", "C": "預計三年內將支付之售後服務費用屬於估計負債", "D": "或有負債金額無法估計時,仍應於財務報表附註中揭露"}, "answer": "A", "note": ""}, {"id": "accounting-94-17", "year": "94", "subject": "accounting", "subjectName": "會計學概要", "number": 17, "question": "S 公司於 X4 年以每股$36 買回其面額為$1 之普通股 6,000 股,X5 年度 S 公司再以每股$50 發行 3,000 股\nX4 年買回之股份,S 公司採成本法處理庫藏股票交易,則 S 公司於 X5 年度記錄再發行庫藏股票時所使\n用之帳戶及金額分別為何?\n 庫藏股票 資本公積─庫藏股票交易 保留盈餘 普通股股本", "options": {"A": "$102,000 $ 42,000 $6,000", "B": "$144,000 $6,000", "C": "$108,000 $ 42,000", "D": "$108,000 $ 42,000"}, "answer": "C", "note": ""}, {"id": "accounting-94-18", "year": "94", "subject": "accounting", "subjectName": "會計學概要", "number": 18, "question": "甲公司有投入資本共計$600,000,保留盈餘$200,000。股本中包含面額$10 之普通股 5,000 股,面額$100\n之特別股 1,000 股。特別股贖回價格$105,積欠股利$60,000,試問普通股每股帳面價值多少?", "options": {"A": "$127", "B": "$128", "C": "$139", "D": "$140"}, "answer": "A", "note": ""}, {"id": "accounting-94-19", "year": "94", "subject": "accounting", "subjectName": "會計學概要", "number": 19, "question": "應付公司債溢價之攤銷會使:", "options": {"A": "利息收入增加", "B": "利息收入減少", "C": "利息費用增加", "D": "利息費用減少"}, "answer": "D", "note": ""}, {"id": "accounting-94-20", "year": "94", "subject": "accounting", "subjectName": "會計學概要", "number": 20, "question": "當資本支出被誤記為費用支出時,對當年度財務報表的影響為:", "options": {"A": "淨利少計,資產少計", "B": "淨利少計,資產多計", "C": "淨利多計,資產少計", "D": "淨利多計,資產多計"}, "answer": "A", "note": ""}, {"id": "accounting-94-21", "year": "94", "subject": "accounting", "subjectName": "會計學概要", "number": 21, "question": "丙公司有關製造成本之資料如下:\n期初原料存貨 $ 50,000 本期進料 $250,000\n期初在製品存貨 80,000 直接人工 150,000\n期末原料存貨 40,000 製造費用 140,000\n期末在製品存貨 100,000 \n則其製成品成本為何?", "options": {"A": "$540,000", "B": "$520,000", "C": "$530,000", "D": "$550,000"}, "answer": "C", "note": ""}, {"id": "accounting-94-22", "year": "94", "subject": "accounting", "subjectName": "會計學概要", "number": 22, "question": "試辨別直接原料是否屬於下列三項成本?\n加工成本 製造成本 主要成本", "options": {"A": "是 是 否", "B": "否 是 是", "C": "是 是 是", "D": "否 否 否"}, "answer": "B", "note": ""}, {"id": "accounting-94-23", "year": "94", "subject": "accounting", "subjectName": "會計學概要", "number": 23, "question": "取得一建築物,部分買價係支付現金,餘額則發行一張抵押應付票據給賣方。於現金流量表中,對於上\n列交易投資活動之表達金額為:", "options": {"A": "現金之支付金額", "B": "取得價格", "C": "$ 0", "D": "抵押票據之金額"}, "answer": "A", "note": ""}, {"id": "accounting-94-24", "year": "94", "subject": "accounting", "subjectName": "會計學概要", "number": 24, "question": "丁公司淨利對資產總額的比率為 10%,淨利加利息費用的和對資產總額的比率為 13%,股東權益總額對\n負債比率為 8 比 3,如負債總額為$150,000,又全部負債均須負擔某一固定比率的利息,則當年度的利息\n費用為:", "options": {"A": "$5,000", "B": "$16,500", "C": "$25,000", "D": "$55,000"}, "answer": "B", "note": ""}, {"id": "accounting-94-25", "year": "94", "subject": "accounting", "subjectName": "會計學概要", "number": 25, "question": "甲公司本益比為 10,股利支付率為 75%,今知每股股利為$3,則普通股每股市價應為多少?", "options": {"A": "$22.5", "B": "$30", "C": "$40", "D": "$50"}, "answer": "C", "note": "", "explanation": {"reason": "每股發出 3 元股利占每股盈餘的 75%，所以每股盈餘是 3 ÷ 75%＝4 元。本益比為 10，因此每股市價為 4 × 10＝40 元。", "terms": "股利支付率是每股股利占每股盈餘的比例。本益比是每股市價相對於每股盈餘的倍數。", "formulas": "每股盈餘＝每股股利 ÷ 股利支付率。每股市價＝每股盈餘 × 本益比。"}}, {"id": "bookkeeping-94-1", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 1, "question": "記帳士受申誡處分三次以上者,應另行那一項處分?", "options": {"A": "除名", "B": "停止執行業務", "C": "罰鍰", "D": "警告"}, "answer": "B", "note": ""}, {"id": "bookkeeping-94-2", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 2, "question": "當記帳士受委任時,得在登錄區域內,執行下列那些業務:辦理營業、變更、註銷、停業、復業及其\n他登記事項 辦理各項稅捐稽徵案件之申報及申請 稅務諮詢 辦理商業會計事務 各項稅捐\n之查核簽證申報 訴願、行政訴訟", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "D", "note": ""}, {"id": "bookkeeping-94-3", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 3, "question": "記帳士執行業務之區域,是其登記開業之那一個地理區域?", "options": {"A": "直轄市、縣市", "B": "鄉鎮", "C": "全國", "D": "各國稅局總局轄區"}, "answer": "A", "note": ""}, {"id": "bookkeeping-94-4", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 4, "question": "記帳士執行業務時,應依循那個機關的法令規定來辦理?", "options": {"A": "財政部", "B": "經濟部", "C": "記帳士法的主管機關", "D": "業務事件主管機關"}, "answer": "D", "note": ""}, {"id": "bookkeeping-94-5", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 5, "question": "在記帳士法施行前已從事記帳及報稅代理業務的人,得自記帳士法施行之日起登錄並繼續執業之條件,\n有以下那幾項:從事記帳及報稅代理業務,滿 3 年 在從事記帳及報稅的 3 年,均在報稅時報繳該\n項執行業務所得 加入稅務會計職業工會,成為其會員 修滿專業訓練時數,且經考評合格 設\n立記帳及報稅代理業務人事務所", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "B", "note": ""}, {"id": "bookkeeping-94-6", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 6, "question": "外國人如要充任記帳士,從事記帳士業務,依目前法令,要採下列那一種方式?", "options": {"A": "先透過外交協商,向財政部申請認許", "B": "先參加記帳士考試及格,再據以取得證書,加入公會", "C": "向經濟部申請執照", "D": "經外交協商,由外交部通知財政部頒發證書"}, "answer": "B", "note": ""}, {"id": "bookkeeping-94-7", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 7, "question": "記帳士若受記帳士法所定之除名處分時,不得充任記帳士,已充任者,則:", "options": {"A": "撤銷或廢止其記帳士證書", "B": "移送法院", "C": "處以罰鍰", "D": "勒令停業"}, "answer": "A", "note": ""}, {"id": "bookkeeping-94-8", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 8, "question": "會計人員於編製財務報表時,應依商業會計法第 31 條之規定,前後期間所使用之科目須一致。這條規定\n的主要目的,乃為達成:", "options": {"A": "時效性", "B": "可驗證性", "C": "忠實表達", "D": "可比較性"}, "answer": "D", "note": ""}, {"id": "bookkeeping-94-9", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 9, "question": "下列諸原始憑證中,那一種不是由商業自行編製?", "options": {"A": "銷貨發票", "B": "領料單", "C": "計工單", "D": "進貨發票"}, "answer": "D", "note": ""}, {"id": "bookkeeping-94-10", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 10, "question": "會計人員離(調)職時,須辦理交代,至於須把交代辦好的時間,是離(調)職後的幾日?", "options": {"A": "5 日內", "B": "1 週內", "C": "10 日內", "D": "1 個月內"}, "answer": "A", "note": ""}, {"id": "bookkeeping-94-11", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 11, "question": "台北公司在今年以一筆定期存款做質押品,向銀行借款,至於該筆存款所擔保之借款,被台北公司歸屬\n為短期負債。在台北公司資產負債表上,該筆存款應如何表達?", "options": {"A": "現金", "B": "短期投資", "C": "其他流動資產", "D": "其他資產"}, "answer": "C", "note": ""}, {"id": "bookkeeping-94-12", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 12, "question": "張三未依法取得代他人處理會計事務之資格,而擅自代他人處理商業會計事務,且續犯。張三將被處那\n一種罰?", "options": {"A": "處新台幣 15 萬元以下罰鍰", "B": "處 1 年以下有期徒刑、拘役或併科新台幣 15 萬元以下之罰金", "C": "處新台幣 15 萬元以下罰金", "D": "處 1 年以下有期徒刑、拘役或科或併科新台幣 15 萬元以下罰金"}, "answer": "D", "note": ""}, {"id": "bookkeeping-94-13", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 13, "question": "記帳士張三受 A 公司委託處理會計事務。因 A 公司財務經理李四的要求,張三在明知 A 公司全年的真實\n銷貨超過新台幣 3,000 萬元,所開立之統一發票卻遠遠不到新台幣 3,000 萬元之情況下,仍依照 A 公司所\n開立的統一發票填製記帳憑證,其目的在使 A 公司得適用擴大書審的制度。試問張三的這種行為,依商\n業會計法,可能應負何種法律責任?", "options": {"A": "因違法而處 5 年以下有期徒刑、拘役或科或併科新台幣 15 萬元以下罰金", "B": "視情況而定,不一定違法", "C": "視 A 公司的規模而定,若 A 公司的規模較小,則不違法,但若其資本額或營業額超過 3,000 萬元,則\n屬違法", "D": "違法,處新台幣 15 萬元以下罰鍰"}, "answer": "A", "note": ""}, {"id": "bookkeeping-94-14", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 14, "question": "94 年 11 月 18 日,逢稅公司董事長在未經董事會決議前,逕行開除該公司的會計主任張三(主辦會計人\n員),並新聘李四接替,其法律後果為:", "options": {"A": "不違法", "B": "視情況而定,若張三侵吞公款,並不違法,反之,則屬違法", "C": "違法,處新台幣 9 萬元以下罰鍰", "D": "視情況而定,若張三為董事長的近親,而董事長知悉張三有違私德的行為,即不違法,否則即屬違法"}, "answer": "C", "note": ""}, {"id": "bookkeeping-94-15", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 15, "question": "商業會計法立法主要目的,在於確保商業之會計資訊具備何種特性?", "options": {"A": "攸關性", "B": "可靠性", "C": "及時性", "D": "可比較性"}, "answer": "B", "note": ""}, {"id": "bookkeeping-94-16", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 16, "question": "企業編製決算報表之過程,如有不正當的行為,但決算報表在商業的出資人、合夥人或股東審核後,卻\n認為其屬確實,並予承認。這種承認能不能解除企業會計人員該年度在會計上之責任?", "options": {"A": "可以", "B": "視情況而定", "C": "不可", "D": "由主管機關決定"}, "answer": "C", "note": ""}, {"id": "bookkeeping-94-17", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 17, "question": "商業之利害關係人請求查閱商業的決算報表時,如利害關係人有正當理由,則代表商業之負責人於下列\n那一個情況下,應許其查閱?", "options": {"A": "不違反客觀原則之限度內", "B": "不違反商業利益之限度內", "C": "不違反成本效益原則之限度內", "D": "不違反重要性原則之限度內"}, "answer": "B", "note": ""}, {"id": "bookkeeping-94-18", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 18, "question": "甲公司於 93 年度所進行之下列會計處理,那一項為正確?", "options": {"A": "甲公司於 92 年度發生之火災損失$1,000,000,保險理賠於 93 年度方確定,扣除該理賠金$500,000 後,\n其餘$500,000 認列為 93 年度之損失", "B": "甲公司於 91 年因技術入股取得股權,於 93 年確定該技術專利權無價值,不得不放棄股權,因而認列\n為 93 年之損失", "C": "93 年自保留盈餘中提撥償債準備,認列為 93 年之費用", "D": "分配 93 年度之盈餘,將 93 年之股利認列為 93 年之費用"}, "answer": "B", "note": ""}, {"id": "bookkeeping-94-19", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 19, "question": "張三與李四合夥設立一家公司,張三將其名下一筆房地產充抵投資之資本。當時,該房子之土地公告現\n值及房屋現值合計$5,000,000,帳面價值$6,200,000,鑑價報告所指出之價值為$7,500,000,另外,出售該\n筆房地產,估計須耗$500,000。則張三之出資額為多少?", "options": {"A": "$5,000,000", "B": "$6,200,000", "C": "當鑑價報告可信時,為$7,500,000", "D": "當鑑價報告可信時,為$7,000,000"}, "answer": "C", "note": ""}, {"id": "bookkeeping-94-20", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 20, "question": "依商業會計法規定,商業於創業期間發生之發起人酬勞、律師、會計師公費、公司登記執照費、股東會\n費用、股票印製、股份招募及承銷等費用,應列入那一會計科目項下?", "options": {"A": "當期損益表上的開辦費", "B": "當期損益表上的損失", "C": "資產負債表上的商譽", "D": "資產負債表上的開辦費"}, "answer": "AD", "note": "答A或D者均給分,"}, {"id": "bookkeeping-94-21", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 21, "question": "台中公司係建設公司,有甲、乙、丙及丁四筆土地,其中甲土地是屬投資之性質,乙土地是目前總公司\n之所在地,丙土地準備供銷售之用,丁土地為 5 年後總公司預訂地,不打算作其他用途使用。依商業會\n計法第 51 條規定,那一塊土地得按公告現值調整?", "options": {"A": "甲、乙、丙及丁四塊土地都可以", "B": "乙土地", "C": "甲及丙二塊不是自己要用的土地", "D": "乙及丁二塊總公司要用的土地"}, "answer": "B", "note": ""}, {"id": "bookkeeping-94-22", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 22, "question": "依商業會計處理準則規定,催收帳款應依那一種基礎評價?", "options": {"A": "帳款之總金額", "B": "帳款之折現值", "C": "帳款之淨變現價值", "D": "銀行估定之價值"}, "answer": "C", "note": ""}, {"id": "bookkeeping-94-23", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 23, "question": "依現行商業會計法之規定,下列何者為商業必設之帳簿?", "options": {"A": "總分類帳", "B": "特種序時帳", "C": "明細分類帳", "D": "存貨明細帳、應收帳款明細帳及銀行存款明細帳"}, "answer": "A", "note": ""}, {"id": "bookkeeping-94-24", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 24, "question": "商業之原始憑證因意外事故毀損而另行繕製時,最好由何人負責?", "options": {"A": "由經辦會計負責繕製,由主辦會計負責證明", "B": "由商業負責人指定之人員負責繕製及證明", "C": "由經辦或主管該事項之人員負責繕製,由其主管證明", "D": "由經理人負責繕製,並由商業之負責人證明"}, "answer": "B", "note": "答B給分"}, {"id": "bookkeeping-94-25", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 25, "question": "丁公司以$1,000,000 購買機器設備一台,付現$500,000,餘款開立遠期支票支付。當丁公司採用人工進行\n會計處理時,應編製何種傳票?", "options": {"A": "現金收入傳票及轉帳傳票", "B": "現金支出傳票及轉帳傳票", "C": "現金支出傳票及現金收入傳票", "D": "現金支出傳票或現金收入傳票"}, "answer": "B", "note": ""}, {"id": "bookkeeping-94-26", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 26, "question": "商業之記帳憑證保管期限屆滿,經何人核准後方得銷毀?", "options": {"A": "主辦會計人員", "B": "經辦會計人員", "C": "記帳憑證保管人之直屬長官", "D": "代表商業之負責人"}, "answer": "D", "note": ""}, {"id": "bookkeeping-94-27", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 27, "question": "未依法取得記帳士資格,擅自執行從事記帳及報稅代理業務,除依記帳士法第 35 條第 1 項或其他法令規\n定得執行會計及報稅業務者外,應如何處置?", "options": {"A": "由財政部處罰鍰", "B": "移送法院偵辦", "C": "先由警察機關偵辦再移送法務部檢察署", "D": "由稅捐機關處罰金"}, "answer": "A", "note": ""}, {"id": "bookkeeping-94-28", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 28, "question": "在何種情況下,商業之記帳憑證得不檢附原始憑證,亦不須註明原始憑證是另外裝訂,未附於記帳憑證\n之後?", "options": {"A": "商業所進行之會計事項,是帳目之結算", "B": "商業所進行之事項,是貨物之出口,而有海關通報之資料", "C": "商業所進行之事項,是內銷,而有網路發票", "D": "商業所進行之事項,是向國稅局申報及繳納營利事業所得稅"}, "answer": "A", "note": ""}, {"id": "bookkeeping-94-29", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 29, "question": "公司有交易發生,其會計處理程序,有下列三項:登入帳簿 編製記帳憑證 取得或給予原始憑\n證。上述程序之先後次序為:", "options": {"A": "   →→", "B": "   →→", "C": "   →→", "D": "   →→"}, "answer": "C", "note": ""}, {"id": "bookkeeping-94-30", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 30, "question": "下列諸事項中,那一事項非屬須作成會計記錄之事項?", "options": {"A": "存貨跌價", "B": "匯率變動,造成公司發生匯兌損失", "C": "公司分配股息與紅利給股東", "D": "公司喪失重要客戶"}, "answer": "D", "note": ""}, {"id": "bookkeeping-94-31", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 31, "question": "甲公司 93 年度之員工年終獎金,待 94 年 1 月 10 日方製成印領清冊,於 1 月 15 日呈核,於 1 月 17 日發\n放。發放當天,甲公司所發放的金額,不是年終獎金的全額,而是扣除員工扣繳稅款後的淨額。依一般\n公認會計原則,年終獎金應於何時入帳?", "options": {"A": "決算日(93 年底)", "B": "實際支付日(94 年 1 月 17 日)", "C": "甲公司董事長核准發放年終獎金之日(94 年 1 月 15 日)", "D": "扣繳稅款之繳納日"}, "answer": "A", "note": ""}, {"id": "bookkeeping-94-32", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 32, "question": "依現行商業會計法之規定,當商業之支出超過多少金額時,不得使用現金,而應使用匯票、本票、支票、\n劃撥或其他經主管機關核定之支付工具或方法,並載明受款人。", "options": {"A": "新台幣$500,000", "B": "新台幣$1,000,000", "C": "新台幣$1,500,000", "D": "新台幣$2,000,000"}, "answer": "B", "note": ""}, {"id": "bookkeeping-94-33", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 33, "question": "下列有關記帳本位幣之諸陳述中,那一個為錯誤?", "options": {"A": "貿易公司可因業務實際需要,而以外國貨幣記帳及編製決算報表", "B": "股東得以外幣繳納股款,但公司須以新台幣記帳", "C": "公司得以美金報價,收受買主所支付之美金,但仍須以新台幣記帳", "D": "公司之財務報表得以新台幣與外幣併列之方式編製、表達"}, "answer": "A", "note": ""}, {"id": "bookkeeping-94-34", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 34, "question": "公司主辦會計人員之任、免,應由董事會採合議制來決議。其立法主要用意在於:", "options": {"A": "提昇會計人之素質", "B": "提高主辦會計之位階", "C": "避免發生經理人不法指揮,影響會計人員獨立作業之空間", "D": "設計完善會計制度"}, "answer": "C", "note": ""}, {"id": "bookkeeping-94-35", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 35, "question": "依商業會計法及記帳士法之規定,有資格代他人處理商業會計事務的人,除會計師及記帳士外,尚有那\n一種人員?", "options": {"A": "退休的資深稅務人員", "B": "取得丙級會計事務技術士證照的人", "C": "記帳及報稅代理業務人,惟其須經登錄,並完成專業訓練", "D": "取得內部稽核師或高級營業員執照的人"}, "answer": "C", "note": ""}, {"id": "bookkeeping-94-36", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 36, "question": "丁公司的資本額為新台幣$20,000,000,設在臺中市。其會計事務之主管機關為:", "options": {"A": "臺中市政府", "B": "經濟部中部辦公室", "C": "臺灣省中區國稅局", "D": "臺中市稅捐處"}, "answer": "A", "note": ""}, {"id": "bookkeeping-94-37", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 37, "question": "下列那一種行為屬商業會計事務之範疇?", "options": {"A": "加油站之加油員為客戶加油開立統一發票", "B": "會計師受託查核財務報表", "C": "記帳及報稅代理業務人代客記帳", "D": "驗收員開立驗收清單"}, "answer": "C", "note": ""}, {"id": "bookkeeping-94-38", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 38, "question": "凡營利事業,原則上均應依商業會計法的規定來處理會計事務,不過,有些營利事業可以不遵循商業會\n計法的規定。下列那些事業可優先適用其他法規之規範?", "options": {"A": "小規模的公司", "B": "小規模的典當業", "C": "合於中小企業條例所定義的中小企業", "D": "免用統一發票之小規模合夥或獨資"}, "answer": "D", "note": ""}, {"id": "bookkeeping-94-39", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 39, "question": "公開發行公司所適用的會計原則及相關會計法令如右:商業會計法 證券交易法 公司法 商業\n會計處理準則 證券發行人財務報告編製準則 財務會計準則公報之解釋 財務會計準則公報 ;\n其適用之優先順序為:", "options": {"A": "       →→→→→→", "B": "       →→→→→→", "C": "       →→→→→→", "D": "       →→→→→→"}, "answer": "B", "note": ""}, {"id": "bookkeeping-94-40", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 40, "question": "因購置固定資產而依約預付之「預付購置設備款」,在資產負債表上應歸屬於那一個大項?", "options": {"A": "流動資產", "B": "長期投資", "C": "固定資產", "D": "預付款項"}, "answer": "C", "note": ""}, {"id": "bookkeeping-94-41", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 41, "question": "丙公司於 93 年 12 月 31 日在倉庫有一批存貨。該批存貨購入之成本為$100,000,原來的定價為$150,000,\n不過因陳舊過時,估計售價僅$30,000 而已,而且估計還須支付銷售費用$5,000,才能將該存貨賣出。則\n93 年 12 月 31 日此批存貨評價的金額應為多少?", "options": {"A": "$100,000", "B": "$150,000", "C": "$30,000", "D": "$25,000"}, "answer": "D", "note": ""}, {"id": "bookkeeping-94-42", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 42, "question": "乙公司係汽車經銷商,向汽車廠購入 A 汽車一輛。該汽車原準備供銷售之用,惟今轉供乙公司自用。A\n汽車應帳列在那個會計科目之下?", "options": {"A": "運輸設備", "B": "汽車存貨", "C": "長期投資-汽車", "D": "其他資產-汽車"}, "answer": "A", "note": ""}, {"id": "bookkeeping-94-43", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 43, "question": "甲公司有一批機器設備於 93 年 12 月 31 日耐用年限屆滿,殘值$200,000,但預估尚可使用 2 年,屆時之殘\n值為$20,000。若甲公司於 94 年 1 月 1 日繼續使用該批機器設備,則依商業會計處理準則第 17 條規定,甲\n公司於 94 年 12 月 31 日應提列之折舊費用為多少?", "options": {"A": "不得再提折舊", "B": "如採直線法,為$90,000", "C": "如採加速折舊法,為$100,000", "D": "如採直線法,為$200,000"}, "answer": "B", "note": ""}, {"id": "bookkeeping-94-44", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 44, "question": "就我國公司之設立而言,公司須經登記始能成立,因此,公司之設立登記係採行那一種主義?", "options": {"A": "登記對抗主義", "B": "實質課稅主義", "C": "登記要件主義", "D": "保守主義"}, "answer": "C", "note": ""}, {"id": "bookkeeping-94-45", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 45, "question": "代表公司之負責人若未依規定,於申請的期限內辦理登記,除由主管機關責令限期改正外,尚應處多少\n錢的罰鍰?", "options": {"A": "新台幣 9 萬元", "B": "新台幣 l 萬元以上 5 萬元以下", "C": "新台幣 2 萬元以上 10 萬元以下", "D": "新台幣 15 萬元"}, "answer": "B", "note": ""}, {"id": "bookkeeping-94-46", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 46, "question": "依公司法第 393 條第 2 項規定,主管機關應予公開之公司登記事項,不包括下列那一項?", "options": {"A": "執行業務或代表公司之股東", "B": "公司主要客戶", "C": "董事、監察人姓名及持股", "D": "資本總額或實收資本額"}, "answer": "B", "note": ""}, {"id": "bookkeeping-94-47", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 47, "question": "外國公司欲於我國境內從事營業活動者,須向經濟部商業司作下列何種申請?", "options": {"A": "外國公司之設立登記", "B": "分公司之設立登記", "C": "外國公司之認許", "D": "外國公司之認許及分公司之設立登記"}, "answer": "D", "note": ""}, {"id": "bookkeeping-94-48", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 48, "question": "甲公司董事長故意要會計人員多開立銷貨發票,讓收入增加,使帳列獲利提高。請問會計人員的這種行\n為是否違法?", "options": {"A": "視情況而定,若甲公司是為了爭取上市上櫃的核准,屬違法;反之,若甲公司是為了取得銀行之貸款,\n則不違法", "B": "視情況而定,若甲公司的董事長給予會計人員額外報酬,且會計人員接受,則屬違法,否則並不違法", "C": "視情況而定,若甲公司的會計人員曾表示反對,且留下證據,則不違法,否則即屬違法", "D": "違法,並得科新台幣 15 萬元以下罰金"}, "answer": "D", "note": ""}, {"id": "bookkeeping-94-49", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 49, "question": "電腦軟體公司設計欲用於出售的電腦軟體,在建立技術可行性以前所發生之成本,應作為:", "options": {"A": "研究發展費用", "B": "電腦軟體成本", "C": "存貨成本", "D": "遞延資產"}, "answer": "A", "note": ""}, {"id": "bookkeeping-94-50", "year": "94", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 50, "question": "以下諸陳述中,何者為真?", "options": {"A": "記帳士在代企業辦理變更登記時,須與委任企業訂立委任書;但辦理商業會計事務時,則得不訂立", "B": "記帳士在代企業辦理商業會計事務時,須與委任企業訂立委任書;但在辦理變更登記時,則得不訂立", "C": "記帳士在代企業辦理商業會計事務時,得不與委任企業訂立委任書;但在辦理變更登記時,亦得不訂立", "D": "記帳士在代企業辦理商業會計事務時,須與委任企業訂立委任書,在辦理變更登記時,亦須訂立"}, "answer": "D", "note": ""}, {"id": "chinese-94-1", "year": "94", "subject": "chinese", "subjectName": "國文", "number": 1, "question": "子貢問孝。子曰:「色難。」意謂:", "options": {"A": "為人子者勿使父母蒙羞。", "B": "為人子者要多注意父母的飲食起居。", "C": "為人子者要發自內心敬愛父母。", "D": "要讓父母臉色好很困難。"}, "answer": "C", "note": ""}, {"id": "chinese-94-2", "year": "94", "subject": "chinese", "subjectName": "國文", "number": 2, "question": "下列敘述,正確的選項是:", "options": {"A": "「令媛」品學兼優,冠於儕輩。", "B": "李家父子真是一對「賢昆仲」。", "C": "「賢伉儷」真可說是手足情深。", "D": "「舍姊」今夏將往美國留學。"}, "answer": "A", "note": ""}, {"id": "chinese-94-3", "year": "94", "subject": "chinese", "subjectName": "國文", "number": 3, "question": "下列成語歷史故事,成語主角不正確的選項是:", "options": {"A": "完璧歸趙—藺相如", "B": "單刀赴會—關羽", "C": "馬革裹屍—馬援", "D": "指鹿為馬—曹操"}, "answer": "D", "note": ""}, {"id": "chinese-94-4", "year": "94", "subject": "chinese", "subjectName": "國文", "number": 4, "question": "下列成語何者非形容美妙樂音:", "options": {"A": "響遏行雲", "B": "鼓舌如簧", "C": "乳燕歸巢", "D": "陽春白雪"}, "answer": "B", "note": ""}, {"id": "chinese-94-5", "year": "94", "subject": "chinese", "subjectName": "國文", "number": 5, "question": "「魚游於沸鼎之中,燕巢於飛幕之上」意喻:", "options": {"A": "處境之危殆", "B": "隨遇而安之樂", "C": "民生窮困", "D": "明知故犯"}, "answer": "A", "note": ""}, {"id": "chinese-94-6", "year": "94", "subject": "chinese", "subjectName": "國文", "number": 6, "question": "下列引號中的「樹」字,何者作「種植」解釋?", "options": {"A": "驕慢容易「樹」敵", "B": "「樹」欲靜而風不止", "C": "「樹」大招風,名高謗隨", "D": "十年「樹」木,百年樹人"}, "answer": "D", "note": ""}, {"id": "chinese-94-7", "year": "94", "subject": "chinese", "subjectName": "國文", "number": 7, "question": "下列柬帖用語,何者錯誤?", "options": {"A": "「弄瓦」用於生女之喜", "B": "「歸寧」用於新娘回門酒宴", "C": "「桃觴」用於滿月酒席", "D": "「嘉禮」用於婚宴"}, "answer": "C", "note": ""}, {"id": "chinese-94-8", "year": "94", "subject": "chinese", "subjectName": "國文", "number": 8, "question": "「君子懷刑,小人懷惠」此話意謂:", "options": {"A": "君子心存禮法,小人思得恩惠。", "B": "在上位者心存道德,平民百姓唯利是圖。", "C": "君子欲留名天下,小人欲沽名釣譽。", "D": "在上位者立法周全,平民百姓受惠良多。\n94年專門職業及技術人員高等考試建築師、技師考試暨普通考\n試不動產經紀人、地政士、記帳士考試試題 代號:40310\n等 別: 普通考試\n類 科: 記帳士\n科 目: 國文(作文與測驗) \n全一張\n(背面)"}, "answer": "A", "note": ""}, {"id": "chinese-94-9", "year": "94", "subject": "chinese", "subjectName": "國文", "number": 9, "question": "下列各組成語,何者義不相近?", "options": {"A": "欲罷不能/發憤忘食", "B": "蓴羮鱸膾/琅琅上口", "C": "疑信相參/虛虛實實", "D": "兵馬倥傯/烽火漫天"}, "answer": "B", "note": ""}, {"id": "chinese-94-10", "year": "94", "subject": "chinese", "subjectName": "國文", "number": 10, "question": "下列文句何者語意不具有因果關係?", "options": {"A": "十步之內必有芳草", "B": "學而不思則罔", "C": "舉直錯諸枉,能使枉者直", "D": "玉不琢不成器\n閱讀下文,回答"}, "answer": "A", "note": ""}, {"id": "chinese-94-11", "year": "94", "subject": "chinese", "subjectName": "國文", "number": 11, "question": "至題。\n 趙將馬服君趙奢之妻,趙括之母也。秦攻趙,孝成王使括代廉頗為將。將行,\n括母上書言於王曰:「括不可使將。」王曰:「何以?」曰:「始妾事其父,父時\n為將,身所奉飯者以十數,所友者以百數。大王及宗室有所賜幣者,盡以與軍吏、\n士大夫。受命之日,不問家事。今括一旦為將,東向而朝軍吏,吏無敢仰視之。王\n所賜金帛,歸盡藏之,乃日視便利田宅可買者。王以為若其父乎?父子不同執心各\n異願勿遣」王曰:「母置之,吾計已決矣。」括母曰:「王終遣之,即有不稱,妾\n得無隨乎?」王曰:「不也。」括既行,代廉頗。三十餘日,趙兵果敗,括死軍覆。\n王以括母先言,故卒不加誅。(劉向《列女傳》)\n「趙將馬服君趙奢之妻,趙括之母也。」此句表明的意思是:", "options": {"A": "馬服君、趙奢、趙奢之妻、趙括之母是四個人。", "B": "馬服君、趙奢、趙奢之妻,趙括之母是一個人。", "C": "馬服君即趙奢之妻,與趙括之母是兩個人。", "D": "馬服君趙奢、趙奢之妻、趙括之母,實際上是兩個人。"}, "answer": "D", "note": ""}, {"id": "chinese-94-12", "year": "94", "subject": "chinese", "subjectName": "國文", "number": 12, "question": "「東向而朝軍吏」表明:", "options": {"A": "趙括在東邊,軍吏在西邊,趙括拜見軍吏們。", "B": "趙括在西邊,軍吏在東邊,趙括接受軍吏們的拜見。", "C": "趙括在東邊,軍吏在西邊,趙括讓軍吏們來拜見。", "D": "趙括在西邊,軍吏在東邊,趙括拜見軍吏們。"}, "answer": "B", "note": ""}, {"id": "chinese-94-13", "year": "94", "subject": "chinese", "subjectName": "國文", "number": 13, "question": "「父子不同執心各異願勿遣」,正確的標點:", "options": {"A": "父子不同執,心各異,願勿遣!", "B": "父子不同執心,各異願,勿遣!", "C": "父子不同,執心各異,願勿遣!", "D": "父子,不同執心,各異願,勿遣!"}, "answer": "C", "note": ""}, {"id": "chinese-94-14", "year": "94", "subject": "chinese", "subjectName": "國文", "number": 14, "question": "對「妾得無隨乎」一句的語譯,正確的選項是:", "options": {"A": "姬妾能不跟著去嗎?", "B": "我能夠不隨著受罰嗎?", "C": "我怎能不跟著他前往呢?", "D": "我莫非跟著受罰嗎?"}, "answer": "B", "note": ""}, {"id": "chinese-94-15", "year": "94", "subject": "chinese", "subjectName": "國文", "number": 15, "question": "下列不屬於括母能預見趙括必敗的根據的選項是:", "options": {"A": "受命之日,不問家事。", "B": "一旦為將,東向而朝軍吏,吏無敢仰視之。", "C": "王所賜金帛,歸盡藏之。", "D": "乃日視便利田宅可買者。"}, "answer": "A", "note": ""}, {"id": "tax-94-1", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 1, "question": "下列何項非屬所得稅課徵範圍?", "options": {"A": "在中華民國境內有住所,並經常居住中華民國境內之個人,有中華民國境內外來源所得者", "B": "在中華民國境內無住所,而於一課稅年度內在中華民國境內居留合計滿一百八十三天者,有中華民國\n來源所得者", "C": "營利事業總機構在中華民國境內,其中華民國境內外全部營利事業所得", "D": "營利事業總機構在中華民國境外,其中華民國境內之營利事業所得"}, "answer": "A", "note": ""}, {"id": "tax-94-2", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 2, "question": "個人稿費、版稅、樂譜、作曲、編劇、漫畫及講演鐘點費之收入免納所得稅限額為:", "options": {"A": "6 萬元", "B": "12 萬元", "C": "18 萬元", "D": "27 萬元"}, "answer": "C", "note": ""}, {"id": "tax-94-3", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 3, "question": "下列何項非屬免稅所得?", "options": {"A": "大專院校教師薪資", "B": "依國家賠償法規定取得之賠償金", "C": "勞工保險之保險給付", "D": "個人出售土地"}, "answer": "A", "note": ""}, {"id": "tax-94-4", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 4, "question": "94 年度申報 93 年度綜合所得稅每人每年免稅額為:", "options": {"A": "4.4 萬元", "B": "6 萬元", "C": "7.4 萬元", "D": "7.5 萬元"}, "answer": "C", "note": ""}, {"id": "tax-94-5", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 5, "question": "有關營利事業所得稅起徵額、課稅級距及累進稅率規定,下列敘述何者為誤?", "options": {"A": "全年課稅所得額在五萬元以下者,免徵營利事業所得稅", "B": "全年課稅所得額在十萬元以下者,就其全部課稅所得額課徵百分之十五", "C": "全年課稅所得額在十萬元以下者,就其全部課稅所得額課徵百分之十五。但其應納稅額不得超過營利\n事業課稅所得額超過五萬元以上部分之半數", "D": "超過十萬元以上者,就其超過額課徵百分之二十五"}, "answer": "B", "note": ""}, {"id": "tax-94-6", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 6, "question": "綜合所得稅最高累進稅率為:", "options": {"A": "25%", "B": "30%", "C": "40%", "D": "50%"}, "answer": "C", "note": ""}, {"id": "tax-94-7", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 7, "question": "納稅義務人購買自用住宅有兩棟,分別向金融機構借款支付利息 150,000 元及 250,000 元,另申報有儲蓄\n投資特別扣除額 70,000 元,則納稅義務人申報綜合所得稅時依法最有利可扣除自用住宅購屋借款利息金\n額為:", "options": {"A": "180,000 元", "B": "250,000 元", "C": "300,000 元", "D": "400,000 元"}, "answer": "A", "note": ""}, {"id": "tax-94-8", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 8, "question": "商品盤存之估價,以成本為準,計算方法之採用若未經稽徵機關核准,視為採用何種方法?", "options": {"A": "實際成本法", "B": "先進先出法", "C": "後進先出法", "D": "加權平均法"}, "answer": "D", "note": ""}, {"id": "tax-94-9", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 9, "question": "依稅法規定備抵呆帳應以應收帳款與應收票據餘額多少限度內酌量估列?", "options": {"A": "1%", "B": "3%", "C": "5%", "D": "由營利事業自訂"}, "answer": "A", "note": ""}, {"id": "tax-94-10", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 10, "question": "四月制會計年度的營利事業,其 94 年度(94 年 4 月 1 日至 95 年 3 月 31 日)暫繳申報之最後期限為:", "options": {"A": "94 年 9 月 30 日", "B": "94 年 10 月 31 日", "C": "94 年 12 月 31 日", "D": "95 年 5 月 31 日"}, "answer": "C", "note": ""}, {"id": "tax-94-11", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 11, "question": "適用勞動基準法之營利事業,報經社政主管機關核准者,每年度得在不超過該年度已付薪資總額多少限\n度內,提撥勞工退休準備金,並以費用列支?", "options": {"A": "2%", "B": "4%", "C": "8%", "D": "15%"}, "answer": "D", "note": ""}, {"id": "tax-94-12", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 12, "question": "營利事業於給付在中華民國居住之員工薪資時,應扣繳稅額不超過多少得免於扣繳?", "options": {"A": "600 元", "B": "1,000 元", "C": "2,000 元", "D": "3,000 元"}, "answer": "C", "note": ""}, {"id": "tax-94-13", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 13, "question": "綜合所得稅納稅義務人結算申報有短繳自繳稅款,經稽徵機關核定補繳稅款並按日加計利息,惟應加計\n之利息金額不超過多少可免予加計徵收?", "options": {"A": "100 元", "B": "500 元", "C": "1,000 元", "D": "1,500 元"}, "answer": "D", "note": ""}, {"id": "tax-94-14", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 14, "question": "依稅法規定應自他人取得之憑證及應給予他人憑證之存根或副本,應保存的年限為:", "options": {"A": "一年", "B": "二年", "C": "五年", "D": "十年"}, "answer": "C", "note": ""}, {"id": "tax-94-15", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 15, "question": "下列有關納稅義務之敘述何者為錯誤?", "options": {"A": "共有財產,設有管理人者,由管理人負納稅義務", "B": "共有財產,未設管理人者,由共有人各按其應有部分負納稅義務", "C": "公同共有財產,以全體公同共有人為納稅義務人", "D": "營利事業因合併而消滅時,其在合併前之應納稅捐,應由被消滅之營利事業負繳納之義務"}, "answer": "D", "note": ""}, {"id": "tax-94-16", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 16, "question": "納稅義務人對於因適用法令錯誤或計算錯誤溢繳之稅款得申請退還,其申請期限為:", "options": {"A": "自繳納之日起三年內提出", "B": "自繳納之日起五年內提出", "C": "自繳納期限屆滿之翌日起三年內提出", "D": "自繳納期限屆滿之翌日起五年內提出"}, "answer": "B", "note": ""}, {"id": "tax-94-17", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 17, "question": "納稅義務人因天災、事變或遭受重大財產損失,不能於法定期間內繳清稅捐者,得向稅捐稽徵機關申請\n延期或分期繳納,其延期或分期繳納不得逾多久期間?", "options": {"A": "六個月", "B": "一年", "C": "二年", "D": "三年"}, "answer": "D", "note": ""}, {"id": "tax-94-18", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 18, "question": "納稅義務人對於補繳核定稅捐之處分如有不服,依法可採行何種救濟途徑?", "options": {"A": "於規定繳納期間內,查對更正", "B": "於繳納期間屆滿翌日起算三十日內,申請復查", "C": "於核定稅額通知書送達後三十日內,提起訴願", "D": "於繳納期間屆滿翌日起算二個月內,提起行政訴訟"}, "answer": "B", "note": ""}, {"id": "tax-94-19", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 19, "question": "納稅義務人有下列何者情況時,應由稅捐稽徵機關移送法院強制執行?", "options": {"A": "應納稅捐於繳納期間屆滿三十日後仍未繳納者", "B": "已依規定申請復查者", "C": "對復查決定之應納稅額繳納半數,並依法提起訴願者", "D": "提供相當擔保,並依法提起訴願者"}, "answer": "A", "note": ""}, {"id": "tax-94-20", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 20, "question": "依規定設置帳簿而不依規定記載者,經通知限於一個月內依規定記載,期滿仍未依照規定記載者,應有\n的處罰為:", "options": {"A": "處新台幣三千元以上七千五百元以下罰鍰", "B": "處新台幣七千五百元以上一萬五千元以下罰鍰", "C": "處新台幣一萬五千元以上三萬元以下罰鍰", "D": "處停業處分"}, "answer": "B", "note": ""}, {"id": "tax-94-21", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 21, "question": "納稅義務人自動向稅捐稽徵機關補報並補繳所漏稅款者,凡屬未經檢舉、未經稽徵機關或財政部指定之\n調查人員進行調查之案件,下列何者敘述為錯誤?", "options": {"A": "免除稅捐稽徵法第四十一條至第四十五條之處罰", "B": "免除各稅法所定關於逃漏稅之處罰", "C": "免除補繳應納稅捐之加計利息", "D": "涉及刑事責任者得免除其刑"}, "answer": "C", "note": ""}, {"id": "tax-94-22", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 22, "question": "應由稅捐稽徵機關依稅籍底冊核定課徵之稅捐,其核課期間為五年,不包括下列何者?", "options": {"A": "地價稅", "B": "房屋稅", "C": "使用牌照稅", "D": "所得稅"}, "answer": "D", "note": ""}, {"id": "tax-94-23", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 23, "question": "下列何項屬進口貨物?", "options": {"A": "貨物自國外進入中華民國境內者", "B": "貨物自國外進入中華民國境內之免稅出口區內的外銷事業", "C": "貨物自國外進入中華民國境內之海關管理的保稅工廠", "D": "貨物自中華民國境內進入科學工業園區內的園區事業"}, "answer": "A", "note": ""}, {"id": "tax-94-24", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 24, "question": "下列有關稅捐核課期間起算之規定,何者敘述為正確?", "options": {"A": "依法應由納稅義務人申報繳納之稅捐,已在規定期間內申報者,自申報期間屆滿之翌日起算", "B": "依法應由納稅義務人申報繳納之稅捐,未在規定期間內申報繳納者,自申報日起算", "C": "由稅捐稽徵機關按稅籍底冊徵收之稅捐,自申報日起算", "D": "由稅捐稽徵機關按查得資料核定徵收之稅捐,自徵期屆滿之翌日起算"}, "answer": "D", "note": ""}, {"id": "tax-94-25", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 25, "question": "下列何者非屬免徵營業稅之貨物或勞務?", "options": {"A": "遠洋漁船", "B": "出售之土地", "C": "稻米之銷售", "D": "依特種稅額計算之營業人,銷售其非經常買進、賣出而持有之固定資產"}, "answer": "A", "note": ""}, {"id": "tax-94-26", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 26, "question": "依查定計算營業稅額之小規模營業人,購買營業上使用之貨物或勞務,取得載有營業稅額之憑證,並依\n規定申報者,得按其進項稅額多少範圍內,於查定稅額內扣減?", "options": {"A": "5%", "B": "10%", "C": "20%", "D": "25%"}, "answer": "B", "note": ""}, {"id": "tax-94-27", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 27, "question": "下列何者進項稅額非屬不得扣抵銷項稅額?", "options": {"A": "非供本業及附屬業務使用之貨物或勞務", "B": "酬勞員工個人之貨物或勞務", "C": "自用乘人小汽車", "D": "進口貨物"}, "answer": "D", "note": ""}, {"id": "tax-94-28", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 28, "question": "現行加值型營業稅徵收率為:", "options": {"A": "1%", "B": "5%", "C": "15%", "D": "25%"}, "answer": "B", "note": ""}, {"id": "tax-94-29", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 29, "question": "營業人申請營業登記事項有變更時,應於事實發生之日起幾日內向主管稽徵機關申請變更營業登記?", "options": {"A": "五日", "B": "十日", "C": "十五日", "D": "三十日"}, "answer": "C", "note": ""}, {"id": "tax-94-30", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 30, "question": "小規模營業人及其他經財政部規定免予申報銷售額之營業人,其營業稅稅率為:", "options": {"A": "0.1%", "B": "1%", "C": "2%", "D": "5%"}, "answer": "B", "note": ""}, {"id": "tax-94-31", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 31, "question": "營業人取得下列何項憑證不得扣抵銷項稅額?", "options": {"A": "載有營業稅額之統一發票", "B": "視為銷售貨物所自行開立載有營業稅額之統一發票", "C": "其他經財政部核定載有營業稅額之憑證", "D": "普通收據"}, "answer": "D", "note": ""}, {"id": "tax-94-32", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 32, "question": "營業人於營業稅申報之溢付稅額,下列何者無法退還?", "options": {"A": "因銷售適用零稅率貨物或勞務而溢付之營業稅", "B": "因銷售免稅貨物或勞務而溢付之營業稅", "C": "因取得固定資產而溢付之營業稅", "D": "因合併申請註銷登記者,其溢付之營業稅"}, "answer": "B", "note": ""}, {"id": "tax-94-33", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 33, "question": "下列有關營業稅申報規定何者為錯誤?", "options": {"A": "應以每二月為一期,於次期開始十五日內申報", "B": "適用零稅率者,得申請以每月為一期,於次月十五日前申報", "C": "改採每月為一期申報者,同一年度內不得變更", "D": "無銷售額者免申報"}, "answer": "D", "note": ""}, {"id": "tax-94-34", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 34, "question": "營業人漏開統一發票而遭停止營業處分者,須在一年內經查獲多少次?", "options": {"A": "一次", "B": "二次", "C": "三次", "D": "五次"}, "answer": "C", "note": ""}, {"id": "tax-94-35", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 35, "question": "營業人以貨物與他人交換貨物者,其銷售額應如何認定?", "options": {"A": "以換出或換入貨物之時價,從高認定", "B": "以換出或換入貨物之時價,從低認定", "C": "以換出貨物之時價認定", "D": "以換入貨物之時價認定"}, "answer": "A", "note": ""}, {"id": "tax-94-36", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 36, "question": "一般稅額計算營業人銷售貨物與非營業人,開立統一發票金額為 3,150 元,申報時下列何者為正確?", "options": {"A": "銷售額 3,150 元", "B": "銷售額 3,308 元", "C": "銷項稅額 150 元", "D": "銷項稅額 158 元"}, "answer": "C", "note": ""}, {"id": "tax-94-37", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 37, "question": "一般稅額計算營業人出租財產收有押金$1,260,000,該年 1 月 1 日郵政儲金匯業局之一年期定期存款利率\n為 2%,則營業人每月應設算之租金收入為:", "options": {"A": "2,000 元", "B": "2,100 元", "C": "2,205 元", "D": "2,520 元"}, "answer": "A", "note": ""}, {"id": "tax-94-38", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 38, "question": "營業人以其產製貨物轉供酬勞員工,成本$5,000,售價$10,000。下列敘述何者為正確?", "options": {"A": "免開立統一發票", "B": "有銷項稅額 500 元", "C": "有進項稅額 250 元", "D": "應認列職工福利 5,250 元"}, "answer": "B", "note": ""}, {"id": "tax-94-39", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 39, "question": "營利事業承包工程,有關工程損益之計算,下列何者應採完工比例法?", "options": {"A": "工期在一年以上", "B": "各期應收工程價款無法估計", "C": "履行合約所須投入成本與期末完工程度均無法估計", "D": "歸屬於合約之成本無法辨認"}, "answer": "A", "note": ""}, {"id": "tax-94-40", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 40, "question": "營利事業出售不動產,其所得歸屬年度,應以下列何者認定為準?", "options": {"A": "出售日", "B": "所有權移轉登記日期", "C": "實際交付日期", "D": "買賣契約日"}, "answer": "B", "note": ""}, {"id": "tax-94-41", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 41, "question": "下列有關兌換盈益之敘述,何者正確?", "options": {"A": "以實際發生之收益為準認列", "B": "因匯率調整而發生之帳面差額,應列為當年度之收益", "C": "以帳面增值轉作增資者,免併計其辦理增資年度之損益", "D": "因國外進貨,入帳與結匯匯率變動所產生之收益免列為當年度兌換盈益,但應調整其進貨成本"}, "answer": "A", "note": ""}, {"id": "tax-94-42", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 42, "question": "營利事業修繕或購置固定資產,耐用年限超過二年,而支出金額不超過多少者,得以其成本列為當年度\n費用?", "options": {"A": "一萬元", "B": "二萬元", "C": "五萬元", "D": "六萬元"}, "answer": "D", "note": ""}, {"id": "tax-94-43", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 43, "question": "營利事業經營外銷業務,取得外匯收入者,除依銷貨及進貨規定列支交際應酬費用外,並得在不超過當\n年度外銷收入多少範圍內,列支特別交際應酬費?", "options": {"A": "1%", "B": "2%", "C": "3%", "D": "5%"}, "answer": "B", "note": ""}, {"id": "tax-94-44", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 44, "question": "營利事業按月定額發給員工伙食代金,每人每月在下列何項標準範圍內,免視為員工之薪資所得?", "options": {"A": "包括加班誤餐費,最高以一千八百元為限", "B": "不包括加班誤餐費,最高以一千八百元為限", "C": "包括加班誤餐費,最高以一千元為限", "D": "不包括加班誤餐費,最高以一千元為限"}, "answer": "A", "note": ""}, {"id": "tax-94-45", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 45, "question": "下列何者未實現之費用及損失不予認定?", "options": {"A": "存貨跌價損失", "B": "產品售後服務保證負債", "C": "備抵呆帳", "D": "國外投資損失準備"}, "answer": "B", "note": ""}, {"id": "tax-94-46", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 46, "question": "在臺灣以新臺幣支付國外佣金者,應在不超過出口貨物價款多少範圍內取具國外代理商或代銷商名義出\n具之收據為憑予以認定?", "options": {"A": "百分之一", "B": "百分之二", "C": "百分之三", "D": "百分之五"}, "answer": "C", "note": ""}, {"id": "tax-94-47", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 47, "question": "營利事業為員工投保之團體壽險,由營利事業負擔之保險費,以營利事業或被保險員工及其家屬為受益\n人者,每人每月保險費在多少金額以內部分,免視為被保險員工之薪資所得?", "options": {"A": "一千元", "B": "二千元", "C": "三千元", "D": "五千元"}, "answer": "B", "note": ""}, {"id": "tax-94-48", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 48, "question": "現行營利事業新購置乘人小客車,依規定耐用年數計提折舊時,其實際成本以不超過多少金額為限?", "options": {"A": "100 萬元", "B": "150 萬元", "C": "250 萬元", "D": "350 萬元"}, "answer": "C", "note": ""}, {"id": "tax-94-49", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 49, "question": "現行綜合所得稅標準扣除額之規定為:", "options": {"A": "個人扣除 3.8 萬元", "B": "個人扣除 4.4 萬元", "C": "有配偶者扣除 6 萬元", "D": "有配偶者扣除 7.4 萬元"}, "answer": "B", "note": ""}, {"id": "tax-94-50", "year": "94", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 50, "question": "納稅義務人本人依法有受扶養親屬母及弟二人,申報保險費分別為 32,000 元、20,000 元及 25,000 元,其\n申報綜合所得稅時依法可扣除保險費金額為:", "options": {"A": "77,000 元", "B": "68,000 元", "C": "52,000 元", "D": "44,000 元"}, "answer": "D", "note": "答D給分"}, {"id": "accounting-95-1", "year": "95", "subject": "accounting", "subjectName": "會計學概要", "number": 1, "question": "評價應收帳款,若採帳款餘額百分比法為之,則當收回以前認定不能收取且已作沖銷分錄之帳款時,所\n作分錄將會:", "options": {"A": "減少流動資產", "B": "增加營運資金", "C": "間接減少當年淨利", "D": "增加備抵壞帳"}, "answer": "D", "note": ""}, {"id": "accounting-95-2", "year": "95", "subject": "accounting", "subjectName": "會計學概要", "number": 2, "question": "台東公司 93 年底應收帳款餘額$40,000,備抵壞帳$1,600。94 年度銷貨收入$300,000,銷貨退回$10,000\n,銷貨折讓$4,000,銷貨運費$13,000。94 年底應收帳款$60,000,提列壞帳調整前備抵壞帳$1,000(借餘)\n。公司採行銷貨淨額 1%計提壞帳,則 94 年底備抵壞帳餘額為:", "options": {"A": "$1,730 貸餘", "B": "$1,860 貸餘", "C": "$3,730 貸餘", "D": "$3,860 貸餘"}, "answer": "B", "note": ""}, {"id": "accounting-95-3", "year": "95", "subject": "accounting", "subjectName": "會計學概要", "number": 3, "question": "編製銀行調節表時,若採行自公司帳餘額調向銀行對帳單餘額之方式為之,則下列那一項將為加項:", "options": {"A": "在途存款", "B": "銀行手續費", "C": "未兌現支票", "D": "銀行已扣取公司長期貸款利息"}, "answer": "C", "note": ""}, {"id": "accounting-95-4", "year": "95", "subject": "accounting", "subjectName": "會計學概要", "number": 4, "question": "付款條件若為:立即付現扣 5%,否則買方開立 60 天期支票。此項付款條件之真實隱含利率多少?\n(請選最接近正確值的選項)(1 年以 365 天計算)", "options": {"A": "32.02%", "B": "30.42%", "C": "30.00%", "D": "31.58%"}, "answer": "A", "note": ""}, {"id": "accounting-95-5", "year": "95", "subject": "accounting", "subjectName": "會計學概要", "number": 5, "question": "現金內部控制意在防止收入現金以多報少,支付現金以少報多。下列何項會計處理最易在現金收支上留\n有漏洞可乘?", "options": {"A": "賖銷以未扣除可能折扣之總價入應收帳款帳", "B": "賖銷以扣除可能折扣之淨價入應收帳款帳", "C": "賖購以扣除可能折扣之淨價入應付帳款帳", "D": "賖銷以備抵法處理應收帳款"}, "answer": "B", "note": ""}, {"id": "accounting-95-6", "year": "95", "subject": "accounting", "subjectName": "會計學概要", "number": 6, "question": "從權責發生制的銷貨成本要調節到現金制的支付給供應商的貨款時,以下各選項何者為誤?", "options": {"A": "減期末存貨比期初存貨之減少金額", "B": "加應付帳款期末比期初之增加金額", "C": "減預付貨款期末比期初之減少金額", "D": "減因進貨所開應付票據期末比期初之增加金額"}, "answer": "B", "note": ""}, {"id": "accounting-95-7", "year": "95", "subject": "accounting", "subjectName": "會計學概要", "number": 7, "question": "期末未作機器設備折舊提列之調整分錄將導致:", "options": {"A": "資產高估,淨利高估及業主權益高估", "B": "資產高估,淨利低估及業主權益低估", "C": "資產低估,淨利低估及業主權益低估", "D": "資產低估,淨利高估及業主權益高估"}, "answer": "A", "note": ""}, {"id": "accounting-95-8", "year": "95", "subject": "accounting", "subjectName": "會計學概要", "number": 8, "question": "下列有關存貨的敘述何項有誤?", "options": {"A": "在先進先出法下,無論是採用永續盤存制或定期盤存制,期末存貨金額均會相同", "B": "永續盤存制比定期盤存制來得精確,但年底編製財務報表時仍須盤點方得正確存貨", "C": "永續盤存制下,採加權平均存貨成本流程,稱為移動加權平均法", "D": "在物價上漲期間,存貨成本流程採後進先出法之銷貨成本比先進先出法低"}, "answer": "D", "note": ""}, {"id": "accounting-95-9", "year": "95", "subject": "accounting", "subjectName": "會計學概要", "number": 9, "question": "會計數字重比較,故具可比較性便成為會計資訊的重要特性。當以實際成本與預算比較時,分析者應採\n用何種觀念方得以合理比較?", "options": {"A": "重大性原則", "B": "配合原則", "C": "彈性預算", "D": "固定預算"}, "answer": "C", "note": ""}, {"id": "accounting-95-10", "year": "95", "subject": "accounting", "subjectName": "會計學概要", "number": 10, "question": "存貨評價採成本市價孰低法時,所謂市價不可低於淨變現價值減正常利潤(下限)的理由在於:", "options": {"A": "為了不違反利益實現原則", "B": "為了不違反配合原則", "C": "為了不違反充分揭露原則", "D": "為了不致於在欲遵循穩健原則時,卻過度穩健"}, "answer": "D", "note": ""}, {"id": "accounting-95-11", "year": "95", "subject": "accounting", "subjectName": "會計學概要", "number": 11, "question": "下列各選項中何者不為成本分攤?", "options": {"A": "將聯合生產成本計算至各聯產品", "B": "將總管理處的費用計算至各下屬責任中心", "C": "將製造費用計算至各批次產品", "D": "將某成本中心所使用之設備折舊費用計算至該成本中心"}, "answer": "D", "note": ""}, {"id": "accounting-95-12", "year": "95", "subject": "accounting", "subjectName": "會計學概要", "number": 12, "question": "台北公司採永續盤存制,94 年底訂單乙張已出貨,卻未予入帳,該單售價$100,000,銷貨成本$60,000;\n惟 94 年底盤點存貨時該批商品未予列入存貨,承認「存貨盤虧」。以上錯誤及至 95 年初方被發現,則\n更正分錄應為:", "options": {"A": "借:應收帳款$100,000;貸:保留盈餘$100,000", "B": "借:應收帳款$100,000;貸:存貨$60,000;貸:保留盈餘$40,000", "C": "借:應收帳款$40,000;貸:保留盈餘$40,000", "D": "借:應收帳款$60,000;貸:保留盈餘$60,000"}, "answer": "A", "note": ""}, {"id": "accounting-95-13", "year": "95", "subject": "accounting", "subjectName": "會計學概要", "number": 13, "question": "台中公司於 93 年 1 月 1 日發行一年半期一次到期債券乙批,該債券面額$200,000,票面利率 2%,每半年\n付息一次,惟發行日當時市場利率 4%。請問台中公司 93 年 1 月 1 日所發行之債券為?", "options": {"A": "溢價發行", "B": "平價發行", "C": "折價發行", "D": "無法判斷"}, "answer": "C", "note": ""}, {"id": "accounting-95-14", "year": "95", "subject": "accounting", "subjectName": "會計學概要", "number": 14, "question": "台新公司於 95 年初發行面額$1,000,000,票面利率 2%之債券乙批,流通於市場,市場利率一直維持穩定\n,但近日中央銀行突宣布升息,市場利率升至 3%,請問升息會造成已發行流通債券市場交易價格:", "options": {"A": "上漲", "B": "下跌", "C": "不變", "D": "升息與已發行流通之債券市場交易價格無關"}, "answer": "B", "note": ""}, {"id": "accounting-95-15", "year": "95", "subject": "accounting", "subjectName": "會計學概要", "number": 15, "question": "下列各項何者不屬於資本公積?", "options": {"A": "保留盈餘", "B": "捐贈資本", "C": "股本溢價", "D": "出售庫藏股溢價"}, "answer": "A", "note": ""}, {"id": "accounting-95-16", "year": "95", "subject": "accounting", "subjectName": "會計學概要", "number": 16, "question": "台苗公司於 94 年底調整後結帳前發現公司存貨自 92 年底起每年均有錯誤,其錯誤情形如下:\n年度 92 93 94 \n錯誤 低估$3,000 高估$5,000 低估$4,000 \n請問此時應作何改正分錄?", "options": {"A": "借:存貨$4,000;貸:本期損益彙總$4,000", "B": "借:未分配盈餘$5,000;借:存貨$4,000;貸:本期損益彙總$9,000", "C": "借:本期損益彙總$4,000;貸:存貨$4,000", "D": "借:存貨$4,000;借:未分配盈餘$2,000;貸:本期損益彙總$6,000"}, "answer": "B", "note": ""}, {"id": "accounting-95-17", "year": "95", "subject": "accounting", "subjectName": "會計學概要", "number": 17, "question": "下列各選項中,那一項非為未分配盈餘之借方交易事項?", "options": {"A": "分配股息", "B": "前期損益更正", "C": "分配員工紅利", "D": "採成本法處理購入庫藏股票"}, "answer": "D", "note": ""}, {"id": "accounting-95-18", "year": "95", "subject": "accounting", "subjectName": "會計學概要", "number": 18, "question": "下列各項中何者不包含在損益表中列示?", "options": {"A": "董監事酬勞", "B": "處分資產損益", "C": "為取得專利權所作之研究發展成本", "D": "非常損益事項"}, "answer": "A", "note": ""}, {"id": "accounting-95-19", "year": "95", "subject": "accounting", "subjectName": "會計學概要", "number": 19, "question": "分析者可用財務比率觀察一企業之長期償債能力。下列各項何者可直接觀察長期償債能力?", "options": {"A": "流動比率", "B": "本益比", "C": "利息保障倍數", "D": "股東權益報酬率"}, "answer": "C", "note": ""}, {"id": "accounting-95-20", "year": "95", "subject": "accounting", "subjectName": "會計學概要", "number": 20, "question": "下列有關財務比率分析之各項敘述何者一定為誤?", "options": {"A": "所謂週轉率乃是以存量除以平均流量", "B": "純益率可用以觀察企業之獲利能力", "C": "流動比率可用以觀察流動性", "D": "資產報酬率可分解成資產週轉率×純益率"}, "answer": "A", "note": ""}, {"id": "accounting-95-21", "year": "95", "subject": "accounting", "subjectName": "會計學概要", "number": 21, "question": "台彰公司欲作機器投資,今在甲機與乙機之間作一選擇,已知二機耐用年限、產出產品等條件均相同,\n唯一不同之處在於成本。甲機買價$100,000;乙機買價$60,000。但甲機操作成本為每單位產品$5,而乙\n機則須每單位產品$7。請問應選用何機?", "options": {"A": "選用甲機", "B": "選用乙機", "C": "耐用年限內,總產量 20,000 單位以上選甲機,20,000 單位以下選乙機", "D": "耐用年限內,總產量 20,000 單位以上選乙機,20,000 單位以下選甲機"}, "answer": "C", "note": ""}, {"id": "accounting-95-22", "year": "95", "subject": "accounting", "subjectName": "會計學概要", "number": 22, "question": "下列有關分批成本制之敘述何者為誤?", "options": {"A": "製造費用分攤若採用作業基礎成本制,可能得到比採用全廠單一分攤制更為精確的成本數字", "B": "分批成本制適用於連續性大量生產單一產品之情境", "C": "加班津貼之發生若不可歸責於該批產品時應將此項加班津貼借記製造費用", "D": "在分批成本制下,若為接受訂單而設立生產批次,則製成品存貨通常依批次別設立明細帳"}, "answer": "B", "note": ""}, {"id": "accounting-95-23", "year": "95", "subject": "accounting", "subjectName": "會計學概要", "number": 23, "question": "台嘉公司承租機器一套,依其租約條件屬於資本租賃。故台嘉公司應:", "options": {"A": "將支付之租金作為費用處理", "B": "於租約開始時將各期租金的終值認列為機器資產", "C": "於租約開始時將各期租金的現值認列為租賃資產及租賃負債", "D": "將支付的租金作為營業收入的直接減項"}, "answer": "C", "note": ""}, {"id": "accounting-95-24", "year": "95", "subject": "accounting", "subjectName": "會計學概要", "number": 24, "question": "下列各選項何者屬估計負債?", "options": {"A": "應付所得稅", "B": "應付薪資", "C": "銷項稅額", "D": "應付租金"}, "answer": "A", "note": ""}, {"id": "accounting-95-25", "year": "95", "subject": "accounting", "subjectName": "會計學概要", "number": 25, "question": "下列各項有關負債之會計處理或表達,請問何項為誤?", "options": {"A": "或有損失,若其很有可能發生,且其金額可合理估計,應估計其金額並予入帳", "B": "或有損失,若其極少可能發生,且其金額可合理估計,可不入帳,可以附註揭露其存在、性質及金額", "C": "或有利得,若其很有可能發生,不應入帳", "D": "或有利得,若其極少可能發生,不應入帳,但可附註揭露"}, "answer": "D", "note": ""}, {"id": "bookkeeping-95-1", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 1, "question": "甲公司辦理公司登記,申請人於向主管機關登記後,發現有部分事項遺漏未登記,且係申請人自己漏未\n登記之事項,應如何處理?", "options": {"A": "須重新辦理登記", "B": "登記後,不再受理更正", "C": "應予罰款後,重新辦理登記", "D": "得申請更正"}, "answer": "ABD", "note": "答A或B或D者均給分"}, {"id": "bookkeeping-95-2", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 2, "question": "丙公司購入一批存貨成本$150,000,期末評價時發現僅有$120,000,請問會計上如何處理?", "options": {"A": "維持成本$150,000,註記時價$120,000", "B": "將成本降為$120,000,貸記存貨跌價損失", "C": "將成本降為$120,000,貸記備抵存貨跌價損失", "D": "將成本降為$120,000,貸記應付存貨跌價損失"}, "answer": "C", "note": ""}, {"id": "bookkeeping-95-3", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 3, "question": "依記帳士法之相關規定,以下各項敘述,那一項錯誤?", "options": {"A": "記帳士接受委任代理記帳士法第 13 條第 1 項各款業務,應與委任人訂立委任書", "B": "記帳士因懈怠或疏忽,致委任人遭受損害時,應負賠償責任", "C": "記帳士不可將執業證書出借", "D": "記帳士應付懲戒事件,由業務事件主管機關處理之"}, "answer": "D", "note": ""}, {"id": "bookkeeping-95-4", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 4, "question": "商業會計法對於「應收帳款」及「備抵呆帳」之評價,下列那一項錯誤?", "options": {"A": "其已確定為呆帳者,應以其所提備抵呆帳沖轉有關債權科目", "B": "備抵呆帳不足沖轉時,不足之數,不得列為當期損失列帳", "C": "各項債權之估價應以扣除估計之備抵呆帳後之餘額為準", "D": "因營業而發生之應收帳款,應與非因營業而發生之應收帳款分別列示"}, "answer": "B", "note": ""}, {"id": "bookkeeping-95-5", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 5, "question": "記帳士因違反記帳士法之規定,而受到懲戒時,被懲戒人對於記帳士懲戒委員會之決議不服者,得於決\n議書送達之翌日起 20 日內,向那一個單位請求覆審?", "options": {"A": "記帳士懲戒委員會", "B": "記帳士公會", "C": "記帳士懲戒覆審委員會", "D": "業務事件主管機關"}, "answer": "C", "note": ""}, {"id": "bookkeeping-95-6", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 6, "question": "政府制定記帳士法,其主要目的為何?", "options": {"A": "協助商業記帳、復查及行政訴訟事項", "B": "協助營利事業建立稅務簽證申報制度", "C": "培育企業鑑價人才", "D": "協助納稅義務人記帳及履行納稅義務"}, "answer": "D", "note": ""}, {"id": "bookkeeping-95-7", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 7, "question": "公司之解散,不向主管機關申請解散登記者,主管機關得依職權或依據那一個人之申請,廢止其登記?", "options": {"A": "少數股東", "B": "董事", "C": "監察人", "D": "利害關係人"}, "answer": "D", "note": ""}, {"id": "bookkeeping-95-8", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 8, "question": "依公司法受理公司名稱及所營事業預查、登記、查閱、抄錄及各種證明書等,應收取審查費、登記費、\n查閱費、抄錄費及證照費;有關其收取費額,是由那一個單位訂定?", "options": {"A": "財政部", "B": "經濟部", "C": "法務部", "D": "內政部"}, "answer": "B", "note": ""}, {"id": "bookkeeping-95-9", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 9, "question": "經申請登錄之記帳士,因原登錄事項有變更時,應自事實發生之日起幾日內,向原登錄之機關申報備查?", "options": {"A": "15 日", "B": "40 日", "C": "20 日", "D": "30 日"}, "answer": "D", "note": ""}, {"id": "bookkeeping-95-10", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 10, "question": "陳君經由考試取得記帳士資格,後來經由其他考試及格而服務公職,因故受到撤職之處分,停止任用期\n間因尚未屆滿,其已充任之記帳士資格是否受到影響?", "options": {"A": "撤銷或廢止其記帳士證書", "B": "不受影響", "C": "予以申誡處分", "D": "停止執行業務 2 月以上,2 年以下"}, "answer": "A", "note": ""}, {"id": "bookkeeping-95-11", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 11, "question": "下列何種情形經按規定撤銷或廢止記帳士證書者,於原因消滅後,仍不得依記帳士法之規定請領\n記帳士證書?", "options": {"A": "受破產之宣告尚未復權者", "B": "受禁治產之宣告尚未撤銷者", "C": "受記帳士法所定除名處分者", "D": "經公立醫院證明有精神病者"}, "answer": "C", "note": ""}, {"id": "bookkeeping-95-12", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 12, "question": "記帳士於執行業務前,應向那一個單位申請登錄?", "options": {"A": "各縣市、直轄市政府", "B": "記帳士法之主管機關", "C": "各縣市稅務代理人協會", "D": "記帳士公會"}, "answer": "B", "note": ""}, {"id": "bookkeeping-95-13", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 13, "question": "記帳士法規定記帳士不得為下列那些行為?以不正當方法招攬業務 辦理各項稅捐稽徵案件之申報\n及申請 對於受委任事件,廢弛其業務上應盡之業務 幫助或教唆他人逃漏稅捐 各項稅捐之查\n核簽證申報 將執業證書出租或出借:", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "A", "note": ""}, {"id": "bookkeeping-95-14", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 14, "question": "依記帳士法之相關規定,下列各項敘述,何者正確?", "options": {"A": "記帳士得接受委任辦理各項稅捐之查核簽證申報", "B": "各級記帳士公會理事、監事之任期為 3 年,連選得連任之", "C": "記帳士登錄後,非加入記帳士公會,不得執行業務", "D": "曾任稅務機關稅務職系人員者,自離職之日起 4 年內,不得於其最後任職機關所在地直轄市、縣市區\n域內執行記帳士職務"}, "answer": "C", "note": ""}, {"id": "bookkeeping-95-15", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 15, "question": "記帳士懲戒委員會處理懲戒事件,認為有犯罪嫌疑者,應如何處置?", "options": {"A": "移送事務所所在地國稅局接受調查", "B": "由記帳士公會予以退會", "C": "移送司法機關偵辦", "D": "移送業務主管機關除名"}, "answer": "C", "note": ""}, {"id": "bookkeeping-95-16", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 16, "question": "記帳士因考試及格,欲請領記帳士證書時,應填具申請書,並檢同證明資格文件,向那一個機構申請核發?", "options": {"A": "考選部", "B": "財政部", "C": "經濟部", "D": "記帳士公會"}, "answer": "B", "note": ""}, {"id": "bookkeeping-95-17", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 17, "question": "記帳及報稅代理業務人,於 94 年至 96 年,每年應完成幾小時之相關專業訓練?", "options": {"A": "60 小時以上", "B": "50 小時以上", "C": "40 小時以上", "D": "30 小時以上"}, "answer": "C", "note": ""}, {"id": "bookkeeping-95-18", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 18, "question": "記帳士接受客戶委任後,因故必須終止契約,應於幾日前通知委任人?", "options": {"A": "10 日", "B": "20 日", "C": "30 日", "D": "不得終止其契約"}, "answer": "A", "note": ""}, {"id": "bookkeeping-95-19", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 19, "question": "商業之主辦、經辦會計,故意登錄或輸入不實資料,如於事前曾表示拒絕或提出更正意見有確實證據者\n,其應負之法律責任為何?", "options": {"A": "處 1 年以下有期徒刑、拘役或科或併科新臺幣 15 萬元以下罰金", "B": "處 5 年以下有期徒刑、拘役或科或併科新臺幣 60 萬元以下罰金,得減輕或免除其刑", "C": "處 1 年以下有期徒刑、拘役或科或併科新臺幣 60 萬元以下罰金,得減輕或免除其刑", "D": "處 3 年以下有期徒刑、拘役或科或併科新臺幣 15 萬元以下罰金"}, "answer": "B", "note": ""}, {"id": "bookkeeping-95-20", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 20, "question": "下列敘述那一項違反商業會計法之規定?", "options": {"A": "有分支機構之商業,於會計年度終了時,應將其本、分支機構之帳目,各自單獨辦理決算", "B": "商業有支付員工退休金之義務者,應於員工在職期間依法提列退休金準備、提撥與商業完全分離之退\n休準備金或退休基金,並認列當期費用", "C": "代表商業之負責人應將各項決算報表備置於本機構", "D": "商業之利害關係人,得因正當理由,聲請法院選派檢查員,檢查該商業之帳簿報表及憑證"}, "answer": "A", "note": ""}, {"id": "bookkeeping-95-21", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 21, "question": "商業於會計年度終了後,應於多久期限內將決算辦理完竣?", "options": {"A": "1 個月,必要時得延長 1 個半月", "B": "2 個月,必要時得延長 1 個半月", "C": "3 個月,必要時得延長 1 個半月", "D": "4 個月,必要時得延長 1 個半月"}, "answer": "B", "note": ""}, {"id": "bookkeeping-95-22", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 22, "question": "台北公司接受捐贈得到機器一部,該機器成本$1,000,000,累計折舊$300,000,公平市價$900,000,請\n問該機器入帳金額為何?", "options": {"A": "$900,000", "B": "$1,000,000", "C": "$700,000", "D": "按機器狀況適時評價"}, "answer": "A", "note": ""}, {"id": "bookkeeping-95-23", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 23, "question": "公司負責人如不依法設置會計人員,將面臨那一種法律責任?", "options": {"A": "處新臺幣 3 萬元以下罰鍰", "B": "處新臺幣 3 萬元以上 9 萬元以下罰鍰", "C": "處新臺幣 9 萬元以上罰鍰", "D": "處新臺幣 3 萬元以上 15 萬元以下罰鍰"}, "answer": "D", "note": ""}, {"id": "bookkeeping-95-24", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 24, "question": "依照商業會計處理準則之規定,下列那一項不屬於資產負債表之「存貨」?", "options": {"A": "客戶寄銷品", "B": "備供正常營業之商品、製成品、副產品", "C": "正在生產中之在製品,將於加工完成後出售者", "D": "將直接用於生產供出售之商品材料"}, "answer": "A", "note": ""}, {"id": "bookkeeping-95-25", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 25, "question": "陳君以土地一筆抵繳加入 A 公司之資本,該筆土地之公告現值為$2,000,000,市價為$5,000,000,淨變\n現價值$4,000,000,原始購買價格為$1,500,000,請問 A 公司資產負債表上該筆土地之價值如何表示?", "options": {"A": "$1,500,000", "B": "$4,000,000", "C": "$2,000,000", "D": "$5,000,000"}, "answer": "D", "note": ""}, {"id": "bookkeeping-95-26", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 26, "question": "商業發生於何時之重大事項為期後事件?", "options": {"A": "決算辦理完成日股東常會決議日", "B": "資產負債表日至股東常會決議日", "C": "資產負債表日後至財務報表提出日", "D": "決算辦理完成日董事會決議日"}, "answer": "C", "note": ""}, {"id": "bookkeeping-95-27", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 27, "question": "銷貨簿、進貨簿均屬於下列那一種帳簿?", "options": {"A": "明細分類帳簿", "B": "總分類帳簿", "C": "普通序時帳簿", "D": "特種序時帳簿"}, "answer": "D", "note": ""}, {"id": "bookkeeping-95-28", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 28, "question": "具負債性質之特別股,其股利應認列為?", "options": {"A": "盈餘之分配", "B": "股本之減項", "C": "費用", "D": "利息收入之減項"}, "answer": "C", "note": ""}, {"id": "bookkeeping-95-29", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 29, "question": "商業之會計科目及財務報表,下列那一項敘述錯誤?", "options": {"A": "財務報表之編製,不論定期或不定期均應以會計年度為之", "B": "停業部門損益為會計科目之一", "C": "所得稅指本期應認列之所得稅費用或所得稅利益", "D": "年度財務報表之格式,除新成立商業外,應採 2 年度對照方式,以當年度及上年度之金額併列表達"}, "answer": "A", "note": ""}, {"id": "bookkeeping-95-30", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 30, "question": "依商業會計法規定傳票簽章,如未經商業負責人授權,則至少應由那些人員簽章?負責人 採購人員\n經理人 主辦會計 經辦會計 經手人", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "C", "note": ""}, {"id": "bookkeeping-95-31", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 31, "question": "商業會計處理準則,對於流動資產之「現金」,依其科目性質及應加註釋事項,下列那一項錯誤?", "options": {"A": "非活期之銀行存款到期日在 1 年以後者,應加註明", "B": "補償性存款如因短期借款而發生者,應列為流動資產", "C": "定期存款(含可轉讓定存單)提供債務作質者,若所擔保之債務為長期負債,應改列為其他資產", "D": "定期存款作為存出保證金者,一律列為其他資產"}, "answer": "D", "note": ""}, {"id": "bookkeeping-95-32", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 32, "question": "財務報表之註釋與財務報表間之關係,下列那一項敘述正確?", "options": {"A": "非屬於財務報表之一部分,無需特別記載", "B": "非屬於財務報表之一部分,可選擇性記載", "C": "屬於財務報表之一部分,商業須揭露必要之資訊", "D": "僅資產負債表及損益表,商業得視實際需要,另編各科目明細表及成本計算表"}, "answer": "C", "note": ""}, {"id": "bookkeeping-95-33", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 33, "question": "商業各項原始憑證及記帳憑證,其保存期限之起算日為?", "options": {"A": "資產負債表日", "B": "年度決算程序辦理終了日", "C": "會計年度終了日", "D": "財務報表公布日"}, "answer": "B", "note": ""}, {"id": "bookkeeping-95-34", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 34, "question": "商業會計法對於「支出效益」之敘述,下列那一項錯誤?", "options": {"A": "支出之效益及於以後各期者,列為資產", "B": "其效益僅及於當期者,列為費用或損失", "C": "數額較為鉅大之非常損失不宜全部由本期分擔者,得分期負擔之", "D": "無效益者,列為費用或損失"}, "answer": "C", "note": ""}, {"id": "bookkeeping-95-35", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 35, "question": "商業會計法對於會計憑證之敘述,下列那一項錯誤?", "options": {"A": "領用物品清單為內部憑證", "B": "退貨單為對外憑證", "C": "支給出差旅運費表單為外來憑證", "D": "請購單為內部憑證"}, "answer": "C", "note": ""}, {"id": "bookkeeping-95-36", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 36, "question": "商業於會計年度終了後,應於多久期限內,將商業之決算報表提請商業出資人、合夥人或股東承認?", "options": {"A": "2 個月", "B": "3 個月", "C": "4 個月", "D": "6 個月"}, "answer": "D", "note": ""}, {"id": "bookkeeping-95-37", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 37, "question": "商業違反商業會計法規定,不將決算報表置放本機構或無正當理由拒絕利害關係人查閱者,代表商業之\n負責人、經理人、主辦及經辦會計人員或依法受託之記帳士,應如何處分?", "options": {"A": "處新臺幣 3 萬元以上 15 萬元以下罰鍰", "B": "處新臺幣 15 萬元以下罰鍰", "C": "處 1 年以下有期徒刑、拘役或科或併科新臺幣 15 萬元以下罰金", "D": "處 5 年以下有期徒刑、拘役或科或併科新臺幣 15 萬元以下罰金"}, "answer": "A", "note": ""}, {"id": "bookkeeping-95-38", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 38, "question": "商業會計法對於會計憑證之規定,下列那一項敘述正確?", "options": {"A": "原始憑證之作用在證明處理會計事項人員之責任", "B": "記帳憑證之作用在於證明會計事項之經過", "C": "進貨發票為記帳憑證", "D": "無法取得原始憑證之會計事項,商業負責人得令經辦及主管該事項之人員,分別或共同證明"}, "answer": "D", "note": ""}, {"id": "bookkeeping-95-39", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 39, "question": "依商業會計法之規定,性質相同之商業,其會計制度規範係由那一單位訂定之?", "options": {"A": "財政部", "B": "經濟部", "C": "同業公會", "D": "各縣市政府"}, "answer": "C", "note": ""}, {"id": "bookkeeping-95-40", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 40, "question": "商業會計處理準則規定,商業之「應付票據」,應依何種基礎評價?", "options": {"A": "市價", "B": "現值或面額", "C": "成本", "D": "成本與市價孰低者"}, "answer": "B", "note": ""}, {"id": "bookkeeping-95-41", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 41, "question": "商業會計法所稱商業,係指下列那一項規定?", "options": {"A": "以營利為目的之事業,其範圍依公司法、證券交易法及其他法律之規定", "B": "以營利為目的之公司,其範圍依商業登記法、公司法及其他法律之規定", "C": "以營利為目的之營利事業,其範圍依民法、公司法及其他法律之規定", "D": "以營利為目的之事業,其範圍依商業登記法、公司法及其他法律之規定"}, "answer": "D", "note": ""}, {"id": "bookkeeping-95-42", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 42, "question": "甲公司會計人員於申報 94 年度營利事業所得稅時,發現交際費帳上金額$500,000,依稅法規定所計算之\n限額為$400,000,甲公司會計人員應如何處理?", "options": {"A": "編製轉帳傳票調減交際費$100,000,以符合規定", "B": "不影響帳面記錄,僅作帳外調整後申報", "C": "依商業會計處理準則第 13 條規定,作帳上更正", "D": "將超過額度之憑證抽換"}, "answer": "B", "note": ""}, {"id": "bookkeeping-95-43", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 43, "question": "依商業會計法第 81 條規定,下列那一項罰鍰係由法院裁罰?", "options": {"A": "規避、妨礙或拒絕依商業會計法第 70 條所規定之檢查", "B": "編製內容顯不確實之財務報表", "C": "未依規定如期辦理決算", "D": "未依規定記帳"}, "answer": "A", "note": ""}, {"id": "bookkeeping-95-44", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 44, "question": "商業會計法對於原始憑證之種類規定,下列那一項錯誤?", "options": {"A": "對外憑證", "B": "對內憑證", "C": "外來憑證", "D": "內部憑證"}, "answer": "B", "note": ""}, {"id": "bookkeeping-95-45", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 45, "question": "依商業會計法對「商業」之規範,係以何者作為其規範基礎?", "options": {"A": "設立目的", "B": "組織型態", "C": "產業別", "D": "業務型態"}, "answer": "A", "note": ""}, {"id": "bookkeeping-95-46", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 46, "question": "商業應設置帳簿目錄,記明其設置使用之帳簿名稱、性質、啟用停用日期、已用未用頁數,應由那一個\n人簽字?", "options": {"A": "主辦會計人員", "B": "經辦會計人員", "C": "商業負責人及經辦會計人員", "D": "商業負責人及主辦會計人員"}, "answer": "C", "note": ""}, {"id": "bookkeeping-95-47", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 47, "question": "下列對於公司組織主辦會計人員之任免的敘述,何者錯誤?", "options": {"A": "在兩合公司,應有全體無限責任股東過半數之同意", "B": "在無限公司,應有全體無限責任股東過半數之同意", "C": "在有限公司,應有全體股東過半數之同意", "D": "在股份有限公司,應由董事會過半數之出席及出席董事三分之二之同意"}, "answer": "D", "note": ""}, {"id": "bookkeeping-95-48", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 48, "question": "依商業會計法之規定,重大之期後事項應加註釋揭露之,下列那一項非屬重大期後事項?", "options": {"A": "重要訴訟案件之進行或終結", "B": "資本結構之變動", "C": "組織之重要調整及管理制度之重大改革", "D": "資產與負債區分流動與非流動之分類標準"}, "answer": "D", "note": ""}, {"id": "bookkeeping-95-49", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 49, "question": "公司為合併時,應於實行後幾日內,向主管機關申請變更登記?", "options": {"A": "15 日", "B": "20 日", "C": "30 日", "D": "1 星期"}, "answer": "A", "note": ""}, {"id": "bookkeeping-95-50", "year": "95", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 50, "question": "公司之登記或認許之申請,得委由何人代理?", "options": {"A": "得委由記帳士代理", "B": "得委由他人代理,代理人以會計師、律師為限", "C": "只能由代表公司之負責人或其授權人辦理", "D": "只能由代表公司之經理人辦理"}, "answer": "B", "note": ""}, {"id": "chinese-95-1", "year": "95", "subject": "chinese", "subjectName": "國文", "number": 1, "question": "至題\n 那時全北京城裏,要找兩個會日本話的中國人,實在比三伏天討喚兩個凍酸梨藥\n引子更難辦。日本軍成立臨時偽政權「安民公所」,正尋找「舌人」,自然要找這白\n旗上寫日本字的人來。第三天徐煥章左胳膊上套上了個白箍,上邊寫「大日本軍安民\n公所」,蓋了關防。從此晃著膀子跟日本巡邏兵一塊抓拳民,殺亂黨,替日本軍隊搜\n羅地方上的痞賴劣紳組織維持會。 (鄧友梅《煙壺》)\n文中「三伏天」意指:", "options": {"A": "涼爽的季節", "B": "酷熱的時節", "C": "陰雨綿綿的日子", "D": "傾盆大雨的天氣"}, "answer": "B", "note": ""}, {"id": "chinese-95-2", "year": "95", "subject": "chinese", "subjectName": "國文", "number": 2, "question": "「舌人」在文中的意義為:", "options": {"A": "為民喉舌的人", "B": "具翻譯能力的人", "C": "很會說話的人", "D": "漢奸賣國賊"}, "answer": "B", "note": ""}, {"id": "chinese-95-3", "year": "95", "subject": "chinese", "subjectName": "國文", "number": 3, "question": "下列敘述何者不正確?", "options": {"A": "關防是官印的一種,印文作長方形", "B": "清代正規職官用正方形官印稱「印」,臨時派遣的官員,其所持的印信稱「關防」", "C": "關防之印文不書人名", "D": "書畫落款時蓋上關防,方顯得真實不偽"}, "answer": "D", "note": ""}, {"id": "chinese-95-4", "year": "95", "subject": "chinese", "subjectName": "國文", "number": 4, "question": "本文的時代背景為:", "options": {"A": "八國聯軍進北京", "B": "甲午戰爭", "C": "九一八事變", "D": "七七事變\n閱讀下文,回答"}, "answer": "A", "note": ""}, {"id": "chinese-95-5", "year": "95", "subject": "chinese", "subjectName": "國文", "number": 5, "question": "至題\n 男兒作健向沙場,自愛登臺不望鄉。太白(註)高高天尺五,寶刀明月共輝光。 \n (黃景仁〈少年行〉)\n 註:太白即太白金星,主兵戎之事\n詩中人為何「愛登臺」?", "options": {"A": "臺高近天,可摘星月", "B": "登高能賦,可以為大夫", "C": "登高望遠,一展萬丈豪情", "D": "高臺五光十色,十分眩人"}, "answer": "C", "note": ""}, {"id": "chinese-95-6", "year": "95", "subject": "chinese", "subjectName": "國文", "number": 6, "question": "第二句「不望鄉」是深一層寫出詩中人:", "options": {"A": "一鼓作氣的精神", "B": "奔赴沙場的決心", "C": "少年不識愁滋味", "D": "無家可歸的悲哀\n95年專門職業及技術人員高等考試律師、會計師、社會工作師、民間之\n公證人、不動產估價師考試暨普通考試記帳士考試試題 代號:70110\n等 別: 普通考試\n類 科: 記帳士 \n科 目: 國文(作文與測驗) \n全一張\n(背面)"}, "answer": "B", "note": ""}, {"id": "chinese-95-7", "year": "95", "subject": "chinese", "subjectName": "國文", "number": 7, "question": "第三句「太白高高天尺五」是描寫:", "options": {"A": "大地遼闊,使人一登臺,便產生雄偉氣魄", "B": "天高地迥,使人一登臺,便覺得渺小無比", "C": "高處不勝寒,使人一登臺,便感到孤寂悽愴", "D": "戰星高懸,使人一登臺,便揚起昂昂鬥志"}, "answer": "D", "note": ""}, {"id": "chinese-95-8", "year": "95", "subject": "chinese", "subjectName": "國文", "number": 8, "question": "下列那一組成語的意思相近?", "options": {"A": "比翼雙飛/形影相弔", "B": "青梅竹馬/兩小無猜", "C": "反掌折枝/移山填海", "D": "耳提面命/洗耳恭聽"}, "answer": "B", "note": ""}, {"id": "chinese-95-9", "year": "95", "subject": "chinese", "subjectName": "國文", "number": 9, "question": "下列「」內的詞語解釋正確的是:", "options": {"A": "〈出師表〉:「五月渡瀘,深入不毛。」──「不毛」意謂:鄉村", "B": "〈歸去來辭〉:「富貴非吾願,帝鄉不可期。」──「帝鄉」意謂:皇宮", "C": "〈醉翁亭記〉:「傴僂提攜,往來而不絕者,滁人遊也。」──「傴僂」意謂:\n老人", "D": "《詩經.豳風.七月》:「為此春酒,以介眉壽。」──「介」意謂:介紹"}, "answer": "C", "note": ""}, {"id": "chinese-95-10", "year": "95", "subject": "chinese", "subjectName": "國文", "number": 10, "question": "漢字基本上一字一義,但也有兩字不能拆開,須合為一詞才具有完整意義的,如「徜\n徉」、「徘徊」等,稱為「連綿詞」。下列詩句「」內的詞,何者是屬於連綿詞? \n日色纔臨仙掌動,「香煙」欲傍袞龍浮 「萬籟」此俱寂,惟聞鐘磬音 千\n呼萬喚始出來,猶抱「琵琶」半遮面 使君從南來,五馬立「踟躕」 「冠蓋」\n滿京華,斯人獨憔悴 「流連」戲蝶時時舞,自在嬌鶯恰恰啼 青槐夾馳道,\n客館何「玲瓏」", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "C", "note": ""}, {"id": "chinese-95-11", "year": "95", "subject": "chinese", "subjectName": "國文", "number": 11, "question": "宋之問〈渡漢江〉詩云:「近鄉情更怯,不敢問來人。」其原因是:", "options": {"A": "久別無消息,反而怕聽到家中的事", "B": "不認識來人,不便主動去問", "C": "因事業無成,低調自處", "D": "離鄉之後,風俗習慣已有改變"}, "answer": "A", "note": ""}, {"id": "chinese-95-12", "year": "95", "subject": "chinese", "subjectName": "國文", "number": 12, "question": "「歲寒,然後知松柏之後彫也。」下列選項意涵與此不同的是:", "options": {"A": "時窮節乃見", "B": "風木之思", "C": "雞鳴不已於風雨", "D": "疾風知勁草"}, "answer": "B", "note": ""}, {"id": "chinese-95-13", "year": "95", "subject": "chinese", "subjectName": "國文", "number": 13, "question": "李白〈黃鶴樓送孟浩然之廣陵〉中的「孤帆遠影碧山盡」,以「帆」代指「船」,\n此即為借代的修辭。下列文句何者沒有使用「借代」的修辭技巧?", "options": {"A": "黃髮垂髫,並怡然自樂(陶淵明〈桃花源記〉)", "B": "吾師肺肝,皆鐵石所鑄造也(方苞〈左忠毅公逸事〉)", "C": "是以古之作者,寄身於翰墨(曹丕《典論.論文》)", "D": "鼎鑊甘如飴,求之不可得(文天祥〈正氣歌〉)"}, "answer": "B", "note": ""}, {"id": "chinese-95-14", "year": "95", "subject": "chinese", "subjectName": "國文", "number": 14, "question": "下列書信用語,表示「感謝」的是:", "options": {"A": "寸心千里,寄語加餐", "B": "暑氣逼人,諸祈珍衛", "C": "東海恩深,圖報無日", "D": "懇賜鈞覆,無任盼禱"}, "answer": "C", "note": ""}, {"id": "chinese-95-15", "year": "95", "subject": "chinese", "subjectName": "國文", "number": 15, "question": "「欲避新枝滑,還向故巢飛。今朝聽聲喜,家信必應歸。」\n「春風一夜到衡陽,楚水燕山萬里長。莫怪春來便歸去,江南雖好是他鄉。」\n「聲聲血淚訴沉冤,啼起巴陵暮雨昏。只解千山喚行客,誰知身是未歸魂。」\n以上三首詩,依序分別指那些動物?", "options": {"A": "喜鵲/黃鶴/鷓鴣", "B": "喜鵲/大雁/杜鵑", "C": "黃鶯/大雁/杜鵑", "D": "黃鶯/黃鶴/鷓鴣"}, "answer": "B", "note": ""}, {"id": "tax-95-1", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 1, "question": "扣繳義務人已依法扣繳稅款,但未申報或填發扣繳(暨免扣繳)憑單,已於限期補報或填發,應處下列\n何者罰鍰?", "options": {"A": "按扣繳稅額處 10 %的罰鍰", "B": "按扣繳稅額處 20 %的罰鍰", "C": "按扣繳稅額處一倍的罰鍰", "D": "按扣繳稅額處三倍的罰鍰"}, "answer": "B", "note": ""}, {"id": "tax-95-2", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 2, "question": "依所得稅法規定,金融業備抵呆帳之提列限額為若干?", "options": {"A": "應收帳款餘額之百分之一", "B": "應收票據餘額之百分之一", "C": "應收帳款及應收票據餘額之百分之一", "D": "債權餘額之百分之一"}, "answer": "D", "note": ""}, {"id": "tax-95-3", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 3, "question": "紅磨舫外國技藝表演團在台北國家音樂廳演出 20 日,其營業稅應於演出結束後幾日內申報?", "options": {"A": "10 日", "B": "15 日", "C": "30 日", "D": "60 日"}, "answer": "B", "note": ""}, {"id": "tax-95-4", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 4, "question": "進中獨資商號為一小規模營業人,94 年某期經查定之營業稅額 1,500 元,當期該營業人提出載有稅額之\n進項憑證申報,經核定之進項稅額為 8,000 元,則該期應納之營業稅額為:", "options": {"A": "700 元", "B": "0 元", "C": "1,100 元", "D": "1,420 元"}, "answer": "A", "note": ""}, {"id": "tax-95-5", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 5, "question": "營業人下列何種進項稅額,不得扣抵銷項稅額?", "options": {"A": "專營營業稅法第 8 條免稅貨物或勞務之營業人", "B": "購置用於推廣業務用之餽贈貨物", "C": "購置用於捐獻予政府之貨物", "D": "購置供銷售用之乘人小汽車"}, "answer": "A", "note": ""}, {"id": "tax-95-6", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 6, "question
