": "公司因投資於中華民國境內其他營利事業,獲配屬 87 年度或以後年度股利總額或盈餘總額所含之可扣抵\n稅額,應於何時記錄股東可扣抵稅額帳戶?", "options": {"A": "年度決算日", "B": "提列日", "C": "被投資事業分派股利及盈餘之基準日", "D": "由財政部以行政命令定之"}, "answer": "C", "note": ""}, {"id": "tax-95-7", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 7, "question": "張三為台北松山區警察,94 年因追捕要犯而不幸中彈死亡,依法給付撫卹金新台幣 1,500 萬元,給付時\n應扣繳多少所得稅款?", "options": {"A": "按給付額扣繳 10 %", "B": "按給付額扣繳 15 %", "C": "按給付額扣繳 20 %", "D": "免予扣繳"}, "answer": "D", "note": ""}, {"id": "tax-95-8", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 8, "question": "營利事業之資產,如遇物價上漲達百分之二十五以上時,應於何時向稅捐稽徵機關申請辦理資產重估?", "options": {"A": "會計年度終了後第 1 個月的 1 個月內", "B": "會計年度終了後第 2 個月內的 1 個月內", "C": "會計年度終了後第 3 個月內的 1 個月內", "D": "會計年度終了後第 6 個月內的 1 個月內"}, "answer": "B", "note": ""}, {"id": "tax-95-9", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 9, "question": "扣繳義務人對於非中華民國境內居住個人之稅款加以扣繳後,應於何時向國庫繳納?", "options": {"A": "代扣稅款之日起 10 日內", "B": "當月 10 日前", "C": "次月 10 日前", "D": "次月 15 日前"}, "answer": "A", "note": ""}, {"id": "tax-95-10", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 10, "question": "綜合所得稅課稅級距之金額,每遇消費者物價指數較上次調整年度之指數上漲累計達若干百分比時,按\n上漲程度調整之?", "options": {"A": "3 %", "B": "10 %", "C": "5 %", "D": "15 %"}, "answer": "B", "note": ""}, {"id": "tax-95-11", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 11, "question": "營利事業以產製、進口、購買供銷售之貨物,轉供自用或無償移轉他人所有者,應如何處理?", "options": {"A": "按時價轉列資產或費用", "B": "按其產製、進口、購買之實際成本,轉列資產或費用", "C": "按其產製、進口、購買之實際成本,開立統一發票", "D": "按時價認列其收入"}, "answer": "B", "note": ""}, {"id": "tax-95-12", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 12, "question": "銀行業經營非專屬本業之銷售額部分,得申請依營業稅法第四章第一節規定計算營業稅額,但經核准後\n幾年內,不得申請變更?", "options": {"A": "1 年", "B": "2 年", "C": "3 年", "D": "5 年"}, "answer": "C", "note": ""}, {"id": "tax-95-13", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 13, "question": "稽徵機關在一定時間內另發現應徵之稅捐者,仍應依法補徵或並予處罰,稱為:", "options": {"A": "徵收期間", "B": "除斥期間", "C": "核課期間", "D": "結算期間"}, "answer": "C", "note": ""}, {"id": "tax-95-14", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 14, "question": "營利事業之帳簿文據,其關係所得額之一部未能提示,經稽徵機關就該部分按同業利潤標準核定其所得\n額者,以不超過下列何者為限?", "options": {"A": "當年度營業收入淨額", "B": "當年度營業收入淨額依同業利潤標準核定之所得額", "C": "當年度營業收入淨額依擴大書面審核純益率標準核定之所得額", "D": "當年度營利事業自行申報所得額"}, "answer": "B", "note": ""}, {"id": "tax-95-15", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 15, "question": "佣金支出在台灣以新台幣支付者,應在不超過出口貨物價款之多少範圍內,取具國外代理商或代銷商名\n義出具之收據為憑,予以認定?", "options": {"A": "百分之五", "B": "百分之三", "C": "百分之二", "D": "百分之一"}, "answer": "B", "note": ""}, {"id": "tax-95-16", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 16, "question": "一般營利事業實際供給膳食或按月定額發給員工伙食代金,每月每人 1,800 元,其超過部分,如屬按月定\n額發給員工伙食代金者,營利事業應如何處理?", "options": {"A": "應轉列員工之薪資所得", "B": "仍按伙食費列支", "C": "自行依法調整剔除", "D": "認列其他費用"}, "answer": "A", "note": ""}, {"id": "tax-95-17", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 17, "question": "信託契約之受益人不特定或尚未存在者,其信託財產運用之所得如何課稅?", "options": {"A": "於所得發生年度,以受託人為納稅義務人,併入受託人之所得申報課徵所得稅", "B": "於所得發生年度,以受託人為納稅義務人,於所得申報期限內,按規定之扣繳率 20%申報繳稅", "C": "於所得發生年度,以受託人為納稅義務人,於所得申報期限內,就該項所得結算申報", "D": "俟受益人確定後,再併入確定年度所得申報所得稅"}, "answer": "B", "note": ""}, {"id": "tax-95-18", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 18, "question": "納稅義務人及其配偶經營兩個以上之營利事業,其中有虧損者,得將核定之虧損與那一類所得相互減除\n後,以其餘額為所得額?", "options": {"A": "核定之其他所得", "B": "核定之執行業務所得", "C": "核定之薪資所得", "D": "核定之營利所得"}, "answer": "D", "note": ""}, {"id": "tax-95-19", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 19, "question": "營利事業以現金定額補貼員工或僅招待特定員工旅遊,其課稅規定為何?", "options": {"A": "應列為員工之薪資所得課稅", "B": "應列為員工之其他所得課稅", "C": "不列入員工之所得課稅", "D": "列為員工之執行業務所得課稅"}, "answer": "A", "note": ""}, {"id": "tax-95-20", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 20, "question": "公司應付股利,於股東會決議分配盈餘之日起幾個月內尚未給付者,視同給付?", "options": {"A": "1 個月", "B": "2 個月", "C": "3 個月", "D": "6 個月"}, "answer": "D", "note": ""}, {"id": "tax-95-21", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 21, "question": "營利事業因虛增股東可扣抵稅額帳戶金額,若超額分配可扣抵稅額時,應如何處罰?", "options": {"A": "補繳,並按超額分配之金額處一倍罰鍰", "B": "不須補繳,但按超額分配之金額處一倍罰鍰", "C": "補繳,並按超額分配之金額處二倍罰鍰", "D": "不補繳,但按超額分配之金額處二倍罰鍰"}, "answer": "A", "note": ""}, {"id": "tax-95-22", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 22, "question": "營利事業依私立學校法第 51 條規定,透過財團法人私立學校興學基金會對私立學校之捐贈,以不超過所\n得額多少為限?", "options": {"A": "10 %", "B": "15 %", "C": "20 %", "D": "25 %"}, "answer": "D", "note": ""}, {"id": "tax-95-23", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 23, "question": "公示送達於登載新聞紙之日起,經過幾日才能發生送達效力?", "options": {"A": "10 日", "B": "20 日", "C": "30 日", "D": "40 日"}, "answer": "B", "note": ""}, {"id": "tax-95-24", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 24, "question": "應受送達人拒絕收受稽徵文書,稽徵機關應以何種方式送達?", "options": {"A": "公示送達", "B": "寄存送達", "C": "委託送達", "D": "補充送達"}, "answer": "B", "note": ""}, {"id": "tax-95-25", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 25, "question": "個人經營文理補習班之所得應歸屬於何類所得?", "options": {"A": "負責人之其他所得", "B": "負責人之薪資所得", "C": "負責人之營利所得", "D": "負責人之執行業務所得"}, "answer": "A", "note": ""}, {"id": "tax-95-26", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 26, "question": "稅籍在台北市之營業人,對營業稅之復查決定書不服,應向那一個機關提出訴願?", "options": {"A": "台北市國稅局", "B": "台北市政府", "C": "財政部", "D": "高等行政法院"}, "answer": "C", "note": ""}, {"id": "tax-95-27", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 27, "question": "納稅義務人逾期繳納稅捐者,應如何加徵滯納金?", "options": {"A": "每逾 2 日加徵 1 %滯納金", "B": "每逾 1 日加徵 1 %滯納金", "C": "每逾 3 日加徵 1 %滯納金", "D": "每逾 2 日加徵 2 %滯納金"}, "answer": "A", "note": ""}, {"id": "tax-95-28", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 28, "question": "稅捐稽徵法不適用於下列何種稅目?", "options": {"A": "貨物稅", "B": "所得稅", "C": "關稅", "D": "加值型及非加值型營業稅"}, "answer": "C", "note": ""}, {"id": "tax-95-29", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 29, "question": "義興公司於 93 年 8 月 1 日接獲核定稅額通知書,須補繳稅額 50 萬,補繳期間為 8 月 16 日至 8 月 30 日,\n若義興公司不服,應於何時申請復查?", "options": {"A": "8 月 1 日起 30 日", "B": "8 月 16 日起 30 日", "C": "8 月 30 日起 30 日", "D": "8 月 31 日起 30 日"}, "answer": "D", "note": ""}, {"id": "tax-95-30", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 30, "question": "納稅義務人應納稅捐,於繳納期間屆滿 30 日後,仍未繳納稅捐者,稽徵稽關應如何處理?", "options": {"A": "聲請假扣押", "B": "移送法院強制執行", "C": "函請有關機關限制出境", "D": "加徵滯報金"}, "answer": "B", "note": ""}, {"id": "tax-95-31", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 31, "question": "依稅捐稽徵法規定,稅捐稽徵機關對於逃漏何種稅款,涉有罪嫌之案件,得聲請搜索?", "options": {"A": "貨物稅與所得稅", "B": "證券交易稅與所得稅", "C": "所得稅與營業稅", "D": "貨物稅與菸酒稅"}, "answer": "C", "note": ""}, {"id": "tax-95-32", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 32, "question": "納稅義務人因天災、事變或重大財產損失,不能於法定期間內繳清稅捐者,得申請延期或分期繳納,惟\n其期間不得逾幾年?", "options": {"A": "2 年", "B": "3 年", "C": "5 年", "D": "1 年"}, "answer": "B", "note": ""}, {"id": "tax-95-33", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 33, "question": "作廢統一發票之收執聯或扣抵聯未予保存者,其收入應如何認定?", "options": {"A": "仍應按銷貨認定", "B": "應按時價從高認定", "C": "應按時價從低認定", "D": "不予認定"}, "answer": "A", "note": ""}, {"id": "tax-95-34", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 34, "question": "營利事業原始憑證未依規定保存,如已取得買受人簽章證明與其所持憑證相符之影本,或經原出具憑證\n之營利事業簽章證明與其自留之存根聯相符之影本,依法應如何處理?", "options": {"A": "該項收入或支出准予認定,但應依稅捐稽徵法第 44 條規定處 5 %罰鍰", "B": "該項收入或支出不准認定,並應依稅捐稽徵法第 44 條規定處 5 %罰鍰", "C": "該項收入或支出准予認定,免依稅捐稽徵法第 44 條規定處 5 %罰鍰", "D": "該項收入或支出不准認定,免依稅捐稽徵法第 44 條規定處 5 %罰鍰"}, "answer": "C", "note": ""}, {"id": "tax-95-35", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 35, "question": "營業人開立統一發票,應行記載事項未依規定記載或所載不實者,除通知限期改正或補正外,按統一發\n票所載銷售額處多少罰鍰,且金額最低不得少於 500 元?", "options": {"A": "百分之十", "B": "百分之三", "C": "百分之二", "D": "百分之一"}, "answer": "D", "note": ""}, {"id": "tax-95-36", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 36, "question": "營利事業其進貨、銷貨、存貨帳簿及進貨、銷貨憑證,未載明貨物名稱、數量,但能補正並提供下列何\n項帳冊或表單,經查核相符後,應予查帳認定?", "options": {"A": "存貨明細帳", "B": "銷貨成本分析表", "C": "進、銷、存明細表", "D": "進貨憑證"}, "answer": "C", "note": ""}, {"id": "tax-95-37", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 37, "question": "營業人除稅法另有規定外,不論有無銷售額,應如何向稽徵機關申報銷售額、應納或溢付營業稅?", "options": {"A": "1 個月為一期", "B": "2 個月為一期", "C": "3 個月為一期", "D": "6 個月為一期"}, "answer": "B", "note": ""}, {"id": "tax-95-38", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 38, "question": "農產品批發市場之承銷人、銷售農產品之小規模營業人、小規模營業人及其他經財政部規定免予申報銷售額\n之營業人,申請按營業稅法「一般稅額計算」規定計算其營業稅額者,經核准後幾年內不得申請變更?", "options": {"A": "6 年", "B": "5 年", "C": "3 年", "D": "2 年"}, "answer": "C", "note": ""}, {"id": "tax-95-39", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 39, "question": "下列何者不屬於營業稅之課稅範圍?", "options": {"A": "進口貨物", "B": "外銷貨物,未依規定取得出口證明文件", "C": "營業人解散或廢止營業時所餘存之貨物", "D": "執行業務者提供其專業性勞務"}, "answer": "D", "note": ""}, {"id": "tax-95-40", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 40, "question": "我國加值型營業稅採下列何種方法計算營業稅額?", "options": {"A": "稅基相減法", "B": "稅基相加法", "C": "稅額相減法", "D": "稅額相加法"}, "answer": "C", "note": ""}, {"id": "tax-95-41", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 41, "question": "銷售貨物之交付如須移運者,下列何種情形屬於在中華民國境內銷售貨物,應依法課徵營業稅?", "options": {"A": "其目的地在中華民國境內", "B": "其起運地在中華民國境內", "C": "其簽約地在中華民國境內", "D": "其付款地在中華民國境內"}, "answer": "B", "note": ""}, {"id": "tax-95-42", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 42, "question": "下列何者不屬於營業稅法所規範之「視為銷售貨物」?", "options": {"A": "以進口之貨物轉供營業人自用", "B": "營業人委託他人代銷貨物", "C": "營業人銷售代銷貨物", "D": "因信託行為委託人將貨物移轉於受託人"}, "answer": "D", "note": ""}, {"id": "tax-95-43", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 43, "question": "下列何者不屬於營業稅之納稅義務人?", "options": {"A": "銷售貨物或勞務之營業人", "B": "購買國外勞務之買受人", "C": "進口貨物之報關行", "D": "進口郵包之收貨人"}, "answer": "C", "note": ""}, {"id": "tax-95-44", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 44, "question": "外國國際運輸事業,在中華民國境內無固定營業場所而有代理人者,其在中華民國境內銷售勞務之營業\n稅,應由下列何者繳納?", "options": {"A": "外國事業之國外總機構", "B": "外國事業在中華民國境內之代理人", "C": "勞務買受人", "D": "以上皆非"}, "answer": "B", "note": ""}, {"id": "tax-95-45", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 45, "question": "營業人銷售免稅貨物或勞務,得申請財政部核准放棄適用免稅規定,但核准後幾年內不得變更?", "options": {"A": "1 年", "B": "2 年", "C": "3 年", "D": "4 年"}, "answer": "C", "note": ""}, {"id": "tax-95-46", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 46, "question": "營利事業之費用支出,如係取得小規模營利事業所出具之普通收據,其全年累計金額以不超過當年度稽\n徵機關核定之製造費用及營業費用之總額多少?", "options": {"A": "百分之三十", "B": "千分之三十", "C": "千分之三", "D": "百分之十"}, "answer": "B", "note": ""}, {"id": "tax-95-47", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 47, "question": "營業人將自行生產之冷氣機一台,成本 10,000 元,時價 12,000 元贈送客戶,該營業人應以下列何\n項金額入帳?", "options": {"A": "10,000 元", "B": "10,500 元", "C": "12,000 元", "D": "12,500 元"}, "answer": "A", "note": ""}, {"id": "tax-95-48", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 48, "question": "營利事業之費用與損失,應視其性質分為營業費用(如銷售、管理費用)與營業成本(如製造費用),\n若其應歸屬於營業成本之費用或損失,原列報於營業費用,經稽徵機關審定轉正者,應就調整部分分攤\n於下列那一項目?", "options": {"A": "期初存貨", "B": "銷貨成本", "C": "原料耗用成本", "D": "期末存貨"}, "answer": "D", "note": ""}, {"id": "tax-95-49", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 49, "question": "營利事業依經銷契約所取得或支付之獎勵金,應如何處理?", "options": {"A": "按營業收入或成本認列", "B": "按進貨或銷貨折讓處理", "C": "按非營業收入或支出認列", "D": "按佣金收入或支出科目處理"}, "answer": "B", "note": ""}, {"id": "tax-95-50", "year": "95", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 50, "question": "營利事業受託代收轉付款項,符合下列何項條件者,其所收款項免列為營業收入處理,並免另開統一發\n票,免列入銷售額?", "options": {"A": "於收取轉付之間無差額", "B": "轉付款項取得之憑證買受人載明為受託人", "C": "已取得原始憑證(或影本)並未依規定保存", "D": "於收取轉付之間有差額"}, "answer": "A", "note": ""}, {"id": "accounting-96-1", "year": "96", "subject": "accounting", "subjectName": "會計學概要", "number": 1, "question": "台興公司 2005 年度普通股股數有關資料如下:\n1 月 1 日流通在外普通股 20,000 股\n7 月 1 日發放 20%股票股利\n10 月 1 日買回庫藏股票 2,000 股\n2005 年度稅後淨利$60,000,特別股股利$1,250 \n試問台興公司 2005 年度每股盈餘應為多少?", "options": {"A": "$2", "B": "$2.125", "C": "$2.25", "D": "$2.5"}, "answer": "D", "note": ""}, {"id": "accounting-96-2", "year": "96", "subject": "accounting", "subjectName": "會計學概要", "number": 2, "question": "台中公司 2006 年 12 月 31 日,設備資產成本$1,000,000,累計折舊$200,000,淨公平市價$750,000,預計該\n資產能產生未來淨現金流量之折現值(使用價值)$780,000,試問台中公司之資產價值減損損失應為多少?", "options": {"A": "$0", "B": "$20,000", "C": "$30,000", "D": "$50,000"}, "answer": "B", "note": ""}, {"id": "accounting-96-3", "year": "96", "subject": "accounting", "subjectName": "會計學概要", "number": 3, "question": "花蓮公司於 2006 年 10 月 1 日向銀行借款,並開立一張面額$110,000,1 年後到期之不附息票據,假如類\n似之票據借款當時利率為 10%,花蓮公司 2006 年 12 月 31 日帳上應有:", "options": {"A": "應付票據餘額$102,500", "B": "應付票據餘額$110,000", "C": "應付票據折價$10,000", "D": "應付票據折價$2,500"}, "answer": "A", "note": ""}, {"id": "accounting-96-4", "year": "96", "subject": "accounting", "subjectName": "會計學概要", "number": 4, "question": "在定期盤存制下,下列何項會計科目僅在期末盤點後調整分錄時使用?", "options": {"A": "商品存貨", "B": "進貨", "C": "銷貨收入", "D": "進貨運費"}, "answer": "A", "note": ""}, {"id": "accounting-96-5", "year": "96", "subject": "accounting", "subjectName": "會計學概要", "number": 5, "question": "台中公司 2006 年底資產負債表包括普通股股本$200,000、保留盈餘$30,000、普通股發行溢價$100,000、\n資本公積-庫藏股票交易$10,000、庫藏股票$20,000、捐贈資本$60,000,試問台中公司 2006 年底股東權\n益應為多少?", "options": {"A": "$320,000", "B": "$370,000", "C": "$380,000", "D": "$400,000"}, "answer": "C", "note": ""}, {"id": "accounting-96-6", "year": "96", "subject": "accounting", "subjectName": "會計學概要", "number": 6, "question": "桃園公司核對 2006 年 7 月 31 日公司帳簿與銀行對帳單,發現下列各事項:\n 7 月 31 日銀行對帳單餘額為公司帳面餘額之 80% \n銀行已完成收款之託收票據$9,000 \n未兌現支票$2,000 \n在途存款$30,000 \n銀行手續費$1,000 \n試問桃園公司於 2006 年 7 月 31 日銀行對帳單餘額應為多少?", "options": {"A": "$50,000", "B": "$60,000", "C": "$70,000", "D": "$80,000"}, "answer": "D", "note": ""}, {"id": "accounting-96-7", "year": "96", "subject": "accounting", "subjectName": "會計學概要", "number": 7, "question": "本期銷貨淨額$300,000,預收貨款減少$60,000,應收帳款增加$90,000,本期銷貨收到多少現金?", "options": {"A": "$150,000", "B": "$270,000", "C": "$330,000", "D": "$450,000"}, "answer": "A", "note": ""}, {"id": "accounting-96-8", "year": "96", "subject": "accounting", "subjectName": "會計學概要", "number": 8, "question": "雲林公司 2006 年 7 月 1 日賒購一批,定價$8,000,商業折扣 20%,信用條件「2/10,n/30」,2006 年 7 月\n10 日支付 50%應付帳款,試問雲林公司 2006 年 7 月 10 日應付多少現金?", "options": {"A": "$3,136", "B": "$3,200", "C": "$3,920", "D": "$4,000"}, "answer": "A", "note": ""}, {"id": "accounting-96-9", "year": "96", "subject": "accounting", "subjectName": "會計學概要", "number": 9, "question": "高行公司 2006 年 7 月 1 日以價格$97,800 及手續費$200 買入雲林公司所發行五年期、面額$100,000、票\n面利率 2%、每年 6 月 30 日與 12 月 31 日付息之公司債,高行公司有積極意圖及能力持有至到期日,2006\n年 12 月 31 日雲林公司公司債之市價$98,600 該公司以直線法攤銷此債券折價。試問 2006 年 12 月 31 日\n此債券投資之帳面價值應為多少?", "options": {"A": "$98,000", "B": "$98,020", "C": "$98,200", "D": "$98,600"}, "answer": "C", "note": ""}, {"id": "accounting-96-10", "year": "96", "subject": "accounting", "subjectName": "會計學概要", "number": 10, "question": "台東公司 2006 年 7 月 1 日購買到期日 2006 年 9 月 16 日之商業本票,該商業本票的信用(違約)風險極\n低,此項投資應歸類為下列何種資產?", "options": {"A": "現金及約當現金", "B": "持有至到期日之債券投資", "C": "交易目的之債券投資", "D": "備供出售之債券投資"}, "answer": "A", "note": ""}, {"id": "accounting-96-11", "year": "96", "subject": "accounting", "subjectName": "會計學概要", "number": 11, "question": "高雄公司 2006 年度帳列淨利$18,000,查帳後發現:2006 年期末存貨多計$2,000、預付費用多計$1,000 及\n應付費用少計$1,000,則 2006 年度正確淨利應為多少?", "options": {"A": "$14,000", "B": "$15,000", "C": "$16,000", "D": "$20,000"}, "answer": "A", "note": ""}, {"id": "accounting-96-12", "year": "96", "subject": "accounting", "subjectName": "會計學概要", "number": 12, "question": "花蓮商店係由甲、乙二人共同成立,損益分配方法是按期初資本額比例分配,2006 年 1 月 1 日甲合夥人\n資本$300,000 及乙合夥人資本$200,000,2006 年 1 月 2 日甲、乙合夥人同意丙出資$100,000 加入花蓮商\n店,丙合夥人取得新花蓮商店的 20%合夥權益,試問在紅利法下,新花蓮商店各合夥人資本應為多少?", "options": {"A": "甲合夥人$300,000", "B": "乙合夥人$192,000", "C": "丙合夥人$100,000", "D": "丙合夥人$90,000"}, "answer": "B", "note": ""}, {"id": "accounting-96-13", "year": "96", "subject": "accounting", "subjectName": "會計學概要", "number": 13, "question": "台北公司於 2005 年期初投資$300,000 取得板橋公司 30%流通在外普通股股票,板橋公司於 2005 年期中\n發放現金股利$40,000,板橋公司 2005 年度淨利$100,000,試問台北公司 2005 年期末長期股權投資-板\n橋公司之帳面價值應為多少?", "options": {"A": "$300,000", "B": "$318,000", "C": "$330,000", "D": "$360,000"}, "answer": "B", "note": ""}, {"id": "accounting-96-14", "year": "96", "subject": "accounting", "subjectName": "會計學概要", "number": 14, "question": "以間接法編製現金流量表時,下列何項是淨利的減項?", "options": {"A": "折舊費用", "B": "存貨減少金額", "C": "應付帳款增加金額", "D": "處分固定資產利益"}, "answer": "D", "note": ""}, {"id": "accounting-96-15", "year": "96", "subject": "accounting", "subjectName": "會計學概要", "number": 15, "question": "苗栗公司以銷貨百分比法估計壞帳費用,並預估銷貨淨額 3%將成為壞帳,2005 年度銷貨淨額$600,000,\n2005 年 12 月 31 日調整前應收帳款$360,000,備抵壞帳借餘$2,000,則 2005 年 12 月 31 日調整後,應收\n帳款淨變現價值應為多少?", "options": {"A": "$340,000", "B": "$342,000", "C": "$344,000", "D": "$346,000"}, "answer": "C", "note": ""}, {"id": "accounting-96-16", "year": "96", "subject": "accounting", "subjectName": "會計學概要", "number": 16, "question": "台南公司於 2005 年 3 月 1 日借$20,000 予南力公司,收到南力公司所開 2005 年 7 月 1 日到期,年利率 6%\n票據一張,2005 年 7 月 1 日該張票據未獲兌現。台南公司 2005 年 7 月 1 日分錄應有:", "options": {"A": "借記應收帳款$20,000", "B": "借記應收票據$20,400", "C": "貸記利息費用$400 及應收帳款$20,000", "D": "貸記利息收入$400 及應收票據$20,000"}, "answer": "D", "note": ""}, {"id": "accounting-96-17", "year": "96", "subject": "accounting", "subjectName": "會計學概要", "number": 17, "question": "高雄公司採用定期盤存制,2004 年 7 月 1 日所有存貨遭逢火災損失,相關資料如下:2004 年 1 月 1 日期\n初存貨$700,000,2004 年發生火災前進貨成本為$2,300,000,銷貨收入為$4,200,000,銷貨退回為$200,000\n,平均毛利率 40%,試以毛利率法估算存貨火災損失應為多少?", "options": {"A": "$480,000", "B": "$600,000", "C": "$800,000", "D": "$1,200,000"}, "answer": "B", "note": ""}, {"id": "accounting-96-18", "year": "96", "subject": "accounting", "subjectName": "會計學概要", "number": 18, "question": "彰化公司 2003 年 1 月 1 日購買機械設備一套$300,000,預計使用年限 5 年,殘值$20,000,並以直線法提\n列折舊,彰化公司之會計年度採用曆年制。2004 年 1 月 1 日進行定期維修費用$4,000,2004 年 7 月 1 日\n進行重大維修,購置新配件$35,000,本次維修預計可增加設備每年 50%的生產力,但原機械設備之使用\n年限與殘值不變,試問彰化公司 2004 年度折舊費用應為多少?", "options": {"A": "$56,000", "B": "$61,000", "C": "$62,000", "D": "$65,000"}, "answer": "B", "note": ""}, {"id": "accounting-96-19", "year": "96", "subject": "accounting", "subjectName": "會計學概要", "number": 19, "question": "台中公司 2003 年 12 月 31 日依與債權人契約規定,提撥$2,000,000 作為償債準備,此規定將使台中公司\n發生下列何項變動?", "options": {"A": "資產減少", "B": "負債減少", "C": "股東權益減少", "D": "未分配盈餘減少"}, "answer": "D", "note": ""}, {"id": "accounting-96-20", "year": "96", "subject": "accounting", "subjectName": "會計學概要", "number": 20, "question": "下列何項不屬於製造成本?", "options": {"A": "工廠人員薪資", "B": "廠房設備折舊", "C": "工廠水電費", "D": "辦公用品耗用"}, "answer": "D", "note": ""}, {"id": "accounting-96-21", "year": "96", "subject": "accounting", "subjectName": "會計學概要", "number": 21, "question": "在商品價格上漲時,下列何種成本流動假設,其淨利最低?", "options": {"A": "先進先出法", "B": "後進先出法", "C": "加權平均法", "D": "移動平均法"}, "answer": "B", "note": ""}, {"id": "accounting-96-22", "year": "96", "subject": "accounting", "subjectName": "會計學概要", "number": 22, "question": "麥當勞連鎖店取得使用麥當勞商標及銷售麥當勞商品的權利,麥當勞連鎖店應將此項權利列於下列何項\n資產?", "options": {"A": "商譽", "B": "租賃權", "C": "商標權", "D": "特許權"}, "answer": "D", "note": ""}, {"id": "accounting-96-23", "year": "96", "subject": "accounting", "subjectName": "會計學概要", "number": 23, "question": "製造業之下列何項成本如同買賣業之進貨成本?", "options": {"A": "本期進料", "B": "製造成本", "C": "製成品成本", "D": "本期耗用原料"}, "answer": "C", "note": ""}, {"id": "accounting-96-24", "year": "96", "subject": "accounting", "subjectName": "會計學概要", "number": 24, "question": "在零用金制度下,撥補零用金時,應作下列何項會計處理?", "options": {"A": "貸記銀行存款", "B": "貸記各項費用", "C": "貸記零用金", "D": "不作分錄"}, "answer": "A", "note": ""}, {"id": "accounting-96-25", "year": "96", "subject": "accounting", "subjectName": "會計學概要", "number": 25, "question": "苗栗公司 2004 年 1 月 1 日購買機器一部,估計可用 4 年,無殘值,該機器 2005 年 12 月 31 日之帳面價\n值,採用年數合計法提列折舊比採用倍數餘額遞減法提列折舊多出$5,000(倍數餘額遞減法之折舊率是直\n線法之折舊率的 2 倍),試問該設備原始成本應為多少?", "options": {"A": "$80,000", "B": "$90,000", "C": "$100,000", "D": "$120,000"}, "answer": "C", "note": ""}, {"id": "bookkeeping-96-1", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 1, "question": "下列有關決算報表之敘述,何者正確?", "options": {"A": "停業期間之公司仍應編製決算報表", "B": "外國公司在我國之分公司決算報表中無營業報告書", "C": "決算報表應由代表商業之負責人、經理人、主辦及經辦會計人員簽名或蓋章負責", "D": "股份有限公司依商業會計法規定應編製之決算表冊有營業報告書、財務報表及盈餘分派或虧損撥補之議\n案等三項"}, "answer": "A", "note": ""}, {"id": "bookkeeping-96-2", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 2, "question": "依商業會計法第 70 條規定執行檢查任務時,下列何者有權檢查商業的帳表及憑證?", "options": {"A": "向法院申請檢查之利害關係人", "B": "法院所選派之檢查員", "C": "商業之任一利害關係人", "D": "裁定法官本身"}, "answer": "B", "note": ""}, {"id": "bookkeeping-96-3", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 3, "question": "勝利公司 95 年 12 月 31 日帳列應收帳款中有一筆對世運公司之債權$12,000,000,因該公司長期財務不健全\n,且於 96 年 2 月初確定宣告破產。假設勝利公司於 96 年 2 月底提出財務報表,則該期後事件對勝利公司\n95 年度財務報表有何影響?", "options": {"A": "應調整 95 年度財務報表", "B": "不必做任何處理", "C": "僅於報表中加以附註揭露即可", "D": "視該公司是否為關係人再決定如何處理"}, "answer": "A", "note": ""}, {"id": "bookkeeping-96-4", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 4, "question": "依商業會計法第 73 條得減輕或免除其刑之規定,下列何種情形得適用之?", "options": {"A": "銷售業務人員於銷售商品時未依規定開立統一發票交付買方", "B": "出納人員明知經理人涉挪用公款,為保住工作,仍依指示付款", "C": "應收帳款登帳員發現一筆未實際銷貨之帳款,經蒐證並向經理人員反映後,仍依指示入帳", "D": "受託代公司處理帳務之記帳士蒐證發現委託公司有虛列費用情事,經向公司負責人反映未果,為保住受\n託記帳之機會,仍予入帳"}, "answer": "C", "note": ""}, {"id": "bookkeeping-96-5", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 5, "question": "商業會計法第 26 條規定:「商業帳簿所記載之人名帳戶,應載明其人之真實姓名,並應在分戶帳內註明其\n住所」,故商業違反此項規定時應如何處置?", "options": {"A": "處新台幣 3 萬元以上 15 萬元以下罰鍰", "B": "處新台幣 1 萬元以上 5 萬元以下罰鍰", "C": "處新台幣 6 萬元以上 30 萬元以下罰鍰", "D": "尚無處罰之規定"}, "answer": "D", "note": ""}, {"id": "bookkeeping-96-6", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 6, "question": "商業會計法排除小規模合夥及獨資商業之適用,其主要理論基礎為:", "options": {"A": "可瞭解性", "B": "可靠性", "C": "一致性", "D": "成本效益之限制"}, "answer": "D", "note": ""}, {"id": "bookkeeping-96-7", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 7, "question": "利來公司 96 年 1 月 1 日與鵬程公司完成一項資產交換協議,利來公司該項換出資產原始取得成本$400,000\n,累計折舊$240,000,交換日之公平價值為$200,000,並另向鵬程公司收取現金$5,000,假設此筆交易具商\n業實質,則利來公司應認列交換損益為若干?", "options": {"A": "交換損失$5,000", "B": "交換利益$976", "C": "交換利益$40,000", "D": "交換損益$0"}, "answer": "C", "note": ""}, {"id": "bookkeeping-96-8", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 8, "question": "下列何者並非外來憑證及對外憑證應記載事項?", "options": {"A": "交易金額", "B": "開具人職稱", "C": "憑證日期", "D": "交易雙方名稱"}, "answer": "B", "note": ""}, {"id": "bookkeeping-96-9", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 9, "question": "裕隆公司期末定期存款餘額計一億五千萬元:其中一千萬元提供銀行長期借款之質押二千萬元提供銀\n行短期信用狀借款之擔保三千萬元提供承包高鐵長期工程之保證金四千萬元提供投標基凱公司短期工\n程之押標金其餘存單未作質。試說明該公司期末資產負債表應如何列示上述定期存款?\n現金及約當現金 其他流動資產(含存出保證金) 其他資產(含存出保證金)", "options": {"A": "6,000 萬元 4,000 萬元 5,000 萬元", "B": "6,000 萬元 6,000 萬元 3,000 萬元", "C": "5,000 萬元 4,000 萬元 6,000 萬元", "D": "5,000 萬元 6,000 萬元 4,000 萬元"}, "answer": "D", "note": ""}, {"id": "bookkeeping-96-10", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 10, "question": "下列何者並非應可歸屬為「短期投資」之項目?", "options": {"A": "公平價值變動列入損益之金融資產", "B": "備供出售金融資產", "C": "持有至到期日金融資產", "D": "避險性金融資產"}, "answer": "D", "note": ""}, {"id": "bookkeeping-96-11", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 11, "question": "土地因重估增值所提列之土地增值稅準備,應列為:", "options": {"A": "流動負債", "B": "長期負債", "C": "固定資產-土地之減項", "D": "業主權益其他項目"}, "answer": "B", "note": ""}, {"id": "bookkeeping-96-12", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 12, "question": "依商業會計處理準則之規定,庫藏股票之會計處理應採何種方法?", "options": {"A": "權益法", "B": "面額法", "C": "公平價值法", "D": "成本法"}, "answer": "D", "note": ""}, {"id": "bookkeeping-96-13", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 13, "question": "依現行商業會計處理準則第 26 條之規定,下列敘述何者不正確?", "options": {"A": "法定盈餘公積,指依公司法或其他相關法令規定,自盈餘中指撥之公積", "B": "特別盈餘公積,指依法令或盈餘分派之議案,自盈餘中指撥之公積,以限制股息及紅利之分派者", "C": "未分配盈餘或累積虧損:指未經指撥之盈餘或未經彌補之虧損", "D": "盈餘分配或虧損彌補,應俟業主同意或股東會決議後方可列帳,有盈餘分配或虧損彌補之議案,應在財\n務報表附註中註明"}, "answer": "A", "note": ""}, {"id": "bookkeeping-96-14", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 14, "question": "下列何者並非「業主權益其他項目」?", "options": {"A": "金融商品未實現損益", "B": "長期股權投資未實現跌價損失", "C": "累積換算調整數", "D": "庫藏股"}, "answer": "B", "note": ""}, {"id": "bookkeeping-96-15", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 15, "question": "下列項目何者應歸屬為「資本公積」?", "options": {"A": "公司因股本交易所產生之權益", "B": "處分資產溢價收入之稅後淨額", "C": "公司依資產重估價辦法認列之重估增值", "D": "存貨成本與市價孰低法下市價回升認列之利益"}, "answer": "A", "note": ""}, {"id": "bookkeeping-96-16", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 16, "question": "公司組織停止經營業務時,依公司法規定應辦理何種登記?", "options": {"A": "解散登記", "B": "註銷登記", "C": "停業登記", "D": "歇業登記"}, "answer": "A", "note": ""}, {"id": "bookkeeping-96-17", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 17, "question": "公司停復業有關之申請規定為:", "options": {"A": "公司暫停營業期間每次最長不得超過半年", "B": "公司暫停營業一年以上者,應於停止營業前申請停業登記", "C": "公司停業後欲復業時,應於復業後三十日內申請復業登記", "D": "公司停復業雖未向商業主管機關申請,惟已依稅法規定核備者亦為適法"}, "answer": "D", "note": ""}, {"id": "bookkeeping-96-18", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 18, "question": "下列何者非公開可供任何人查閱或抄錄之公司登記事項?", "options": {"A": "公司所在地", "B": "持股 5%以上之股東名冊", "C": "董事、監察人姓名及持股", "D": "公司章程"}, "answer": "B", "note": ""}, {"id": "bookkeeping-96-19", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 19, "question": "下列有關公司登記文件之查閱或抄錄之敘述,何者不正確?", "options": {"A": "公司負責人或利害關係人得聲敘理由請求查閱或抄錄,但主管機關認為必要時,得拒絕抄閱或限制其抄\n閱範圍", "B": "公司負責人及利害關係人可抄錄設立(變更)登記表(事項卡)", "C": "公司負責人及利害關係人可查閱但禁止抄錄股東董事身分證明文件", "D": "利害關係人得申請抄閱登記機關未作成處分前檢送之登記申請文件"}, "answer": "D", "note": ""}, {"id": "bookkeeping-96-20", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 20, "question": "西南股份有限公司原登記暨實收資本額一千萬元,申請減資八百萬元,增資一千三百萬元併案辦理登記,\n則應繳登記規費多少?", "options": {"A": "5,750 元", "B": "3,250 元", "C": "1,250 元", "D": "1,000 元"}, "answer": "C", "note": ""}, {"id": "bookkeeping-96-21", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 21, "question": "某君曾任職於高雄市國稅局會計室,離職後可否在高雄市執行記帳士業務?", "options": {"A": "可以", "B": "不可以", "C": "離職之日起三年內不可以", "D": "登錄之日起三年內不可以"}, "answer": "A", "note": ""}, {"id": "bookkeeping-96-22", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 22, "question": "林君記帳士登錄後欲執行業務,惟事務所所在地尚無公會組織,則應如何方得執業?", "options": {"A": "敘明無公會可加入之事由,仍可執行業務", "B": "加入該地區之稅務代理人協會後即可執行業務", "C": "加入鄰近地區之記帳士公會後即可執行業務", "D": "加入該地區或鄰近區域之記帳及報稅代理人公會後即可執行業務"}, "answer": "C", "note": ""}, {"id": "bookkeeping-96-23", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 23, "question": "下列何者為記帳士法之主管機關?", "options": {"A": "財政部", "B": "經濟部", "C": "縣市政府", "D": "國稅局"}, "answer": "A", "note": ""}, {"id": "bookkeeping-96-24", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 24, "question": "王君曾因業務侵占經判刑二年確定,並已服刑期滿。下列那一敘述是正確的?", "options": {"A": "王君如原為記帳士,則判刑確定時即應撤銷或廢止其記帳士證書,俟服刑期滿後方得重新請領", "B": "王君如經記帳士考試及格,得依法充任記帳士", "C": "王君不得報考記帳士考試", "D": "王君如經記帳士考試及格,得依法請領記帳士證書,惟不得執行業務"}, "answer": "C", "note": ""}, {"id": "bookkeeping-96-25", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 25, "question": "依記帳士法第 7 條規定,下列何者為記帳士應註銷登錄之原因?", "options": {"A": "不慎摔傷小腿骨折休養中", "B": "出國探親預計二年後回國", "C": "考上博士班就讀", "D": "想改行而提出申請註銷"}, "answer": "D", "note": ""}, {"id": "bookkeeping-96-26", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 26, "question": "記帳士得否在其登記執業區域以外之區域執業?", "options": {"A": "經向主管機關登記即可,免設分事務所", "B": "應設有分事務所,再向主管機關登記即可", "C": "除原登記執業區域外,得向主管機關登記其他執業區域,惟以一處為限", "D": "可,免向主管機關登記"}, "answer": "A", "note": ""}, {"id": "bookkeeping-96-27", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 27, "question": "下列何者非記帳士名簿應登載之事項?", "options": {"A": "出生年月日", "B": "國民身分證統一編號", "C": "記帳士證書取得日期", "D": "開業日期"}, "answer": "C", "note": ""}, {"id": "bookkeeping-96-28", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 28, "question": "記帳士依記帳士法第 16 條設置之簿冊,應保存幾年?", "options": {"A": "10 年", "B": "5 年", "C": "3 年", "D": "1 年"}, "answer": "B", "note": ""}, {"id": "bookkeeping-96-29", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 29, "question": "依記帳士法規定,記帳士受申誡處分多少次以上,應另受停止執行業務處分;受停止執行業務處分累計滿\n多少年者,應予除名?", "options": {"A": "3 次;4 年", "B": "3 次;5 年", "C": "5 次;3 年", "D": "5 次;4 年"}, "answer": "B", "note": ""}, {"id": "bookkeeping-96-30", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 30, "question": "未依法取得記帳士或記帳及報稅代理業務人資格,擅自代他人記帳及報稅者,應受何種處罰?", "options": {"A": "由經濟部處 10 萬元以下罰鍰", "B": "由經濟部處一年以下有期徒刑、拘役或科或併科 15 萬元以下罰金", "C": "由法院處 3 萬元以上 15 萬元以下罰金", "D": "由財政部處 3 萬元以上 15 萬元以下罰鍰"}, "answer": "D", "note": ""}, {"id": "bookkeeping-96-31", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 31, "question": "公營事業股份有限公司主辦會計人員之任免,應優先適用下列那一種法律?", "options": {"A": "公司法", "B": "商業會計法", "C": "會計法", "D": "所得稅法"}, "answer": "C", "note": ""}, {"id": "bookkeeping-96-32", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 32, "question": "五王公司(上櫃公司)於台南增設一分公司,因該分公司初期業務規模不大,故僅聘任一位會計人員全權\n負責該分公司之會計事務處理,則該會計人員係屬:", "options": {"A": "兼(委)任會計", "B": "主辦會計", "C": "會計主管", "D": "經辦會計"}, "answer": "D", "note": ""}, {"id": "bookkeeping-96-33", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 33, "question": "依商業會計法之規定,下列何者不得受委任處理商業會計事務?", "options": {"A": "持有行政院勞工委員會頒發合格證照之會計事務技術士", "B": "會計師", "C": "記帳士", "D": "記帳及報稅代理業務人"}, "answer": "A", "note": ""}, {"id": "bookkeeping-96-34", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 34, "question": "依商業會計法第 9 條規定,商業之支出達一定金額者,應使用之支付工具或方法,不包含下列何者?", "options": {"A": "本票、匯票、支票", "B": "銀行 ATM", "C": "活期存款取款條", "D": "郵政劃撥"}, "answer": "C", "note": ""}, {"id": "bookkeeping-96-35", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 35, "question": "甲公司與不適用商業會計法而採現金基礎之乙商號,其當月份之員工薪資均於次月 5 日發放,則曆年制下\n某年 12 月份之薪資應於何時認列費用?", "options": {"A": "甲公司列為當年度之費用,乙商號列為次年度之費用", "B": "甲公司列為次年度之費用,乙商號列為當年度之費用", "C": "甲公司與乙商號均列為當年度之費用", "D": "甲公司與乙商號均列為次年度之費用"}, "answer": "A", "note": ""}, {"id": "bookkeeping-96-36", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 36, "question": "依商業會計法規定,商業依其實際業務情形所制定之會計制度是否需報備?", "options": {"A": "報請經濟部核備", "B": "報請財政部核備", "C": "報請同業公會核備", "D": "不需報備,自行核定即可"}, "answer": "D", "note": ""}, {"id": "bookkeeping-96-37", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 37, "question": "下列何者非屬商業會計法之子法?", "options": {"A": "商業通用會計制度規範", "B": "商業會計處理準則", "C": "依法取得代他人處理會計事務資格之人管理辦法", "D": "商業使用電子方式處理會計資料辦法"}, "answer": "C", "note": ""}, {"id": "bookkeeping-96-38", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 38, "question": "下列何者為依稅法規定,公司組織買賣業必須設置,而依商業會計法規定得設置之帳簿?", "options": {"A": "日記簿", "B": "總分類帳簿", "C": "存貨明細帳", "D": "營運量紀錄簿"}, "answer": "C", "note": ""}, {"id": "bookkeeping-96-39", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 39, "question": "商業會計法最近一次修正,所增列之財務報表必要註釋事項之一為:", "options": {"A": "會計方法之變更,其理由及對財務報表之影響", "B": "重大之承諾事項及或有事項", "C": "業主權益之重大事項", "D": "資產與負債區分流動與非流動之分類標準"}, "answer": "D", "note": ""}, {"id": "bookkeeping-96-40", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 40, "question": "商業會計法對資本支出與收益支出之劃分有何規定?", "options": {"A": "耐用年限不及二年者得列為當期費用,不必按年提列折舊", "B": "單項支出金額未達新台幣六萬元者得列為當期費用", "C": "支出之效益及於以後各期者,列為資產", "D": "單筆多項支出金額合計未達新台幣六萬元者得列為當期費用"}, "answer": "C", "note": ""}, {"id": "bookkeeping-96-41", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 41, "question": "下列有關商譽以外無形資產攤銷期限之敘述,那一個是正確的?", "options": {"A": "應在其效益年限內攤銷,最長不得超過 20 年", "B": "應在其效益年限內攤銷,除有明確證據者外,其攤銷年限不得超過 20 年", "C": "效益期限可合理估計者,按照效益存續期間攤銷;效益期限無法合理估計者,定期評估其價值,如有減\n損,損失應予認列", "D": "依財務會計準則公報第 37 號之規定,一律不得攤銷,惟應定期評估其價值,如有減損,損失應予認列"}, "answer": "C", "note": ""}, {"id": "bookkeeping-96-42", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 42, "question": "鼓山公司併購文山公司,計付出$836,000,並在其帳上借記商譽$110,000 及其他資產$1,134,000。資產之原\n始帳面價值為$1,040,000,則鼓山公司此筆交易應貸記負債金額為若干?", "options": {"A": "$314,000", "B": "$408,000", "C": "$110,000", "D": "$298,000"}, "answer": "B", "note": ""}, {"id": "bookkeeping-96-43", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 43, "question": "下列何者於 90 年 11 月 12 日公司法修正施行後,95 年 5 月 24 日商業會計法修正施行前,得列為資本公積\n;惟依現行商業會計法之規定,不得列為資本公積之項目?", "options": {"A": "超過票面金額發行股票所得之溢額", "B": "資產重估價增值", "C": "處分資產之溢價收入", "D": "受領贈與之所得"}, "answer": "B", "note": ""}, {"id": "bookkeeping-96-44", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 44, "question": "依商業會計法之規定,下列那一項會計處理之敘述是正確的?", "options": {"A": "商業創業期間發生之費用,應作為當期費用", "B": "數額較大之非常損失,應分五年攤銷", "C": "資產交換應區分同類或不同類資產之交換,前者應按帳面價值法認列換進資產之成本", "D": "固定資產耐用年限屆滿,仍可繼續使用者,不得再提折舊"}, "answer": "A", "note": ""}, {"id": "bookkeeping-96-45", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 45, "question": "適用商業會計法之商業,其營業收入原則上應於何時認列?", "options": {"A": "向供應商進貨時", "B": "接受客戶訂貨時", "C": "交付貨品予客戶時", "D": "自客戶收取現金時"}, "answer": "C", "note": ""}, {"id": "bookkeeping-96-46", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 46, "question": "商業有支付員工退休金之義務者,應於甚麼時候提列退休金準備或提撥與商業完全分離之退休準備金或退\n休基金並認列當期費用?", "options": {"A": "員工在職期間內", "B": "員工離職時", "C": "員工退休時", "D": "員工就業期限內"}, "answer": "A", "note": ""}, {"id": "bookkeeping-96-47", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 47, "question": "乙公司 96 年度所為之下列會計處理中,那一項是正確的?", "options": {"A": "公司章程訂定員工紅利分配率為盈餘之 10%,96 年度依此估列員工紅利可能發放之金額,認列為費用入帳", "B": "公司章程訂定員工紅利分配率為盈餘之 2%至 10%,96 年度依經驗估列員工紅利可能發放之金額,認列為\n費用入帳", "C": "公司章程訂定董監酬勞分配率為盈餘之 10%,96 年度依此估列董監酬勞可能發放之金額,認列為費用入帳", "D": "公司章程訂定員工紅利分配率為盈餘之 10%,96 年度依此估列之員工紅利可能發放金額,仍視為次年度\n之盈餘分配處理"}, "answer": "D", "note": ""}, {"id": "bookkeeping-96-48", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 48, "question": "下列有關商業會計法性質之敘述,何者不正確?", "options": {"A": "商業會計法屬公法", "B": "商業會計法是規範會計資訊的法律", "C": "商業會計法為經濟行政法", "D": "商業會計法屬程序法"}, "answer": "D", "note": ""}, {"id": "bookkeeping-96-49", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 49, "question": "下列何者可認列為提列年度之費用或損失?", "options": {"A": "因防備不可預估之意外損失而提列之準備", "B": "因估計不能收取之債權而提列之備抵呆帳", "C": "因未來擴建廠房所需而提列之改良擴充準備", "D": "因應債券清償所需而提列之償債準備"}, "answer": "B", "note": ""}, {"id": "bookkeeping-96-50", "year": "96", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 50, "question": "元智公司會計年度採四月制(每年 4 月 1 日至次年 3 月 31 日),請問依商業會計法第 65 條規定,該公司\n96 會計年度之決算,最遲應於何時完成?", "options": {"A": "96 年 7 月 15 日", "B": "96 年 4 月 15 日", "C": "97 年 7 月 15 日", "D": "97 年 5 月 31 日"}, "answer": "C", "note": ""}, {"id": "chinese-96-1", "year": "96", "subject": "chinese", "subjectName": "國文", "number": 1, "question": "請閱讀下方原卷的選擇題第 1 題，再選 A、B、C 或 D。", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "B", "note": "", "paper": "096250_1001_國文（作文與測驗）.pdf", "images": ["pages/96/1001-1.jpg"]}, {"id": "chinese-96-2", "year": "96", "subject": "chinese", "subjectName": "國文", "number": 2, "question": "請閱讀下方原卷的選擇題第 2 題，再選 A、B、C 或 D。", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "A", "note": "", "paper": "096250_1001_國文（作文與測驗）.pdf", "images": ["pages/96/1001-1.jpg", "pages/96/1001-2.jpg"]}, {"id": "chinese-96-3", "year": "96", "subject": "chinese", "subjectName": "國文", "number": 3, "question": "至題:\n余家貧,耕植不足以自給,幼稚盈室,缾無儲粟,生生所資,未見其術。\n親故多勸余為長吏,脫然有懷,求之靡途。會有四方之事,諸侯以惠愛為德,\n家叔以余貧苦,遂見用於小邑。於時風波未靜,心憚遠役,彭澤去家百里,公\n田之利,足以為酒,故便求之。及少日,眷然有歸與之情。何則?質性自然,\n非矯厲所得,飢凍雖切,違己交病。嘗從人事,皆口腹自役,於是悵然慷慨,\n深愧平生之志。猶望一稔,當斂裳宵逝,尋程氏妹喪于武昌,情在駿奔,自免\n去職。仲秋至冬,在官八十餘日。因事順心,命篇曰〈歸去來兮〉,乙巳歲十\n一月也。(陶淵明〈歸去來兮辭序〉)\n從這段文章看來,陶淵明此次出仕最主要的動機為何?", "options": {"A": "施展經世濟民的抱負", "B": "不忍心拒絕叔父的好意", "C": "解決家中之生計問題", "D": "因應家族與親故的深切期許"}, "answer": "C", "note": ""}, {"id": "chinese-96-4", "year": "96", "subject": "chinese", "subjectName": "國文", "number": 4, "question": "文中「風波未靜」意指:", "options": {"A": "政局動蕩,戰事頻仍", "B": "風大浪急,交通不便", "C": "淵明前次辭官所引起的風波尚未平息", "D": "彭澤地區的官場風雲詭譎\n96年專門職業及技術人員高等考試建築師、技師、法醫師考試暨普通考試記帳士考試、96年第\n二次專門職業及技術人員高等暨普通考試消防設備人員考試、普通考試不動產經紀人考試試題 代號:\n等 別: 普通考試 \n類 科: 不動產經紀人、記帳士 \n科 目: 國文(作文與測驗) \n全一張\n(背面)\n60110\n60210"}, "answer": "A", "note": ""}, {"id": "chinese-96-5", "year": "96", "subject": "chinese", "subjectName": "國文", "number": 5, "question": "在陶淵明下列詩句中看來,何者是因其「質性自然,非矯厲所得」使然?", "options": {"A": "嗟余寡陋,瞻望弗及。顧慚華鬢,負影隻立", "B": "脂我名車,策我名驥,千里雖遙,孰敢不至", "C": "雖好學與行義,何死生之苦辛!⋯⋯伊古人之慷慨,病奇名之不立", "D": "少無適俗韻,性本愛丘山。⋯⋯羈鳥戀舊林,池魚思故淵"}, "answer": "D", "note": ""}, {"id": "chinese-96-6", "year": "96", "subject": "chinese", "subjectName": "國文", "number": 6, "question": "從這段文章看來,下列何者不是陶淵明辭去彭澤令的因素?", "options": {"A": "天性喜愛自然,無法適應矯揉逢迎的官場文化", "B": "彭澤縣內貪污瀆職嚴重,淵明無法糾舉革弊", "C": "應親友勸告勉強出仕,違背平生的自我期許", "D": "適逢嫁至程家的妹妹去世,急於前往奔喪"}, "answer": "B", "note": ""}, {"id": "chinese-96-7", "year": "96", "subject": "chinese", "subjectName": "國文", "number": 7, "question": "張九齡〈感遇〉云:「孤鴻海上來,池潢不敢顧。側見雙翠鳥,巢在三珠樹。\n矯矯珍木巔,得無金丸懼?美服患人指,高明逼神惡。今我遊冥冥,弋者何\n所慕。」這首詩將孤鴻與雙翠鳥對照起來,以表現詩人立身處世的原則,請\n問以下選項何者非描述雙翠鳥者?", "options": {"A": "池潢不敢顧", "B": "巢在三珠樹", "C": "得無金丸懼", "D": "美服患人指"}, "answer": "A", "note": ""}, {"id": "chinese-96-8", "year": "96", "subject": "chinese", "subjectName": "國文", "number": 8, "question": "離鄉背景 頭角崢嶸 一疇莫展 頤指氣使 破斧沉舟,以上詞\n語沒有錯別字的是:", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "D", "note": ""}, {"id": "chinese-96-9", "year": "96", "subject": "chinese", "subjectName": "國文", "number": 9, "question": "下列文句,沒有錯別字的是:", "options": {"A": "子路是孔子的得意門生,只是過於衝動,所以常遭老師當頭棒嚇", "B": "菊花茶是消暑勝品,有一種清芬的味道", "C": "推銷員要體認這是一份辛苦的工作,雖然履遭拒絕,還是不能氣餒", "D": "雨後,大地顯得晶瑩澄澈"}, "answer": "D", "note": ""}, {"id": "chinese-96-10", "year": "96", "subject": "chinese", "subjectName": "國文", "number": 10, "question": "下列「」中疊字的使用,何者最恰當?", "options": {"A": "提起傷心事,她「撲簌簌」的淚下,不能自己", "B": "教室裡,傳來「鬧哄哄」的讀書聲,有如天籟", "C": "夜裡,一陣「淅零零」的風吹來,他仍然埋首苦讀", "D": "聽他一番敘述,我發出「苦哈哈」的歎息聲,不敢置信"}, "answer": "A", "note": ""}, {"id": "chinese-96-11", "year": "96", "subject": "chinese", "subjectName": "國文", "number": 11, "question": "下列各選項中的成語,意義相近的是:", "options": {"A": "鷸蚌相爭/鶉衣百結/短褐不完", "B": "否極泰來/時來運轉/松柏後凋", "C": "風中殘燭/日薄西山/行將就木", "D": "膠柱鼓瑟/刻舟求劍/杯弓蛇影"}, "answer": "C", "note": ""}, {"id": "chinese-96-12", "year": "96", "subject": "chinese", "subjectName": "國文", "number": 12, "question": "下列文句,沒有錯別字的是:", "options": {"A": "后羿射日、嫦娥奔月的故事,至今仍燴炙人口", "B": "您別閃鑠其詞了,就直截了當的說吧", "C": "百貨公司名牌清倉,入口處人頭洶湧,水歇不通", "D": "警方推斷這起銀行竊案,以員工堅守自盜成分居多"}, "answer": "B", "note": ""}, {"id": "chinese-96-13", "year": "96", "subject": "chinese", "subjectName": "國文", "number": 13, "question": "下列沒有錯別字的選項是:", "options": {"A": "因世利導/囫圇吞棗", "B": "如法泡製/心猿易馬", "C": "冬烘腐儒/嗷嗷待哺", "D": "櫛比麟次/海晏河清"}, "answer": "C", "note": ""}, {"id": "chinese-96-14", "year": "96", "subject": "chinese", "subjectName": "國文", "number": 14, "question": "束髮 強仕之年 弱冠 花甲之年 知命之年,上述關於年齡的\n說法,由少至老依序是:", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "B", "note": ""}, {"id": "chinese-96-15", "year": "96", "subject": "chinese", "subjectName": "國文", "number": 15, "question": "下列柬帖用語的說明,錯誤的是:", "options": {"A": "于歸──女子出嫁", "B": "弄璋──生男代稱", "C": "桃觴──滿月宴客酒席", "D": "踵謝──親自登門道謝"}, "answer": "C", "note": ""}, {"id": "tax-96-1", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 1, "question": "依稅捐稽徵法規定,稅捐之徵收,優先於普通債權,下列那些稅目更優先於一切債權及抵押權?土地增\n值稅 加值型及非加值型營業稅 地價稅 房屋稅", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "D", "note": ""}, {"id": "tax-96-2", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 2, "question": "稅捐稽徵法有關稅捐(不含關稅)之敘述,下列何者錯誤?", "options": {"A": "稅捐之徵收期間為 5 年", "B": "稅捐之稽徵,以稅捐稽徵法優先適用", "C": "稅捐之處罰,採從新從輕原則", "D": "稅捐之核課期間為 5 年"}, "answer": "D", "note": ""}, {"id": "tax-96-3", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 3, "question": "稅捐稽徵法有關送達之規定,下列敘述何者錯誤?", "options": {"A": "應受送達人拒絕收受時,稅捐稽徵機關得將文書寄存送達地之自治或警察機關,作成送達通知書黏貼於\n應受送達人之住所或營業所門首,以為送達", "B": "應受送達人行蹤不明,採公示送達者,自登載新聞紙之日起經二十日,發生送達效力", "C": "應受送達人拒絕收受時,自登載新聞紙之日起經二十日,發生送達效力", "D": "應受送達人在服役中者,得向其父母或配偶以為送達"}, "answer": "C", "note": ""}, {"id": "tax-96-4", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 4, "question": "稅捐稽徵法有關違反稅捐繳納或申報之處罰,下列敘述何者錯誤?", "options": {"A": "納稅義務人以詐術逃漏稅捐者,處五年以下有期徒刑、拘役或科或併科新台幣六萬元以下罰金", "B": "代徵人以詐術不為代徵,處五年以下有期徒刑、拘役或科或併科新台幣六萬元以下罰金", "C": "扣繳義務人侵占已扣繳之稅捐者,處五年以下有期徒刑、拘役或科或併科新台幣六萬元以下罰金", "D": "教唆或幫助納稅義務人逃漏稅捐者,處五年以下有期徒刑、拘役或科或併科新台幣六萬元以下罰金"}, "answer": "D", "note": ""}, {"id": "tax-96-5", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 5, "question": "稅捐稽徵機關按稅籍底冊課徵之稅捐,包括下列何者?地價稅 房屋稅 使用牌照稅 土地增值稅", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "C", "note": ""}, {"id": "tax-96-6", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 6, "question": "稅捐稽徵法規定納稅義務人對於核定稅捐之處分如有不服,應如何提出行政救濟?", "options": {"A": "有應納稅額者,於繳納期間屆滿翌日起算三十日內申請復查", "B": "無應納稅額者,應於核定稅額通知書送達後三十日內申請訴願", "C": "有應納稅額者,應於繳納期間屆滿之日起算三十日內申請復查", "D": "稅捐稽徵機關接到復查申請書後三個月內未作成決定者,納稅義務人得逕行提起訴願"}, "answer": "A", "note": ""}, {"id": "tax-96-7", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 7, "question": "依稅捐稽徵法規定,逾期繳納稅捐應加徵滯納金者,其最高限額為滯納數額之多少百分比?", "options": {"A": "1%", "B": "2%", "C": "3%", "D": "15%"}, "answer": "D", "note": ""}, {"id": "tax-96-8", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 8, "question": "依稅捐稽徵法規定,納稅義務人因天災、事變或遭受重大財產損失,不能於法定期間內繳清稅捐者,得向\n稅捐稽徵機關作何種申請,最長幾年?", "options": {"A": "延期或分期繳納,最長 2 年", "B": "延期或分期繳納,最長 3 年", "C": "不須繳納", "D": "減半繳納,最長 2 年"}, "answer": "B", "note": ""}, {"id": "tax-96-9", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 9, "question": "依稅捐稽徵法規定,稅捐稽徵機關對於納稅義務人逃漏何種稅目有犯罪嫌疑之案件,得聲請當地司法機關\n簽發搜索票?", "options": {"A": "遺產及贈與稅、所得稅", "B": "所得稅、營業稅", "C": "營業稅、貨物稅", "D": "貨物稅、關稅"}, "answer": "B", "note": ""}, {"id": "tax-96-10", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 10, "question": "依所得稅法規定,下列各項獎金應歸屬於那一類所得及其課稅方式?", "options": {"A": "告發或檢舉獎金歸屬其他所得,採分離課稅", "B": "年終獎金屬薪資所得,採分離課稅", "C": "政府舉辦之獎券中獎獎金,屬於競技競賽獎金,併入綜合所得總額", "D": "個人參加自行直銷業績獎金,屬執行業務所得,併入綜合所得總額"}, "answer": "A", "note": ""}, {"id": "tax-96-11", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 11, "question": "依所得稅法規定,下列那一項屬於綜合所得稅規定有限額免稅範圍之所得?", "options": {"A": "現役軍人本職薪餉", "B": "稿費、版稅及講演鐘點費", "C": "國民小學教師本職薪餉", "D": "公務人員所領主管特支費"}, "answer": "B", "note": ""}, {"id": "tax-96-12", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 12, "question": "有關綜合所得稅扣除額之規定,下列敘述何者正確?", "options": {"A": "每個薪資所得者均可減除薪資所得特別扣除額,且扣除金額相同", "B": "災害損失可於限額內減除", "C": "租金支出與自用住宅購屋借款利息支出,兩者只可選擇其一減除且均訂有限額", "D": "申報戶內之受扶養親屬均可減除健保費支出且無限額"}, "answer": "C", "note": ""}, {"id": "tax-96-13", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 13, "question": "依所得稅法規定,員工紅利與員工認股權憑證之課稅規定,下列敘述何者為正確?", "options": {"A": "員工紅利應申報為營利所得", "B": "員工認股權憑證依執行權利日時價超過認股價格之差額屬於其他所得", "C": "員工認股權憑證依執行權利日時價超過認股價格之差額屬於薪資所得", "D": "員工紅利應申報為其他所得"}, "answer": "B", "note": ""}, {"id": "tax-96-14", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 14, "question": "依所得稅法規定,綜合所得總額各類所得之歸屬,下列敘述何者錯誤?", "options": {"A": "押金設算收入屬於租賃所得", "B": "稿費、版稅屬於執行業務所得", "C": "資遣費屬於薪資所得", "D": "公司發放之現金股利屬於營利所得"}, "answer": "C", "note": ""}, {"id": "tax-96-15", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 15, "question": "依所得稅法規定,下列何者非屬營利事業所得稅之申報書?", "options": {"A": "簡易申報書", "B": "藍色申報書", "C": "一般申報書", "D": "普通申報書"}, "answer": "C", "note": ""}, {"id": "tax-96-16", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 16, "question": "依所得稅法規定,教育、文化、公益、慈善機關或團體,轉投資國內營利事業所獲配之股利總額,課稅規\n定如何?", "options": {"A": "股利淨額不計入所得額課稅,可扣抵稅額不得扣抵其應納所得稅額,並不得申請退還", "B": "股利總額不計入所得額課稅,可扣抵稅額得扣抵其應納所得稅額", "C": "股利淨額不計入所得額課稅,可扣抵稅額不得扣抵其應納所得稅額,但可申請退還", "D": "股利淨額計入所得額課稅,可扣抵稅額不得扣抵其應納所得稅額,並不得申請退還"}, "answer": "A", "note": ""}, {"id": "tax-96-17", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 17, "question": "依所得稅法規定,下列何者非為所得稅法規定的扣繳義務人?", "options": {"A": "公司的負責人", "B": "機關、團體之責應扣繳單位主管", "C": "信託行為受益人不特定時的委託人", "D": "破產財團的管理人"}, "answer": "C", "note": ""}, {"id": "tax-96-18", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 18, "question": "依所得稅法規定,有關綜合所得稅按消費者物價指數調整之規定,下列敘述何者錯誤?", "options": {"A": "免稅額較上次調整年度之指數上漲累計達 3%時調整之", "B": "課稅級距較上次調整年度之指數上漲累計達 10%時調整之", "C": "所稱消費者物價指數係指行政院主計處公布至上年度十月底為止十二個月平均消費者物價指數", "D": "教育學費特別扣除額較上次調整年度之指數上漲累計達 3%時調整之"}, "answer": "D", "note": ""}, {"id": "tax-96-19", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 19, "question": "有關我國兩稅合一制度,下列敘述何者正確?", "options": {"A": "公司在分配與股東股利時,才得分配可扣抵稅額與股東", "B": "公司分配員工紅利時,得分配可扣抵稅額與員工", "C": "公司提列法定盈餘公積時,股東可扣抵稅額將增加", "D": "稽徵機關核定增加營利事業所得稅額時,股東可扣抵稅額將減少"}, "answer": "A", "note": ""}, {"id": "tax-96-20", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 20, "question": "甲公司今年欲配發給非居住者 A 君股利淨額 20 萬元,設該分配日帳上累積未分配盈餘(87 年以後)有 600\n萬元,其中已加徵 10%營利事業所得稅之未分配盈餘為 180 萬元,若 A 君股利之扣繳率為 20%,則 A 君之\n股利應扣繳多少稅額?", "options": {"A": "2.8 萬元", "B": "3.4 萬元", "C": "4 萬元", "D": "不須扣繳"}, "answer": "B", "note": ""}, {"id": "tax-96-21", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 21, "question": "李君去年結算申報應納稅額為 20 萬元,李君的薪資、短期票券利息、稿費所得的扣繳稅額分別為 18 萬元\n、3 萬元、2 萬元,另外還有股利可扣抵稅額 5 萬元,則李君可退稅金額為若干?", "options": {"A": "11 萬元", "B": "8 萬元", "C": "5 萬元", "D": "1 萬元"}, "answer": "C", "note": ""}, {"id": "tax-96-22", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 22, "question": "依所得稅法規定,有關綜合所得稅未申報案件,稽徵機關應如何處理,下列敘述何者正確?", "options": {"A": "須加徵滯報金", "B": "須加徵怠報金", "C": "稽徵機關依查得資料核定應納稅額", "D": "稽徵機關須向納稅義務人進行催報"}, "answer": "C", "note": ""}, {"id": "tax-96-23", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 23, "question": "依所得稅法規定,扣繳義務人未依規定扣繳稅款者,除限期責令補繳應扣繳稅款及補報扣繳憑單外,並按\n未扣繳或短扣繳之稅額處幾倍罰鍰?", "options": {"A": "1 倍", "B": "2 倍", "C": "3 倍", "D": "10 倍"}, "answer": "A", "note": ""}, {"id": "tax-96-24", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 24, "question": "在我國境內未設有分支機構之美國 A 公司為境內甲公司提供技術服務所獲取之收入,因成本費用分攤困難\n,經財政部核准得依所得稅法第 25 條規定,按收入額百分比計算所得者,則甲公司支付 300,000 元技術服\n務報酬予 A 公司時,其核定之課稅所得額為若干?", "options": {"A": "30,000 元", "B": "45,000 元", "C": "60,000 元", "D": "75,000 元"}, "answer": "B", "note": ""}, {"id": "tax-96-25", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 25, "question": "依所得稅法規定,營利事業應採下列何種會計基礎?", "options": {"A": "現金收付制", "B": "權責發生制", "C": "公司組織採權責發生制;非公司組織經核准後得申報採現金收付制", "D": "聯合基礎制"}, "answer": "C", "note": ""}, {"id": "tax-96-26", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 26, "question": "依所得稅法規定,會計年度採七月制之營利事業,其扣繳憑單應於何時申報?", "options": {"A": "一月份", "B": "七月份", "C": "八月份", "D": "九月份"}, "answer": "A", "note": ""}, {"id": "tax-96-27", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 27, "question": "下列何者不計入加值型及非加值型營業稅之銷售額?", "options": {"A": "關稅", "B": "菸酒稅", "C": "貨物稅", "D": "本次銷售之加值型及非加值型營業稅"}, "answer": "D", "note": ""}, {"id": "tax-96-28", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 28, "question": "下列何者非屬我國加值型及非加值型營業稅課稅範圍?", "options": {"A": "在中華民國境內銷售貨物", "B": "在中華民國境內銷售勞務", "C": "進口貨物", "D": "個人受雇提供之勞務"}, "answer": "D", "note": ""}, {"id": "tax-96-29", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 29, "question": "下列何者不屬於加值型及非加值型營業稅法之納稅義務人?", "options": {"A": "進口貨物收貨人", "B": "購買國外勞務之買受人", "C": "進口貨物之報關行", "D": "銷售貨物或勞務之營業人"}, "answer": "C", "note": ""}, {"id": "tax-96-30", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 30, "question": "下列何者不屬於加值型及非加值型營業稅法之視為銷售貨物?", "options": {"A": "以進口供銷售之貨物轉供營業人自用", "B": "營業人委託他人代銷貨物", "C": "營業人解散或廢止營業時將餘存之貨物抵償債務", "D": "因信託行為委託人將貨物移轉於受託人"}, "answer": "D", "note": ""}, {"id": "tax-96-31", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 31, "question": "下列何項貨物或勞務之加值型及非加值型營業稅稅率為零?", "options": {"A": "出售土地", "B": "銷售未經加工之生鮮農、林、漁、牧產物", "C": "銷售與科學工業園區內園區事業之機器設備", "D": "各級政府發行之債券"}, "answer": "C", "note": ""}, {"id": "tax-96-32", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 32, "question": "下列貨物,何者於中華民國境內銷售及進口時均免徵加值型及非加值型營業稅?", "options": {"A": "金條、金塊、金片、金幣", "B": "國際運輸用之船舶、航空器及遠洋漁船所使用之貨物", "C": "本國之古物", "D": "依法免徵關稅之貨物"}, "answer": "A", "note": ""}, {"id": "tax-96-33", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 33, "question": "我國進口貨物之加值型及非加值型營業稅,目前是由那個機關徵收?", "options": {"A": "海關代徵", "B": "國稅局徵收", "C": "港務局代收", "D": "稅捐稽徵處徵收"}, "answer": "A", "note": ""}, {"id": "tax-96-34", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 34, "question": "營業人申報加值型及非加值型營業稅,下列敘述何者錯誤?", "options": {"A": "除另有規定外,營業人無銷售額仍須申報", "B": "一般營業人應以每 2 個月為一期,於次期開始 15 日內申報", "C": "外銷貨物適用零稅率者得申請以每個月為一期申報", "D": "按特種稅額計算加值型及非加值型營業稅之營業人得申請以每個月為一期申報"}, "answer": "D", "note": ""}, {"id": "tax-96-35", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 35, "question": "營業人將餘存貨物抵償債務時,應按何種價格計算加值型及非加值型營業稅之銷售額?", "options": {"A": "成本", "B": "售價", "C": "時價", "D": "約定價格"}, "answer": "C", "note": ""}, {"id": "tax-96-36", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 36, "question": "加值型營業人甲公司適用 401 申報書,某期申報銷項稅額 400,000 元,該期申報零稅率銷售額為 7,000,000 元,\n進項稅額 900,000 元,其中內含固定資產的進項稅額為 200,000 元,甲公司無留抵稅額,則甲公司該期可退還之\n稅額為多少?", "options": {"A": "200,000 元", "B": "350,000 元", "C": "500,000 元", "D": "550,000 元"}, "answer": "C", "note": ""}, {"id": "tax-96-37", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 37, "question": "營業人下列那一項之進項稅額,不得扣抵銷項稅額?", "options": {"A": "宴客之餐費支出", "B": "公司舉行業務檢討會所支付之費用", "C": "營業場所水、電、瓦斯之收據", "D": "購置機器設備"}, "answer": "A", "note": ""}, {"id": "tax-96-38", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 38, "question": "設甲公司民國 96 年 7 月及 8 月有銷項稅額 35 萬元,進項稅額 35 萬元,甲公司遲至 96 年 10 月 21 日才申\n報加值型及非加值型營業稅,試問甲公司將被處以怠報金為新台幣多少元?", "options": {"A": "0 元", "B": "1,000 元", "C": "1,200 元", "D": "3,000 元"}, "answer": "D", "note": ""}, {"id": "tax-96-39", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 39, "question": "下列有關加值型及非加值型營業稅稅率之敘述,何者為錯誤?", "options": {"A": "夜總會的稅率為 15%", "B": "銷售農產品之小規模營業人的稅率為 1%", "C": "保險業之再保費收入的稅率為 1%", "D": "典當業的稅率為 2%"}, "answer": "B", "note": ""}, {"id": "tax-96-40", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 40, "question": "外國技藝表演業於 8 月 10 日至 8 月 30 日期間在台北市演出,其於 9 月 10 日離境,則應於下列那一日期前\n報繳加值型及非加值型營業稅?", "options": {"A": "9 月 1 日", "B": "9 月 5 日", "C": "9 月 10 日", "D": "9 月 14 日"}, "answer": "C", "note": ""}, {"id": "tax-96-41", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 41, "question": "依營利事業所得稅查核準則之規定,下列有關旅費支出之所得稅查核,何者正確?", "options": {"A": "員工所領之差旅費,無限額之限制", "B": "交通費應取得憑證,不可以經手人證明代替", "C": "限額內之膳雜費無須外來憑證", "D": "國外出差膳宿雜費自行訂有宿費檢據核實報銷辦法者,其膳雜費以中央政府各機關派赴國外各地區出差\n人員生活費日支數額表日支數額之六成列支"}, "answer": "C", "note": ""}, {"id": "tax-96-42", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 42, "question": "依營利事業所得稅查核準則規定,下列何者不可以修繕費科目列報?", "options": {"A": "修繕支出效能不及兩年,或金額不超過六萬元", "B": "修繕支出效能不及兩年,但金額超過六萬元", "C": "修繕支出效能超過二年,但金額不超過六萬元", "D": "修繕支出效能超過二年,且金額超過六萬元"}, "answer": "D", "note": ""}, {"id": "tax-96-43", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 43, "question": "依營利事業所得稅查核準則規定,營利事業可依下列那些項目提撥職工福利金?創立時登記實收資本額 \n現金增資資本額 下腳變價收入 副產品收入 每月營業收入總額", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "D", "note": ""}, {"id": "tax-96-44", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 44, "question": "依營利事業所得稅查核準則規定,營利事業出租資產,於下列何種條件下,應採融資租賃會計處理?", "options": {"A": "租賃期間達租賃物法定耐用年數四分之三以上者", "B": "租賃期間屆滿時,租賃物所有權屬出租人", "C": "租賃現值總額達租賃資產帳面價值百分之八十以上", "D": "承租人未享有優惠承購權"}, "answer": "A", "note": ""}, {"id": "tax-96-45", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 45, "question": "甲公司 96 年 8 月 1 日銷售一部成本 540,000 元之汽車與宋先生,其現銷價格為 720,000 元,宋先生選擇分\n36 個月付款,每月初付款 25,000 元,甲公司 96 年度以毛利百分比法申報所得稅應認列毛利若干?", "options": {"A": "25,000 元", "B": "50,000 元", "C": "220,000 元", "D": "360,000 元"}, "answer": "B", "note": ""}, {"id": "tax-96-46", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 46, "question": "營利事業取得統一發票,按址查對不正確亦無進貨事實者,稽徵機關應如何辦理?", "options": {"A": "依所得稅法第 27 條按最低價格認定成本,並依稅捐稽徵法第 44 條處認定金額的 5%罰鍰", "B": "依所得稅法第 44 條由稽徵機關估定成本", "C": "進貨不予認定,並依所得稅法第 110 條處漏稅罰", "D": "依稅捐稽徵法第 44 條處認定金額的 5%罰鍰"}, "answer": "C", "note": ""}, {"id": "tax-96-47", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 47, "question": "依營利事業所得稅查核準則規定,上期因耗用原料、物料等與耗用率不符,而調整之金額,應如何處理?", "options": {"A": "應列入次年之期初存貨", "B": "不得列為次年之期初存貨", "C": "應列入次年之期末存貨", "D": "列為申報營業成本之加項"}, "answer": "B", "note": ""}, {"id": "tax-96-48", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 48, "question": "依營利事業所得稅查核準則規定,下列何項未實現之費用及損失,依法不得提列準備?", "options": {"A": "備抵呆帳", "B": "勞工退休準備金", "C": "國內投資損失準備", "D": "國外投資損失準備"}, "answer": "C", "note": ""}, {"id": "tax-96-49", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 49, "question": "營利事業如因出售者未給與統一發票,致無法取得合法憑證,符合何種條件下,准按實際進價核定進貨成\n本,並免依稅捐稽徵法第 44 條規定處罰?能提示送貨單及支付貨款證明 已誠實入帳 於稽徵機關\n發現前由會計師簽證揭露或自行於申報書揭露 經稽徵機關查明屬實者", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "D", "note": ""}, {"id": "tax-96-50", "year": "96", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 50, "question": "營利事業之會計事項,財務報表之產生應參照商業會計法,至辦理所得稅結算申報時,其帳載事項與有關\n稅務及其他法令之規定未符者,營利事業應於何處自行調整之?", "options": {"A": "營利事業所得稅結算申報書內", "B": "財務報表內", "C": "營利事業所得稅結算申報書及財務報表內", "D": "不須調整"}, "answer": "A", "note": ""}, {"id": "accounting-97-1", "year": "97", "subject": "accounting", "subjectName": "會計學概要", "number": 1, "question": "上市櫃公司除年報外,尚須公布各項期中報表,其目的在提高會計資訊的:", "options": {"A": "一致性", "B": "時效性", "C": "可驗證性", "D": "可比較性"}, "answer": "B", "note": ""}, {"id": "accounting-97-2", "year": "97", "subject": "accounting", "subjectName": "會計學概要", "number": 2, "question": "甲、乙二商店同於本年某月 1 日向商場承租店面一間,租金相同,且均預付一整年租金。惟因記帳方法\n不同,年底兩店所作之調整分錄分別為甲店:(借記)預付租金$80,000,(貸記)租金費用$80,000;乙店:\n(借記)租金費用$40,000,(貸記)預付租金$40,000。試問每月租金為若干?又起租日為何?", "options": {"A": "每月租金$10,000,起租日 9 月 1 日", "B": "每月租金$5,000,起租日 9 月 1 日", "C": "每月租金$10,000,起租日 10 月 1 日", "D": "每月租金$5,000,起租日 10 月 1 日"}, "answer": "A", "note": ""}, {"id": "accounting-97-3", "year": "97", "subject": "accounting", "subjectName": "會計學概要", "number": 3, "question": "利君公司帳上各科目之正常餘額為:現金$20,000、應收帳款$50,000、備抵壞帳$5,000、設備$600,000、\n應付帳款$45,000、短期借款$100,000、股本$500,000、保留盈餘$20,000。若發生以現金支付水電費\n$1,000 後,則下列敘述何者正確:", "options": {"A": "資產總額$669,000", "B": "負債總額$146,000", "C": "資產總額$664,000", "D": "股東權益$521,000"}, "answer": "C", "note": ""}, {"id": "accounting-97-4", "year": "97", "subject": "accounting", "subjectName": "會計學概要", "number": 4, "question": "富甲公司存貨採定期盤存制,其 8 月份有關資料如下:進貨$600,000、進貨退回$25,000、進貨折扣$11,000、\n進貨運費$19,000、期初存貨$45,000、期末存貨$55,000、銷貨$750,000,銷貨退回$30,000。8 月份之\n銷貨成本為:", "options": {"A": "$554,000", "B": "$573,000", "C": "$595,000", "D": "$576,000"}, "answer": "B", "note": ""}, {"id": "accounting-97-5", "year": "97", "subject": "accounting", "subjectName": "會計學概要", "number": 5, "question": "當流動資產金額大於流動負債時,以現金償還應付票據會造成:", "options": {"A": "營運資金無影響,流動比率減少", "B": "營運資金無影響,流動比率增加", "C": "營運資金增加,流動比率無影響", "D": "營運資金減少,流動比率無影響"}, "answer": "B", "note": ""}, {"id": "accounting-97-6", "year": "97", "subject": "accounting", "subjectName": "會計學概要", "number": 6, "question": "存貨採永續盤存制的公司,當發生銷貨退回時,應作分錄之借貸科目為:", "options": {"A": "借:銷貨退回;借:存貨;貸:應收帳款;貸:銷貨成本", "B": "借:銷貨收入;借:銷貨成本;貸:應收帳款;貸:進貨", "C": "借:銷貨收入;貸:應收帳款", "D": "借:銷貨退回;貸:應收帳款"}, "answer": "A", "note": ""}, {"id": "accounting-97-7", "year": "97", "subject": "accounting", "subjectName": "會計學概要", "number": 7, "question": "前鋒公司採備抵法處理應收帳款可能產生之壞帳。試問當應收帳款發生壞帳沖銷及期末提列壞帳費用\n時,對應收帳款帳面價值之影響分別為:", "options": {"A": "增加減少", "B": "減少減少", "C": "不變不變", "D": "不變減少"}, "answer": "D", "note": ""}, {"id": "accounting-97-8", "year": "97", "subject": "accounting", "subjectName": "會計學概要", "number": 8, "question": "下列銀行往來調節表中的調節事項,那一項須在公司帳上作調整分錄?", "options": {"A": "未兌現支票", "B": "在途存款", "C": "存款帳戶的利息收入", "D": "銀行扣帳錯誤"}, "answer": "C", "note": ""}, {"id": "accounting-97-9", "year": "97", "subject": "accounting", "subjectName": "會計學概要", "number": 9, "question": "心心公司於第一年以每股$50 買回其面額$10 之普通股 6,000 股,第二年度再以每股$36 出售其中 3,000\n股,已知該公司之前未曾有過庫藏股交易。試問於第二年出售庫藏股時,其分錄應為?", "options": {"A": "借:現金$108,000、資本公積-庫藏股票交易$42,000;貸:庫藏股$150,000", "B": "借:現金$108,000、保留盈餘$42,000;貸:庫藏股$150,000", "C": "借:現金$108,000、資本公積-庫藏股票交易$42,000;貸:庫藏股$120,000、普通股股本$30,000", "D": "借:現金$108,000、保留盈餘$42,000;貸:庫藏股$120,000、普通股股本$30,000"}, "answer": "B", "note": ""}, {"id": "accounting-97-10", "year": "97", "subject": "accounting", "subjectName": "會計學概要", "number": 10, "question": "零用金採定額預付制的公司,如果零用金在會計期間期末有動用但未撥補,將造成本期財務報表:", "options": {"A": "費用低估,資產高估", "B": "費用無誤,資產高估", "C": "費用無誤,資產低估", "D": "費用低估,資產無誤"}, "answer": "A", "note": ""}, {"id": "accounting-97-11", "year": "97", "subject": "accounting", "subjectName": "會計學概要", "number": 11, "question": "文心公司本月份關於存貨科目的期初餘額與交易資料如下:\n1/1 期初存貨 120 單位,每單位平均成本為$700\n1/10 以每單位$990,賣出 100 單位\n1/20 以每單位$800,進貨 180 單位\n1/30 以每單位$1,000,賣出 150 單位\n設公司採永續盤存制移動平均法,本月底資產負債表中之存貨金額為:(存貨單價之計算採四捨五入至個\n位數)", "options": {"A": "$38,000", "B": "$42,500", "C": "$40,000", "D": "$39,500"}, "answer": "D", "note": ""}, {"id": "accounting-97-12", "year": "97", "subject": "accounting", "subjectName": "會計學概要", "number": 12, "question": "保留盈餘之提撥,將使股東權益總額:", "options": {"A": "增加", "B": "減少", "C": "不變", "D": "不一定"}, "answer": "C", "note": ""}, {"id": "accounting-97-13", "year": "97", "subject": "accounting", "subjectName": "會計學概要", "number": 13, "question": "以下何者可包括於資產負債表中「現金」項下:", "options": {"A": "郵票", "B": "印花稅票", "C": "償債基金中之存款", "D": "即期支票"}, "answer": "D", "note": ""}, {"id": "accounting-97-14", "year": "97", "subject": "accounting", "subjectName": "會計學概要", "number": 14, "question": "大華公司對於存貨採定期盤存制、先進先出法。已知該公司於 X6 年及 X7 年年底均因盤點有誤,導致存貨\n分別低估$5,000 及高估$4,000,試問該錯誤對 X8 年底之資產負債表的影響為:", "options": {"A": "資產高估,股東權益高估", "B": "資產正確,股東權益正確", "C": "資產低估,股東權益低估", "D": "資產高估,股東權益正確"}, "answer": "B", "note": ""}, {"id": "accounting-97-15", "year": "97", "subject": "accounting", "subjectName": "會計學概要", "number": 15, "question": "台南公司於第一年 1 月 2 日發行 6%、十年期公司債,面額$1,000,000,以 2%溢價發行,採用直線法攤銷\n溢價。至第八年 12 月 31 日,該公司以折價 4%之價格由公開市場買回面額$300,000 公司債,則應認列:\n(不計所得稅之影響)", "options": {"A": "$13,200 之利益", "B": "$12,000 之利益", "C": "$12,000 之損失", "D": "$10,800 之利益"}, "answer": "A", "note": ""}, {"id": "accounting-97-16", "year": "97", "subject": "accounting", "subjectName": "會計學概要", "number": 16, "question": "下列何項目不應包括在期末存貨中?", "options": {"A": "寄銷存放在外之寄銷品", "B": "存放於本公司倉庫內之承銷品", "C": "購入以起運點交貨之在途商品,期末尚未運抵本公司", "D": "出售以目的地交貨之在途商品,期末尚未運達買方公司"}, "answer": "B", "note": ""}, {"id": "accounting-97-17", "year": "97", "subject": "accounting", "subjectName": "會計學概要", "number": 17, "question": "發行公司債之公司對於發行溢折價若採實利率法攤銷,則溢折價於發行期間各期攤銷之金額將逐期:", "options": {"A": "溢價攤銷金額:增加;折價攤銷金額:增加", "B": "溢價攤銷金額:增加;折價攤銷金額:減少", "C": "溢價攤銷金額:減少;折價攤銷金額:減少", "D": "溢價攤銷金額:減少;折價攤銷金額:增加"}, "answer": "A", "note": ""}, {"id": "accounting-97-18", "year": "97", "subject": "accounting", "subjectName": "會計學概要", "number": 18, "question": "下列那一項相關支出,不應列為新購入土地之成本?", "options": {"A": "為興建新廠房,原土地上舊廠房之拆除費用", "B": "整地費用", "C": "支付地上原住戶之搬運費", "D": "挖掘新廠房地基之費用"}, "answer": "D", "note": ""}, {"id": "accounting-97-19", "year": "97", "subject": "accounting", "subjectName": "會計學概要", "number": 19, "question": "華成公司被控其工廠排放之廢水造成環境汙染,該公司律師認為極有可能敗訴,依合理估計將被處以 500\n萬元至 800 萬元之罰鍰。設該事件對該公司之影響重大,則損益表中應如何處理?", "options": {"A": "僅須認列 500 萬元之或有損失", "B": "認列 800 萬元之或有損失以符合穩健原則", "C": "認列 500 萬元之或有損失,另附註揭露額外或有數額 300 萬元", "D": "不須認列或有損失,但附註揭露可能遭受損失之金額區間"}, "answer": "C", "note": ""}, {"id": "accounting-97-20", "year": "97", "subject": "accounting", "subjectName": "會計學概要", "number": 20, "question": "同昌公司本期損益表有利息費用$328,450,已知期初有應付利息$4,000、預付利息$5,000,期末有應付利\n息$3,000、預付利息$6,000,則本期利息付現金額為:", "options": {"A": "$332,450", "B": "$330,450", "C": "$326,450", "D": "$324,450"}, "answer": "B", "note": ""}, {"id": "accounting-97-21", "year": "97", "subject": "accounting", "subjectName": "會計學概要", "number": 21, "question": "發行股票換取非現金資產時,應以何者為入帳金額?", "options": {"A": "股票面額", "B": "非現金資產之原始取得成本", "C": "以非現金資產原始成本與當前公平價值低者入帳", "D": "以股票與非現金資產二者公平價值較易客觀確定者為入帳基礎"}, "answer": "D", "note": ""}, {"id": "accounting-97-22", "year": "97", "subject": "accounting", "subjectName": "會計學概要", "number": 22, "question": "大平公司於本年初以$500,000 購入估計蘊藏 100,000 噸煤礦的土地,煤礦開採完畢須以$60,000 將土地整\n理復原,整修後土地可售得$40,000。本年度公司共開採 25,000 噸,出售 23,000 噸,試問損益表中煤礦之\n銷貨成本中包含若干折耗費用?", "options": {"A": "130,000", "B": "119,600", "C": "125,000", "D": "115,000"}, "answer": "B", "note": ""}, {"id": "accounting-97-23", "year": "97", "subject": "accounting", "subjectName": "會計學概要", "number": 23, "question": "宏達公司本年 1 月 1 日流通在外的普通股為 20,000 股,5 月 1 日發放 20%股票股利,7 月 1 日現金增資 6,000\n股,11 月 1 日做股票分割,1 股分割成 2 股。已知本年度稅後淨利為$162,000,則宏達公司每股盈餘為:", "options": {"A": "$4.05", "B": "$5.28", "C": "$3.00", "D": "$6.00"}, "answer": "C", "note": ""}, {"id": "accounting-97-24", "year": "97", "subject": "accounting", "subjectName": "會計學概要", "number": 24, "question": "忠孝公司於本年度 9 月 1 日購入甲公司股票 100,000 股,每股$28,手續費$8,400。至 12 月 31 日忠孝公\n司仍持有以上股票,並歸類為「備供出售之金融資產」,而每股市價已上升至每股$30,則忠孝公司本年\n度報表中應如何表達?", "options": {"A": "損益表中認列評價利益$191,600", "B": "損益表中認列評價利益$200,000", "C": "資產負債表中認列未實現利益$191,600", "D": "資產負債表中認列未實現利益$200,000"}, "answer": "C", "note": ""}, {"id": "accounting-97-25", "year": "97", "subject": "accounting", "subjectName": "會計學概要", "number": 25, "question": "下列何者最能反映企業運用股東投入資本的績效?", "options": {"A": "總資產報酬率", "B": "股東權益報酬率", "C": "每股淨值", "D": "股利支付率"}, "answer": "B", "note": ""}, {"id": "bookkeeping-97-1", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 1, "question": "依商業會計法規定,下列商業提列之準備,那一種可認列當期費用?", "options": {"A": "償債準備", "B": "退休金準備", "C": "意外損失準備", "D": "設備更新準備"}, "answer": "B", "note": ""}, {"id": "bookkeeping-97-2", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 2, "question": "依商業會計處理準則之規定,下列有關短期投資之敘述,何者不正確?", "options": {"A": "公平價值變動列入損益之金融資產及備供出售金融資產,應於資產負債表日採公平價值評價", "B": "上市或上櫃股票及存託憑證之公平價值係指資產負債表日之收盤價", "C": "備供出售金融資產係指除公平價值變動列入損益之金融資產以外之非衍生性金融資產", "D": "短期投資供債務作質、質押或存出保證金者,如所擔保之債務為流動負債,仍列為短期投資"}, "answer": "C", "note": ""}, {"id": "bookkeeping-97-3", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 3, "question": "依商業會計處理準則規定,銀行透支屬於下列那一性質項目下之科目?", "options": {"A": "基金與投資", "B": "流動負債", "C": "其他資產", "D": "其他負債"}, "answer": "B", "note": ""}, {"id": "bookkeeping-97-4", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 4, "question": "依商業會計處理準則規定,下列有關明星公司之應收票據會計處理,何者為正確之處理方式?", "options": {"A": "將一張 8 個月內到期之應收票據以面值評價", "B": "決算時,評估應收票據無法收現之金額,並採用財務報表附註方式揭露此事項", "C": "將提供擔保之應收票據扣除並加註說明", "D": "將業已確定無法收回之應收票據保留在帳上,並於報表附註中揭露其影響範圍"}, "answer": "A", "note": ""}, {"id": "bookkeeping-97-5", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 5, "question": "期初存貨多計 6,000 元,期末存貨少計 6,000 元,將使本期淨利金額發生下列何種變動?", "options": {"A": "不變,仍然正確", "B": "多計 6,000 元", "C": "少計 12,000 元", "D": "多計 12,000 元"}, "answer": "C", "note": ""}, {"id": "bookkeeping-97-6", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 6, "question": "依商業會計處理準則規定,備供於營業出售之製成品存貨,應採用何種方法進行評價?", "options": {"A": "市價法", "B": "成本與市價孰低法", "C": "成本法", "D": "淨變現價值法"}, "answer": "B", "note": ""}, {"id": "bookkeeping-97-7", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 7, "question": "依商業會計處理準則規定,應付公司債折價攤銷會有下列何種正確影響?", "options": {"A": "提高利息支出", "B": "提高利息費用", "C": "降低利息費用", "D": "降低利息支出"}, "answer": "B", "note": ""}, {"id": "bookkeeping-97-8", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 8, "question": "依商業會計處理準則規定,下列有關已認列之商譽減損損失之處理方式,何者正確?", "options": {"A": "視企業性質,可於一定範圍內迴轉", "B": "可部分迴轉,但須說明原因", "C": "可全部迴轉", "D": "不得迴轉"}, "answer": "D", "note": ""}, {"id": "bookkeeping-97-9", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 9, "question": "依據商業會計處理準則之規定,下列關於研究支出與發展支出會計處理之敘述何者不正確?", "options": {"A": "自行發展之無形資產,其屬不能明確辨認者,不得列記資產", "B": "完成該無形資產已達技術可行性時,即得予資本化", "C": "資本化金額不得超過未來預期之收入減除再發生之研究費用、生產成本及銷管費用後之現值", "D": "資本化金額不得超過預計未來可回收淨收益之現值"}, "answer": "BC", "note": "答B或C者均給分"}, {"id": "bookkeeping-97-10", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 10, "question": "依商業會計法規定,商業應設置會計帳簿目錄,記明其設置使用之帳簿名稱、性質、啟用停用日期,由下\n列那些人會同簽名或蓋章?", "options": {"A": "商業負責人及經理人", "B": "經理人及主辦會計人員", "C": "主辦會計人員及經辦會計人員", "D": "商業負責人及經辦會計人員"}, "answer": "D", "note": ""}, {"id": "bookkeeping-97-11", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 11, "question": "依商業會計法規定,下列有關公司組織之主辦會計人員任免規定,下列敘述何者不正確?", "options": {"A": "如為股份有限公司,應由董事會以董事過半數之出席,及出席董事過半數之同意", "B": "如為有限公司,應有全體股東過半數之同意", "C": "如為無限公司,應有全體無限責任股東過半數之同意", "D": "如為兩合公司,應有全體股東過半數之同意"}, "answer": "D", "note": ""}, {"id": "bookkeeping-97-12", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 12, "question": "依商業會計處理準則規定,有關非常損益項目在損益表列示位置,下列敘述何者正確?", "options": {"A": "停業部門損益與會計原則變動累積影響數之後", "B": "停業部門損益與會計原則變動累積影響數之前", "C": "停業部門損益與會計原則變動累積影響數之間", "D": "停業部門損益之前與會計原則變動累積影響數之後"}, "answer": "C", "note": ""}, {"id": "bookkeeping-97-13", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 13, "question": "採備抵法認列壞帳費用時,當實際發生壞帳數低於所提列之備抵呆帳時,壞帳發生對財務報表之影響為何?", "options": {"A": "總資產減少", "B": "總資產不變", "C": "流動資產減少", "D": "營運資金減少"}, "answer": "B", "note": ""}, {"id": "bookkeeping-97-14", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 14, "question": "台北公司於民國 96 年 1 月 1 日發行面額 1,000,000 元,年利率 9%之公司債券,共收到 939,000 元。債券發\n行時之市場利率為 10 %,利息指定於每年 12 月 31 日支付。台北公司係採用有效利息法攤銷債券折價,試\n計算台北公司民國 96 年 12 月 31 日之帳列債券未攤銷折價金額應為多少?", "options": {"A": "59,100 元", "B": "63,100 元", "C": "61,100 元", "D": "57,100 元"}, "answer": "D", "note": ""}, {"id": "bookkeeping-97-15", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 15, "question": "依據商業會計法第 45 條之規定,如果某公司帳上應收帳款餘額為 500,000 元,備抵呆帳餘額為 50,000 元\n(貸),試問當該公司發現有應收帳款 60,000 元確定無法收回時,下列會計處理何者正確?", "options": {"A": "借記呆帳損失 10,000 元", "B": "借記應收帳款 60,000 元", "C": "貸記備抵呆帳 50,000 元", "D": "貸記應收帳款 50,000 元"}, "answer": "A", "note": ""}, {"id": "bookkeeping-97-16", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 16, "question": "甲公司年底調整前試算表上之收入為 27,000 元,費用為 17,300 元,假定必須調整之事項如下:預付租金已\n過期部分為 2,500 元、本期折舊為 1,500 元、已賺得但尚未入帳之收益為 1,900 元。試問本期稅前淨利為多\n少?", "options": {"A": "5,700 元", "B": "3,800 元", "C": "7,600 元", "D": "6,300 元"}, "answer": "C", "note": ""}, {"id": "bookkeeping-97-17", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 17, "question": "林口公司在今年以一筆定期存款作質押品向銀行借款,而該筆存款所擔保之借款被該公司歸屬為短期借款。\n試問在林口公司資產負債表上,該筆存款應以下列何會計科目表達?", "options": {"A": "現金", "B": "其他流動資產", "C": "短期投資", "D": "其他資產"}, "answer": "B", "note": ""}, {"id": "bookkeeping-97-18", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 18, "question": "受贈資產按公平市價入帳,並視其性質,以不同科目記錄,試問以下那一選項並非商業會計法第 42 條所規\n定之科目?", "options": {"A": "保留盈餘", "B": "資本公積", "C": "收入", "D": "遞延收入"}, "answer": "A", "note": ""}, {"id": "bookkeeping-97-19", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 19, "question": "依商業會計處理準則規定,下列對庫藏股的敘述何者正確?", "options": {"A": "資產加項", "B": "資產減項", "C": "業主權益減項", "D": "業主權益加項"}, "answer": "C", "note": ""}, {"id": "bookkeeping-97-20", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 20, "question": "依商業會計處理準則規定,有關持有至到期日債券投資之下列敘述,何者不正確?", "options": {"A": "指具有固定或可決定之收取金額及固定到期日,且商業有積極意圖及能力持有至到期日之衍生性與非衍\n生性金融資產", "B": "持有至到期日債券投資應以攤銷後成本衡量", "C": "於一年到期之持有至到期日投資應改列為流動資產", "D": "未被指定為備供出售"}, "answer": "A", "note": ""}, {"id": "bookkeeping-97-21", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 21, "question": "依商業會計處理準則規定,分期付款銷貨之未實現收入應如何於報表中列示?", "options": {"A": "列為銷貨收入之加項", "B": "列為負債之加項", "C": "列為銷貨收入之減項", "D": "列為應收帳款之減項"}, "answer": "D", "note": ""}, {"id": "bookkeeping-97-22", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 22, "question": "按商業會計處理準則規定,租賃資產之評價應採下列何種方法?", "options": {"A": "公平價值", "B": "帳面價值", "C": "公平價值或帳面價值均可", "D": "公平價值或帳面價值較低者"}, "answer": "B", "note": ""}, {"id": "bookkeeping-97-23", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 23, "question": "以下對於設備更新準備的敘述何者不正確?", "options": {"A": "為指定用途之保留盈餘", "B": "列於股東權益項下", "C": "完成設備更新後,如無須再限制盈餘分配,可將設備更新準備轉回保留盈餘", "D": "指撥設備更新準備會降低股東權益"}, "answer": "D", "note": ""}, {"id": "bookkeeping-97-24", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 24, "question": "土地因重估增值所提列之土地增值稅準備,按商業會計處理準則之規定,應按下列那一個項目列記?", "options": {"A": "長期負債", "B": "資本公積", "C": "短期負債", "D": "長期負債或資本公積"}, "answer": "A", "note": ""}, {"id": "bookkeeping-97-25", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 25, "question": "依商業會計處理準則相關規定,使電腦軟體達技術可行性以前所發生之成本應按下列那一個科目列記?", "options": {"A": "無形資產", "B": "電腦軟體", "C": "研究發展費用", "D": "未完工程"}, "answer": "C", "note": ""}, {"id": "bookkeeping-97-26", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 26, "question": "依商業會計處理準則規定,有關避險性金融負債之下列敘述,何者不正確?", "options": {"A": "指依避險會計指定,且為有效避險工具之金融負債", "B": "應以公平價值衡量", "C": "屬於流動者,列為應付短期票券", "D": "屬於非流動者,列在其他負債項下"}, "answer": "C", "note": ""}, {"id": "bookkeeping-97-27", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 27, "question": "依商業會計處理準則規定,以下那個選項不屬於業主權益之調整項目?", "options": {"A": "會計原則變動之累積影響數", "B": "金融商品未實現損益", "C": "累積換算調整數", "D": "未實現重估增值"}, "answer": "A", "note": ""}, {"id": "bookkeeping-97-28", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 28, "question": "依商業會計處理準則規定,下列那一項不應歸類在其他資產項下?", "options": {"A": "出租資產", "B": "存出保證金", "C": "長期應收票據", "D": "租賃權益改良"}, "answer": "D", "note": ""}, {"id": "bookkeeping-97-29", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 29, "question": "依商業會計處理準則規定,下列有關停業部門損益之敘述,何者不正確?", "options": {"A": "指本期內處分或決定處分之重要部門所發生之停業部門營業損益、處分損益及依淨公平價值衡量損益", "B": "停業部門在當年度未處分完畢者,其淨資產應按帳面金額評價", "C": "停業部門在當年度處分完畢者,以處分損益稅後淨額列示", "D": "停業部門損益應列示於繼續營業部門稅後損益項目之後"}, "answer": "B", "note": ""}, {"id": "bookkeeping-97-30", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 30, "question": "依商業會計處理準則規定,下列那個項目並非保留盈餘或累積虧損之內容?", "options": {"A": "前期損益調整項目", "B": "提列法定盈餘公積項目", "C": "分派股利項目", "D": "資本公積項目"}, "answer": "D", "note": ""}, {"id": "bookkeeping-97-31", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 31, "question": "若有一存貨的單位成本為 63 元,市價為 62 元,淨變現價值為 61 元,淨變現價值減正常利潤為 58 元,試\n問依成本與市價孰低法所決定之存貨價值為多少元?", "options": {"A": "63 元", "B": "62 元", "C": "61 元", "D": "58 元"}, "answer": "C", "note": ""}, {"id": "bookkeeping-97-32", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 32, "question": "依商業會計法規定,資本支出歸屬於下列那一類別?", "options": {"A": "費用", "B": "損失", "C": "資產", "D": "負債"}, "answer": "C", "note": ""}, {"id": "bookkeeping-97-33", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 33, "question": "依商業會計法規定,下列何項非屬於商業決算營業報告書之內容?", "options": {"A": "獲利能力分析", "B": "營業方針", "C": "營業收支預算執行情形", "D": "現金收支資訊"}, "answer": "D", "note": ""}, {"id": "bookkeeping-97-34", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 34, "question": "依商業會計處理準則規定,利息支出在現金流量表中,被歸為下列那一類活動?", "options": {"A": "營業活動", "B": "投資活動", "C": "融資活動", "D": "視情況列為投資活動或融資活動"}, "answer": "A", "note": ""}, {"id": "bookkeeping-97-35", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 35, "question": "依商業會計法規定,進貨發票屬於下列那一種憑證?", "options": {"A": "內部憑證", "B": "對外憑證", "C": "外來憑證", "D": "記帳憑證"}, "answer": "C", "note": ""}, {"id": "bookkeeping-97-36", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 36, "question": "依記帳士法規定,下列那一項業務不是記帳士之執行業務範圍?", "options": {"A": "受委任辦理各項稅捐之行政訴訟事項", "B": "受委任辦理營業登記事項", "C": "受委任辦理各項稅捐稽徵案件之申報事項", "D": "受理稅務諮詢事項"}, "answer": "A", "note": ""}, {"id": "bookkeeping-97-37", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 37, "question": "依記帳士法規定,記帳士受申誡處分 3 次以上者,應另受下列那一項處分?", "options": {"A": "除名", "B": "罰鍰", "C": "警告", "D": "停止執行業務"}, "answer": "D", "note": ""}, {"id": "bookkeeping-97-38", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 38, "question": "依記帳士法規定,同一人連續擔任記帳士公會理事長之最長時間為多久?", "options": {"A": "2 年", "B": "4 年", "C": "6 年", "D": "8 年"}, "answer": "D", "note": ""}, {"id": "bookkeeping-97-39", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 39, "question": "依記帳士法規定,本法規定有關書照簿表格式,應由下列那個單位負責訂定?", "options": {"A": "記帳士公會全國聯合會", "B": "直轄市與縣市記帳士公會", "C": "財政部", "D": "會計研究基金會"}, "answer": "C", "note": ""}, {"id": "bookkeeping-97-40", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 40, "question": "依記帳士法規定,記帳士受委任後,非有正當事由,不得終止其契約。如須終止契約,應於幾日前通知委\n任人,且在未得委任人同意前,不得終止進行?", "options": {"A": "10 日", "B": "15 日", "C": "20 日", "D": "30 日"}, "answer": "A", "note": ""}, {"id": "bookkeeping-97-41", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 41, "question": "依記帳士法規定,記帳士執行業務所設置之簿冊,應保存幾年?", "options": {"A": "5 年", "B": "6 年", "C": "8 年", "D": "10 年"}, "answer": "A", "note": ""}, {"id": "bookkeeping-97-42", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 42, "question": "依記帳士法規定,下列那一項並非記帳士接受委任辦理商業會計事務時,與委任人訂立之委任書中,應載\n明之事項?", "options": {"A": "委任人之地址", "B": "委任權限", "C": "酬金數額", "D": "受委任人之證書字號"}, "answer": "C", "note": ""}, {"id": "bookkeeping-97-43", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 43, "question": "依記帳士法規定,下列那一項並非記帳士執行業務所設置簿冊應載明之事項?", "options": {"A": "委任案件之類別", "B": "委任權限", "C": "委任人之地址", "D": "委任案件之內容"}, "answer": "B", "note": ""}, {"id": "bookkeeping-97-44", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 44, "question": "依記帳士法規定,直轄市及縣(市)記帳士公會,應由該行政區域內開業記帳士幾人以上發起組織之?", "options": {"A": "20 人", "B": "25 人", "C": "30 人", "D": "40 人"}, "answer": "C", "note": ""}, {"id": "bookkeeping-97-45", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 45, "question": "依記帳士法規定,下列那一項目,非為記帳士法所規定之記帳士懲戒處分方式?", "options": {"A": "警告", "B": "申誡", "C": "停止執行業務 2 個月以上,3 年以下", "D": "除名"}, "answer": "C", "note": ""}, {"id": "bookkeeping-97-46", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 46, "question": "依公司法規定,公司登記事項中,除了下列那一項外,任何人得至主管機關之資訊網站查閱?", "options": {"A": "公司章程", "B": "資本總額或實收資本額", "C": "執行業務或代表公司之股東", "D": "經理人姓名"}, "answer": "A", "note": ""}, {"id": "bookkeeping-97-47", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 47, "question": "依公司法相關法規規定,有限公司應於章程訂立後幾日內,向主管機關申請為設立之登記?", "options": {"A": "10 日", "B": "15 日", "C": "20 日", "D": "30 日"}, "answer": "B", "note": ""}, {"id": "bookkeeping-97-48", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 48, "question": "依公司法規定,代表公司之負責人若未依規定於申請期限內辦理登記,經主管機關責令限期改正後,期滿\n仍未改正者,除繼續責令限期改正外,並按次連續處新臺幣多少元之罰鍰,至改正為止?", "options": {"A": "新臺幣 1 萬元以上,5 萬元以下", "B": "新臺幣 1 萬元以上,10 萬元以下", "C": "新臺幣 2 萬元以上,5 萬元以下", "D": "新臺幣 2 萬元以上,10 萬元以下"}, "answer": "D", "note": ""}, {"id": "bookkeeping-97-49", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 49, "question": "公司之登記及認許辦法係依據公司法第幾條規定所訂定者?", "options": {"A": "第 387 條", "B": "第 388 條", "C": "第 391 條", "D": "第 392 條"}, "answer": "A", "note": ""}, {"id": "bookkeeping-97-50", "year": "97", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 50, "question": "依公司法規定,公司登記,申請人於登記後,確知其登記事項有錯誤或遺漏時,應如何處理?", "options": {"A": "免予更正", "B": "應另申請變更登記", "C": "申請更正", "D": "已登記事項不得予以更正"}, "answer": "C", "note": ""}, {"id": "chinese-97-1", "year": "97", "subject": "chinese", "subjectName": "國文", "number": 1, "question": "至題:\n公儀休相魯而嗜魚,一國盡爭買魚而獻之,公儀子不受。其弟諫曰:「夫子嗜\n魚而不受者何也?」對曰:「夫唯嗜魚,故不受也。夫即受魚,必有下人之色;有\n下人之色,將枉於法。枉於法則免於相,雖嗜魚,此必不能致我魚,我又不能自給\n魚。即無受魚而不免於相,雖嗜魚,我能長自給魚。」此明夫恃人不如自恃也,明\n於人之為己者不如己之自為也。(韓非子〈外儲說右下〉)\n關於本文的敘述,以下選項何者不正確?", "options": {"A": "身為大臣,不應對魚有特別嗜好", "B": "嗜好食魚,應憑藉己力自致之", "C": "對於他人之言,應辨別分明而知所取捨", "D": "權勢雖可誘人以利,不如奉法自守為宜"}, "answer": "A", "note": ""}, {"id": "chinese-97-2", "year": "97", "subject": "chinese", "subjectName": "國文", "number": 2, "question": "文中公儀休言:「夫唯嗜魚,故不受也」,此種行事風格,可說是:", "options": {"A": "不近人情", "B": "深謀遠慮", "C": "矯揉造作", "D": "以退為進"}, "answer": "B", "note": ""}, {"id": "chinese-97-3", "year": "97", "subject": "chinese", "subjectName": "國文", "number": 3, "question": "文中「夫即受魚,必有下人之色;有下人之色,將枉於法」,意思是:", "options": {"A": "大丈夫如接受他人之魚,便不得不對其人假以辭色,而這樣做卻有違國家法理", "B": "身為國相,如果常受人贈魚,必定會像下人一般對其致謝,違反朝廷尊卑法度", "C": "如果我接受他人贈魚,必定會對其人降顏示好,久而久之,可能做出觸法之事", "D": "假使我接受了魚,一定會對人卑躬屈膝,雖損害國相尊嚴,而無害於國法伸張\n閱讀下文,回答第"}, "answer": "C", "note": ""}, {"id": "chinese-97-4", "year": "97", "subject": "chinese", "subjectName": "國文", "number": 4, "question": "至題:\n吳起者,衛人也,好用兵。嘗學於曾子,事魯君。齊人攻魯,魯欲將吳起,吳起\n取齊女為妻,而魯疑之。吳起於是欲就名,遂殺其妻,以明不與齊也。魯卒以為將,\n將而攻齊,大破之。魯人或惡吳起曰:「起之為人,猜忍人也......起殺妻以求將......」\n魯君疑之,謝吳起。吳起於是聞魏文侯賢,欲事之。文侯問李克曰:「吳起何如人哉?」\n李克曰:「起貪而好色,然用兵司馬穰苴不能過也。」於是魏文侯以為將,擊秦,拔\n五城。起之為將,與士卒最下者同衣食。臥不設席,行不騎乘,親裹贏糧,與士卒分\n勞苦。卒有病疽者,起為吮之,卒母聞而哭之,人曰:「子卒也,而將軍自吮其疽,\n何哭為?」母曰:「非然也。往年吳公吮其父,其父戰不旋踵,遂死於敵。吳公今又\n吮其子,妾不知其死所矣,是以哭之。」文侯以吳起善用兵,廉平,盡能得士心,乃\n以為西河守,以拒秦、韓。(司馬遷《史記.孫子吳起列傳》)\n吳起殺妻以求將的行為,文中給予怎樣的評價?", "options": {"A": "不拘小節", "B": "大義滅親", "C": "猜疑殘忍", "D": "忠君愛國\n97年專門職業及技術人員高等考試建築師、技師考試暨普通考試記帳士考試、97年第二次\n專門職業及技術人員高等暨普通考試消防設備人員考試、普通考試不動產經紀人考試試題 代號:\n等 別:普通考試\n類 科:不動產經紀人、記帳士\n科 目:國文(作文與測驗)\n全一張\n(背面)\n60110\n60210"}, "answer": "C", "note": ""}, {"id": "chinese-97-5", "year": "97", "subject": "chinese", "subjectName": "國文", "number": 5, "question": "司馬遷在這段文章中引用李克的話,說:「起貪而好色。」其後又說:魏文侯認\n為「吳起善用兵,廉平」。再觀察吳起的所作所為,可見吳起所貪得的,應當是:", "options": {"A": "友情愛情", "B": "爵位榮名", "C": "美德令名", "D": "衣食贏糧"}, "answer": "B", "note": ""}, {"id": "chinese-97-6", "year": "97", "subject": "chinese", "subjectName": "國文", "number": 6, "question": "魏文侯任用吳起為將,其主因在於:", "options": {"A": "吳起曾在魯國為將", "B": "每一個士兵生了病,吳起都親任醫療之責,能得人心", "C": "吳起精擅用兵,勝過軍事家司馬穰苴", "D": "吳起曾經打敗齊國、秦國的軍隊,又是曾子的得意門生"}, "answer": "C", "note": ""}, {"id": "chinese-97-7", "year": "97", "subject": "chinese", "subjectName": "國文", "number": 7, "question": "下列詩歌或對聯所歌詠的人物,非屬《三國演義》中的是:", "options": {"A": "我志在刪述,垂輝映千春。希聖如有立,絕筆於獲麟", "B": "得相能開國,生兒不象賢。淒涼蜀故妓,來舞魏宮前", "C": "心在朝廷,原無論先主 後主;名遍天下,何必辨襄陽 南陽", "D": "顧曲有閒情,不礙破曹真事業;飲醇原雅量,偏嫌生亮並英雄"}, "answer": "A", "note": ""}, {"id": "chinese-97-8", "year": "97", "subject": "chinese", "subjectName": "國文", "number": 8, "question": "自然萬象的變化,季節的推移,往往是創作時最重要的素材,下列何者為吟詠秋\n季之作?", "options": {"A": "凍解池開綠,雲穿半天晴。遊心不應動,為此欲逢迎", "B": "打起黃鶯兒,莫教枝上啼。啼時驚妾夢,不得到遼西", "C": "花開幾千葉,水覆數重衣。蝶颺縈空舞,燕做同心飛", "D": "祝融解炎轡,蓐收起涼駕。高風催節變,凝露督物化"}, "answer": "D", "note": ""}, {"id": "chinese-97-9", "year": "97", "subject": "chinese", "subjectName": "國文", "number": 9, "question": "下列各「然」字的意義,何者與其他選項不同?", "options": {"A": "憂讒畏譏,滿目蕭「然」(范仲淹〈岳陽樓記〉)", "B": "當時士大夫家皆「然」,人不相非也(司馬光〈訓儉示康〉)", "C": "峰回路轉,有亭翼
