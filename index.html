任免,公司章程不得訂定比商業會計法較高之規定"}, "answer": "D", "note": ""}, {"id": "bookkeeping-101-15", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 15, "question": "依據我國商業會計法之規定,商業之支出達一定金額者,應使用匯票、本票、支票、劃撥、電匯、轉帳\n或其他經主管機關核定之支付工具或方法,並載明受款人。試問目前中央主管機關公告此一定之金額為\n新臺幣:", "options": {"A": "10 萬元", "B": "50 萬元", "C": "100 萬元", "D": "200 萬元"}, "answer": "C", "note": ""}, {"id": "bookkeeping-101-16", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 16, "question": "依據我國商業會計法之規定,下列有關會計憑證之敘述,何者錯誤?", "options": {"A": "證明處理會計事項人員之責任,而為記帳所根據之憑證稱為記帳憑證", "B": "收入傳票與支出傳票皆屬記帳憑證", "C": "由其商業本身自行製存者屬於內部原始憑證", "D": "自其商業本身以外之人所取得者稱為對外憑證"}, "answer": "D", "note": ""}, {"id": "bookkeeping-101-17", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 17, "question": "依據我國商業會計法之規定,會計事項應按發生次序逐日登帳,至遲不得超過多久的時間?", "options": {"A": "10 天", "B": "20 天", "C": "1 個月", "D": "2 個月"}, "answer": "D", "note": ""}, {"id": "bookkeeping-101-18", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 18, "question": "依據我國商業會計法之規定,下列有關會計憑證與帳簿之敘述,何者錯誤?", "options": {"A": "各項會計憑證,除應永久保存或有關未結會計事項者外,應於年度決算程序辦理終了後,至少保存五年", "B": "各項會計帳簿及財務報表,應於年度決算程序辦理終了後,至少保存五年", "C": "會計憑證,應按日或按月裝訂成冊,有原始憑證者,應附於記帳憑證之後", "D": "會計事項應取得並可取得之會計憑證,如因經辦或主管該項人員之故意或過失,致該項會計憑證毀損、\n缺少或滅失而致商業遭受損害時,該經辦或主管人員應負賠償之責"}, "answer": "B", "note": ""}, {"id": "bookkeeping-101-19", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 19, "question": "依據我國商業會計法之規定,資產之取得以現金以外之其他資產或承擔負債交換者,以公平價值入帳為\n原則。公平價值無法可靠衡量時,應如何處理?", "options": {"A": "按換入資產之帳面金額減去支付之現金,作為換入資產成本", "B": "按換入資產之帳面金額作為換入資產成本", "C": "按換出資產之帳面金額加支付之現金,或減去收到之現金,作為換入資產成本", "D": "依其取得價格加上自取得至適於營業上使用或出售之一切必要而合理之支出,作為換入資產成本"}, "answer": "C", "note": ""}, {"id": "bookkeeping-101-20", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 20, "question": "有關庫藏股帳面價值之計算,依商業會計處理準則第 27 條規定應採:", "options": {"A": "加權平均法", "B": "先進先出法", "C": "個別認定法", "D": "後進先出法"}, "answer": "A", "note": ""}, {"id": "bookkeeping-101-21", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 21, "question": "依據我國商業會計法之規定,下列有關存貨評價與處理之敘述,何者錯誤?", "options": {"A": "商品存貨、存料、在製品、製成品、副產品等存貨之衡量,以實際成本為原則;成本高於淨變現價值\n時,應以淨變現價值為準", "B": "所稱淨變現價值,係指企業預期正常營業出售存貨所能取得之淨額", "C": "成本之計算得按存貨之種類或性質,採用個別辨認法、先進先出法、加權平均法、移動平均法或其他\n經主管機關核定之方法計算之", "D": "存貨跌價損失應列為營業費用"}, "answer": "D", "note": ""}, {"id": "bookkeeping-101-22", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 22, "question": "依據我國商業會計法之規定,下列敘述何者錯誤?", "options": {"A": "購入之商譽、商標權、專利權、著作權、特許權及其他等無形資產,應以實際成本為取得成本", "B": "無形資產以自行發展取得者,應以所發生之研究支出及發展支出作為取得成本", "C": "無形資產之經濟效益期限可合理估計者,應按照效益存續期限攤銷", "D": "商譽及其他經濟效益期限無法合理估計之無形資產,應定期評估其價值,如有減損,損失應予認列"}, "answer": "B", "note": ""}, {"id": "bookkeeping-101-23", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 23, "question": "依據我國商業會計法之規定,下列有關資產重估價之會計處理,何者錯誤?", "options": {"A": "固定資產、遞耗資產及無形資產,得依法令規定辦理資產重估價", "B": "自用土地得按公告現值調整之", "C": "辦理固定資產重估或調整而發生之增值,應列為業主權益項下之未實現重估增值", "D": "經重估之資產,應按其重估後之價額入帳,但其折舊、折耗或攤銷之計提,均應以重估前價值為基礎,\n繼續提列折舊"}, "answer": "D", "note": ""}, {"id": "bookkeeping-101-24", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 24, "question": "商業負責人應於會計年度終了後多久時間內,將商業之決算報表提請商業出資人、合夥人或股東承認?", "options": {"A": "二個月內", "B": "三個月內", "C": "六個月內", "D": "一年內"}, "answer": "C", "note": ""}, {"id": "bookkeeping-101-25", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 25, "question": "依據我國商業會計法之規定,下列敘述何者錯誤?", "options": {"A": "未依法取得代他人處理會計事務之資格而擅自代他人處理商業會計事務者,處新臺幣十萬元以下罰金", "B": "未依法取得代他人處理會計事務之資格而擅自代他人處理商業會計事務者,經查獲後三年內再犯者,\n處一年以下有期徒刑、拘役或科或併科新臺幣十萬元以下罰金", "C": "商業負責人、主辦及經辦會計人員或依法受託代他人處理會計事務之人員,偽造或變造會計憑證、會\n計帳簿報表內容或毀損其頁數者,處五年以下有期徒刑、拘役或科或併科新臺幣六十萬元以下罰金", "D": "使用電子方式處理會計資料之商業,其商業負責人、主辦及經辦會計人員或以電子方式處理會計資料\n之有關人員故意登錄或輸入不實資料,處五年以下有期徒刑、拘役或科或併科新臺幣六十萬元以下罰金"}, "answer": "B", "note": ""}, {"id": "bookkeeping-101-26", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 26, "question": "下列何者非記帳憑證之內容?", "options": {"A": "商業名稱", "B": "傳票名稱", "C": "統一編號", "D": "摘要"}, "answer": "C", "note": ""}, {"id": "bookkeeping-101-27", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 27, "question": "依據我國商業會計處理準則之規定,定期存款提供債務作質者,如所擔保之債務為長期負債,應列為:", "options": {"A": "流動資產", "B": "其他流動資產", "C": "其他資產", "D": "預付資產"}, "answer": "C", "note": ""}, {"id": "bookkeeping-101-28", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 28, "question": "依據我國商業會計處理準則之規定,分期付款銷貨之未實現利息收入,應如何處理?", "options": {"A": "借記應收利息科目", "B": "貸記保留盈餘", "C": "列為營業費用", "D": "列為應收帳款之減項"}, "answer": "D", "note": ""}, {"id": "bookkeeping-101-29", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 29, "question": "公平價值變動列入損益之金融資產及備供出售金融資產,採公平價值評價,有關上市或上櫃股票及存託\n憑證之「公平價值」,下列敘述何者正確?", "options": {"A": "指資產負債表日之收盤價", "B": "指資產負債表日之淨值", "C": "指 12 月份之月平均收盤價", "D": "指資產負債表日之均價"}, "answer": "A", "note": ""}, {"id": "bookkeeping-101-30", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 30, "question": "意圖持有至到期日債券投資之衡量基礎為:", "options": {"A": "公平價值", "B": "成本", "C": "攤銷後成本", "D": "淨變現價值"}, "answer": "C", "note": ""}, {"id": "bookkeeping-101-31", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 31, "question": "依據商業會計處理準則之規定,下列何項會計科目不屬於業主權益其他科目?", "options": {"A": "庫藏股", "B": "資本公積", "C": "累積換算調整數", "D": "金融商品未實現損益"}, "answer": "B", "note": ""}, {"id": "bookkeeping-101-32", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 32, "question": "依據我國商業會計處理準則之規定,對於資產負債表日之翌日起至財務報表提出日前所發生之重大災害\n損失的期後事項,應如何處理?", "options": {"A": "調整前期損益", "B": "調整期初保留盈餘", "C": "應於財務報表註釋說明", "D": "不需做任何處理"}, "answer": "C", "note": ""}, {"id": "bookkeeping-101-33", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 33, "question": "依據商業會計處理準則之規定,下列何項營業外收益及費損,應分別列示?", "options": {"A": "金融資產評價利益及金融資產評價損失", "B": "利息收入及利息費用", "C": "兌換盈益及兌換損失", "D": "處分投資增益及處分投資損失"}, "answer": "B", "note": ""}, {"id": "bookkeeping-101-34", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 34, "question": "有關行政處分之要素,下列何者錯誤?", "options": {"A": "行政機關", "B": "單方行政行為", "C": "特定或可得特定之具體事件", "D": "對外間接發生法律效果"}, "answer": "D", "note": ""}, {"id": "bookkeeping-101-35", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 35, "question": "下列何者非屬無效之行政處分?", "options": {"A": "內容違背公共秩序、善良風俗者", "B": "不能由書面處分中得知處分機關者", "C": "內容對少數人而言屬不能實現者", "D": "應以證書方式作成而未給予證書者"}, "answer": "C", "note": ""}, {"id": "bookkeeping-101-36", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 36, "question": "依照我國行政程序法的規定,違法行政處分於法定救濟期間經過後,若撤銷該處分對公益並無危害,而\n受益人無該法第 119 條所列信賴不值得保護之情形且信賴利益顯然大於撤銷所欲維護之公益者,則下列\n敘述何者正確?", "options": {"A": "原處分機關不得依職權為全部或一部之撤銷", "B": "原處分之上級機關得依職權為全部或一部之撤銷", "C": "救濟期間已過,原處分已確定,只能依法提起訴願", "D": "應自原處分機關或其上級機關知有撤銷原因時起一年內為之"}, "answer": "A", "note": "答A給分"}, {"id": "bookkeeping-101-37", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 37, "question": "依據我國行政程序法之規定,下列有關授予利益之行政處分的敘述,何者錯誤?", "options": {"A": "授予利益之違法行政處分經撤銷後,如受益人無信賴不值得保護之情形,其因信賴該處分致遭受財產\n上之損失者,為撤銷之機關應給予合理之補償", "B": "授予利益之合法行政處分,經法規准許廢止者,得由原處分機關依職權為全部或一部之廢止", "C": "授予利益之合法行政處分之廢止,應自廢止原因發生後一年內為之", "D": "對於授予利益之違法行政處分產生之補償爭議及補償金額,相對人有不服者,得向行政法院提起給付\n訴訟"}, "answer": "C", "note": ""}, {"id": "bookkeeping-101-38", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 38, "question": "公法上之請求權,除法律有特別規定外,原則上因幾年間不行使而消滅?", "options": {"A": "1 年", "B": "3 年", "C": "5 年", "D": "15 年"}, "answer": "C", "note": ""}, {"id": "bookkeeping-101-39", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 39, "question": "下列有關「商業登記法」主管機關之敘述,何者正確?", "options": {"A": "在中央為行政院經濟建設委員會", "B": "在直轄市為稅捐稽徵處", "C": "在中央為財政部", "D": "在縣(市)為縣(市)政府"}, "answer": "D", "note": ""}, {"id": "bookkeeping-101-40", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 40, "question": "依照商業登記法第 12 條之規定,法定代理人為無行為能力人或限制行為能力人經營已登記之商業者,下\n列敘述何者錯誤?", "options": {"A": "該商業負責人仍為無行為能力或限制行為能力者本人", "B": "應於十五日內申請登記", "C": "登記時應加具法定代理人證明文件", "D": "法定代理人為商業負責人"}, "answer": "A", "note": ""}, {"id": "bookkeeping-101-41", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 41, "question": "公司之登記或認許,由代理人申請時,代理人係指:", "options": {"A": "以會計師為限", "B": "以會計師、記帳士為限", "C": "以會計師、律師為限", "D": "以會計師、律師、記帳士為限"}, "answer": "C", "note": ""}, {"id": "bookkeeping-101-42", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 42, "question": "外國公司擬在中華民國境內營業者應先經認許,並於認許後幾日內向主管機關申請分公司設立登記?", "options": {"A": "十日內", "B": "十五日內", "C": "二十日內", "D": "三十日內"}, "answer": "B", "note": ""}, {"id": "bookkeeping-101-43", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 43, "question": "依照我國商業登記法的規定,商業之繼承登記,應自繼承開始後多少時間內,申請為變更登記?", "options": {"A": "15 天內", "B": "30 天內", "C": "3 個月內", "D": "6 個月內"}, "answer": "D", "note": ""}, {"id": "bookkeeping-101-44", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 44, "question": "下列有關商業登記法之規定,何者錯誤?", "options": {"A": "商業遷移於原登記機關之管轄區域以外時,應向遷入區域之主管機關申請遷址之登記", "B": "商業暫停營業一個月以上者,應於停業前申請停業之登記", "C": "停業期間,最長不得超過半年。但有正當理由,經商業所在地主管機關核准者,不在此限", "D": "已依加值型及非加值型營業稅法規定申報核備停復業者,不必再向商業登記主管機關辦理停復業登記"}, "answer": "C", "note": ""}, {"id": "bookkeeping-101-45", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 45, "question": "依據我國商業登記法之規定,商業終止營業時,應自事實發生之日起幾日內,申請歇業登記?", "options": {"A": "十日內", "B": "十五日內", "C": "二十日內", "D": "三十日內"}, "answer": "B", "note": ""}, {"id": "bookkeeping-101-46", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 46, "question": "依據我國商業登記法之規定,下列有關商業名稱之敘述,何者錯誤?", "options": {"A": "商業之名稱,得以其負責人姓名或其他名稱充之", "B": "商業之名稱,不得使用易於使人誤認為與政府機關或公益團體有關之名稱", "C": "以合夥人之姓名為商業名稱,則該合夥人退夥後,就絕對不能再使用其姓名為商業名稱", "D": "商業在同一直轄市或縣(市),不得使用與已登記之商業相同之名稱"}, "answer": "C", "note": ""}, {"id": "bookkeeping-101-47", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 47, "question": "未經設立登記而以商業名義經營業務或為其他法律行為者,商業所在地主管機關應命行為人限期辦妥登\n記;屆期未辦妥者,處新臺幣多少之罰鍰,並得按次連續處罰?", "options": {"A": "新臺幣一萬元以上五萬元以下", "B": "新臺幣六千元以上三萬元以下", "C": "新臺幣二千元以上一萬元以下", "D": "新臺幣一千元以上五千元以下"}, "answer": "A", "note": ""}, {"id": "bookkeeping-101-48", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 48, "question": "記帳士應本下列何項原則執行業務?", "options": {"A": "信賴原則", "B": "誠實信用原則", "C": "公正原則", "D": "獨立原則"}, "answer": "B", "note": ""}, {"id": "bookkeeping-101-49", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 49, "question": "依中華民國記帳士職業道德規範,下列敘述何者錯誤?", "options": {"A": "記帳士得允諾他人以自己名義執行業務", "B": "記帳士對其聘用之人員,應予適當之指導及監督", "C": "記帳士對外有關業務文件,必要時應親自簽名或蓋章", "D": "記帳士執行業務應恪遵記帳士法及有關法令規定"}, "answer": "A", "note": ""}, {"id": "bookkeeping-101-50", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 50, "question": "下列各項敘述何者不符合記帳士執行業務之倫理道德規範?", "options": {"A": "記帳士不得藉其業務上獲知之秘密,基於對委託人或第三者不良之企圖,而有任何不法行為", "B": "記帳士對於不能勝任之委辦事項,可以先接受,再複委託其他合格記帳士代為處理", "C": "記帳士不得以詆毁同業或其他不正當方法延攬業務", "D": "記帳士如聘雇他記帳士之現職人員,得徵詢他記帳士之意見"}, "answer": "B", "note": ""}, {"id": "chinese-101-1", "year": "101", "subject": "chinese", "subjectName": "國文", "number": 1, "question": "往有商人,貸他半錢,久不得償,即便往債。前有大河,雇他兩錢,然後得渡。到\n彼往債,竟不得見。來還渡河,復雇兩錢。為半錢債而失四錢,兼有道路疲勞乏困,\n所債甚少,所失極多,果被眾人之所怪笑。(引自《百喻經》)文中商人行徑,最\n適合用下列那一成語形容之?", "options": {"A": "捨近求遠", "B": "因小失大", "C": "尺短寸長", "D": "貪多務得"}, "answer": "B", "note": ""}, {"id": "chinese-101-2", "year": "101", "subject": "chinese", "subjectName": "國文", "number": 2, "question": "裴佶常話少時姑夫為朝官,有雅望,佶至宅看其姑,會其朝退,深歎曰:「崔昭何\n人,眾口稱美,此必行賄者也。如此安得不亂?」言未竟,閽者報壽州崔使君候謁。\n姑夫怒呵閽者,將鞭之。良久,束帶強出,須臾,命茶甚急,又命酒饌,又命秣馬\n飰僕。姑曰:「前何倨而後何恭也?」及入門,有得色,揖佶曰:「且憩學院中。」\n佶未下堦,出懷中一紙,乃昭贈官絁千匹。(李肇《國史補.崔昭》)文中姑夫的\n性格是:", "options": {"A": "嫉惡如仇", "B": "墨守成規", "C": "貪圖利益", "D": "知錯能改"}, "answer": "C", "note": ""}, {"id": "chinese-101-3", "year": "101", "subject": "chinese", "subjectName": "國文", "number": 3, "question": "躄盜者,一足躄,善穿窬。嘗夜從二盜入巨姓家,登屋上,翻瓦,使二盜以繩下之。\n搜貲入之櫃,命二盜繫上。已,復下其櫃,入貲上之,約如是者三。及其數,躄盜\n自度曰:「櫃上,彼無置我去乎?」遂自入坐櫃中,二盜繫上之,果私語曰:「貲\n重矣,我二人分之則有餘,彼出則必多取,是厲我也,不如置而去也。」遂持櫃行\n大野中。一人曰:「躄盜稱善偷,乃為我二人賣!」一人曰:「此時將見主人翁矣!」\n相與大笑歡喜,不知躄盜乃在櫃中。頃,二盜倦坐道上,躄盜度將曙,又聞遠舍有\n人語笑,櫃出,大聲曰:「盜劫我!」二盜遑訝遁去,躄盜顧乃得全貲歸。(何景\n明〈躄盜〉)以下對「躄盜」的敘述,何者為是?", "options": {"A": "愚昧", "B": "貪婪", "C": "正直", "D": "機智"}, "answer": "D", "note": ""}, {"id": "chinese-101-4", "year": "101", "subject": "chinese", "subjectName": "國文", "number": 4, "question": "下列祝賀題辭的使用,何者最正確?", "options": {"A": "喬遷之喜:賀長官高升", "B": "業紹陶朱:賀醫院開張", "C": "弄璋之喜:賀結婚", "D": "松柏長青:賀長壽\n依下文回答第 5~6 題:\n有一位大學教授在一家大報寫了一篇宏文,接到了一封讚美信。信上說:「給你寫這封\n信是因為你的大作至為深刻。因為你點出了許多人的想法,也正好吻合我一貫想的。謝\n謝你的文章如此清晰入理。可惜,我不在紐約,無法跟你當面討論。但我相信,你我都\n有更多相同的觀點。」在信末,這封信附上了一句話:「希望你繼續努力,給我們更多\n的好文章。」這位教授一看署名,正是他以前教過的學生。(余德慧〈得意忘言〉)"}, "answer": "D", "note": ""}, {"id": "chinese-101-5", "year": "101", "subject": "chinese", "subjectName": "國文", "number": 5, "question": "這位教授最可能有什麼反應?", "options": {"A": "非常生氣,因為學生寫信不得體", "B": "非常高興,因為學生寫信讚美他", "C": "非常高興,因為學生寫信願意和他討論", "D": "非常生氣,因為學生無法當面與他討論"}, "answer": "A", "note": ""}, {"id": "chinese-101-6", "year": "101", "subject": "chinese", "subjectName": "國文", "number": 6, "question": "依據文中情境,信中「正好吻合我一貫想的」,教授應會解讀為:", "options": {"A": "心有靈犀", "B": "挑戰權威", "C": "見識無奇", "D": "獲得知音"}, "answer": "C", "note": ""}, {"id": "chinese-101-7", "year": "101", "subject": "chinese", "subjectName": "國文", "number": 7, "question": "我想天地間第一等人,只有農夫,而士為四民之末。農夫上者種地百畝,其次七八十\n畝,其次五六十畝,皆苦其身,勤其力,耕種收穫,以養天下之人。使天下無農夫,\n舉世皆餓死矣。吾輩讀書人,入則孝,出則弟,守先待後,得志,澤加於民;不得\n志,修身見於世;所以又高於農夫一等。今則不然,一捧書本,便想中舉人,中進\n士,作官如何攫取金錢,造大房屋,置多田產。起手便錯走了路頭,後來越做越壞,\n總沒有個好結果。其不能發達者,鄉里作惡,小頭銳面,更不可當。夫束修自好者,\n豈無其人?經濟自期,抗懷千古者,亦所在多有;而好人為壞人所累,遂令我輩開\n不得口。一開口,人便笑曰:「汝輩書生,總是會說,他日居官,便不如此說了。」\n所以忍氣吞聲,只得捱人笑罵。工人制器利用,賈人搬有運無,皆有便民之處;而\n士獨於民大不便,無怪乎居四民之末也,且求居四民之末而亦不可得也。(鄭燮\n〈寄弟墨書〉)\n作者對於士人的批評主要在於:", "options": {"A": "士人在失意時,總是專注於自我人格的修養,而不能對國家社會有所貢獻", "B": "士人面對外界諸多誤解與嘲諷,只是忍住脾氣,不發一言,任人取笑謾罵", "C": "士人雖然擁有田產,但卻僱用佃農耕田,自己並不參與耕種,自以為尊貴", "D": "士人將讀書視為手段,汲汲營營於世俗價值的追求,失去自我反省的能力"}, "answer": "D", "note": ""}, {"id": "chinese-101-8", "year": "101", "subject": "chinese", "subjectName": "國文", "number": 8, "question": "曾昭旭〈在二十一世紀我們還能跟孔子學什麼〉提到:「生命容易被外物所牽累而\n使自我異化、善意扭曲、理想變質,所以必須常常作自我回歸的修養,讓自我的生\n命心靈依然保有純淨的理想與愛。而這樣的反省回歸,拿捏抉擇,畢竟是只能靠自\n己的真誠面對,旁人是幫不上忙的。」以上之敘述,與下列何者意義最為接近?", "options": {"A": "仁遠乎哉?我欲仁,斯仁至矣!(《論語.述而》)", "B": "道之以德,齊之以禮,有恥且格。(《論語.為政》)", "C": "君子可逝也,不可陷也;可欺也,不可罔也。(《論語.雍也》)", "D": "君子之過也,如日月之食焉。過也,人皆見之;更也,人皆仰之。(《論語.子張》)"}, "answer": "A", "note": ""}, {"id": "chinese-101-9", "year": "101", "subject": "chinese", "subjectName": "國文", "number": 9, "question": "下列詩句,何者不具有「設想未來」的特色?", "options": {"A": "即從巴峽穿巫峽,便下襄陽向洛陽", "B": "人閒桂花落,夜靜春山空。月出驚山鳥,時鳴春澗中", "C": "今宵酒醒何處?楊柳岸,曉風殘月。此去經年,應是良辰好景虛設", "D": "君問歸期未有期,巴山夜雨漲秋池。何當共剪西窗燭,卻話巴山夜雨時"}, "answer": "B", "note": ""}, {"id": "chinese-101-10", "year": "101", "subject": "chinese", "subjectName": "國文", "number": 10, "question": "洛夫寫於 1985 年的〈剔牙〉詩句如下:「中午/全世界的人都在剔牙/以潔白的\n牙籤/安詳地在/剔他們/潔白的牙齒//依索匹亞的一群兀鷹/從一堆屍體中/飛\n起/排排蹲在/疏朗的枯樹上/也在剔牙/以一根根瘦小的/肋骨」。下列選項最\n接近詩的第一節意涵是:", "options": {"A": "衛生", "B": "無聊", "C": "美好", "D": "富足"}, "answer": "D", "note": ""}, {"id": "chinese-101-11", "year": "101", "subject": "chinese", "subjectName": "國文", "number": 11, "question": "下列選項中的詩句皆出現「草」,請問何者的「草」具有思念懷人的情感投射?", "options": {"A": "「人生一世間,忽若暮春草。時不可再得,何為自愁惱?」(魏.徐幹〈室思〉)", "B": "「青青河畔草,綿綿思遠道。遠道不可思,宿昔夢見之。」(東樂府〈飲馬長城\n窟行〉)", "C": "「君不見河邊草,冬時枯死春滿道;君不見城上日,今暝沒盡去,明朝復更出。」\n(南朝.鮑照〈擬行路難〉)", "D": "「谷口疏鐘動,漁樵稍欲稀。悠然遠山暮,獨向白雲歸。菱蔓弱難定,楊花輕易\n飛。東皋春草色,惆悵掩柴扉。」(唐.王維〈歸輞川作〉)"}, "answer": "B", "note": ""}, {"id": "chinese-101-12", "year": "101", "subject": "chinese", "subjectName": "國文", "number": 12, "question": "以下詩句何者並非描寫秋天?", "options": {"A": "碧玉妝成一樹高,萬條垂下綠絲縧", "B": "不堪紅葉青苔地,又是涼風暮雨天", "C": "桂魄初生秋露微,輕羅已薄未更衣", "D": "落葉完成了最後的顫抖/荻花在湖沼的藍睛裏消失/七月的砧聲遠了/暖暖"}, "answer": "A", "note": ""}, {"id": "chinese-101-13", "year": "101", "subject": "chinese", "subjectName": "國文", "number": 13, "question": "秦觀〈鵲橋仙〉:「纖雲巧弄,飛星傳恨,銀漢迢迢暗度。金風玉露一相逢,便勝\n卻人間無數。柔情似水,佳期如夢,忍顧鵲橋歸路。兩情若是久長時,又豈在朝朝\n暮暮。」\n上列詞作歌詠的是那一個民間故事裡的人物?", "options": {"A": "嫦娥與后羿", "B": "牛郎與織女", "C": "孟姜女與范喜良", "D": "梁山伯與祝英台"}, "answer": "B", "note": ""}, {"id": "chinese-101-14", "year": "101", "subject": "chinese", "subjectName": "國文", "number": 14, "question": "「好花開在污泥裏/我酌了一勺水來洗他。半路上我渴極了/竟把這一勺水喝了。\n好花開花污泥裏/一勺水在我的胃裏。請原諒罷,寬恕著罷!/可憐我只有一勺水\n啊?」(俞平伯〈一勺水啊〉)根據本詩,詩中人「我」所表現的態度,下列成語\n何者為是:", "options": {"A": "自顧不暇", "B": "緩不濟急", "C": "物以稀為貴", "D": "出污泥而不染"}, "answer": "A", "note": ""}, {"id": "chinese-101-15", "year": "101", "subject": "chinese", "subjectName": "國文", "number": 15, "question": "子曰:「禮云禮云!玉帛云乎哉?樂云樂云!鐘鼓云乎哉?」(《論語.陽貨》)\n從上述文句推想孔子的意思是:", "options": {"A": "行禮未見玉帛,奏樂未見鐘鼓,則過於草率", "B": "說到禮,就不能離開玉帛;說到樂,就不能離開鐘鼓", "C": "慨嘆玉帛、鐘鼓之陳設徒具虛文,禮樂之本質反被忽略", "D": "玉帛、鐘鼓之外,當有其他器物陳設,禮樂之事乃完備"}, "answer": "C", "note": ""}, {"id": "chinese-101-16", "year": "101", "subject": "chinese", "subjectName": "國文", "number": 16, "question": "下列選項對於「勇」的敘述何者最為正面?", "options": {"A": "子曰:「君子道者三,我無能焉:仁者不憂,知者不惑,勇者不懼。」子貢曰:\n「夫子自道也!」", "B": "子路曰:「君子尚勇乎?」子曰:「君子義以為上。君子有勇而無義為亂,小人\n有勇而無義為盜。」", "C": "子曰:「道不行,乘桴浮於海。從我者,其由與?」子路聞之喜。子曰:「由也,\n好勇過我,無所取材。」", "D": "子曰:「恭而無禮則勞,慎而無禮則葸,勇而無禮則亂,直而無禮則絞。君子篤\n于親,則民興于仁;故舊不遺,則民不偷。」"}, "answer": "A", "note": ""}, {"id": "chinese-101-17", "year": "101", "subject": "chinese", "subjectName": "國文", "number": 17, "question": "孟子曰:「愛人不親,反其仁;治人不治,反其智;禮人不答,反其敬。行有不得\n者,皆反求諸己;其身正,而天下歸之。《詩》云:『永言配命,自求多福。』」\n下列選項何者最接近上文旨意?", "options": {"A": "齊人有言曰:「雖有智慧,不如乘勢;雖有鎡基,不如待時。」", "B": "子貢曰:「學不厭,智也;教不倦,仁也。仁且智,夫子既聖矣!」", "C": "孟子曰:「不仁而得國者,有之矣;不仁而得天下者,未之有也。」", "D": "孟子曰:「仁者愛人,有禮者敬人。愛人者人恆愛之,敬人者人恆敬之。」"}, "answer": "D", "note": ""}, {"id": "chinese-101-18", "year": "101", "subject": "chinese", "subjectName": "國文", "number": 18, "question": "「君若以德綏諸侯,誰敢不服?」(《左傳.僖公四年》)文中「以」字與下列「以」\n字用法何者不同?", "options": {"A": "臣「以」神遇而不「以」目視。(《莊子.養生主》)", "B": "儒「以」文亂法,俠「以」武亂禁。(《韓非子.五蠹》)", "C": "許子「以」釜甑爨,「以」鐵耕乎?(《孟子.滕文公上》)", "D": "志士仁人,無求生「以」害仁,有殺身「以」成仁。(《論語.衛靈公》)\n依下文回答第 19~20 題:\n莊子與惠子遊於濠梁之上。莊子曰:「儵魚出游從容,是魚之樂也。」惠子曰:「子非\n魚,安知魚之樂?」莊子曰:「子非我,安知我不知魚之樂?」惠子曰:「我非子,固\n不知子矣,子固非魚也,子之不知魚之樂,全矣。」莊子曰:「請循其本。子曰:『汝\n安知魚樂』云者,既已知吾知之而問我,我知之濠上也。」(《莊子.秋水》)"}, "answer": "D", "note": ""}, {"id": "chinese-101-19", "year": "101", "subject": "chinese", "subjectName": "國文", "number": 19, "question": "惠子曰:「我非子,固不知子矣,子固非魚也,子之不知魚之樂,全矣。」由此可\n知惠子認為:", "options": {"A": "人不可感情用事", "B": "物我、人己都不相通", "C": "魚無情緒,怎能快樂", "D": "對於他人的情緒變化不必關心"}, "answer": "B", "note": ""}, {"id": "chinese-101-20", "year": "101", "subject": "chinese", "subjectName": "國文", "number": 20, "question": "「我知之濠上也」,由此一語可以知道莊子:", "options": {"A": "無所不知", "B": "與物同感", "C": "即景寓情", "D": "及時行樂"}, "answer": "B", "note": ""}, {"id": "tax-101-1", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 1, "question": "下列有關我國競技、競賽及機會中獎獎金或給與之敘述,何者錯誤?", "options": {"A": "樂透彩每聯(組、注)中獎獎額不超過新臺幣 2,000 元者,免予扣繳", "B": "樂透彩每聯(組、注)中獎獎額超過新臺幣 2,000 元者,就其超過部分扣取 20%之所得稅", "C": "政府舉辦的機會中獎之獎金,採分離課稅", "D": "非政府舉辦之一般中獎所得須併入所得總額中,以結算申報課稅"}, "answer": "B", "note": ""}, {"id": "tax-101-2", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 2, "question": "下列關於我國綜合所得稅列舉扣除中房屋租金支出扣除之敘述,何者錯誤?", "options": {"A": "我國境外租金支出不得扣抵", "B": "每一申報戶每年扣除額以 12 萬元為限", "C": "每戶適用對象為納稅義務人及其配偶與受扶養親屬", "D": "申報有購屋借款利息扣除者,其租金支出即不得扣除"}, "answer": "C", "note": ""}, {"id": "tax-101-3", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 3, "question": "甲公司為其員工投保團體壽險(保費由營利事業負擔且以被保險員工之家屬為受益人),每人每月之保\n險費為新臺幣 1,800 元,下列何項敘述正確?", "options": {"A": "該筆保險費免視為被保險員工之薪資所得", "B": "該筆保險費須視為員工之薪資所得,惟員工可列舉保險費扣除", "C": "該筆保險費為福利性所得,故須視為員工之薪資所得,但不可列舉扣除之", "D": "該筆保險費應視為員工之所得,但應列於其他所得項下"}, "answer": "A", "note": ""}, {"id": "tax-101-4", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 4, "question": "我國所得稅法規定,非居住者於同一課稅年度內,在我國境內居留合計不超過多少天者,其在我國境內\n提供勞務,而自境外雇主取得之勞務報酬免稅?", "options": {"A": "30 天", "B": "60 天", "C": "90 天", "D": "183 天"}, "answer": "C", "note": ""}, {"id": "tax-101-5", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 5, "question": "國外影片事業在中華民國境內無分支機構,經由其代理人出租影片之收入,應以其多少為在中華民國境\n內之營利事業所得額?", "options": {"A": "全部", "B": "二分之一", "C": "三分之一", "D": "四分之一"}, "answer": "B", "note": ""}, {"id": "tax-101-6", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 6, "question": "依我國所得稅法之規定,營利事業之會計年度起訖期間,原則上為每年之:", "options": {"A": "一月一日至十二月三十一日", "B": "七月一日至次年六月三十日", "C": "五月一日至次年四月三十日", "D": "四月一日至次年三月三十一日"}, "answer": "A", "note": ""}, {"id": "tax-101-7", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 7, "question": "下列信託行為中,何種情形須課徵所得稅?", "options": {"A": "因信託行為成立,委託人與受託人間信託財產之移轉", "B": "信託關係存續中受託人變更時,原受託人與新受託人間信託財產之移轉", "C": "因信託行為被解除,委託人由受託人取得之信託財產", "D": "信託關係存續中,受託人管理信託財產所發生之收入"}, "answer": "D", "note": ""}, {"id": "tax-101-8", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 8, "question": "下列敘述何者錯誤?", "options": {"A": "非適用勞動基準法之營利事業定有職工退休辦法者,每年度提列職工退休金準備不得超過當年度已付\n薪資總額百分之四,並以費用列支", "B": "營利事業全年所得額在新臺幣 20 萬元以下免徵營利事業所得稅", "C": "營利事業之資本利息應列為盈餘分派", "D": "營利事業所擁有之債權逾期二年經催收未有本金或利息之收取,且具催收證明者,得列為呆帳損失"}, "answer": "B", "note": ""}, {"id": "tax-101-9", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 9, "question": "試問自民國 102 年度起,依 101 年 8 月 8 日修正通過之「所得基本稅額條例」第 7 條第 1 項規定計算之\n基本所得額,在新臺幣多少元以下之營利事業可不適用本條例?", "options": {"A": "50 萬元", "B": "100 萬元", "C": "150 萬元", "D": "200 萬元"}, "answer": "A", "note": ""}, {"id": "tax-101-10", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 10, "question": "依所得基本稅額條例之規定,個人所得基本稅額之稅率為何?", "options": {"A": "百分之五", "B": "百分之十五", "C": "百分之二十", "D": "百分之二十五"}, "answer": "C", "note": ""}, {"id": "tax-101-11", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 11, "question": "下列關於我國兩稅合一下股東獲配股利之敘述,何者錯誤?", "options": {"A": "個人居住者股東應將股利總額列報為營利所得", "B": "總機構在我國境內的公司股東,其所獲配之股利淨額,不計入所得額課稅", "C": "個人非居住者股東,其獲配之股利含有依所得稅法第 66 條之 9 規定加徵 10%營利事業所得稅之稅額時,\n不得抵繳該股利淨額之應扣繳稅款", "D": "總機構在我國境內的公司股東,其獲配股利所含之可扣抵稅額不得扣抵其營利事業所得稅結算申報應\n納稅額"}, "answer": "BC", "note": "答B或C或BC者均給分"}, {"id": "tax-101-12", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 12, "question": "乙公司於民國 100 年度的全年課稅所得額為$150,000,試問其 100 年度應納之營利事業所得稅稅額為:", "options": {"A": "免徵營利事業所得稅", "B": "$15,000", "C": "$25,500", "D": "$27,500"}, "answer": "B", "note": ""}, {"id": "tax-101-13", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 13, "question": "購買公益彩券所中頭獎之獎金:", "options": {"A": "不用課稅", "B": "併入年度綜合所得課稅", "C": "分離課稅,稅率為百分之十", "D": "分離課稅,稅率為百分之二十"}, "answer": "D", "note": ""}, {"id": "tax-101-14", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 14, "question": "我國「營利事業所得稅查核準則」第 96 條規定,無形資產應以出價取得者為限,其中商譽最低的攤折年\n數為:", "options": {"A": "3 年", "B": "5 年", "C": "10 年", "D": "15 年"}, "answer": "B", "note": ""}, {"id": "tax-101-15", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 15, "question": "依我國所得稅法第 61 條規定,固定資產、遞耗資產及無形資產遇有物價上漲達多少時,得實施資產重估價?", "options": {"A": "10%", "B": "20%", "C": "25%", "D": "30%"}, "answer": "C", "note": ""}, {"id": "tax-101-16", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 16, "question": "企業會計年度採四月制者,其每年應於何時申報暫繳營利事業所得稅?", "options": {"A": "一月份", "B": "五月份", "C": "九月份", "D": "十二月份"}, "answer": "D", "note": ""}, {"id": "tax-101-17", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 17, "question": "公司之應付股利,自股東會決議分配盈餘之日起,幾個月內尚未給付者,視同給付?", "options": {"A": "三個月", "B": "六個月", "C": "九個月", "D": "十二個月"}, "answer": "B", "note": ""}, {"id": "tax-101-18", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 18, "question": "依我國所得稅法之規定,下列何者不是營利事業之商品、原物料等存貨實際成本可採用的估價方法?", "options": {"A": "個別辨認法", "B": "先進先出法", "C": "移動平均法", "D": "後進先出法"}, "answer": "D", "note": ""}, {"id": "tax-101-19", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 19, "question": "依所得基本稅額條例之規定,下列何者須計入個人基本所得額?", "options": {"A": "私募證券投資信託基金之受益憑證之交易所得", "B": "未計入綜合所得總額之非中華民國來源所得,每一申報戶全年所得合計未超過新臺幣一百萬元之部分", "C": "未計入綜合所得總額之依香港澳門關係條例第 28 條第 1 項規定免納所得稅之所得,每一申報戶全年所\n得合計未超過新臺幣一百萬元之部分", "D": "於本條例施行後所訂立受益人與要保人非屬同一人之人壽保險,於死亡給付每一申報戶全年合計數在\n新臺幣三千萬元以下之部分"}, "answer": "A", "note": ""}, {"id": "tax-101-20", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 20, "question": "下列何項銷售行為,其進項稅額可以扣抵銷項稅額?", "options": {"A": "有娛樂節目之餐飲店", "B": "飼料之銷售", "C": "非加值型營業人銷售其長期持有的固定資產", "D": "貨物外銷"}, "answer": "D", "note": ""}, {"id": "tax-101-21", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 21, "question": "下列何者不須課徵營業稅?", "options": {"A": "非加值型營業人將其使用多年的固定資產出售", "B": "營業人將供銷售之貨品轉供自用", "C": "營業人委託他人代銷貨物", "D": "營業人銷售代銷貨物"}, "answer": "A", "note": ""}, {"id": "tax-101-22", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 22, "question": "營業稅法第 40 條規定,查定計算稅額之典當業及特種飲食業,其由主管稽徵機關查定其銷售額並每幾個\n月填發繳款書?", "options": {"A": "兩者皆為每三個月填發繳款書一次", "B": "兩者皆為每個月填發繳款書一次", "C": "典當業為每三個月一次;特種飲食業為每個月一次", "D": "典當業為每個月一次;特種飲食業為每三個月一次"}, "answer": "C", "note": ""}, {"id": "tax-101-23", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 23, "question": "下列各項貨物之進口,何者應課徵營業稅?", "options": {"A": "國際運輸用之飛機", "B": "肥料", "C": "我國之古物", "D": "黃豆及玉米"}, "answer": "D", "note": ""}, {"id": "tax-101-24", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 24, "question": "設中古車商甲公司為加值型營業人,其向小王購進中古小轎車一台,購入成本為$300,000,試問當甲公司\n於嗣後出售此輛車時(出售價為$600,000),可申報多少進項稅額用以扣抵其銷項稅額?", "options": {"A": "不可申報進項稅額", "B": "$3,000", "C": "$14,286", "D": "$15,000"}, "answer": "C", "note": ""}, {"id": "tax-101-25", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 25, "question": "營業人發售現金禮券時,應於何時開立統一發票?", "options": {"A": "出售禮券時", "B": "禮券持有人以禮券兌付貨物時", "C": "禮券持有人將之轉讓他人時", "D": "無須開立發票"}, "answer": "B", "note": ""}, {"id": "tax-101-26", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 26, "question": "依我國加值型及非加值型營業稅法之規定,下列何者之進項稅額得以扣抵銷項稅額?", "options": {"A": "營業人用於交際應酬之貨物", "B": "營業人購入非供本業及附屬業務使用之貨物", "C": "購入自用之乘人小客車", "D": "營業人購入貨物捐贈政府者"}, "answer": "D", "note": ""}, {"id": "tax-101-27", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 27, "question": "依我國加值型及非加值型營業稅法之規定,下列何者不包括在課稅範圍內?", "options": {"A": "銷售貨物", "B": "律師提供之訴訟上服務", "C": "營業人以自己名義代為購買貨物交付與委託人者", "D": "進口貨物"}, "answer": "B", "note": ""}, {"id": "tax-101-28", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 28, "question": "依我國加值型及非加值型營業稅法之規定,下列敘述何者正確?", "options": {"A": "非以營利為目的之事業而有銷售貨物者仍須課徵營業稅", "B": "夜總會之營業稅稅率為百分之二十五", "C": "金融業之營業稅計算方式非依其銷售額計算", "D": "目前銀行業本業之營業稅率為百分之五"}, "answer": "A", "note": ""}, {"id": "tax-101-29", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 29, "question": "依我國加值型及非加值型營業稅法之規定,下列何者不適用零稅率?", "options": {"A": "外銷貨物", "B": "外國保險業自中華民國保險業承保之再保險", "C": "銷售與國際運輸用航空器之修繕勞務", "D": "銷售與保稅區營業人供營運之貨物"}, "answer": "B", "note": ""}, {"id": "tax-101-30", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 30, "question": "陳先生於民國 101 年 7 月份死亡,其遺產中有一筆公告現值 300 萬元、市價 600 萬元的土地,此筆土地\n乃陳先生於民國 93 年 8 月份繼承而得,且當年已繳納遺產稅。試問此筆土地應計入陳先生遺產總額的數\n額為何?", "options": {"A": "無須計入", "B": "120 萬元", "C": "180 萬元", "D": "240 萬元"}, "answer": "C", "note": ""}, {"id": "tax-101-31", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 31, "question": "我國遺產稅或贈與稅應納稅額在多少以上,納稅義務人確有困難,不能一次繳納現金時,得於納稅期限\n內,申請分期繳納?", "options": {"A": "18 萬元", "B": "30 萬元", "C": "36 萬元", "D": "50 萬元"}, "answer": "B", "note": ""}, {"id": "tax-101-32", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 32, "question": "依我國遺產及贈與稅法之規定,李先生之下列何項行為須課徵贈與稅?", "options": {"A": "於四年前借 400 萬元予張先生,雙方現已言明此筆金錢無須償還", "B": "今年支付其赴美唸書的小兒子 150 萬元供其學業及生活所需", "C": "將其一部分仍作農業使用的農地移轉登記予其大兒子繼續耕作", "D": "將其名下一棟房子的所有權移轉登記予其配偶"}, "answer": "A", "note": ""}, {"id": "tax-101-33", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 33, "question": "依我國遺產及贈與稅法之規定,遺產及贈與財產價值之計算,下列何者錯誤?", "options": {"A": "土地以公告現值或評定標準價格計算", "B": "車輛、船舶、航空器應以原始成本減除合理折舊之餘額為準", "C": "上市、上櫃或興櫃股票依繼承開始日或贈與日之收盤價估定之", "D": "未上市(櫃)且非興櫃之股票,應以繼承開始日或贈與日該公司之資產淨值估定"}, "answer": "C", "note": ""}, {"id": "tax-101-34", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 34, "question": "依我國現行遺產及贈與稅法之規定,下列何者錯誤?", "options": {"A": "遺贈人捐贈其死亡時已依法登記設立之教育慈善機關之財產無須計入遺產總額中", "B": "繼承人已向主管稽徵機關聲明登記之文化圖書無須計入遺產總額中", "C": "被繼承人自己創作之藝術品無須計入遺產總額中", "D": "被繼承人職業上總價值在一百萬元以下之工具無須計入遺產總額中"}, "answer": "D", "note": ""}, {"id": "tax-101-35", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 35, "question": "依我國現行遺產及贈與稅法之規定,下列敘述何者正確?", "options": {"A": "納稅義務人就稽徵機關所核定之應納贈與稅額不服時,可對之提起抗告", "B": "對被繼承人所支付之喪葬費用最高得從遺產總額中扣除新臺幣七十萬元", "C": "遺產之財產價值應按時價計算之", "D": "納稅義務人應於被繼承人死亡之日起十二個月內申報遺產稅"}, "answer": "C", "note": ""}, {"id": "tax-101-36", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 36, "question": "被繼承人死亡前二年內贈與下列何人之財產,無須併入其遺產總額中:", "options": {"A": "被繼承人兄弟之配偶", "B": "被繼承人之同居人", "C": "被繼承人之配偶", "D": "被繼承人之父母"}, "answer": "B", "note": ""}, {"id": "tax-101-37", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 37, "question": "楊先生為我國國民,其於民國 100 年 12 月 1 日過世,試問下列何項須計入其遺產總額?", "options": {"A": "生前自己發明的專利權,估計約有 100 萬元之價值", "B": "於民國 96 年 12 月自其父親繼承而來之土地(公告現值為 800 萬元),該繼承土地當時已繳納過遺產稅", "C": "其人壽保險給付 500 萬元,受益人為其配偶", "D": "於民國 99 年 10 月贈與其妹妹 100 萬元之結婚賀禮"}, "answer": "D", "note": ""}, {"id": "tax-101-38", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 38, "question": "依我國遺產及贈與稅法之規定,下列何者無須課徵贈與稅?", "options": {"A": "甲將自己所有時價 300 萬元之汽車無償送給乙", "B": "丙免除了丁積欠 20 年請求權時效消滅之 300 萬元借款", "C": "戊將時價 3,000 萬元之房屋以 20 萬元出賣予外甥己", "D": "庚向他人買下價金 800 萬元之房屋,且要求出賣人將房屋產權直接移轉登記於自己兒子辛之名下"}, "answer": "B", "note": ""}, {"id": "tax-101-39", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 39, "question": "下列關於我國遺產及贈與稅法第 17 條之敘述,何者正確?", "options": {"A": "非中華民國國民死亡時仍須就其在我國境內遺產計算課徵我國遺產稅,且其亦準用各項遺產免稅額及\n扣除額之規定", "B": "各繼承人若拋棄其繼承權,則不可減除其自身之繼承扣除額", "C": "非中華民國國民死亡前在國外發生的未償之債務,確實有證明者,即可於遺產中扣除", "D": "非中華民國國民為管理海外遺產所發生之海外遺囑執行及管理必要費用,確實有證明者,即可於遺產\n中扣除"}, "answer": "B", "note": ""}, {"id": "tax-101-40", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 40, "question": "納稅義務人因稅捐稽徵機關適用法令錯誤、計算錯誤或其他可歸責於政府機關之錯誤,致溢繳稅款者,\n依稅捐稽徵法之規定應如何處理?", "options": {"A": "稅捐稽徵機關應自知有錯誤原因之日起五年內查明退還,其退還之稅款不以五年內溢繳者為限", "B": "稅捐稽徵機關應自知有錯誤原因之日起二年內查明退還,其退還之稅款不以五年內溢繳者為限", "C": "稅捐稽徵機關應自知有錯誤原因之日起五年內查明退還,其退還之稅款以五年內溢繳者為限", "D": "稅捐稽徵機關應自知有錯誤原因之日起二年內查明退還,其退還之稅款以五年內溢繳者為限"}, "answer": "B", "note": ""}, {"id": "tax-101-41", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 41, "question": "關於稅捐稽徵法第 11 條之 1 所稱之相當擔保品,下列敘述何者錯誤?", "options": {"A": "政府發行的可十足提供公務擔保的公債,按其面額計算", "B": "銀行存款單摺,按存款本金額度計算", "C": "純黃金可按當時金價市值十足計算", "D": "經中央銀行掛牌之外幣,按八折計算"}, "answer": "C", "note": ""}, {"id": "tax-101-42", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 42, "question": "稅捐稽徵法第 12 條之 1 規定,稅捐稽徵機關認定課徵租稅之構成要件事實時,應以實質經濟事實關係及\n其所生實質經濟利益之歸屬與享有為依據。而此一課徵租稅構成要件事實之認定,稅捐稽徵機關及納稅\n義務人各扮演何種角色?", "options": {"A": "稅捐稽徵機關及納稅義務人皆須就其事實負有舉證之責任", "B": "稅捐稽徵機關就其事實有舉證之責任;納稅義務人負有協力義務", "C": "納稅義務人就其事實有舉證之責任;稅捐稽徵機關負有協力義務", "D": "稅捐稽徵機關及納稅義務人皆無須就其事實負有舉證之責任"}, "answer": "B", "note": ""}, {"id": "tax-101-43", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 43, "question": "我國稅捐稽徵法規定,在我國境內居住的個人或境內的營利事業,其已確定之應納稅捐逾法定繳納期限\n尚未繳納完畢,所欠繳稅款及已確定之罰鍰單計或合計,個人及營利事業各在新臺幣多少以上者,該欠\n稅個人或營利事業負責人會被限制出境?", "options": {"A": "個人在 50 萬元以上,營利事業在 100 萬元以上", "B": "個人在 100 萬元以上,營利事業在 150 萬元以上", "C": "個人在 100 萬元以上,營利事業在 200 萬元以上", "D": "個人在 150 萬元以上,營利事業在 300 萬元以上"}, "answer": "C", "note": ""}, {"id": "tax-101-44", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 44, "question": "對於共有財產之課稅,下列敘述何者錯誤?", "options": {"A": "其為分別共有時,應由管理人負擔納稅之義務", "B": "其為分別共有,若無管理人時,應由共有人各按其應有部分負擔納稅之義務", "C": "其為公同共有且未設管理人時,應由全體共有人為納稅義務人", "D": "由實際占有使用之人為納稅義務人"}, "answer": "D", "note": ""}, {"id": "tax-101-45", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 45, "question": "下列何項稅捐之徵收,不符合稅捐稽徵法第 6 條優先於一切債權及抵押權之規定?", "options": {"A": "土地增值稅", "B": "地價稅", "C": "所得稅", "D": "房屋稅"}, "answer": "C", "note": ""}, {"id": "tax-101-46", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 46, "question": "稅捐之徵收,依稅捐稽徵法之規定,於徵收期間屆滿前已移送執行者,自徵收期間屆滿之翌日起,幾年\n內未經執行,不再執行?", "options": {"A": "三年", "B": "五年", "C": "七年", "D": "十年"}, "answer": "B", "note": ""}, {"id": "tax-101-47", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 47, "question": "稅捐稽徵人員因調查納稅義務人之財產、所得、營業及納稅等而取得之資料,依稅捐稽徵法之規定,對\n下列何者應絕對保守秘密?", "options": {"A": "監察機關", "B": "債權人已取得民事確定判決或其他執行名義者", "C": "納稅義務人所授權之代理人或辯護人", "D": "民意代表"}, "answer": "D", "note": ""}, {"id": "tax-101-48", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 48, "question": "設某年所得稅繳款截止日 5 月 31 日為星期六,甲公司遲至 6 月 4 日星期三才繳納其營利事業所得稅款,\n試問甲公司應被加徵多少滯納金?", "options": {"A": "無須被處罰滯納金", "B": "須加徵 1%滯納金", "C": "須加徵 2%滯納金", "D": "須加徵 3%滯納金"}, "answer": "A", "note": ""}, {"id": "tax-101-49", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 49, "question": "營利事業對各級政府之捐贈,在何種範圍內得列為當年度之費用或損失?", "options": {"A": "以不超過收入額百分之十為限", "B": "不受金額之限制", "C": "以不超過收入額百分之二十為限", "D": "以不超過收入額百分之五為限"}, "answer": "B", "note": ""}, {"id": "tax-101-50", "year": "101", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 50, "question": "納稅義務人對於稅捐稽徵機關所核定之處分如有不服時,應如何提起行政救濟?", "options": {"A": "應於繳款書送達後,於繳納期間屆滿之翌日起三十日內,向稅捐稽徵機關申請復查", "B": "應於繳款書送達後,於繳納期間屆滿之當日起三十日內,向高等法院提出行政訴訟", "C": "應於繳款書送達後,於繳納期間屆滿之當日起三十日內,向行政院提出訴願", "D": "應於繳款書送達後,於繳納期間屆滿之翌日起三十日內,向財政部提出訴願"}, "answer": "A", "note": ""}, {"id": "accounting-102-1", "year": "102", "subject": "accounting", "subjectName": "會計學概要", "number": 1, "question": "日完成,王某商店於 X13 年 2 月 15 日開張營業,生意興隆。\n試作:日新公司 X12 年和 X13 年有關特許權收入的分錄。(20 分)\n四、丙公司於 X13 年 7 月 1 日發行每股面值$100,7%非累積特別股計 5,000 股,總發\n行價格$525,000,發行時每股特別股均搭配可按每股$15 的價格購買該公司面值$10\n的普通股一股的認股權。發行後特別股市價每股$103,認股權市價每單位$4。在\nX13 年 10 月 31 日時普通股的每股市價是$22,認股權每單位市價是$7,有 4,000\n單位的認股權申請認購股票。\n試作:\n發行特別股及認股權的分錄。(3 分)\n行使認股權的分錄。(2 分)\n乙、測驗題部分:(50 分) 代號:3602 \n本測驗試題為單一選擇題,請選出一個正確或最適當的答案,複選作答者,該題不予計分。\n共25題,每題2分,須用2B鉛筆在試卡上依題號清楚劃記,於本試題或申論試卷上作答者,不予計分。\n1 試問下列那種方法,可有效縮短營業週期(operating cycle)?1提高存貨週轉率 2提高存貨週轉天數 \n3提高應收帳款週轉率 4降低應收帳款週轉天數", "options": {"A": "124", "B": "123", "C": "234", "D": "134"}, "answer": "D", "note": ""}, {"id": "accounting-102-2", "year": "102", "subject": "accounting", "subjectName": "會計學概要", "number": 2, "question": "順心公司於 X1 年初購入設備,成本$400,000,估計耐用年限 4 年,無殘值,採直線法提列折舊。X3 年\n初順心公司支付$125,000 加以整修,預估可使設備延長 3 年之使用年限;則 X3 年底順心公司該設備之帳\n面金額為:", "options": {"A": "$244,000", "B": "$260,000", "C": "$325,000", "D": "$420,000"}, "answer": "B", "note": ""}, {"id": "accounting-102-3", "year": "102", "subject": "accounting", "subjectName": "會計學概要", "number": 3, "question": "A 公司帳載現金餘額為$85,000,已知公司開立支付電話費之支票,面額為$7,200,帳上卻誤記為$2,700;又\n銀行代收票據已兌現$30,000,扣繳水電費$8,000,公司皆尚未入帳,試問公司正確的現金餘額應為:", "options": {"A": "$80,500", "B": "$102,500", "C": "$107,000", "D": "$115,000"}, "answer": "B", "note": ""}, {"id": "accounting-102-4", "year": "102", "subject": "accounting", "subjectName": "會計學概要", "number": 4, "question": "臺北公司 X5 年期初存貨$150,000,X5 年度進貨$450,000,進貨退出$10,000,進貨折讓$4,000,進貨運費\n$26,000,銷貨$500,000,銷貨退回$10,000,銷貨折讓$5,000,試問臺北公司 X5 年可供銷貨商品成本為多\n少?", "options": {"A": "$490,000", "B": "$585,000", "C": "$612,000", "D": "$617,000"}, "answer": "C", "note": ""}, {"id": "accounting-102-5", "year": "102", "subject": "accounting", "subjectName": "會計學概要", "number": 5, "question": "麗安公司本月份開始營運,並完成 2,000 件產品,期末在製品 100 件(完工程度:原料 100%,加工成本\n50%)。若本月份耗用原料$4,200,加工成本$6,150,則期末在製品成本為多少?", "options": {"A": "$350", "B": "$420", "C": "$500", "D": "$615"}, "answer": "A", "note": ""}, {"id": "accounting-102-6", "year": "102", "subject": "accounting", "subjectName": "會計學概要", "number": 6, "question": "安西公司以成本$1,000,000,帳面價值$800,000,公平市價$300,000 的汽車,換入公平市價$260,000 的機\n器,並收到現金$40,000,此一交換具商業實質意涵,試問安西公司換入機器之成本應記錄多少?", "options": {"A": "$300,000", "B": "$260,000", "C": "$760,000", "D": "$160,000"}, "answer": "B", "note": ""}, {"id": "accounting-102-7", "year": "102", "subject": "accounting", "subjectName": "會計學概要", "number": 7, "question": "揚麗公司有 7%、累積、部分參加至 10%之特別股 10,000 股及普通股 15,000 股,每股面額均為$10。第 1\n至第 4 年各年度分配股利為$0、$8,000、$9,000、$29,000,試問普通股股東第 4 年可收到之股利總額為多\n少?", "options": {"A": "$10,000", "B": "$14,000", "C": "$15,000", "D": "$11,000"}, "answer": "C", "note": ""}, {"id": "accounting-102-8", "year": "102", "subject": "accounting", "subjectName": "會計學概要", "number": 8, "question": "三洋公司 X1 年底有負債$100,000、資產$750,000。年初有負債$30,000,X1 年中股東投入$100,000;X1 年\n度總收入為$360,000,總費用為$320,000,試問 X1 年初資產總額為多少?", "options": {"A": "$140,000", "B": "$510,000", "C": "$540,000", "D": "$650,000"}, "answer": "C", "note": ""}, {"id": "accounting-102-9", "year": "102", "subject": "accounting", "subjectName": "會計學概要", "number": 9, "question": "已提列償債基金之長期負債,即將於一年內到期償還者,應列為:", "options": {"A": "流動負債", "B": "或有負債", "C": "償債基金之減項", "D": "長期負債"}, "answer": "AD", "note": "答A或D者均給分"}, {"id": "accounting-102-10", "year": "102", "subject": "accounting", "subjectName": "會計學概要", "number": 10, "question": "預收收入轉列已實現收入之交易,係屬下列何種帳戶變動之狀況?", "options": {"A": "資產增加,負債增加", "B": "負債減少,權益增加", "C": "資產增加,收益增加", "D": "資產減少,負債減少"}, "answer": "B", "note": ""}, {"id": "accounting-102-11", "year": "102", "subject": "accounting", "subjectName": "會計學概要", "number": 11, "question": "當公司採用定期盤存制度時,如期末存貨低估,則會對銷貨毛利有何影響?", "options": {"A": "高估", "B": "低估", "C": "不影響", "D": "影響方向不一定"}, "answer": "B", "note": ""}, {"id": "accounting-102-12", "year": "102", "subject": "accounting", "subjectName": "會計學概要", "number": 12, "question": "台安公司會計人員將以$800 購入的電風扇作為辦公費用,此乃基於:", "options": {"A": "重大性", "B": "穩健性", "C": "成本原則", "D": "行業特性"}, "answer": "A", "note": ""}, {"id": "accounting-102-13", "year": "102", "subject": "accounting", "subjectName": "會計學概要", "number": 13, "question": "下列那一個程序在企業會計循環中屬選擇性(非必要)的步驟?", "options": {"A": "作調整分錄", "B": "交易記入日記簿", "C": "編製財務報表", "D": "作廻轉分錄"}, "answer": "D", "note": ""}, {"id": "accounting-102-14", "year": "102", "subject": "accounting", "subjectName": "會計學概要", "number": 14, "question": "在永續盤存制度下,企業記錄賖帳購入商品之退回將貸記:", "options": {"A": "應收帳款", "B": "存貨", "C": "銷貨", "D": "進貨退出及折讓"}, "answer": "B", "note": ""}, {"id": "accounting-102-15", "year": "102", "subject": "accounting", "subjectName": "會計學概要", "number": 15, "question": "花東公司以發票價$300,000 購入商品,付款條件為 2/10,n/30。假定該公司於交易日後 5 天付清貨款,則\n對於此項交易,公司應支付貨款金額為何?", "options": {"A": "$294,000", "B": "$297,000", "C": "$300,000", "D": "$306,000"}, "answer": "A", "note": ""}, {"id": "accounting-102-16", "year": "102", "subject": "accounting", "subjectName": "會計學概要", "number": 16, "question": "結帳後佣金收入帳戶餘額應為:", "options": {"A": "借餘", "B": "貸餘", "C": "可能借餘也可能貸餘", "D": "無餘額"}, "answer": "D", "note": ""}, {"id": "accounting-102-17", "year": "102", "subject": "accounting", "subjectName": "會計學概要", "number": 17, "question": "儒林公司有關資料如下:銷貨收入$100,000;期初存貨$20,000,期末存貨$10,000;毛利率 30%。試問本\n期購貨金額應為多少?", "options": {"A": "$60,000", "B": "$80,000", "C": "$50,000", "D": "$70,000"}, "answer": "A", "note": ""}, {"id": "accounting-102-18", "year": "102", "subject": "accounting", "subjectName": "會計學概要", "number": 18, "question": "賒銷商品定價$10,000,商業折扣 10%,現金折扣 5%,若會計處理採總額法,而該筆款項於折扣期限內收\n到,試問下述會計處理何者正確?", "options": {"A": "貸記應收帳款$8,500", "B": "貸記現金$8,550", "C": "貸記銷貨折扣$450", "D": "借記現金$8,550"}, "answer": "D", "note": ""}, {"id": "accounting-102-19", "year": "102", "subject": "accounting", "subjectName": "會計學概要", "number": 19, "question": "羅德公司為籌措短期資金,於 X2 年 7 月 1 日發行 6 個月期之商業本票,面額為$10,100,000,市場年貼現\n率為 2%,試問羅德公司發行該商業本票所得資金為多少?", "options": {"A": "$9,000,000", "B": "$9,900,000", "C": "$10,000,000", "D": "$10,200,000"}, "answer": "C", "note": ""}, {"id": "accounting-102-20", "year": "102", "subject": "accounting", "subjectName": "會計學概要", "number": 20, "question": "買賣業會計,下列運費,何者係由買方負擔?\n起運點交貨之運費 目的地交貨之運費", "options": {"A": "是 否", "B": "否 是", "C": "否 否", "D": "是 是"}, "answer": "A", "note": ""}, {"id": "accounting-102-21", "year": "102", "subject": "accounting", "subjectName": "會計學概要", "number": 21, "question": "明太公司於 X3 年 7 月 1 日購入機器一台,成本$620,000,估計耐用年限為 5 年,殘值$20,000。若該公司\n折舊採年數合計法(sum-of-the-years'-digits method),則公司 X4 年度應提列多少折舊額?", "options": {"A": "$160,000", "B": "$180,000", "C": "$200,000", "D": "$280,000"}, "answer": "B", "note": ""}, {"id": "accounting-102-22", "year": "102", "subject": "accounting", "subjectName": "會計學概要", "number": 22, "question": "王君於 X2 年 3 月 1 日購買新台公司發行之普通公司債(面額為$1,000,000,年利率 2%)。已知該公司每\n年的 1 月 1 日與 7 月 1 日會定期支付債權人半年的利息。試問於 X2 年 7 月 1 日王君可領取之利息金額為\n何?", "options": {"A": "$6,667", "B": "$10,000", "C": "$20,000", "D": "$21,000"}, "answer": "B", "note": ""}, {"id": "accounting-102-23", "year": "102", "subject": "accounting", "subjectName": "會計學概要", "number": 23, "question": "臺北公司於 X9 年 4 月 1 日以 98 折之價格發行 400 張面額$1,000,年利率 8%之公司債,票載發行日為\nX9 年 1 月 1 日,到期日為 X19 年 1 月 1 日,每年 1 月 1 日及 7 月 1 日付息,發行公司債成本為$15,000,\n則臺北公司發行公司債共得現金多少?", "options": {"A": "$385,000", "B": "$377,000", "C": "$393,000", "D": "$409,000"}, "answer": "A", "note": ""}, {"id": "accounting-102-24", "year": "102", "subject": "accounting", "subjectName": "會計學概要", "number": 24, "question": "萬國公司於 X5 年 1 月 1 日發行面額$1,000,000,5 年期,票面利率 10%,市場利率 12%之公司債,每年\n12 月 31 日付息,發行價格$940,000,試問該公司 X5 年 12 月 31 日公司債按有效利息法計算折價攤銷數\n為多少?", "options": {"A": "$100,000", "B": "$120,000", "C": "$12,000", "D": "$12,800"}, "answer": "D", "note": ""}, {"id": "accounting-102-25", "year": "102", "subject": "accounting", "subjectName": "會計學概要", "number": 25, "question": "甲、乙兩合夥人在合夥契約中約定,甲每年可領薪資$100,000,甲、乙損益分配比例為 3:2。如當年淨\n利為$300,000,則損益分配分錄應貸記甲合夥人資本帳戶多少?", "options": {"A": "$280,000", "B": "$120,000", "C": "$220,000", "D": "$80,000"}, "answer": "C", "note": ""}, {"id": "bookkeeping-102-1", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 1, "question": "依記帳士法規定,下列何者屬於記帳士之執行業務範圍?1受委任辦理各項稅捐稽徵案件之行政訴訟 2受\n委任辦理各項稅捐之簽證申報 3受理稅務諮詢事項 4受委任辦理營業登記事項 5受委任辦理商業會\n計事務", "options": {"A": "345", "B": "125", "C": "245", "D": "135"}, "answer": "A", "note": ""}, {"id": "bookkeeping-102-2", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 2, "question": "依記帳士法規定,經記帳士考試及格者,應向何單位請領記帳士證書?", "options": {"A": "記帳士公會全國聯合會", "B": "考選部", "C": "財政部", "D": "執行業務區域所屬之國稅局"}, "answer": "C", "note": ""}, {"id": "bookkeeping-102-3", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 3, "question": "依記帳士法規定,未依法取得記帳士資格,擅自執行記帳士業務,其處罰規定為下列何者?", "options": {"A": "處新臺幣五十萬元以下罰鍰", "B": "處新臺幣十萬元以上二十萬元以下罰鍰", "C": "處新臺幣二十萬元以上三十萬元以下罰鍰", "D": "處新臺幣三萬元以上十五萬元以下罰鍰"}, "answer": "D", "note": ""}, {"id": "bookkeeping-102-4", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 4, "question": "依記帳士法規定,下列何者為記帳士與委任人訂立之委任書內容應載明之事項?1委任人之地址 2委任權\n限 3受委任人之證書字號 4酬金數額 5委任日期", "options": {"A": "1234", "B": "1235", "C": "1245", "D": "2345"}, "answer": "B", "note": ""}, {"id": "bookkeeping-102-5", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 5, "question": "記帳士執行業務,依記帳士法規定應設置簿冊,其簿冊應保存幾年?", "options": {"A": "3 年", "B": "5 年", "C": "7 年", "D": "10 年"}, "answer": "B", "note": ""}, {"id": "bookkeeping-102-6", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 6, "question": "下列何者為記帳士法所規定之懲戒處分?1警告 2申誡 3記過 4停止執行業務 5除名", "options": {"A": "1245", "B": "1234", "C": "1345", "D": "2345"}, "answer": "A", "note": ""}, {"id": "bookkeeping-102-7", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 7, "question": "依記帳士法第 23 條規定,各級記帳士公會理事任期為四年,其連選連任者不得超過若干比例?", "options": {"A": "四分之一", "B": "三分之一", "C": "二分之一", "D": "三分之二"}, "answer": "C", "note": ""}, {"id": "bookkeeping-102-8", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 8, "question": "依記帳士法規定,記帳士公會全國聯合會應如何組織?", "options": {"A": "由開業記帳士三十人以上發起組織之", "B": "由直轄市及過半數之縣市記帳士公會完成組織後發起組織之", "C": "由財政部發起組織之", "D": "由經濟部發起組織之"}, "answer": "B", "note": ""}, {"id": "bookkeeping-102-9", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 9, "question": "依記帳士法規定,記帳士對於委辦事項應予保密之對象為下列何者?", "options": {"A": "委託人授權之代理人", "B": "委託人之債權人", "C": "稅捐稽徵機關", "D": "司法調查機關"}, "answer": "B", "note": ""}, {"id": "bookkeeping-102-10", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 10, "question": "記帳及報稅代理業務人懲戒委員會通過懲戒案件之決議應符合下列何規定?", "options": {"A": "應有委員三分之二以上出席,出席委員過半數之同意", "B": "應有委員三分之二以上出席,出席委員三分之二以上之同意", "C": "應有委員二分之一以上出席,出席委員過半數之同意", "D": "應有委員二分之一以上出席,出席委員三分之二以上之同意"}, "answer": "A", "note": ""}, {"id": "bookkeeping-102-11", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 11, "question": "商業會計法所稱之商業為下列何者?", "options": {"A": "公司、獨資或合夥組織之營利事業", "B": "公司法規定之營利事業", "C": "公司組織之營利事業", "D": "依商業登記法、公司法及其他法律規定之營利事業"}, "answer": "D", "note": ""}, {"id": "bookkeeping-102-12", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 12, "question": "股份有限公司主辦會計人員之任免,應由董事會以董事過半數之出席,及出席董事超過若干比例之同意為之?", "options": {"A": "四分之一", "B": "三分之一", "C": "二分之一", "D": "三分之二"}, "answer": "C", "note": ""}, {"id": "bookkeeping-102-13", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 13, "question": "依現行商業會計法規定,進貨簿屬於下列何種帳簿?", "options": {"A": "特種序時帳簿", "B": "普通序時帳簿", "C": "總分類帳簿", "D": "明細分類帳簿"}, "answer": "A", "note": ""}, {"id": "bookkeeping-102-14", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 14, "question": "依商業會計法規定,商業之決算,應於會計年度終了後多少期間內辦理完竣?", "options": {"A": "二個月內", "B": "三個月內", "C": "四個月內", "D": "五個月內"}, "answer": "A", "note": ""}, {"id": "bookkeeping-102-15", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 15, "question": "依商業會計法規定,商業得免設普通序時帳簿之條件為下列何者?", "options": {"A": "會計制度健全且使用總分類帳科目日計表", "B": "會計制度健全且已設置明細分類帳", "C": "會計制度健全且已設置各種紀錄表", "D": "不可以免設置"}, "answer": "A", "note": ""}, {"id": "bookkeeping-102-16", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 16, "question": "依商業會計法第 66 條規定,商業每屆決算應編製下列那些報表?1盈餘分派表 2營業報告書 3財務報\n表 4虧損撥補表", "options": {"A": "12", "B": "24", "C": "13", "D": "23"}, "answer": "D", "note": ""}, {"id": "bookkeeping-102-17", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 17, "question": "依商業會計法規定,公司資本以現金以外之財物抵繳時,其入帳金額為下列何者?", "options": {"A": "原購入成本", "B": "原購入成本減累計折舊或累計攤銷", "C": "市價", "D": "淨變現價值"}, "answer": "C", "note": ""}, {"id": "bookkeeping-102-18", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 18, "question": "依商業會計處理準則規定,下列何項非屬業主權益項目?", "options": {"A": "股東會已決議而尚未發放之現金股利", "B": "累積換算調整數", "C": "庫藏股", "D": "累積虧損"}, "answer": "A", "note": ""}, {"id": "bookkeeping-102-19", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 19, "question": "依商業會計處理準則規定,下列何項非屬損益表項目?", "options": {"A": "存貨跌價損失", "B": "無形資產之減損損失", "C": "固定資產重估增值", "D": "會計原則變動之累積影響數"}, "answer": "C", "note": ""}, {"id": "bookkeeping-102-20", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 20, "question": "依商業會計處理準則規定,閒置資產應如何評價?", "options": {"A": "按成本減累計折舊評價", "B": "按淨變現價值評價", "C": "按市價評價", "D": "按重置成本評價"}, "answer": "B", "note": ""}, {"id": "bookkeeping-102-21", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 21, "question": "依商業會計處理準則規定,下列何項係屬營業外收益?", "options": {"A": "以投資為業之公司,長期股權投資採權益法認列之投資收益", "B": "金融業放款所收取之利息收入", "C": "租賃業出租資產所收取之租金", "D": "公司處分固定資產之利益"}, "answer": "D", "note": ""}, {"id": "bookkeeping-102-22", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 22, "question": "依商業會計處理準則規定,採權益法衡量之長期股權投資,收到現金股利之會計處理應為下列何者?", "options": {"A": "借記現金,貸記投資收益", "B": "借記現金,貸記長期股權投資", "C": "借記現金,貸記股東權益", "D": "借記長期股權投資,貸記投資收益"}, "answer": "B", "note": ""}, {"id": "bookkeeping-102-23", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 23, "question": "某公司自行建造一棟企業總部之大樓,依商業會計法規定其入帳成本為下列何者?", "options": {"A": "依完工時之公允價值入帳", "B": "依建造所發生之直接成本入帳", "C": "依建造所發生之直接成本及應分攤之間接費用入帳", "D": "依建造所發生之直接成本及應分攤之間接費用與管理費用入帳"}, "answer": "C", "note": ""}, {"id": "bookkeeping-102-24", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 24, "question": "依商業會計法規定,存貨之評價方法為下列何者?", "options": {"A": "以成本與市價孰低評價", "B": "以成本與淨變現價值孰低評價", "C": "以成本與公允價值孰低評價", "D": "以成本與重置成本孰低評價"}, "answer": "B", "note": ""}, {"id": "bookkeeping-102-25", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 25, "question": "依商業會計法規定,下列何項資產於重估價時,不是按物價指數重估價?", "options": {"A": "土地", "B": "房屋", "C": "遞耗資產", "D": "無形資產"}, "answer": "A", "note": ""}, {"id": "bookkeeping-102-26", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 26, "question": "依商業會計法第 71 條規定,依法受託代他人處理會計事務之人員,以明知為不實之事項,而填製會計憑證,\n應依下列何項處罰?", "options": {"A": "處新臺幣 10 萬元以下罰金", "B": "處新臺幣 6 萬元以上 30 萬元以下罰鍰", "C": "處 5 年以下有期徒刑、拘役或科或併科新臺幣 60 萬元以下罰金", "D": "處 1 年以下有期徒刑、拘役或科或併科新臺幣 15 萬元以下罰金"}, "answer": "C", "note": ""}, {"id": "bookkeeping-102-27", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 27, "question": "依商業會計法第 34 條規定,會計事項應按發生次序逐日登帳,至遲不得超過何時?", "options": {"A": "10 日", "B": "30 日", "C": "2 個月", "D": "3 個月"}, "answer": "C", "note": ""}, {"id": "bookkeeping-102-28", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 28, "question": "依商業會計處理準則第 15 條規定,分期付款銷貨之未實現利息收入應如何評價?", "options": {"A": "列為應收帳款之加項", "B": "列為應收帳款之減項", "C": "列為銷貨收入之加項", "D": "列為銷貨收入之減項"}, "answer": "B", "note": ""}, {"id": "bookkeeping-102-29", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 29, "question": "依商業會計法第 19 條規定,商業因事實上限制無法取得原始憑證時,應根據事實及金額作成憑證,由下列\n何人簽名或蓋章,憑以記帳?", "options": {"A": "主辦會計或其指定人員", "B": "商業負責人或其指定人員", "C": "經辦或主管該事項之人員", "D": "經理人"}, "answer": "B", "note": ""}, {"id": "bookkeeping-102-30", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 30, "question": "依商業會計法第 29 條規定,下列何項不必在財務報表附註中揭露?", "options": {"A": "盈餘分配之金額", "B": "重大承諾事項", "C": "重大期後發生之事項", "D": "業主權益之重大事項"}, "answer": "A", "note": ""}, {"id": "bookkeeping-102-31", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 31, "question": "依商業會計法第 8 條規定,有關商業會計之記載,下列敘述何者正確?", "options": {"A": "應以我國文字為之;其因事實上之需要,而須加註或併用外國文字者,仍以我國文字為準", "B": "因事實上之需要,以外國文字記帳者,應將外國文字翻譯為我國文字", "C": "應以我國文字為之;其因事實上之需要,可以當地通用文字記帳", "D": "應以我國文字為之,不得使用外國文字"}, "answer": "A", "note": ""}, {"id": "bookkeeping-102-32", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 32, "question": "某公司於申報營利事業所得稅時,將超限之交際費自動剔除,依商業會計法規定,其分錄記載為下列何者?", "options": {"A": "借記現金,貸記交際費", "B": "借記本期損益,貸記交際費", "C": "借記其他應收款,貸記交際費", "D": "不作分錄"}, "answer": "D", "note": ""}, {"id": "bookkeeping-102-33", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 33, "question": "依行政程序法規定,下列何項為行政處分書應記載事項?", "options": {"A": "行政處分之條件", "B": "行政處分之效力", "C": "行政處分之陳述權", "D": "不服行政處分之救濟方法、期間及其受理機關"}, "answer": "D", "note": ""}, {"id": "bookkeeping-102-34", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 34, "question": "依行政程序法第 117 條規定,違法行政處分於法定救濟期間經過後,下列那些機關得依職權撤銷?1原處分\n機關 2原處分機關之上級機關 3監察院 4總統府", "options": {"A": "34", "B": "13", "C": "24", "D": "12"}, "answer": "D", "note": ""}, {"id": "bookkeeping-102-35", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 35, "question": "依行政程序法第 131 條規定,人民有公法上之請求權時,因幾年間不行使而消滅?", "options": {"A": "1 年", "B": "2 年", "C": "10 年", "D": "20 年"}, "answer": "C", "note": ""}, {"id": "bookkeeping-102-36", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 36, "question": "行政程序法第 121 條規定之補償請求權,自行政機關告知其事由時起,因幾年間不行使而消滅?", "options": {"A": "1 年", "B": "2 年", "C": "5 年", "D": "10 年"}, "answer": "B", "note": ""}, {"id": "bookkeeping-102-37", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 37, "question": "依行政程序法規定,行政處分無效之情形係指下列何者?", "options": {"A": "內容對任何人均屬不能實現者", "B": "未通知處分相對人陳述意見", "C": "未要求當事人提供資料即作成行政處分", "D": "未給予當事人答辯或舉行聽證即作成行政處分"}, "answer": "A", "note": ""}, {"id": "bookkeeping-102-38", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 38, "question": "依現行公司法第 30 條規定,有下列何種情事,不得充經理人?1限制行為能力者 2無行為能力者 3受破\n產之宣告已復權者 4操守不良者 5曾犯詐欺罪經受有期徒刑一年以上之宣告,服刑期滿尚未逾二年者", "options": {"A": "124", "B": "125", "C": "234", "D": "345"}, "answer": "B", "note": ""}, {"id": "bookkeeping-102-39", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 39, "question": "依公司法規定,有限公司經理人之報酬應由下列何者決定?", "options": {"A": "董事長", "B": "全體股東過半數同意", "C": "全體股東同意", "D": "監察人"}, "answer": "B", "note": ""}, {"id": "bookkeeping-102-40", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 40, "question": "依現行公司法第 15 條規定,公司間有短期融通資金之必要者,融資金額不得超過貸與企業淨值的多少比例?", "options": {"A": "百分之一百", "B": "百分之五十", "C": "百分之四十", "D": "百分之十"}, "answer": "C", "note": ""}, {"id": "bookkeeping-102-41", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 41, "question": "依現行公司法第 393 條規定,下列那些公司登記事項,主管機關應予公開?1公司所在地 2股東持股名冊 \n3公司章程 4董事姓名及持股 5資本總額", "options": {"A": "1234", "B": "1345", "C": "1235", "D": "1245"}, "answer": "B", "note": ""}, {"id": "bookkeeping-102-42", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 42, "question": "依現行公司法第 387 條規定,下列何者得為申請公司登記之代理人?1律師 2會計師 3記帳士 4地政\n士 5商標代理人", "options": {"A": "45", "B": "34", "C": "23", "D": "12"}, "answer": "D", "note": ""}, {"id": "bookkeeping-102-43", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 43, "question": "甲公司共有五位董事,該公司財務報表依公司法相關法令規定,應經由會計師查核簽證,惟該公司並未委託\n會計師查核簽證其財務報表,請問依公司法規定其處罰鍰總額為下列何者?", "options": {"A": "新臺幣五萬元以上二十五萬元以下罰鍰", "B": "新臺幣二萬元以上十萬元以下罰鍰", "C": "資本額百分之五罰鍰", "D": "各處新臺幣五萬元罰鍰"}, "answer": "A", "note": ""}, {"id": "bookkeeping-102-44", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 44, "question": "某公司設立資本額新臺幣一千萬元,股東並未實際繳納股款,係由他人代墊,該公司共有三位董事,依公司\n法規定下列何項處罰為正確?", "options": {"A": "董事長處五年以下有期徒刑、拘役或科或併科新臺幣五十萬元以上二百五十萬元以下罰金", "B": "公司負責人各處五年以下有期徒刑、拘役或科或併科新臺幣五十萬元以上二百五十萬元以下罰金", "C": "公司負責人各處五年以下有期徒刑、拘役或科或併科新臺幣五十萬元以上二百五十萬元以下罰鍰", "D": "代墊款之人應處五年以下有期徒刑"}, "answer": "B", "note": ""}, {"id": "bookkeeping-102-45", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 45, "question": "商業登記法所稱之商業為下列何者?", "options": {"A": "營利事業", "B": "公司、獨資或合夥事業", "C": "獨資或合夥方式經營之事業", "D": "社團法人之營利事業"}, "answer": "C", "note": ""}, {"id": "bookkeeping-102-46", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 46, "question": "依中華民國記帳士職業道德規範相關規定,下列何者為該職業道德規範制訂之目的?1建立記帳士之信譽 \n2端正社會風氣 3維持記帳士之社會形象 4避免記帳士受行政處罰 5避免記帳士受刑事處罰", "options": {"A": "123", "B": "134", "C": "235", "D": "345"}, "answer": "A", "note": ""}, {"id": "bookkeeping-102-47", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 47, "question": "依中華民國記帳士職業道德規範規定,下列何者為記帳士延攬業務應遵行之規範?1不得刊登廣告宣傳 \n2不得詆毀同業 3不得暗示相關利害關係 4不得不正當之抑價 5不得以利誘方式", "options": {"A": "1234", "B": "1245", "C": "2345", "D": "1345"}, "answer": "C", "note": ""}, {"id": "bookkeeping-102-48", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 48, "question": "依中華民國記帳士職業道德規範規定,下列有關記帳士職業守則之規範,何者為正確?1強調委辦事項公開 \n2保持職業尊嚴 3堅守誠實信用原則 4不得玷辱職業信譽", "options": {"A": "124", "B": "234", "C": "123", "D": "134"}, "answer": "B", "note": ""}, {"id": "bookkeeping-102-49", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 49, "question": "依中華民國記帳士職業道德規範相關規定,下列何項違反記帳士職業道德規範?", "options": {"A": "記帳士在廣告宣傳中明示或暗示其與政府機關具有良好之關係", "B": "甲記帳士與乙記帳士共同設立記帳士事務所", "C": "延攬同業之業務", "D": "受理直系親屬之委任辦理商業會計事項"}, "answer": "A", "note": ""}, {"id": "bookkeeping-102-50", "year": "102", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 50, "question": "依記帳士法規定,下列何者為記帳士得終止委任契約之條件?1有正當事由 2於 10 天前通知委任人 \n3經委任人同意 4經主管機關同意 5報記帳士公會備查", "options": {"A": "135", "B": "134", "C": "234", "D": "123"}, "answer": "D", "note": ""}, {"id": "chinese-102-1", "year": "102", "subject": "chinese", "subjectName": "國文", "number": 1, "question": "湯顯祖《牡丹亭.驚夢》:「原來姹紫嫣紅開遍,似這般都付與斷井頹垣。良辰美\n景奈何天,賞心樂事誰家院!」主要表達何種感觸?", "options": {"A": "人生苦短,及時行樂", "B": "韶光易逝,好景不常", "C": "野火燒不盡,春風吹又生", "D": "隨意春芳歇,王孫自可留"}, "answer": "B", "note": ""}, {"id": "chinese-102-2", "year": "102", "subject": "chinese", "subjectName": "國文", "number": 2, "question": "趙襄子攻翟,勝老人、中人,使使者來謁之,襄子方食摶飯,有憂色。左右曰:\n「一朝而兩城下,此人之所以喜也,今君有憂色何?」襄子曰:「江河之大也,不\n過三日;飄風暴雨,日中不須臾。今趙氏之德行,無所於積,一朝而兩城下,亡其\n及我乎?」孔子聞之曰:「趙氏其昌乎!」(《呂氏春秋.慎大覽》)這則故事可\n說明孔子以為成功的原因,就在於:", "options": {"A": "憂患意識", "B": "乘勝追擊", "C": "同甘共苦", "D": "任勞任怨"}, "answer": "A", "note": ""}, {"id": "chinese-102-3", "year": "102", "subject": "chinese", "subjectName": "國文", "number": 3, "question": "「楚莊王好細腰,故朝有餓人。」(《荀子.君道》) \n下列選項中,何者最能說明這兩句話的文義?", "options": {"A": "望風披靡", "B": "前倨後恭", "C": "上行下效", "D": "假公濟私\n60210\n\n那天,我和父親在江蘇家鄉的河邊上散步,我們恰巧看到一群鴨子,正要下水嬉\n戲,我發現河水被牠們弄皺了,感到非常有趣。不久,鴨子又繼續游向對岸。父親問\n我:「孩子!你看到了吧?每隻鴨子在水面上,都游出一條屬於自己的水路。」我說:\n「我看到了!」父親摸摸我的頭,微笑地說:「你看河裡,大鴨子游出來的水路,是\n大路;小鴨子游出來的水路,是小路。每隻鴨子都有自己的路,而且小鴨子也能夠像\n大鴨子一樣,從河的此岸到達河的彼岸。」 \n父親深深地吸口氣,遙望著對岸的鴨子,拍拍我的肩膀:「孩子啊!你也十來歲\n了!每一個人都有他自己能夠走的路,如果你的力量很大,能夠走出大路,你也不要\n覺得了不起,因為你也只是走一條路而已,當你到達河的彼岸,別人也能夠到達那邊。\n如果你的力量很小,你也不要難過,不必羨慕別人的大路,不必認為自己沒有用,因為\n你也能夠到達彼岸。」(聖嚴法師〈大鴨游出大路,小鴨游出小路〉)"}, "answer": "C", "note": ""}, {"id": "chinese-102-4", "year": "102", "subject": "chinese", "subjectName": "國文", "number": 4, "question": "上文中,「每隻鴨子都有自己的路,而且小鴨子也能夠像大鴨子一樣,從河的此岸\n到達河的彼岸。」所說的意思,下列選項何者最為貼近?", "options": {"A": "天生我材必有用", "B": "醜小鴨終成天鵝", "C": "塞翁失馬,焉知非福", "D": "知己知彼,百戰百勝"}, "answer": "A", "note": ""}, {"id": "chinese-102-5", "year": "102", "subject": "chinese", "subjectName": "國文", "number": 5, "question": "根據上文,作者的父親認為力量很大時走出的大路與力量小時走出的小路,二者之\n間真正的差異在於:", "options": {"A": "力量小者若跟隨力量大者的水路,亦可以快速到達河的彼岸", "B": "力量大者須謙虛看待自己的成就,而力量小者則須對自己有信心,不怨天尤人", "C": "所謂能者多勞,力量大者必須加倍付出心力,力量小者盡力即可,不能則止", "D": "大路與小路的差別在於是否努力不懈、堅持到底,若半途而廢,大路亦不可得"}, "answer": "B", "note": ""}, {"id": "chinese-102-6", "year": "102", "subject": "chinese", "subjectName": "國文", "number": 6, "question": "子曰:「羣居終日,言不及義,好行小慧,難矣哉!」(《論語.衛靈公》)下列\n敘述,何者最能貼切說明上文中「好行小慧」的意義?", "options": {"A": "矯飾善行博取美好名聲", "B": "喜歡運用私智僥倖行事", "C": "不擇手段追求短暫利益", "D": "專門結黨營私圖利個人"}, "answer": "B", "note": ""}, {"id": "chinese-102-7", "year": "102", "subject": "chinese", "subjectName": "國文", "number": 7, "question": "居是官者,當志其大,捨其細,先其急,後其緩,專利國家而不為身謀。彼汲汲於\n名者,猶汲汲於利也。(司馬光〈諫院題名記〉)以下何者不屬於司馬光主張之諫\n官應有品德?", "options": {"A": "不務苛細", "B": "先辦急事", "C": "急於求名", "D": "不求私利"}, "answer": "C", "note": ""}, {"id": "chinese-102-8", "year": "102", "subject": "chinese", "subjectName": "國文", "number": 8, "question": "東昌卞氏,業牛醫者,有女小字臙脂,才姿惠麗。父寶愛之,欲占鳳於清門,而世\n族鄙其寒賤,不屑締盟,以故及笄未字。對戶龔姓之妻王氏,佻脫善謔,女閨中談\n友也。一日,送至門,見一少年過,白服裙帽,丰采甚都。女意似動,秋波縈轉之。\n少年俯其首,趨而去。去既遠,女猶凝眺。王窺其意,戲之曰:「以娘子才貌,得\n配若人,庶可無恨。」女暈紅上頰,脈脈不作一語。(蒲松齡〈臙脂〉)根據上文,\n下列敘述何者錯誤?", "options": {"A": "女方出身寒門", "B": "男方不解風情", "C": "女方情竇初開", "D": "王氏積極媒合\n60210"}, "answer": "D", "note": ""}, {"id": "chinese-102-9", "year": "102", "subject": "chinese", "subjectName": "國文", "number": 9, "question": "《世說新語.巧藝篇》曰:「顧長康畫人,或數年不點目精。人問其故,顧曰:\n『四體妍蚩,本無關於妙處,傳神寫照,正在阿堵中。』」可知顧長康畫人首重:", "options": {"A": "形似", "B": "妍蚩", "C": "傳神", "D": "色彩"}, "answer": "C", "note": ""}, {"id": "chinese-102-10", "year": "102", "subject": "chinese", "subjectName": "國文", "number": 10, "question": "管仲既任政相齊,以區區之齊,在海濱,通貨積財,富國彊兵,與俗同好惡。故其\n稱曰:「倉廩實而知禮節;衣食足而知榮辱。上服度,則六親固。四維不張,國乃\n滅亡。下令如流水之原,令順民心。」故論卑而易行。俗之所欲,因而予之;俗之\n所否,因而去之。(司馬遷《史記.管晏列傳》)文中「與俗同好惡」語義與下列\n何者最為貼近?", "options": {"A": "好惡與聖人同", "B": "民之所欲,常在我心", "C": "作之君,作之親,作之師", "D": "風俗之厚薄繫乎一二人心之所向"}, "answer": "B", "note": ""}, {"id": "chinese-102-11", "year": "102", "subject": "chinese", "subjectName": "國文", "number": 11, "question": "《荀子》云:「術正而心順之,則形相雖惡而心術善,無害為君子也。形相雖善而\n心術惡,無害為小人也。君子之謂吉,小人之謂凶。」根據上文,下列選項何者最\n為貼近?", "options": {"A": "相人之術是一門重要的學問", "B": "形貌美醜影響一個人的吉凶禍福", "C": "吉凶以人格決定,不以形相決定", "D": "形貌是一個人成為君子的重要條件"}, "answer": "C", "note": ""}, {"id": "chinese-102-12", "year": "102", "subject": "chinese", "subjectName": "國文", "number": 12, "question": "生活的藝術,有一部份我不是不能領略。我懂得怎麼看『七月巧雲』,聽蘇格蘭兵\n吹 bagpipe,享受微風中的籐椅,吃鹽水花生,欣賞雨夜的霓虹燈,從雙層公共汽\n車上伸出手摘樹巔的綠葉。在沒有人與人交接的場合,我充滿了生命的歡悅。可是\n我一天不能克服這種咬嚙性的小煩惱,生命是一襲華美的袍,爬滿了蚤子。(張愛\n玲〈天才夢〉)以下敘述何者錯誤?", "options": {"A": "作者懂得領略部分生活中的藝術", "B": "作者在人與人交接的場合裡,容易感到不自在", "C": "文中「咬嚙性的小煩惱」是指獨處的孤寂", "D": "「生命是一襲華美的袍,爬滿了蚤子。」這是運用了「象徵」的手法"}, "answer": "C", "note": ""}, {"id": "chinese-102-13", "year": "102", "subject": "chinese", "subjectName": "國文", "number": 13, "question": "「世路中人,或圖功名,或治生產,儘自正經。爭奈天地間好風月、好山水、好書\n籍,了不相涉,豈非枉卻一生?」關於以上文字的敘述,下列選項何者最為貼近?", "options": {"A": "本文旨在強調能享受生活樂趣的人,也才能在圖功名、治生產時有優異的表現", "B": "「或圖功名,或治生產,儘自正經」,意指圖功名、治生產,都要以平常心去面對", "C": "文中所謂「枉卻一生」者,乃指熱衷於功名、生產,卻不知在風月、山水、書籍\n間找到生活樂趣的人", "D": "「爭奈天地間好風月、好山水、好書籍,了不相涉」,意指遊覽自然風月山水,\n與專心讀書,是截然不同的事\n60210"}, "answer": "C", "note": ""}, {"id": "chinese-102-14", "year": "102", "subject": "chinese", "subjectName": "國文", "number": 14, "question": "以下「」內的數字,何者為實際數目,而非虛數?", "options": {"A": "欲窮「千里」目,更上一層樓(王之渙〈登鸛鵲樓〉)", "B": "「三顧」頻煩天下計,兩朝開濟老臣心(杜甫〈蜀相〉)", "C": "相見時難別亦難,東風無力「百花」殘(李商隱〈無題〉)", "D": "五花馬,千金裘,呼兒將出換美酒,與爾同銷「萬古」愁(李白〈將進酒〉) \n那一雙傲慢的靴子至今還落在/高力士羞憤的手裡,人卻不見了/把滿地的難民和傷兵/\n把胡馬和羌笛交踐的節奏/留給杜二去細細的苦吟/自從那年賀知章眼花了/認你做\n謫仙,便更加佯狂/用一隻中了魔咒的小酒壺/把自己藏起來,連太太也尋不到你/怨\n長安城小而壺中天長(余光中)"}, "answer": "B", "note": ""}, {"id": "chinese-102-15", "year": "102", "subject": "chinese", "subjectName": "國文", "number": 15, "question": "這首詩描寫的人物應是下列何人?", "options": {"A": "詩佛", "B": "詩仙", "C": "詩聖", "D": "詩鬼"}, "answer": "B", "note": ""}, {"id": "chinese-102-16", "year": "102", "subject": "chinese", "subjectName": "國文", "number": 16, "question": "根據上文,詩中所描寫的人物,不包括下列那項特質?", "options": {"A": "佯狂", "B": "嗜酒", "C": "傲慢", "D": "矯情"}, "answer": "D", "note": ""}, {"id": "chinese-102-17", "year": "102", "subject": "chinese", "subjectName": "國文", "number": 17, "question": "下列選項與「百萬買房,千萬買鄰」意思相差最遠的是:", "options": {"A": "孟母三遷,以教其子", "B": "君子居必擇鄉,遊必就士", "C": "里仁為美,擇不處仁,焉得知", "D": "肯與鄰翁相對飲,隔籬呼取盡餘杯"}, "answer": "D", "note": ""}, {"id": "chinese-102-18", "year": "102", "subject": "chinese", "subjectName": "國文", "number": 18, "question": "《史記.淮陰侯列傳》:「(韓)信釣於城下,諸母漂,有一母見信飢,飯信,竟\n漂數十日。信喜,謂漂母曰:『吾必有以重報母。』母怒曰:『大丈夫不能自食,\n吾哀王孫而進食,豈望報乎?』」關於這段文字的理解與詮釋,下列何者正確?", "options": {"A": "「大丈夫不能自食」意為「大丈夫不能養活自己」,「食」為動詞", "B": "「竟漂數十日」意為「竟然連續漂洗綿絮長達幾十天」,「漂」為名詞", "C": "「吾必有以重報母」意為「我一定會對你嚴加報復」,「報」為動詞", "D": "「吾哀王孫而進食」意為「我可憐你才給你飯吃」,「哀」為形容詞"}, "answer": "A", "note": ""}, {"id": "chinese-102-19", "year": "102", "subject": "chinese", "subjectName": "國文", "number": 19, "question": "下列文句「」內的詞語,屬於謙詞用法的是:", "options": {"A": "余小時,「大人」令誦〈子虛賦〉,私心慕之", "B": "「足下」欲使吾適人之適,而吾欲自適其適,非敢非足下之義也", "C": "衛使客事魏,三年不得見,衛客患之,乃見梧下「先生」,許之以百金", "D": "「不佞」竊嘗謬議,今公私匱竭之際,惟有錢法一事,可以通利權、便民裕國"}, "answer": "D", "note": ""}, {"id": "chinese-102-20", "year": "102", "subject": "chinese", "subjectName": "國文", "number": 20, "question": "關於應用文的用法,下列何者正確?", "options": {"A": "名片又可稱為「謁」、「刺」等", "B": "明信片上一般用啓、緘等字樣", "C": "祝賀結婚,可於禮金袋上書寫「湯餅之敬」", "D": "訃聞中,「鼎惠懇辭」、「鄉學寅世戚友」應用黑字以表哀戚"}, "answer": "A", "note": ""}, {"id": "tax-102-1", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 1, "question": "依現行稅捐稽徵法規定應處罰鍰者,應由下列那一機關處分之?", "options": {"A": "地方法院", "B": "行政法院", "C": "主管稽徵機關", "D": "財政部"}, "answer": "C", "note": ""}, {"id": "tax-102-2", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 2, "question": "依稅捐稽徵法規定,所稱擔保稅款擔保品之相當擔保,下列何項正確?", "options": {"A": "核准上市之有價證券,按七折計算", "B": "黃金,按八折計算", "C": "經中央銀行掛牌之外幣,按九折計算", "D": "銀行存款單摺,按存款本金額計值"}, "answer": "D", "note": ""}, {"id": "tax-102-3", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 3, "question": "依稅捐稽徵法規定,納稅義務人死亡,遺有財產者,其依法應繳納之稅捐,第一順位應由下列何者負責繳清\n後始得分割遺產?", "options": {"A": "遺產管理人", "B": "遺囑執行人", "C": "繼承人", "D": "受遺贈人"}, "answer": "B", "note": ""}, {"id": "tax-102-4", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 4, "question": "依稅捐稽徵法規定,經依行政救濟程序終結判決,應退還納稅義務人稅款者,稅捐稽徵機關應於接到判決書\n正本後幾日內退款?", "options": {"A": "10 日", "B": "15 日", "C": "20 日", "D": "30 日"}, "answer": "A", "note": ""}, {"id": "tax-102-5", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 5, "question": "依稅捐稽徵法第 17 條規定,納稅義務人如發現繳納通知文書有計算錯誤時,得於規定繳納期間內,要求稽\n徵機關做下列何行為?", "options": {"A": "復查", "B": "訴願", "C": "查對更正", "D": "行政訴訟"}, "answer": "C", "note": ""}, {"id": "tax-102-6", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 6, "question": "依稅捐稽徵法規定,可歸責於政府機關之錯誤,致溢繳稅款者,其得退還之溢繳稅款以幾年為限?", "options": {"A": "2 年", "B": "5 年", "C": "7 年", "D": "無限期"}, "answer": "D", "note": ""}, {"id": "tax-102-7", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 7, "question": "甲公司與乙公司在 102 年 4 月 5 日合併為丙公司,同年 8 月 10 日經核定甲公司應補繳 100 年度營利事業所\n得稅 10 萬元,依稅捐稽徵法規定,何人應負繳納之義務?", "options": {"A": "甲公司", "B": "甲公司股東", "C": "乙公司", "D": "丙公司"}, "answer": "D", "note": ""}, {"id": "tax-102-8", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 8, "question": "李先生本期房屋稅 4 萬元,在繳納期限後 90 天才繳納,依稅捐稽徵法規定,應加徵滯納金多少?", "options": {"A": "6 千元", "B": "1 萬 7 千 6 百元", "C": "1 萬 8 千元", "D": "3 萬 6 千元"}, "answer": "A", "note": ""}, {"id": "tax-102-9", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 9, "question": "王鈞 101 年度有符合規定之購屋借款利息 20 萬元,房屋租金支出 15 萬元,銀行存款利息 7 萬元,依所得稅\n法規定,若採對王鈞最有利的方式申報所得稅,則可申報列舉扣除額為多少元?", "options": {"A": "12 萬元", "B": "13 萬元", "C": "15 萬元", "D": "20 萬元"}, "answer": "B", "note": ""}, {"id": "tax-102-10", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 10, "question": "依據所得稅法規定,營利事業以法定盈餘公積撥充資本者,其已依規定減除可扣抵稅額,應於下列何時計入\n當年度股東可扣抵帳戶?", "options": {"A": "年度決算日", "B": "營利事業所得稅結算申報日", "C": "撥充資本日", "D": "獲配盈餘日"}, "answer": "C", "note": ""}, {"id": "tax-102-11", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 11, "question": "依據所得稅法規定,非屬公司組織之營利事業解散時,其清算期間為自解散之日起多久期間?", "options": {"A": "30 日", "B": "45 日", "C": "2 個月", "D": "3 個月"}, "answer": "D", "note": ""}, {"id": "tax-102-12", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 12, "question": "依據所得稅法規定,國外影片事業在中華民國境內無分支機構,經由營業代理人出租影片之收入,應以其多\n少比例為中華民國境內之營利事業所得額?", "options": {"A": "10%", "B": "15%", "C": "45%", "D": "50%"}, "answer": "D", "note": ""}, {"id": "tax-102-13", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 13, "question": "陳淑貞與李英雄夫妻綜合所得稅係採合併申報,陳淑貞有稿費收入 15 萬元及作曲收入 12 萬元,李英雄有版\n稅收入 20 萬元,依所得稅法相關規定,夫妻二人今年應課稅收入(尚未減除必要費用)為多少元?", "options": {"A": "2 萬元", "B": "11 萬元", "C": "29 萬元", "D": "47 萬元"}, "answer": "B", "note": ""}, {"id": "tax-102-14", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 14, "question": "張先生 101 年將房屋出租預收一年租金 36 萬元,押金 9 萬元,一年期存款利率為 1.2%,102 年 4 月 30 日\n租期屆滿退回押金 9 萬元,依所得稅法相關規定,則張先生辦理 102 年度綜合所得稅結算申報時,應申報\n租金收入(尚未減除必要費用)為多少元?", "options": {"A": "0 元", "B": "360 元", "C": "12 萬元", "D": "12 萬 360 元"}, "answer": "B", "note": ""}, {"id": "tax-102-15", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 15, "question": "依所得稅法規定,下列那一項所得應納所得稅?", "options": {"A": "傷害之損害賠償金", "B": "公務員所領政府發給之房租津貼", "C": "勞工保險之保險給付", "D": "對社會大眾營業之消費合作社之盈餘"}, "answer": "D", "note": ""}, {"id": "tax-102-16", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 16, "question": "李明將 9 萬股股票信託給王華,101 年中獲配股利總額 9 萬元,無必要費用,102 年王華將股利總額分配給\n受益人蔣安,依所得稅法規定,何人應申報何年度綜合所得稅?", "options": {"A": "李明;101 年度", "B": "李明;102 年度", "C": "蔣安;101 年度", "D": "蔣安;102 年度"}, "answer": "C", "note": ""}, {"id": "tax-102-17", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 17, "question": "東京公司總公司在日本,經財政部核定按營業收入百分比計算所得,101 年境內出租機器設備業務收入 1 億\n元,以前年度核定虧損 600 萬元,則依所得稅法規定,該公司 101 年度營利事業所得額為:", "options": {"A": "400 萬元", "B": "900 萬元", "C": "1 千萬元", "D": "1 千 500 萬元"}, "answer": "D", "note": ""}, {"id": "tax-102-18", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 18, "question": "設甲公司 102 年度依所得稅法計算之課稅所得額為 1,000 萬元,另有國內證券交易所得 500 萬元,依據現行\n所得基本稅額條例規定,甲公司須增加繳納所得基本稅額多少?", "options": {"A": "0 元", "B": "4 萬元", "C": "50 萬元", "D": "60 萬元"}, "answer": "B", "note": ""}, {"id": "tax-102-19", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 19, "question": "依據現行所得基本稅額條例之規定,下列何者不列入計算個人基本所得額?", "options": {"A": "綜合所得淨額", "B": "美國來源所得", "C": "私募證券投資信託基金之受益憑證之交易所得", "D": "申報綜合所得稅減除之現金捐贈"}, "answer": "D", "note": ""}, {"id": "tax-102-20", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 20, "question": "依所得基本稅額條例規定,計算個人基本所得稅額時,未計入綜合所得總額之非中華民國來源所得,全年未\n達新臺幣多少元者免予計入?", "options": {"A": "每人 100 萬元", "B": "每一申報戶 100 萬元", "C": "每人 600 萬元", "D": "每一申報戶 600 萬元"}, "answer": "B", "note": ""}, {"id": "tax-102-21", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 21, "question": "依據營利事業所得稅查核準則之規定,下列各項費用認列標準之敘述,何者正確?", "options": {"A": "營利事業單件購置之固定資產,其耐用年限超過兩年,而支出金額不超過 10 萬元者,得以成本列為當年\n度費用", "B": "非適用勞動基準法之營利事業訂有職工退休辦法者,每年度得在不超過當年度已付薪資總額 6%限度內,\n提列退休金準備,並以費用列支", "C": "營利事業對政黨之捐贈,以不超過所得總額 20%為限,其總額不得超過 50 萬元", "D": "營利事業透過財團法人私立學校興學基金會,對未指定特定私立學校之捐款,得全數列為費用"}, "answer": "D", "note": ""}, {"id": "tax-102-22", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 22, "question": "依據營利事業所得稅查核準則之規定,營利事業災害損失應列為當年損失,但損失較為鉅大者,得分幾年平均\n攤列?", "options": {"A": "3 年", "B": "5 年", "C": "6 年", "D": "10 年"}, "answer": "B", "note": ""}, {"id": "tax-102-23", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 23, "question": "依營利事業所得稅查核準則規定,營利事業銷售在國內提供而在國外使用之勞務,其銷售額應歸屬於下列那\n一個日期所屬之會計年度?", "options": {"A": "契約簽訂日", "B": "勞務提供開始日", "C": "勞務提供完成日", "D": "付款日"}, "answer": "C", "note": ""}, {"id": "tax-102-24", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 24, "question": "依營利事業所得稅查核準則規定,營利事業對中小企業發展基金之捐贈,以所得額之多少百分比為限?", "options": {"A": "10%", "B": "20%", "C": "25%", "D": "不受金額限制"}, "answer": "D", "note": ""}, {"id": "tax-102-25", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 25, "question": "依營利事業所得稅查核準則規定,營利事業下腳變價時最高可提撥多少職工福利金?", "options": {"A": "0.15%", "B": "5%", "C": "20%", "D": "40%"}, "answer": "D", "note": ""}, {"id": "tax-102-26", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 26, "question": "依營利事業所得稅查核準則規定,交際費限額為採簽證申報者,銷貨三千萬元以下 0.6%,外銷結匯收入 2%,\n木柵公司 101 年銷貨 3 千萬元,其中 1 千萬元外銷,已收外匯 8 百萬元,餘尚未收現,無進貨,則 101 年\n交際費限額為多少?", "options": {"A": "28 萬元", "B": "32 萬元", "C": "34 萬元", "D": "38 萬元"}, "answer": "C", "note": ""}, {"id": "tax-102-27", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 27, "question": "依營利事業所得稅查核準則規定,營利事業出售不動產並依法移轉產權,其所得歸屬年度之認定,應以何日\n期為準?", "options": {"A": "所有權移轉登記日", "B": "完成登記後之交付日期", "C": "簽約日", "D": "收取尾款日"}, "answer": "A", "note": ""}, {"id": "tax-102-28", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 28, "question": "依據營利事業所得稅查核準則之規定,下列營利事業支付之稅捐,何者得列為當期費用?", "options": {"A": "本期繳納之營利事業所得稅", "B": "承租營業處所,按租約由承租人負擔之房屋稅", "C": "購買房屋所繳納之印花稅", "D": "進口生產設備支付之關稅"}, "answer": "B", "note": ""}, {"id": "tax-102-29", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 29, "question": "依據營利事業所得稅查核準則之規定,營利事業承包工程採全部完工法計算損益,其承包工程工期有跨越年\n度者,其管理費用應依下列何種方式列報?", "options": {"A": "於費用發生年度列報費用", "B": "平均分攤至各施工期間認列費用", "C": "按完工比例分攤至各年度", "D": "遞延至完工年度列報費用"}, "answer": "A", "note": ""}, {"id": "tax-102-30", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 30, "question": "依加值型及非加值型營業稅法(以下第 31~45 題簡稱營業稅法)規定,查定計算營業稅額之小規模營業人,\n關於其取得進貨憑證之進項稅額扣抵規定之敘述,下列何者正確?", "options": {"A": "進項稅額一律不得扣抵", "B": "如依規定申報,按進項稅額 5%,扣抵查定稅額", "C": "如依規定申報,按進項稅額 10%,扣抵查定稅額", "D": "如依規定申報,進項稅額得扣抵查定稅額,但以查定稅額 10%為限"}, "answer": "C", "note": ""}, {"id": "tax-102-31", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 31, "question": "依營業稅法規定,下列何種貨物不適用營業稅零稅率?", "options": {"A": "供近海漁業使用之漁船", "B": "銷售予保稅區營業人供營運用之貨物或勞務", "C": "國內提供而在國外使用之勞務", "D": "依法設立之免稅商店銷售予出境旅客之貨物"}, "answer": "A", "note": ""}, {"id": "tax-102-32", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 32, "question": "依據營業稅法之規定,下列何者之進項稅額不得扣抵銷項稅額?", "options": {"A": "購入設置公司接待室之電視機", "B": "購入提供勞軍用之電視機", "C": "購入供員工年終摸彩之電視機", "D": "購入公司送貨用之小貨車"}, "answer": "C", "note": ""}, {"id": "tax-102-33", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 33, "question": "按查定計算稅額之某小吃店,經稽徵機關查定每月營業額為 100,000 元,則依營業稅法規定,其當期應納營\n業稅額為若干元?", "options": {"A": "1,000 元", "B": "3,000 元", "C": "5,000 元", "D": "15,000 元"}, "answer": "B", "note": ""}, {"id": "tax-102-34", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 34, "question": "依營業稅法相關法規規定,營業人進項稅額憑證,未於當期或次期申報者,應於申報扣抵當期敘明理由,但\n進項稅款憑證之申報扣抵期間,以幾年為限?", "options": {"A": "1 年", "B": "3 年", "C": "5 年", "D": "7 年"}, "answer": "C", "note": ""}, {"id": "tax-102-35", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 35, "question": "依據營業稅法之規定,下列違反稅法規定相關罰則之敘述,何者錯誤?", "options": {"A": "納稅義務人將發票轉供他人使用者,除通知限期改正,並處 1,000 元以上,10,000 元以下罰鍰", "B": "營業人無進貨事實而虛報進項稅額者,除追繳稅款外,按所漏稅額處 5 倍以下罰鍰", "C": "營業人漏開統一發票,除追繳漏報稅款外,按所漏稅額處 1 倍至 10 倍罰鍰", "D": "納稅義務人未依規定申請營業登記而營業者,除追繳稅款外,按所漏稅額處 1 倍至 10 倍罰鍰"}, "answer": "D", "note": ""}, {"id": "tax-102-36", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 36, "question": "依營業稅法規定,營業人申請變更登記,在下列何種情況應先繳清稅款或提供擔保後為之?", "options": {"A": "轉讓", "B": "合併", "C": "增資", "D": "營業種類變更"}, "answer": "A", "note": ""}, {"id": "tax-102-37", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 37, "question": "木新公司為按一般稅額計算之營業人,其於 4 月 16 日出租房屋收取押租金 168 萬元,一年期定期存款年利\n率為 1.5%,則依營業稅法相關法規規定,該公司 4 月份押租金之銷售額為多少?", "options": {"A": "0 元", "B": "1,000 元", "C": "1,050 元", "D": "2,000 元"}, "answer": "A", "note": ""}, {"id": "tax-102-38", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 38, "question": "依營業稅法規定,外國技藝表演業在我國境內演出之營業稅,在同地演出期間不超過 30 日者,應於何時報\n繳?", "options": {"A": "演出結束後 15 日內", "B": "演出結束後 30 日內", "C": "照一般營業人報繳期限", "D": "離境前"}, "answer": "A", "note": ""}, {"id": "tax-102-39", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 39, "question": "依營業稅法規定,銀行業經營非專屬本業之銷售額其營業稅稅率為:", "options": {"A": "1%", "B": "2%", "C": "5%~10%,其徵收率由行政院定之", "D": "15%"}, "answer": "C", "note": ""}, {"id": "tax-102-40", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 40, "question": "依一般稅額計算之營業人木柵中古車行以 6 萬 3 千元向張先生購買舊乘人小汽車,同月份以 5 萬元另加 5%\n營業稅出售,則依營業稅法規定,該舊車可扣抵進項稅額為多少?", "options": {"A": "0 元", "B": "650 元", "C": "2 千 5 百元", "D": "3 千元"}, "answer": "C", "note": ""}, {"id": "tax-102-41", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 41, "question": "臺北公司本期銷項稅額 5 萬元,零稅率銷售額 60 萬元,取得進項稅額憑證包括自用乘人小汽車 4 萬元,進\n貨 10 萬元,固定資產(辦公設備)7 萬元,依營業稅法規定,該公司本期得退還稅額為多少元?", "options": {"A": "7 萬元", "B": "10 萬元", "C": "12 萬元", "D": "14 萬元"}, "answer": "B", "note": ""}, {"id": "tax-102-42", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 42, "question": "依營業稅法規定,下列何者非屬加值型及非加值型營業稅課稅範圍?", "options": {"A": "在我國境內銷售勞務", "B": "營業人解散時所餘存貨物分配與股東", "C": "進口貨物", "D": "會計師提供為公司稅務簽證之勞務"}, "answer": "D", "note": ""}, {"id": "tax-102-43", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 43, "question": "依營業稅法規定,下列何者不能免徵營業稅?", "options": {"A": "出售之土地", "B": "醫院提供之藥品", "C": "出版業發行經主管教育行政機關審定之國中教科書", "D": "依法登記之報社銷售之廣告"}, "answer": "D", "note": ""}, {"id": "tax-102-44", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 44, "question": "臺中公司進口完稅價格 40 萬元未經加工之生鮮農產品櫻桃,並以銷售額 60 萬元在國內出售,依營業稅法規\n定該公司共應繳納營業稅多少元?", "options": {"A": "0 元", "B": "1 萬元", "C": "2 萬元", "D": "3 萬元"}, "answer": "C", "note": ""}, {"id": "tax-102-45", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 45, "question": "臺東公司以成本 8 萬元、時價 10 萬元貨物,與臺西公司交換成本 7 萬元、時價 12 萬元貨物,依營業稅法相\n關法規規定,臺東公司之銷售額為:", "options": {"A": "7 萬元", "B": "8 萬元", "C": "10 萬元", "D": "12 萬元"}, "answer": "D", "note": ""}, {"id": "tax-102-46", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 46, "question": "依遺產及贈與稅法(以下第 47~50 題簡稱遺贈稅法)規定,作農業使用之農業用地,贈與下列何人,其土\n地價值可不計入贈與總額計徵贈與稅?", "options": {"A": "女婿", "B": "岳父", "C": "孫女", "D": "堂兄"}, "answer": "C", "note": ""}, {"id": "tax-102-47", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 47, "question": "遺贈不動產給公益機關而依法得免計入遺產總額者,納稅義務人如未於一定時限內辦妥產權移轉登記,將被\n依法補徵遺產稅,依遺贈稅法相關法規規定,此一時限應為自主管稽徵機關核發不計入遺產總額證明書之\n日起多久時間內?", "options": {"A": "3 個月", "B": "6 個月", "C": "1 年", "D": "2 年"}, "answer": "C", "note": ""}, {"id": "tax-102-48", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 48, "question": "張三死亡留有四年前繼承已納遺產稅上市股票,該股票繼承日收盤價 400 萬元,死亡日收盤價 600 萬元,淨\n值 500 萬元,依遺贈稅法規定,遺囑執行人申報遺產稅時該財產應申報金額為若干?", "options": {"A": "不計入遺產總額", "B": "400 萬元", "C": "500 萬元", "D": "600 萬元"}, "answer": "A", "note": ""}, {"id": "tax-102-49", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 49, "question": "依遺贈稅法規定,遺產稅納稅義務人,應於稽徵機關送達核定納稅通知書之日起幾個月內繳清應納稅額?", "options": {"A": "1 個月", "B": "2 個月", "C": "3 個月", "D": "6 個月"}, "answer": "B", "note": ""}, {"id": "tax-102-50", "year": "102", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 50, "question": "關於違反遺贈稅法之罰則,下列敘述何者錯誤?", "options": {"A": "納稅義務人未依限辦理遺產稅申報者,按核定應納稅額加處一倍以下之罰鍰", "B": "納稅義務人應申報之遺產,已依法申報而有漏報者,應按所漏遺產稅額處以二倍以下之罰鍰", "C": "納稅義務人故意以詐欺方法逃漏遺產稅者,除補稅外,並處以所漏稅額一至三倍罰鍰", "D": "遺產稅之罰鍰,連同應徵之稅款,最多不得超過遺產總額"}, "answer": "A", "note": ""}, {"id": "accounting-103-1", "year": "103", "subject": "accounting", "subjectName": "會計學概要", "number": 1, "question": "財務會計應遵循下列何者處理?", "options": {"A": "業主指示", "B": "稅法規定", "C": "一般公認會計原則", "D": "管理理念"}, "answer": "C", "note": ""}, {"id": "accounting-103-2", "year": "103", "subject": "accounting", "subjectName": "會計學概要", "number": 2, "question": "會計處理程序正確的順序為:", "options": {"A": "衡量、認定、記錄、溝通", "B": "認定、記錄、衡量、溝通", "C": "認定、衡量、記錄、溝通", "D": "認定、記錄、溝通、衡量"}, "answer": "C", "note": ""}, {"id": "accounting-103-3", "year": "103", "subject": "accounting", "subjectName": "會計學概要", "number": 3, "question": "甲公司年底調整前試算表上之收入為$30,000,費用為$17,000,必須調整之事項為:預收收益已實現部分\n為$2,500、本期折舊$1,200 及已賺得但尚未入帳之收益有$2,000,則本期淨利為何?", "options": {"A": "$16,300", "B": "$12,300", "C": "$11,300", "D": "$7,300"}, "answer": "A", "note": ""}, {"id": "accounting-103-4", "year": "103", "subject": "accounting", "subjectName": "會計學概要", "number": 4, "question": "甲公司一月初業主權益$400,000,一月底業主權益$500,000,一月份收入$670,000,業主提取$30,000,\n本月業主無增資,則一月份費用為:", "options": {"A": "$740,000", "B": "$770,000", "C": "$570,000", "D": "$540,000"}, "answer": "D", "note": ""}, {"id": "accounting-103-5", "year": "103", "subject": "accounting", "subjectName": "會計學概要", "number": 5, "question": "企業有現金$30,000,應付票據$25,000,應付帳款$43,000,預收服務收入$70,000,租金支出$48,000,\n根據上述資料,該企業之負債總額應為:", "options": {"A": "$98,000", "B": "$55,000", "C": "$138,000", "D": "$68,000"}, "answer": "C", "note": ""}, {"id": "accounting-103-6", "year": "103", "subject": "accounting", "subjectName": "會計學概要", "number": 6, "question": "開立遠期本票償還積欠的貨款,會使:", "options": {"A": "負債總額不變", "B": "負債總額減少", "C": "負債總額增加", "D": "資產總額減少"}, "answer": "A", "note": ""}, {"id": "accounting-103-7", "year": "103", "subject": "accounting", "subjectName": "會計學概要", "number": 7, "question": "期初存貨少計$2,000,期末存貨多計$5,000,將使本期淨利:", "options": {"A": "多計$3,000", "B": "少計$3,000", "C": "多計$7,000", "D": "少計$7,000"}, "answer": "C", "note": ""}, {"id": "accounting-103-8", "year": "103", "subject": "accounting", "subjectName": "會計學概要", "number": 8, "question": "股票股利將使:", "options": {"A": "資產及股東權益同時減少", "B": "資產及股東權益同時增加", "C": "資產減少及股東權益增加", "D": "資產及股東權益不變"}, "answer": "D", "note": ""}, {"id": "accounting-103-9", "year": "103", "subject": "accounting", "subjectName": "會計學概要", "number": 9, "question": "收得客戶 11 月 16 日出具面額$1,000,年利率 6%,三個月到期之應收票據,在年底資產負債表上,\n應報導:", "options": {"A": "應收票據$1,015", "B": "應收票據$1,000 及應收利息$15", "C": "應收票據$1,000 及應收利息$7.5", "D": "應收票據$1,000 及應收利息$10"}, "answer": "C", "note": ""}, {"id": "accounting-103-10", "year": "103", "subject": "accounting", "subjectName": "會計學概要", "number": 10, "question": "甲公司成立於 X1 年初,近年存貨
