": {"A": "", "B": "", "C": "", "D": ""}, "answer": "A", "note": "", "paper": "105170_1302_會計學概要.pdf", "images": ["pages/105/1302-2.jpg"]}, {"id": "accounting-105-2", "year": "105", "subject": "accounting", "subjectName": "會計學概要", "number": 2, "question": "賒銷商品$200,000,付款條件 3/10、2/20、n/30,10 天內支付一半款項。其餘款項於第 22 天支付,共支\n付多少現金?", "options": {"A": "$200,000", "B": "$197,000", "C": "$195,000", "D": "$198,000"}, "answer": "B", "note": ""}, {"id": "accounting-105-3", "year": "105", "subject": "accounting", "subjectName": "會計學概要", "number": 3, "question": "下列起運點交貨之敘述何者正確?", "options": {"A": "商品所有權於送達目的地時轉移予買方,運費由賣方負擔", "B": "商品所有權於送達目的地時轉移予買方,運費由買方負擔", "C": "商品所有權於起運時轉移予買方,運費由賣方負擔", "D": "商品所有權於起運時轉移予買方,運費由買方負擔"}, "answer": "D", "note": ""}, {"id": "accounting-105-4", "year": "105", "subject": "accounting", "subjectName": "會計學概要", "number": 4, "question": "甲公司 X1 年初之存貨金額為$1,800,購貨相關之應付帳款金額為貸餘$1,500,X1 年底之存貨金額為\n$1,700,購貨相關之應付帳款金額為貸餘$1,900,且 X1 年之銷貨成本金額為$5,000。該公司 X1 年支付予\n存貨供應商之金額為:", "options": {"A": "$4,500", "B": "$4,900", "C": "$5,100", "D": "$5,400"}, "answer": "A", "note": ""}, {"id": "accounting-105-5", "year": "105", "subject": "accounting", "subjectName": "會計學概要", "number": 5, "question": "桃園公司 X6 年的原帳列稅前淨利為$350,000。會計師查核時發現期末存貨高估了$17,500,期初存貨低估\n了$12,500。試問桃園公司 X6 年正確之稅前淨利為何?", "options": {"A": "$345,000", "B": "$355,000", "C": "$320,000", "D": "$380,000"}, "answer": "C", "note": ""}, {"id": "accounting-105-6", "year": "105", "subject": "accounting", "subjectName": "會計學概要", "number": 6, "question": "屏東公司 X5 年報導期間結束日應收帳款總額$970,000,並設定應收帳款總額的 6%為其期末備抵壞帳餘\n額。X6 年中,實際沖銷壞帳$38,800。經評估,於 X6 年期末加提$34,500 為其應收帳款之備抵壞帳。試\n問 X6 年底備抵壞帳之餘額為:", "options": {"A": "$53,900", "B": "$58,200", "C": "$38,800", "D": "$19,400"}, "answer": "A", "note": ""}, {"id": "accounting-105-7", "year": "105", "subject": "accounting", "subjectName": "會計學概要", "number": 7, "question": "高雄公司於 X6 年 10 月 1 日購入一部價值$1,500,000 的機器,估計使用年限 4 年,預計總產量 10,000,000\n單位,估計殘值為$100,000,假設 X6 年共產出 600,000 單位。以直線法折舊,則 X6 年底之折舊費用為:", "options": {"A": "$90,000", "B": "$58,333", "C": "$60,000", "D": "$87,500"}, "answer": "D", "note": ""}, {"id": "accounting-105-8", "year": "105", "subject": "accounting", "subjectName": "會計學概要", "number": 8, "question": "甲公司於 X1 年初以$500,000 購入乙公司 30%股份分類為採用權益法之投資。乙公司 X1 年之本期淨利為\n$100,000,其他綜合損益為損失$200,000,X1 年並發放現金股利$10,000。若甲公司對乙公司投資之原始\n成本等於股權淨值,甲公司 X1 年該投資帳面金額之變動數為(不考慮所得稅影響):", "options": {"A": "減少$33,000", "B": "減少$30,000", "C": "增加$27,000", "D": "增加$30,000"}, "answer": "A", "note": ""}, {"id": "accounting-105-9", "year": "105", "subject": "accounting", "subjectName": "會計學概要", "number": 9, "question": "基隆公司購置機器一部,定價$500,000。廠商提供現金折扣$55,000,支付運費$30,000,運送中因超速被\n罰款$16,000。運抵廠房後另付安裝費$35,000,則該機器應有之帳面成本為:", "options": {"A": "$510,000", "B": "$526,000", "C": "$475,000", "D": "$491,000"}, "answer": "A", "note": ""}, {"id": "accounting-105-10", "year": "105", "subject": "accounting", "subjectName": "會計學概要", "number": 10, "question": "宜蘭公司於 X6 年 3 月 1 日發行面額$2,000,000,利率 8%,市場利率為 10%之 3 年期公司債,發行價格為\n$1,898,485。利息於每年 2 月 28 日及 8 月 31 日各付息一次。宜蘭公司按有效利率法攤銷公司債溢折價。\n試問該公司於 X6 年 12 月 31 日調整應認列之利息費用為多少?", "options": {"A": "$63,780", "B": "$80,000", "C": "$94,924", "D": "$14,924"}, "answer": "A", "note": ""}, {"id": "accounting-105-11", "year": "105", "subject": "accounting", "subjectName": "會計學概要", "number": 11, "question": "假設其他條件都不變的情況之下,下列何者為公司買回庫藏股時不會發生之情形?", "options": {"A": "權益總額減少", "B": "現金總額減少", "C": "公司流通在外股數減少", "D": "每股盈餘變少"}, "answer": "D", "note": ""}, {"id": "accounting-105-12", "year": "105", "subject": "accounting", "subjectName": "會計學概要", "number": 12, "question": "雲林公司 X6 年 1 月 1 日流通在外普通股 200,000 股,4 月 1 日辦理現金減資,減少流通在外普通股 20,000 股,\n5 月 1 日買回普通股 20,000 股,8 月 1 日對外發行普通股 20,000 股,並於 12 月 1 日出售庫藏股 15,000 股,\n試計算雲林公司 X6 年度普通股加權平均流通在外股數:", "options": {"A": "181,250", "B": "194,583", "C": "176,250", "D": "165,417"}, "answer": "A", "note": ""}, {"id": "accounting-105-13", "year": "105", "subject": "accounting", "subjectName": "會計學概要", "number": 13, "question": "下列何者之會計處理可能影響保留盈餘之金額?1買入庫藏股 2出售庫藏股 3買入備供出售金融資產\n4出售備供出售金融資產", "options": {"A": "僅12", "B": "僅13", "C": "僅24", "D": "1234"}, "answer": "C", "note": ""}, {"id": "accounting-105-14", "year": "105", "subject": "accounting", "subjectName": "會計學概要", "number": 14, "question": "甲公司 X1 年初之應收帳款總額$1,800,備抵壞帳為貸餘$600,X1 年底之應收帳款總額$2,100,備抵壞帳\n為貸餘$400,X1 年之壞帳損失為$100。在該公司以間接法編製之 X1 年現金流量表中,關於應收帳款項\n目對淨利之調整數共計:", "options": {"A": "減少$500", "B": "減少$400", "C": "減少$300", "D": "減少$200"}, "answer": "A", "note": ""}, {"id": "accounting-105-15", "year": "105", "subject": "accounting", "subjectName": "會計學概要", "number": 15, "question": "甲公司 X1 年底以$200,000 購入耐用年限 10 年之熔爐一座,熔爐裝有價值$4,000,按法規每 4 年即須汰\n換並重置之防火內襯。甲公司對熔爐與防火內襯均以直線法提列折舊,估計無殘值,後續衡量採成本模\n式。X3 年底法規更改為每 2 年即須汰換並重置防火內襯,故該公司以$5,000 汰換重置防火內襯。若此重\n置支出符合資本支出之條件,則此重置對該公司 X3 年淨利之影響為(不考慮所得稅):", "options": {"A": "無影響", "B": "減少淨利$2,000", "C": "減少淨利$5,000", "D": "減少淨利$7,000"}, "answer": "B", "note": ""}, {"id": "accounting-105-16", "year": "105", "subject": "accounting", "subjectName": "會計學概要", "number": 16, "question": "下列何者為應列報於綜合損益表之項目?1停業單位損益 2會計原則變動累積影響數 3財務成本 \n4非常損益", "options": {"A": "僅 13", "B": "僅 123", "C": "僅 124", "D": "1234"}, "answer": "A", "note": ""}, {"id": "accounting-105-17", "year": "105", "subject": "accounting", "subjectName": "會計學概要", "number": 17, "question": "甲公司於 X1 年初成立並發行面額$10 之普通股 80,000 股及面額$100、股利率 3%符合權益之累積特別股\n10,000 股,該公司之發行股數至 X3 年底並無變動且仍全數流通在外。若該公司 X1 年與 X3 年未宣告任\n何股利,X4 年始宣告發放現金股利$70,000,則該公司普通股股東可得之現金股利金額為:", "options": {"A": "$0", "B": "$10,000", "C": "$40,000", "D": "$70,000"}, "answer": "ABC", "note": "答A或B或C或AB或AC或BC或ABC者均給分"}, {"id": "accounting-105-18", "year": "105", "subject": "accounting", "subjectName": "會計學概要", "number": 18, "question": "承上題,甲公司 X3 年底特別股積欠股利應認列之負債金額為:", "options": {"A": "$0", "B": "$10,000", "C": "$20,000", "D": "$30,000"}, "answer": "A", "note": ""}, {"id": "accounting-105-19", "year": "105", "subject": "accounting", "subjectName": "會計學概要", "number": 19, "question": "甲公司於 X1 年底發行 100 張面額$100,000 之轉換公司債得款$10,200,000,每張公司債得於到期日前之任\n何時間轉換為 100 股甲公司普通股。經評估該公司債所含之轉換權於當日之公允價值為$400,000,且若該\n公司於當日發行相同條件但不可轉換之公司債將可得款$9,900,000。若假設無交易成本,則該公司債所含\n之轉換權 X1 年底之帳面金額為:", "options": {"A": "$200,000", "B": "$300,000", "C": "$396,117", "D": "$400,000"}, "answer": "B", "note": ""}, {"id": "accounting-105-20", "year": "105", "subject": "accounting", "subjectName": "會計學概要", "number": 20, "question": "承上題,惟每張公司債得於到期日前之任何時間轉換為價值$100,000 之甲公司普通股。若假設無交易成本,\n且經評估甲公司須將該公司債中之主契約與轉換權分離,則該公司債所含之轉換權 X1 年底之帳面金額為:", "options": {"A": "$200,000", "B": "$300,000", "C": "$396,117", "D": "$400,000"}, "answer": "D", "note": ""}, {"id": "accounting-105-21", "year": "105", "subject": "accounting", "subjectName": "會計學概要", "number": 21, "question": "甲公司於 X1 年底舉借五年期銀行借款$500,000,利率 10%,約定自 X2 年至 X6 年間每年年底向銀行支付\n$131,899 即償付所有本息。關於該筆借款,甲公司於 X2 年底應認列之長期負債金額為(答案四捨五入至元):", "options": {"A": "$500,000", "B": "$418,101", "C": "$328,012", "D": "$228,914"}, "answer": "C", "note": ""}, {"id": "accounting-105-22", "year": "105", "subject": "accounting", "subjectName": "會計學概要", "number": 22, "question": "甲公司於 X1 年底銷售一項資產並提供重要零件之保固,更換 1 個零件之成本為$1,000。經評估 1 個、2 個、\n3 個零件故障須更換之機率分別為 30%、50%、20%。關於該保固,甲公司於 X1 年底應認列之負債金額為:", "options": {"A": "$1,000", "B": "$1,900", "C": "$2,000", "D": "$3,000"}, "answer": "C", "note": ""}, {"id": "accounting-105-23", "year": "105", "subject": "accounting", "subjectName": "會計學概要", "number": 23, "question": "嘉義公司於 X6 年 4 月 1 日收到客戶開立 6 個月到期,面額為$500,000,利率為 6%之票據一紙,該公司\n於 X6 年 8 月 1 日將此票據持往銀行貼現,貼現率為 8%。其貼現收入現金之金額為?", "options": {"A": "$508,133", "B": "$504,700", "C": "$509,850", "D": "$512,425"}, "answer": "A", "note": ""}, {"id": "accounting-105-24", "year": "105", "subject": "accounting", "subjectName": "會計學概要", "number": 24, "question": "甲公司 X1 年初之設備總額$27,000,累計折舊為$3,000,X1 年底之設備總額$30,000,累計折舊為$5,000,\nX1 年之設備折舊費用為$4,000,設備處分損失為$1,000。該公司 X1 年新購設備$7,000,且所有處分與購\n置均發生於年底並以現金交割,則該公司 X1 年處分設備之現金流入為:", "options": {"A": "$1,000", "B": "$2,000", "C": "$3,000", "D": "$4,000"}, "answer": "A", "note": ""}, {"id": "accounting-105-25", "year": "105", "subject": "accounting", "subjectName": "會計學概要", "number": 25, "question": "下列何者非為流動負債之條件?", "options": {"A": "企業能無條件遞延至報導期間後至少 12 個月以上方清償之負債", "B": "企業預期於其正常營業週期中清償之負債", "C": "企業預期於報導期間後 12 個月內到期清償之負債", "D": "企業主要為交易目的而持有之負債"}, "answer": "A", "note": ""}, {"id": "bookkeeping-105-1", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 1, "question": "已充任記帳士者,依民國 105 年 11 月 9 日最新修正公布之記帳士法,下列何者構成撤銷或廢止其記帳士\n證書之法定情事?", "options": {"A": "經公立醫院證明有精神病者", "B": "因殺人罪而判刑確定者", "C": "受破產之宣告尚未復權者", "D": "受本法所定除名處分者"}, "answer": "D", "note": ""}, {"id": "bookkeeping-105-2", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 2, "question": "依記帳士法第 13 條,下列何者非記帳士在登錄區域內所得執行之業務?", "options": {"A": "受委任辦理停業、復業登記", "B": "受委任辦理稅捐稽徵案件之申報", "C": "受委任辦理稅捐之訴願", "D": "受委任辦理商業會計事務"}, "answer": "C", "note": ""}, {"id": "bookkeeping-105-3", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 3, "question": "記帳士法規定,記帳士登錄後,非加入記帳士公會,不得執行業務。關於公會之相關規定,下列何者正確?", "options": {"A": "記帳士申請加入記帳士公會時,公會享有裁量權,即便具有會員資格者,亦得拒絕其加入", "B": "一行政區域內開業記帳士未滿 30 人者,只能選擇加入鄰近區域之記帳士公會,不得聯合組織之", "C": "各級記帳士公會理事、監事任期均為 4 年", "D": "在人口較多的區域內,得報經主管機關核准,增設第二個同級之記帳士公會,以服務社會大眾"}, "answer": "C", "note": ""}, {"id": "bookkeeping-105-4", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 4, "question": "甲記帳士受申誡處分 3 次,依法應另受停止執行業務之處分。此時,對甲記帳士所為之停止執行業務處\n分,最低之期間為何?", "options": {"A": "1 個月以上", "B": "2 個月以上", "C": "3 個月以上", "D": "5 個月以上"}, "answer": "B", "note": ""}, {"id": "bookkeeping-105-5", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 5, "question": "記帳士應付懲戒者,由記帳士懲戒委員會處理之。依「記帳士懲戒委員會與懲戒覆審委員會組織及審議\n規則」之規定,記帳士懲戒委員會置委員 9 人,其中,記帳士代表應有幾人?", "options": {"A": "未規定應有記帳士代表", "B": "1 人", "C": "2 人", "D": "3 人"}, "answer": "C", "note": ""}, {"id": "bookkeeping-105-6", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 6, "question": "依記帳士法規定,記帳士有死亡、撤銷、廢止或自行申請註銷資格或其他不得執業之情形,應向那一個\n機關辦理註銷登錄?", "options": {"A": "經濟部", "B": "財政部所屬各地國稅局", "C": "各稅捐稽徵處", "D": "各縣市政府"}, "answer": "B", "note": ""}, {"id": "bookkeeping-105-7", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 7, "question": "依記帳士法規定,記帳士受委任人委任後,如須與委任人終止契約,應於幾天前通知委任人,在未得委\n任人同意前,不得終止進行?", "options": {"A": "5 天", "B": "10 天", "C": "15 天", "D": "20 天"}, "answer": "B", "note": ""}, {"id": "bookkeeping-105-8", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 8, "question": "依記帳士法規定,李君曾任臺南地方稅務機關稅務人員,自離職之日起幾年後,始可在臺南市區域內登\n錄執行記帳士業務?", "options": {"A": "1 年", "B": "2 年", "C": "3 年", "D": "4 年"}, "answer": "C", "note": ""}, {"id": "bookkeeping-105-9", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 9, "question": "依記帳士法規定,下列何者非記帳士應付懲戒之情事?", "options": {"A": "記帳士黃君因酒醉開車撞傷路人,被檢察官依過失傷人起訴,並判刑半年確定", "B": "記帳士黃君自己逃漏稅捐,經稅捐機關處分在案者", "C": "記帳士黃君幫助委託人逃漏稅捐,經移送法辦者", "D": "記帳士黃君違反記帳士公會章程之規定,情節重大者"}, "answer": "A", "note": ""}, {"id": "bookkeeping-105-10", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 10, "question": "依記帳士法規定,下列有關記帳士交付懲戒之敘述,何者錯誤?", "options": {"A": "記帳士有應付懲戒情事時,利害關係人、業務事件主管機關或記帳士公會得列舉事實,提出證據,報\n請主管機關交付懲戒", "B": "被懲戒人對於記帳士懲戒委員會之決議不服者,得於決議書送達之翌日起 10 日內,向記帳士懲戒覆審\n委員會請求覆審", "C": "記帳士懲戒委員會應將交付懲戒事件,通知被付懲戒人,並命其於通知送達之翌日起 20 日內,提出答\n辯或到會陳述;未依限提出答辯或到會陳述時,得逕行決議", "D": "記帳士懲戒委員會處理懲戒事件,認為有犯罪嫌疑者,應即移送司法機關偵辦"}, "answer": "B", "note": ""}, {"id": "bookkeeping-105-11", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 11, "question": "商業之財務報表,除有未結會計事項外,應於年度決算程序辦理終了後,至少保存幾年?", "options": {"A": "3 年", "B": "5 年", "C": "7 年", "D": "10 年"}, "answer": "D", "note": ""}, {"id": "bookkeeping-105-12", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 12, "question": "下列何種憑證為「證明處理會計事項人員之責任,而為記帳所根據之憑證」?", "options": {"A": "外來憑證", "B": "對外憑證", "C": "記帳憑證", "D": "內部憑證"}, "answer": "C", "note": ""}, {"id": "bookkeeping-105-13", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 13, "question": "各種商業均不得豁免設置之帳簿為下列何種?", "options": {"A": "普通序時帳簿", "B": "總分類帳簿", "C": "記錄成本之帳簿", "D": "特種序時帳簿"}, "answer": "B", "note": ""}, {"id": "bookkeeping-105-14", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 14, "question": "會計事項除應按發生次序逐日登帳外,至遲不得超過幾個月完成登帳?", "options": {"A": "1 個月", "B": "2 個月", "C": "2 個半月", "D": "3 個月"}, "answer": "B", "note": ""}, {"id": "bookkeeping-105-15", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 15, "question": "資產之取得,係由非貨幣性資產交換而來者,其公允價值無法可靠衡量時,依商業會計法第 42 條之規定,\n須如何處理?", "options": {"A": "應由董事會決議定之", "B": "應由股東會決議定之", "C": "須委請會計師鑑價", "D": "以換出資產之帳面金額衡量"}, "answer": "D", "note": ""}, {"id": "bookkeeping-105-16", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 16, "question": "依照現行商業會計處理準則,「避險之衍生金融資產-流動」應如何衡量?", "options": {"A": "以公允價值衡量", "B": "以攤銷後成本衡量", "C": "以帳面金額衡量", "D": "依先進先出法或平均法衡量"}, "answer": "A", "note": ""}, {"id": "bookkeeping-105-17", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 17, "question": "依照現行商業會計處理準則,商業之「應付股息紅利」應置於何一會計項目下?", "options": {"A": "透過損益按公允價值衡量之金融負債-流動", "B": "應付帳款", "C": "其他流動負債", "D": "其他應付款"}, "answer": "D", "note": ""}, {"id": "bookkeeping-105-18", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 18, "question": "財務報表內容所稱之收益,係指報導期間經濟效益之增加,依商業會計法之規定,不包含依何種方式而\n增加之收益?", "options": {"A": "資產流入", "B": "增值", "C": "業主投資", "D": "負債減少"}, "answer": "C", "note": ""}, {"id": "bookkeeping-105-19", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 19, "question": "依商業會計法第 50 條之規定,無形資產若為自行發展取得者,應如何認定其取得成本?", "options": {"A": "以登記時之成本及其後之研究發展支出作為取得成本", "B": "以創作完成時之成本及其後之研究發展支出作為取得成本", "C": "以登記或創作完成時之成本作為取得成本", "D": "以無形資產適於為營業上之使用時之成本作為取得成本"}, "answer": "C", "note": ""}, {"id": "bookkeeping-105-20", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 20, "question": "商業之支出達一定金額者,應使用匯票、本票、支票、劃撥、電匯、轉帳或其他經主管機關核定之支付\n工具或方法,並載明受款人。目前依據中央主管機關之公告,此一金額為新臺幣多少元?", "options": {"A": "50 萬元", "B": "500 萬元", "C": "100 萬元", "D": "1,000 萬元"}, "answer": "C", "note": ""}, {"id": "bookkeeping-105-21", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 21, "question": "下列何者屬於商業會計法所稱之商業?", "options": {"A": "外國公司", "B": "財團法人", "C": "事務所", "D": "工會"}, "answer": "A", "note": ""}, {"id": "bookkeeping-105-22", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 22, "question": "依商業會計法規定,有一股份有限公司章程規定「本公司主辦會計人員之任免,應經由董事會以全體董\n事出席,全體董事一致同意。」今該公司欲撤換現任主辦會計人員,應經由:", "options": {"A": "董事會以董事過半數之出席,及出席董事過半數同意之決議", "B": "董事會以全體董事出席,及出席全體董事一致同意之決議", "C": "董事會以全體董事出席,及出席全體董事過半數同意之決議", "D": "董事會以董事過半數之出席,及出席董事一致同意之決議"}, "answer": "B", "note": ""}, {"id": "bookkeeping-105-23", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 23, "question": "依商業會計法規定,關於商業記帳本位與記帳文字之規定,下列何者錯誤?", "options": {"A": "商業應以國幣為記帳本位", "B": "商業因業務需要,財務報表得以新臺幣外幣併列方式編製", "C": "商業不得以外幣記帳", "D": "商業會計之記載,除記帳數字適用阿拉伯字外,應以我國文字為之"}, "answer": "C", "note": ""}, {"id": "bookkeeping-105-24", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 24, "question": "商業負責人應於會計年度終了後至遲多久的時間內,將商業之決算報表提請商業出資人、合夥人或股東\n承認,始符合商業會計法之規定?", "options": {"A": "2 個月內", "B": "3 個月內", "C": "5 個月內", "D": "6 個月內"}, "answer": "D", "note": ""}, {"id": "bookkeeping-105-25", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 25, "question": "依商業會計法規定,商業負責人及主辦會計人員,將以不正行為製作之商業決算報表,提請商業出資人、\n合夥人或股東獲得承認後,是否就解除其該年度會計上之責任?", "options": {"A": "不可以", "B": "可以", "C": "由法院決定", "D": "由主管機關決定"}, "answer": "A", "note": ""}, {"id": "bookkeeping-105-26", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 26, "question": "依商業會計法規定,商業會計事務較簡或原始憑證已符合記帳需要者,得不另製記帳憑證,而以下列何\n者作為記帳憑證?", "options": {"A": "收入傳票", "B": "支出傳票", "C": "原始憑證", "D": "會計憑證"}, "answer": "C", "note": ""}, {"id": "bookkeeping-105-27", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 27, "question": "依商業會計法規定,強制適用商業會計法之商業,其商業會計事務之處理,應置會計人員辦理之,違反\n者應處罰商業負責人:", "options": {"A": "新臺幣 3 萬元以上罰金", "B": "新臺幣 15 萬元以下罰金", "C": "新臺幣 3 萬元以上 15 萬元以下罰鍰", "D": "新臺幣 5 萬元以上 15 萬元以下罰鍰"}, "answer": "C", "note": ""}, {"id": "bookkeeping-105-28", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 28, "question": "依商業會計法規定,一公司資本額為新臺幣 3,000 萬元,設籍新北市,其會計事務之主管機關為:", "options": {"A": "新北市稅捐處", "B": "新北市政府", "C": "經濟部", "D": "財政部北區國稅局"}, "answer": "B", "note": ""}, {"id": "bookkeeping-105-29", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 29, "question": "民國 103 年修正商業會計法時,考量到導入國際會計準則,商業之決算作業可能更為繁複,故放寬決算\n期限,依照規定,若商業無法在原定期限內完成決算,必要時得延長多久?", "options": {"A": "2 個半月", "B": "3 個半月", "C": "4 個半月", "D": "5 個半月"}, "answer": "A", "note": ""}, {"id": "bookkeeping-105-30", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 30, "question": "所謂的商譽,依現行商業會計處理準則之規定,將之限定於產生自下列何種情形?", "options": {"A": "品牌長年累積之知名度", "B": "營業讓與", "C": "合併", "D": "分割"}, "answer": "C", "note": ""}, {"id": "bookkeeping-105-31", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 31, "question": "依商業會計法規定,其中「代表商業負責人」在有限公司係指:", "options": {"A": "董事", "B": "監察人", "C": "董事長", "D": "清算人"}, "answer": "ACD", "note": "答A或C或D或AC或AD或CD或ACD者均給分"}, {"id": "bookkeeping-105-32", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 32, "question": "下列何種情事發生時,商業負責人得令經辦及主管該事項之人員,分別或共同證明其會計事項?", "options": {"A": "無法取得原始憑證", "B": "原始憑證因事實上限制無法取得", "C": "原始憑證因意外事故缺少", "D": "原始憑證因意外事故毀損"}, "answer": "A", "note": ""}, {"id": "bookkeeping-105-33", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 33, "question": "會計人員離職或變更職務時,依法至遲應於幾日內辦理交代?", "options": {"A": "3 日", "B": "5 日", "C": "10 日", "D": "15 日"}, "answer": "B", "note": ""}, {"id": "bookkeeping-105-34", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 34, "question": "依行政程序法規定,違法行政處分於法定救濟期間經過後,原處分機關或其上級機關得依職權為全部或\n一部之撤銷。而該撤銷應自原處分機關或其上級機關知有撤銷原因時起幾年內為之?", "options": {"A": "1 年內", "B": "2 年內", "C": "3 年內", "D": "5 年內"}, "answer": "B", "note": ""}, {"id": "bookkeeping-105-35", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 35, "question": "依據行政程序法,處分機關未告知救濟期間或告知錯誤未為更正,致相對人或利害關係人遲誤者,如自\n處分書送達後多久時間內聲明不服時,視為於法定期間內所為?", "options": {"A": "3 個月", "B": "6 個月", "C": "1 年", "D": "3 年"}, "answer": "C", "note": ""}, {"id": "bookkeeping-105-36", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 36, "question": "依據民國 104 年新修正之行政程序法,授予利益之行政處分,其內容係提供一次或連續之金錢或可分物\n之給付者,經撤銷、廢止或條件成就而有溯及既往失效之情形時,下列敘述何者錯誤?", "options": {"A": "受益人應返還因該處分所受領之給付", "B": "受益人應返還範圍準用民法有關不當得利之規定", "C": "行政機關依規定請求返還時,應以書面行政處分確認返還範圍,並限期命受益人返還之", "D": "行政機關作成請求返還之行政處分時,應同時移送行政執行"}, "answer": "D", "note": ""}, {"id": "bookkeeping-105-37", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 37, "question": "依行政程序法規定,有關行政處分時,得為附款之敘述,下列何者錯誤?", "options": {"A": "附款保留未來行政處分之廢止權", "B": "附款保留行政機關於行政處分後保留事後附加、變更或補充負擔之權限", "C": "行政機關不論有裁量權(裁量處分)或無裁量權(羈束處分)於作成行政處分時,皆無條件得為附款", "D": "附款不得違背行政處分之目的,並應與該行政處分之目的具有正當合理之關聯"}, "answer": "C", "note": ""}, {"id": "bookkeeping-105-38", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 38, "question": "依行政程序法規定,不服行政程序法第 108 條聽證程序作成之行政處分者,其行政救濟程序為下列何者?", "options": {"A": "聲請復查", "B": "聲請異議", "C": "行政訴願", "D": "逕提行政訴訟"}, "answer": "D", "note": ""}, {"id": "bookkeeping-105-39", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 39, "question": "依公司法規定,外國公司欲在中華民國境內營業,必須先辦理認許,並於認許後 15 日內,向主管機關再\n辦理下列何者之登記?", "options": {"A": "在臺代表處設立登記", "B": "子公司設立登記", "C": "分公司設立登記", "D": "在臺辦公室設立登記"}, "answer": "C", "note": ""}, {"id": "bookkeeping-105-40", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 40, "question": "依公司法規定,自然人一人即可設立之公司為下列何種公司?", "options": {"A": "無限公司", "B": "有限公司", "C": "兩合公司", "D": "股份有限公司"}, "answer": "B", "note": ""}, {"id": "bookkeeping-105-41", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 41, "question": "公司應收之股款,股東並未實際繳納,而以申請文件表明收足,或股東雖已繳納而於登記後將股款發還\n股東,或任由股東收回者,為資本不實,公司法對此設有相關之規範,惟不包括下列何者?", "options": {"A": "對於公司負責人可處刑責", "B": "公司負責人應與各該股東連帶賠償公司或第三人因此所受之損害", "C": "資本不實之裁判確定後,由檢察機關通知中央主管機關撤銷或廢止其登記", "D": "於資本不實之裁判確定後、撤銷或廢止登記前已為補正者,主管機關不得撤銷或廢止其登記"}, "answer": "D", "note": ""}, {"id": "bookkeeping-105-42", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 42, "question": "A 股份有限公司(下稱 A 公司)設立後選任甲為總經理,惟未向主管機關辦理登記,後甲因違反競業禁\n止而遭董事會撤換,改選為乙,向主管機關登記時卻登記為甲。請問下列敘述何者正確?", "options": {"A": "甲雖經 A 公司選任,惟未經登記,無法取得適法之總經理資格", "B": "經理人選任後雖須登記,惟登記僅為對抗效力,甲於選任後雖未辦理登記,惟仍無礙其取得總經理之資格", "C": "總經理之改選屬於股東會之權限,不得由董事會將之撤換", "D": "A 公司雖將總經理改選為乙,然登記為甲,登記之效力優先,甲仍為 A 公司合法之總經理"}, "answer": "B", "note": ""}, {"id": "bookkeeping-105-43", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 43, "question": "依公司法規定,公司每屆會計年度終了,應將下列何文件提請股東同意或股東常會承認?1營業報告書\n2財務報表 3主要財產之財產目錄 4盈餘分派或虧損撥補之議案", "options": {"A": "123", "B": "124", "C": "134", "D": "234"}, "answer": "B", "note": ""}, {"id": "bookkeeping-105-44", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 44, "question": "公司之下列登記事項,何者目前仍無法在主管機關之資訊網站查閱?", "options": {"A": "所營事業", "B": "董事、監察人姓名及持股", "C": "公司章程", "D": "資本總額或實收資本額"}, "answer": "C", "note": ""}, {"id": "bookkeeping-105-45", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 45, "question": "依據記帳士職業倫理道德規範,共列舉數項記帳士應遵守之行為準則,下列何者非屬之?", "options": {"A": "廉潔", "B": "務實", "C": "保密", "D": "適任"}, "answer": "A", "note": ""}, {"id": "bookkeeping-105-46", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 46, "question": "關於記帳士職業倫理道德規範之內容,下列敘述何者錯誤?", "options": {"A": "記帳士依記帳士法受委任協助納稅義務人完納稅捐及做為徵納雙方溝通之橋樑", "B": "記帳士職業倫理道德規範適用於提供記帳士服務之個人及個體", "C": "記帳士職業倫理道德規範並非法律,僅寄望會員以榮譽心自律,對於違反者並無任何處理機制", "D": "記帳士應持續進修以維持記帳士專業能力及服務之效果與品質"}, "answer": "C", "note": ""}, {"id": "bookkeeping-105-47", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 47, "question": "依商業登記法規定,法定代理人為無行為能力人或限制行為能力人經營已登記之商業者,則法定代理人\n為商業負責人,應於幾日內申請登記,登記時應加具法定代理人證明文件?", "options": {"A": "10 日內", "B": "15 日內", "C": "20 日內", "D": "30 日內"}, "answer": "B", "note": ""}, {"id": "bookkeeping-105-48", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 48, "question": "依商業登記法規定,A 彩券行(獨資)獲財政部許可經營銷售公益彩券,因違法經營地下六合彩被財政\n部勒令歇業,財政部應通知下列何機關撤銷或廢止其商業登記或部分登記事項?", "options": {"A": "目的事業中央主管機關", "B": "金融監督管理委員會", "C": "商業所在地之主管機關", "D": "商業所在地之法院"}, "answer": "C", "note": ""}, {"id": "bookkeeping-105-49", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 49, "question": "依商業登記法規定,下列何者錯誤?", "options": {"A": "同一地址不得登記二家以上商業", "B": "商業開業前,應將負責人之姓名、住、居所、身分證明文件字號及出資額申請登記", "C": "商業開業前,應將資本額申請登記", "D": "商業登記並無最低資本額規定之限制"}, "answer": "A", "note": ""}, {"id": "bookkeeping-105-50", "year": "105", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 50, "question": "依記帳士職業倫理道德規範,李君記帳士對於委任人委辦事項,應遵守保密原則,但下列何情事除外?", "options": {"A": "經委任人授權或依法律與專業義務規定者", "B": "報請國稅局核准者", "C": "報請財政部核准者", "D": "報請記帳士公會核准者"}, "answer": "A", "note": ""}, {"id": "chinese-105-1", "year": "105", "subject": "chinese", "subjectName": "國文", "number": 1, "question": "司馬光〈訓儉示康〉:「會數而禮勤,物薄而情厚。」其中「薄」字詞性的用法與下列何者相同?", "options": {"A": "省刑罰,「薄」稅斂", "B": "門衰祚「薄」,晚有兒息", "C": "日「薄」西山,氣息奄奄", "D": "不宜妄自菲「薄」,引喻失義"}, "answer": "B", "note": ""}, {"id": "chinese-105-2", "year": "105", "subject": "chinese", "subjectName": "國文", "number": 2, "question": "下列文句沒有錯別字的是:", "options": {"A": "他做事認真,却常遭同事摯肘,所以難展長才", "B": "訂定租貸契約,才能保障房東與房客雙方的權益", "C": "違法亂紀者,最終難逃法網制裁,以致身陷伶圄", "D": "國事蜩螗,外交失敗,內政不修,國家已岌岌可危"}, "answer": "D", "note": ""}, {"id": "chinese-105-3", "year": "105", "subject": "chinese", "subjectName": "國文", "number": 3, "question": "下列選項中的「歇後語」,何者對應不適當?", "options": {"A": "瞎子吃水餃─有苦難言", "B": "糞缸裏的石頭—又臭又硬", "C": "抓著苦膽解渴─自討苦吃", "D": "老壽星吃砒霜—活得不耐煩"}, "answer": "A", "note": ""}, {"id": "chinese-105-4", "year": "105", "subject": "chinese", "subjectName": "國文", "number": 4, "question": "下列有關書信的用語,何者正確?", "options": {"A": "對他人稱自己的母親用「令堂」", "B": "學生寫信給老師,自稱「授業」", "C": "信封寫受信人姓名、稱呼及「拜啟」,以示禮敬", "D": "寫信給父母親,結尾的問候語可用「叩請 福安」"}, "answer": "D", "note": ""}, {"id": "chinese-105-5", "year": "105", "subject": "chinese", "subjectName": "國文", "number": 5, "question": "「碧玉妝成一樹高,萬條垂下綠絲縧。不知細葉誰裁出?二月春風似剪刀。」詩中所詠之物是:", "options": {"A": "榕鬚", "B": "松樹", "C": "蔦蘿", "D": "柳樹"}, "answer": "D", "note": ""}, {"id": "chinese-105-6", "year": "105", "subject": "chinese", "subjectName": "國文", "number": 6, "question": "洛夫寫於 1985 年的〈剔牙〉詩句如下:「中午/全世界的人都在剔牙/以潔白的牙籤/安詳地在/剔他\n們/潔白的牙齒 衣索匹亞的一群兀鷹/從一堆屍體中/飛起/排排蹲在/疏朗的枯樹上/也在剔牙/\n以一根根瘦小的/肋骨。」下列何者與詩的第二段「衣索匹亞的一群兀鷹」意涵無關?", "options": {"A": "死亡", "B": "恐怖", "C": "饑餓", "D": "慌亂\n60210"}, "answer": "D", "note": ""}, {"id": "chinese-105-7", "year": "105", "subject": "chinese", "subjectName": "國文", "number": 7, "question": "鄭板橋詩:「紙花如雪滿天飛,嬌女鞦韆打四圍。五色羅裙風擺動,好將蝴蝶鬭春歸。」郭麟吟詩:\n「一百四日小寒食,冶遊爭上白浪河。紙鳶兒子鞦韆女,亂比新來春燕多。」二詩中所描寫的童玩是:", "options": {"A": "毽子", "B": "風箏", "C": "風車", "D": "燈籠"}, "answer": "B", "note": ""}, {"id": "chinese-105-8", "year": "105", "subject": "chinese", "subjectName": "國文", "number": 8, "question": "吳健雄是二十世紀傑出的女物理學家,曾經參與研發原子彈的曼哈頓計畫。她少年時代親受胡適指導,\n在她即將赴美留學時,胡適給她的教誨是:「凡治學問,功力之外,還需要天才。龜兔之喻,是勉勵中\n人以下之語,也是警惕天才之語,有兔子的天才,加上烏龜的功力,定可無敵於一世。僅有功力,可無\n大過,而未必有大成功。你是很聰明的人,千萬珍重自愛,將來成就未可限量。這還不是我要對你說的\n話。我要對你說的是希望你能利用你的海外住留期間,多留意此邦文物,多讀文史的書,多讀其他科學,\n使胸襟闊大,使見解高明......做一個博學的人......凡第一流的科學家,都是極淵博的人,取精而用弘,\n由博而反約,故能有大成功。」(摘自江才健《吳健雄—物理科學的第一夫人》)\n依上文,胡適最重視的是:", "options": {"A": "應善用自己的天賦,再加上勤勞,必定可以成就一番事業", "B": "作為一流的科學家,除了聰明與努力之外,還要懂得潔身自愛", "C": "能夠到海外求學,吸取外邦的經驗與新知,是成就大事業之所必須", "D": "專精的能力固然重要,但是廣泛閱讀、關注文化及開拓視野也很重要"}, "answer": "D", "note": ""}, {"id": "chinese-105-9", "year": "105", "subject": "chinese", "subjectName": "國文", "number": 9, "question": "林語堂〈說避暑之益〉:「除非現代文明能夠給人人一塊宅地,讓小孩去翻筋斗捉蟋蟀弄得一身骯髒痛\n快,那種文明不會被我重視。我說明所以搬去那所樓層的緣故,是因那房後面有一片荒園,有橫倒的樹\n幹,有碧綠的池塘」,其所謂之「文明」,最重要的特質為何?", "options": {"A": "不與自然隔絕", "B": "居者皆有其屋", "C": "肯定遊戲需求", "D": "重視兒童權益"}, "answer": "A", "note": ""}, {"id": "chinese-105-10", "year": "105", "subject": "chinese", "subjectName": "國文", "number": 10, "question": "「在同一條街上有荷蘭西班牙日本中國建築是正常的,清一色的單調建築違反歷史法則─我們的城鎮歌\n聲喑啞,沒有旋律沒有變化;在舊社區中有新社區,四合院農田鄰接麥當勞也是正常的,只見新人笑不\n見舊人哭,這也是違反人情法則─我們的城鎮荒腔走板,沒有歷史沒有記憶。讓城鎮唱出它們的歌,古\n調今調皆宜,牧歌搖滾兼容並蓄。那將是多麼盛大悅耳!」(周芬伶〈城鎮在唱歌〉)\n上述內容,作者欲表達的是:", "options": {"A": "我們的城鎮「盛大悅耳」,是因為常在同一條街上有荷蘭西班牙日本中國建築", "B": "我們的城鎮「無古建築」,是因為不知歷史記憶的重要性,以為清一色新才是新", "C": "我們的城鎮「歌聲喑啞,沒有旋律沒有變化」,是在倡議讓樂音飄揚於街頭巷尾", "D": "我們的城鎮「荒腔走板,沒有歷史沒有記憶」,是在抨擊貴古賤今的陳腐思想\n60210"}, "answer": "B", "note": ""}, {"id": "chinese-105-11", "year": "105", "subject": "chinese", "subjectName": "國文", "number": 11, "question": "「想想,六嬸自工地返家天已昏暝,她一臉塵灰一身土泥,幾雙嗷嗷待哺眼睛張望著她,她所思慮的是如\n何在最短時間內張羅出一頓可以填飽肚子的食物,而非精心烹調,所以桌上總有幾樣罐頭食品:罐頭菜心\n罐頭脆瓜罐頭燒鰻或是罐頭三文魚,滷蛋炒蛋荷包蛋變換著,炒空心菜炒花椰菜炒高麗菜,滷肉,黃昏市\n場買來的切豆乾滷海帶,幾個孩子把一碗菜夾得山尖,坐到電視機前盯著《無敵鐵金剛》、《海王子》看\n得忘了扒飯。\n而一早同六嬸一起上工的男人返家後,可能先沖熱水澡,有熱騰騰菜肴等在餐桌,飯後踅到附近柑仔店啜飲\n米酒嚼花生米閒嗑牙......冬天到了,樹木落光了葉子減少養分損失,僅留著枝幹看似蕭條,其實它的打算不\n在目前,而在來春。六嬸總說,你們好好讀冊,看後擺日子能不能好過一點。」(王盛弘〈清糜〉)\n下列敘述,何者不符合上文意旨?", "options": {"A": "女性在家庭經濟的需求下也需外出工作", "B": "側面寫出男性與女性在家庭中的勞務分工之不均", "C": "現代罐頭食品出現在餐桌,侵蝕了婦女對食物的支配權", "D": "婦女除了出外勞動外,回到家常常超時進行家務工作"}, "answer": "C", "note": ""}, {"id": "chinese-105-12", "year": "105", "subject": "chinese", "subjectName": "國文", "number": 12, "question": "國民信託在國外已行之有年,成果豐碩。這項運動源自英國,1895 年由律師、牧師加上女性社會改革人\n士的三人小組共同發起。他們認為,具歷史價值或自然美景的地區應歸全民共有,一人一元的萬人力量,\n大於一人萬元的一萬倍!至今,英國國民信託機構名下的土地面積占全國 2.7%,已是民間最大「地主」。\n緣此,以《彼得兔》(The Tale of Peter Rabbit)聞名全球的英國作家波特(Beatrix Potter)的湖區房舍至\n今原封不動保存完善;搖滾團體披頭四(Beatles)故居,經典老歌依然傳唱。日本動畫導演宮崎駿,擔\n任龍貓兒童信託基金董事長,集資近四億日圓買下 11 片森林;更在 2010 年 1 月買下琦玉縣峽山地區,\n也就是他親自執導、轟動全球的早年名作動畫主角龍貓的故鄉。\n依據報導內容,下列敘述何者錯誤?", "options": {"A": "披頭四故居因國民信託得以保存", "B": "龍貓動畫因國民信託資金,終得完製上映", "C": "公民加入信託行列,是管理公共財的一種方式", "D": "保存歷史、自然等珍貴文物,是每個人都能盡力的"}, "answer": "B", "note": ""}, {"id": "chinese-105-13", "year": "105", "subject": "chinese", "subjectName": "國文", "number": 13, "question": "余以採硫來居臺郡兩月,為購布,購油,購糖,鑄大鑊,冶刀斧、鋤、杓,規大小木桶,製秤、尺、斗、\n斛,種種畢備。布以給番人易硫土;油與大鑊,所以煉硫;糖給工匠頻飲并浴體,以辟硫毒;鋤平土築\n基;刀斧伐薪薙草;杓出硫於鑊;小桶凝硫,大桶貯水;秤、尺、斗、斛,以衡量諸物。又購脫粟、鹽\n豉、筐、釜、碗、箸等,率為百人具,計費九百八十金,買一巨舶載之。入資什七,覺舟重不任載,心\n竊疑焉。遂止弗入,更買一舶,為載所餘,費半前舶。或曰:「舟有大小,受載有量,今頗未盡量,何\n徒費為?」余曰:「吾忽心動,方欲使兩舶中分之,匪直載所餘也。」言者匿笑去。(節選自:郁永河\n《裨海紀遊‧卷中》)\n依照郁永河自述,其既已「買一巨舶載之」。而後,「更買一舶」的原因為何?", "options": {"A": "言者匿笑,不堪其擾", "B": "舟量所限,僅入資什七", "C": "忽然心動,覺舟重不任載", "D": "為辟硫毒,與番人分乘二舟"}, "answer": "C", "note": ""}, {"id": "chinese-105-14", "year": "105", "subject": "chinese", "subjectName": "國文", "number": 14, "question": "衛人嫁其子而教之曰:「必私積聚。為人婦而出,常也;其成居,幸也。」其子因私積聚,其姑以為多私而\n出之。其子所以反者,倍其所以嫁。其父不自罪於教子非也,而自知其益富。今人臣之處官者,皆是類也。\n根據本文,作者認為當時為官者所抱持的態度大多是:", "options": {"A": "自私自利", "B": "公器私用", "C": "未雨綢繆", "D": "騎驢找馬\n60210"}, "answer": "A", "note": ""}, {"id": "chinese-105-15", "year": "105", "subject": "chinese", "subjectName": "國文", "number": 15, "question": "王公淵娶諸葛誕女,入室,言語始交,王謂婦曰:「新婦神色卑下,殊不似公休!」婦曰:「大丈夫不\n能仿佛彥雲,而令婦人比蹤英傑!」(《世說新語‧賢媛》)諸葛誕女面對王公淵的嫌棄,態度如何?", "options": {"A": "反唇相稽", "B": "謙卑自持", "C": "侃侃而談", "D": "無言以對"}, "answer": "A", "note": ""}, {"id": "chinese-105-16", "year": "105", "subject": "chinese", "subjectName": "國文", "number": 16, "question": "《荀子‧勸學》:「騏驥一躍,不能十步;駑馬十駕,功在不舍」,強調修身與為學須勤勉不懈,則將\n日起有功。下列那一選項與此意旨不同?", "options": {"A": "道雖邇,不行不至;事雖小,不為不成", "B": "故蹞步而不休,跛鼈千里;累土而不輟,丘山崇成", "C": "故不積蹞步,無以至千里;不積小流,無以成江海", "D": "登高而招,臂非加長也,而見者遠;順風而呼,聲非加疾也,而聞者彰"}, "answer": "D", "note": ""}, {"id": "chinese-105-17", "year": "105", "subject": "chinese", "subjectName": "國文", "number": 17, "question": "王鍔累任大鎮,財貨山積,有舊客誡鍔以積而能散之義。後數日,客復見鍔,鍔曰:「前所見教,誠如公\n言,已大散矣。」客曰:「請問其目。」鍔曰:「諸男各與萬貫,女婿各與千貫矣。」(李肇《國史補》)\n根據上文,可知王鍔此人具有怎樣的特質:", "options": {"A": "奢侈浮華", "B": "從善如流", "C": "樂善好施", "D": "貪財好貨"}, "answer": "D", "note": ""}, {"id": "chinese-105-18", "year": "105", "subject": "chinese", "subjectName": "國文", "number": 18, "question": "余書齋中有玉燕兩對,異產也,比雀小些,色白如雪。破曉時吟聲清喨,與雞鳴相和,娓娓動人。弟侄\n輩酷嗜,有如拱璧。雕漆其籠,夜罩以羅帳,朝飼以豆漿,夕飼以蛋麵,三日為之沐浴毛羽,糞除其雕\n籠焉。予以為一鳥之故,而旦暮勞人,況鳥久羈於此,必大拂其性,曷若放之,使各遂其生乎。爰令人\n放之。初止於屋角,繼之於庭樹,唶唶啾啾,回顧睨視,徘徊而不遽去。(吳德功〈放鳥〉)\n作者將玉燕釋放的原因:", "options": {"A": "生活忙碌,沒有心情養鳥", "B": "飼養很麻煩,而且違背鳥的本性", "C": "玉燕的叫聲動聽,擔心弟侄輩玩物喪志", "D": "無法忍受玉燕早晚的叫聲,怕長期如此,會讓自己的性情大變\n請依下文回答第 19 題至第 20 題:\n「手工割稻是件辛苦的事,頂著烈日又更辛苦。機器桶(脫穀機)在返家幫農的子弟兵通力下,吃力地拖動著,\n這時候卻總有攝影者喊卡、慢一點;阿伯一肩 40 斤,雙肩 80 斤地扛著穀,總有攝影者吆喝:再走一遍、退後\n一點。來幫忙的國中學生與國小老師,被指揮著要怎麼捧稻穗,往左邊靠一點!助割的我們加入鏡頭,這些穿\n著整齊的大砲要求:可以戴上斗笠嗎?眾人離去,埂上未打的穀子落了一地,阿伯默默地拾起......。到底憑什\n麼?農人不是道具!請不要踩在別人家的田埂上還頤指氣使!可以理解梯田的美,讓人忍不住留下影像;可以\n體會傳統割稻的特殊,讓人想留下紀錄。但,勞動者的尊嚴,不因產業的特殊或稀有而增減,這不是為別人而\n做的表演,也不是展示館裡的標本。工作時的尊嚴,與對農產及私有地的維護,都是單純想靠自己掙口飯的農\n戶該擁有的權利,請您一起尊重。」(〈水梯田!貢寮山村的故事〉)"}, "answer": "B", "note": ""}, {"id": "chinese-105-19", "year": "105", "subject": "chinese", "subjectName": "國文", "number": 19, "question": "「請不要踩在別人家的田埂上還頤指氣使!」意在反對:", "options": {"A": "喧賓奪主", "B": "沆瀣一氣", "C": "財大氣粗", "D": "盛氣凌人"}, "answer": "A", "note": ""}, {"id": "chinese-105-20", "year": "105", "subject": "chinese", "subjectName": "國文", "number": 20, "question": "作者在這段文字中,最主要是在強調:", "options": {"A": "人人各司其職方有祥和的社會", "B": "眾志成城始有一張美麗的照片", "C": "滿足自己的同時必須尊重別人", "D": "刻意求工無法成就真正的藝術"}, "answer": "C", "note": ""}, {"id": "tax-105-1", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 1, "question": "依稅捐稽徵法規定,下列那種稅捐優先於一切債權及抵押權受償?", "options": {"A": "所得稅", "B": "遺產稅", "C": "貨物稅", "D": "房屋稅"}, "answer": "D", "note": ""}, {"id": "tax-105-2", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 2, "question": "依稅捐稽徵法規定,財政部臺北國稅局應退納稅義務人之綜合所得稅,若該納稅義務人有下列之積欠,\n何者應優先抵繳?", "options": {"A": "財政部臺北國稅局綜合所得稅之罰鍰", "B": "財政部臺北國稅局贈與稅之欠稅", "C": "財政部北區國稅局遺產稅之欠稅", "D": "臺北市稅捐稽徵處地價稅之欠稅"}, "answer": "A", "note": ""}, {"id": "tax-105-3", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 3, "question": "甲公司有 A、B 兩筆房屋,其中 A 房屋有銀行貸款、積欠地價稅;B 房屋欠繳房屋稅與地價稅,且該公\n司尚積欠以前年度營利事業所得稅未繳。後因經營不善,導致 A 房屋被法院拍賣,若拍定價小於 A 房屋\n銀行抵押債權,試問下列敘述何者正確?", "options": {"A": "A 房屋的地價稅、拍賣產生的土地增值稅與營業稅、B 房屋的地價稅、房屋稅須優先抵押債權受償", "B": "A 房屋的地價稅、拍賣產生的土地增值稅與營業稅、甲公司營利事業所得稅須優先抵押債權受償", "C": "A 房屋的地價稅、拍賣產生的土地增值稅、營業稅須優先抵押債權受償", "D": "租稅課徵只優先普通債權,不得優先抵押債權,所以抵押債權最優先受償"}, "answer": "C", "note": ""}, {"id": "tax-105-4", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 4, "question": "下列有關稅捐稽徵法之敘述何者錯誤?", "options": {"A": "財政部依本法或稅法所發布之解釋函令,對於據以申請之案件發生效力。但有利於納稅義務人者,對\n於尚未核課確定之案件適用之", "B": "財政部發布解釋函令,變更已發布解釋函令之法令見解,如不利於納稅義務人者,自發布日起或財政\n部指定之將來一定期日起,發生效力", "C": "財政部發布之稅務違章案件裁罰金額或倍數參考表變更時,有利於納稅義務人者,對於尚未核課確定\n之案件適用之", "D": "財政部發布解釋函令,變更已發布解釋函令之法令見解,如不利於納稅義務人者,於發布日或財政部\n指定之將來一定期日前,應核課而未核課之稅捐及未確定案件才能適用該變更後之解釋函令"}, "answer": "D", "note": ""}, {"id": "tax-105-5", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 5, "question": "依稅捐稽徵法規定,下列有關退稅規定之敘述何者正確?", "options": {"A": "納稅義務人自行適用法令錯誤或計算錯誤溢繳之稅款,得自繳納之日起 5 年內提出具體證明,申請退還;屆\n期未申請者,不得再行申請", "B": "納稅義務人因稅捐稽徵機關適用法令錯誤、計算錯誤或其他可歸責於政府機關之錯誤,致溢繳稅款者,稅捐\n稽徵機關應自知有錯誤原因之日起 2 年內查明退還,其退還之稅款以 10 年內溢繳者為限", "C": "溢繳之稅款,納稅義務人以現金繳納者,應自其繳納該項稅款之日起,至填發收入退還書或國庫支票之日止,\n按溢繳之稅額,依各年度 1 月 1 日郵政儲金一年期定期儲金固定利率,按日加計利息,一併退還", "D": "納稅義務人應退之稅捐,稅捐稽徵機關不得再藉故扣抵納稅義務人其他積欠之稅捐,應立即退還納稅義務人"}, "answer": "A", "note": ""}, {"id": "tax-105-6", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 6, "question": "個人出售於民國 105 年 1 月 1 日以後取得之房地產,有關綜合所得稅的課徵,下列何者錯誤?", "options": {"A": "課稅所得之計算,得減除當次交易依土地稅法規定計算之土地漲價總數額", "B": "課稅所得之計算,得減除當次交易依土地稅法規定繳納之土地增值稅", "C": "課稅所得不併計綜合所得總額", "D": "不論有無應納稅額,應於完成所有權移轉登記之次日起 30 日內,填具申報書向稽徵機關辦理申報"}, "answer": "B", "note": ""}, {"id": "tax-105-7", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 7, "question": "依相關稅法規定,於綜合所得稅計算課徵時,下列那項金額的變動不適用物價指數連動法?", "options": {"A": "免稅額", "B": "標準扣除額", "C": "教育學費特別扣除額", "D": "身心障礙特別扣除額"}, "answer": "C", "note": ""}, {"id": "tax-105-8", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 8, "question": "依綜合所得稅計算課徵規定,下列那項僅限發生於納稅義務人之受扶養直系親屬時,才准許減除?", "options": {"A": "免稅額", "B": "列舉扣除之捐贈", "C": "列舉扣除之保險費", "D": "列舉扣除之醫藥費"}, "answer": "C", "note": ""}, {"id": "tax-105-9", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 9, "question": "依相關稅法規定,中華民國境內居住之個人股東的可扣抵稅額如何計算?", "options": {"A": "股利淨額 × 稅額扣抵比率", "B": "股利淨額 × 稅額扣抵比率 × 百分之十", "C": "股利淨額 × 稅額扣抵比率 × 百分之二十", "D": "股利淨額 × 稅額扣抵比率 × 百分之五十"}, "answer": "D", "note": ""}, {"id": "tax-105-10", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 10, "question": "依相關稅法規定,教育、文化、公益、慈善機關或團體,投資於國內其他營利事業,獲配 104 年之股利\n淨額以及可扣抵稅額,於申報 105 年營利事業所得稅時如何處理?", "options": {"A": "股利淨額計入所得額,可扣抵稅額得扣抵應納稅額", "B": "股利淨額不計入所得額,可扣抵稅額得扣抵應納稅額", "C": "股利淨額計入所得額,可扣抵稅額不得扣抵應納稅額", "D": "股利淨額不計入所得額,可扣抵稅額不得扣抵應納稅額"}, "answer": "D", "note": ""}, {"id": "tax-105-11", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 11, "question": "依所得稅法及其相關法規規定,下列有關所得稅法居住者之定義何者正確?", "options": {"A": "陳董為中華民國國民,在我國境內設有戶籍。生活重心在境內,若陳董一年在臺停留合計未滿 31 天,\n則非為我國境內居住者", "B": "王先生有中華民國國籍,長年住在國外,生活重心在境外,但因某些因素在我國境內仍設有戶籍,若\n王先生一年在臺停留合計滿 31 天,則視為我國境內居住者", "C": "約翰屬於美國籍公民,雖因工作因素一年在臺居留合計滿 183 天,仍不會被視為我國居住者", "D": "張先生為華僑,擁有雙重國籍,但長年居住在外,在我國並無戶籍,若張先生一年合計在臺停留超過\n183 天,則張先生在我國境內與大陸地區取得之所得應合併課徵綜合所得稅,辦理結算申報"}, "answer": "B", "note": ""}, {"id": "tax-105-12", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 12, "question": "林先生為中華民國境內居住者,民國 103 年 12 月 20 日登記買進 A 房地一筆、後於民國 105 年 10 月 5 日\n賣出,試問下列有關申報該筆房地交易所得之敘述何者正確?", "options": {"A": "林先生於民國 105 年 1 月 1 日以前買入房地,不適用房地合一課稅制度", "B": "林先生應計算售屋之財產交易所得,併計綜合所得總額課稅", "C": "林先生應於房屋、土地完成所有權移轉登記日之次日起算 30 日內自行填具申報書,檢附契約書影本及\n其他有關文件,向該管稽徵機關辦理申報繳納應納稅額", "D": "若林先生賠錢出售該筆房地(虧損),因無應納稅額,所以無須向稽徵機關申報該筆房地交易"}, "answer": "C", "note": ""}, {"id": "tax-105-13", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 13, "question": "下列有關所得稅法規定房地合一課徵所得稅制度之敘述何者正確?", "options": {"A": "符合房地合一課稅要件之房地可以免徵土地增值稅", "B": "房地合一課稅是依照出售時的房屋評定現值加土地公告現值為計算之基礎", "C": "依農業發展條例申請興建之農舍不在房地合一課稅範圍", "D": "計算房地合一課稅之交易所得時,依土地稅法規定繳納之土地增值稅,可以列為成本費用"}, "answer": "C", "note": ""}, {"id": "tax-105-14", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 14, "question": "依所得稅法規定,下列敘述何者正確?", "options": {"A": "個人與證券商或銀行從事結構型商品交易之所得為利息所得", "B": "個人取得短期票券到期兌償金額超過首次發售價格部分之利息所得採百分之十分離課稅", "C": "依金融資產證券化條例或不動產證券化條例規定發行之受益證券或資產基礎證券分配之利息所得須併\n入個人綜合所得總額計算", "D": "個人持有公債、公司債及金融債券之利息所得可以適用所得稅法第 17 條儲蓄投資特別扣除額之規定"}, "answer": "B", "note": ""}, {"id": "tax-105-15", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 15, "question": "依所得稅法規定,下列有關房地合一重購退稅之敘述何者錯誤?", "options": {"A": "個人出售自住房屋、土地依房地合一課稅制度繳納之稅額,自完成移轉登記之日或房屋使用權交易之\n日起算 2 年內,重購自住房屋、土地者可以申請退還所納稅額", "B": "得於重購自住房屋、土地完成移轉登記或房屋使用權交易之次日起算 5 年內,申請自前開出售時繳納\n之稅額計算退還", "C": "申請之條件必須為新購入之房地價格大於原出售之房地價格減除已納所得稅額", "D": "重購退稅若為先購後售者亦適用之"}, "answer": "C", "note": ""}, {"id": "tax-105-16", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 16, "question": "依所得稅法規定,獨資合夥之營利事業應如何申報繳納所得稅?", "options": {"A": "只需計算營利事業所得額,不必繳納營利事業所得稅,直接課徵獨資資本主或合夥組織合夥人之綜合\n所得稅", "B": "需先繳納百分之十七的營利事業所得稅,稅後純益再由獨資資本主或合夥組織合夥人申報綜合所得稅", "C": "需先計算其營利事業所得額與稅額,並以其全年應納稅額之半數,減除尚未抵繳之扣繳稅額,計算其\n應納之結算稅額,於申報前自行繳納,小規模營利事業亦適用前述規定", "D": "獨資合夥之營利事業所得額減除全年應納稅額半數後之餘額,應由獨資資本主或合夥組織合夥人依規\n定列為營利所得,課徵綜合所得稅"}, "answer": "D", "note": ""}, {"id": "tax-105-17", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 17, "question": "依所得基本稅額條例規定,營利事業基本所得額之計算,不屬於到期前指定平倉之期貨交易所得額,應\n該採何種方法計算其交易成本?", "options": {"A": "先進先出法", "B": "後進先出法", "C": "個別辨認法", "D": "加權平均法"}, "answer": "A", "note": ""}, {"id": "tax-105-18", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 18, "question": "依相關稅法規定,下列何者不是分期付款銷貨交易之當期損益計算方法?", "options": {"A": "普通銷貨法", "B": "毛利百分比法", "C": "全部毛利法", "D": "賒銷百分比法"}, "answer": "D", "note": ""}, {"id": "tax-105-19", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 19, "question": "下列有關營利事業或個人課徵所得基本稅額之敘述何者正確?", "options": {"A": "營利事業於 102 年度以後出售其持有滿 3 年以上屬所得稅法第 4 條之 1 規定之股票,於計算其當年度證券\n交易所得時,減除其當年度出售該持有滿 3 年以上股票之交易損失,餘額為正者,以餘額半數計入當年度\n證券交易所得,課徵所得基本稅額", "B": "個人出售上市櫃股票之證券交易所得稅停徵,但出售未上市櫃股票之交易所得須計算繳納所得基本稅額", "C": "營利事業出售上市櫃有價證券之證券交易所得稅停徵,也無須計入基本所得額中課稅", "D": "營利事業之基本稅額,為依規定計算之基本所得額扣除新臺幣 200 萬元後,課徵稅率為百分之十二"}, "answer": "A", "note": ""}, {"id": "tax-105-20", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 20, "question": "依營利事業所得稅查核準則規定,下列有關營利事業稅捐費用之認列原則何者錯誤?", "options": {"A": "個人綜合所得稅及依加值型及非加值型營業稅法第 51 條、第 52 條規定追繳或繳納之營業稅,不得列\n為營利事業之費用或損失", "B": "對不動產課徵之稅捐費用認列(如房屋稅、地價稅及教育捐等),以本事業所有或向他人承租為限", "C": "各種稅法所規定之滯納金、滯報金、怠報金等及各種法規所科處之罰鍰,暨未依法扣繳而補繳之稅款\n不予認定", "D": "營利事業出售土地所繳納之土地增值稅,應在該項出售土地之收入項下減除"}, "answer": "B", "note": ""}, {"id": "tax-105-21", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 21, "question": "景美公司於民國105 年1 月1 日新購小客車一輛供總經理公務使用,購入價新臺幣450 萬元,耐用年數5 年,估\n計殘值50 萬元,採用平均法提列折舊。依相關稅法規定,申報105 年營利事業所得稅時,可提折舊金額多少元?", "options": {"A": "20 萬元 40", "B": "萬元 80", "C": "萬元 90", "D": "萬元"}, "answer": "B", "note": ""}, {"id": "tax-105-22", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 22, "question": "大安公司經營小客車租賃業務,於105 年7 月1 日新購新臺幣600 萬元小客車供出租使用,耐用年數4 年,估計\n殘值100 萬元,採用平均法提列折舊。依相關稅法規定,申報105 年營利事業所得稅時,可提折舊金額多少元?", "options": {"A": "50 萬元 62.5", "B": "萬元 100", "C": "萬元 125", "D": "萬元"}, "answer": "A", "note": ""}, {"id": "tax-105-23", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 23, "question": "自 104 年 1 月 1 日起,一般營利事業實際提供員工膳食,於申報營利事業所得稅時,每人每月最高可認\n列的伙食費是新臺幣多少元?", "options": {"A": "1,500 元", "B": "2,400 元 3,000", "C": "元 3,600", "D": "元"}, "answer": "B", "note": ""}, {"id": "tax-105-24", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 24, "question": "請閱讀下方原卷的選擇題第 24 題，再選 A、B、C 或 D。", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "A", "note": "", "paper": "105170_1304_稅務相關法規概要.pdf", "images": ["pages/105/1304-3.jpg"]}, {"id": "tax-105-25", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 25, "question": "依營利事業所得稅查核準則規定,營利事業銷售貨物或勞務,如有隨銷售附贈禮券、獎勵積點或保固服\n務等,該附贈部分相對應之收入應如何計入課稅?", "options": {"A": "應於銷售時認列,不得遞延", "B": "應列為遞延收入,待紅利積點兌換時才得列為收入", "C": "應於營利事業所得稅結算申報書內營業收入調節欄項下調減", "D": "應予遞延,待保固期限過後再列為收入"}, "answer": "A", "note": ""}, {"id": "tax-105-26", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 26, "question": "依營利事業所得稅查核準則規定,營利事業依加值型及非加值型營業稅法規定,以產製、進口、購買供\n銷售之貨物,轉供自用,或以上項貨物無償移轉他人所有時,下列稅務處理方式何者錯誤?", "options": {"A": "須按時價作為銷售額者,開立發票視同銷售", "B": "視為銷售取得之進項稅額不得扣抵銷項稅額", "C": "需同時依時價轉列資產或費用", "D": "應將該項開立統一發票之銷售額於營利事業所得稅結算申報書內營業收入調節欄項下予以減除"}, "answer": "C", "note": ""}, {"id": "tax-105-27", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 27, "question": "依營利事業所得稅查核準則規定,營利事業以包工包料方式建屋預售,其符合條件者,得以完工比例法\n認列售屋利益,下列那一條件敘述錯誤?", "options": {"A": "工程之進度已逾籌劃階段,即工程之設計、規劃、承包、整地均已完成,工程之建造可隨時進行", "B": "預售契約總額已達估計工程總成本", "C": "買方支付之價款已達契約總價款百分之十", "D": "應收契約款之收現性、履行合約所須投入工程總成本與期末完工程度均可合理估計"}, "answer": "C", "note": ""}, {"id": "tax-105-28", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 28, "question": "依營利事業所得稅查核準則第 63 條規定,下列那一項未實現之費用及損失不予認定?", "options": {"A": "屬所得稅法第 48 條所定短期投資之有價證券準用同法第 44 條估價規定產生之跌價損失", "B": "營利事業所得稅查核準則第 50 條之存貨跌價損失", "C": "營利事業所得稅查核準則第 71 條第 8 款之職工退休金準備、職工退休基金或勞工退休準備金", "D": "因匯率調整而產生之帳面兌換損失"}, "answer": "D", "note": ""}, {"id": "tax-105-29", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 29, "question": "依營利事業所得稅查核準則規定,營利事業之捐贈得依規定列為當年度費用或損失,下列敘述何者錯誤?", "options": {"A": "為協助國防建設、慰勞軍隊、對各級政府、中小企業發展基金之捐贈及經財政部專案核准之捐贈,不受金\n額限制", "B": "依運動產業發展條例第 26 條之規定,捐贈經政府登記有案之體育團體以不超過所得額百分之二十五為限", "C": "依政治獻金法規定,對政黨、政治團體及擬參選人之捐贈,以不超過所得額百分之十為限,其總額並不得\n超過新臺幣 50 萬元", "D": "依文化創意產業發展法第 26 條規定所為捐贈,以不超過新臺幣 1,000 萬元或所得額百分之十為限"}, "answer": "B", "note": ""}, {"id": "tax-105-30", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 30, "question": "依營利事業所得稅查核準則規定,下列有關營利事業利息費用認列之敘述何者錯誤?", "options": {"A": "獨資之資本主及合夥組織之合夥人,所借貸之款項,均應以資本主往來論,不得列支利息", "B": "因購置土地以外固定資產而借款之利息,自付款至取得資產期間應付之利息費用,應列入該項資產之成本", "C": "依所得稅法第 100 條之 2 規定,因結算申報所列報之各項成本、費用或損失超限經核定補繳稅款所加計之\n利息,得以費用列支", "D": "依稅捐稽徵法第 48 條之 1 規定,自動補報並補繳漏稅款者加息免罰,其所加計之利息,得以費用列支"}, "answer": "D", "note": ""}, {"id": "tax-105-31", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 31, "question": "依相關稅法規定,下列何種組織的營業人得向稽徵機關申請,以進項憑證編列之明細表代替進項稅額扣\n抵聯申報?", "options": {"A": "合夥組織", "B": "有限公司組織", "C": "股份有限公司組織,且股票已上市者", "D": "教育、文化、公益、慈善機關或團體"}, "answer": "C", "note": ""}, {"id": "tax-105-32", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 32, "question": "下列何者不是加值型及非加值型營業稅法所稱:「其他經財政部規定免予申報銷售額之營業人」?", "options": {"A": "理髮業", "B": "沐浴業", "C": "計程車業", "D": "特種飲食業"}, "answer": "D", "note": ""}, {"id": "tax-105-33", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 33, "question": "依營業稅法規定,下列何者不屬於銷售貨物?", "options": {"A": "營業人銷售代銷貨物", "B": "營業人委託他人代銷貨物", "C": "信託行為成立,委託人將信託財產移轉受託人", "D": "營業人以自己名義代為購買貨物交付與委託人"}, "answer": "C", "note": ""}, {"id": "tax-105-34", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 34, "question": "依現行規定,下列何者不是營業人開立之統一發票的合法取得管道?", "options": {"A": "往來銀行印製", "B": "營業人以網際網路開立", "C": "核定營業人自行印製", "D": "政府印製發售"}, "answer": "A", "note": ""}, {"id": "tax-105-35", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 35, "question": "依現行規定,搬家公司開立銷售憑證的時限是:", "options": {"A": "收款時", "B": "提供勞務時", "C": "結算時", "D": "訂約時"}, "answer": "A", "note": ""}, {"id": "tax-105-36", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 36, "question": "若臺北市文山公司將原料以 5,250,000 元銷售給新竹科學工業園區之風城公司供加工外銷,銷項稅額是多少?", "options": {"A": "0 元 250,000", "B": "元 262,500", "C": "元 525,000", "D": "元"}, "answer": "A", "note": ""}, {"id": "tax-105-37", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 37, "question": "依加值型及非加值型營業稅法規定,下列何者非屬在中華民國境內銷售勞務?", "options": {"A": "銷售之勞務係在中華民國境內提供", "B": "國際運輸事業自中華民國境外載運客、貨入境者", "C": "銷售之勞務係在中華民國境外提供但在境內使用", "D": "外國保險業自中華民國境內保險業承保再保險者"}, "answer": "B", "note": ""}, {"id": "tax-105-38", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 38, "question": "依加值型及非加值型營業稅法規定,下列何者非屬外銷適用零稅率之範圍?", "options": {"A": "保稅區營業人銷售與課稅區營業人之貨物", "B": "銷售與保稅區營業人供營運之貨物或勞務", "C": "保稅區營業人銷售與課稅區營業人存入自由港區事業或海關管理之保稅倉庫、物流中心以供外銷之貨物", "D": "依法設立之免稅商店銷售與過境或出境旅客之貨物"}, "answer": "A", "note": ""}, {"id": "tax-105-39", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 39, "question": "依加值型及非加值型營業稅法規定,下列那一項營業人其營業稅稅率非為百分之一?", "options": {"A": "小規模營業人", "B": "農產品批發市場之承銷人及銷售農產品之小規模營業人", "C": "依法取得從事按摩資格之視覺功能障礙者經營,且全部由視覺功能障礙者提供按摩勞務之按摩業", "D": "其他經財政部規定免予申報銷售額之營業人"}, "answer": "B", "note": ""}, {"id": "tax-105-40", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 40, "question": "依加值型及非加值型營業稅法規定,下列那一項營業人申報之溢付稅額,不能由主管稽徵機關查明後退\n還之?", "options": {"A": "營業人進貨時申報進項稅額大於銷項稅額之溢付稅額", "B": "因取得固定資產而溢付之營業稅", "C": "因銷售適用零稅率貨物或勞務而溢付之營業稅", "D": "因合併、轉讓、解散或廢止申請註銷登記者,其溢付之營業稅"}, "answer": "A", "note": ""}, {"id": "tax-105-41", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 41, "question": "某自助餐店被稽徵機關查定每月銷售額為 10 萬元,試問該自助餐店應如何申報繳納營業稅?", "options": {"A": "每 2 個月為一期申報繳納百分之一的營業稅,共計 2 千元", "B": "每 2 個月為一期申報繳納百分之五的營業稅,共計 1 萬元", "C": "由主管稽徵機關,每 3 個月填發繳款書通知繳納一次,每期共計 3 千元", "D": "由主管稽徵機關,每個月填發繳款書通知繳納一次,每月 1 千元"}, "answer": "C", "note": ""}, {"id": "tax-105-42", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 42, "question": "依加值型及非加值型營業稅法規定,下列有關營業人漏開統一發票或於統一發票上短開銷售額之處罰方\n式何者錯誤?", "options": {"A": "除應就短漏開銷售額按規定稅率計算稅額繳納稅款外,處 1 倍至 10 倍罰鍰", "B": "於法定申報期限前經查獲者,應就短漏開銷售額按規定稅率計算稅額繳納稅款,並按該稅額處 5 倍以下罰鍰", "C": "前項處罰金額不得超過新臺幣 100 萬元", "D": "一年內經查獲達 3 次者,並停止其營業"}, "answer": "A", "note": ""}, {"id": "tax-105-43", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 43, "question": "依統一發票使用辦法規定,營業人每筆銷售額與銷項稅額合計未滿新臺幣多少元,除買受人要求外,得\n免逐筆開立發票?", "options": {"A": "50 元 100", "B": "元 200", "C": "元 500", "D": "元"}, "answer": "A", "note": ""}, {"id": "tax-105-44", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 44, "question": "依統一發票使用辦法規定,下列那一選項不是主管稽徵機關停止營業人購買統一發票之原因?", "options": {"A": "開立不實統一發票", "B": "受停止營業處分", "C": "已變更課稅方式為查定課徵", "D": "無進貨事實虛報進項稅額"}, "answer": "D", "note": ""}, {"id": "tax-105-45", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 45, "question": "依統一發票使用辦法規定,下列那一選項不得免用或免開統一發票?", "options": {"A": "公用事業。但經營本業以外之部分,不包括在內", "B": "依法設立之免稅商店及離島免稅購物商店", "C": "依法組織之慈善救濟事業標售或義賣之貨物與舉辦之義演,其收入除支付標售、義賣及義演之必要費\n用外,全部供作該事業本身之用者", "D": "營業人取得之賠償收入"}, "answer": "A", "note": ""}, {"id": "tax-105-46", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 46, "question": "依現行規定,若財產為繼承人公同共有之遺產且該遺產為被繼承人單獨所有,納稅義務人申請以該財產\n抵繳遺產稅條件:", "options": {"A": "繼承人之應繼分合計二分之一以上同意", "B": "繼承人過半數及其應繼分合計過半數同意", "C": "繼承人二分之一以上之同意", "D": "繼承人三分之二以上之同意"}, "answer": "B", "note": ""}, {"id": "tax-105-47", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 47, "question": "依現行規定,被繼承人死亡前因重病無法處理事務期間出售名下財產,其繼承人對該項出售財產價金不\n能證明其用途者:", "options": {"A": "列入遺產課稅", "B": "屬於不計入遺產總額", "C": "列入贈與課稅", "D": "屬於不計入贈與總額"}, "answer": "A", "note": ""}, {"id": "tax-105-48", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 48, "question": "吉米為美國公民,因深愛臺灣在臺居住滿 10 年,但未歸化取得中華民國國籍。若吉米想要將財產贈與給\n其子女與朋友,試問下列敘述何者正確?", "options": {"A": "吉米為外國人,所以其贈與財產不需繳納我國之贈與稅", "B": "吉米在中華民國境內無住所而有居所,且在贈與行為發生前 2 年內,在中華民國境內居留時間合計逾\n365 天,所以吉米贈與其在中華民國境內外之財產,皆須申報繳納我國之贈與稅", "C": "吉米只須就其贈與在中華民國境內之財產,申報繳納我國之贈與稅", "D": "吉米只須就其贈與在中華民國境外之財產,申報繳納我國之贈與稅"}, "answer": "C", "note": ""}, {"id": "tax-105-49", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 49, "question": "依遺產及贈與稅法規定,下列有關遺產稅免稅額與扣除額之敘述何者錯誤?", "options": {"A": "被繼承人如為經常居住中華民國境內之中華民國國民,得自遺產總額中減除免稅額 1,200 萬元", "B": "被繼承人如為非中華民國國民,不得自遺產總額中減除免稅額 1,200 萬元", "C": "被繼承人之喪葬費用可以扣除,但以在中華民國境內發生者為限", "D": "被繼承人死亡前,未償之債務,具有確實之證明者可以扣除,但以在中華民國境內發生者為限"}, "answer": "B", "note": ""}, {"id": "tax-105-50", "year": "105", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 50, "question": "依遺產及贈與稅法規定,下列有關遺產稅及贈與稅應納稅額之規定何者錯誤?", "options": {"A": "遺產稅及贈與稅納稅義務人,應於稽徵機關送達核定納稅通知書之日起 2 個月內,繳清應納稅款", "B": "遺產稅或贈與稅應納稅額在 30 萬元以上,納稅義務人確有困難,不能一次繳納現金時,得於納稅期限\n內,向該管稽徵機關申請,分 18 期以內繳納,每期間隔以不超過 2 個月為限", "C": "遺產稅或贈與稅應納稅額在 30 萬元以上,納稅義務人確有困難,不能一次繳納現金時,得於納稅期限\n內,就現金不足繳納部分申請以在中華民國境內、外之課徵標的物或納稅義務人所有易於變價及保管\n之實物一次抵繳", "D": "中華民國境內之課徵標的物其申請抵繳日之時價較死亡或贈與日之時價為低者,其得抵繳之稅額,以\n該項財產價值占全部課徵標的物價值比例計算之應納稅額為限"}, "answer": "C", "note": ""}, {"id": "accounting-106-1", "year": "106", "subject": "accounting", "subjectName": "會計學概要", "number": 1, "question": "請閱讀下方原卷的選擇題第 1 題，再選 A、B、C 或 D。", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "B", "note": "", "paper": "106180_1201_會計學概要.pdf", "images": ["pages/106/1201-6.jpg"]}, {"id": "accounting-106-2", "year": "106", "subject": "accounting", "subjectName": "會計學概要", "number": 2, "question": "請閱讀下方原卷的選擇題第 2 題，再選 A、B、C 或 D。", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "B", "note": "", "paper": "106180_1201_會計學概要.pdf", "images": ["pages/106/1201-2.jpg", "pages/106/1201-3.jpg"]}, {"id": "accounting-106-3", "year": "106", "subject": "accounting", "subjectName": "會計學概要", "number": 3, "question": "請閱讀下方原卷的選擇題第 3 題，再選 A、B、C 或 D。", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "D", "note": "", "paper": "106180_1201_會計學概要.pdf", "images": ["pages/106/1201-2.jpg", "pages/106/1201-3.jpg"]}, {"id": "accounting-106-4", "year": "106", "subject": "accounting", "subjectName": "會計學概要", "number": 4, "question": "請閱讀下方原卷的選擇題第 4 題，再選 A、B、C 或 D。", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "A", "note": "", "paper": "106180_1201_會計學概要.pdf", "images": ["pages/106/1201-2.jpg", "pages/106/1201-3.jpg"]}, {"id": "accounting-106-5", "year": "106", "subject": "accounting", "subjectName": "會計學概要", "number": 5, "question": "請閱讀下方原卷的選擇題第 5 題，再選 A、B、C 或 D。", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "D", "note": "", {"A": "", "B": "", "C": "", "D": ""}, "answer": "B", "note": "", "paper": "106180_1204_稅務相關法規概要.pdf", "images": ["pages/106/1204-4.jpg"]}, {"id": "tax-106-50", "year": "106", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 50, "question": "請閱讀下方原卷的選擇題第 50 題，再選 A、B、C 或 D。", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "A", "note": "", "paper": "106180_1204_稅務相關法規概要.pdf", "images": ["pages/106/1204-4.jpg"]}, {"id": "accounting-107-1", "year": "107", "subject": "accounting", "subjectName": "會計學概要", "number": 1, "question": "丁公司於 X3 年 7 月 31 日帳載現金餘額為$709,100,會計人員比對銀行對帳單相關記錄後,\n發現下列事項:未兌現支票$50,000、銀行代收票據$47,500、存款不足退票$90,200、在途存\n款$81,600、支付供應商的支票$3,600,帳上誤記為$6,300。請問 X3 年 7 月 31 日丁公司必要\n的調整分錄,下列何者正確?", "options": {"A": "貸記現金$40,000", "B": "借記應收票據$44,800", "C": "貸記應收帳款$43,700", "D": "借記現金$36,500"}, "answer": "A", "note": ""}, {"id": "accounting-107-2", "year": "107", "subject": "accounting", "subjectName": "會計學概要", "number": 2, "question": "甲公司為一太陽能發電公司,本年度標到一組山坡地安裝太陽能板,並根據我國清潔能源辦\n法,申請到 20 年的躉售電價,每度$8。該公司太陽能板相關成本為$800,000,另外根據清\n潔能源辦法,該公司須於 20 年到期時,將該地恢復原狀,並清除相關廢棄物,甲公司估計\n恢復與清除廢棄物成本為$100,000,假設合理利率為 5%,請問該組太陽能板設備帳列成本\n最接近下列何者?", "options": {"A": "$700,000", "B": "$800,000", "C": "$837,689", "D": "$937,689"}, "answer": "C", "note": ""}, {"id": "accounting-107-3", "year": "107", "subject": "accounting", "subjectName": "會計學概要", "number": 3, "question": "進貨時,賣方提供之現金折扣條件為 1/10,n/30,相當於賣方提供多少年利率的優惠(一年\n以 365 天計算)?", "options": {"A": "10%", "B": "18.43%", "C": "20%", "D": "37.24%"}, "answer": "B", "note": ""}, {"id": "accounting-107-4", "year": "107", "subject": "accounting", "subjectName": "會計學概要", "number": 4, "question": "乙公司本年度相關資料如下:\n1/1 流通在外股數 40,000 股\n5/1 現金增資發行 9,000 股\n9/1 發放所有流通在外股票 10%股票股利與每股$1 現金股利\n10/1 買回庫藏股 2,000 股\n乙公司本年度純益$500,000,則乙公司本年度 EPS 為多少(計算到小數點第 2 位)?", "options": {"A": "$9.98", "B": "$10.50", "C": "$10.64", "D": "$10.99"}, "answer": "A", "note": ""}, {"id": "accounting-107-5", "year": "107", "subject": "accounting", "subjectName": "會計學概要", "number": 5, "question": "丙公司於 X3 年底資產負債表中顯示:普通股股本$1,000,000、資本公積-普通股股本溢價\n$550,000、資本公積-庫藏股票交易$100,000、保留盈餘$790,000、庫藏股票$80,000 與待分配\n股票股利$50,000。請問 X3 年底的股東權益總額為多少?", "options": {"A": "$2,520,000", "B": "$2,490,000", "C": "$2,460,000", "D": "$2,410,000"}, "answer": "D", "note": ""}, {"id": "accounting-107-6", "year": "107", "subject": "accounting", "subjectName": "會計學概要", "number": 6, "question": "關於庫藏股票之相關會計記錄與財務表達,下列何者錯誤?", "options": {"A": "股東權益段所列示的庫藏股票,其金額為收回已發行股份所支付的成本", "B": "當公司將庫藏股票全數處分時,則一併將「資本公積-庫藏股票交易」科目沖銷至零", "C": "當公司處分庫藏股票時,若出售價格高於原始購入庫藏股票的成本時,其差額將貸記「資\n本公積-庫藏股票交易」", "D": "當公司處分庫藏股票時,若出售價格低於原始購入庫藏股票的成本時,其差額將借記「資\n本公積-庫藏股票交易」或「保留盈餘」科目"}, "answer": "B", "note": ""}, {"id": "accounting-107-7", "year": "107", "subject": "accounting", "subjectName": "會計學概要", "number": 7, "question": "乙公司採永續盤存制及先進先出的成本流程,X1 年 1 月份的交易事項如下:1 月 4 日向甲公\n司賖購 100 件商品,其總金額為$10,000,交易條件為目的地交貨,付款條件為 2/10,n/30;\n1 月 6 日向丙公司現購 60 件商品,其總金額為$6,600;1 月 10 日償還對甲公司的貨款;1 月\n18 日賖銷 80 件商品,每單位售價為$150,並支付運費$400,交易條件為目的地交貨,付款\n條件為 2/10,n/30。請問乙公司記錄 X1 年 1 月 18 日賖銷相關分錄中,下列何者正確?", "options": {"A": "借記應收帳款$12,400", "B": "貸記存貨$8,400", "C": "借記銷貨成本$7,840", "D": "貸記銷貨收入$12,160"}, "answer": "C", "note": ""}, {"id": "accounting-107-8", "year": "107", "subject": "accounting", "subjectName": "會計學概要", "number": 8, "question": "丙公司於 X1 年 3 月 1 日賖銷商品$250,000,付款條件為 2/10,1/15,n/30;同年 3 月 6 日因\n顧客商品瑕疵退回$30,000,並於當日收到部分貨款之現金為$117,600,其餘貨款於 3 月 20\n日收現。請問丙公司對於該批賖銷商品之總收現金額為多少?", "options": {"A": "$237,600", "B": "$247,000", "C": "$217,600", "D": "$220,000"}, "answer": "C", "note": ""}, {"id": "accounting-107-9", "year": "107", "subject": "accounting", "subjectName": "會計學概要", "number": 9, "question": "丙公司欲編製 X1 年底資產負債表時,有下列資料:零用金$7,500、某銀行活期存款$75,300、\n員工借支$3,100、償債基金$10,000、收到客戶即期支票$8,300、旅行支票$6,000、某銀行 2\n個月期之定期存款$15,000。請計算 X1 年底資產負債表之「現金」科目之餘額為多少?", "options": {"A": "$132,700", "B": "$112,100", "C": "$150,200", "D": "$141,800"}, "answer": "B", "note": ""}, {"id": "accounting-107-10", "year": "107", "subject": "accounting", "subjectName": "會計學概要", "number": 10, "question": "乙公司於 X1 年 5 月 1 日收到附息票據,面額$350,000,票面利率 6%,到期日為 X1 年 11\n月 1 日,該公司於同年 7 月 1 日持該票據向銀行貼現,而獲得現金$349,685,請問貼現利率\n為何?", "options": {"A": "10%", "B": "7%", "C": "9%", "D": "8%"}, "answer": "C", "note": ""}, {"id": "accounting-107-11", "year": "107", "subject": "accounting", "subjectName": "會計學概要", "number": 11, "question": "甲公司 X2 年底應收帳款餘額為$235,900,X2 年有關交易如下:賖銷$720,000、銷貨退回\n$35,000、應收帳款收現$551,000、沖銷呆帳$8,600、收回已沖銷之呆帳$2,900。X2 年初備抵\n呆帳餘額為貸餘$4,200,甲公司採應收帳款餘額百分比法提列呆帳,估計呆帳率為 3%。請\n問 X2 年底提列呆帳分錄的金額為多少?", "options": {"A": "$12,339", "B": "$8,577", "C": "$9,371", "D": "$5,562"}, "answer": "B", "note": ""}, {"id": "accounting-107-12", "year": "107", "subject": "accounting", "subjectName": "會計學概要", "number": 12, "question": "丙公司 X5 年度銷貨收入總額為$500,000,可供銷售商品總額為$650,000,銷貨折扣為\n$20,000,銷貨運費為$5,000,進貨運費為$10,000,進貨折扣$30,000,其平均毛利率為銷貨\n淨額的 25%,請以毛利率法估計 X5 年底的存貨金額為多少?", "options": {"A": "$315,000", "B": "$430,000", "C": "$185,000", "D": "$290,000"}, "answer": "D", "note": ""}, {"id": "accounting-107-13", "year": "107", "subject": "accounting", "subjectName": "會計學概要", "number": 13, "question": "甲公司於 X2 年發現 X1 年初存貨高估$50,000 與 X1 年底存貨低估$30,000,請問此錯誤對\nX1 年度與 X2 年度本期淨利的影響分別為何?", "options": {"A": "X1 年度本期淨利低估$80,000,X2 年度本期淨利高估$30,000", "B": "X1 年度本期淨利低估$30,000,X2 年度本期淨利不影響", "C": "X1 年度本期淨利高估$80,000,X2 年度本期淨利低估$50,000", "D": "X1 年度本期淨利高估$50,000,X2 年度本期淨利不影響"}, "answer": "A", "note": ""}, {"id": "accounting-107-14", "year": "107", "subject": "accounting", "subjectName": "會計學概要", "number": 14, "question": "乙公司於 X3 年 4 月 1 日賖購設備,其定價為$1,250,000,付款條件為 2/10,n/30,於該年 4\n月 8 日付清。其他相關支出包含運費$15,000、安裝與試車費$45,000、購買設備未來兩年意\n外保險$36,000。乙公司估計該設備可使用 5 年,估計殘值為$25,000,並採年數合計法提列\n折舊。請問 X3 年度該設備應提列之折舊金額為多少?", "options": {"A": "$321,250", "B": "$315,000", "C": "$420,000", "D": "$327,500"}, "answer": "B", "note": ""}, {"id": "accounting-107-15", "year": "107", "subject": "accounting", "subjectName": "會計學概要", "number": 15, "question": "甲公司提供顧客 2 年的產品保固服務,該保固期間第一年、第二年估計發生的產品維修費用\n占銷貨收入的百分比分別為 2%、3%。X4 年度與 X5 年度銷貨收入分別為$230,000 與\n$490,000,且於 X5 年度實際發生維修費用$15,000。請問 X5 年底估計產品服務保證負債之\n金額為多少?", "options": {"A": "$21,000", "B": "$11,200", "C": "$6,300", "D": "$10,600"}, "answer": "A", "note": ""}, {"id": "accounting-107-16", "year": "107", "subject": "accounting", "subjectName": "會計學概要", "number": 16, "question": "丁公司於 X1 年 1 月 1 日發行五年期公司債,面額$100,000,票面利率為 12%,市場利率為\n10%,付息日為每年 1 月 1 日與 7 月 1 日,當日全數出售得款$107,732。請問 X1 年 12 月 31\n日該批公司債於資產負債表中列示的帳面金額為多少?(四捨五入至整數位)", "options": {"A": "$107,119", "B": "$105,431", "C": "$106,475", "D": "$104,359"}, "answer": "C", "note": ""}, {"id": "accounting-107-17", "year": "107", "subject": "accounting", "subjectName": "會計學概要", "number": 17, "question": "甲公司於 X4 年 3 月 1 日發行面額$500,000,票面利率 8%的五年期公司債,付息日為每年 3\n月 1 日與 9 月 1 日,當時市場有效利率為 8%。該批公司債於 X4 年分兩次出售完畢,分別\n於 6 月 1 日出售面額$350,000 與 9 月 1 日出售面額$150,000。請問甲公司記錄兩次的出售分\n錄,下列何者正確?", "options": {"A": "6 月 1 日分錄,借記現金$357,000,貸記應付公司債$350,000 與應收利息$7,000", "B": "6 月 1 日分錄,借記現金$350,000 與應收利息$7,000,貸記應付公司債$350,000 與利息費\n用$7,000", "C": "9 月 1 日分錄,借記現金$150,000,貸記應付公司債$150,000", "D": "9 月 1 日分錄,借記現金$156,000,貸記應付公司債$150,000 與應收利息$6,000"}, "answer": "C", "note": ""}, {"id": "accounting-107-18", "year": "107", "subject": "accounting", "subjectName": "會計學概要", "number": 18, "question": "採間接法編製現金流量表時,下列何者錯誤?", "options": {"A": "折舊費用為營業活動現金流量之加項", "B": "出售設備損失為營業活動現金流量之減項", "C": "出售庫藏股票為籌資活動現金流量之加項", "D": "購入機器設備為投資活動現金流量之減項"}, "answer": "B", "note": ""}, {"id": "accounting-107-19", "year": "107", "subject": "accounting", "subjectName": "會計學概要", "number": 19, "question": "甲公司於 X2 年度現銷與賖銷分別為$200,000 與$500,000,當年期初應收帳款為$260,000,期\n末應收帳款為$330,000。甲公司以直接法編製現金流量表,請問有關銷貨交易對 X2 年度營\n業活動現金流量之影響為多少?", "options": {"A": "增加$430,000", "B": "增加$570,000", "C": "增加$630,000", "D": "增加$770,000"}, "answer": "C", "note": ""}, {"id": "accounting-107-20", "year": "107", "subject": "accounting", "subjectName": "會計學概要", "number": 20, "question": "乙公司 X3 年初與 X3 年底用品盤存帳戶餘額分別為$3,500 與$4,900,並於當年度購入辦公用\n品$7,300,但入帳金額誤記為$3,700,該項錯誤於 X3 年結帳程序後發現,並馬上做更正分錄,\n請問 X3 年更正分錄為何?", "options": {"A": "借記保留盈餘$3,600 與貸記現金$3,600", "B": "借記用品盤存$2,300 與貸記現金$2,300", "C": "借記用品費用$5,900 與貸記用品盤存$5,900", "D": "借記保留盈餘$3,700 與貸記用品費用$3,700"}, "answer": "A", "note": ""}, {"id": "bookkeeping-107-1", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 1, "question": "依記帳士法第 4 條規定,下列不得充任記帳士之情事,何者錯誤?", "options": {"A": "受監護或輔助宣告尚未撤銷", "B": "受破產之宣告尚未復權", "C": "曾因業務上有詐欺、背信等犯罪行為,受有期徒刑一年以上刑之裁判確定,且非緩刑者", "D": "曾服公職而受免除職務處分,自處分確定日起尚未屆滿十年"}, "answer": "D", "note": ""}, {"id": "bookkeeping-107-2", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 2, "question": "記帳士法所稱主管機關為下列那一個機關?", "options": {"A": "金融監督管理委員會", "B": "財政部", "C": "各區國稅局", "D": "內政部"}, "answer": "B", "note": ""}, {"id": "bookkeeping-107-3", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 3, "question": "於記帳士法施行前已從事記帳及報稅代理業務者,符合下列那些條件得登錄且繼續執業? 1已從事記帳\n及報稅代理業務滿二年 2均有報繳該項執行業務所得 3每年至少應完成二十四小時以上之相關專業訓\n練 4應加入記帳及報稅代理人公會", "options": {"A": "123 1", "B": "24", "C": "134", "D": "234"}, "answer": "D", "note": ""}, {"id": "bookkeeping-107-4", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 4, "question": "依現行記帳士法,下列敘述何者錯誤?", "options": {"A": "記帳士接受委任代理各款業務時,應與委任人訂立委任書並隨同代理案件附送受理機關", "B": "記帳士受委任後如須終止契約,須於十日前通知委任人,即得終止該委任契約", "C": "經登錄之記帳士,因原登錄事項有變更時,應自事實發生之日起三十日內,向其原登錄之機關申報備查", "D": "記帳士在其登記開業以外的其他直轄市、縣市執行業務時,應向主管機關登記,免設分事務所"}, "answer": "B", "note": ""}, {"id": "bookkeeping-107-5", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 5, "question": "依據記帳士法之規定,曾任稅務機關稅務職系人員者,自離職之日起幾年內,不得於其最後任職機關所\n在地之直轄市、縣市區域內執行記帳士職務?", "options": {"A": "一年內", "B": "二年內", "C": "三年內", "D": "五年內"}, "answer": "C", "note": ""}, {"id": "bookkeeping-107-6", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 6, "question": "依據記帳士法之規定,記帳士不得在登錄區域內,執行下列那項業務?", "options": {"A": "受委任提起訴願", "B": "受委任辦理各項稅捐稽徵案件之申報及申請事項", "C": "受理稅務諮詢事項", "D": "受委任辦理營業、變更、註銷、停業、復業及其他登記事項"}, "answer": "A", "note": ""}, {"id": "bookkeeping-107-7", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 7, "question": "關於記帳士公會,下列何者正確? 1直轄市及縣(市)記帳士公會,應由該行政區域內開業記帳士三十\n人以上發起組織之 2記帳士公會理事、監事任期均為三年 3理事、監事連選連任者不得超過三分之二\n4理事長之連任,以一次為限", "options": {"A": "12", "B": "13", "C": "14", "D": "23"}, "answer": "C", "note": ""}, {"id": "bookkeeping-107-8", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 8, "question": "依據記帳士法之規定,下列敘述何者錯誤?", "options": {"A": "被懲戒人對於記帳士懲戒委員會之決議不服者,得於決議書送達之翌日起二十日內,向記帳士懲戒覆\n審委員會請求覆審", "B": "外國人不得依中華民國法令取得記帳士證書,並充任記帳士", "C": "記帳士受申誡處分三次以上者,應另受停止執行業務之處分;受停止執行業務處分累計滿五年者,應\n予除名", "D": "記帳士懲戒委員會處理懲戒事件,認為有犯罪嫌疑者,應即移送司法機關偵辦"}, "answer": "B", "note": ""}, {"id": "bookkeeping-107-9", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 9, "question": "依商業會計法規定,財務報表「未」包括下列那一項?", "options": {"A": "權益變動表", "B": "現金流量表", "C": "保留盈餘表", "D": "資產負債表、綜合損益表等必要之附註"}, "answer": "C", "note": ""}, {"id": "bookkeeping-107-10", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 10, "question": "下列何者非商業會計法所稱之費損?", "options": {"A": "已耗用的預付租金", "B": "已發生但尚未給付的員工薪資", "C": "發給員工酬勞之股票", "D": "分配給股東之股利"}, "answer": "D", "note": ""}, {"id": "bookkeeping-107-11", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 11, "question": "依據商業會計法之規定,商業會計事務之處理應置會計人員辦理之,有關商業之主辦會計人員任免規定,\n下列敘述何者錯誤?", "options": {"A": "公司組織之商業,其主辦會計人員之任免,在股份有限公司,應由董事會以董事過半數之出席,及出\n席董事過半數之同意", "B": "在無限公司、兩合公司,應有全體無限責任股東三分之二以上之同意", "C": "在有限公司,應有全體股東過半數之同意", "D": "主辦會計人員之任免,公司章程有較高規定者,從其規定"}, "answer": "B", "note": ""}, {"id": "bookkeeping-107-12", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 12, "question": "依商業會計法規定,會計事項應按發生次序逐日登帳,至遲不得超過多久?而各項會計帳簿及財務報表,\n應於年度決算程序辦理終了後,至少保存幾年?", "options": {"A": "一個月;五年", "B": "二個月;五年", "C": "二個月;十年", "D": "三個月;十年"}, "answer": "C", "note": ""}, {"id": "bookkeeping-107-13", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 13, "question": "依商業會計法規定,取得由非貨幣性資產交換而來的資產時,原則上應如何衡量?", "options": {"A": "公允價值", "B": "以換出資產之原始成本衡量", "C": "淨變現價值", "D": "商業得自由選擇適當之衡量基礎"}, "answer": "A", "note": ""}, {"id": "bookkeeping-107-14", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 14, "question": "依商業會計法第 43 條規定,存貨以成本與淨變現價值孰低衡量,當存貨成本高於淨變現價值時,應將成\n本沖減至淨變現價值,沖減金額應於發生當期認列於那一個會計項目?", "options": {"A": "銷貨成本", "B": "存貨跌價損失", "C": "備抵存貨跌價損失", "D": "其他費用或損失"}, "answer": "A", "note": ""}, {"id": "bookkeeping-107-15", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 15, "question": "依商業會計法規定,購入之商譽、商標權等無形資產,應如何衡量入帳?", "options": {"A": "以公允價值為取得成本", "B": "以淨變現價值為取得成本", "C": "以實際成本為取得成本", "D": "不應入帳"}, "answer": "C", "note": ""}, {"id": "bookkeeping-107-16", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 16, "question": "下列有關各項會計事項之認列,何者錯誤?", "options": {"A": "辦理資產重估而發生之增值,應列為未實現重估增值", "B": "預付費用之衡量應以其有效期間未經過部分為準", "C": "除因營業或主要為交易目的或預期在一年內清償者外,各項負債應各依其到期時應償付數額之折現值\n列計", "D": "公司債之溢價,應列為公司債之減項"}, "answer": "D", "note": ""}, {"id": "bookkeeping-107-17", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 17, "question": "下列有關商業會計法對會計憑證與帳簿的規定何者錯誤?", "options": {"A": "記帳憑證及會計帳簿,原則上應由代表商業之負責人、經理人、主辦及經辦會計人員簽名或蓋章負責", "B": "會計憑證,應按日或按月裝訂成冊,有原始憑證者,應附於記帳憑證之後", "C": "各項會計憑證,除應永久保存或有關未結會計事項者外,應於年度決算程序辦理終了後,至少保存十年", "D": "對外憑證之繕製,應至少自留副本或存根一份;副本或存根上所記該事項之要點及金額,不得與正本\n有所差異"}, "answer": "C", "note": ""}, {"id": "bookkeeping-107-18", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 18, "question": "依商業會計法規定,具負債性質之特別股,其股利應認列為:", "options": {"A": "股本之減項", "B": "資本公積之減項", "C": "費用", "D": "利息收入之減項"}, "answer": "C", "note": ""}, {"id": "bookkeeping-107-19", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 19, "question": "商業之負責人、主辦及經辦會計人員,下列何項情事會被處以罰鍰?", "options": {"A": "以明知為不實之事項,而填製會計憑證或記入帳冊", "B": "故意遺漏會計事項不為記錄,致使財務報表發生不實之結果", "C": "違反會計帳簿均應按其頁數順序編號之規定,毀損會計帳簿頁數,或毀滅審計軌跡", "D": "故意使應保存之會計憑證、會計帳簿報表滅失毀損"}, "answer": "C", "note": ""}, {"id": "bookkeeping-107-20", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 20, "question": "下列有關商業會計法規定的認列與衡量原則何者錯誤?", "options": {"A": "資產及負債之原始認列,以成本衡量為原則", "B": "資產之取得,係由非貨幣性資產交換而來者,以換出資產之帳面金額衡量為原則", "C": "未來經濟效益很有可能流入或流出商業且項目金額能可靠衡量者,始得認列為資產負債表或綜合損益\n表之會計項目", "D": "受贈資產按公允價值入帳,並視其性質列為資本公積、收入或遞延收入"}, "answer": "B", "note": ""}, {"id": "bookkeeping-107-21", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 21, "question": "依商業會計處理準則規定,下列何者錯誤?", "options": {"A": "持有無活絡市場公開報價,且具固定或可決定收取金額之債務工具投資,應以攤銷後成本衡量", "B": "被指定為備供出售之非衍生金融資產,應以公允價值衡量", "C": "持有至到期日之金融資產,在一年內到期之部分,應以攤銷後成本衡量", "D": "應收票據應以票面金額衡量"}, "answer": "D", "note": ""}, {"id": "bookkeeping-107-22", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 22, "question": "依商業會計處理準則,下列關於「應收帳款」之敘述何者錯誤?", "options": {"A": "應收帳款原則應以攤銷後成本衡量", "B": "分期付款銷貨之未實現利息收入,應列為應收帳款之減項", "C": "收回期間超過一年部分,應揭露各年度預期收回之金額", "D": "業已確定無法收回者,列為應收帳款之加項"}, "answer": "D", "note": ""}, {"id": "bookkeeping-107-23", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 23, "question": "自企業合併取得之不可辨認及未單獨認列未來經濟效益之無形資產為:", "options": {"A": "商標權", "B": "專利權", "C": "商譽", "D": "品牌"}, "answer": "C", "note": ""}, {"id": "bookkeeping-107-24", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 24, "question": "依商業會計處理準則,無形資產應如何列示?", "options": {"A": "以原始取得成本列示", "B": "以公允價值列示", "C": "以成本減除累計攤銷及累計減損後之帳面金額列示", "D": "以淨變現價值列示"}, "answer": "C", "note": ""}, {"id": "bookkeeping-107-25", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 25, "question": "依商業會計處理準則,已辦理資產重估者,發生減損時,應如何認列?", "options": {"A": "直接認列至當期損失", "B": "先減少未實現重估增值", "C": "提列累計減損", "D": "做為股本之減項"}, "answer": "B", "note": ""}, {"id": "bookkeeping-107-26", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 26, "question": "依商業會計處理準則,當公司買回庫藏股票,尚未再出售或註銷者,應按下列何者列為權益之減項?", "options": {"A": "買回成本", "B": "股票市價", "C": "股票面額", "D": "視公司目的選擇適合之評估價值"}, "answer": "A", "note": ""}, {"id": "bookkeeping-107-27", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 27, "question": "下列有關商業會計法規定的認列與衡量方式何者錯誤?", "options": {"A": "無形資產自行發展取得者,以登記或創作完成時之成本作為取得成本,其後之研究發展支出,應繼續\n予以資本化", "B": "支出之效益及於以後各期者,列為資產", "C": "支出之效益僅及於當期或無效益者,列為費用或損失", "D": "遞耗資產,應設置累計折耗項目,按期提列折耗額"}, "answer": "A", "note": ""}, {"id": "bookkeeping-107-28", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 28, "question": "下列有關商業會計處理準則之敘述何者錯誤?", "options": {"A": "生物資產應依流動性區分為流動與非流動,並以公允價值衡量", "B": "礦產資源應按取得、探勘及開發之成本認列,並以成本減除累計折耗及累計減損後之帳面金額列示", "C": "具明確經濟效益期限之無形資產應以合理有系統之方法分期攤銷", "D": "商譽及無明確經濟效益期限之無形資產,得以合理有系統之方法分期攤銷或每年定期進行減損測試"}, "answer": "A", "note": ""}, {"id": "bookkeeping-107-29", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 29, "question": "依據商業會計法之規定,商業負責人應於會計年度終了後多久期間內,將商業之決算報表提請商業出資\n人、合夥人或股東承認?", "options": {"A": "一個月內", "B": "二個月內", "C": "三個月內", "D": "六個月內"}, "answer": "D", "note": ""}, {"id": "bookkeeping-107-30", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 30, "question": "下列會計項目何者非屬長期性之投資?", "options": {"A": "透過損益按公允價值衡量之金融資產-非流動", "B": "無活絡市場之債務工具投資-非流動", "C": "避險之衍生金融資產", "D": "採用權益法之投資"}, "answer": "C", "note": ""}, {"id": "bookkeeping-107-31", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 31, "question": "某一負債預期將於資產負債表日後十二個月內到期清償,倘若該負債於資產負債表日後至通過財務報表\n前已完成長期性之再融資或重新安排付款協議時,該負債應列於何類別?", "options": {"A": "流動負債", "B": "長期負債", "C": "負債準備", "D": "應付公司債"}, "answer": "A", "note": ""}, {"id": "bookkeeping-107-32", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 32, "question": "營利事業收到股東依其出資比例捐贈的資產時,該項受贈資產應如何認列?", "options": {"A": "其他收入", "B": "遞延收入", "C": "其他權益", "D": "資本公積"}, "answer": "D", "note": ""}, {"id": "bookkeeping-107-33", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 33, "question": "依商業會計處理準則之規定,記帳錯誤如更正後影響總數者,應如何處理?", "options": {"A": "另開傳票更正", "B": "在原錯誤上劃紅線二道", "C": "將更正之數字或文字書寫於上", "D": "由更正人於更正處簽名"}, "answer": "A", "note": ""}, {"id": "bookkeeping-107-34", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 34, "question": "當行政處分有不能由書面處分中得知處分機關之情形時,其效力為何?", "options": {"A": "仍屬有效", "B": "無效", "C": "一部分無效,其他部分仍為有效", "D": "其有效或無效,行政機關得依職權確認之"}, "answer": "B", "note": ""}, {"id": "bookkeeping-107-35", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 35, "question": "授予利益之合法行政處分,有發生准許廢止情形者,得由原處分機關依職權為全部或一部之廢止,然此\n項廢止應自廢止原因發生後多久期限內為之?", "options": {"A": "半年", "B": "一年", "C": "二年", "D": "三年"}, "answer": "C", "note": ""}, {"id": "bookkeeping-107-36", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 36, "question": "下列有關行政程序法對行政救濟相關規定之敘述何者錯誤?", "options": {"A": "處分機關告知之救濟期間有錯誤時,應由該機關以通知更正之,並自通知送達之翌日起算法定期間", "B": "處分機關告知之救濟期間較法定期間為長者,處分機關雖以通知更正,如相對人或利害關係人信賴原告\n知之救濟期間,致無法於法定期間內提起救濟,而於原告知之期間內為之者,視為於法定期間內所為", "C": "處分機關未告知救濟期間或告知錯誤未為更正,致相對人或利害關係人遲誤者,如自處分書送達後一\n年內聲明不服時,視為於法定期間內所為", "D": "對於行政處分聲明不服,因處分機關未為告知或告知錯誤致向無管轄權之機關為之者,該機關應於三\n十日內移送有管轄權之機關,並通知當事人。前項情形,視為自始向有管轄權之機關聲明不服"}, "answer": "D", "note": ""}, {"id": "bookkeeping-107-37", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 37, "question": "授予利益之違法行政處分之撤銷,當受益人因信賴該處分致遭受財產上之損失者,下列敘述何者錯誤?", "options": {"A": "在任何情況下,為撤銷之機關皆應給予合理之補償", "B": "補償額度不得超過受益人因該處分存續可得之利益", "C": "補償之金額,相對人有不服者,得向行政法院提起給付訴訟", "D": "得由原處分機關或其上級機關依職權進行撤銷"}, "answer": "A", "note": ""}, {"id": "bookkeeping-107-38", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 38, "question": "無效之行政處分,自何時起失其效力?", "options": {"A": "經行政機關確認其無效之日起失其效力", "B": "經行政法院確認其無效之日起失其效力", "C": "經行政機關撤銷該處分之日起失其效力", "D": "自始不生效力"}, "answer": "D", "note": ""}, {"id": "bookkeeping-107-39", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 39, "question": "依據行政程序法之規定,下列敘述何者錯誤?", "options": {"A": "行政處分一部分無效者,其他部分亦併同無效", "B": "行政處分之無效,行政機關得依職權確認之", "C": "行政處分之相對人或利害關係人有正當理由請求確認行政處分無效時,處分機關應確認其為有效或無效", "D": "違法行政處分於法定救濟期間經過後,原處分機關得依職權為全部或一部之撤銷;其上級機關,亦得\n為之"}, "answer": "A", "note": ""}, {"id": "bookkeeping-107-40", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 40, "question": "依據公司法第 10 條之規定,主管機關得依職權或利害關係人之申請,命令解散公司,下列相關敘述何者\n錯誤?", "options": {"A": "公司設立登記後六個月尚未開始營業。但已辦妥延展登記者,不在此限", "B": "開始營業後自行停止營業六個月以上。但已辦妥停業登記者,不在此限", "C": "公司名稱經法院判決確定不得使用,公司於判決確定後六個月內尚未辦妥名稱變更登記,並經主管機\n關令其限期辦理仍未辦妥", "D": "未於規定期限內,檢送公司設立登記資本額經會計師查核簽證之文件者。但於六個月內已檢送者,不\n在此限"}, "answer": "D", "note": ""}, {"id": "bookkeeping-107-41", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 41, "question": "公開發行股票之公司為他公司有限責任股東時,其所有投資總額,除以投資為專業或公司章程另有規定\n或經代表已發行股份總數三分之二以上股東出席,以出席股東表決權過半數同意之股東會決議者外,原\n則上不得超過本公司實收股本之多少百分比?", "options": {"A": "百分之三十", "B": "百分之四十", "C": "百分之五十", "D": "百分之六十"}, "answer": "B", "note": ""}, {"id": "bookkeeping-107-42", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 42, "question": "主管機關查核公司財務報表,或派員檢查公司業務及財務狀況時,得令公司提出證明文件、單據、表冊\n及有關資料,除法律另有規定外,應保守秘密,並於收受後幾日內查閱發還?", "options": {"A": "十日", "B": "十五日", "C": "二十日", "D": "三十日"}, "answer": "B", "note": ""}, {"id": "bookkeeping-107-43", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 43, "question": "依據公司法之規定,公司申請設立登記之資本額,應經會計師查核簽證;公司應於申請設立登記時或設\n立登記後多少日內,檢送經會計師查核簽證之文件?", "options": {"A": "十日內", "B": "二十日內", "C": "三十日內", "D": "二個月內"}, "answer": "C", "note": ""}, {"id": "bookkeeping-107-44", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 44, "question": "公司得依章程規定置經理人,而關於經理人之敘述,下列何項錯誤?", "options": {"A": "經理人的委任在無限公司下,須有全體無限責任股東過半數同意", "B": "使用票據經拒絕往來尚未期滿者,不得充任經理人", "C": "任何情況下,經理人皆不得兼任其他營利事業之經理人,並不得自營或為他人經營同類之業務", "D": "經理人不得變更董事或執行業務股東之決定,或股東會或董事會之決議,或逾越其規定之權限"}, "answer": "C", "note": ""}, {"id": "bookkeeping-107-45", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 45, "question": "下列有關公司法之規定何者錯誤?", "options": {"A": "公司不得為他公司無限責任股東或合夥事業之合夥人", "B": "公司間或與行號間有短期融通資金之必要者,融資金額不得超過貸與企業資本額的百分之四十", "C": "公開發行股票之公司為他公司有限責任股東時,其所有投資總額,除以投資為專業或公司章程另有規\n定或經代表已發行股份總數三分之二以上股東出席,以出席股東表決權過半數同意之股東會決議者\n外,不得超過本公司實收股本百分之四十", "D": "政府或法人為股東時,得當選為董事或監察人。但須指定自然人代表行使職務"}, "answer": "B", "note": ""}, {"id": "bookkeeping-107-46", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 46, "question": "下列有關商業登記法之規定何者錯誤?", "options": {"A": "登記事項有變更時,除因繼承所致之變更登記應自繼承開始後六個月內為之外,應自事實發生之日起\n十五日內,申請為變更登記", "B": "商業遷移於原登記機關之管轄區域以外時,應向遷入區域之主管機關申請遷址之登記", "C": "商業暫停營業一個月以上者,應於停業前申請停業之登記,並於復業前申請復業之登記。但已依加值\n型及非加值型營業稅法規定申報者,不在此限", "D": "商業停業期間,最長不得超過半年。但有正當理由,經商業所在地主管機關核准者,不在此限"}, "answer": "D", "note": ""}, {"id": "bookkeeping-107-47", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 47, "question": "商業登記法所稱商業,係指1以營利為目的 2獨資方式經營之事業 3合夥方式經營之事業 4公司方式\n經營之事業,下列何者正確?", "options": {"A": "僅12", "B": "僅13", "C": "僅123 1", "D": "234"}, "answer": "C", "note": ""}, {"id": "bookkeeping-107-48", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 48, "question": "商業登記法所稱商業負責人,包括下列那些? 1獨資組織之出資人或其法定代理人 2合夥組織之執行\n業務合夥人 3在執行職務範圍內之經理人 4獨資出資者之配偶", "options": {"A": "僅12", "B": "僅123", "C": "僅124", "D": "1234"}, "answer": "B", "note": ""}, {"id": "bookkeeping-107-49", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 49, "question": "記帳士應依照法令及財政部發布之其他攸關資料提供記帳士服務,並持續進修以維持記帳士專業能力及\n服務之效果與品質,此為記帳士職業倫理道德規範中的那一項行為準則?", "options": {"A": "誠正準則", "B": "適任準則", "C": "保密準則", "D": "務實準則"}, "answer": "B", "note": ""}, {"id": "bookkeeping-107-50", "year": "107", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 50, "question": "關於記帳士職業倫理道德規範,下列何者錯誤?", "options": {"A": "記帳士不得以不正當之抑價方式,延攬業務", "B": "記帳士設立分事務所,均應由記帳士親自主持", "C": "記帳士不得聘僱他記帳士事務所之現職人員", "D": "凡違背記帳士職業倫理道德規範者,由所屬地方記帳士公會處理之"}, "answer": "C", "note": ""}, {"id": "chinese-107-1", "year": "107", "subject": "chinese", "subjectName": "國文", "number": 1, "question": "下列選項「」中的詞語,何者用字完全正確?", "options": {"A": "這本小說曾創下破記錄的銷售數字,「風糜一時」", "B": "這支籃球隊伍連戰皆捷,「所向披靡」,稱霸當今籃壇", "C": "這家餐廳以排骨熬粥,其美味讓顧客「不食肉靡」則不快", "D": "這份報告製作用心,資料豐贍,「鉅細糜遺」,深獲眾人肯定"}, "answer": "B", "note": ""}, {"id": "chinese-107-2", "year": "107", "subject": "chinese", "subjectName": "國文", "number": 2, "question": "下列文句中,對他人稱呼自己家屬的用法,何者錯誤?", "options": {"A": "內人擅長料理義大利菜", "B": "令尊已逾耳順之年,仍健步如飛", "C": "家姊喜愛園藝,假日常蒔花弄草", "D": "舍弟今夏大學畢業,正準備參加國家考試"}, "answer": "B", "note": ""}, {"id": "chinese-107-3", "year": "107", "subject": "chinese", "subjectName": "國文", "number": 3, "question": "下列對話『』內成語的使用,何者最恰當?", "options": {"A": "「陳教授,聽說你帶領的研究團隊獲得國際大獎,恭喜恭喜。」「哪裡哪裡,我\n們算是『實至名歸』。」", "B": "「老張默默行善,數十年如一日,今年獲得鎮公所頒發的好人好事獎。」「老張\n『求仁得仁』,我也贊同。」", "C": "「董事長,公司的新措施鬧得人心沸騰,是不是考慮調整一下?」「你是總經理,\n你去幫我『揚湯止沸』不就得了!」", "D": "「老總,你不是昨天才跟李經理吵架,怎麼今天就把這個標案交給他處理?」「為\n了公司的發展,我只好『委曲求全』。」"}, "answer": "D", "note": ""}, {"id": "chinese-107-4", "year": "107", "subject": "chinese", "subjectName": "國文", "number": 4, "question": "下列各組文句「」中的詞語,何者意思兩兩相同?", "options": {"A": "會「數」而禮勤,物薄而情厚/漁父樵夫之舍,皆可指「數」", "B": "吾觀三代以下,世衰道「微」/天下分裂,而唐室固以「微」矣", "C": "「顧」人之常情,由儉入奢易,由奢入儉難/為之四「顧」,為之躊躇滿志", "D": "師者,「所以」傳道、受業、解惑也/視其「所以」,觀其所由,察其所安\n60210"}, "answer": "B", "note": ""}, {"id": "chinese-107-5", "year": "107", "subject": "chinese", "subjectName": "國文", "number": 5, "question": "「孔子說..一個人年紀大了,體力和精神都已經衰退了,應該特別注意對財富、權\n力、名譽、地位都不可貪求,『貪』就是不滿足目前已經得到的,而繼續要求、追\n求更多的財富和權力,更高的名譽和地位。其實,貪和進取之心兩者之間的分界,\n往往是模糊的,每個人都可以也應該有向上提升、向前求進步的心懷,但是把期待\n和目標放得太高太遠,變成過分和不現實,那就是『貪』了。其實,一個人不論在\n什麼年紀,都要記住不要有貪婪之心,不過孔子說,到了老年更應該是如此。」\n上文是在闡述孔子那句話?", "options": {"A": "戒之在得", "B": "貧而無怨", "C": "約之以禮", "D": "過猶不及"}, "answer": "A", "note": ""}, {"id": "chinese-107-6", "year": "107", "subject": "chinese", "subjectName": "國文", "number": 6, "question": "「隨著科技及應用發展,線上社群在真實世界的行動力,近年逐漸受到肯定。從國\n外的反戰、社會運動、美國總統選舉,到國內的搶救樂生、拯救動物......在在證明\n線上社群也能連結線下行動,發揮實體世界的影響力。」\n關於「線上社群」的影響力,下列敘述何者最切近上文旨意?", "options": {"A": "線上社群可以快速的連結,創造議題吸引媒體目光", "B": "線上與線下之間的連結愈快速,實質的影響力愈大", "C": "線上社群對於真實世界的影響力,透過連結線下行動而產生", "D": "線上的真實行動力,來自於社群之間對議題的強大論述能力"}, "answer": "C", "note": ""}, {"id": "chinese-107-7", "year": "107", "subject": "chinese", "subjectName": "國文", "number": 7, "question": "「每個人都是一顆離開槍膛的子彈,停止便意味了墜亡。問題是,我們卻又常常希\n冀自己所擁有的某些物事,能夠靜止地成為永恆,譬如青春啦!財富啦!健康啦!\n愛情啦!然而,誰曾看見奔流的江水能夠永遠擁抱一座靜默的高山!」\n下列敘述,何者最符合上文文意?", "options": {"A": "「奔流的江水」意謂一生的榮華富貴", "B": "「靜默的高山」意謂永恆不變的事物", "C": "「離開槍膛的子彈」是指人們旅行時的自由無拘束", "D": "「希冀自己所擁有的」是指人們總羨慕他人能擁有"}, "answer": "B", "note": ""}, {"id": "chinese-107-8", "year": "107", "subject": "chinese", "subjectName": "國文", "number": 8, "question": "顧肇森:「假期中偶爾早起,趕上她梳頭,即使在做完髻之前,我總得幫她擎起鏡\n子,讓她判斷梳歪了沒有,往往得打散髮髻重做。而且髮根漸漸鬆動,一梳就扯下\n一叢頭髮,使我看得背上直起寒慄。梳成的髻,常是危樓的光景。我仍記得早些年\n第一次在麵疙瘩的湯中看見一縷青絲,不禁像看到河裡浮屍似的哇哇叫起來,母親\n抱歉得不得了,硬要我另換一碗。自那時起,她的髮屢在飯菜中出現,見慣不奇,\n也就不值得大驚小怪了。只是趁她不注意,偷偷的抽起來丟掉。」\n下列敘述,何者最貼近作者面對母親掉髮最終的態度?", "options": {"A": "恐懼憂慮", "B": "視而不見", "C": "習以為常", "D": "不動聲色"}, "answer": "D", "note": ""}, {"id": "chinese-107-9", "year": "107", "subject": "chinese", "subjectName": "國文", "number": 9, "question": "「環保葬是近年來才興起的概念,英國早在 1993 年就推動環保自然葬,是最早推\n動的國家,後續環保葬的概念又慢慢推行至美國、北歐、日本、紐澳等國家。日本\n在 2008 年時,火化率就達到 99.85%,為世界第一;同年瑞典及丹麥火化率皆達 75%\n以上,英國為 72.45%、紐西蘭為 70%、澳洲為 65%。而各國因民情不同,環保葬\n盛行的方式也不同,例如日本靠海因此不少民眾採用海葬,而丹麥、瑞典、挪威三\n國除了紀念花園之外,也設置海岸墓園,提供民眾多元選擇。就內政部資料顯示,\n國人到 2015 年底為止,全國火化率已達 95.65%,可見經過長年推廣,『火化遺體』\n這概念已逐漸為大眾所接受。2015 年推動環保自然葬計 9,136 件,為 2005 年之 20\n倍,其中又以樹葬居多,顯示環保葬的概念獲得愈來愈多民眾認同。」\n下列文句,何者最適合作為上述報導的標題?", "options": {"A": "民情使然,日本環保葬世界第一", "B": "環保葬新趨勢,多元墓地供選擇", "C": "環保自然葬蔚然成風,英國推行有功", "D": "環保葬成趨勢,臺灣 10 年成長 20 倍\n60210"}, "answer": "D", "note": ""}, {"id": "chinese-107-10", "year": "107", "subject": "chinese", "subjectName": "國文", "number": 10, "question": "「從文學史上看,大部分詩人都能很輕易地把握兩種以上的瓊瓦,這也許不表示詩\n人優於別的作家,但至少表示詩人的延伸性大於別的作家。詩是壓縮的語言,但人\n不能永遠說壓縮的語言,尤其當你想到要直接而迅速地服役社會的時候,壓縮的語\n言是不容易奏效的。我常常想,這大概是我也寫散文的原因。我在金門的時候和瘂\n弦談這個問題,他說:『好比臺糖公司,除了出產蔗糖以外,也出產鈣片和甘蔗板。』\n散文是詩人的副產品,大概是無可否認的。」\n依據上文,下列敘述何者不符合作者的看法?", "options": {"A": "所謂「兩片瓊瓦」,指的是新詩與散文", "B": "詩人善於運用壓縮的語言,並能較輕鬆地掌握其他文類", "C": "散文寫作耗時,難以服役社會,故詩人視散文為副產品", "D": "認同瘂弦以臺糖公司為譬,將新詩視為蔗糖,散文視為鈣片或甘蔗板"}, "answer": "C", "note": ""}, {"id": "chinese-107-11", "year": "107", "subject": "chinese", "subjectName": "國文", "number": 11, "question": "「於是,我找到了帕多瓦,在這裡遇見了喬托。他透過樸實無華的筆觸,向世界歌\n頌人的心靈。在喬托之前,中世紀的藝術作品純粹是神蹟的展現,畫面中的人物缺\n乏情感、面無表情,他們都只是構成事件的道具。喬托的作品讓我們相信:生命的\n救贖,就存在於我們習以為常的生活當中;真正的偉大,就是在熙熙攘攘的紅塵裡,\n做一個平凡自在的人。這位偉大的畫家,達文西稱他為『藝術之父』,沒有他的啟\n迪,很有可能就沒有文藝復興。或許,我們還要在黑暗中摸索相當的歲月,才能走\n出中世紀的幽黯。」\n根據上文,下列說明何者正確?", "options": {"A": "達文西因喬托對黑暗時期的貢獻,讚他為「藝術之父」", "B": "喬托擅長描繪面無表情的小人物,藉以傳達對神的崇敬", "C": "在達文西的筆觸下,人物的心靈與情感總是趨向於神性", "D": "文藝復興的藝術關注,由現實生活與人物心靈轉向宗教"}, "answer": "A", "note": ""}, {"id": "chinese-107-12", "year": "107", "subject": "chinese", "subjectName": "國文", "number": 12, "question": "「愛情,愛情,你只使我體驗什麼什麼,而不去問『為什麼』。『為什麼』在愛情\n中止息,『為什麼』所生的空虛,在愛情中充實。我幾次想逃出愛情之外,自問我\n為什麼要愛她,我愈問愈得不著答案。因為我之愛她,即因『我』不知為什麼;我\n就是因為她能使『我』不問為什麼,才會愛她。在愛情中,最初也不知我的目的安\n在。我可以在朦朧中覺到我之目的,是得那神祕的心。然而我不能以我任何身外之\n物為手段。我要得她之心,只有把我之情懷,向她傾吐,把我之精神,向她貢獻。\n我只能以我『現在之整個自我』為手段,以換取『對方之自我』為目的。」\n根據上文,下列選項何者錯誤?", "options": {"A": "愛情是完全盲目的", "B": "人在愛情中避免了生命的空虛", "C": "真正的愛情是把自己交付給對方", "D": "愛情中不問為什麼是因為愛情是無功利性的"}, "answer": "A", "note": ""}, {"id": "chinese-107-13", "year": "107", "subject": "chinese", "subjectName": "國文", "number": 13, "question": "「目前有些人以為,大自然的平衡是早期世界比較單純時的事,而現在已經有太多\n的改變,沒有必要再去談它。又有些人以為這只是一種假說,不足為據。今天大自\n然的平衡當然和洪荒時期不一樣,但是仍然存在著,生物間複雜、精確,而且具高\n度整合性的關係,不能隨便忽略。就好像站在懸崖邊緣的人,若藐視重力定律,能\n不受到處罰嗎?自然的平衡不是一種固定的狀況,而是流動的,不斷變化的,一直\n都在調適當中。人類也是平衡中的一部分,有時平衡對人有利,有時往往由於人自\n己的所做所為,使平衡轉為不利。」\n下列敘述,何者最不符合上文所謂「自然的平衡」?", "options": {"A": "天地之精所以生物者,莫貴於人", "B": "天何言哉?四時行焉,百物生焉", "C": "天行有常,不為堯存,不為桀亡", "D": "天之道其猶張弓與,高者抑之,下者舉之\n60210"}, "answer": "A", "note": ""}, {"id": "chinese-107-14", "year": "107", "subject": "ch
