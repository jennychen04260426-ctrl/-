「然」(歐陽脩〈醉翁亭記〉)", "D": "念天地之悠悠,獨愴「然」而涕下(陳子昂〈登幽州臺歌〉)"}, "answer": "B", "note": ""}, {"id": "chinese-97-10", "year": "97", "subject": "chinese", "subjectName": "國文", "number": 10, "question": "下列文句中的「食」字,與「左右以君賤之也,食以草具」中之「食」字同義的是:", "options": {"A": "黔敖為食於路,以待餓者而「食」之", "B": "一簞「食」,一瓢飲", "C": "君子之過,如日月之「食」", "D": "吾與汝就「食」江南"}, "answer": "A", "note": ""}, {"id": "chinese-97-11", "year": "97", "subject": "chinese", "subjectName": "國文", "number": 11, "question": "下列文句,何者與《論語.述而》:「三人行,必有我師焉」的旨意相近?", "options": {"A": "德不孤,必有鄰", "B": "學而時習之,不亦樂乎", "C": "見賢思齊焉,見不賢而內自省也", "D": "志士仁人,無求生以害仁,有殺身以成仁"}, "answer": "C", "note": ""}, {"id": "chinese-97-12", "year": "97", "subject": "chinese", "subjectName": "國文", "number": 12, "question": "下列關於書信用語的敘述,何者正確?", "options": {"A": "學生對老師可自稱「受業」", "B": "學生對老師的提稱語可用「足下」", "C": "信中稱他人父子,應用「賢昆仲」", "D": "寄信給長官的啟封詞,應用「敬啟」"}, "answer": "A", "note": ""}, {"id": "chinese-97-13", "year": "97", "subject": "chinese", "subjectName": "國文", "number": 13, "question": "下列文句中的「以」字,可解釋作「因為」的是:", "options": {"A": "陶侃居官無事,輒朝運百甓於齋外,暮運之於齋內,「以」習勤勞", "B": "晏子使楚,楚人「以」晏子短,為小門于大門之側而延晏子", "C": "任伐一木,施「以」人工,即可合用", "D": "自吾鄉「以」南,有太湖;自吾鄉以北,有東山"}, "answer": "B", "note": ""}, {"id": "chinese-97-14", "year": "97", "subject": "chinese", "subjectName": "國文", "number": 14, "question": "下列各選項中的「見」字,用法與其他三者不同的是:", "options": {"A": "信而「見」疑,忠而被謗(《史記.屈原賈生列傳》)", "B": "「見」不賢而內自省也(《論語.里仁》)", "C": "憨狀可掬,其「見」笑於市人(蒲松齡《聊齋誌異》)", "D": "門人問曰:夫子何以知其將「見」殺(《孟子.盡心下》)"}, "answer": "B", "note": ""}, {"id": "chinese-97-15", "year": "97", "subject": "chinese", "subjectName": "國文", "number": 15, "question": "「吾將瞷良人之所之也。」(《孟子.離婁下》)「所之」的「之」字,其意義\n與下列何者相同?", "options": {"A": "壯者散而「之」四方者幾萬人矣", "B": "人莫知其子「之」惡", "C": "人「之」其所親愛而辟焉", "D": "「之」子于歸,宜其家人"}, "answer": "A", "note": ""}, {"id": "tax-97-1", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 1, "question": "依所得稅法規定,個人持有公債、公司債及金融債券之利息所得應如何課稅?", "options": {"A": "併入綜合所得中課稅", "B": "免稅", "C": "應依本法第 88 條規定扣繳稅款,不併計綜合所得總額", "D": "27 萬元免稅"}, "answer": "C", "note": ""}, {"id": "tax-97-2", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 2, "question": "依加值型及非加值型營業稅法規定,為防止逃漏、控制稅源及促進統一發票之推行,財政部得訂定統一發\n票給獎辦法;其經費由全年營業稅收入總額中提出多少比率,以資支應?", "options": {"A": "千分之一", "B": "百分之零點五", "C": "百分之一", "D": "百分之三"}, "answer": "D", "note": ""}, {"id": "tax-97-3", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 3, "question": "依所得稅法規定,經目的事業主管機關核准發行認購(售)權證者,發行人發行認購(售)權證,於該權\n證發行日至到期日期間,基於風險管理而買賣經目的事業主管機關核可之有價證券及衍生性金融商品之交\n易所得或損失應如何處理?", "options": {"A": "應併計發行認購(售)權證之損益課稅", "B": "停止課徵所得稅,證券交易損失亦不得自所得額中減除", "C": "停止課徵所得稅,但證券交易損失可以自所得額中減除", "D": "停止課徵所得稅,但期貨交易損失可以自所得額中減除"}, "answer": "A", "note": ""}, {"id": "tax-97-4", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 4, "question": "依我國相關稅法規定,王先生接受某營利事業贈與 600 萬元,試問應如何課稅?(設贈與稅免稅額每人每\n年 111 萬元)", "options": {"A": "接受營利事業贈與屬於免稅所得,不必課稅", "B": "由王先生申報繳納贈與稅", "C": "由某營利事業申報繳納贈與稅", "D": "由王先生申報繳納綜合所得稅"}, "answer": "D", "note": ""}, {"id": "tax-97-5", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 5, "question": "依所得稅法規定,存貨採取下列何種評價方式,不能適用成本與時價孰低之估價規定?", "options": {"A": "先進先出法", "B": "後進先出法", "C": "簡單平均法", "D": "移動平均法"}, "answer": "B", "note": ""}, {"id": "tax-97-6", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 6, "question": "依所得稅法規定,營利事業之累積未分配盈餘已加徵百分之十營利事業所得稅者,其稅額扣抵比率之上限\n為?", "options": {"A": "33.33%", "B": "48.15%", "C": "25%", "D": "10%"}, "answer": "B", "note": ""}, {"id": "tax-97-7", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 7, "question": "依所得稅法施行細則規定,營利事業同業利潤標準之訂定機關與程序為何?", "options": {"A": "由財政部訂定,報請行政院備查", "B": "由行政院訂定,報請立法院備查", "C": "授權由財政部訂定", "D": "由各地區國稅局訂定,報請財政部備查"}, "answer": "D", "note": ""}, {"id": "tax-97-8", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 8, "question": "下列各項有關營利事業自當年度股東可扣抵稅額帳戶減除之日期,何者錯誤?", "options": {"A": "分配屬八十七年度或以後年度股利總額或盈餘總額所含之可扣抵稅額,為宣告日", "B": "八十七年度或以後年度結算申報應納中華民國營利事業所得稅,經稽徵機關調查核定減少之稅額,為核\n定退稅通知書送達日", "C": "依公司法或其他法令規定,提列之法定盈餘公積、公積金等所含之當年度已納營利事業所得稅額,為提\n列日", "D": "依公司章程規定,分派董監事職工之紅利所含之當年度已納營利事業所得稅額,為分派日"}, "answer": "A", "note": ""}, {"id": "tax-97-9", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 9, "question": "依稅捐稽徵法規定,中華民國境內居住之個人,其已確定之應納稅捐逾法定繳納期限尚未繳納完畢,所欠繳\n稅款及已確定之罰鍰單計或合計在新臺幣多少金額以上,得由財政部函請內政部入出國及移民署限制其出境?", "options": {"A": "50 萬元", "B": "75 萬元", "C": "100 萬元", "D": "200 萬元"}, "answer": "C", "note": ""}, {"id": "tax-97-10", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 10, "question": "李小明參加百貨公司週年慶抽獎活動,幸運抽得汽車一部價值 60 萬元,試問 此 中 獎 所得 應 如 何 課徴 綜 合所\n得稅?", "options": {"A": "20%分離課稅,不再併入綜合所得總額中課稅", "B": "免納所得稅", "C": "15%分離課稅,不再併入綜合所得總額中課稅", "D": "併入綜合所得總額中課稅"}, "answer": "D", "note": ""}, {"id": "tax-97-11", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 11, "question": "依所得稅法規定,稽徵機關進行調查或復查時,納稅義務人應提示有關各種證明所得額之帳簿、文據;其\n未提示者,稽徵機關得依查得之資料或下列何種標準,核定其所得額?", "options": {"A": "各行業所得額標準", "B": "同業利潤標準", "C": "基本所得額", "D": "近 3 年純益率"}, "answer": "B", "note": ""}, {"id": "tax-97-12", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 12, "question": "依稅捐稽徵法規定,營利事業取得非實際交易對象所開立之憑證,如經查明確有進貨事實及該項憑證確由實\n際銷貨之營利事業所交付,且實際銷貨之營利事業已依法處罰者,除補徵本稅之外應按下列何種方式處理?", "options": {"A": "依加值型及非加值型營業稅法第 51 條第 5 款虛報進項稅額者,按所漏稅額處 1 至 10 倍罰鍰", "B": "依照稅捐稽徵法第 44 條規定依查明認定之總額,處百分之五罰鍰", "C": "上述兩者擇一從重處罰", "D": "免按未依規定取得憑證處罰"}, "answer": "D", "note": ""}, {"id": "tax-97-13", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 13, "question": "按稅捐稽徵法規定,依法應由納稅義務人實貼之印花稅,及應由稅捐稽徵機關依稅籍底冊或查得資料核定\n課徵之稅捐,其核課期間為幾年?", "options": {"A": "2 年", "B": "3 年", "C": "5 年", "D": "7 年"}, "answer": "C", "note": ""}, {"id": "tax-97-14", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 14, "question": "依稅捐稽徵法規定,納稅義務人對核准延期或分期繳納之任何一期應繳稅捐,未如期繳納者,稅捐稽徵機\n關應於該期繳納期間屆滿之翌日起三日內,就未繳清之餘額稅款,發單通知納稅義務人,限幾日內一次全\n部繳清?", "options": {"A": "5 日", "B": "10 日", "C": "20 日", "D": "30 日"}, "answer": "B", "note": ""}, {"id": "tax-97-15", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 15, "question": "下列那一種固定資產折舊方法不是所得稅法所規定的方法之一?", "options": {"A": "年數合計法", "B": "定率遞減法", "C": "平均法", "D": "工作時間法"}, "answer": "A", "note": ""}, {"id": "tax-97-16", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 16, "question": "依稅捐稽徵法規定,教唆或幫助納稅義務人以詐術或其他不正當方法逃漏稅捐者,處幾年以下有期徒刑、\n拘役或科新台幣六萬元以下罰金?", "options": {"A": "1 年", "B": "3 年", "C": "5 年", "D": "7 年"}, "answer": "B", "note": ""}, {"id": "tax-97-17", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 17, "question": "某甲對於台北市稅捐稽徵處之房屋稅核定不服,在申請復查之後若仍不服,應向下列那一機關提起訴願?", "options": {"A": "財政部", "B": "行政法院", "C": "台北市稅捐處", "D": "台北市政府"}, "answer": "D", "note": ""}, {"id": "tax-97-18", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 18, "question": "依加值型及非加值型營業稅法第 40 條規定,查定計算營業稅額之特種飲食業,由主管稽徵機關查定其銷售\n額及稅額,應於多久期間填發繳款書通知繳納一次?", "options": {"A": "每月", "B": "每二個月", "C": "每三個月", "D": "每半年"}, "answer": "A", "note": ""}, {"id": "tax-97-19", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 19, "question": "依加值型及非加值型營業稅法規定,查定計算營業稅額之小規模營業人,購買營業上使用之貨物或勞務,\n取得載有營業稅額之憑證,並依規定申報者,主管稽徵機關應按其進項稅額之多少比例,在查定稅額內扣\n減?", "options": {"A": "百分之一", "B": "百分之五", "C": "百分之十", "D": "百分之二十"}, "answer": "C", "note": ""}, {"id": "tax-97-20", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 20, "question": "依稅捐稽徵法規定,納稅義務人及其他關係人提供帳簿、文據供稽徵機關調查時,該管稽徵機關或財政部\n賦稅署應掣給收據,除涉嫌違章漏稅者外,應於帳簿、文據提送完全之日起幾日內發還之?", "options": {"A": "7 日內", "B": "10 日內", "C": "20 日內", "D": "30 日內"}, "answer": "A", "note": ""}, {"id": "tax-97-21", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 21, "question": "依稅捐稽徵法規定,自繳納期間屆滿之翌日起算;應徵之稅捐未於徵收期間幾年內徵起者,不得再行徵收?", "options": {"A": "1 年", "B": "3 年", "C": "5 年", "D": "7 年"}, "answer": "C", "note": ""}, {"id": "tax-97-22", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 22, "question": "營業人專營加值型及非加值型營業稅法第 8 條第 1 項免稅貨物或勞務者,其營業稅之進項稅額應如何扣抵?", "options": {"A": "留抵下期", "B": "不得扣抵", "C": "按比率扣抵", "D": "可全額扣抵銷項稅額"}, "answer": "B", "note": ""}, {"id": "tax-97-23", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 23, "question": "依加值型及非加值型營業稅法規定,下列何者非屬營業稅免稅範圍?", "options": {"A": "出售之土地", "B": "托兒所、養老院、殘障福利機構提供之育、養勞務", "C": "郵政、電信機關依法經營之業務及政府核定之代辦業務", "D": "依法設立之免稅商店銷售與過境或出境旅客之貨物"}, "answer": "D", "note": ""}, {"id": "tax-97-24", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 24, "question": "設大明自助餐店屬於查定課徵稅額之小規模營業人,若其查定之每月營業額為 10 萬元,試問大明自助餐店\n依加值型及非加值型營業稅法規定,每期應繳納多少營業稅?", "options": {"A": "未達起徵點,不必課稅", "B": "1000 元", "C": "3000 元", "D": "5000 元"}, "answer": "C", "note": ""}, {"id": "tax-97-25", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 25, "question": "按稅捐稽徵法規定,依核定稅額通知書所載有應納稅額或應補徵稅額者,應於繳款書送達後,於繳納期間\n屆滿翌日起算多久時間內,申請復查?", "options": {"A": "10 日內", "B": "30 日內", "C": "2 個月內", "D": "3 個月內"}, "answer": "B", "note": ""}, {"id": "tax-97-26", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 26, "question": "依所得稅相關法規規定,營利事業存貨估價方法未經申請由稽徵機關核准者,視為採用下列那一種估價方\n法?", "options": {"A": "加權平均法", "B": "先進先出法", "C": "後進先出法", "D": "個別認定法"}, "answer": "A", "note": ""}, {"id": "tax-97-27", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 27, "question": "依所得稅法施行細則規定,營利事業帳載應付未付之費用或損失,逾多久期限而尚未給付者,應轉列其他\n收入科目,俟實際給付時,再以營業外支出列帳?", "options": {"A": "3 個月", "B": "6 個月", "C": "1 年", "D": "2 年"}, "answer": "D", "note": ""}, {"id": "tax-97-28", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 28, "question": "依加值型及非加值型營業稅法規定,農產品批發市場之承銷人向農產品批發市場承購農產品,在同一市場\n或運往其他批發市場交易之銷售額,其營業稅稅率為何?", "options": {"A": "免稅", "B": "0.1%", "C": "1%", "D": "5%"}, "answer": "B", "note": ""}, {"id": "tax-97-29", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 29, "question": "依所得稅相關法規規定,營利事業在臺灣地區以新臺幣支付國外佣金者,應在不超過出口貨物價款多少比\n例範圍內並取具國外代理商或代銷商名義出具之收據為憑予以認定?", "options": {"A": "百分之三", "B": "百分之五", "C": "百分之十", "D": "百分之十五"}, "answer": "A", "note": ""}, {"id": "tax-97-30", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 30, "question": "依稅捐稽徵法規定,納稅義務人因天災、事變或遭受重大財產損失,不能於法定期間內繳清稅捐者,得於\n規定納稅期間內,向稅捐稽徵機關申請延期或分期繳納,其延期或分期繳納之期間,不得逾幾年?", "options": {"A": "半年", "B": "一年", "C": "二年", "D": "三年"}, "answer": "D", "note": ""}, {"id": "tax-97-31", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 31, "question": "依加值型及非加值型營業稅法規定,老張將自己開設電器行內用於銷售的電視機,無償移轉給其朋友使用\n,該電視機成本 20,000 元,售價 25,000 元(不含稅),試問下列敘述何者為誤?", "options": {"A": "有銷項稅額 1,250 元", "B": "須開立統一發票", "C": "此事件不算銷貨", "D": "視為銷售貨物"}, "answer": "C", "note": ""}, {"id": "tax-97-32", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 32, "question": "依所得稅相關法規規定,營利事業為員工投保之團體壽險,其由營利事業負擔之保險費,以營利事業或被\n保險員工及其家屬為受益人者,准予認定。每人每月保險費在新臺幣多少元以內部分,免視為被保險員工\n之薪資所得?", "options": {"A": "500 元", "B": "1,000 元", "C": "1,500 元", "D": "2,000 元"}, "answer": "D", "note": ""}, {"id": "tax-97-33", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 33, "question": "依所得稅相關法規規定,已依職工福利金條例之規定,成立職工福利委員會之營利事業得依創立時實收資\n本總額之多少限度內一次提撥職工福利金?", "options": {"A": "百分之零點五", "B": "百分之一", "C": "百分之五", "D": "百分之十"}, "answer": "C", "note": ""}, {"id": "tax-97-34", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 34, "question": "承上題,營利事業提撥職工福利金後每年得在不超過提撥金額之多少限度內,以費用列支?", "options": {"A": "百分之十", "B": "百分之二十", "C": "百分之二十五", "D": "百分之五十"}, "answer": "B", "note": ""}, {"id": "tax-97-35", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 35, "question": "依所得稅法施行細則規定,信託行為之受託人以信託財產投資於應設置股東可扣抵稅額帳戶之營利事業者,\n該營利事業應以下列何者為納稅義務人,填發股利憑單?", "options": {"A": "受益人", "B": "受託人", "C": "委託人", "D": "免填發扣繳憑單"}, "answer": "B", "note": ""}, {"id": "tax-97-36", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 36, "question": "依所得稅法規定,營利事業銷貨未給予他人銷貨憑證或未將銷貨憑證存根保存者,稽徵機關得按當年度當\n地同時期同業帳載或新聞紙刊載或其他可資參證之該項貨品之下列那一種價格,核定其銷貨價格?", "options": {"A": "最低價格", "B": "市場平均價格", "C": "最高價格", "D": "三年平均售價"}, "answer": "C", "note": ""}, {"id": "tax-97-37", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 37, "question": "依所得稅相關法規規定,經營小客車租賃業務之營利事業,自中華民國 93 年 1 月 1 日起新購置營業用乘人\n小客車,依規定耐用年數計提折舊時,其實際成本以不超過新臺幣多少元為限?", "options": {"A": "150 萬元", "B": "200 萬元", "C": "300 萬元", "D": "500 萬元"}, "answer": "D", "note": ""}, {"id": "tax-97-38", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 38, "question": "依所得稅法規定,個人財產出租收有押金者,其押金應如何課徵綜合所得稅?", "options": {"A": "將押金總額計入租賃所得中課稅", "B": "將押金總額計入其他所得課稅", "C": "將押金設算利息計入租賃所得中課稅", "D": "將押金設算利息計入其他所得中課稅"}, "answer": "C", "note": ""}, {"id": "tax-97-39", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 39, "question": "依所得稅相關法規規定,凡應歸屬於本年度之費用或損失,除會計基礎經核准採用現金收付制者外,應於\n年度決算時,就估列數字以下列那一種科目列帳?", "options": {"A": "其他費用", "B": "應付費用", "C": "預付費用", "D": "暫時毋須入帳"}, "answer": "B", "note": ""}, {"id": "tax-97-40", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 40, "question": "依所得稅相關法規規定,非金融業之營利事業提撥備抵呆帳餘額,最高不得超過應收帳款及應收票據餘額\n的多少百分比?", "options": {"A": "百分之一", "B": "百分之二", "C": "百分之三", "D": "百分之五"}, "answer": "A", "note": ""}, {"id": "tax-97-41", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 41, "question": "依所得稅相關法規規定,下列那一項可以列為營利事業之費用?", "options": {"A": "營利事業繳納之罰鍰", "B": "營利事業繳納之營利事業所得稅", "C": "營利事業分配之盈餘", "D": "營利事業對政府的捐贈"}, "answer": "D", "note": ""}, {"id": "tax-97-42", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 42, "question": "甲公司 96 年度在中華民國境內之課稅所得為 500 萬元(新台幣;以下同),甲公司在大陸地區設立的分公\n司所得為 100 萬元,當年度已在大陸地區繳納 30 萬元的企業所得稅,試問甲公司今年應補繳多少營利事業\n所得稅?", "options": {"A": "124 萬元", "B": "119 萬元", "C": "24 萬元", "D": "94 萬元"}, "answer": "A", "note": ""}, {"id": "tax-97-43", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 43, "question": "依所得稅相關法規規定,營利事業遭受地震、風災、水災、火災、旱災、蟲災及戰禍等不可抗力之災害損\n失,一般情形應於事實發生後之次日起幾日內,檢具清單及證明文件報請該管稽徵機關派員勘查?", "options": {"A": "10 日", "B": "15 日", "C": "30 日", "D": "60 日"}, "answer": "B", "note": ""}, {"id": "tax-97-44", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 44, "question": "97 年度物價指數漲幅頗大,財政部預計於 98 年度要調整綜合所得稅免稅額,試問依所得稅法規定個人免稅\n額每遇消費者物價指數較上次調整年度之指數上漲累計達多少以上時須調整之?", "options": {"A": "1%", "B": "3%", "C": "5%", "D": "10%"}, "answer": "B", "note": ""}, {"id": "tax-97-45", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 45, "question": "依所得稅法規定,下列那一類之營利事業或機關、團體,應設置股東可扣抵稅額帳戶..", "options": {"A": "依法令或組織章程規定,不得分配盈餘之團體或組織", "B": "獨資、合夥組織", "C": "所得稅法第 11 條第 4 項規定之教育、文化、公益、慈善機關或團體", "D": "總機構在中華民國境內之公司組織"}, "answer": "D", "note": ""}, {"id": "tax-97-46", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 46, "question": "依加值型及非加值型營業稅法規定,主管稽徵機關為停止營業處分時,應訂定期限,最長不得超過幾個月?", "options": {"A": "1 個月", "B": "3 個月", "C": "6 個月", "D": "1 年"}, "answer": "C", "note": ""}, {"id": "tax-97-47", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 47, "question": "依加值型及非加值型營業稅法第 39 條規定,營業人因取得固定資產而溢付之營業稅,應如何處理?", "options": {"A": "留抵下期", "B": "由主管稽徵機關查明後退還之", "C": "不得退還", "D": "退還 10%"}, "answer": "B", "note": ""}, {"id": "tax-97-48", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 48, "question": "依加值型及非加值型營業稅法第 35 條規定,營業人銷售貨物或勞務適用零稅率者,得申請以多久期間為一\n期,向主管稽徵機關申報銷售額、應納或溢付營業稅額?", "options": {"A": "15 日", "B": "1 個月", "C": "2 個月", "D": "3 個月"}, "answer": "B", "note": ""}, {"id": "tax-97-49", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 49, "question": "依所得稅法規定,總機構在中華民國境外之營利事業,在中華民國境內經營國際運輸業務部分,其成本費\n用分攤計算困難者,不論其在中華民國境內是否設有分支機構或代理人,得向財政部申請核准按其在中華\n民國境內之營業收入的百分之幾為中華民國境內之營利事業所得額課稅?", "options": {"A": "百分之十", "B": "百分之十五", "C": "百分之四十五", "D": "百分之五十"}, "answer": "A", "note": ""}, {"id": "tax-97-50", "year": "97", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 50, "question": "依稅捐稽徵法規定,納稅義務人自動向稅捐稽徵機關補報並補繳所漏稅款者,凡屬未經檢舉、未經稽徵機\n關或財政部指定之調查人員進行調查之案件,其處理之方式為何?", "options": {"A": "只處以行政罰", "B": "處以刑事罰", "C": "免予處罰,亦不必加計利息", "D": "免予處罰,但加計利息"}, "answer": "D", "note": ""}, {"id": "accounting-98-1", "year": "98", "subject": "accounting", "subjectName": "會計學概要", "number": 1, "question": "王先生赴好樂迪公司唱歌,結帳時公司向他收取$2,000 現金,試問有關好樂迪公司之會計處理,下列敘\n述何者正確?", "options": {"A": "公司負債增加$2,000,現金增加$2,000", "B": "公司股東權益增加$2,000,現金增加$2,000", "C": "公司資產減少$2,000,股東權益減少$2,000", "D": "公司股本資本增加$2,000,現金減少$2,000"}, "answer": "B", "note": ""}, {"id": "accounting-98-2", "year": "98", "subject": "accounting", "subjectName": "會計學概要", "number": 2, "question": "我國財務會計準則公報之規定,下列何者為企業的基本財務報表?", "options": {"A": "試算表", "B": "調整後試算表", "C": "結帳後試算表", "D": "現金流量表"}, "answer": "D", "note": ""}, {"id": "accounting-98-3", "year": "98", "subject": "accounting", "subjectName": "會計學概要", "number": 3, "question": "企業在會計期間終了時,為簡化會計處理程序而編製之工作底稿,其中調整前試算表欄的資料可由下列\n何處取得?", "options": {"A": "資產負債表及損益表", "B": "普通日記簿", "C": "總分類帳", "D": "特種日記簿"}, "answer": "C", "note": ""}, {"id": "accounting-98-4", "year": "98", "subject": "accounting", "subjectName": "會計學概要", "number": 4, "question": "請閱讀下方原卷的選擇題第 4 題，再選 A、B、C 或 D。", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "A", "note": "", "paper": "098220_2001_會計學概要.pdf", "images": ["pages/98/2001-3.jpg"]}, {"id": "accounting-98-5", "year": "98", "subject": "accounting", "subjectName": "會計學概要", "number": 5, "question": "台中公司於 5 月 1 日向高雄公司賒購貨品$100,000,付款條件為 1/10,n/30,假定台中公司於 5 月 10 日\n前付清此筆交易貨款,則應支付多少金額?", "options": {"A": "$90,000", "B": "$99,000", "C": "$100,000", "D": "$101,000"}, "answer": "B", "note": ""}, {"id": "accounting-98-6", "year": "98", "subject": "accounting", "subjectName": "會計學概要", "number": 6, "question": "新竹公司 97 年 1 月 1 日期初存貨$50,000,97 年度之進貨$1,000,000,進貨退出$50,000,進貨折讓$10,000,\n進貨運費$20,000,銷貨$950,000,銷貨退回$30,000,試問新竹公司 97 年度可供銷貨商品成本為何?", "options": {"A": "$920,000", "B": "$960,000", "C": "$1,010,000", "D": "$1,050,000"}, "answer": "C", "note": ""}, {"id": "accounting-98-7", "year": "98", "subject": "accounting", "subjectName": "會計學概要", "number": 7, "question": "明台公司部分之會計科目如下:現金 應收帳款 辦公設備 應付帳款 預付費用 預收\n收入 服務收入 薪資費用 折舊費用 股利,試指出上述那些會計科目是永久性(實)帳戶?", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "B", "note": ""}, {"id": "accounting-98-8", "year": "98", "subject": "accounting", "subjectName": "會計學概要", "number": 8, "question": "請問期末結帳分錄應編製何種傳票?", "options": {"A": "現金收入傳票", "B": "現金支出傳票", "C": "混合交易傳票", "D": "轉帳傳票"}, "answer": "D", "note": ""}, {"id": "accounting-98-9", "year": "98", "subject": "accounting", "subjectName": "會計學概要", "number": 9, "question": "正德公司應收帳款呆帳提列採應收帳款百分比法,估計呆帳率為 2 %,該公司 2008 年底應收帳款餘額為\n$2,500,000,調整前備抵呆帳有貸方餘額$10,000,試問公司 2008 年底應提列多少呆帳費用?", "options": {"A": "$30,000", "B": "$40,000", "C": "$50,000", "D": "$60,000"}, "answer": "B", "note": ""}, {"id": "accounting-98-10", "year": "98", "subject": "accounting", "subjectName": "會計學概要", "number": 10, "question": "興安公司 2008 年平均應收帳款淨額為$1,000,000,應收帳款週轉天數為 25 天,試問興安公司 2008 年度\n之賒銷淨額為多少?", "options": {"A": "$14,000,000", "B": "$14,200,000", "C": "$14,600,000", "D": "$14,800,000"}, "answer": "C", "note": ""}, {"id": "accounting-98-11", "year": "98", "subject": "accounting", "subjectName": "會計學概要", "number": 11, "question": "公司每股帳面價值係指下列何者?", "options": {"A": "每股普通股之市價", "B": "每股普通股擁有之公司淨資產", "C": "每股普通股之面額", "D": "每股普通股賺得之淨利"}, "answer": "B", "note": ""}, {"id": "accounting-98-12", "year": "98", "subject": "accounting", "subjectName": "會計學概要", "number": 12, "question": "下列何項敘述是會計折舊之正確目的?", "options": {"A": "將固定資產成本作系統而合理的分攤", "B": "使固定資產帳面價值反映其公平價值", "C": "累積資金以備固定資產將來重置之用", "D": "使公司各期損益金額具有平穩化作用"}, "answer": "A", "note": ""}, {"id": "accounting-98-13", "year": "98", "subject": "accounting", "subjectName": "會計學概要", "number": 13, "question": "依據我國無形資產會計準則公報之規定,下列敘述何者正確?", "options": {"A": "研究發展支出在會計處理上,一律必須資本化", "B": "外購的商譽不能入帳,自行發展的商譽才能入帳", "C": "「人力資源」與「顧客忠誠度」均不能列為無形資產", "D": "商譽須依直線法以 20 年期間進行攤銷"}, "answer": "C", "note": ""}, {"id": "accounting-98-14", "year": "98", "subject": "accounting", "subjectName": "會計學概要", "number": 14, "question": "中華公司於 96 年初購買一部機器設備,購價$240,000,支付安裝成本$8,000,該機器設備估計耐用年限 4\n年,無殘值,以平均法計提折舊,99 年初發現該機器設備尚可使用 3 年,殘值變為$2,000,則機器設備\n在 99 年底應計提之折舊為多少?", "options": {"A": "$15,000", "B": "$16,000", "C": "$18,000", "D": "$20,000"}, "answer": "D", "note": ""}, {"id": "accounting-98-15", "year": "98", "subject": "accounting", "subjectName": "會計學概要", "number": 15, "question": "成功公司於 98 年初以$3,225,000 購得大理石礦場一座,預計可開採 200,000 噸。開採後復原成本估計為\n$400,000。整理土地後可售得$ 125,000。98 年度共開採 12,000 噸,售出 10,000 噸。其他生產成本每噸為\n$5。則成功公司 98 年度銷貨成本應為多少?", "options": {"A": "$225,000", "B": "$175,000", "C": "$210,000", "D": "$270,000"}, "answer": "A", "note": ""}, {"id": "accounting-98-16", "year": "98", "subject": "accounting", "subjectName": "會計學概要", "number": 16, "question": "對或有事項之會計處理,下列何種情況應估計入帳?", "options": {"A": "損失金額可合理估計,且該事項少有可能發生", "B": "該或有事項性質特殊,且很少可能發生", "C": "損失金額可合理估計,且該事項相當可能發生", "D": "該或有事項性質特殊,且很有可能發生,但損失金額很難估計"}, "answer": "C", "note": ""}, {"id": "accounting-98-17", "year": "98", "subject": "accounting", "subjectName": "會計學概要", "number": 17, "question": "依據會計觀念,下列何種事項會使保留盈餘發生增減變動?", "options": {"A": "提撥法定公積", "B": "進行股票分割", "C": "宣告發放股票股利", "D": "進行資產重估"}, "answer": "C", "note": ""}, {"id": "accounting-98-18", "year": "98", "subject": "accounting", "subjectName": "會計學概要", "number": 18, "question": "勝利公司所發行特別股之股利率為 9%,累積部分參加,參加部分為 2%,每股面額$10,共發行 20,000\n股,普通股每股面額$10,發行 50,000 股,勝利公司以往均發放股利,98 年度決定以$88,000 宣告現金股\n利,普通股與特別股每股股利分別為多少?", "options": {"A": "$1.32、$1.10", "B": "$1.25、$1.10", "C": "$1.32、$1.20", "D": "$1.20、$1.32"}, "answer": "A", "note": ""}, {"id": "accounting-98-19", "year": "98", "subject": "accounting", "subjectName": "會計學概要", "number": 19, "question": "有關庫藏股票交易之敘述,下列何者正確?", "options": {"A": "庫藏股票應視為資產之減少", "B": "期末未出售之庫藏股應列為資本公積之減項", "C": "計算每股盈餘時,無須將庫藏股票排除", "D": "庫藏股票再出售時,如售價低於原取得成本,此部分應借記資本公積或保留盈餘"}, "answer": "D", "note": ""}, {"id": "accounting-98-20", "year": "98", "subject": "accounting", "subjectName": "會計學概要", "number": 20, "question": "光復公司採分步成本制生產產品,其材料與加工成本均依完工進度比例投入,98 年 10 月份生產完成產品\n10,000 件,98 年 9 月底有在製品 2,000 件,完工程度 25%,10 月底有在製品 3,000 件,完工程度 30%,\n試問在先進先出法下其約當產量應為多少件?", "options": {"A": "9,000 件", "B": "9,600 件", "C": "10,900 件", "D": "10,400 件"}, "answer": "D", "note": ""}, {"id": "accounting-98-21", "year": "98", "subject": "accounting", "subjectName": "會計學概要", "number": 21, "question": "長期債券投資溢價攤銷在間接法的現金流量表上應如何列示?", "options": {"A": "列為純益之加項", "B": "列為投資活動之現金流出", "C": "列為投資活動之現金流入", "D": "列為融資活動之現金流入"}, "answer": "A", "note": ""}, {"id": "accounting-98-22", "year": "98", "subject": "accounting", "subjectName": "會計學概要", "number": 22, "question": "建業公司 98 年之期初存貨為$60,000,期末存貨為$90,000,銷貨收入為$500,000,毛利率 25%,則存貨週\n轉率為多少?", "options": {"A": "6 次", "B": "5 次", "C": "4 次", "D": "2.5 次"}, "answer": "B", "note": ""}, {"id": "accounting-98-23", "year": "98", "subject": "accounting", "subjectName": "會計學概要", "number": 23, "question": "流動比率與淨利率在財務報表分析上,其主要作用是?", "options": {"A": "兩者皆為流動性之衡量", "B": "兩者皆為獲利性之衡量", "C": "流動比率為流動性之衡量,淨利率為獲利性之衡量", "D": "流動比率為獲利性之衡量,淨利率為流動性之衡量"}, "answer": "C", "note": ""}, {"id": "accounting-98-24", "year": "98", "subject": "accounting", "subjectName": "會計學概要", "number": 24, "question": "身為會計專業人員,您認為下列何者不是您應遵守的職業道德與工作倫理?", "options": {"A": "個人道德操守必須具備誠信正直", "B": "個人會計知識必須具有專業素養", "C": "個人本職學能必須擁有國際視野", "D": "個人公共關係應接受客戶之招待"}, "answer": "D", "note": ""}, {"id": "accounting-98-25", "year": "98", "subject": "accounting", "subjectName": "會計學概要", "number": 25, "question": "自強公司 98 年 11 月份相關資料如下:\n進料$220,000,銷貨成本為$690,000 \n製造費用僅為人工成本的 50% \n其他相關的存貨及生產成本如下:\n11 月 1 日 11 月 30 日\n材料 $40,000 $52,000 \n在製品 80,000 72,000 \n製成品 204,000 210,000 \n請計算自強公司主要成本與加工成本為多少?", "options": {"A": "$528,000;$480,000", "B": "$548,000;$500,000", "C": "$508,000;$460,000", "D": "$568,000;$520,000"}, "answer": "A", "note": ""}, {"id": "bookkeeping-98-1", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 1, "question": "關於公司登記之電子簽章規定,下列敘述何者正確?", "options": {"A": "公司登記之申請書件,皆應經公司與公司負責人電子簽章", "B": "公司登記之申請書件,皆應經公司之電子簽章", "C": "公司電子簽章之憑證,係由經濟部或內政部簽發", "D": "公司電子簽章之憑證,係由經濟部簽發"}, "answer": "D", "note": ""}, {"id": "bookkeeping-98-2", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 2, "question": "關於有限公司設立登記十五日登記期限之計算,下列敘述何者正確?", "options": {"A": "應自公司章程訂立後起算", "B": "應自公司股款收足後起算", "C": "應自公司負責人就任後起算", "D": "應自代表公司之負責人就任後起算"}, "answer": "A", "note": ""}, {"id": "bookkeeping-98-3", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 3, "question": "關於公司登記證明書之規定,下列敘述何者正確?", "options": {"A": "主管機關所核發之登記證明書,目的為取代已經廢除的公司執照制度", "B": "公司經設立登記後,得請求主管機關核發證明書", "C": "公司經設立登記後,主管機關應依法核發證明書", "D": "主管機關所核發之證明書,僅限於證明公司已經依法設立登記,並不適用於其他登記之證明"}, "answer": "B", "note": ""}, {"id": "bookkeeping-98-4", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 4, "question": "關於公司設立登記資料之抄閱規定,下列敘述何者正確?", "options": {"A": "公司登記制度,目的在於將公司資訊公開,維護交易安全,故任何人皆有權查閱公司登記事項", "B": "公司登記制度,目的雖然在於將公司資訊公開,但為保護公司內部秘密,公司登記事項可供抄閱之部分,\n並不包括公司章程", "C": "主管機關具有裁量權,可決定將所有公司登記事項保密,拒絕抄閱", "D": "主管機關並不具有將所有公司登記事項拒絕抄閱之裁量權"}, "answer": "D", "note": ""}, {"id": "bookkeeping-98-5", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 5, "question": "關於登記之廢止,下列敘述何者正確?", "options": {"A": "關於公司之登記,主管機關得依職權廢止之", "B": "關於公司之登記,主管機關得依職權或利害關係人之申請廢止之", "C": "公司經命令解散,主管機關得不經催告,依職權廢止其登記", "D": "公司經命令解散,主管機關應定三十日之期間,催告公司負責人聲明異議;逾期不為聲明或聲明理由不\n充分者,主管機關得依職權廢止其登記"}, "answer": "C", "note": ""}, {"id": "bookkeeping-98-6", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 6, "question": "依記帳士法第 29 條規定,記帳士懲戒委員會應將交付懲戒事件,通知被付懲戒人,並命其於通知送達之翌\n日起幾日內,提出答辯或到會陳述?", "options": {"A": "7 日內", "B": "15 日內", "C": "20 日內", "D": "30 日內"}, "answer": "C", "note": ""}, {"id": "bookkeeping-98-7", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 7, "question": "下列何種情形,經按記帳士法之規定撤銷或廢止記帳士證書,於原因消滅後,仍得依規定請領記帳士證書?", "options": {"A": "曾因業務上有詐欺、背信、侵占、偽造文書等犯罪行為,受有期徒刑一年以上刑之裁判確定者", "B": "受監護或輔助宣告經撤銷者", "C": "受記帳士法所定除名處分", "D": "以上皆是"}, "answer": "B", "note": ""}, {"id": "bookkeeping-98-8", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 8, "question": "申請記帳士證書 加入記帳士公會 向國稅局申請登錄 執行業務,以上各項,取得記帳士考試\n及格證書者欲執行業務之流程為何?", "options": {"A": "    →→→", "B": "    →→→", "C": "    →→→", "D": "    →→→"}, "answer": "C", "note": ""}, {"id": "bookkeeping-98-9", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 9, "question": "下列那一項業務屬於記帳士之執行業務範圍?", "options": {"A": "受理稅務諮詢", "B": "受委任辦理公司之登記或認許", "C": "受委任辦理各項稅捐之行政訴訟事項", "D": "受委任辦理各項稅捐之查核簽證申報"}, "answer": "A", "note": ""}, {"id": "bookkeeping-98-10", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 10, "question": "某君受破產之宣告尚未復權,下列那一敘述是錯誤的?", "options": {"A": "某君如原為記帳士,則破產宣告時即應撤銷或廢止其記帳士證書,俟復權後方得重新請領記帳士證書", "B": "某君不得充任記帳士", "C": "某君不得報考記帳士考試", "D": "某君如經記帳士考試及格,仍得依法請領記帳士證書,惟不得執行業務"}, "answer": "D", "note": ""}, {"id": "bookkeeping-98-11", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 11, "question": "某君曾於財政部台灣省南區國稅局安南稽徵所(位於台南市)擔任稅務員,領有記帳士證書,自其離職之\n日起三年內可否執行記帳士業務?", "options": {"A": "不得在南區國稅局之轄區內執行記帳士業務", "B": "可以在台南縣以外之區域執行記帳士業務", "C": "可以在台南市以外之區域執行記帳士業務", "D": "不得在任何地區執行記帳士業務"}, "answer": "C", "note": ""}, {"id": "bookkeeping-98-12", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 12, "question": "內部稽核師 退休稅務人員 會計師 記帳及報稅代理業務人 取得甲級會計事務技術士證照者\n記帳士,以上依法有資格代他人處理商業會計事務者有幾種?", "options": {"A": "二種", "B": "三種", "C": "四種", "D": "五種"}, "answer": "B", "note": ""}, {"id": "bookkeeping-98-13", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 13, "question": "依記帳士法第 35 條規定,記帳及報稅代理業務人,每年至少應完成幾小時以上之相關專業訓練?", "options": {"A": "48 小時以上", "B": "30 小時以上", "C": "24 小時以上", "D": "20 小時以上"}, "answer": "C", "note": ""}, {"id": "bookkeeping-98-14", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 14, "question": "依記帳士法第 34 條規定,未依法取得記帳士資格,擅自代他人報稅者,經受處以罰鍰三次以上,仍繼續從\n事記帳士業務者,應受何種處罰?", "options": {"A": "處一年以下有期徒刑、拘役或科或併科新臺幣 15 萬元以下罰金", "B": "處 3 萬元以上 15 萬元以下罰鍰", "C": "處 10 萬元以下罰金", "D": "處 10 萬元以下罰鍰"}, "answer": "A", "note": ""}, {"id": "bookkeeping-98-15", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 15, "question": "依記帳士法之相關規定,下列各項敘述,何者錯誤?", "options": {"A": "記帳士不得接受委任辦理訴願、行政訴訟事項", "B": "各級記帳士公會理事、監事,其連選連任者不得超過二分之一", "C": "記帳士登錄後,非加入記帳士公會,不得執行業務", "D": "曾任稅務機關稅務職系人員者,自離職之日起 3 年內,不得於任何區域內執行記帳士職務"}, "answer": "D", "note": ""}, {"id": "bookkeeping-98-16", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 16, "question": "下列各項中何者不包含在損益表中列示?", "options": {"A": "董監事酬勞", "B": "處分資產損益", "C": "未實現重估增值", "D": "非常損益"}, "answer": "C", "note": ""}, {"id": "bookkeeping-98-17", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 17, "question": "依商業會計處理準則第 27 條之規定,計算庫藏股票帳面價值應採用:", "options": {"A": "先進先出法", "B": "個別認定法", "C": "加權平均法", "D": "以上皆可"}, "answer": "C", "note": ""}, {"id": "bookkeeping-98-18", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 18, "question": "興財公司以一筆定期存款作為擔保向銀行借款,而該借款被該公司歸屬為長期負債。試問在該公司資產負\n債表上,該筆定期存款應列為:", "options": {"A": "現金", "B": "其他流動資產", "C": "短期投資", "D": "其他資產"}, "answer": "D", "note": ""}, {"id": "bookkeeping-98-19", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 19, "question": "下列何者屬於會計上的「現金及約當現金」?", "options": {"A": "非活期之銀行存款到期日在一年以後者", "B": "補償性存款", "C": "定期存款作為存出保證金者", "D": "定期存款提供債務作質者"}, "answer": "A", "note": ""}, {"id": "bookkeeping-98-20", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 20, "question": "關於固定資產,下列敘述何者錯誤?", "options": {"A": "土地指營業上使用之土地及具有永久性之土地改良", "B": "房屋及建物指營業上使用之自有房屋建築及其他附屬設備", "C": "租賃資產指依營業租賃契約所承租之資產", "D": "租賃權益改良係指依營業租賃契約承租之租賃標的物上之改良"}, "answer": "C", "note": ""}, {"id": "bookkeeping-98-21", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 21, "question": "依據商業會計法之規定,負債評價之基本原則,係採「折現值」列計;所謂「折現值」係為:", "options": {"A": "負債之到期值按複利折現至債務發生時之價值", "B": "負債之到期值按單利折現至報表編製時點之價值", "C": "負債之到期值按單利折現至債務發生時之價值", "D": "負債之到期值按複利折現至報表編製時點之價值"}, "answer": "AD", "note": "答A或D者均給分"}, {"id": "bookkeeping-98-22", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 22, "question": "依商業會計法規定,營業收入認列之方式,下列何者錯誤?", "options": {"A": "採用現金收付制之商業,於現金收付之時認列", "B": "勞務收入依其性質分段提供者應一次認列", "C": "採用權責發生制之商業,於交付貨品或提供勞務完畢之時認列", "D": "長期工程合約之工程損益可合理估計者,應於完工期前按完工比例法攤計列帳"}, "answer": "B", "note": ""}, {"id": "bookkeeping-98-23", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 23, "question": "下列何者屬於非常損益項目?", "options": {"A": "因內控缺失所造成之損失", "B": "處分資產損失", "C": "因新頒法規禁止營業之損失", "D": "員工資遣費"}, "answer": "C", "note": ""}, {"id": "bookkeeping-98-24", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 24, "question": "依據商業會計處理準則第 19 條規定,下列何者不是發展支出得予資本化之條件:", "options": {"A": "該無形資產尚未達到技術可行性", "B": "商業意圖完成該無形資產,並加以使用或出售", "C": "無形資產本身或其產出,已有明確市場", "D": "於發展期間歸屬於無形資產之支出,能可靠衡量"}, "answer": "A", "note": ""}, {"id": "bookkeeping-98-25", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 25, "question": "下列有關無形資產之敘述,那一項是錯誤的?", "options": {"A": "無明確經濟效益期限之無形資產,不得攤銷", "B": "無形資產之經濟效益期限可合理估計者,應按照效益存續期限攤銷", "C": "無形資產以自行發展取得者,應以實際成本為取得成本", "D": "已認列之商譽減損損失不得迴轉"}, "answer": "C", "note": ""}, {"id": "bookkeeping-98-26", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 26, "question": "關於證券投資,下列敘述何者錯誤?", "options": {"A": "公平價值變動列入損益之金融資產,應於資產負債表日採公平價值評價", "B": "備供出售金融資產,應於資產負債表日採公平價值評價", "C": "備供出售金融資產指除公平價值變動列入損益之金融資產及持有至到期日金融資產以外之衍生性金融資產", "D": "證券投資供債務作質、質押或存出保證金者,如所擔保之債務為流動負債,仍列為流動資產"}, "answer": "C", "note": ""}, {"id": "bookkeeping-98-27", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 27, "question": "正在建造或裝置而尚未完竣備供自用的工程,在資產負債表上應歸屬於那一個大項?", "options": {"A": "負債", "B": "長期投資", "C": "固定資產", "D": "預付款項"}, "answer": "C", "note": ""}, {"id": "bookkeeping-98-28", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 28, "question": "下列項目中,何者不屬於「資本公積」?", "options": {"A": "超過面額發行普通股或特別股溢價", "B": "受贈固定資產", "C": "庫藏股票交易溢價", "D": "受領股東贈與本公司已發行之股票"}, "answer": "B", "note": ""}, {"id": "bookkeeping-98-29", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 29, "question": "興財公司有一機器設備採直線法提列折舊,於 97 年 12 月 31 日耐用年限屆滿,殘值$200,000,當時淨變現\n價值$180,000。若興財公司決定不再使用該機器設備,則依商業會計處理準則第 17 條規定,下列敘述何者\n正確?", "options": {"A": "應將該機器設備轉列其他資產,成本$200,000", "B": "98 年繼續提列折舊$90,000", "C": "應認列損失$200,000", "D": "應將該機器設備轉列其他資產,帳列金額為$180,000"}, "answer": "D", "note": ""}, {"id": "bookkeeping-98-30", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 30, "question": "依據商業會計法關於會計憑證之規定,下列敘述何者錯誤?", "options": {"A": "商業會計憑證分為原始憑證與記帳憑證兩類", "B": "所謂原始憑證,係專指因商業活動之發生,由商業本身給予外人之證明", "C": "商業會計事務之處理,記帳憑證為記帳之根據", "D": "商業會計事務較簡者,得不編製記帳憑證"}, "answer": "B", "note": ""}, {"id": "bookkeeping-98-31", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 31, "question": "依據商業會計法之規定,應於決算報表上簽名或蓋章之人為:", "options": {"A": "代表商業之負責人、經理人、主辦會計人員與經辦會計人員", "B": "代表商業之負責人、經理人與主辦會計人員", "C": "代表商業之負責人與主辦會計人員", "D": "代表商業之負責人、主辦會計人員與經辦會計人員"}, "answer": "B", "note": ""}, {"id": "bookkeeping-98-32", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 32, "question": "依據商業會計法之規定,股份有限公司之決算報表,最終應經下列何者承認?", "options": {"A": "董事長", "B": "董事會", "C": "監察人", "D": "股東"}, "answer": "D", "note": ""}, {"id": "bookkeeping-98-33", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 33, "question": "依據商業會計法關於會計事項之規定,下列敘述何者錯誤?", "options": {"A": "會計事項應按發生次序逐日登帳", "B": "會計事項不涉及商業本身以外之人者,為內部會計事項", "C": "會計事項登帳時間至遲不得超過一個月", "D": "會計事項記錄應用雙式簿記方法為之"}, "answer": "C", "note": ""}, {"id": "bookkeeping-98-34", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 34, "question": "甲股份有限公司章程規定:「本公司主辦會計人員之解任,應經由全體董事一致同意。」請問:若甲公司\n有意撤換現任主辦會計人員乙,應經由:", "options": {"A": "董事會以全體董事出席,全體董事一致同意之決議", "B": "董事會以全體董事出席,出席董事過半數同意之決議", "C": "董事會以過半數董事出席,出席董事一致同意之決議", "D": "董事會以過半數董事出席,出席董事過半數同意之決議"}, "answer": "A", "note": ""}, {"id": "bookkeeping-98-35", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 35, "question": "依據商業會計法關於記帳本位之規定,下列敘述何者錯誤?", "options": {"A": "商業應以國幣為記帳本位", "B": "商業不得以外國貨幣記帳", "C": "商業財務報表應將外國貨幣折合國幣", "D": "商業財務報表得以外國貨幣與國幣並列方式表達"}, "answer": "B", "note": ""}, {"id": "bookkeeping-98-36", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 36, "question": "依據商業會計法關於損益計算之規定,下列敘述何者正確?", "options": {"A": "所謂稅前純益,係指全部收益減去全部費用之餘額", "B": "稅前純益減去營利事業所得稅與個人所得稅後,為稅後純益", "C": "收入之抵銷額得與同期費用合計後,認列為費用", "D": "費用之抵銷額不得列為收入"}, "answer": "D", "note": ""}, {"id": "bookkeeping-98-37", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 37, "question": "某人甲擬以其所有之店面一間,入股 A 股份有限公司,依據商業會計法,A 股份有限公司應如何認定其店\n面之價值?", "options": {"A": "依據市價,無市價可據時,由 A 股份有限公司自行估計", "B": "依據公告現值", "C": "依據甲之買入成本", "D": "甲不得以店面入股,A 股份有限公司應予以拒絕"}, "answer": "A", "note": ""}, {"id": "bookkeeping-98-38", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 38, "question": "A 股份有限公司因為「八八水災」,廠房被大水淹沒,機器設備、原物料與半成品全毀,遭逢巨大損失;A\n股份有限公司擬認列非常損失,請問依據商業會計法規定,A 股份有限公司應如何處理非常損失?", "options": {"A": "由 A 股份有限公司自行決定分擔之期數,平均分擔", "B": "於非常損失發生之會計年度,由 A 股份有限公司於當期認列", "C": "由 A 股份有限公司自行決定分期認列,或是當期認列", "D": "由 A 股份有限公司將所受非常損失,分為十期,平均分擔"}, "answer": "B", "note": ""}, {"id": "bookkeeping-98-39", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 39, "question": "甲公司委由記帳士丁處理商業會計事務後,有意終止委任,將商業會計事務改由公司另行聘任主辦會計人\n員戊處理,請問下列程序何者正確?", "options": {"A": "甲公司得直接由董事會決議選任戊後,通知丁終止委任", "B": "甲公司應先通知丁終止委任後,再由董事會決議選任戊", "C": "甲公司應先經董事會決議終止委任,並通知丁後,再由董事會決議選任戊", "D": "甲公司應先經董事會決議終止委任,並通知丁後,直接聘任戊"}, "answer": "C", "note": ""}, {"id": "bookkeeping-98-40", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 40, "question": "依據商業會計法之規定,若代表商業之負責人並未授權他人於記帳憑證上簽名或蓋章,則應於記帳憑證上\n簽名或蓋章之人為:", "options": {"A": "代表商業之負責人、經理人、主辦會計人員與經辦會計人員", "B": "代表商業之負責人、經理人與主辦會計人員", "C": "代表商業之負責人、主辦會計人員與經辦會計人員", "D": "代表商業之負責人與經辦會計人員"}, "answer": "A", "note": ""}, {"id": "bookkeeping-98-41", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 41, "question": "某股份有限公司甲,為創新半導體生產技術,花費新臺幣一億元購入一項關鍵技術專利權之後,投入新臺\n幣十億元研發半導體新製程,經過半年的努力,終於獲得突破,取得多項專利權,申請登記費用共計新臺\n幣五十萬元。依據商業會計法專利權入帳基礎之規定,下列敘述何者正確?", "options": {"A": "甲公司應將購入專利權所支出之新臺幣一億元,作為取得專利權之成本", "B": "甲公司應將研發專利權所支出之新臺幣十億元,作為取得專利權之成本", "C": "甲公司應將購入專利權所支出之新臺幣一億元,作為當期費用", "D": "甲公司應將申請登記專利權所支出之新臺幣五十萬元,作為當期費用"}, "answer": "A", "note": ""}, {"id": "bookkeeping-98-42", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 42, "question": "數行為人共同為觸犯行政罰之行為時,應如何裁處之?", "options": {"A": "行為人分別處罰", "B": "行為人共同分擔該罰鍰", "C": "由法院裁定處罰", "D": "由主管機關裁定處罰"}, "answer": "B", "note": ""}, {"id": "bookkeeping-98-43", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 43, "question": "一行為同時觸犯數個不同行政罰時,應如何裁處之?", "options": {"A": "數個行政罰併同裁處", "B": "以數個行政罰中法定罰鍰額最高之規定裁處", "C": "由法院裁定處罰", "D": "由主管機關裁定處罰"}, "answer": "B", "note": ""}, {"id": "bookkeeping-98-44", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 44, "question": "公司應於何時始備置決算報表供其利害關係人查閱?", "options": {"A": "會計年度結束日", "B": "監察人報告提出日", "C": "股東常會開會十日前", "D": "股東常會開會一個月前"}, "answer": "C", "note": ""}, {"id": "bookkeeping-98-45", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 45, "question": "對一同時觸犯刑事罰與行政罰之觸法行為,對其裁處之原則為:", "options": {"A": "先刑事罰後行政罰", "B": "先行政罰後刑事罰", "C": "二罰併同裁處", "D": "處以二者較重之罰則"}, "answer": "A", "note": ""}, {"id": "bookkeeping-98-46", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 46, "question": "設 95 年 1 月 2 日購入機器設備,成本為$1,000,000,無殘值,耐用年限 10 年,採平均法提列折舊。98 年初\n因正當理由改採年數合計法,耐用年限縮短只剩 5 年,殘值為$100,000,則 98 年的折舊金額為:", "options": {"A": "$120,000", "B": "$125,000", "C": "$150,000", "D": "$200,000"}, "answer": "D", "note": ""}, {"id": "bookkeeping-98-47", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 47, "question": "商業購入之工廠用地,因法令限制而暫以股東名義為所有權登記,則在財務報表上應如何處理:", "options": {"A": "以其他資產列表,並註明保全措施", "B": "以不動產投資列表,並註明保全措施", "C": "以固定資產-土地列表,附註揭露實況,並註明保全措施", "D": "以借款給股東之債權科目列表,並註明以該土地為擔保品"}, "answer": "C", "note": ""}, {"id": "bookkeeping-98-48", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 48, "question": "商業會計法規定各項會計帳簿及財務報表,應於年度決算程序辦理終了後,至少保存十年。所謂年度決算\n程序辦理終了是指下列何者:", "options": {"A": "會計年度結束日", "B": "董事會決議日", "C": "營利事業所得稅申報完成日", "D": "股東會承認日"}, "answer": "D", "note": ""}, {"id": "bookkeeping-98-49", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 49, "question": "某寺廟購地興建靈骨塔,並將出售靈骨塔收入扣除興建成本後之利潤用以修建房舍,則該寺廟是否適用商\n業會計法?", "options": {"A": "適用", "B": "不適用", "C": "部分適用", "D": "無法判定"}, "answer": "A", "note": ""}, {"id": "bookkeeping-98-50", "year": "98", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 50, "question": "清算公司其會計憑證保存期限之起算日為自何時起算:", "options": {"A": "清算完結日起算", "B": "會計年度終了日起算", "C": "清算完結聲報法院之日起算", "D": "財務報表公布日起算"}, "answer": "C", "note": ""}, {"id": "chinese-98-1", "year": "98", "subject": "chinese", "subjectName": "國文", "number": 1, "question": "韓愈〈送孟東野序〉云:「大凡物不得其平則鳴。草木之無聲,風撓之鳴;水之無聲,風蕩之\n鳴。其躍也,或激之;其趨也,或梗之;其沸也,或炙之。金石之無聲,或擊之鳴;人之於言\n也亦然。」,這段話的主旨是:", "options": {"A": "物類各有其聲,此之謂天籟", "B": "人定可以勝天,意志能撓萬物", "C": "風撓物而成聲,人不平而後言", "D": "物有鳴聲之本性,人有自衛之本能"}, "answer": "C", "note": ""}, {"id": "chinese-98-2", "year": "98", "subject": "chinese", "subjectName": "國文", "number": 2, "question": "若要寫一篇題目為「謙虛」的文章,下列無法緊扣主題的選項是:", "options": {"A": "見其誠心,則金石為之開", "B": "自高則必危,自滿則必溢", "C": "常存不如人之心,則有進", "D": "自矜者敗,自傲者愚"}, "answer": "A", "note": ""}, {"id": "chinese-98-3", "year": "98", "subject": "chinese", "subjectName": "國文", "number": 3, "question": "下列各句與「腹有詩書氣自華」意思最相近的是:", "options": {"A": "學而不思則罔,思而不學則殆", "B": "古之學者為己,今之學者為人", "C": "玉在山而草木潤,淵生珠而崖不枯", "D": "不患人之不己知,患不知人也"}, "answer": "C", "note": ""}, {"id": "chinese-98-4", "year": "98", "subject": "chinese", "subjectName": "國文", "number": 4, "question": "下列句意的解釋,何者最為正確?", "options": {"A": "「差以毫釐,失之千里」──意謂欲速則不達", "B": "「此言雖小,可以喻大」──人微言輕,所說的話隱含大道", "C": "「柔亦不茹,剛亦不吐」──不欺低下之人,不畏權勢之人", "D": "「斟酌損益,進盡忠言」──事有利於己,方提供建言"}, "answer": "C", "note": ""}, {"id": "chinese-98-5", "year": "98", "subject": "chinese", "subjectName": "國文", "number": 5, "question": "下列各組成語,解釋完全正確的是:", "options": {"A": "形容讀書勤奮:懸樑刺股/焚膏繼晷/韋編三絕", "B": "形容罪惡極多無法細數:罄竹難書/擢髮難數/肉腐生蛆", "C": "形容奢侈浪費:酒池肉林/穿金戴玉/虎尾春冰", "D": "比喻雙方實力相當:不分軒輊/伯仲之間/霄壤之別"}, "answer": "A", "note": ""}, {"id": "chinese-98-6", "year": "98", "subject": "chinese", "subjectName": "國文", "number": 6, "question": "下列成語,「指不屑與凡庸之輩或自己所鄙視的人在一起」的是:", "options": {"A": "不棄葑菲", "B": "膠柱鼓瑟", "C": "推群獨步", "D": "羞與噲伍"}, "answer": "D", "note": ""}, {"id": "chinese-98-7", "year": "98", "subject": "chinese", "subjectName": "國文", "number": 7, "question": "〈中庸〉:「天命之謂性,率性之謂道,修道之謂教」句中的「率」字,與下列選項意義相同\n的是:", "options": {"A": "「率」道而行,端然正己(《荀子.非十二子》)", "B": "從許子之道,相「率」而為偽者也(《孟子.滕文公上篇》)", "C": "丞相吾所重,其「率」先之(《史記.絳侯世家》)", "D": "屯田待敵,「率」士當衝(《舊唐書.黃巢傳》)\n98年專門職業及技術人員高等考試建築師、技師、消\n防設備師考試、普通考試不動產經紀人、記帳士、第\n二次消防設備士考試暨特種考試語言治療師考試試題 \n\n等 別: 普通考試 \n類 科: 不動產經紀人、記帳士 \n科 目: 國文(作文與測驗) \n全一張\n(背面)\n60110\n60210"}, "answer": "A", "note": ""}, {"id": "chinese-98-8", "year": "98", "subject": "chinese", "subjectName": "國文", "number": 8, "question": "下列有關律詩的敘述,錯誤的是:", "options": {"A": "以八句為定格", "B": "為近體詩的一種", "C": "凡偶數句必須押韻", "D": "前四句必須兩兩對仗"}, "answer": "D", "note": ""}, {"id": "chinese-98-9", "year": "98", "subject": "chinese", "subjectName": "國文", "number": 9, "question": "下列書信的提稱語,適用於同學的是:", "options": {"A": "函丈", "B": "青鑒", "C": "硯右", "D": "尊前\n閱讀下文,回答第"}, "answer": "C", "note": ""}, {"id": "chinese-98-10", "year": "98", "subject": "chinese", "subjectName": "國文", "number": 10, "question": "至題\n幽默是適時適地適情適景所表現的機智,有時是自嘲,有時是警動,以博得一粲。有人\n問你喜孜孜的在樂什麼?你來一句「抱歉呀,我發現最糟糕的告密者竟是我的臉!」有人的車\n子被滿街示威者堵住,你也不妨幽默一下:「上帝幸好住在高高的天上,不然,天堂的門窗天\n天會被抗爭的人潮砸爛了!」\n先培養自己多從好的一面去看事物的習慣,因為高雅的談吐,總是稱讚多於譏刺,西方\n人說:「語言是思想的衣裳」,思想高尚,才能從平凡尋常中體味出優點美處,加以欣賞。\n多用歡喜的心情說話,消弭怨恨之氣,多用灑脫的想法說話,增添自在之樂,眼光含有悟性,隨\n處俱成美景,胸中稍存雲氣,嘴角常帶花香,必然誰都愛聽你說話,而且風雅萬分!相對的,專喜挑\n三揀四的人,言談一定沒趣!(黃永武〈談吐高雅〉)\n文中「上帝幸好住在高高的天上,不然,天堂的門窗天天會被抗爭的人潮砸爛了!」,意謂:", "options": {"A": "受困堵車,祈求上帝解救", "B": "感歎人事,上帝無力管轄", "C": "揶揄嘲弄上帝,高居天上", "D": "自嘲無辜殃及,羨慕上帝"}, "answer": "D", "note": ""}, {"id": "chinese-98-11", "year": "98", "subject": "chinese", "subjectName": "國文", "number": 11, "question": "文中「語言是思想的衣裳」,下列選項那一個與此無關?", "options": {"A": "學養俱佳則談吐高雅", "B": "見多識廣則言談豐富", "C": "品味低下則言談無味", "D": "錦囊佳句則自樹一格"}, "answer": "D", "note": ""}, {"id": "chinese-98-12", "year": "98", "subject": "chinese", "subjectName": "國文", "number": 12, "question": "根據本文,下列選項何者不是作者之意?", "options": {"A": "以歡喜心說話,消弭怨恨", "B": "以灑脫心說話,增添自在", "C": "以差別心說話,體現風雅", "D": "以幽默心說話,表現機智\n閱讀下文,回答第"}, "answer": "C", "note": ""}, {"id": "chinese-98-13", "year": "98", "subject": "chinese", "subjectName": "國文", "number": 13, "question": "至題\n一個都市人,如果清晨五點醒來,連想都不用想,他的第一個本能大概就是急急按下電\n燈開關,讓屋子大放光明。他已經完全不能了解,一個人其實也可以靜靜的坐在黎明前的幽光\n裡體會時間進行的感覺。那時刻,彷彿宇宙間有一把巨大的天平,我在天平此端,幽光,在彼\n端。我與幽光對坐,並且感知那種神祕無邊的力量。方其時,人,彷彿置身密林,彷彿沉浮於\n深澤大沼,彷彿穴居野處的上古。彷彿胎兒猶在母體,又彷彿《易經.乾卦》裡的那隻「潛龍」\n正沉潛某處,尚未用世。方其時,「天地玄黃,宇宙洪荒」──這是《千字文》的句子,古代\n小孩啟蒙時要唸的第一篇,是幼童蒙昧的聲音在唸宇宙蒙昧時期的畫面──一切還停頓在《聖\n經.創世紀》的首章首句:「未始之始,未初之初,⋯⋯地則空虛渾沌,淵面黑暗。」\n坐在這樣黎明前的幽光裡,何須什麼菲力浦牌或旭光牌的電燈來打擾。此時此刻,那曾\n經身處幽潛子宮中的我,一起回到曖曖幽光中,一起重溫我們的上古史。當此之際,我與大化\n之間,心會神通,了無窒礙。此刻,燈光,除了是罪惡,還會是什麼呢?\n(張曉風〈我的幽光實驗〉)\n在本文中「天平」是隱喻什麼?", "options": {"A": "我與自然的相對平衡", "B": "黑夜與白晝的相對平衡", "C": "明與暗的相對平衡", "D": "宇宙與幽光的相對平衡"}, "answer": "A", "note": ""}, {"id": "chinese-98-14", "year": "98", "subject": "chinese", "subjectName": "國文", "number": 14, "question": "本文使用許多意象來形容黎明前的幽光,以下何者不是?", "options": {"A": "穴居野處的上古史", "B": "結胎於幽潛子宮", "C": "了無罣礙的燈光", "D": "幼童蒙昧之時"}, "answer": "C", "note": ""}, {"id": "chinese-98-15", "year": "98", "subject": "chinese", "subjectName": "國文", "number": 15, "question": "本文主旨在於闡發:", "options": {"A": "文明時代,返璞歸真的生活美學", "B": "遠古時代,開闢草萊的奮鬥精神", "C": "工商時代,歸隱山林的避世思想", "D": "科學時代,回歸傳統的教育理念"}, "answer": "A", "note": ""}, {"id": "tax-98-1", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 1, "question": "稅捐之徵收期間,自何時開始起算?", "options": {"A": "繳納期間屆滿之日", "B": "申報期間屆滿之日", "C": "繳納期間屆滿之翌日", "D": "申報期間屆滿之翌日"}, "answer": "C", "note": ""}, {"id": "tax-98-2", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 2, "question": "納稅義務人若發現繳納通知文書計算錯誤時,於規定繳納期間內,得要求稅捐稽徵機關作何處理?", "options": {"A": "查對更正", "B": "復查", "C": "訴願", "D": "行政訴訟"}, "answer": "A", "note": ""}, {"id": "tax-98-3", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 3, "question": "依稅法規定應處罰鍰者,由下列何者處分之?", "options": {"A": "主管稽徵機關", "B": "地方法院", "C": "財務法庭", "D": "行政法院"}, "answer": "A", "note": ""}, {"id": "tax-98-4", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 4, "question": "依稅法規定應自他人取得之憑證,應保存多久?", "options": {"A": "1 年", "B": "3 年", "C": "5 年", "D": "7 年"}, "answer": "C", "note": ""}, {"id": "tax-98-5", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 5, "question": "納稅義務人對於核定稅捐之處分如有不服,而該核定稅額通知書所載無應納稅額時,應於核定稅額通知書\n送達後幾日內,申請復查?", "options": {"A": "10 日", "B": "20 日", "C": "30 日", "D": "2 個月"}, "answer": "C", "note": ""}, {"id": "tax-98-6", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 6, "question": "依據所得稅法規定,固定資產遇有物價上漲達多少百分比,得實施資產重估價?", "options": {"A": "25%", "B": "20%", "C": "15%", "D": "10%"}, "answer": "A", "note": ""}, {"id": "tax-98-7", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 7, "question": "執行業務之合法代理人幫助他人以不正當方式逃漏稅捐者,應加重其刑至若干?", "options": {"A": "1/3", "B": "1/2", "C": "1 倍", "D": "2 倍"}, "answer": "B", "note": ""}, {"id": "tax-98-8", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 8, "question": "納稅義務人對於核定稅捐之處分不服時,得依法提起行政救濟,下列順序何者正確?行政訴訟 訴願\n復查", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "D", "note": ""}, {"id": "tax-98-9", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 9, "question": "稅捐稽徵機關對逃漏何種稅目,涉有犯罪嫌疑之案件,得聲請當地司法機關簽發搜索票,實施搜查?", "options": {"A": "娛樂稅", "B": "贈與稅", "C": "貨物稅", "D": "營業稅"}, "answer": "BCD", "note": "答B或C或D者均給分,"}, {"id": "tax-98-10", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 10, "question": "下列何種稅目之徵收,不優先於抵押權?", "options": {"A": "所得稅", "B": "地價稅", "C": "房屋稅", "D": "土地增值稅"}, "answer": "A", "note": ""}, {"id": "tax-98-11", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 11, "question": "下列有關營業稅稅率之規定,何者正確?", "options": {"A": "夜總會為 15%", "B": "有娛樂節目之餐飲店為 25%", "C": "小規模營業人為 0.1%", "D": "農產品批發市場之承銷人為 1%"}, "answer": "A", "note": ""}, {"id": "tax-98-12", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 12, "question": "依加值型及非加值型營業稅法規定,銷售額不包括下列何者?", "options": {"A": "貨物稅", "B": "菸酒稅", "C": "營業稅", "D": "關稅"}, "answer": "C", "note": ""}, {"id": "tax-98-13", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 13, "question": "受託人因何種信託而義賣貨物,其收入除支付義賣之必要費用外,全部供作該事業之用者,免徵營業稅?", "options": {"A": "自益信託", "B": "私益信託", "C": "他益信託", "D": "公益信託"}, "answer": "D", "note": ""}, {"id": "tax-98-14", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 14, "question": "營業人漏開統一發票,除就漏開銷售額繳納稅款外,並應處所漏稅額幾倍之罰鍰?", "options": {"A": "1 倍以下", "B": "2 倍至 5 倍", "C": "1 倍至 10 倍", "D": "5 倍至 20 倍"}, "answer": "C", "note": ""}, {"id": "tax-98-15", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 15, "question": "營業人未依規定期限申報銷售額,其未逾 30 日者,應如何處罰?", "options": {"A": "加徵滯報金", "B": "加徵短報金", "C": "加徵怠報金", "D": "暫停營業"}, "answer": "A", "note": ""}, {"id": "tax-98-16", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 16, "question": "查定計算營業稅額之小規模營業人,由主管稽徵機關查定課徵銷售額及稅額,每隔多久應填發繳款書通知\n繳納一次?", "options": {"A": "1 個月", "B": "2 個月", "C": "3 個月", "D": "6 個月"}, "answer": "C", "note": ""}, {"id": "tax-98-17", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 17, "question": "營業人開立統一發票,應行記載事項未依規定記載,應按統一發票所載銷售額,處若干之罰鍰?", "options": {"A": "1%", "B": "2%", "C": "5%", "D": "10%"}, "answer": "A", "note": ""}, {"id": "tax-98-18", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 18, "question": "營業人申請營業登記事項有變更時,應於事實發生之日起幾日內,向主管稽徵機關申請變更登記?", "options": {"A": "5 日", "B": "10 日", "C": "15 日", "D": "30 日"}, "answer": "C", "note": ""}, {"id": "tax-98-19", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 19, "question": "張君至 98 年 7 月 1 日仍未辦理 97 年度綜合所得稅結算申報,請問其該年度綜合所得稅之核課期間為何?", "options": {"A": "5 年", "B": "7 年", "C": "10 年", "D": "無時間限制"}, "answer": "B", "note": ""}, {"id": "tax-98-20", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 20, "question": "營業人 98 年 7、8 月份之營業稅,應於當年何日前向主管稽徵機關申報銷售額?", "options": {"A": "8 月 31 日", "B": "9 月 15 日", "C": "9 月 30 日", "D": "10 月 15 日"}, "answer": "B", "note": ""}, {"id": "tax-98-21", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 21, "question": "甲公司 98 年 7、8 月份可扣抵進項稅額 10 萬元,進貨退出稅額 1 萬元,銷項稅額 20 萬元,銷貨折讓稅額 2\n萬元,請問甲公司當期應納營業稅額若干元?", "options": {"A": "8 萬元", "B": "9 萬元", "C": "10 萬元", "D": "11 萬元"}, "answer": "B", "note": ""}, {"id": "tax-98-22", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 22, "question": "下列何種進項稅額得扣抵銷項稅額?", "options": {"A": "自用乘人小汽車", "B": "交際應酬用之貨物", "C": "慰勞軍隊之貨物", "D": "酬勞員工個人之貨物"}, "answer": "C", "note": ""}, {"id": "tax-98-23", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 23, "question": "為促進統一發票之推行,財政部得由全年營業稅收入總額中提撥多少比率,作為統一發票中獎獎金暨相關\n之宣傳、調查經費?", "options": {"A": "1%", "B": "3%", "C": "5%", "D": "授權稽徵機關決定"}, "answer": "B", "note": ""}, {"id": "tax-98-24", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 24, "question": "下列何者為稅捐稽徵機關依稅籍底冊核定課徵之稅捐?", "options": {"A": "菸酒稅", "B": "貨物稅", "C": "印花稅", "D": "使用牌照稅"}, "answer": "D", "note": ""}, {"id": "tax-98-25", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 25, "question": "綜合所得稅申報項目中,下列那一項在所得稅法未規定應隨物價指數上漲程度調整?", "options": {"A": "標準扣除額", "B": "身心障礙特別扣除額", "C": "儲蓄投資特別扣除額", "D": "薪資特別扣除額"}, "answer": "C", "note": ""}, {"id": "tax-98-26", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 26, "question": "依據營利事業所得稅查核準則,下列那一項關於損益之認列不符合查核準則之規定?", "options": {"A": "營利事業分期付款之銷貨,採毛利百分比法認列損益者,以分期付款在 12 個月以上者為限", "B": "營利事業分期付款之銷貨,得採普通銷貨法,依現銷價格認列銷貨收入", "C": "營利事業承包工程之工期在一年以上,有關工程損益之計算,原則上應採完工比例法", "D": "營利事業承包工程採全部完工法計算工程損益,管理費用應於費用發生之年度列報"}, "answer": "A", "note": ""}, {"id": "tax-98-27", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 27, "question": "依據營利事業所得稅查核準則之規定,關於出價取得之無形資產計算攤折年數之標準,下列何者錯誤?", "options": {"A": "著作權為 15 年", "B": "營業權為 10 年", "C": "商譽最低為 5 年", "D": "支付探測礦藏費用支出為 4 年"}, "answer": "D", "note": ""}, {"id": "tax-98-28", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 28, "question": "依據營利事業所得稅查核準則有關營利事業職工退休金費用認列之規定,適用勞動基準法之營利事業,依\n勞動基準法提列之勞工退休準備金,每年度得認列費用占當年度已付薪資總額之上限為多少百分比?", "options": {"A": "4%", "B": "6%", "C": "8%", "D": "15%"}, "answer": "D", "note": ""}, {"id": "tax-98-29", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 29, "question": "甲公司(加值型營業人)銷售房地產一筆給乙公司,總價 5000 萬元(不含稅),未分別載明價款,其中該\n土地公告現值為 600 萬元,房屋評定標準價格為 400 萬元,下列敘述何者正確?", "options": {"A": "土地銷售額為 3000 萬元,應開立發票,稅額為 150 萬元", "B": "房屋銷售額為 2000 萬元,應開立發票,稅額為 0 元", "C": "房屋銷售額為 2000 萬元,免開立發票,稅額為 0 元", "D": "房屋銷售額為 2000 萬元,應開立發票,稅額為 100 萬元"}, "answer": "D", "note": ""}, {"id": "tax-98-30", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 30, "question": "依據營利事業所得稅查核準則之規定,營利事業遭受災害之損失應列為當年度損失,但損失較為鉅大者,\n得於多少年內平均攤列?", "options": {"A": "2 年", "B": "3 年", "C": "4 年", "D": "5 年"}, "answer": "D", "note": ""}, {"id": "tax-98-31", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 31, "question": "總機構在我國境外,在我國境內提供技術服務之營利事業,其成本費用分攤計算困難,經向財政部申請核\n准,國際運輸業務得按其在我國境內之營業收入多少比率為我國境內之營利事業所得額?", "options": {"A": "10%", "B": "15%", "C": "20%", "D": "25%"}, "answer": "AB", "note": "答A或B者均給分"}, {"id": "tax-98-32", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 32, "question": "依據營利事業所得稅查核準則之規定,下列各項關於費用認列之敘述,何者錯誤?", "options": {"A": "營利事業經營本業及附屬業務以外之費用,不得列為費用", "B": "副產品得比照下腳提撥職工福利金之標準,認列費用", "C": "營利事業以雜項購置之資產,其耐用年限支出金額不及二年,得以其成本列為取得年度之費用", "D": "營利事業購入與本事業有關之書籍,得列為費用"}, "answer": "B", "note": ""}, {"id": "tax-98-33", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 33, "question": "依據營利事業所得稅查核準則之規定,下列各項關於收入認列之敘述,何者錯誤?", "options": {"A": "營利事業銷售廢料之收入,應列為收入或成本之減項", "B": "營利事業繳納外銷品進口原料之稅捐後,成品於當年度外銷並收到退稅款者應自成本項下沖減", "C": "營利事業因匯率調整而產生之帳面差額,應列入當年度兌換盈益", "D": "股份有限公司將庫藏股票交易溢價作為資本公積時,免計入所得額課稅"}, "answer": "C", "note": ""}, {"id": "tax-98-34", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 34, "question": "依據營利事業所得稅查核準則之規定,營利事業外銷勞務,應列為下列那一個時點所屬會計年度之銷貨收\n入處理?", "options": {"A": "合約簽訂日", "B": "勞務提供開始日", "C": "勞務提供完成日", "D": "帳款收現日"}, "answer": "C", "note": ""}, {"id": "tax-98-35", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 35, "question": "依據營利事業所得稅查核準則之規定,營利事業下列那一項利息得列為費用?", "options": {"A": "合夥組織之合夥人,所借貸之款項列支之利息未超過通行利率水準者", "B": "因購買土地而借款,在辦妥過戶手續前之利息", "C": "因購置土地以外固定資產而借款,付款日後之利息", "D": "因增建固定資產而借款,在取得使用執照之日後應支付之利息"}, "answer": "D", "note": ""}, {"id": "tax-98-36", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 36, "question": "依據營利事業所得稅查核準則之規定,營利事業透過財團法人私立學校興學基金會,未指定對特定學校法\n人或私立學校之捐款,得列為費用上限之規定,下列何者正確?", "options": {"A": "捐款得全數列為費用", "B": "以不超過所得額 50%為限列為費用", "C": "以不超過所得額 25%為限列為費用", "D": "以不超過所得額 10%為限列為費用"}, "answer": "A", "note": ""}, {"id": "tax-98-37", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 37, "question": "營利事業列支之製造費用及營業費用,如係取得小規模營利事業出具之普通收據,其全年累計之金額不得\n超過當年度經稽徵機關核定之製造費用及營業費用之總額之一定比率為上限,超過部分不予認定,該上限\n為多少比率?", "options": {"A": "2%", "B": "3%", "C": "4%", "D": "5%"}, "answer": "B", "note": ""}, {"id": "tax-98-38", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 38, "question": "依據所得稅法規定,在我國境內無住所,而於一課稅年度內在我國境內居留合計滿多少天,視為中華民國\n境內居住之個人?", "options": {"A": "60 天", "B": "90 天", "C": "183 天", "D": "365 天"}, "answer": "C", "note": ""}, {"id": "tax-98-39", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 39, "question": "設定定期之永佃權及地上權取得之各種所得,視為下列那一類所得?", "options": {"A": "利息所得", "B": "租賃所得", "C": "財產交易所得", "D": "營利所得"}, "answer": "B", "note": ""}, {"id": "tax-98-40", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 40, "question": "依據所得稅法之規定,下列那一項不屬於免稅所得的範圍?", "options": {"A": "公務人員所領政府發給之房租津貼", "B": "教授接受政府委託專案研究之研究費", "C": "學生受領學校發給成績優異獎學金", "D": "農民出售農地之交易所得"}, "answer": "B", "note": ""}, {"id": "tax-98-41", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 41, "question": "依據所得稅法對營利事業認列交際應酬費用之規定,營利事業經營外銷業務,取得外匯收入者,得額外在\n不超過當年度外銷結匯收入多少百分比範圍內,列支特別交際費?", "options": {"A": "1%", "B": "1.5%", "C": "2%", "D": "3%"}, "answer": "C", "note": ""}, {"id": "tax-98-42", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 42, "question": "依據所得稅法規定,營利事業以暫繳稅款抵繳結算申報應納稅額者,該暫繳稅款應於下列那一個日期計入\n當年度股東可扣抵稅額帳戶?", "options": {"A": "暫繳稅款繳納日", "B": "結算申報稅款繳納日", "C": "年度所得結算申報日", "D": "年度決算日"}, "answer": "D", "note": ""}, {"id": "tax-98-43", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 43, "question": "所得稅法規定,營利事業短期投資之有價證券,採成本與時價孰低法估價,在決算時之價格遇有激烈變動,\n得以決算日前多久期間之平均價為決算日之時價?", "options": {"A": "2 個月間", "B": "1 個月間", "C": "15 日間", "D": "10 日間"}, "answer": "B", "note": ""}, {"id": "tax-98-44", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 44, "question": "依據所得稅法關於扣繳義務人辦理稅款扣繳之規定,下列敘述何者錯誤?", "options": {"A": "扣繳義務人應於每月 10 日前將上一月內所扣稅款向國庫繳清", "B": "扣繳義務人應於每年 2 月 10 日前將上一年度扣繳稅款,開具扣繳憑單,彙報該管機關查核", "C": "扣繳義務人給付非居住者依法扣繳之稅款,應於代扣稅款之日起 10 日內向國庫繳清", "D": "營利事業解散時,扣繳義務人應隨時就以扣繳稅款填發扣繳憑單,並於 10 日內辦理申報"}, "answer": "B", "note": ""}, {"id": "tax-98-45", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 45, "question": "某扣繳義務人已依所得稅法扣繳稅款 20 萬元,但未依法定期限內按時填報扣繳憑單,經稽徵機關限期責令\n補報,仍未依限按時補報,依據所得稅法之規定,可處扣繳義務人罰鍰最高多少元?", "options": {"A": "45,000 元", "B": "20,000 元", "C": "600,000 元", "D": "200,000 元"}, "answer": "A", "note": ""}, {"id": "tax-98-46", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 46, "question": "營利事業納稅義務人結算申報所列報減除之費用超限,致短繳自繳稅款,經稽徵機關核定補繳者,就核定\n補繳稅款部分依法應加計之利息,不超過多少金額者免於加計徵收?", "options": {"A": "1,500 元", "B": "2,500 元", "C": "3,000 元", "D": "4,500 元"}, "answer": "A", "note": ""}, {"id": "tax-98-47", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 47, "question": "下列那一項綜合所得稅之列舉扣除額沒有最高扣除數額之限制?", "options": {"A": "水災災害損失", "B": "國民年金保險費", "C": "對私立大學之捐贈", "D": "房屋租金支出"}, "answer": "A", "note": ""}, {"id": "tax-98-48", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 48, "question": "甲為中華民國境內居住之個人,於年度進行中廢止中華民國境內之住所離境,而配偶為中華民國境內居住\n之個人,仍繼續居住中華民國境內,甲當年度所得如何申報所得稅?", "options": {"A": "甲應於離境前就該年度所得結算申報納稅,其免稅額及標準扣除額之減除,按在中華民國境內居住日數,\n占全年日數比例,換算減除", "B": "由其配偶合併辦理結算申報,其免稅額及標準扣除額之減除,按在中華民國境內居住日數,占全年日數\n比例,換算減除", "C": "由其配偶合併辦理結算申報,其免稅額及標準扣除額之減除,得按全額計算扣除", "D": "得選擇分別申報或合併申報,選擇分別申報之免稅額及標準扣除額之減除,應按比例換算減除"}, "answer": "C", "note": ""}, {"id": "tax-98-49", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 49, "question": "依據所得稅法,受託人依所得稅法計算受益人之各類所得時,關於其會計基礎及會計年度之規定下列何者\n正確?", "options": {"A": "應採用權責發生制,計算所得起訖期間應採日曆年度", "B": "應採用現金收付制,計算所得起訖期間應採日曆年度", "C": "得採用權責發生制或現金收付制,計算所得得變更為非日曆年度起訖時間,但一經選定不得變更", "D": "得採用權責發生制或現金收付制,一經選定不得變更。計算所得起訖期間應採日曆年度"}, "answer": "D", "note": ""}, {"id": "tax-98-50", "year": "98", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 50, "question": "根據營利事業所得稅查核準則之規定,關於營利事業薪資費用認列之標準,下列敘述何者錯誤?", "options": {"A": "合夥組織職工之薪資,不論盈虧必須支付者,准予全額核實認列", "B": "公司董事兼任經理者,視同一般職工,核定其薪資支出", "C": "97 年 1 月 1 日起,以員工分紅入股獎酬公司員工者,可核實認列薪資費用", "D": "公司監察人之薪資,經組織章程規定,不論盈虧必須支付者,准予核實認列"}, "answer": "A", "note": ""}, {"id": "accounting-99-1", "year": "99", "subject": "accounting", "subjectName": "會計學概要", "number": 1, "question": "有關現金之報導,下列何者敘述不正確?", "options": {"A": "用途受限制之銀行存款可以報導為流動資產", "B": "現金包括銀行存款、即期支票", "C": "現金列於流動資產第一個項目", "D": "須將約當現金併入現金科目,在資產負債上以「現金及約當現金」列載"}, "answer": "A", "note": ""}, {"id": "accounting-99-2", "year": "99", "subject": "accounting", "subjectName": "會計學概要", "number": 2, "question": "假設以直線法攤銷公司債之溢價,則每一付息日的利息費用按下列那一種方法計算?", "options": {"A": "該期的現金利息支付數加上該期的溢價攤銷數", "B": "該期的現金利息支付數減去該期的溢價攤銷數", "C": "債券的面額乘以債券的票面利率", "D": "債券的帳面價值乘以債券發行日的市場利率"}, "answer": "B", "note": ""}, {"id": "accounting-99-3", "year": "99", "subject": "accounting", "subjectName": "會計學概要", "number": 3, "question": "有關產品成本制度之概念,下列何者正確?", "options": {"A": "作業基礎成本制度(Activity-Base Costing)可以與任何成本制度配合", "B": "標準成本法不能用在服務業", "C": "根據財務會計準則公報,若以標準成本法計算之存貨金額與實際成本法存有重大差異,企業得採標準\n成本法", "D": "使用實際成本法的成本較低"}, "answer": "A", "note": ""}, {"id": "accounting-99-4", "year": "99", "subject": "accounting", "subjectName": "會計學概要", "number": 4, "question": "全台公司於 X5 年 1 月 1 日折價發行十年期公司債一批,原擬採利息法攤銷折價,但誤用直線法。此項\n攤銷方法之誤用,在 X6 年初,對下列項目會造成何種影響?", "options": {"A": "公司債帳面價值高估,保留盈餘高估", "B": "公司債帳面價值低估,保留盈餘低估", "C": "公司債帳面價值高估,保留盈餘低估", "D": "公司債帳面價值低估,保留盈餘高估"}, "answer": "C", "note": ""}, {"id": "accounting-99-5", "year": "99", "subject": "accounting", "subjectName": "會計學概要", "number": 5, "question": "乙公司於 X1 年 1 月 1 日發行 5 年期自 X1 年 12 月 31 日起平均分期清償公司債$10,000,X4 年 12 月 31 日\n資產負債表應如何表達此公司債?", "options": {"A": "流動負債$2,000,無長期負債", "B": "流動負債$10,000,無長期負債", "C": "流動負債$2,000,長期負債$8,000", "D": "流動負債$1,000,長期負債$2,000"}, "answer": "A", "note": ""}, {"id": "accounting-99-6", "year": "99", "subject": "accounting", "subjectName": "會計學概要", "number": 6, "question": "保全公司核准發行 100,000 股面額 $1 普通股,實際發行 40,000 股,以每股 $5 全數由摩根購入,此外,並\n無其他股票發行,此時:", "options": {"A": "摩根擁有保全公司 40% 股權", "B": "保全公司應承認 $160,000 的獲利", "C": "保全公司普通股股本為$200,000", "D": "保全公司普通股股本為$40,000"}, "answer": "D", "note": ""}, {"id": "accounting-99-7", "year": "99", "subject": "accounting", "subjectName": "會計學概要", "number": 7, "question": "甲公司淨資產 $400,000,投入資本 $250,000,發行並流通在外普通股 25,000 股,由前述資料可知下列那\n一項敘述一定成立?", "options": {"A": "保留盈餘$400,000", "B": "每股帳面價值$16", "C": "累積虧絀$250,000", "D": "每股帳面價值$10"}, "answer": "B", "note": ""}, {"id": "accounting-99-8", "year": "99", "subject": "accounting", "subjectName": "會計學概要", "number": 8, "question": "乙公司以每股 $6 購買面值 $1.5 的普通股 10,000 股作為庫藏股票,此筆交易對公司的影響為何?", "options": {"A": "對公司資產沒影響", "B": "對股東權益沒有影響", "C": "股東權益減少$15,000", "D": "股東權益減少$60,000"}, "answer": "D", "note": ""}, {"id": "accounting-99-9", "year": "99", "subject": "accounting", "subjectName": "會計學概要", "number": 9, "question": "若購入別家企業所發行之證券,並欲於短期內將其出售以賺取差價利益,則應將該項投資視為:", "options": {"A": "備供出售金融資產", "B": "交易目的金融資產", "C": "持有至到期日金融資產", "D": "長期投資"}, "answer": "B", "note": ""}, {"id": "accounting-99-10", "year": "99", "subject": "accounting", "subjectName": "會計學概要", "number": 10, "question": "下列何者非屬投資活動之現金流量?", "options": {"A": "購買設備", "B": "貸款予其他企業", "C": "投資股票之股利收入", "D": "購入備供出售金融資產"}, "answer": "C", "note": ""}, {"id": "accounting-99-11", "year": "99", "subject": "accounting", "subjectName": "會計學概要", "number": 11, "question": "銷貨運費應列入下列那一項?", "options": {"A": "銷貨成本", "B": "營業外費用", "C": "銷貨收入減項", "D": "營業費用"}, "answer": "D", "note": ""}, {"id": "accounting-99-12", "year": "99", "subject": "accounting", "subjectName": "會計學概要", "number": 12, "question": "以直接法編製現金流量表時,營業活動會出現下列何項?", "options": {"A": "宣告或支付現金股利", "B": "處分土地產生之利益", "C": "支付長期應付票據利息", "D": "折舊費用"}, "answer": "C", "note": ""}, {"id": "accounting-99-13", "year": "99", "subject": "accounting", "subjectName": "會計學概要", "number": 13, "question": "甲公司於 X8 年 10 月 1 日購入一部機器,成本 $11,000,殘值 $1,000,耐用年限 4 年,採倍數餘額遞減法\n計提折舊,則 X9 年應提列折舊為何?", "options": {"A": "$3,750.00", "B": "$4,000.00", "C": "$4,375.00", "D": "$4,812.50"}, "answer": "D", "note": ""}, {"id": "accounting-99-14", "year": "99", "subject": "accounting", "subjectName": "會計學概要", "number": 14, "question": "下列那一項調整分錄,得於下期初作轉回分錄?", "options": {"A": "提列備抵呆帳", "B": "記虛轉實之預付費用", "C": "記實轉虛之預收收入", "D": "各項攤提"}, "answer": "B", "note": ""}, {"id": "accounting-99-15", "year": "99", "subject": "accounting", "subjectName": "會計學概要", "number": 15, "question": "複式傳票係指下列那一項?", "options": {"A": "只限於記載轉帳之交易事項", "B": "一張傳票以記載一個科目為原則", "C": "一張傳票以記載一項交易為原則", "D": "只限於記載現金收支之交易事項"}, "answer": "C", "note": ""}, {"id": "accounting-99-16", "year": "99", "subject": "accounting", "subjectName": "會計學概要", "number": 16, "question": "甲公司採零用金制度,當以零用金支付計程車資時,應作下列那一個分錄?", "options": {"A": "借記短程車資", "B": "貸記零用金", "C": "貸記現金", "D": "不作分錄"}, "answer": "D", "note": ""}, {"id": "accounting-99-17", "year": "99", "subject": "accounting", "subjectName": "會計學概要", "number": 17, "question": "固定資產後續支出之當年度,若將資本支出誤列為收益支出,當年度財務報表將產生下列那一種結果?", "options": {"A": "資產多計,淨利多計", "B": "資產少計,淨利少計", "C": "資產多計,淨利少計", "D": "資產少計,淨利多計"}, "answer": "B", "note": ""}, {"id": "accounting-99-18", "year": "99", "subject": "accounting", "subjectName": "會計學概要", "number": 18, "question": "下列敘述何者代表企業進行結帳後之帳戶餘額?", "options": {"A": "所有帳戶餘額均為零", "B": "資產、負債及業主權益帳戶餘額為零", "C": "收益、費損、本期損益及保留盈餘帳戶餘額為零", "D": "收益、費損及本期損益帳戶餘額為零"}, "answer": "D", "note": ""}, {"id": "accounting-99-19", "year": "99", "subject": "accounting", "subjectName": "會計學概要", "number": 19, "question": "勝利合夥商店合夥人資本額如下:甲 $80,000,乙 $50,000,丙欲入夥,以 $30,000 向乙購入一半夥權,則\n丙資本為何?", "options": {"A": "$25,000", "B": "$30,000", "C": "$40,000", "D": "$50,000"}, "answer": "A", "note": ""}, {"id": "accounting-99-20", "year": "99", "subject": "accounting", "subjectName": "會計學概要", "number": 20, "question": "期末盤點存貨時,漏列寄銷品 $10,000,則對企業純益之影響為何?", "options": {"A": "本期純益多計$10,000,下期純益少計$10,000", "B": "本期及下期純益均少計$10,000", "C": "本期及下期純益均多計$10,000", "D": "本期純益少計$10,000,下期純益多計$10,000"}, "answer": "D", "note": ""}, {"id": "accounting-99-21", "year": "99", "subject": "accounting", "subjectName": "會計學概要", "number": 21, "question": "美麗公司在權責基礎下,本期租金收入為 $400,000,若該公司預收租金期初餘額為 $22,500,期末餘額\n為 $42,500,則在現金基礎下,本期租金收入應為:", "options": {"A": "$380,000", "B": "$400,000", "C": "$420,000", "D": "$442,500"}, "answer": "C", "note": ""}, {"id": "accounting-99-22", "year": "99", "subject": "accounting", "subjectName": "會計學概要", "number": 22, "question": "麗美公司流動資產中,流動性低於存貨者,僅有預付費用,該公司流動比率為 2.5,存貨佔流動資產 1/3,\n預付費用為 $50,000,流動負債為 $180,000,則速動資產為何?", "options": {"A": "$250,000", "B": "$300,000", "C": "$400,000", "D": "$450,000"}, "answer": "A", "note": ""}, {"id": "accounting-99-23", "year": "99", "subject": "accounting", "subjectName": "會計學概要", "number": 23, "question": "對產品售後服務成本進行估計,符合那一項會計原則?", "options": {"A": "行業特性原則", "B": "配合原則", "C": "重要性原則", "D": "成本原則"}, "answer": "B", "note": ""}, {"id": "accounting-99-24", "year": "99", "subject": "accounting", "subjectName": "會計學概要", "number": 24, "question": "甲公司按資產負債觀點提列壞帳,X8 年度備抵壞帳借餘 $5,000,該年底應收帳款餘額 $600,000,若估計\n壞帳為應收帳款 3%,則 X8 年應提列壞帳為何?", "options": {"A": "$13,000", "B": "$18,000", "C": "$20,000", "D": "$23,000"}, "answer": "D", "note": ""}, {"id": "accounting-99-25", "year": "99", "subject": "accounting", "subjectName": "會計學概要", "number": 25, "question": "甲公司月底編製銀行調節表:帳面餘額 $130,200,對帳單餘額 $118,800,銀行代收票據 $18,000,銀行扣\n手續費 $600,在途存款 $56,400,另有未兌現支票,此外並無其他項目,則未兌現支票金額應為若干?", "options": {"A": "$26,400", "B": "$27,600", "C": "$63,600", "D": "$85,200"}, "answer": "B", "note": ""}, {"id": "bookkeeping-99-1", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 1, "question": "依記帳士法第 16 條之規定,記帳士執行業務,應設置簿冊,下列那一項屬於應載明之事項?", "options": {"A": "開業日期", "B": "執行業務區域", "C": "委任日期", "D": "委任權限"}, "answer": "C", "note": ""}, {"id": "bookkeeping-99-2", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 2, "question": "依記帳士法第 35 條之管理辦法規定,關於記帳及報稅代理業務人之管理,下列敘述何者正確?", "options": {"A": "記帳及報稅代理業務人之資格取得,應經考試及格", "B": "記帳及報稅代理業務人不得籌設公會", "C": "記帳及報稅代理業務人不必完成相關專業訓練", "D": "記帳及報稅代理業務人可執行業務項目,與記帳士相同"}, "answer": "D", "note": ""}, {"id": "bookkeeping-99-3", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 3, "question": "依記帳士法規定,記帳士於執行業務前,下列應辦事項,何者正確?", "options": {"A": "應向主管機關申請加入成為公會會員", "B": "應向記帳士公會申請登錄", "C": "受委任辦理商業會計事務,應與委任人訂立委任書", "D": "應向考選部請領記帳士證書"}, "answer": "C", "note": ""}, {"id": "bookkeeping-99-4", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 4, "question": "依記帳士法規定,各級記帳士公會應將會員名冊及會員之入會、退會,向那一機關申報?", "options": {"A": "中央人民團體主管機關及財政部", "B": "申報所在地人民團體主管機關", "C": "申報所在地地方法院", "D": "申報所在地人民團體主管機關及財政部"}, "answer": "D", "note": ""}, {"id": "bookkeeping-99-5", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 5, "question": "依記帳士法關於記帳士懲戒之規定,下列敘述何者正確?", "options": {"A": "被付懲戒之記帳士對於懲戒覆審委員會之決議,於法律規定期限內提起行政訴訟者,其處分決議尚未\n確定", "B": "記帳士懲戒委員會組織,由法務部訂之", "C": "被懲戒人可依記帳士法第 31 條規定期限 30 日內,向記帳士懲戒覆審委員會請求覆審", "D": "記帳士受懲戒處分確定後,通知記帳士公會,並於網站公告即可"}, "answer": "A", "note": ""}, {"id": "bookkeeping-99-6", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 6, "question": "張三記帳士因違反商業會計法第 76 條之規定,受主管機關處新臺幣二十萬元之罰鍰確定,其情節重大,\n足以影響記帳士信譽,應交付那一組織懲戒?", "options": {"A": "經濟部", "B": "記帳士懲戒委員會", "C": "財政部", "D": "一事不二罰,不得再交付懲戒"}, "answer": "B", "note": ""}, {"id": "bookkeeping-99-7", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 7, "question": "依記帳士法規定,記帳士有下列那一項行為時,應交付懲戒?1因業務之犯罪行為經移送法辦者 2因\n幫助委任人逃漏營利事業所得稅,經移送法辦者 3逃漏稅捐經國稅局處分有案者 4未經委任人許可,\n洩漏業務上之秘密 5違反記帳士公會章程之規定,情節重大者", "options": {"A": "2345", "B": "1345", "C": "12345", "D": "1245"}, "answer": "A", "note": ""}, {"id": "bookkeeping-99-8", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 8, "question": "依記帳士法關於記帳士公會規定,下列敘述何者錯誤?", "options": {"A": "同一直轄市或縣市只能成立一個記帳士公會", "B": "各縣市記帳士公會不得拒絕具有會員資格者加入", "C": "記帳士欲開業執行業務,則加入各縣市記帳士公會為強制性規定", "D": "各縣市記帳士公會,應由該行政區域內已登錄記帳士二十人以上發起組織之"}, "answer": "D", "note": ""}, {"id": "bookkeeping-99-9", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 9, "question": "依記帳士法規定,記帳士欲在登記開業區域以外之其他縣市執行業務時,應如何辦理?", "options": {"A": "向其它縣市國稅分局登記,並設分事務所", "B": "向財政部登記,免設分事務所", "C": "執行業務範圍以其委任人所在地縣市為限,向財政部登記,並設分事務所", "D": "向其它縣市政府登記,免設分事務所"}, "answer": "B", "note": ""}, {"id": "bookkeeping-99-10", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 10, "question": "依記帳士法規定,關於主管機關記帳士名簿,下列敘述何者正確?", "options": {"A": "委任人委任日期,為主管機關記帳士名簿應載明事項之一", "B": "尚未登錄之記帳士,其地址如有變更時,應向主管機關申請變更", "C": "主管機關應備置記帳士名簿,其應保存期限至少五年", "D": "記帳士曾否受過懲戒,為主管機關記帳士名簿應載明事項之一"}, "answer": "D", "note": ""}, {"id": "bookkeeping-99-11", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 11, "question": "歸榮商號地址設於臺南市,其商業會計事務之主管機關應為:", "options": {"A": "臺南市政府", "B": "臺南市商業同業公會", "C": "經濟部", "D": "財政部南區國稅局臺南市分局"}, "answer": "A", "note": ""}, {"id": "bookkeeping-99-12", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 12, "question": "依記帳士法規定,欲充任我國記帳士者,下列規定何者錯誤?", "options": {"A": "外國人得依中華民國法令取得記帳士證書,充任記帳士", "B": "受破產之宣告尚未復權者,不得充任記帳士", "C": "具有中華民國國籍為取得記帳士資格之必要條件", "D": "受監護或輔助之宣告尚未撤銷者,不得充任記帳士"}, "answer": "C", "note": ""}, {"id": "bookkeeping-99-13", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 13, "question": "台榮有限公司為新設立,其會計人員之設置,依商業會計法之規定,下列敘述何者正確?", "options": {"A": "其會計人員之聘任程序,應有全體股東過半數之同意", "B": "其主辦會計人員之聘任程序,由總經理提報經董事會同意即可", "C": "其主辦會計人員之聘任程序,應由董事會以董事過半數之出席,及出席董事過半數之同意", "D": "如擬委外由記帳士處理會計事務,則應有全體股東過半數之同意"}, "answer": "D", "note": ""}, {"id": "bookkeeping-99-14", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 14, "question": "商業會計法關於商業會計記帳之規定,下列敘述何者錯誤?", "options": {"A": "商業會計之記載,除記帳數字適用阿拉伯字外,應以我國文字為之", "B": "因業務需要,而以外國貨幣記帳者,仍應在其決算表中,將外國貨幣折合新臺幣", "C": "外國在臺分公司不可以外幣記帳", "D": "本國公司以外國貨幣交易者,得以外國貨幣記帳"}, "answer": "C", "note": ""}, {"id": "bookkeeping-99-15", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 15, "question": "依商業會計法規定,下列那一項敘述不屬於會計事項?", "options": {"A": "公司喪失一重要供應商客戶,預計將減少原料來源新臺幣 1,000 萬元", "B": "營運使用之機器設備尚未完全折舊,帳面價值為新臺幣 50 萬元,報廢後閒置在倉庫", "C": "向銀行申請變更契約,並增加銀行透支金額新臺幣 80 萬元", "D": "公司宣告股東股利"}, "answer": "A", "note": ""}, {"id": "bookkeeping-99-16", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 16, "question": "忠勇公司業務人員王君出差搭乘計程車,車資計新臺幣 500 元,因行程匆促,並未向計程車司機索取計\n程車資收據,王君如何向公司申請該筆車資?", "options": {"A": "不得申請,由王君自行負擔", "B": "由王君告知公司會計人員製作傳票,憑以申請車資", "C": "由王君及其主管填寫申請單共同證明出差事宜,憑以申請車資", "D": "由王君報告公司負責人後,直接交代會計人員製作傳票,憑以申請車資"}, "answer": "C", "note": ""}, {"id": "bookkeeping-99-17", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 17, "question": "下列那一項不屬於商業會計法規定之原始憑證?", "options": {"A": "保險公司理賠給付通知書", "B": "員工薪資扣繳憑單", "C": "典當業之當票簿副聯", "D": "銀行存款證明"}, "answer": "A", "note": ""}, {"id": "bookkeeping-99-18", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 18, "question": "依商業會計法規定,若商業會計制度健全,使用總分類帳科目日計表者,得免設何種帳簿?", "options": {"A": "明細分類帳簿", "B": "特種序時帳簿", "C": "普通序時帳簿", "D": "總分類帳簿"}, "answer": "C", "note": ""}, {"id": "bookkeeping-99-19", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 19, "question": "商業會計法關於會計憑證保管之規定,下列敘述何者錯誤?", "options": {"A": "各項會計憑證之保存,以會計年度決算經董事會承認後,至少保存五年", "B": "記帳憑證於保管期限屆滿後,經代表商業之負責人核准,得予銷毀", "C": "對外憑證,應至少自留副本或存根一份", "D": "會計憑證,應按日或按月裝訂成冊"}, "answer": "A", "note": ""}, {"id": "bookkeeping-99-20", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 20, "question": "商業會計法關於有價證券投資之規定,下列敘述何者錯誤?", "options": {"A": "有價證券投資之入帳以取得時之實際成本為原則", "B": "所有有價證券投資之期末評價方法,準用存貨成本計算方法", "C": "具有控制能力之長期股權投資,採用權益法評價", "D": "持有至到期日債券投資,應以攤銷後成本衡量"}, "answer": "B", "note": ""}, {"id": "bookkeeping-99-21", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 21, "question": "A 公司以一台機器設備交換 B 公司一台儀器設備,換入之儀器設備知悉製造之實際成本 300,000 元,惟無\n公平價值可衡量,已知機器設備成本 250,000 元,累計折舊 80,000 元,A 公司另支付現金 60,000 元給\nB 公司,請問 A 公司換入之儀器設備入帳金額為何?", "options": {"A": "230,000 元", "B": "170,000 元", "C": "300,000 元", "D": "360,000 元"}, "answer": "A", "note": ""}, {"id": "bookkeeping-99-22", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 22, "question": "商業會計法關於商業存貨會計處理之規定,下列敘述何者正確?", "options": {"A": "成本高於市價時,跌價損失應列為銷貨成本", "B": "成本高於淨變現價值時,跌價損失應列為非營業損失", "C": "後進先出法為存貨成本計算方法之一", "D": "所謂淨變現價值,係指企業預期正常營業出售存貨所能取得之淨額"}, "answer": "D", "note": ""}, {"id": "bookkeeping-99-23", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 23, "question": "商業會計法關於固定資產提列折舊之規定,下列敘述何者正確?", "options": {"A": "固定資產之折舊方法,僅可採用一種方法,不得分類綜合計算之", "B": "固定資產耐用年限已屆滿,仍可繼續使用時,得就殘值繼續提列折舊", "C": "固定資產之折舊,得不必逐年提列", "D": "定率遞減法不是商業會計法,而是所得稅法所規定的折舊方法"}, "answer": "B", "note": ""}, {"id": "bookkeeping-99-24", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 24, "question": "商業會計法關於資產重估之規定,下列敘述何者正確?", "options": {"A": "經重估之固定資產應自重估年度起,按其重估後之價值計提折舊", "B": "自用土地得按公告地價調整,而發生之增值不必減除估計土地增值稅準備,全數列為未實現重估增值", "C": "租用他人資產得依法令規定,辦理資產重估", "D": "無形資產重估後發生之增值,應列為業主權益項下之未實現重估增值"}, "answer": "D", "note": ""}, {"id": "bookkeeping-99-25", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 25, "question": "依商業會計法規定,應付公司債溢價之攤銷,於每期攤銷時將有下列何種影響?", "options": {"A": "減少應付公司債,降低利息費用", "B": "減少應付公司債,提高利息費用", "C": "增加應付公司債,降低利息費用", "D": "增加應付公司債,提高利息費用"}, "answer": "A", "note": ""}, {"id": "bookkeeping-99-26", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 26, "question": "依商業會計法規定,商業在合併、分割、收購、解散、終止或轉讓時,下列何者不屬於資產之計價方式?", "options": {"A": "公平價值", "B": "實際成交價格", "C": "淨變現價值", "D": "帳面價值"}, "answer": "C", "note": ""}, {"id": "bookkeeping-99-27", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 27, "question": "依商業會計法規定,商業應辦理之決算,下列敘述何者正確?", "options": {"A": "商業每屆決算應編製之報表,僅為財務報表及其註釋", "B": "所有商業之決算最遲應於每年 4 月 15 日辦理完竣", "C": "決算報表可由代表商業之負責人授權經理人及主辦會計人員簽名或蓋章", "D": "分公司之決算應與總公司決算合併辦理"}, "answer": "D", "note": ""}, {"id": "bookkeeping-99-28", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 28, "question": "商業為避免颱風來襲發生意外災害損失,本年度由保留盈餘提列意外災害損失準備 1,000,000 元,依商業\n會計法規定,對於財務報表之影響,下列何者正確?", "options": {"A": "當期損益表非營業損失增加 1,000,000 元", "B": "股東權益總額不變", "C": "使帳戶營運現金及股東權益同時減少 1,000,000 元", "D": "意外災害損失準備 1,000,000 元列入負債項下"}, "answer": "B", "note": ""}, {"id": "bookkeeping-99-29", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 29, "question": "依商業會計法規定,關於商業決算報表之查閱與檢查,下列敘述何者正確?", "options": {"A": "商業之利害關係人,得聲請商業會計法之主管機關進行檢查會計帳簿及憑證", "B": "查閱係查閱帳簿報表及憑證,聲請檢查係檢查決算報表", "C": "查閱係由利害關係人自行查閱,聲請檢查則由法院選派檢查員檢查", "D": "商業負責人於利害關係人聲請法院檢查時,若認為違反其商業利益,可拒絕檢查"}, "answer": "C", "note": ""}, {"id": "bookkeeping-99-30", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 30, "question": "商業會計處理準則關於應收票據與應收帳款之規定,下列何者正確?", "options": {"A": "金額重大之應收關係人票據,不必單獨列示;金額重大之應收關係人帳款,應單獨列示", "B": "已設定擔保的應收帳款,應列為應收帳款的減項", "C": "應收帳款應按現值評價,但到期日在二年以內者,得按帳載金額評價", "D": "應收票據業經貼現者,應予扣除並加註明"}, "answer": "D", "note": ""}, {"id": "bookkeeping-99-31", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 31, "question": "商業會計處理準則關於其他資產項目定義及評價之規定,下列何者正確?", "options": {"A": "遞延資產,指效益超過一年以上已發生之支出,應由以後各期負擔者,應按未攤銷成本評價", "B": "長期應收票據及款項,按淨變現價值評價", "C": "金額重大之催收款項應單獨列示,不需提列備抵呆帳,以附註說明即可", "D": "閒置資產,指目前未供營業上使用之資產,按未攤銷成本評價"}, "answer": "A", "note": ""}, {"id": "bookkeeping-99-32", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 32, "question": "商業會計處理準則規定,依法令或盈餘分派之議案,自盈餘中指撥之公積,以限制股息及紅利之分派者,\n應列入:", "options": {"A": "法定盈餘公積", "B": "長期負債", "C": "特別盈餘公積", "D": "資本公積"}, "answer": "C", "note": ""}, {"id": "bookkeeping-99-33", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 33, "question": "依商業會計處理準則規定,商業固定資產已依法辦理資產重估,帳上上年底有未實現重估增值 100,000 元,\n本年底評估有重估資產減損損失 130,000 元,請問其財務報表如何表示?", "options": {"A": "當期損益表認列損失 130,000 元", "B": "資產負債表業主權益項下之未實現重估增值減少 130,000 元,當期損益表不認列損益", "C": "僅以註釋說明,當期損益表不認列損益", "D": "當期損益表認列損失 30,000 元"}, "answer": "D", "note": ""}, {"id": "bookkeeping-99-34", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 34, "question": "商業會計處理準則關於營業外收益及費損之規定,下列何者錯誤?", "options": {"A": "利息收入及利息費用,得以其淨額列示", "B": "金融資產評價損益及金融負債評價損益,得以其淨額列示", "C": "營業外收益及費損,指本期內非因經常營業活動所發生之收入及費用", "D": "採用權益法認列之投資損益、兌換損益及處分投資損益,得以其淨額列示"}, "answer": "A", "note": ""}, {"id": "bookkeeping-99-35", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 35, "question": "依商業會計處理準則規定,關於流動負債之評價,下列何者正確?", "options": {"A": "公平價值變動列入損益之金融負債應按現值評價", "B": "應付短期票券應按現值評價", "C": "應付票據應按到期值評價", "D": "應付帳款應按面值評價"}, "answer": "B", "note": ""}, {"id": "bookkeeping-99-36", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 36, "question": "依記帳士法與記帳士職業道德規範,下列關於記帳士事務所之規定,何者正確?", "options": {"A": "事務所名稱不得與已登錄之事務所名稱相同", "B": "事務所名稱可註明會計事務所", "C": "設立分事務所,可由聘僱人員主持", "D": "記帳士分別於不同縣市執行業務,應分別設立事務所與分事務所"}, "answer": "A", "note": ""}, {"id": "bookkeeping-99-37", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 37, "question": "記帳士違背記帳士職業道德規範時,應如何處理?", "options": {"A": "逕由記帳士公會全國聯合會處理", "B": "逕由主管機關處理", "C": "逕由記帳士懲戒委員會處理", "D": "逕由所屬地方記帳士公會依法處理"}, "answer": "D", "note": ""}, {"id": "bookkeeping-99-38", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 38, "question": "李君擔任記帳士職務,刊登廣告招攬業務,宣稱可替客戶執行訴願業務,且實際從事訴願業務,經他人\n向所屬記帳士公會檢舉,您認為下列何者為正確的處理方式?", "options": {"A": "由所屬地方記帳士公會處理,予以書面申誡", "B": "由所屬地方記帳士公會處理後,報請財政部交付懲戒", "C": "由所屬地方記帳士公會處理後,報請記帳士公會全國聯合會交付懲戒", "D": "並未違反相關法規規定,不予處理"}, "answer": "B", "note": ""}, {"id": "bookkeeping-99-39", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 39, "question": "下列有關行政處分之敘述,何者錯誤?", "options": {"A": "行政處分,係指行政機關就公法上具體事件所為之決定或其他公權力措施而對外直接發生法律效果之\n單方行政行為", "B": "行政處分之相對人雖非特定,而依一般性特徵可得確定其範圍者,稱為一般處分", "C": "公物之設定、變更、廢止或其一般使用者,亦為行政處分", "D": "行政處分必須以書面為之"}, "answer": "D", "note": ""}, {"id": "bookkeeping-99-40", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 40, "question": "下列何者並非行政程序法第 97 條規定書面行政處分得不記明理由之情形?", "options": {"A": "未限制人民之權益者", "B": "大量作成之同種類行政處分或以自動機器作成之行政處分依其狀況無須說明理由者", "C": "情況急迫不及記明者", "D": "一般處分經公告或刊登政府公報或新聞紙者"}, "answer": "C", "note": ""}, {"id": "bookkeeping-99-41", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 41, "question": "下列何者並非行政程序法第 119 條所規定受益人信賴不值得保護之情形?", "options": {"A": "不知法令者", "B": "以賄賂方法,使行政機關作成行政處分者", "C": "對重要事項提供不正確資料或為不完全陳述,致使行政機關依該資料或陳述而作成行政處分者", "D": "明知行政處分違法者"}, "answer": "A", "note": ""}, {"id": "bookkeeping-99-42", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 42, "question": "下列何者並非行政程序法第 103 條行政機關得不給予處分相對人陳述意見機會之情形?", "options": {"A": "受法定期間之限制,如予陳述意見之機會,顯然不能遵行者", "B": "限制自由或權利之內容及程度,顯屬輕微,而無事先聽取相對人意見之必要者", "C": "大量作成同種類之處分", "D": "受處分人之前曾受同種之處分,故可推知其係故意所為,而無陳述意見之必要"}, "answer": "D", "note": ""}, {"id": "bookkeeping-99-43", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 43, "question": "甲、乙、丙三人以合夥方式經營以營利為目的之家庭手工業,則下列敘述何者正確?", "options": {"A": "其經營之家庭手工業,得免申請辦理商業登記", "B": "其經營之家庭手工業,僅以自任操作為限,方得免申請辦理商業登記", "C": "其經營之家庭手工業,以自任操作或雖僱用員工而仍以自己操作為主者為限,得免申請辦理商業登記", "D": "其經營之家庭手工業,不論規模大小、是否自行操作、是否有僱用員工,均應申請辦理商業登記"}, "answer": "C", "note": ""}, {"id": "bookkeeping-99-44", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 44, "question": "甲、乙、丙三人以合夥方式經營以營利為目的之事業,並已辦妥合夥事業之商業登記,然而乙因與甲、\n丙經營理念不合,故於合夥事業經營一年後,其依合夥契約約定聲明退夥,不再參與該事業之投資或經\n營。而乙在退夥後,對後來該甲、丙合夥經營之商業所產生的新債務,是否應負責?", "options": {"A": "新債務產生時,乙已經退夥不再參與該商業經營,故乙對所有新債權人皆無須負責", "B": "新債務產生時,若該商業對乙之退夥一事未辦理變更登記,則乙對所有新債權人皆仍須負責", "C": "新債務產生時,若該商業對乙之退夥一事已經辦理變更登記,則乙僅須對善意之新債權人負責", "D": "新債務產生時,若該商業對乙之退夥一事已經辦理變更登記,則乙對所有新債權人皆無須負責"}, "answer": "D", "note": ""}, {"id": "bookkeeping-99-45", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 45, "question": "G 股份有限公司被法院裁定解散後,應於規定期限內辦理解散登記,其若未向主管機關申請解散登記者,\n下列敘述何者正確?", "options": {"A": "主管機關得依職權直接廢止其登記,而無須催告公司負責人聲明異議", "B": "主管機關得定三十日期間,催告公司負責人是否聲明異議;無異議即廢止其登記", "C": "主管機關應定三十日期間,催告公司負責人是否聲明異議;無異議即廢止其登記", "D": "主管機關視法院裁定解散內容,而決定是否在廢止公司登記前催告其負責人聲明異議"}, "answer": "A",
