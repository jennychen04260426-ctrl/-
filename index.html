列敘述何\n者正確?", "options": {"A": "兩者皆為行政處分", "B": "兩者皆為一般處分", "C": "前者係行政處分,後者係一般處分", "D": "前者係一般處分,後者係行政處分"}, "answer": "C", "note": ""}, {"id": "bookkeeping-113-48", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 48, "question": "授予利益之違法行政處分經撤銷後,如受益人無信賴不得保護之情形,其因信賴該處分致遭受財產上之損\n失者,那個機關應給予合理之補償?", "options": {"A": "原處分機關", "B": "原處分機關之上級機關", "C": "法院", "D": "撤銷之機關"}, "answer": "D", "note": ""}, {"id": "bookkeeping-113-49", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 49, "question": "若公司符合下列條件之一,其財務報表必須經會計師查核簽證?1資本額達 3,000 萬元以上 2淨值達\n3,000 萬元以上 3營業淨利達 1 億元 4年底在職員工達 100 人 5營業收入淨額達 1 億元", "options": {"A": "134", "B": "145", "C": "234", "D": "235"}, "answer": "B", "note": ""}, {"id": "bookkeeping-113-50", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 50, "question": "依商業登記法第 19 條規定,若商業所在地主管機關於資訊網站公告之商業登記事項,與登記不符時,應\n如何處理?", "options": {"A": "以公告為準", "B": "以登記為準", "C": "由商業所在地主管機關決定", "D": "由商業所在地法院裁定"}, "answer": "B", "note": ""}, {"id": "tax-113-1", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 1, "question": "除因不可抗力或非歸責於納稅義務人之事由,得依法申請延期或分期繳納稅捐者外,對於逾法定期限\n未繳納稅捐者應加徵滯納金之規定為何?", "options": {"A": "每逾三日按滯納數額加徵百分之一滯納金;逾 30 日仍未繳納者,移送強制執行", "B": "每逾二日按滯納數額加徵百分之一滯納金;逾 30 日仍未繳納者,移送強制執行", "C": "每逾一日按滯納數額加徵千分之一滯納金;逾 10 日仍未繳納者,移送強制執行", "D": "每逾一日按滯納數額加徵千分之一滯納金;逾 20 日仍未繳納者,移送強制執行"}, "answer": "A", "note": ""}, {"id": "tax-113-2", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 2, "question": "若因適用法令、認定事實、計算或其他原因之錯誤,且非歸責於政府機關,所致之溢繳稅款,納稅義\n務人得自繳納之日起幾年內提出具體證明,申請退還?", "options": {"A": "20 年", "B": "15 年", "C": "10 年", "D": "無期限"}, "answer": "C", "note": ""}, {"id": "tax-113-3", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 3, "question": "為降低納稅義務人因強制執行發生不能恢復損害之可能,並兼顧納稅義務人權益,若納稅義務人對復\n查決定之應納稅額繳納部分比例之稅額,並依法提起訴願者,得暫緩移送強制執行。該繳納比例依現\n行稅捐稽徵法之規定為何?", "options": {"A": "四分之一", "B": "三分之一", "C": "二分之一", "D": "十分之一"}, "answer": "B", "note": ""}, {"id": "tax-113-4", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 4, "question": "稅捐稽徵法有關罰則之規定,下列敘述何者錯誤?", "options": {"A": "代徵人或扣繳義務人以詐術或其他不正當方法匿報、短報、短徵或不為代徵或扣繳稅捐者,處五年\n以下有期徒刑、拘役或科或併科新臺幣六萬元以下罰金", "B": "教唆或幫助納稅義務人以詐術或其他不正當方法逃漏稅捐者,處三年以下有期徒刑,併科新臺幣一\n百萬元以下罰金", "C": "營利事業依法規定應給與他人憑證而未給與,應自他人取得憑證而未取得,或應保存憑證而未保存\n者,應就其未給與憑證、未取得憑證或未保存憑證,經查明認定之總額,處百分之十之罰鍰,處罰\n金額最高不得超過新臺幣五十萬元", "D": "不依規定保存帳簿或無正當理由而不將帳簿留置於營業場所者,處新臺幣一萬五千元以上六萬元以下\n罰鍰"}, "answer": "C", "note": ""}, {"id": "tax-113-5", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 5, "question": "納稅義務人甲君於 108 年 5 月 21 日申報其 107 年度綜合所得稅,試問該案核課期間屆滿日為何?", "options": {"A": "113 年 5 月 20 日", "B": "113 年 5 月 31 日", "C": "115 年 5 月 20 日", "D": "115 年 5 月 31 日"}, "answer": "A", "note": ""}, {"id": "tax-113-6", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 6, "question": "承上題,國稅局在 111 年 1 月發現甲君有漏報所得情形,於 111 年 1 月 31 日送達核定通知書及繳款\n書予甲君。甲君對本次補徵稅捐不服,在同年 2 月 9 日提起行政救濟,經行政法院於 113 年 6 月 10\n日判決確定撤銷國稅局 111 年 1 月 31 日之核課處分,並請國稅局應另為處分。試問國稅局應在何日\n之前應重新核定補徵稅捐並通知送達甲君,否則就不能再對甲君補徵其 107 年度綜合所得稅?", "options": {"A": "113 年 12 月 9 日", "B": "114 年 6 月 9 日", "C": "116 年 1 月 30 日", "D": "116 年 2 月 8 日"}, "answer": "B", "note": ""}, {"id": "tax-113-7", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 7, "question": "民眾接獲臺北市稅捐稽徵處所寄發的各類稅捐繳納通知文書有記載、計算錯誤或重複時,得如何處理?", "options": {"A": "於繳納期間屆滿之翌日起 30 日內,向臺北市稅捐稽徵處申請復查", "B": "於繳納期間屆滿之翌日起 30 日內,向臺北市政府申請復查", "C": "於規定繳納期間內,得要求臺北市稅捐稽徵處查對更正", "D": "於規定繳納期間內,得要求臺北市政府查對更正"}, "answer": "C", "note": ""}, {"id": "tax-113-8", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 8, "question": "依據稅捐稽徵法,有關納稅義務的規定,下列敘述何者錯誤?", "options": {"A": "共有財產未設管理人者,共有人各按其應有部分負納稅義務,其為公同共有時,以全體公同共有人\n為納稅義務人", "B": "法人、合夥或非法人團體解散清算時,清算人於分配賸餘財產前,應依法按稅捐受清償之順序,繳清\n稅捐", "C": "納稅義務人死亡,遺有財產者,其依法應繳納之稅捐,應由遺囑執行人、繼承人、受遺贈人或遺產\n管理人,依法按稅捐受清償之順序,繳清稅捐後,始得分割遺產或交付遺贈", "D": "營利事業因合併而消滅時,應先繳清其於合併前之應納稅捐,始可合併"}, "answer": "D", "note": ""}, {"id": "tax-113-9", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 9, "question": "若納稅義務人為非中華民國境內居住之個人,或在中華民國境內無固定營業場所之營利事業,下列各\n種所得之扣繳率何者正確?", "options": {"A": "短期票券到期兌償金額超過首次發售價格部分之利息,按給付額扣取 10%", "B": "非中華民國境內居住之個人,如有公司分配之股利,合作社分配之盈餘,其他法人分配或應分配之\n盈餘,合夥組織營利事業合夥人每年應分配之盈餘,獨資組織營利事業資本主每年所得之盈餘,按\n給付額、應分配額或所得數扣取 15%", "C": "權利金按給付額扣取 10%", "D": "競技、競賽、機會中獎獎金或給與按給付全額扣取 20%,但政府舉辦之獎券中獎獎金,每聯(組、\n注)獎額不超過新臺幣 5,000 元者,得免予扣繳"}, "answer": "D", "note": ""}, {"id": "tax-113-10", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 10, "question": "甲於 113 年 1 月 6 日因病往生,申報核定之遺產總額為 1 億元,全部為不動產,其中包含 3,000 萬元\n的公共設施保留地 A 地;經核定應納遺產稅額為 300 萬元。繼承人乙於繳納期限前申請以 A 地抵繳\n遺產稅,A 地乃 70 年被劃設為公共設施保留地,而甲於 80 年購買並登記過戶。A 地得申請抵繳遺產\n稅的上限金額為?", "options": {"A": "3,000 萬元", "B": "300 萬元", "C": "100 萬元", "D": "90 萬元"}, "answer": "D", "note": ""}, {"id": "tax-113-11", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 11, "question": "自 107 年 1 月 1 日起,有關納稅義務人、配偶及其受扶養親屬所獲配公司、合作社及其他法人分配 87\n年度或以後年度之股利或盈餘的課稅規定,下列敘述何者正確?", "options": {"A": "得選擇就該申報戶股利及盈餘合計金額按 5%計算可抵減稅額,抵減當年度之綜合所得稅結算申報\n應納稅額,每一申報戶每年抵減金額以 30 萬元為限", "B": "得選擇就該申報戶股利及盈餘合計金額按 28%之稅率分開計算應納稅額,由納稅義務人合併報繳", "C": "得選擇就該申報戶股利及盈餘合計金額按 10%計算可抵減稅額,抵減當年度之綜合所得稅結算申報\n應納稅額,每一申報戶每年抵減金額以 8 萬元為限", "D": "得選擇就該申報戶股利及盈餘合計金額按 21%之稅率分開計算應納稅額,由納稅義務人合併報繳"}, "answer": "B", "note": ""}, {"id": "tax-113-12", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 12, "question": "營利事業及其關係人直接或間接持有在中華民國境外低稅負國家或地區之關係企業股份或資本額合\n計達 50%以上或對該關係企業具有重大影響力者,除符合相關規定免計入者外,應將該關係企業當年\n度之盈餘,依法認列投資收益,計入當年度所得額課稅。上述所稱「低稅負國家或地區」,下列敘述\n何者正確?", "options": {"A": "該關係企業所在國家或地區,其營利事業所得稅或實質類似租稅之稅率未逾 20%或僅對其境內來源\n所得課稅者", "B": "該關係企業所在國家或地區,其營利事業所得稅或實質類似租稅之稅率未逾 18%或僅對其境內來源\n所得課稅者", "C": "該關係企業所在國家或地區,其營利事業所得稅或實質類似租稅之稅率未逾 14%或僅對其境內來源\n所得課稅者", "D": "該關係企業所在國家或地區,其營利事業所得稅或實質類似租稅之稅率未逾 17%或僅對其境內來源\n所得課稅者"}, "answer": "C", "note": ""}, {"id": "tax-113-13", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 13, "question": "甲公司於 112 年 9 月 1 日正式開業,採曆年制會計年度;112 年度之課稅所得額為 10 萬元,請問甲\n公司之 112 年度營利事業所得稅應如何處理?", "options": {"A": "因營業未滿一年,且全年課稅所得額未達起徵點 12 萬元,故將 112 年度之所得額併入 113 年度之\n課稅所得於 114 年 5 月辦理結算申報", "B": "應於 113 年 5 月辦理結算申報,但因全年課稅所得額未達起徵點 12 萬元,應納稅額為 0 元", "C": "應於 113 年 5 月辦理結算申報,應納稅額為 1 萬元", "D": "應於 113 年 5 月辦理結算申報,應納稅額為 2 萬元"}, "answer": "D", "note": ""}, {"id": "tax-113-14", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 14, "question": "總機構在中華民國境外之營利事業,如在中華民國境內經營國際運輸、承包營建工程、提供技術服務\n或出租機器設備等業務,其成本費用分攤計算困難者,得向財政部申請核准,或由財政部核定,按其\n在中華民國境內營業收入之特定比例計算為中華民國境內之營利事業所得額。該比例為 10%,適用下\n列何者?", "options": {"A": "國際運輸業務", "B": "承包營建工程業務", "C": "提供技術服務業務", "D": "出租機器設備業務"}, "answer": "A", "note": ""}, {"id": "tax-113-15", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 15, "question": "依據所得稅法,關於「非中華民國境內居住之個人」而有中華民國來源所得者的所得稅課徵,下列敘\n述何者錯誤?", "options": {"A": "屬扣繳範圍之所得,應由扣繳義務人按各類所得扣繳率就源扣繳,無須辦理結算申報", "B": "不屬扣繳範圍之所得,如財產交易所得與一時貿易盈餘所得等,應按規定扣繳率申報納稅", "C": "外籍人士於同一課稅年度內在中華民國境內居留只要合計未滿 183 天,在中華民國境內提供勞務而\n自境外雇主取得的勞務報酬,不屬於中華民國來源所得,免課徵所得稅", "D": "於一課稅年度內,在中華民國境內有住所,但非經常居住中華民國境內,屬於非中華民國境內居住\n之個人。扣繳義務人給付該個人各類所得時,應於給付時依規定之扣繳率扣取稅款"}, "answer": "C", "note": ""}, {"id": "tax-113-16", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 16, "question": "依據所得稅法,下列何者屬於列舉扣除額的項目?1災害損失 2財產交易損失 3長期照顧\n4房屋租金支出 5自用住宅購屋借款利息 6教育學費", "options": {"A": "僅15", "B": "僅145", "C": "僅234", "D": "僅2346"}, "answer": "A", "note": ""}, {"id": "tax-113-17", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 17, "question": "依據所得稅法,有關營利事業所得稅的暫繳規定,下列敘述何者錯誤?", "options": {"A": "營利事業原則上應於每年 9 月 1 日起至 9 月 30 日止,按其上年度結算申報營利事業所得稅應納稅\n額之 1/3 為暫繳稅額,自行向庫繳納", "B": "公司組織之營利事業,會計帳冊簿據完備,使用藍色申報書或經會計師查核簽證,並如期辦理暫繳\n申報者,得以當年度前 6 個月之營業收入總額,試算其前半年之營利事業所得額,按當年度稅率,\n計算其暫繳稅額", "C": "獨資、合夥組織之營利事業及經核定之小規模營利事業,免辦理暫繳", "D": "營利事業未以投資抵減稅額、行政救濟留抵稅額及扣繳稅額抵減暫繳稅額者,於自行向庫繳納暫繳\n稅款後,得免辦理暫繳申報"}, "answer": "A", "note": ""}, {"id": "tax-113-18", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 18, "question": "依據所得稅法,有關扣繳義務人給付各類所得所扣取稅款的處理,下列敘述何者錯誤?", "options": {"A": "應於每月 15 日前將上一月內所扣稅款向國庫繳清", "B": "應於每年 1 月底前將上一年內扣繳各納稅義務人之稅款數額,開具扣繳憑單,彙報該管稽徵機關查核", "C": "應於每年 2 月 10 日前將扣繳憑單填發納稅義務人", "D": "扣繳義務人針對非中華民國境內居住之個人,或在中華民國境內無固定營業場所之營利事業所扣取\n的稅款,應於代扣稅款之日起 10 日內,將所扣稅款向國庫繳清,並開具扣繳憑單,發給納稅義務人"}, "answer": "A", "note": ""}, {"id": "tax-113-19", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 19, "question": "甲君 112 年度的綜合所得淨額為 5,000,000 元,一般所得稅額為 1,200,000 元。甲君另有海外所得\n5,000,000 元、受益人與要保人非屬同一人的人壽保險給付1,000,000 元、上市櫃股票交易所得 1,000,000\n元、未上市櫃股票交易所得 1,500,000 元、申報綜合所得稅時減除的現金捐贈金額 500,000 元與非現\n金捐贈金額 500,000 元。計算基本稅額的扣除金額經消費者物價指數調整為 6,700,000 元,試問甲君\n112 年度應繳納的所得稅為何?", "options": {"A": "1,200,000 元", "B": "1,260,000 元", "C": "1,460,000 元", "D": "1,560,000 元"}, "answer": "B", "note": ""}, {"id": "tax-113-20", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 20, "question": "有關所得基本稅額的申報,下列敘述何者正確?1獨資或合夥組織之營利事業無須繳納基本稅額\n2個人只要有屬於應計入基本所得額項目的所得來源,就必須申報基本稅額 3當年度綜合所得總額\n未超過免稅額及標準扣除額之合計數,得免辦結算申報者,亦可免計算、申報及繳納基本稅額 4個\n人有屬於應計入基本所得額項目的所得來源,不一定就必須繳納基本稅額。基本稅額應先與一般所得\n稅額作比較。如果一般所得稅額高於或等於基本稅額,則不必再繳納基本稅額", "options": {"A": "34", "B": "12", "C": "14", "D": "23"}, "answer": "C", "note": ""}, {"id": "tax-113-21", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 21, "question": "根據營利事業所得稅查核準則,有關折舊費用之提列,下列敘述何者錯誤?", "options": {"A": "自 93 年 1 月 1 日起經營小客車租賃業務之營利事業新購置乘人小客車,以不超過新臺幣 500 萬元\n為限,依規定耐用年數計提折舊,超提之折舊不予認定", "B": "營利事業選擇加速折舊獎勵者,以依所得稅法第 51 條規定,採用平均法及定率遞減法折舊方法為限", "C": "裝修費或重大檢查費屬於資本支出者,不得併入該項資產之實際成本餘額內計算,亦不得計算折舊,\n以避免虛增費用", "D": "營利事業持有之不動產,依國際會計準則第 40 號或企業會計準則公報第 16 號規定認列為投資性不\n動產,房屋部分應按不短於固定資產耐用年數表規定之耐用年數計提折舊費用"}, "answer": "C", "note": ""}, {"id": "tax-113-22", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 22, "question": "根據營利事業所得稅查核準則有關捐贈認列費用之規定,下列敘述何者正確?", "options": {"A": "營利事業指定對特定學校法人或私立學校之捐款得列為費用,但以不超過其所得額 30%為限", "B": "營利事業依運動產業發展條例第 26 條之二第三項規定對經中央主管機關專案核准之重點職業或業\n餘運動業,及經中央主管機關公告之重點運動賽事主辦單位之捐贈,得按捐贈金額之 150%,自所得額\n中減除", "C": "營利事業依政治獻金法第 19 條第 2 項規定,對政黨、政治團體及擬參選人之捐贈得列為費用,以\n不超過所得額 20%為限,其總額並不得超過新臺幣 250 萬元", "D": "營利事業為協助國防建設、慰勞軍隊、對各級政府、及經財政部專案核准之捐贈,以新臺幣 2,000\n萬元為限,自所得額中減除"}, "answer": "B", "note": ""}, {"id": "tax-113-23", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 23, "question": "根據營利事業所得稅查核準則之規定,旅費支出,應提示詳載逐日前往地點、訪洽對象及內容等之出\n差報告單及相關文件,足資證明與營業有關者,憑以認定;其未能提出者,應不予認定。其中有關搭\n乘各種交通工具之交通費核銷憑證,下列何種情形准以經手人(即出差人)之證明為憑,核實認定?", "options": {"A": "租賃之包車費", "B": "搭乘國內航線之飛機", "C": "搭乘國際航線之飛機", "D": "搭乘高速鐵路當日往返"}, "answer": "D", "note": ""}, {"id": "tax-113-24", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 24, "question": "我國現行營利事業所得稅查核準則,有關營利事業呆帳損失之列支以及備抵呆帳之提列,下列敘述何\n者正確?", "options": {"A": "債務人倒閉、逃匿、重整、和解或破產之宣告,或其他原因,致債權之一部或全部不能收回者,視\n為實際發生呆帳損失,並應於發生當年度沖抵備抵呆帳", "B": "債權中有逾期一年,經催收後,未經收取本金或利息者,視為實際發生呆帳損失,並應於發生當年\n度沖抵備抵呆帳", "C": "提列備抵呆帳,以應收帳款及應收票據為限,並包括已貼現之票據", "D": "備抵呆帳餘額,最高不得超過應收帳款及應收票據餘額之 3%;其為金融業者,則以其債權餘額估\n列之"}, "answer": "A", "note": ""}, {"id": "tax-113-25", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 25, "question": "根據現行營利事業所得稅查核準則之規定,下列營利事業所繳納之稅捐,何者得列為當期之費用?", "options": {"A": "公司進口貨物所繳納之關稅", "B": "上一年度所繳納之營利事業所得稅", "C": "公司名下所有之廠房、辦公室所繳納的房屋稅與地價稅", "D": "公司購買土地、房屋所繳納之契稅、印花稅等"}, "answer": "C", "note": ""}, {"id": "tax-113-26", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 26, "question": "依據營利事業所得稅查核準則,下列何者應列為「非營業收入」?", "options": {"A": "繳納的稅捐原以費用列帳者,如於繳納年度收到退稅款時", "B": "繳納的稅捐原以費用列帳者,如於以後年度始收到退稅款者", "C": "繳納外銷品進口原料應以成本列帳的稅捐,其成品於當年度外銷並收到海關退稅款者", "D": "繳納外銷品進口原料應以成本列帳的稅捐,其成品於次年度外銷並收到海關退稅款者"}, "answer": "B", "note": ""}, {"id": "tax-113-27", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 27, "question": "依據營利事業所得稅查核準則,有關營利事業列報利息費用應注意事項,下列敘述何者錯誤?", "options": {"A": "獨資資本主及合夥組織合夥人所借貸之款項,均應以資本主往來論,不得列支利息", "B": "進貨借款所支付之利息,應併入進貨成本計算", "C": "支付個人的利息,如經取得個人出具的收據並依法辦理扣繳所得稅款,可核實認定", "D": "購買供營業使用房屋、土地的借款利息,應列為資本支出。經辦妥過戶手續或交付使用後之借款利\n息,可作費用列支"}, "answer": "B", "note": ""}, {"id": "tax-113-28", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 28, "question": "依據營利事業所得稅查核準則,下列支出不屬於可核實認定的費用或損失?", "options": {"A": "因業務需要免費發給員工之工作服", "B": "沒收保證金經取得證明文據者", "C": "購置體育器具及本身舉辦員工體育活動所支付之各項費用", "D": "指定對特定學校法人或私立學校之捐款"}, "answer": "D", "note": ""}, {"id": "tax-113-29", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 29, "question": "依據營利事業所得稅查核準則,有關帳簿憑證的查核,下列敘述何者錯誤?", "options": {"A": "營利事業有漏報營業收入情事,經稽徵機關就該漏報部分按同業利潤標準核定其所得額者,其核定\n之所得額,以不超過當年度全部營業收入淨額依同業利潤標準核定之所得額為限", "B": "營利事業未提示有關各種證明所得額之帳簿文據,經稽徵機關就營業收入淨額按同業利潤標準核定\n其所得額者,如有非營業收益或損失,應依法合併計課或核實減除", "C": "營利事業如在規定送交調查時間以內申請延期提示帳簿文據者,稽徵機關應予受理。但延長的期限\n最長不得超過一個月,並以一次為限", "D": "營利事業當年度關係所得額之全部或一部的原始憑證,因遭受不可抗力災害以致滅失者,該滅失憑\n證所屬期間之所得額,稽徵機關得依該事業前三個年度經稽徵機關核定純益率之平均數核定之"}, "answer": "A", "note": ""}, {"id": "tax-113-30", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 30, "question": "依據營利事業所得稅查核準則,有關收入的查核,下列敘述何者正確?", "options": {"A": "營利事業國外進、銷貨,其入帳匯率與結匯匯率變動所產生之收益,應調整其外銷收入或進料、進\n貨成本", "B": "營利事業銷售貨物或勞務,如有隨銷售附贈禮券、獎勵積點或保固服務等,該附贈部分相對應的收\n入認列應予以遞延", "C": "外銷貨物應列為外銷貨物報關日所屬會計年度之銷貨收入處理", "D": "營利事業分期付款之銷貨,其當期損益得依全部毛利法、毛利百分比法與普通銷貨法擇一計算。所\n有產品同期分期付款銷貨損益均應採用同一計算方式,不得中途變更"}, "answer": "C", "note": ""}, {"id": "tax-113-31", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 31, "question": "根據加值型及非加值型營業稅法之規定,下列何種情形非屬營業稅課徵範圍?", "options": {"A": "營業人解散時,將餘存貨物分配予股東", "B": "外銷貨物", "C": "進口貨物", "D": "由國外進入科學園區內之園區事業的保稅貨物"}, "answer": "D", "note": ""}, {"id": "tax-113-32", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 32, "question": "下列有關銷售貨物或勞務營業稅徵免之敘述,何者正確?", "options": {"A": "與外銷有關之勞務,或在國內提供而在國外使用之勞務,非屬我國營業稅課徵範圍,免徵營業稅", "B": "銷售予免稅出口區外銷廠商之生產設備,適用零稅率,其進項稅額得申請扣抵及退稅", "C": "依法設立之免稅商店銷售與過境或出境旅客之貨物,適用免稅優惠,無銷項稅額,亦不得申請進項\n稅額扣抵及退稅", "D": "醫院、診所、療養院提供之醫療勞務、藥品、病房之住宿及膳食,屬一般銷售貨物及勞務,應課徵\n營業稅,但若為財團法人者,可申請減半徵收"}, "answer": "B", "note": ""}, {"id": "tax-113-33", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 33, "question": "國內個人消費者透過網路向在我國境內無固定營業場所之線上訂房平台業者(境外電商)購買之訂房勞\n務,有關該項勞務收入之營業稅規定,下列何者正確?", "options": {"A": "應課徵營業稅,由該線上訂房平台業者依法申報繳納營業稅", "B": "應課徵營業稅,由該國內個人消費者依法申報繳納營業稅", "C": "非屬境內銷售勞務,不課徵營業稅", "D": "適用零稅率,國內個人消費者可申請退稅"}, "answer": "A", "note": ""}, {"id": "tax-113-34", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 34, "question": "加值型營業人申報之當期營業稅額若為溢付稅額,原則上留抵次期之應納稅額,但若為下列何種情形\n者,可由主管稽徵機關查明後退還之?", "options": {"A": "因進口貨物而溢付之營業稅額", "B": "因取得固定資產而溢付之營業稅額", "C": "因勞軍購買之貨物而溢付之營業稅額", "D": "因購買再保險之國外勞務而溢付之營業稅額"}, "answer": "B", "note": ""}, {"id": "tax-113-35", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 35, "question": "A 公司為加值型營業人,今年 9-10 月之內銷銷售額 2,000 萬元,外銷銷售額為 1,000 萬元(經海關出\n口);國內進貨 1,000 萬元,稅額 50 萬元(取得統一發票扣抵聯);另購入固定資產 500 萬元,稅額\n25 萬元(取得統一發票扣抵聯),以及支付國外專利權利金 500 萬元,專供經營應稅貨物或勞務之用。\n請計算 A 公司今年 9-10 月申報之營業稅額若干?", "options": {"A": "應納稅額 25 萬元", "B": "應納稅額 50 萬元", "C": "該期無應納稅額", "D": "可退稅 50 萬元"}, "answer": "A", "note": ""}, {"id": "tax-113-36", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 36, "question": "根據加值型及非加值型營業稅法,下列何者免予繳納營業稅?", "options": {"A": "保稅貨物自保稅區進入中華民國境內之其他地區", "B": "加值型營業人購買專供經營應稅貨物或勞務的國外勞務", "C": "營業人委託他人代銷貨物", "D": "營業人將解散或廢止營業時所餘存之貨物,分配與股東或出資人"}, "answer": "B", "note": ""}, {"id": "tax-113-37", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 37, "question": "甲為兼營應稅及免稅銷售的營業人,113 年 9 月至 10 月購進貨物 1,200 萬元,支付進項稅額 60 萬元,\n進項稅額中有 10 萬元是購進自用乘人小汽車,另有 20 萬元是對政府的捐獻。同期銷售應稅貨物 2,400\n萬元,銷項稅額 120 萬元,銷售免稅貨物 1,600 萬元,其中 1,000 萬元為土地價額,故進項稅額不得\n扣抵銷項稅額比例為 20%。試問甲營業人當期應納稅額為多少?", "options": {"A": "96 萬元", "B": "88 萬元", "C": "80 萬元", "D": "72 萬元"}, "answer": "C", "note": ""}, {"id": "tax-113-38", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 38, "question": "根據加值型及非加值型營業稅法與其施行細則,有關營業稅免稅與零稅率的敘述,下列敘述何者正\n確?1零稅率表示銷售貨物或勞務所適用的營業稅率為零,由於銷項稅額為零,如有溢付稅額,得在\n退稅限額內由主管稽徵機關查明後退還 2免稅,在銷售階段免徵營業稅,但進項稅額不能扣抵或退\n還 3免稅等同於零稅率 4保稅區營業人向課稅區營業人購買機器設備,適用零稅率", "options": {"A": "123", "B": "124", "C": "僅12", "D": "僅34"}, "answer": "B", "note": ""}, {"id": "tax-113-39", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 39, "question": "試問下列何種稅籍登記之事項變更,向主管稽徵機關申請變更登記前,無須先繳清稅款或提供擔保?\n1增加資本額 2減少資本額 3營業種類變更 4營業人名稱變更 5負責人變更", "options": {"A": "僅3", "B": "345", "C": "1235", "D": "13"}, "answer": "D", "note": ""}, {"id": "tax-113-40", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 40, "question": "根據加值型及非加值型營業稅法,關於營業稅的課稅與減免範圍,下列敘述何者錯誤?", "options": {"A": "銷售免稅貨物或勞務之營業人,得申請財政部核准放棄適用免稅規定,依加值型計算營業稅額", "B": "營業人介紹國內營業人向國外廠商進口原料等,取得之外匯佣金收入,非屬零稅率之適用範圍", "C": "保稅貨物自國外進入保稅區,其應徵之營業稅由海關代徵", "D": "國際運輸事業自我國境內載運客貨出境者,屬在中華民國境內銷售勞務,必須課徵營業稅。但若該\n國際運輸事業所屬的國家,對我國國際運輸事業給予零稅率或免徵類似稅捐,則可以適用零稅率"}, "answer": "C", "note": ""}, {"id": "tax-113-41", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 41, "question": "適用零稅率的營業人,得申請以每月為一期,於次月 15 日前,填具規定格式之申報書,檢附退抵稅\n款及其他有關文件,向主管稽徵機關申報銷售額、應納或溢付營業稅額,但經核准後多久之內不得申\n請變更?", "options": {"A": "同一年度內", "B": "二年內", "C": "三年內", "D": "無限制"}, "answer": "A", "note": ""}, {"id": "tax-113-42", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 42, "question": "營業人逾規定申報限期多久時間尚未申報銷售額,主管稽徵機關得依照查得之資料,核定其銷售額及\n應納稅額並補徵?", "options": {"A": "30 日", "B": "40 日", "C": "50 日", "D": "60 日"}, "answer": "A", "note": ""}, {"id": "tax-113-43", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 43, "question": "營業人除依法免用統一發票者外,主管稽徵機關應核定其使用統一發票,由營業人向主管稽徵機關申\n請核發統一發票購票證,加蓋統一發票專用章,以憑購用統一發票。但營業人有下列何種情形時,主\n管稽徵機關應停止其購買統一發票?", "options": {"A": "涉嫌開立不實統一發票", "B": "無進貨事實虛報進項稅額", "C": "滯欠營業稅未繳清", "D": "開立不實統一發票"}, "answer": "D", "note": ""}, {"id": "tax-113-44", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 44, "question": "根據我國統一發票使用辦法之規定,下列有關營業人開立統一發票之敘述,何者正確?", "options": {"A": "境外電商銷售電子勞務與國內自然人,應開立二聯式紙本發票寄送買受人", "B": "開立電子發票之營業人,買受人為非營業人者,應於開立後 7 日內將統一發票資訊及買受人以財政\n部核准載具索取電子發票之載具識別資訊傳輸至平台存證,並應使買受人得於該平台查詢、接收上\n開資訊", "C": "營業人發行現金禮券者,由持有人按禮券上所載金額,憑以兌購貨物者,於兌付貨物時開立統一發票", "D": "自動販賣機銷售食品、飲料及收取停車費或自動販賣機已具備自行列印統一發票功能者,應於月底\n彙總開立統一發票"}, "answer": "C", "note": ""}, {"id": "tax-113-45", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 45, "question": "下列何者同時符合免徵營業稅與免用或免開統一發票?1計程車業 2依法設立之免稅商店及離島\n免稅購物商店 3醫院、診所、療養院提供之醫療勞務、藥品、病房之住宿及膳食 4未經加工之生\n鮮農、林、漁、牧產物、副產物", "options": {"A": "13", "B": "23", "C": "僅3", "D": "34"}, "answer": "C", "note": ""}, {"id": "tax-113-46", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 46, "question": "下列財產移轉的情形,有關贈與稅徵免之敘述,何者錯誤?", "options": {"A": "甲成立信託契約明定信託利益全部之受益人為乙,視為甲將享有信託利益之權利贈與該受益人乙,\n應課徵贈與稅", "B": "信託關係存續中,受託人依信託本旨交付信託財產,受託人與受益人間之財產移轉,不課徵贈與稅", "C": "祖母出資 6,000 萬元為其孫購置不動產,應以該出資額 6,000 萬元計入祖母之贈與總額,課徵贈與稅", "D": "信託關係存續中,委託人追加信託財產,致增加非委託人享有信託利益之權利者,於追加時,就增\n加部分,應課徵贈與稅"}, "answer": "C", "note": ""}, {"id": "tax-113-47", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 47, "question": "有關遺產稅繳納之相關規定,下列敘述何者正確?", "options": {"A": "以中華民國境內之課徵標的物抵繳遺產稅者,其申請抵繳日之時價較死亡日之時價為低者,其得抵\n繳之稅額,從高認定,以死亡日之時價計算抵繳稅額", "B": "遺產稅應納稅額在 20 萬元以上,納稅義務人確有困難,不能一次繳納現金時,得於納稅期限內,\n向該管稽徵機關申請,分 12 期以內繳納,每期間隔以 1 個月為限", "C": "遺產稅應納稅額在 30 萬元以上,納稅義務人確有困難,不能一次繳納現金時,得於納稅期限內,\n就現金不足繳納部分申請以在中華民國境內之課徵標的物或納稅義務人所有易於變價及保管之實物一\n次抵繳", "D": "遺產稅納稅義務人,應於稽徵機關送達核定納稅通知書之日起 6 個月內,繳清應納稅款;必要時,\n得於限期內申請稽徵機關核准延期 6 個月"}, "answer": "C", "note": ""}, {"id": "tax-113-48", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 48, "question": "甲君於 113 年 8 月死亡,其為經常居住於中華民國境內的國民。依據遺產及贈與稅法的規定,下列何\n者不計入甲君的遺產總額?1甲君自己發明的專利權,價值 300 萬元 2甲君在國外的銀行存款 500\n萬元 3甲君於 106 年 10 月所繼承且已納遺產稅的財產 1,000 萬元 4甲君 112 年 12 月贈與配偶現\n金 100 萬元 5甲君 112 年 12 月贈與姪女現金 100 萬元", "options": {"A": "234", "B": "135", "C": "僅15", "D": "345"}, "answer": "C", "note": ""}, {"id": "tax-113-49", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 49, "question": "下列何種情形須課徵贈與稅?1在請求權時效內無償免除債務 2提出已支付價款確實證明的二親\n等親屬間財產之買賣,且該已支付之價款非由出賣人貸與或提供擔保向他人借得 3法人贈與給另一\n法人 4以顯著不相當之代價,讓與財產、免除或承擔債務", "options": {"A": "1234", "B": "134", "C": "14", "D": "僅4"}, "answer": "C", "note": ""}, {"id": "tax-113-50", "year": "113", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 50, "question": "若國稅局核定遺產稅應納稅額 500 萬元,下列何種情形納稅義務人不可以申請以實物抵繳?", "options": {"A": "被繼承人遺有銀行存款 200 萬元", "B": "被繼承人死亡前確有證明在中華民國境內無法收取的債權 300 萬元", "C": "被繼承人遺有易於變價的上市公司股票 100 萬元", "D": "納稅義務人所有易於變價的上市公司股票 300 萬元"}, "answer": "B", "note": ""}, {"id": "accounting-114-1", "year": "114", "subject": "accounting", "subjectName": "會計學概要", "number": 1, "question": "月若將 1,000 顆雞蛋全數售出,則兩類型雞蛋對損益表的影響總金\n額為何(請註明增加、減少,或無影響)?(9 分)\n二、甲公司於 X4 年間發現下列之會計處理狀況:X1 年初購入$600,000 的機\n器設備,但將其入帳為當期費用。X1 年底盤點期末存貨時將受託寄銷之\n商品$50,000、寄銷於他處之商品$80,000 皆計入存貨,X2 年底將運送途\n中的進貨$30,000、運送途中成本$40,000 之銷貨皆未計入存貨。甲公司\n機器設備之折舊政策係以 10 年直線法分攤,且假設無殘值。進貨合約與\n銷貨合約皆是採目的地交貨。甲公司先前的財報顯示 X2 年淨利為\n$300,000,X3 年底保留盈餘為$2,000,000。試問:\n甲公司 X2 年正確淨利?(5 分)\n甲公司 X3 年底正確保留盈餘?(5 分)\n三、甲公司 X1 年底存貨按先進先出法計算之成本金額為$80,000,公允價值\n為$70,000,重置成本為$40,000,估計售價為$68,000,估計銷售費用為\n$3,000。X2 至 X4 年底按先進先出法計算之成本金額分別為$50,000、\n$60,000、$70,000,淨變現價值金額分別為$32,000、$63,000、$68,000。\n試問 X1 年底備抵存貨跌價損失金額,以及 X2 至 X4 年之存貨跌價損失\n或迴轉利益金額(請註明利益、損失,或不影響)?(12 分)\n四、甲公司 X1 年初發行 3 年期、每年底付息一次的,利率 12%公司債\n$100,000。若 X1 年初的市場利率為 10%,X1、X2、X3 年底的市場利率\n分別為 9%、11%、12%。試問:(最終答案請四捨五入至整數位)\n X1 年初的發行價格?X1 年底付息後該公司債(包含本金與利息相關\n負債)的帳面金額、公允價值?(9 分)\n X3 年底付息與還本前該公司債(包含本金與利息相關負債)的帳面\n金額、公允價值?(4 分)\n乙、測驗題部分:(50 分) 代號:2602\n本試題為單一選擇題,請選出一個正確或最適當答案。\n共20題,每題2.5分,須用2B鉛筆在試卡上依題號清楚劃記,於本試題或申論試卷上作答者,不予計分。\n1 乙公司 X1 年度開始營業,對存貨成本計價採用先進先出法,X3 年中該公司決定改採用加權平均\n法。各年期末存貨資料如下:\n期末存貨 X1 年度 X2 年度 X3 年度\n先進先出法 $270,000 $460,000 $400,000\n加權平均法 $300,000 $520,000 $500,000\n試問該存貨之會計政策改變對 X3 年度淨利的影響金額為何?(不考慮所得稅)", "options": {"A": "減少$40,000", "B": "增加$40,000", "C": "減少$100,000", "D": "增加$100,000"}, "answer": "B", "note": ""}, {"id": "accounting-114-2", "year": "114", "subject": "accounting", "subjectName": "會計學概要", "number": 2, "question": "下列對負債的敘述,何者錯誤?", "options": {"A": "企業因營業活動而發生的債務,預期在一個正常營業週期中清償者,即使清償期限超過報導期\n間結束日後 12 個月,也應列為流動負債", "B": "企業主要為交易目的而發生的負債,列為流動負債", "C": "企業預期於報導期間結束日後 12 個月內清償者,列為流動負債", "D": "企業雖在報導期間結束日後才完成長期性再融資或展期,仍可列為非流動負債"}, "answer": "D", "note": ""}, {"id": "accounting-114-3", "year": "114", "subject": "accounting", "subjectName": "會計學概要", "number": 3, "question": "甲公司 X1 年度存貨之成本與零售價資料如下:\n成 本 零售價\n期初存貨 $ 6,000 ?\n本期進貨 $21,000 $ 26,000\n淨加價 $ 3,500\n淨減價 $ 1,500\n銷貨淨額 $ 13,500\n因為該公司當年度期初存貨零售價之資料損毀,僅保留期初存貨之成本為$6,000;但已知該公司\nX1 年度採用先進先出成本零售價法所計算之 X1 年度期末存貨成本為$18,000。試問甲公司 X1 年\n度期初存貨零售價金額為何?", "options": {"A": "$9,500", "B": "$10,500", "C": "$12,500", "D": "$15,500"}, "answer": "A", "note": ""}, {"id": "accounting-114-4", "year": "114", "subject": "accounting", "subjectName": "會計學概要", "number": 4, "question": "乙公司 X3 年度銷貨成本為$1,000,000,當年度應收帳款淨額增加$100,000,存貨減少$200,000,\n應付帳款增加$300,000。試問乙公司 X3 年度進貨支付現金之金額為何?", "options": {"A": "$500,000", "B": "$900,000", "C": "$1,000,000", "D": "$1,400,000"}, "answer": "A", "note": ""}, {"id": "accounting-114-5", "year": "114", "subject": "accounting", "subjectName": "會計學概要", "number": 5, "question": "丙公司倉庫於 X1 年 9 月 16 日因遭受火災,導致倉庫內的全部存貨損毀,截至火災前存貨之帳列\n相關資料如下:期初存貨$200,000,進貨$1,000,000,進貨退回$50,000,進貨運費$30,000。\n銷貨收入共計$1,200,000,其中包含預計於 9 月 16 日出貨,以起運點交貨條件之商品存貨售價\n$100,000,但因尚未來得及出貨即遭受火災損毀。丙公司的平均毛利率為 20%。試問丙公司估計\n此次火災造成之存貨損失金額為何?", "options": {"A": "$220,000", "B": "$270,000", "C": "$284,000", "D": "$300,000"}, "answer": "D", "note": ""}, {"id": "accounting-114-6", "year": "114", "subject": "accounting", "subjectName": "會計學概要", "number": 6, "question": "甲公司於 X4 年 3 月 1 日取得 3 個月到期的附息票據一張,面額$80,000,利率 5%。5 月 1 日因公\n司急需現金,故持該票據以 10%的貼現率向銀行貼現。甲公司的貼現損失為何?", "options": {"A": "$342", "B": "$333", "C": "$667", "D": "$675"}, "answer": "A", "note": ""}, {"id": "accounting-114-7", "year": "114", "subject": "accounting", "subjectName": "會計學概要", "number": 7, "question": "甲公司 3 月 31 日銀行對帳單顯示餘額為$72,000,而公司帳列銀行存款餘額為$85,000。經分析兩\n者差異來自下列情況:\n(1)銀行代收乙客戶開立的票據款$20,500,公司尚未入帳。\n(2)銀行存款本月的利息收入為$500,公司尚未入帳。\n(3)銀行收取帳戶手續費$200,公司尚未入帳。\n(4)甲公司於 3 月 15 日送存的支票因存款不足而退票,金額$12,000,銀行尚未通知甲公司。\n(5)甲公司開立支票付款,至 3 月 31 日仍有未兌現金額$5,000。\n(6)3 月 31 日甲公司送存的支票有一筆在途存款$26,800。\n請問 3 月底正確的銀行存款餘額應為多少?", "options": {"A": "$102,600", "B": "$115,600", "C": "$96,000", "D": "$93,800"}, "answer": "D", "note": ""}, {"id": "accounting-114-8", "year": "114", "subject": "accounting", "subjectName": "會計學概要", "number": 8, "question": "甲公司 X1 年初平價購入面額$100,000 乙公司之公司債,票面利率 10%,每年年底付息一次,5 年\n到期,手續費$1,000,手續費列為當期費用。甲公司購買該公司債的目的為賺取價差,因此將該\n債券投資分類為透過損益按公允價值衡量之金融資產。X1 年底該債券投資的公允價值為\n$102,000。試問若該債券投資在原始認列時,選擇將手續費$1,000 列為成本,對 X1 年度損益的影\n響為何?(不考慮所得稅)", "options": {"A": "淨利不變", "B": "淨利減少$1,000", "C": "淨利增加$1,000", "D": "淨利增加$2,000"}, "answer": "A", "note": ""}, {"id": "accounting-114-9", "year": "114", "subject": "accounting", "subjectName": "會計學概要", "number": 9, "question": "甲公司賒銷交易提供 30 天授信期間,並採用帳齡分析法估計預期信用損失,X1 年 12 月 31 日應\n收帳款帳齡分析資料如下表:\n帳 齡 應收帳款金額 預期信用損失比率 預期信用損失金額\n尚未到期 $560,000 0.5% $2,800\n31 天~60 天 $200,000 2% $4,000\n61 天~90 天 $120,000 5% $6,000\n91 天~120 天 $450,000 10% $45,000\n120 天以上 $270,000 40% $108,000\n合計 $1,600,000 $165,800\n甲公司於 X1 年間因無法收現而沖銷應收帳款金額為$1,200;此外,前期已沖銷帳款於本期收回之\n款項為$8,000。X1 年 12 月 31 日認列預期信用損失金額為$150,000。\n試問甲公司 X1 年 1 月 1 日之備抵損失餘額為何?", "options": {"A": "$7,800", "B": "$9,000", "C": "$15,800", "D": "$17,000"}, "answer": "B", "note": ""}, {"id": "accounting-114-10", "year": "114", "subject": "accounting", "subjectName": "會計學概要", "number": 10, "question": "下列關於金融資產投資的敘述,何者錯誤?", "options": {"A": "以交易為目的的權益證券投資通常分類為透過損益按公允價值衡量", "B": "按攤銷後成本衡量之權益證券投資通常列為非流動資產,若預期將於報導期間後 12 個月到期\n或處分,則轉列為流動資產", "C": "透過其他綜合損益按公允價值衡量之債券投資於除列時,應將本期及以前期間認列之累積未實\n現損益列入當期損益作為重分類之調整", "D": "按攤銷後成本衡量之債券投資若持有至到期日,不會產生處分損益"}, "answer": "B", "note": ""}, {"id": "accounting-114-11", "year": "114", "subject": "accounting", "subjectName": "會計學概要", "number": 11, "question": "甲公司於 X1 年初購入機器一部,價款$720,000,另支付運費$45,000、安裝費$15,000、與試車費\n$20,000。該機器依直線法提列折舊,估計可使用 10 年,殘值為 0。X4 年底該機器價值有減損跡\n象,估計若繼續使用至 X10 年底,未來淨現金流入的現值為$450,000,若立即出售的公允價值減\n出售成本為$420,000,原始估計的殘值與耐用年限(至 X10 年底)則不變。該公司於 X6 年底再\n度評估,發現該機器價值可回收金額為$380,000。試問 X6 年甲公司應記錄的回升利益為:", "options": {"A": "$100,000", "B": "$80,000", "C": "$40,000", "D": "$20,000"}, "answer": "D", "note": ""}, {"id": "accounting-114-12", "year": "114", "subject": "accounting", "subjectName": "會計學概要", "number": 12, "question": "在考慮淨變現價值之前,下列那一種計算存貨成本之方法提供期末存貨評價最攸關的資訊?", "options": {"A": "先進先出法", "B": "加權平均法(定期盤存制)", "C": "移動平均法(永續盤存制)", "D": "只要一致使用同一種方法,任何方法均沒有差異"}, "answer": "A", "note": ""}, {"id": "accounting-114-13", "year": "114", "subject": "accounting", "subjectName": "會計學概要", "number": 13, "question": "甲公司於 X1 年初以$1,000,000 購買一商標權,該商標權使用期限為 10 年,但到期可申請延展,\n每次可延展 10 年。甲公司當時評估該商標權可持續為公司帶來經濟效益,後續數年亦無減損跡\n象。至 X5 年初,因公司策略改變,甲公司決定於 X9 年底完全結束使用該商標權的相關業務,同\n時評估在 X5 年初該商標權可回收金額為$680,000。甲公司以直線法攤銷該商標權,估計耐用年限\n結束後無殘值。試問 X5 年之商標權攤銷費用為何?", "options": {"A": "$136,000", "B": "$120,000", "C": "$113,333", "D": "$100,000"}, "answer": "A", "note": ""}, {"id": "accounting-114-14", "year": "114", "subject": "accounting", "subjectName": "會計學概要", "number": 14, "question": "甲公司採用有效利息法攤銷其應付公司債之溢折價,下列敘述何者正確?", "options": {"A": "應付公司債之帳面金額於到期日不會等於面額", "B": "無論溢價或折價發行之應付公司債,每年的溢折價攤銷數均為遞增", "C": "無論溢價或折價發行之應付公司債,每年的帳面金額均為遞增", "D": "無論溢價或折價發行之應付公司債,每年的利息費用均為遞增"}, "answer": "B", "note": ""}, {"id": "accounting-114-15", "year": "114", "subject": "accounting", "subjectName": "會計學概要", "number": 15, "question": "乙公司為設備製造商,生產標準規格設備,亦接受特殊規格設備,皆提供 1 年售後保證型保固服務。\n乙公司 X1 年度共銷售 100 台標準規格設備,依過去經驗,約有 95%之設備 1 年內不會發生損壞;\n3%會發生小瑕疵,平均維修成本為$2,000;2%會發生大瑕疵,平均維修成本為$5,000。此外,乙\n公司 X1 年度接獲一特殊訂單,出售特殊規格設備一台,估計維修成本$8,000 的機率為 75%;維\n修成本$10,000 的機率為 20%;維修成本$20,000 的機率為 5%。\n試問乙公司 X1 年度應認列之產品保固負債準備金額為何?", "options": {"A": "$16,000", "B": "$20,000", "C": "$24,000", "D": "$25,000"}, "answer": "C", "note": ""}, {"id": "accounting-114-16", "year": "114", "subject": "accounting", "subjectName": "會計學概要", "number": 16, "question": "甲公司於 X1 年 7 月 1 日以$924,184 的價格發行了面額$1,000,000,票面利率 8%的 5 年期公司債,\n每年 6 月 30 日付息。發行時市場利率為 10%。X3 年 1 月 1 日,管理當局決定以$950,000 提前收\n回全部公司債,試問收回公司債的損益為何?(請選擇四捨五入後最接近數字)", "options": {"A": "收回公司債損失$25,816", "B": "收回公司債損失$13,398", "C": "收回公司債損失$6,568", "D": "收回公司債利益$6,568"}, "answer": "C", "note": ""}, {"id": "accounting-114-17", "year": "114", "subject": "accounting", "subjectName": "會計學概要", "number": 17, "question": "甲公司 X4 年度稅後淨利為$172,650。其 X4 年股東權益事項有下列相關資訊:\n(1)X4 年初普通股流通在外 270,000 股,4 月 1 日收回庫藏股 20,000 股,10 月 1 日發行 10%股票\n股利。\n(2)甲公司有面額$100 之累積非參加特別股 1,500 股流通在外,股利率 7%,已積欠 2 年股利。\n(3)甲公司另有面額$200 之非累積非參加特別股 3,000 股流通在外,股利率 10%,X4 年度未宣告\n股利。\n試問甲公司 X4 年之基本每股盈餘為何?", "options": {"A": "$0.29", "B": "$0.50", "C": "$0.58", "D": "$0.62"}, "answer": "C", "note": ""}, {"id": "accounting-114-18", "year": "114", "subject": "accounting", "subjectName": "會計學概要", "number": 18, "question": "乙公司 X1 年度將銷售一款新型商品,新商品第 1 年上市估計僅能銷售 500,000 單位,單位變動\n成本$180。\n估計固定成本將包括折舊費用$2,700,000,租金費用$2,800,000,管理費用$2,000,000,以及廣告費\n用$2,500,000。\n試問乙公司欲在 X1 年度達成損益兩平目標,對於新型商品的單位售價應設定之金額為何?", "options": {"A": "$191", "B": "$195", "C": "$200", "D": "$202"}, "answer": "C", "note": "", "explanation": {"reason": "固定成本合計 1,000 萬元。銷量 50 萬單位時，每單位須提供 20 元邊際貢獻以攤平固定成本。再加上每單位變動成本 180 元，所需售價為 200 元。", "terms": "損益兩平是總收入等於總成本。單位邊際貢獻是單位售價減單位變動成本。", "formulas": "損益兩平單價＝單位變動成本＋固定成本 ÷ 銷量。"}}, {"id": "accounting-114-19", "year": "114", "subject": "accounting", "subjectName": "會計學概要", "number": 19, "question": "甲企業有兩位合夥人 A 君與 B 君,X4 年初之資本餘額為:A 君$450,000,B 君$950,000,損益約\n定由兩人平分。若 C 君以$600,000 現金投入甲企業並取得五分之一權益,此時三位合夥人的資本\n額比例(A:B:C)為:", "options": {"A": "22.5%:47.5%:30%", "B": "35%:35%:30%", "C": "25.7%:54.3%:20%", "D": "27.5%:52.5%:20%"}, "answer": "D", "note": ""}, {"id": "accounting-114-20", "year": "114", "subject": "accounting", "subjectName": "會計學概要", "number": 20, "question": "甲公司擁有一棟辦公大樓,今年支付$500,000 現金維修電梯,此支出為經常性維修,並不增加電\n梯功能或延長使用年限。若甲公司誤將此維修記錄為:借記電梯設備$500,000,貸記現金$500,000,\n後續並提列折舊,對本期淨利與營業活動淨現金流入的影響為何?", "options": {"A": "本期淨利:高估;營業活動淨現金流入:無影響", "B": "本期淨利:高估;營業活動淨現金流入:高估", "C": "本期淨利:低估;營業活動淨現金流入:無影響", "D": "本期淨利:低估;營業活動淨現金流入:高估"}, "answer": "B", "note": "", "explanation": {"reason": "經常性維修應認列當期費用，現金支出列營業活動。誤列設備後，本期只認列部分折舊，費用低估而淨利高估。現金支出被歸入投資活動，使營業活動淨現金流入高估。", "terms": "費用化是將支出列入當期損益。資本化是將符合條件的支出列為資產，並依適用方式分攤。", "formulas": "本題以費用認列及現金流量分類判斷，無需套用公式。"}}, {"id": "bookkeeping-114-1", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 1, "question": "依商業會計法之規定,甲股份有限公司的章程規定「本公司主辦會計人員之任免,應由董事會以董事\n三分之二出席,及出席董事全體同意。」則甲股份有限公司欲聘僱主辦會計人員,請問應如何處理?", "options": {"A": "董事會以董事三分之二出席,及出席董事全體同意的決議", "B": "董事會以董事二分之一出席,及出席董事二分之一同意的決議", "C": "董事會以全體董事出席,及出席董事全體同意的決議", "D": "董事會以董事三分之一出席,及出席董事全體同意的決議"}, "answer": "A", "note": ""}, {"id": "bookkeeping-114-2", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 2, "question": "某乙公司為外國企業,要在高雄市設立分公司,分公司的資本額為新臺幣 1 億元。請問該外國企業的\n分公司在臺灣登記之受理機關及會計事務之主管機關為何?", "options": {"A": "分公司登記:經濟部商業發展署;會計事務:高雄市政府經濟發展局", "B": "分公司登記:經濟部商業發展署;會計事務:經濟部商業發展署", "C": "分公司登記:高雄市政府經濟發展局;會計事務:高雄市政府經濟發展局", "D": "分公司登記:經濟部商業發展署;會計事務:財政部高雄國稅局"}, "answer": "B", "note": ""}, {"id": "bookkeeping-114-3", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 3, "question": "有關商業主辦會計人員之任免、委任記帳士處理商業會計事務之程序,應否依商業會計法第 5 條規定\n程序處理,下列敘述何者正確?", "options": {"A": "全部商業組織皆須依規定處理", "B": "僅股份有限公司組織須依規定處理", "C": "僅獨資、合夥組織須依規定處理", "D": "僅公司組織須依規定處理"}, "answer": "D", "note": ""}, {"id": "bookkeeping-114-4", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 4, "question": "根據商業會計法第 12 條之規定,商業得依其實際業務情形、會計事務之性質、內部控制及管理上之\n需要,訂定何種作業程序?", "options": {"A": "會計憑證", "B": "會計報表", "C": "會計項目", "D": "會計制度"}, "answer": "D", "note": ""}, {"id": "bookkeeping-114-5", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 5, "question": "甲有限公司 110 年 9 月以新臺幣 200 萬元購進商品一批,另以新臺幣 110 萬元售予個人 A 一批商品,\n請問甲有限公司該二商品交易之收支,依商業會計法第 9 條規定,下列敘述何者正確?", "options": {"A": "支付貨款必須採用核定的支付工具,收取銷售額可收取現金", "B": "支付貨款及收取銷售額皆不能使用現金", "C": "支付貨款及收取銷售額都必須採用核定的收支工具", "D": "支付貨款可以現金支付,收取銷售額必須採用核定的支付工具"}, "answer": "A", "note": ""}, {"id": "bookkeeping-114-6", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 6, "question": "屏東公司派 A 到市場購買中元節拜拜需用的三牲及水果,由於肉販及菜販無法給予 A 相關之原始憑\n證。試問依照商業會計法第 19 條的規定,正確之處理方式為何?", "options": {"A": "屏東公司應根據事實及金額作成憑證,由商業負責人簽名或蓋章,憑以記帳。此外也要請 A 及 A\n的主管分別或共同證明有購買三牲及水果之事實", "B": "屏東公司應根據事實及金額作成憑證,由商業負責人簽名或蓋章,憑以記帳。無需請 A 及 A 的主\n管分別或共同證明有購買三牲及水果之事實", "C": "屏東公司不應入帳購買三牲及水果之交易事件,因為無法取得原始憑證", "D": "屏東公司只要請 A 及 A 的主管分別或共同證明有購買三牲及水果之事實即可入帳"}, "answer": "A", "note": ""}, {"id": "bookkeeping-114-7", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 7, "question": "下列有關生產性植物之敘述,何者正確?", "options": {"A": "生產性植物採公允價值減出售成本衡量", "B": "生產性植物不適用減損測試", "C": "生產性植物也可以辦理資產重估價", "D": "生產性植物沒有調整折舊之問題"}, "answer": "C", "note": ""}, {"id": "bookkeeping-114-8", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 8, "question": "依商業會計法及相關法規規定,關於原始憑證之敘述,下列何者錯誤?", "options": {"A": "員工薪資扣繳憑單及買賣契約書均屬於原始憑證之範圍", "B": "商業外來憑證及對外憑證,應由開具人簽名或蓋章", "C": "原始憑證係自其商業本身以外之人所取得者,稱為外來憑證", "D": "原始憑證為證明處理會計事項人員之責任,而為記帳所根據之憑證"}, "answer": "D", "note": ""}, {"id": "bookkeeping-114-9", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 9, "question": "屏東縣記帳士公會目前依章程規定共設置理事 A、B、C、D、E 等 5 人。假設下期改選理事,共 9 人\n參選其得票高至低依序為 D、E、C、A、F、G、B、H、I 等 9 人,則依記帳士法第 23 條的規定,下\n列敘述何者錯誤?", "options": {"A": "屏東縣記帳士公會的理事長,連任以 1 次為限", "B": "屏東縣記帳士公會現任理事最多有 3 人可以連任", "C": "屏東縣記帳士公會下屆可連任的理事分別為 D 及 E", "D": "屏東縣記帳士公會下屆的理事名單分別為 D、E、F、G 及 H"}, "answer": "B", "note": ""}, {"id": "bookkeeping-114-10", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 10, "question": "傳票上登載之會計項目,下列敘述何者正確?", "options": {"A": "收入傳票及支出傳票皆有借方、貸方會計項目", "B": "收入傳票:貸方會計項目,支出傳票:借方會計項目", "C": "收入傳票:借方會計項目,支出傳票:貸方會計項目", "D": "收入傳票及支出傳票皆無借方、貸方會計項目"}, "answer": "B", "note": ""}, {"id": "bookkeeping-114-11", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 11, "question": "依據商業會計法及商業會計處理準則之規定,下列敘述何者正確?", "options": {"A": "會計事項應於發生的翌日登帳,至遲不得超過 2 個月", "B": "會計憑證為權責存在之憑證或應予永久保存或另行裝訂較便者,得另行保管", "C": "會計帳簿可由代表商業之負責人授權經理人、主辦或經辦會計人員簽名或蓋章", "D": "對外憑證之正本有誤寫或收回作廢者,應將其粘附於原號副本或存根之上,其有缺少或不能收回者,\n可以不用說明理由"}, "answer": "B", "note": ""}, {"id": "bookkeeping-114-12", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 12, "question": "甲企業社設立於臺南市,登記資本額為新臺幣 6 萬元,會計事務擬委由記帳士代為處理,依商業會計\n法規定,其商業會計事務之管理機關,下列何者正確?", "options": {"A": "得不受商業會計法之規範", "B": "臺南市政府", "C": "財政部", "D": "經濟部"}, "answer": "B", "note": ""}, {"id": "bookkeeping-114-13", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 13, "question": "高雄公司 114 年會計年度終了日為 114 年 12 月 31 日,決算辦理完竣日為 115 年 5 月 15 日,決算程\n序終了日為 115 年 6 月 15 日,則下列敘述何者錯誤?", "options": {"A": "高雄公司的決算期限已多延長 2 個半月", "B": "高雄公司的決算程序終了是指營業報告書及財務報表經提請股東常會承認的程序完成", "C": "高雄公司 114 年度之會計帳簿及財務報表,除應永久保存或有關未結會計事項者外,應從 115 年 5 月\n15 日起算,至少保存 10 年", "D": "高雄公司 114 年度之會計憑證,除應永久保存或有關未結會計事項者外,應從 115 年 6 月 15 日起\n算,至少保存 5 年"}, "answer": "C", "note": ""}, {"id": "bookkeeping-114-14", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 14, "question": "依照商業會計法第 42 條之規定,受贈資產按公允價值入帳,並視其性質以不同項目記錄。假設位於\n屏東科技園區之某蘭花生技公司大幅受關稅影響,農業部將給予該公司營運困難的紓困補助,該補助\n屬於無附加條件的政府補助,則要以下列何種會計項目入帳?", "options": {"A": "遞延政府補助收益", "B": "政府補助收益", "C": "資本公積-政府補助收益", "D": "其他權益-政府補助收益"}, "answer": "B", "note": ""}, {"id": "bookkeeping-114-15", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 15, "question": "甲股份有限公司 113 年度財務報表於 114 年 3 月 31 日經股東會通過,該公司屏東廠不幸於 114 年 2 月\n1 日因火災遭受重大損失,此事件之處理依商業會計法規定,下列敘述何者正確?", "options": {"A": "113 年度財務報表應予附註揭露", "B": "應調整 113 年度財務報表", "C": "113 年度財務報表不必做任何處理", "D": "視該公司是否有投保再決定如何處理"}, "answer": "A", "note": ""}, {"id": "bookkeeping-114-16", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 16, "question": "依現行商業會計法及商業會計處理準則規定,下列敘述何者錯誤?", "options": {"A": "當存貨成本高於淨變現價值時,應將成本沖減至淨變現價值,沖減金額應於發生當期認列為銷貨\n成本", "B": "預付費用應為有益於未來,確應由以後期間負擔之費用,其衡量應以其有效期間已經過部分為準", "C": "流動資產不包括於資產負債表日後逾 12 個月用以交換、清償負債或受有其他限制者", "D": "金融工具投資應視其性質採公允價值、成本或攤銷後成本之方法衡量"}, "answer": "B", "note": ""}, {"id": "bookkeeping-114-17", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 17, "question": "依據商業會計法第 23 條之規定,商業必須設置之會計帳簿為何者?", "options": {"A": "特種序時帳簿及總分類帳簿", "B": "特種序時帳簿及明細分類帳簿", "C": "普通序時帳簿及總分類帳簿", "D": "普通序時帳簿及明細分類帳簿"}, "answer": "C", "note": ""}, {"id": "bookkeeping-114-18", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 18, "question": "依商業會計處理準則規定,下列有關記帳憑證保管之敘述,何者正確?1應至少保存 5 年 2保管期\n限屆滿經會計經理核准後得予銷毀 3需由經辦會計人員簽章 4裝訂時記帳憑證應附於原始憑證\n之後作為附件 5應製作目錄備查", "options": {"A": "2345", "B": "1235", "C": "1245", "D": "135"}, "answer": "D", "note": ""}, {"id": "bookkeeping-114-19", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 19, "question": "下列有關長期性投資之敘述,何者錯誤?", "options": {"A": "長期性之投資有提供作質,或受有約束、限制等情事者,應予調整", "B": "持有具重大影響力或控制能力之權益工具投資,屬於長期性投資之一,必須採用權益法處理", "C": "採用權益法之長期投資一旦發生減損跡象,必須進行減損測試及調整", "D": "以成本衡量之權益工具投資-非流動,屬於長期性投資之一,後續減損跡象不存在或減少時仍不予\n迴轉"}, "answer": "A", "note": ""}, {"id": "bookkeeping-114-20", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 20, "question": "下列為臺南公司 114 年度兩個庫藏股票之交易事件。第一,因部分股東反對公司將南部廠房出租予他\n公司,經雙方協議,以每股$11 買回異議股東持有的股份 10,000 股。第二,公司為培植優秀員工,以\n每股$15 買回 20,000 股,備供轉讓予員工。試問依照商業會計處理準則要如何處理上述庫藏股之交易\n事件?", "options": {"A": "以$300,000 列為權益減項,並註明股數", "B": "以$300,000 列為權益加項,並註明股數", "C": "以$410,000 列為權益加項,並註明股數", "D": "以$410,000 列為權益減項,並註明股數"}, "answer": "D", "note": ""}, {"id": "bookkeeping-114-21", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 21, "question": "依據商業會計處理準則之規定,下列何者應認列為投資性不動產?", "options": {"A": "屏東建設公司持有為建設的房屋地基", "B": "屏東建設公司持有總公司的辦公大樓地基", "C": "屏東建設公司持有出租之商辦大樓地基", "D": "屏東建設公司持有屏東高鐵預定地旁的土地,目前閒置但未來將作為分公司的預定地"}, "answer": "C", "note": ""}, {"id": "bookkeeping-114-22", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 22, "question": "依照商業會計處理準則第 24 條之規定,假設甲公司因為資產重估,目前帳上有未實現重估增值\n$100,000。然而後續因減損測試,必須要調整之減損損失為$120,000,則相關之會計處理何者正確?", "options": {"A": "應先減少未實現重估增值$100,000,再認列$20,000 的減損損失", "B": "直接認列$120,000 的減損損失", "C": "直接減少$120,000 的未實現重估增值", "D": "應先減少未實現重估增值$20,000,再認列$100,000 的減損損失"}, "answer": "A", "note": ""}, {"id": "bookkeeping-114-23", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 23, "question": "依照商業會計處理準則第 26 條之規定,下列那些是正確之長期借款敘述?1應以攤銷後成本衡量\n2應揭露其內容、到期日、利率、擔保品名稱、帳面金額及其他約定重要限制條款;其以外幣或按外\n幣兌換率折算償還者,應註明外幣名稱及金額 3向業主、員工及關係人借入之長期款項,應彙總揭\n露 4指到期日在 1 年以上之借款", "options": {"A": "1234", "B": "124", "C": "234", "D": "僅24"}, "answer": "B", "note": ""}, {"id": "bookkeeping-114-24", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 24, "question": "下列關於商業會計法及商業會計處理準則之規定何者正確?", "options": {"A": "營業成本及營業費用不能分別列示者,得不用入帳處理", "B": "利息收入及利息費用皆須以淨額列示", "C": "商業對業主分配之盈餘,不得作為費用或損失。但具負債性質之特別股,其股利應認列為費用", "D": "停業單位損益應採稅前認列於繼續營業單位損益之前"}, "answer": "C", "note": ""}, {"id": "bookkeeping-114-25", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 25, "question": "臺南公司 113 年度之決算報表已於 114 年 6 月 30 日提請股東承認,然而該公司也因為帳載不實於 114\n年 7 月 20 日遭員工踢爆,並被某週刊大幅報導,未來也可能遭到國稅局補徵及處罰。試問臺南公司\n下列那些人員在 114 年 6 月 30 日提請股東承認後,對於 113 年度之會計責任可以解除?1商業負責\n人 2經理人 3主辦會計 4經辦會計", "options": {"A": "1234", "B": "僅13", "C": "僅34", "D": "臺南公司因有不法或不正當行為,故13無法解除 113 年度之會計責任"}, "answer": "D", "note": ""}, {"id": "bookkeeping-114-26", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 26, "question": "A 記帳士受某詐騙集團的委任,專門負責處理詐團內部的金流及會計事務。如今詐騙集團已被檢警偵\n破並瓦解,A 記帳士亦因協助詐團會計事務被認定為詐團之成員之一,並以詐欺之犯罪行為受有期徒\n刑 3 年裁判確定。下列敘述何者正確?", "options": {"A": "A 記帳士會因記帳士法而遭除名處分,永遠不得從事記帳士工作", "B": "A 記帳士已服刑 3 年完畢,需要重考記帳士換發證書後才可以繼續執業", "C": "A 記帳士已服刑 3 年完畢,可以直接充任記帳士及請領記帳士證書", "D": "A 記帳士已服刑 1 年完畢且赦免已滿 3 年,需要重考記帳士換發證書後才可以繼續執業"}, "answer": "C", "note": ""}, {"id": "bookkeeping-114-27", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 27, "question": "A 員於 112 年 1 月 1 日從財政部北區國稅局新竹分局,調任財政部南區國稅局屏東分局,並於 114 年\n12 月 31 日辦理退休,任職期間皆擔任稅務職系人員。此外 A 員已於 112 年考取記帳士並取得記帳士\n證書,準備於退休後開記帳士事務所。請問依照記帳士法第 8 條的規定,A 員最快於何時可以在屏東\n縣開立記帳士事務所執業?", "options": {"A": "117 年 12 月 31 日後", "B": "114 年 12 月 31 日後", "C": "115 年 12 月 31 日後", "D": "118 年 12 月 31 日後"}, "answer": "A", "note": ""}, {"id": "bookkeeping-114-28", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 28, "question": "A 記帳士於屏東縣設立記帳士事務所,登錄執行業務區域為屏東縣、高雄市、臺南市、臺東縣,有關\n於 A 記帳士執業及加入記帳士公會事宜,下列敘述何者正確?", "options": {"A": "A 記帳士的事務所名稱,應註明「稅務暨會計事務所」", "B": "A 記帳士必須加入屏東縣記帳士公會,不用於高雄市、臺南市及臺東縣設立分所", "C": "A 記帳士有臺北市的客戶想執行稅務申報業務,不用向財政部臺北國稅局登記", "D": "A 記帳士可以協助客戶處理稅捐之查核簽證申報業務"}, "answer": "B", "note": ""}, {"id": "bookkeeping-114-29", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 29, "question": "下列何者非記帳士在登錄區域內得執行之業務?", "options": {"A": "受理稅務諮詢事項", "B": "受委任辦理商業會計事務", "C": "受委任辦理各項稅捐稽徵案件之申報及申請事項", "D": "公司申請設立登記之資本額查核簽證"}, "answer": "D", "note": ""}, {"id": "bookkeeping-114-30", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 30, "question": "下列何者非不得充任記帳士之原因?", "options": {"A": "患有輕度阿茲海默症,除記憶力輕微受損外肢體異常有顫抖狀況", "B": "受破產宣告尚未復權", "C": "曾服公職而受撤職處分,其停止任用期間尚未屆滿", "D": "曾因業務上有詐欺,受有期徒刑 1 年以上刑之裁判確定"}, "answer": "A", "note": ""}, {"id": "bookkeeping-114-31", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 31, "question": "A 在民國 111 年 1 月 24 日調離財政部臺北國稅局松山分局,就任新北市稅捐處新店分處,並於民國\n112 年 6 月 30 日調離新北市稅捐處新店分處,就任財政部中區國稅局臺中分局,最後在 114 年 9 月\n30 日辭職自行開業記帳士事務所,請問 A 不得在何縣市執業?", "options": {"A": "臺北市、新北市、臺中市", "B": "新北市、臺中市", "C": "臺北市、新北市", "D": "臺中市"}, "answer": "D", "note": ""}, {"id": "bookkeeping-114-32", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 32, "question": "記帳士受委任後,非有正當事由,不得終止其契約;如須終止契約,記帳士應於多久前通知委任人?", "options": {"A": "5 日", "B": "7 日", "C": "10 日", "D": "15 日"}, "answer": "D", "note": ""}, {"id": "bookkeeping-114-33", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 33, "question": "A 記帳士因違反記帳士法之規定,而受到懲戒時,A 記帳士對於記帳士懲戒委員會之決議不服時,得\n於決議書送達之翌日起幾日內,向那一個單位請求覆審?", "options": {"A": "30 日內,記帳士懲戒委員會", "B": "30 日內,記帳士懲戒覆審委員會", "C": "20 日內,記帳士懲戒覆審委員會", "D": "20 日內,記帳士懲戒委員會"}, "answer": "C", "note": ""}, {"id": "bookkeeping-114-34", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 34, "question": "依據公司法有關公司名稱預查審核之規定,下列敘述何者正確?", "options": {"A": "公司名稱及業務,需等到公司登記後再進行審核", "B": "預查申請案每次申請不得超過 6 個公司名稱", "C": "「屏東水果電器文具有限公司」標明 3 種業務種類被視為許可", "D": "「屏東水果有限公司」及「屏東水產有限公司」視為不同公司"}, "answer": "D", "note": ""}, {"id": "bookkeeping-114-35", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 35, "question": "甲為公開發行之非投資股份有限公司,登記資本額新臺幣 1 億元,實收資本額新臺幣 1 億元,其章程\n並未規定放寬轉投資上限,因欲轉投資乙有限公司新臺幣 8 千萬元,請問必須經過何種股東會決議放\n寬?", "options": {"A": "普通決議", "B": "假決議", "C": "便宜決議", "D": "特別決議"}, "answer": "D", "note": ""}, {"id": "bookkeeping-114-36", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 36, "question": "A、B、C、D、甲有限公司均為乙股份有限公司股東且均當選為董事,甲有限公司指派 E 行使董事職\n務,下列對 E 之敘述何者正確?", "options": {"A": "E 為自然人董事", "B": "E 為法人代表董事", "C": "E 有任期保障", "D": "E 為法人董事"}, "answer": "D", "note": ""}, {"id": "bookkeeping-114-37", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 37, "question": "甲股份有限公司與其董事長 A 所簽委任契約中規定,未滿新臺幣 3 千萬元之交易由 A 決定,超過新\n臺幣 3 千萬元案件須經董事會決議始生效力,A 代表甲股份有限公司與乙有限公司簽訂一筆新臺幣 5\n千萬元採購原料契約,乙有限公司明知甲股份有限公司與 A 之間有代表權限制契約,請問該買賣契\n約對甲股份有限公司是否生效?", "options": {"A": "無效", "B": "有效", "C": "效力未定", "D": "經甲公司承認後生效"}, "answer": "A", "note": ""}, {"id": "bookkeeping-114-38", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 38, "question": "甲股份有限公司章程並無保證業務,負責人 A 代表甲股份有限公司為乙有限公司向銀行融資為保證,\n請問下列敘述何者正確?", "options": {"A": "A 自負保證責任", "B": "甲股份有限公司負保證責任", "C": "A 與甲股份有限公司負連帶責任", "D": "A 與甲股份有限公司均無須負責"}, "answer": "A", "note": ""}, {"id": "bookkeeping-114-39", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 39, "question": "甲有限公司設立時登記 A 為公司經理人,因 A 怠忽職守遭甲有限公司撤換並改由 B 擔任公司經理\n人,然甲有限公司卻未向主管機關變更經理人登記。A 以甲有限公司經理人名義與乙有限公司簽訂勞\n務承攬契約,然事後甲有限公司主張 A 並非該公司經理人拒絕履行契約,請問下列敘述何者正確?", "options": {"A": "A 之行為為無權代理,經甲有限公司承認始生效力", "B": "該勞務承攬契約對甲有限公司生效", "C": "該勞務承攬契約對甲有限公司不生效力", "D": "A 自負責任"}, "answer": "B", "note": ""}, {"id": "bookkeeping-114-40", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 40, "question": "依據公司法第 7 條之規定,公司申請設立登記之資本額,應於申請設立登記時或設立登記後 30 日內,\n檢送經何者查核簽證之文件?", "options": {"A": "會計師", "B": "記帳士", "C": "律師", "D": "記帳及報稅代理人"}, "answer": "A", "note": ""}, {"id": "bookkeeping-114-41", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 41, "question": "下列何者為記帳士職業倫理道德規範中,要求記帳士應遵守之基本原則?1客觀 2誠正 3遵法\n4務實 5注意 6保密 7適任", "options": {"A": "1357", "B": "2467", "C": "2345", "D": "4567"}, "answer": "B", "note": ""}, {"id": "bookkeeping-114-42", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 42, "question": "下列關於記帳士職業倫理道德規範中之行為準則,何者符合「保密」?1應謹慎使用及保護其在執行\n業務過程中所獲得之資訊 2執行業務時如有取得個人資料之必要時,應依法令辦理 3應遵守法律\n並依照法律及記帳士專業之要求辦理委任工作 4應依照法令及財政部發布之其他攸關資料提供記\n帳士服務", "options": {"A": "12", "B": "13", "C": "23", "D": "24"}, "answer": "A", "note": ""}, {"id": "bookkeeping-114-43", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 43, "question": "記帳士 A 因對法令錯誤理解,在受理甲有限公司稅務諮詢時給予錯誤訊息,導致甲有限公司申報不\n實產生逃漏稅而遭裁罰,下列敘述何者正確?", "options": {"A": "甲有限公司應該對稅務法令具備基礎概念,A 無責任", "B": "甲有限公司另有顧問律師,甲有限公司應諮詢顧問律師而非單憑 A 之意見,A 無責任", "C": "甲有限公司另有會計師,甲有限公司應諮詢會計師而非單憑 A 之意見,A 無責任", "D": "A 應賠償甲有限公司所受損害"}, "answer": "D", "note": ""}, {"id": "bookkeeping-114-44", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 44, "question": "A 未取得記帳士資格卻執行記帳士業務,請問下列敘述何者正確?", "options": {"A": "通知考選部剝奪 A 未來參加記帳士考試資格", "B": "由檢察官提起公訴", "C": "由財政部處新臺幣 3 萬元以上 15 萬元以下罰金", "D": "由財政部處新臺幣 3 萬元以上 15 萬元以下罰鍰"}, "answer": "D", "note": ""}, {"id": "bookkeeping-114-45", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 45, "question": "記帳士 A 以不正當方法招攬業務,移送懲戒委員會遭停止營業 1 年,請問該停業決定之法律性質為\n何?", "options": {"A": "行政命令", "B": "行政處分", "C": "行政指導", "D": "行政契約"}, "answer": "B", "note": ""}, {"id": "bookkeeping-114-46", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 46, "question": "下列何者非商業負責人?", "options": {"A": "經理人", "B": "董事", "C": "有限合夥人", "D": "清算人"}, "answer": "C", "note": ""}, {"id": "bookkeeping-114-47", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 47, "question": "公司申請設立登記之資本額,應經會計師查核簽證,因此訂有「會計師查核簽證公司登記資本額辦法」,\n請問該項辦法之法律性質為何?", "options": {"A": "法規命令", "B": "行政規則", "C": "行政處分", "D": "行政指導"}, "answer": "A", "note": "答A給分"}, {"id": "bookkeeping-114-48", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 48, "question": "交通科技執法是一種用科技儀器來監測交通情形、舉發違規事件、降低車禍意外機率、減省警察人力\n的一種方式,其最大目的為「遏止違規行為,減少交通事故傷亡」。下列敘述何者正確?", "options": {"A": "交通科技執法是機器作成的行政處分,得不記明理由", "B": "交通科技執法的書面行政處分,仍必須要署名,不得以蓋章為之", "C": "交通科技執法得不給予陳述意見的機會", "D": "交通科技執法之救濟期間有錯誤時,應由處分機關以通知更正之,並自通知送達之日起算為法定\n期間"}, "answer": "A", "note": ""}, {"id": "bookkeeping-114-49", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 49, "question": "依據行政程序法之規定,下列敘述何者錯誤?", "options": {"A": "無效之行政處分自始不生效力", "B": "行政處分未經撤銷、廢止,或未因其他事由而失效者,其效力繼續存在", "C": "書面之行政處分自送達相對人對其發生效力", "D": "一般處分自公告日或刊登政府公報、新聞紙登載首日起發生效力"}, "answer": "D", "note": ""}, {"id": "bookkeeping-114-50", "year": "114", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 50, "question": "甲有限公司遭財政部國稅局認定逃漏營利事業所得稅高達新臺幣 1 千萬元整,除課公司補稅外並處以\n補稅額二倍罰鍰。然事後發現係重複計算結果導致課稅處分發生錯誤,重新核算後結果逃漏稅額度僅\n為新臺幣 1 百萬元整,請問原處分效力如何?", "options": {"A": "逃漏稅事實明確,為維持法安定性故原處分應予以維持", "B": "原處分為輕度瑕疵,甲有限公司得請求撤銷原處分", "C": "原處分為重大明顯瑕疵,應為無效", "D": "國稅局應廢止原處分另為適法處分"}, "answer": "C", "note": ""}, {"id": "tax-114-1", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 1, "question": "經核准分期繳納之稅款,個人在新臺幣至少多少元以上,稅捐稽徵機關得要求納稅義務人提供相當擔保?", "options": {"A": "100 萬元", "B": "150 萬元", "C": "200 萬元", "D": "300 萬元"}, "answer": "A", "note": ""}, {"id": "tax-114-2", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 2, "question": "根據稅捐稽徵法規定,下列擔保品價值之計算何者錯誤?", "options": {"A": "黃金按九折計算", "B": "核準上市之有價證券按八折計算", "C": "銀行存款單摺,按存款本金加利息計算", "D": "經中央銀行掛牌之外幣按八折計算"}, "answer": "C", "note": ""}, {"id": "tax-114-3", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 3, "question": "丙營業人未依規定申請稅籍登記即開始營業,被處 2 萬元罰鍰;若在該期間之營業額按所漏稅額處五倍以\n下罰鍰為 80 萬元。請問丙營業人應繳多少罰鍰?", "options": {"A": "82 萬元", "B": "80 萬元", "C": "41 萬元", "D": "2 萬元"}, "answer": "B", "note": ""}, {"id": "tax-114-4", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 4, "question": "某營利事業因故被補徵稅款,繳納期限至民國 114 年 7 月 14 日(非假日)截止,該營利事業不服欲申請\n復查,依稅捐稽徵法之規定,最遲應於何日前提出?", "options": {"A": "114 年 8 月 12 日", "B": "114 年 8 月 13 日", "C": "114 年 8 月 14 日", "D": "114 年 9 月 13 日"}, "answer": "B", "note": ""}, {"id": "tax-114-5", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 5, "question": "營利事業應給與他人憑證而未給與,應自他人取得憑證而未取得,或應保存憑證而未保存者,下列有關之\n規定何者正確?", "options": {"A": "應就其未給與憑證、未取得憑證或未保存憑證之總額,處 10%罰鍰且處罰金額最高不得超過新臺幣 100\n萬元", "B": "營利事業取得非實際交易對象所開立之憑證,如經查明確有進貨事實及該項憑證確由實際銷貨之營利事\n業所交付,且實際銷貨之營利事業已依法處罰者,免予處罰", "C": "營利事業之銷貨,未給與他人銷貨憑證或未將銷貨憑證存根保存者,稽徵機關得按當年度當地該項貨品\n之最低價格核定其銷貨價格", "D": "營利事業之進貨,未取得進貨憑證或未將進貨憑證保存,稽徵機關得按當年度當地該項貨品之最高價格\n核定其進貨成本"}, "answer": "B", "note": ""}, {"id": "tax-114-6", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 6, "question": "依現行稅捐稽徵法之規定,逾期繳納稅捐應加徵滯納金者,每逾 3 日按滯納數額加徵多少滯納金?", "options": {"A": "1%", "B": "2%", "C": "5%", "D": "10%"}, "answer": "A", "note": ""}, {"id": "tax-114-7", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 7, "question": "有關納稅義務人死亡遺有財產者,其依法應繳納之稅捐,由下列何人優先負繳納義務?", "options": {"A": "遺囑執行人", "B": "繼承人", "C": "依法選定之遺產管理人", "D": "配偶"}, "answer": "A", "note": ""}, {"id": "tax-114-8", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 8, "question": "稅捐稽徵機關依法就納稅義務人應退之稅捐抵繳其積欠者,下列何者優先抵繳?", "options": {"A": "同級政府其他稅捐稽徵機關各項稅目之欠稅", "B": "同一稅捐稽徵機關同一稅目欠繳之滯納金、滯報金、怠報金、利息及罰鍰", "C": "同級政府其他稅捐稽徵機關各項稅目欠繳之滯納金、滯報金、怠報金、利息及罰鍰", "D": "同一稅捐稽徵機關同一稅目之欠稅"}, "answer": "D", "note": ""}, {"id": "tax-114-9", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 9, "question": "陳君於 110 年 2 月 10 日以總價 1,200 萬元購入一戶房屋及其坐落基地,於 114 年 10 月 2 日以總價 1,500\n萬元簽約出售,陳君提示下列文件:購入時陳君負擔之仲介費 12 萬元、出售時陳君負擔之仲介費 30 萬\n元,購入之契稅 6 萬元、出售之契稅為 7 萬元,持有期間之房屋稅及地價稅為 10 萬元。陳君之房地交易\n所得為若干元?", "options": {"A": "300 萬元", "B": "270 萬元", "C": "258 萬元", "D": "252 萬元"}, "answer": "D", "note": ""}, {"id": "tax-114-10", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 10, "question": "程君在 111 年 6 月買進預售屋及其座落基地作為自用住宅,預售屋興建完成後,程君於 112 年 12 月登記\n取得房屋土地所有權,後於 114 年 10 月出售,則出售房地所得適用稅率為下列何者?", "options": {"A": "10%", "B": "20%", "C": "35%", "D": "45%"}, "answer": "D", "note": ""}, {"id": "tax-114-11", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 11, "question": "張君為美國華僑,在中華民國境內並無住所且無設籍,於 112 年 8 月 1 日來臺,於 113 年 7 月 31 日離開。\n若張君 112 年及 113 年皆有中華民國境內薪資,則如何課所得稅?", "options": {"A": "112 年及 113 年皆結算申報", "B": "112 年及 113 年皆就源扣繳", "C": "112 年就源扣繳;113 年結算申報", "D": "112 年結算申報;113 年就源扣繳"}, "answer": "C", "note": ""}, {"id": "tax-114-12", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 12, "question": "在夫妻各類所得分開計稅下,有關當年度之財產交易損失之說明何者正確?", "options": {"A": "夫之財產交易損失可扣抵妻之財產交易所得,扣抵不足者可後延", "B": "夫之財產交易損失可扣抵妻之財產交易所得,扣抵不足者不可後延", "C": "夫之財產交易損失不可扣抵妻之財產交易所得,夫財產交易損失可後延", "D": "夫之財產交易損失不可扣抵妻之財產交易所得,夫財產交易損失不可後延"}, "answer": "C", "note": ""}, {"id": "tax-114-13", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 13, "question": "乙公司採曆年制會計年度,114 年因不堪虧損於 4 月 21 日結束營業,辦理決算。乙公司當年度的營利事業\n所得額為新臺幣 50,000 元,則其當年度營利事業所得稅應納稅額為若干元?", "options": {"A": "0 元", "B": "5,000 元", "C": "10,000 元", "D": "15,000 元"}, "answer": "B", "note": ""}, {"id": "tax-114-14", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 14, "question": "下列所得之分類何者正確?", "options": {"A": "受僱遠洋漁業一次出海後報酬為自力耕作漁牧林礦所得", "B": "資遣費為薪資所得", "C": "有奬儲蓄中奬奬金超過儲蓄部分為利息所得", "D": "稿費為其他所得"}, "answer": "C", "note": ""}, {"id": "tax-114-15", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 15, "question": "依現行所得稅法,下列何者不是免稅所得?", "options": {"A": "人身保險、勞工保險及軍、公、教保險之保險給付", "B": "傷害或死亡之損害賠償金,及依國家賠償法規定取得之賠償金", "C": "各級政府公有事業之所得", "D": "個人取得自營利事業贈與之財產"}, "answer": "D", "note": ""}, {"id": "tax-114-16", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 16, "question": "依現行所得稅法,公司股東所獲分配之股利屬於下列何項所得?", "options": {"A": "營利所得", "B": "執行業務所得", "C": "利息所得", "D": "其他所得"}, "answer": "A", "note": ""}, {"id": "tax-114-17", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 17, "question": "依現行所得稅法,營利事業之銷貨,未給與他人銷貨憑證,或未將銷貨憑證存根保存者,稽徵機關得按:", "options": {"A": "當年度當地該項貨品之最高價格,核定其銷貨價格", "B": "前一年度當地該項貨品之最高價格,核定其銷貨價格", "C": "當年度當地該項貨品之最低價格,核定其銷貨價格", "D": "前一年度當地該項貨品之最低價格,核定其銷貨價格"}, "answer": "A", "note": ""}, {"id": "tax-114-18", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 18, "question": "現行所得稅法中有關噸位稅之規定,下列何者錯誤?", "options": {"A": "適用對象為總機構在中華民國境外經營海運業務之營利事業", "B": "一經選定,應連續適用 10 年,不得變更", "C": "適用期間如有不符合規定之要件,經中央目的事業主管機關廢止核定者,自不符合一定要件之年度起連\n續 5 年,不得再適用噸位稅", "D": "海運業務收入以外之收入,其所得額之計算依所得稅法相關規定辦理"}, "answer": "A", "note": ""}, {"id": "tax-114-19", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 19, "question": "白君為居住者,其 113 年度所得如下(以下皆為新臺幣):1房地合一所得 120 萬元 2大陸所得 15 萬元\n3日本所得 20 萬元 4分開計稅之股利所得 300 萬元,其 113 年之基本所得額為若干元?", "options": {"A": "455 萬元", "B": "335 萬元", "C": "320 萬元", "D": "300 萬元"}, "answer": "D", "note": ""}, {"id": "tax-114-20", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 20, "question": "依現行法規,個人基本稅額及營利事業基本稅額之稅率分別為下列何者?", "options": {"A": "20%;15%", "B": "25%;10%", "C": "20%;12%", "D": "15%;15%"}, "answer": "C", "note": ""}, {"id": "tax-114-21", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 21, "question": "乙公司為電子產品外銷廠商,其 113 年度外銷貨品一批,售價 8,000 萬元,預收貨款 3,000 萬元,餘額 5,000\n萬元待交貨時再收。該批貨品於 113 年 12 月 28 日報關出口,於 114 年 1 月 10 日運抵目的地交貨,請問\n該銷貨收入屬那一年度?", "options": {"A": "113 年度", "B": "114 年度", "C": "3,000 萬元屬 113 年度,5,000 萬元屬 114 年度", "D": "113 年度或 114 年度皆可"}, "answer": "A", "note": ""}, {"id": "tax-114-22", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 22, "question": "營利事業適用盈虧互抵時,應將各該期下列何者所得,先抵減各該期核定虧損後,再以虧損之餘額扣除?", "options": {"A": "投資境內公司所獲配之股利", "B": "證券交易所得", "C": "出售 110 年購入之房地交易所得", "D": "出售 100 年購入土地之交易所得"}, "answer": "A", "note": ""}, {"id": "tax-114-23", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 23, "question": "甲營造公司承包乙公司的建廠工程,工期約 2 年,但各期應收工程價款無法估計,則有關工程損益之計算,\n應採下列何種方法?", "options": {"A": "工程成本比例法", "B": "工時進度比例法", "C": "產出單位法", "D": "成本回收法"}, "answer": "D", "note": ""}, {"id": "tax-114-24", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 24, "question": "依現行法規,營利事業分期付款之銷貨,其當期損益無法依下列何種方法計算?", "options": {"A": "全部毛利法", "B": "毛利百分比法", "C": "普通銷貨法", "D": "淨利法"}, "answer": "D", "note": ""}, {"id": "tax-114-25", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 25, "question": "依現行營利事業所得稅查核準則,薪資支出不包含下列何者?", "options": {"A": "退職金", "B": "自中華民國 97 年 1 月 1 日起,公司為獎勵及酬勞員工,以員工酬勞入股、發行員工認股權憑證、現金\n增資保留部分股份供員工認購、買回庫藏股轉讓予員工等獎酬公司員工者", "C": "公司股東、董事或合夥人兼任經理或職員者之薪資", "D": "公司股東獲配之盈餘"}, "answer": "D", "note": ""}, {"id": "tax-114-26", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 26, "question": "依現行營利事業所得稅查核準則,下列何種捐贈可全數列入營利事業當年度之費用或損失?", "options": {"A": "對中小企業發展基金之捐贈", "B": "對政黨、政治團體及擬參選人之捐贈", "C": "依文化創意產業發展法規定所為之捐贈", "D": "對特定學校法人或私立學校之捐款"}, "answer": "A", "note": ""}, {"id": "tax-114-27", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 27, "question": "依現行營利事業所得稅查核準則,有關職工福利金之規定,下列何者錯誤?", "options": {"A": "副產品及不堪使用之固定資產不得比照下腳提撥福利金", "B": "未成立職工福利委員會者,其舉辦員工文康、旅遊活動及聚餐等費用,不得職工福利科目列支", "C": "未成立職工福利委員會者,不得提撥福利金", "D": "若符合相關規定,下腳變價時可提撥 20%~40%為職工福利金"}, "answer": "B", "note": ""}, {"id": "tax-114-28", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 28, "question": "依現行營利事業所得稅查核準則,有關備抵呆帳之規定,下列何者錯誤?", "options": {"A": "營利事業提列備抵呆帳,以應收帳款及應收票據為限,不包括已貼現之票據", "B": "營利事業採普通銷貨法計算損益者,其約載分期付款售價與現銷價格之差額部分之債權,不得提列備抵呆帳", "C": "營利事業備抵呆帳餘額,最高不得超過應收帳款及應收票據餘額之 3%", "D": "營利事業之債權中有逾期 2 年,經催收後,未經收取本金或利息者,視為實際發生呆帳損失,並應於發\n生當年度沖抵備抵呆帳"}, "answer": "C", "note": ""}, {"id": "tax-114-29", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 29, "question": "依現行營利事業所得稅查核準則,有關利息費用之規定,下列何者錯誤?", "options": {"A": "非營業所必需之借款利息,不予認定", "B": "獨資之資本主及合夥組織之合夥人,所借貸之款項,均應以資本主往來論,不得列支利息", "C": "代銷商及經銷商保證金事先約定支付利息,並經查明對方列有利息收入者,應予核實認定", "D": "向金融業以外之借款利息,均不予認定"}, "answer": "D", "note": ""}, {"id": "tax-114-30", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 30, "question": "依現行營利事業所得稅查核準則,有關無形資產之攤折,下列何者錯誤?", "options": {"A": "商譽最低為 10 年", "B": "著作權為 15 年", "C": "商標權、專利權及其他特許權為取得後法定享有之年數", "D": "無形資產之攤折應以出價取得者為限"}, "answer": "A", "note": ""}, {"id": "tax-114-31", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 31, "question": "甲公司每月支付租金 40,000 元向乙租賃公司租用自用乘人小客車 1 輛,租賃期間為 3 年,租期屆滿後無\n條件移轉給甲公司所有,請問每期申報營業稅時,小客車租賃費用可扣抵之進項稅額為若干元?", "options": {"A": "0 元", "B": "2,000 元", "C": "4,000 元", "D": "6,000 元"}, "answer": "A", "note": ""}, {"id": "tax-114-32", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 32, "question": "下列有關營業稅申報繳納之規定,何者正確?", "options": {"A": "專營免稅之營業人,得申請以每月為一期,向主管稽徵機關申報銷售額、應納或溢付營業稅額", "B": "查定計算營業稅額之典當業,每月填發繳款書通知繳納一次", "C": "銀行業應以每 2 月為一期,向主管稽徵機關申報銷售額、應納或溢付營業稅額", "D": "查定計算營業稅額之特種飲食業,由主管稽徵機關查定其銷售額及稅額,每 3 個月填發繳款書通知繳納一次"}, "answer": "C", "note": ""}, {"id": "tax-114-33", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 33, "question": "下列有關進項稅額之規定,何者錯誤?", "options": {"A": "加值型營業人之進項稅額憑證,未於當期申報者,得延至次期申報扣抵", "B": "進項稅額憑證之申報扣抵期間,以 10 年為限", "C": "捐贈政府之商品得扣抵進項稅額", "D": "連續營業 3 年以上,每年營業額達 1 億元以上之營業人,均得向稽徵機關申請以進項憑證編列之明細\n表,代替進項稅額扣抵聯申報"}, "answer": "D", "note": ""}, {"id": "tax-114-34", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 34, "question": "下列有關 114 年 5 月結算申報 113 年度綜合所得稅之說明,下列何者正確?", "options": {"A": "96 年 2 月出生者可以當納稅義務人", "B": "44 年 4 月出生之父親免稅額可增加 50%", "C": "40 年 10 月出生之姑姑免稅額可增加 50%", "D": "107 年 12 月出生之子女適用幼兒學前特別扣除額"}, "answer": "D", "note": ""}, {"id": "tax-114-35", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 35, "question": "A 銀行今年之利息收入為 5,000 萬元,銷售金融債券之銷售額為 3,000 萬元,保管箱出租之銷售額為 1,000\n萬元,假設無進項稅額,其應納營業稅為若干元?", "options": {"A": "450 萬元", "B": "300 萬元", "C": "250 萬元", "D": "100 萬元"}, "answer": "B", "note": ""}, {"id": "tax-114-36", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 36, "question": "下列營業稅稅率何者錯誤?", "options": {"A": "進口國際運輸用之船舶、航空器及遠洋漁船免稅", "B": "進口玉米稅率為固定 5%", "C": "保險業再保費收入之稅率為 1%", "D": "期貨、證券業銷售額之稅率為 2%"}, "answer": "B", "note": ""}, {"id": "tax-114-37", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 37, "question": "甲公司本期銷項稅額 10 萬元,零稅率銷售額 60 萬元,取得進項稅額如下:自用乘人小汽車 4 萬元、進貨\n10 萬元、固定資產 5 萬元,該公司本期得退還稅額為若干元?", "options": {"A": "3 萬元", "B": "5 萬元", "C": "8 萬元", "D": "9 萬元"}, "answer": "B", "note": ""}, {"id": "tax-114-38", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 38, "question": "大華於 A 網站向我國甲公司購買保健食品一組,該營業稅之納稅義務人為下列何者?", "options": {"A": "大華", "B": "A 網站", "C": "甲公司", "D": "免稅"}, "answer": "C", "note": ""}, {"id": "tax-114-39", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 39, "question": "依現行營業稅法,下列何者不視為銷售貨物或勞務?", "options": {"A": "營業人以自己名義代為購買貨物交付與委託人者", "B": "營業人委託他人代銷貨物者", "C": "營業人解散或廢止營業時所餘存之貨物,或將貨物抵償債務、分配與股東或出資人者", "D": "執行業務者提供其專業性勞務"}, "answer": "D", "note": ""}, {"id": "tax-114-40", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 40, "question": "依現行營業稅法,下列何者免徵營業稅?", "options": {"A": "外銷貨物", "B": "國際運輸用之船舶、航空器及遠洋漁船", "C": "醫院、診所、療養院提供之醫療勞務、藥品、病房之住宿及膳食", "D": "銀行業經營非專屬本業之銷售額"}, "answer": "C", "note": ""}, {"id": "tax-114-41", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 41, "question": "依現行營業稅法,酒家及有陪侍服務之茶室、咖啡廳、酒吧等之營業稅稅率為?", "options": {"A": "1%", "B": "5%", "C": "15%", "D": "25%"}, "answer": "D", "note": ""}, {"id": "tax-114-42", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 42, "question": "依現行營業稅法,下列何者適用之營業稅稅率最低?", "options": {"A": "農產品批發市場之承銷人", "B": "保險業", "C": "銷售非農產品之小規模營業人", "D": "夜總會、有娛樂節目之餐飲店"}, "answer": "A", "note": ""}, {"id": "tax-114-43", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 43, "question": "依現行營業稅法,下列何者為應稅貨物或勞務?", "options": {"A": "經營衍生性金融商品買賣收取之佣金及手續費", "B": "銷售與國防單位使用之武器、艦艇、飛機", "C": "郵政、電信機關依法經營之業務", "D": "肥料、農業、畜牧用藥、農耕用之機器設備"}, "answer": "A", "note": ""}, {"id": "tax-114-44", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 44, "question": "下列有關統一發票之開立時限何者錯誤?", "options": {"A": "營業人以貨物或勞務與他人交換貨物或勞務者,應於換入時開立統一發票", "B": "發行商品禮券者,應於出售禮券時開立統一發票", "C": "發行現金禮券者,應於兌付貨物時開立統一發票", "D": "推銷人員攜帶貨物離開營業場所銷售者,於銷售貨物時開立統一發票"}, "answer": "A", "note": ""}, {"id": "tax-114-45", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 45, "question": "依現行統一發票使用辦法,下列何者不符合免用或免開統一發票?", "options": {"A": "計程車業及其他交通運輸事業客票收入部分", "B": "職業學校不對外營業之實習商店", "C": "電視臺之廣告播映", "D": "娛樂業之門票收入"}, "answer": "C", "note": ""}, {"id": "tax-114-46", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 46, "question": "李君於 113 年死亡,遺產總額為 1,500 萬元,遺產淨額為 200 萬元,遺產總額中,有 A 公司上市股票 5,000\n股,納稅義務人欲以該股票抵繳遺產稅,死亡日收盤價為每股 300 元,抵繳日收盤價為每股 150 元,請問\n可抵繳若干遺產稅?", "options": {"A": "0 元", "B": "1 萬元", "C": "2 萬元", "D": "全部遺產稅"}, "answer": "A", "note": ""}, {"id": "tax-114-47", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 47, "question": "下列何者非屬遺產及贈與稅法第 16 條「不計入遺產總額」之財產?", "options": {"A": "繼承人捐贈各級政府之財產", "B": "被繼承人死亡前 5 年內,繼承之財產已納遺產稅", "C": "被繼承人之配偶依民法第 1030 條之 1 規定主張配偶剩餘財產差額分配請求權", "D": "被繼承人遺產中經政府闢為公眾通行道路之土地"}, "answer": "C", "note": ""}, {"id": "tax-114-48", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 48, "question": "依現行遺產及贈與稅法,經常居住中華民國境外之中華民國國民,死亡時在中華民國境內遺有財產者,應\n如何課徵遺產稅?", "options": {"A": "應就其在中華民國境內之遺產課徵遺產稅", "B": "應就其在中華民國境外之遺產課徵遺產稅", "C": "應就其在中華民國境內境外全部之遺產課徵遺產稅", "D": "免徵遺產稅"}, "answer": "A", "note": ""}, {"id": "tax-114-49", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 49, "question": "依現行遺產及贈與稅法,下列何者應計入贈與總額計稅?", "options": {"A": "扶養義務人為受扶養人支付之生活費、教育費及醫藥費", "B": "配偶相互贈與之財產", "C": "捐贈公有事業機構或全部公股之公營事業之財產", "D": "父母贈與子女之財物,總金額超過新臺幣 300 萬元"}, "answer": "D", "note": ""}, {"id": "tax-114-50", "year": "114", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 50, "question": "依現行遺產及贈與稅法,贈與稅稅率為下列何者?", "options": {"A": "單一稅率,10%", "B": "單一稅率,20%", "C": "超額累進稅率,最高 20%", "D": "超額累進稅率,最高 25%"}, "answer": "C", "note": ""}, {"id": "accounting-115-1", "year": "115", "subject": "accounting", "subjectName": "會計學概要", "number": 1, "question": "乙公司 X6 年度之銷貨淨額為$540,000,毛利率為 25%。應收帳款期初餘額$80,000、期末餘額\n$100,000;存貨期初餘額$110,000、期末餘額$115,000。試問:乙公司 X6 年之營業週期為幾天?\n(一年以 360 天計,答案四捨五入至整數)", "options": {"A": "135 天", "B": "160 天", "C": "169 天", "D": "180 天"}, "answer": "B", "note": "", "explanation": {"reason": "銷貨成本為 540,000 × 75%＝405,000 元，平均存貨 112,500 元，存貨週轉天數為 100 天。平均應收帳款 90,000 元，應收帳款週轉天數為 60 天。兩者相加為 160 天。", "terms": "營業週期是從取得存貨到銷售並收回現金的期間。週轉天數是以天數表示存貨出售或應收帳款收現的速度。", "formulas": "營業週期＝360 × 平均存貨 ÷ 銷貨成本＋360 × 平均應收帳款 ÷ 銷貨淨額。"}}, {"id": "accounting-115-2", "year": "115", "subject": "accounting", "subjectName": "會計學概要", "number": 2, "question": "乙公司 X5 年 1 月 1 日應收帳款帳列餘額為$520,000,備抵損失(壞帳)貸方餘額為$41,000。X5 年\n度賒銷商品共計$3,600,000,收回應收帳款$3,350,000,另沖銷無法收回之帳款$62,000;惟其中$15,000\n於同年度因客戶財務好轉而予以迴轉(尚未收現)。若該公司以應收帳款餘額百分比法提列壞帳,並\n於年底估計比率為 7%,則年底提列壞帳對 X5 年度淨利之影響數為何(不考慮所得稅)?", "options": {"A": "$55,560", "B": "$56,610", "C": "$70,560", "D": "$71,610"}, "answer": "B", "note": "", "explanation": {"reason": "年底應收帳款為 520,000＋3,600,000－3,350,000－62,000＋15,000＝723,000 元。應有備抵為 50,610 元，調整前備抵為借餘 6,000 元，故須提列 56,610 元。", "terms": "備抵損失是應收帳款的減項。沖銷後恢復帳款時，同時恢復原先沖減的備抵。", "formulas": "應有備抵＝期末應收帳款 × 7%。本期提列＝應有備抵－調整前備抵貸方餘額。"}}, {"id": "accounting-115-3", "year": "115", "subject": "accounting", "subjectName": "會計學概要", "number": 3, "question": "甲公司 X4 年以每股$36 購買 3,000 股丙公司股票,另支付手續費$3,000,並將此股票投資分類為\n透過其他綜合損益按公允價值衡量之金融資產。X4 年底及 X5 年底,丙公司股票的市價分別為$33\n及$41。試問:甲公司 X5 年綜合損益表中列報之其他綜合損益,以及 X5 年底資產負債表中列報\n之其他權益(金融資產未實現評價損益)餘額,下列何者正確?", "options": {"A": "其他綜合損益:利益$12,000;其他權益:貸餘$24,000", "B": "其他綜合損益:利益$24,000;其他權益:貸餘$15,000", "C": "其他綜合損益:利益$24,000;其他權益:貸餘$24,000", "D": "其他綜合損益:利益$24,000;其他權益:貸餘$12,000"}, "answer": "D", "note": "", "explanation": {"reason": "取得成本含手續費為 111,000 元。兩年年底公允價值分別為 99,000 與 123,000 元，因此 X5 年評價增加 24,000 元，期末累積增加 12,000 元。", "terms": "其他綜合損益是本期列入綜合損益、未列入淨利的項目。其他權益在此反映累積評價差額。", "formulas": "本期評價＝本期末公允價值－上期末公允價值。累積評價＝期末公允價值－取得成本。"}}, {"id": "accounting-115-4", "year": "115", "subject": "accounting", "subjectName": "會計學概要", "number": 4, "question": "乙公司 X4 年初與年底機器設備之累計折舊餘額分別為$360,000 及$298,000,當年度折舊費用為\n$64,000。另已知乙公司於該年度僅發生一筆處分機器設備之交易,得款$71,000,其機器設備成本\n為$210,000。試問:乙公司 X4 年處分機器設備時產生之損益為多少?", "options": {"A": "損失$300,000", "B": "損失$139,000", "C": "損失$77,000", "D": "損失$13,000"}, "answer": "D", "note": "", "explanation": {"reason": "處分設備的累計折舊為 360,000＋64,000－298,000＝126,000 元。處分時帳面金額 84,000 元，賣得 71,000 元，因此損失 13,000 元。", "terms": "累計折舊是資產歷年已認列折舊的累計金額。帳面金額在本題等於成本減累計折舊。", "formulas": "處分損益＝處分收入－帳面金額。"}}, {"id": "accounting-115-5", "year": "115", "subject": "accounting", "subjectName": "會計學概要", "number": 5, "question": "乙公司因同業推出新技術,造成一批原定價$600,000、帳面金額$480,000 的庫存存貨價值產生減損。\n若要進行原有產品之改良更新,需額外支付$72,000,改良後可以原定價八折出售,出售時另需支付\n售價 5%之銷售佣金。試問:若進行改良更新,則該批存貨應認列之存貨跌價損失金額為何?", "options": {"A": "$96,000", "B": "$24,000", "C": "$72,000", "D": "$102,000"}, "answer": "A", "note": "", "explanation": {"reason": "改良後售價為 480,000 元，佣金 24,000 元，再減改良成本 72,000 元，淨變現價值為 384,000 元。原帳面金額 480,000 元須減記 96,000 元。", "terms": "淨變現價值是估計售價扣除完工及銷售所需成本後的金額。", "formulas": "跌價損失＝帳面金額－淨變現價值（前者較高時）。"}}, {"id": "accounting-115-6", "year": "115", "subject": "accounting", "subjectName": "會計學概要", "number": 6, "question": "乙公司於 X3 年 3 月 1 日欲發行 4 個月期、面額為$200,000 的商業本票以取得資金,目前市場利率\n為 7.5%。但丙銀行願意提供利率 5%、借款期間 9 個月的短期借款,惟要求乙公司開立相同期間的\n不附息票據一紙。若乙公司欲取得相同資金,該票據應開立金額為何?(答案四捨五入至整數)", "options": {"A": "$195,122", "B": "$198,374", "C": "$206,098", "D": "$202,439"}, "answer": "D", "note": "", "explanation": {"reason": "商業本票折現後可取得約 195,122 元。銀行借款須取得相同現金，九個月後按約償還本息，故不附息票據面額約為 202,439 元。", "terms": "不附息票據面額已含到期應付的利息。", "formulas": "資金現值＝200,000 ÷ (1＋7.5% × 4/12)。銀行票據面額＝資金現值 × (1＋5% × 9/12)。"}}, {"id": "accounting-115-7", "year": "115", "subject": "accounting", "subjectName": "會計學概要", "number": 7, "question": "乙公司 5 月底銀行調節表中,在途存款為$8,000、未兌現支票為$12,500。6 月份公司帳載存入\n$96,000、開出支票$83,000。銀行 6 月份對帳單顯示存入$91,000(含代收票據$6,000)、支票兌現\n$80,500、手續費$300,6 月底餘額為$52,600。5 月底之在途存款與未兌現支票均已於 6 月入帳或\n兌現。試問:乙公司 6 月底正確現金餘額為何?", "options": {"A": "$50,600", "B": "$56,600", "C": "$56,300", "D": "$55,100"}, "answer": "B", "note": "", "explanation": {"reason": "6 月底在途存款為 8,000＋96,000－(91,000－6,000)＝19,000 元。未兌現支票為 12,500＋83,000－80,500＝15,000 元。銀行餘額調整後為 56,600 元。", "terms": "在途存款已記公司帳但銀行尚未入帳。未兌現支票已記公司帳但銀行尚未扣款。", "formulas": "調整後銀行餘額＝銀行對帳單餘額＋在途存款－未兌現支票。"}}, {"id": "accounting-115-8", "year": "115", "subject": "accounting", "subjectName": "會計學概要", "number": 8, "question": "乙公司於 X4 年 1 月 1 日以廠房向銀行抵押,借得款項$1,053,091。雙方約定分 5 年等額還款,每\n年年底應支付$250,000,借款利率為 6%。試問:乙公司 X5 年底於資產負債表報導該抵押借款時,\n流動負債及非流動負債應分別報導之金額為何(答案四捨五入至整數)?", "options": {"A": "流動負債$250,000,非流動負債$803,091", "B": "流動負債$209,905,非流動負債$458,348", "C": "流動負債$250,000,非流動負債$668,253", "D": "流動負債$186,815,非流動負債$866,276"}, "answer": "B", "note": "", "explanation": {"reason": "X4、X5 年依未償本金計息，分別償還本金約 186,815 與 198,023 元，X5 年底餘 668,253 元。X6 年應償還本金約 209,905 元列流動，其餘 458,348 元列非流動。", "terms": "一年內到期本金是目前借款中下一年度須償還的本金部分。", "formulas": "當期還本金＝付款－期初本金 × 6%。非流動本金＝期末借款－一年內到期本金。"}}, {"id": "accounting-115-9", "year": "115", "subject": "accounting", "subjectName": "會計學概要", "number": 9, "question": "乙公司 X4 年 12 月 31 日的資產為$260,000,負債為$94,000。該公司已發行累積特別股 2,000 股\n(每股面額$25,股利率 6%),另全年流通在外普通股共 5,000 股(面額每股$10),並已知過去僅\nX2年及X3年之股利未支付外,其餘並無積欠股利。X4年度未宣告任何股利,X4年淨利為$18,000。\n試問:X4 年底普通股每股淨值為何?", "options": {"A": "$19.80", "B": "$21.40", "C": "$22.60", "D": "$23.20"}, "answer": "B", "note": "", "explanation": {"reason": "權益為 166,000 元，累積特別股面額 50,000 元，三年優先股利共 9,000 元。普通股可分配權益為 107,000 元，除以 5,000 股等於 21.40 元。", "terms": "累積特別股未發放的股利會累積，計算普通股每股淨值時須先扣除特別股的優先權益。", "formulas": "普通股每股淨值＝(資產－負債－特別股面額－積欠的累積特別股股利) ÷ 普通股股數。"}}, {"id": "accounting-115-10", "year": "115", "subject": "accounting", "subjectName": "會計學概要", "number": 10, "question": "乙公司 X5 年度相關資料如下:原料期初$20,000、期末$26,000,本年度購入原料$150,000;直接\n人工$100,000;製造費用$70,000;管理人員薪資$15,000;在製品期初$36,000、期末$30,000。試\n問:乙公司 X5 年度之製成品成本為何?", "options": {"A": "$314,000", "B": "$320,000", "C": "$335,000", "D": "$308,000"}, "answer": "B", "note": "", "explanation": {"reason": "耗用原料 144,000 元，加直接人工 100,000 元和製造費用 70,000 元，得本期製造成本 314,000 元。再加期初在製品、減期末在製品，得 320,000 元。管理薪資屬期間費用。", "terms": "在製品是尚未完工的產品。製成品成本是本期已完工轉出的成本。", "formulas": "耗用原料＝期初原料＋進料－期末原料。製成品成本＝期初在製品＋本期製造成本－期末在製品。"}}, {"id": "accounting-115-11", "year": "115", "subject": "accounting", "subjectName": "會計學概要", "number": 11, "question": "乙公司商品一律按成本加成 25%訂價,X3 年損益表顯示銷貨收入淨額為$1,350,000。X3 年比較\n資產負債表顯示,期初應收帳款$240,000、存貨$360,000、預付貨款$20,000、應付帳款$285,000;\n期末應收帳款$275,000、存貨$310,000、預付貨款$35,000、應付帳款$318,000。試問:乙公司 X3\n年度現金流量表中,營業活動之現金流量部分有關支付供應商之現金數額應為多少?", "options": {"A": "$944,500", "B": "$997,000", "C": "$1,012,000", "D": "$1,112,000"}, "answer": "C", "note": "", "explanation": {"reason": "銷貨成本為 1,350,000 ÷ 1.25＝1,080,000 元。存貨減少 50,000 元，故進貨 1,030,000 元。減應付帳款增加 33,000 元，加預付款增加 15,000 元，付現為 1,012,000 元。", "terms": "成本加成率以成本為分母。應付帳款增加表示部分進貨尚未付現。", "formulas": "進貨＝銷貨成本＋期末存貨－期初存貨。付供應商現金＝進貨－應付帳款增加＋預付貨款增加。"}}, {"id": "accounting-115-12", "year": "115", "subject": "accounting", "subjectName": "會計學概要", "number": 12, "question": "B 公司在 115 年 1 月 1 日發行面額$1,000,000,5 年期,票面利率 6%之公司債,每年年底付息。\n發行當時之有效利率為 8%,發行價格為$920,000。已知 B 公司於 117 年 1 月 1 日將半數之債券\n買回並加以註銷,假設 117 年度僅發生此筆交易且認列收回公司債損失$86,856。試問 B 公司購回\n該債券之付現數為何?", "options": {"A": "$561,000", "B": "$25,856", "C": "$460,000", "D": "$540,000"}, "answer": "A", "note": "", "explanation": {"reason": "每年實付利息 60,000 元，前兩年利息費用為 73,600 和 74,688 元。贖回前總帳面金額 948,288 元，一半為 474,144 元，加贖回損失 86,856 元，付現 561,000 元。", "terms": "有效利息法按期初帳面金額與有效利率認列利息。折價攤銷會提高債券帳面金額。", "formulas": "期末帳面金額＝期初帳面金額＋利息費用－票面利息。贖回付現＝贖回部分帳面金額＋贖回損失。"}}, {"id": "accounting-115-13", "year": "115", "subject": "accounting", "subjectName": "會計學概要", "number": 13, "question": "C 公司於 115 年 6 月 1 日以$300,000 購入 D 公司股票,占 D 公司流通在外普通股股份 25%,採\n權益法處理。若 D 公司 115 年平均地發生淨利$600,000,且曾於 115 年 10 月 1 日發放現金股利\n$100,000 及 0.35 股之股票股利,另外兩公司間並沒有其他相互交易。試問 C 公司 115 年底此項投\n資調整後餘額為何?", "options": {"A": "$362,500", "B": "$425,000", "C": "$287,500", "D": "$350,000"}, "answer": "A", "note": "", "explanation": {"reason": "六月起持有七個月，按 25% 認列投資收益 87,500 元。收到現金股利 25,000 元沖減投資，股票股利不改變投資的總帳面金額，餘額 362,500 元。", "terms": "權益法依投資人持股比例認列被投資公司的損益變動。", "formulas": "期末投資＝300,000＋600,000 × 7/12 × 25%－100,000 × 25%。"}}, {"id": "accounting-115-14", "year": "115", "subject": "accounting", "subjectName": "會計學概要", "number": 14, "question": "115 年 12 月 31 日 F 公司之股東權益總額為$600,000,116 年度宣告並支付現金股利$100,000、淨損為\n$50,000(不含其他綜合損益)、發行無面額普通股$180,000、買回普通股並支付$48,000、透過其他綜合\n損益按公允價值衡量之權益工具投資評價利得$34,000,則 116 年 12 月 31 日股東權益總額為何?", "options": {"A": "$548,000", "B": "$664,000", "C": "$616,000", "D": "$648,000"}, "answer": "C", "note": "", "explanation": {"reason": "期初權益 600,000 元，扣股利 100,000、淨損 50,000 和買回股票 48,000，加發行股票 180,000 和其他綜合利益 34,000，得 616,000 元。", "terms": "庫藏股票會減少股東權益。其他綜合利益也會影響權益總額。", "formulas": "期末權益＝期初權益＋綜合損益＋發行股票－股利－買回股票。"}}, {"id": "accounting-115-15", "year": "115", "subject": "accounting", "subjectName": "會計學概要", "number": 15, "question": "G 公司 115 年初購入 H 公司股票作為投資,成本$200,000,分類為透過其他綜合損益按公允價值\n衡量之權益工具投資。115 年底及 116 年底該投資之公允價值分別為$196,000 及$195,000,則 116\n年底股東權益之「其他權益-透過其他綜合損益按公允價值衡量之權益工具未實現評價損益」為多\n少(假設 115 年初沒有其他權益餘額)?", "options": {"A": "借餘$5,000", "B": "貸餘$5,000", "C": "借餘$4,000", "D": "貸餘$1,000"}, "answer": "A", "note": "", "explanation": {"reason": "115 年評價減少 4,000 元，116 年再減少 1,000 元。期末其他權益反映累積減少 5,000 元，為借餘。", "terms": "其他權益期末餘額反映累積評價差額。", "formulas": "期末累積差額＝195,000－200,000＝－5,000 元。"}}, {"id": "accounting-115-16", "year": "115", "subject": "accounting", "subjectName": "會計學概要", "number": 16, "question": "L 公司 111 年初購買設備,成本$570,000,耐用年限 8 年,殘值$30,000,採年數合計法提列折舊\n並以成本模式後續衡量。114 年底該設備有減損跡象,估計使用價值為$130,000,公允價值減處分\n成本為$100,000,新估計之剩餘耐用年限為 3 年,殘值為$10,000。請問下列敘述何者錯誤?", "options": {"A": "114 年底該設備的帳面金額為$180,000", "B": "114 年底該設備減損測試的可回收金額為$130,000", "C": "114 年底該設備必須認列$50,000 減損損失", "D": "115 年底該設備的累計折舊總共為$450,000"}, "answer": "D", "note": ""}, {"id": "accounting-115-17", "year": "115", "subject": "accounting", "subjectName": "會計學概要", "number": 17, "question": "M 公司於 115 年 6 月 30 日與乙公司完成一項資產交換協議,M 公司換出之設備資產,其原始取\n得成本為$800,000,累計折舊$500,000,交換日之公允價值為$330,000。M 公司於交換乙公司設備\n資產之同時,亦另外支付公允價值差額現金$150,000。請問上述資產交換之敘述何者正確?", "options": {"A": "M 公司交換具商業實質,則將產生交換利益$30,000", "B": "M 公司交換具商業實質,則換入資產的金額為$450,000", "C": "M 公司交換不具商業實質,則換入資產的金額為$480,000", "D": "M 公司交換不具商業實質,則將產生交換利益$30,000"}, "answer": "A", "note": "", "explanation": {"reason": "換出設備帳面金額為 300,000 元。交換具商業實質時，按公允價值衡量，換出利益 30,000 元，換入成本為 480,000 元。若無商業實質，依本題資料以原帳面金額加現金 450,000 元衡量。", "terms": "具商業實質表示交換對未來現金流量具實質影響。", "formulas": "換出利益＝換出公允價值－換出帳面金額。"}}, {"id": "accounting-115-18", "year": "115", "subject": "accounting", "subjectName": "會計學概要", "number": 18, "question": "Q 公司存貨於 115 年 11 月底遭竊。經查詢 Q 公司存貨資料得知:月初存貨$1,750,000,進貨\n$8,925,000,進貨退出$175,000,銷貨$10,500,000,而 Q 公司採銷貨成本為基礎的毛利率 25%。此\n外 Q 公司於遭竊隔天進行盤點營業處及倉庫未遭竊之存貨成本為$210,000(包含承銷人的存貨\n$10,000),另外有一批亦未遭竊之寄銷品$10,000。請問遭竊之存貨成本為多少?", "options": {"A": "$1,890,000", "B": "$2,415,000", "C": "$1,900,000", "D": "$2,425,000"}, "answer": "A", "note": "", "explanation": {"reason": "可供銷售成本為 10,500,000 元。毛利按成本加成，銷貨成本為 8,400,000 元，遭竊前存貨應有 2,100,000 元。自有未遭竊存貨為 210,000－10,000＋10,000＝210,000 元，差額 1,890,000 元。", "terms": "寄銷商品屬寄銷人存貨，承銷人代售的商品不屬自己的存貨。", "formulas": "銷貨成本＝銷貨 ÷ (1＋成本加成率)。遭竊成本＝應有期末存貨－未遭竊自有存貨。"}}, {"id": "accounting-115-19", "year": "115", "subject": "accounting", "subjectName": "會計學概要", "number": 19, "question": "O 公司在 114 年初購入設備,該設備成本$60,000,預估耐用年限為 5 年,殘值$6,000,採年數合\n計法提列折舊並採成本模式後續衡量。116 年初因該設備之運作方式改變,改採直線法提列折舊,\n預估耐用年限不變,然而殘值增加為$7,000。則下列敘述何者錯誤?", "options": {"A": "此必須透過會計估計變動處理", "B": "115 年底設備的帳面金額為$27,600", "C": "116 年底設備的累計折舊為 $43,200", "D": "117 年折舊為$6,867"}, "answer": "C", "note": "", "explanation": {"reason": "前兩年折舊為 54,000 × (5＋4) ÷ 15＝32,400 元，帳面金額為 27,600 元。改採直線法後，每年折舊為 (27,600－7,000) ÷ 3，約 6,867 元。116 年底累計折舊約 39,267 元，因此 43,200 元錯誤。", "terms": "年數合計法按剩餘年數給予遞減權重。折舊方法與殘值的變動作為會計估計變動，自變動期起處理。", "formulas": "年數合計法折舊＝(成本－殘值) × 剩餘年數 ÷ 耐用年數總和。變動後直線法折舊＝(變動日帳面金額－新殘值) ÷ 剩餘年限。"}}, {"id": "accounting-115-20", "year": "115", "subject": "accounting", "subjectName": "會計學概要", "number": 20, "question": "乙公司於 X2 年初以$30,000 購入乳牛一批用以生產牛奶,並以販售牛奶為主要營業項目,購入當\n時若將該批乳牛於市場出售,需負擔出售成本 $1,800。該批乳牛估計可持續生產牛奶 3 年,3 年\n後若將其宰殺出售預計可得$6,000。X2 年底相關資訊如下:(1)該批乳牛若立即將其出售,市價為\n$21,000,需負擔出售成本$1,600;(2)公司在 X2 年度因販售牛奶獲得營業收入$15,000;(3)因飼料\n成本上漲,公司重新評估該批乳牛 3 年後殘值調降為$4,000。試問:若乙公司評估後並無出售該\n批乳牛,則該批乳牛於 X2 年底資產負債表中報導之生物資產帳面金額,以及該批乳牛之評價對\nX2 年度本期淨利之影響數(不含牛奶銷售收入)分別為何?", "options": {"A": "帳面金額$21,000;本期淨利減少$9,000", "B": "帳面金額$19,400;本期淨利減少$8,800", "C": "帳面金額$19,400;本期淨利減少$10,600", "D": "帳面金額$22,000;本期淨利減少$8,000"}, "answer": "C", "note": "", "explanation": {"reason": "購入時按 30,000－1,800＝28,200 元認列，與支付的 30,000 元相比先認列損失 1,800 元。年末按 21,000－1,600＝19,400 元衡量，再認列損失 8,800 元。本期兩段評價損失合計 10,600 元。", "terms": "生物資產包括活的動物與植物。本題以公允價值減出售成本衡量乳牛。", "formulas": "帳面金額＝公允價值－出售成本。本題本期評價損失＝購入時損失＋期末重衡量損失。"}}, {"id": "bookkeeping-115-1", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 1, "question": "依記帳士法第 4 條規定,關於充任記帳士之情形,下列敘述何者正確?", "options": {"A": "曾服公職,受免除職務處分,自處分確定日起屆滿 1 年者得充任記帳士", "B": "受破產宣告,復權尚未屆滿一年,不得充任記帳士", "C": "記帳士受委託處理公司的會計事務,因偽造文書而被判決有期徒刑 1 年 6 個月確定,執行期滿後需\n重新參加記帳士考試及格後方能再充任記帳士", "D": "受輔助宣告尚未撤銷,不得充任記帳士"}, "answer": "D", "note": ""}, {"id": "bookkeeping-115-2", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 2, "question": "甲君任職於財政部中區國稅局臺中分局擔任總務人員,民國 112 年 12 月 31 日後離職,經過多年努力\n順利通過記帳士考試,於 115 年 1 月 1 日起準備開始執業,下列敘述何者正確?", "options": {"A": "自國稅局離職未滿 3 年,不得執行記帳士業務", "B": "曾任稅務機關人員,終身不得執行記帳士業務", "C": "甲得選擇在彰化縣執行記帳士業務", "D": "甲不得選擇在臺中市執行記帳士業務"}, "answer": "C", "note": ""}, {"id": "bookkeeping-115-3", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 3, "question": "甲君在新竹縣登錄為執行業務區域,下列何者為可受委任執行的業務項目?", "options": {"A": "查核簽證公司申請設立登記之資本額", "B": "受理新竹縣營所稅案件查核簽證事項", "C": "申請新竹縣營利事業所得稅復查事項", "D": "受委任從事新竹縣各項稅捐案件之行政訴訟"}, "answer": "C", "note": ""}, {"id": "bookkeeping-115-4", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 4, "question": "依記帳士法規定,記帳士有下列行為時,應付懲戒?1記帳士本身被查獲逃漏稅捐,經移送法辦 2違反\n記帳士公會章程規定,情節重大 3幫助委託客戶逃漏稅捐,經移送法辦 4因業務上犯罪行為經檢察\n官起訴,尚未判刑確定", "options": {"A": "1234", "B": "僅123", "C": "僅34", "D": "僅23"}, "answer": "D", "note": ""}, {"id": "bookkeeping-115-5", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 5, "question": "葉二今年剛從大學畢業,未曾從事記帳及報稅代理業務,也未取得記帳士資格,因涉世未深即擅自代\n他人申報營業稅及處理商業會計事務,其處罰規定適用之法條及應給予何種處罰?", "options": {"A": "依記帳士法第 34 條規定處新臺幣三萬元以上十五萬元以下罰金", "B": "依記帳士法第 34 條規定處新臺幣三萬元以上十五萬元以下罰鍰", "C": "依記帳士法第 33 條規定處新臺幣三萬元以上十五萬元以下罰金", "D": "依記帳士法第 33 條規定處新臺幣三萬元以上十五萬元以下罰鍰"}, "answer": "B", "note": ""}, {"id": "bookkeeping-115-6", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 6, "question": "下列憑證、帳簿及報表何者須經經辦會計簽名或蓋章?1原始憑證 2記帳憑證 3帳簿目錄 4帳\n簿 5決算報表", "options": {"A": "僅123", "B": "僅234", "C": "僅1234", "D": "12345"}, "answer": "B", "note": ""}, {"id": "bookkeeping-115-7", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 7, "question": "下列公司 115 年度的現金之交易,那些不符合商業會計法第 9 條規定?1甲公司以電匯方式支付國外\n廠商貨款 90 萬元 2張君以現金支付乙公司貨款 120 萬元 3丙公司收到個人以現金支付 150 萬元\n購買臺北公司的二手貨車 4丁商號以現金支付臺中公司 180 萬元貨款 5戊公司以活期存款取款\n條自銀行提領 200 萬元轉帳支付廠商貨款", "options": {"A": "僅2345", "B": "僅24", "C": "僅23", "D": "僅4"}, "answer": "D", "note": ""}, {"id": "bookkeeping-115-8", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 8, "question": "甲公司為新設立的公司,依商業會計法規定,關於主辦會計之任免,下列敘述何者正確?", "options": {"A": "若為股份有限公司,應由股東會以股東之過半數之出席,及出席股東過半數之同意", "B": "若為有限公司,應有全體股東過半數之同意", "C": "若為無限公司,應有全體執行業務股東之同意", "D": "若為兩合公司,應有全體股東之同意"}, "answer": "B", "note": ""}, {"id": "bookkeeping-115-9", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 9, "question": "有關記帳士業務事件的主管機關,下列何者與其他三者不同?", "options": {"A": "稅務申報", "B": "商業會計", "C": "商業登記", "D": "公司登記"}, "answer": "A", "note": ""}, {"id": "bookkeeping-115-10", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 10, "question": "依據商業會計法規定,下列何者非應揭露之期後事項?", "options": {"A": "主要資產之添置、擴充", "B": "債權人對於特定資產之權利", "C": "資本結構之變動", "D": "重大災害損失"}, "answer": "B", "note": ""}, {"id": "bookkeeping-115-11", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 11, "question": "依據行政程序法規定,有關行政處分附款之敘述,下列何者錯誤?", "options": {"A": "附款應與行政處分之目的有正當合理之關聯", "B": "附款之內容不得違背行政處分之目的", "C": "附款保留行政處分之廢止權", "D": "行政機關不論有無裁量權,作成行政處分時,皆無條件得為附款"}, "answer": "D", "note": ""}, {"id": "bookkeeping-115-12", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 12, "question": "依據商業會計法有關會計憑證的規定,下列敘述何者錯誤?", "options": {"A": "商業會計憑證分為原始憑證與記帳憑證", "B": "無法取得原始憑證之會計事項,主辦會計得令經辦及主管該事項之人員,分別或共同證明,憑以記帳", "C": "商業會計之處理,記帳憑證應以原始憑證為記帳所根據之憑證", "D": "商業會計事務較簡單者得不編製記帳憑證"}, "answer": "B", "note": ""}, {"id": "bookkeeping-115-13", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 13, "question": "下列有關商業會計法規定的認列與衡量原則,何者錯誤?", "options": {"A": "資產及負債之原始認列,以成本衡量為原則", "B": "未來經濟效益很有可能流入或流出商業且項目金額能可靠衡量者,始得認列為資產負債表或綜合損\n益表之會計項目", "C": "資產之取得
