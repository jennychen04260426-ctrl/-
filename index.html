銷須另為處分確定之日起算 1 年內", "C": "核課期間屆滿時,行政救濟尚未終結者,自核定稅捐處分經訴願或行政訴訟撤銷須另為處分確定之日起\n算 1 年內", "D": "核課期間屆滿時,因天災、事變或不可抗力之事由致未能作成核定稅捐處分者,自妨礙事由消滅之日起\n算 1 年內"}, "answer": "D", "note": ""}, {"id": "tax-111-3", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 3, "question": "某甲於民國 111 年 5 月 10 日完成 110 年度綜合所得稅申報和繳納,核課期間之起算日為下列何者?", "options": {"A": "111 年 5 月 1 日", "B": "111 年 5 月 10 日", "C": "111 年 5 月 31 日", "D": "111 年 6 月 1 日"}, "answer": "B", "note": ""}, {"id": "tax-111-4", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 4, "question": "甲公司和乙公司合併後另設立丙公司,甲公司合併前有應納地價稅,乙公司合併前有應退營利事業所得稅,\n合併前兩公司之應納和應退稅捐如何處理?", "options": {"A": "應納之地價稅由甲公司繳納", "B": "應退之營利事業所得稅退還乙公司", "C": "應納之地價稅由丙公司繳納,應退之營利事業所得稅退還丙公司", "D": "應納之地價稅由丙公司繳納,應退之營利事業所得稅退還乙公司"}, "answer": "C", "note": ""}, {"id": "tax-111-5", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 5, "question": "因適用法令、認定事實、計算錯誤而溢繳稅款者,納稅義務人得自繳納之日起 1 年內申請退還;但因\n可歸責於政府機關之錯誤, 2 年內申請退還。上述1、2分別為下列何者?", "options": {"A": "5、無期限", "B": "5、10", "C": "10、15", "D": "15、15"}, "answer": "C", "note": ""}, {"id": "tax-111-6", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 6, "question": "下列何者為稅捐稽徵法第 49 條但書所列不在稅捐準用之範圍?1罰鍰 2滯納金 3滯報金 4利息\n5怠報金", "options": {"A": "僅1", "B": "24", "C": "124", "D": "135"}, "answer": "D", "note": ""}, {"id": "tax-111-7", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 7, "question": "有關稅捐稽徵法針對逃漏稅捐之刑事處罰,下列敘述何者錯誤?", "options": {"A": "納稅義務人施以詐術者,處 5 年以下有期徒刑,併科新臺幣 1,000 萬元以下罰金", "B": "營利事業逃漏稅額在新臺幣 2,000 萬元以上者,處 1 年以上 7 年以下有期徒刑,併科新臺幣 1,000 萬元\n以上 1 億元以下罰金", "C": "營利事業逃漏稅額在新臺幣 5,000 萬元以上者,處 1 年以上 7 年以下有期徒刑,併科新臺幣 1,000 萬元\n以上 1 億元以下罰金", "D": "教唆或幫助逃漏稅捐者,處 3 年以下有期徒刑,併科新臺幣 100 萬元以下罰金"}, "answer": "B", "note": ""}, {"id": "tax-111-8", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 8, "question": "試問下列何者為房地合一課徵所得稅之課稅範圍?1持有過半數之股權且其價值 50%以上為境內之房\n地 2農地 3預售屋及其坐落基地 4設定地上權方式之房屋使用權 5農舍", "options": {"A": "123", "B": "134", "C": "135", "D": "245"}, "answer": "B", "note": ""}, {"id": "tax-111-9", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 9, "question": "下列何者符合所得稅房屋租金支出列舉扣除規定?1每一申報戶每年最多可扣除 12 萬元 2納稅義務人\n在中華民國境外租屋自住可扣除 3申報有購屋借款利息者,不得扣除 4申報受扶養的叔父,租屋自住\n租金可扣除", "options": {"A": "12", "B": "34", "C": "13", "D": "24"}, "answer": "C", "note": ""}, {"id": "tax-111-10", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 10, "question": "試問中華民國境內居住之個人交易下列何者房地之適用稅率為 20%?1房地之持有期間為 10 年 2符合\n所得稅法第 4 條之 5 之自住房地 3提供土地依都市更新條例參與都市更新,於興建房屋完成後第一次移\n轉且其持有期間 5 年內之房地 4因財政部公告之非自願性因素,交易持有期間 5 年內之房地", "options": {"A": "12", "B": "僅34", "C": "134", "D": "234"}, "answer": "C", "note": ""}, {"id": "tax-111-11", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 11, "question": "綜合所得稅課徵時的基本生活所需費用,係參照最近一年全國每人可支配所得的何者決定?", "options": {"A": "平均數;50%", "B": "最大數;60%", "C": "中位數;50%", "D": "中位數;60%"}, "answer": "D", "note": ""}, {"id": "tax-111-12", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 12, "question": "營利事業交易其以起造人申請建物所有權第一次登記所取得之房屋及其坐落基地者,其所得稅之課稅規定\n何者是正確的?", "options": {"A": "不併計營利事業所得額,分開計算應納稅額,合併報繳", "B": "不併計營利事業所得額,分開計算應納稅額,分開報繳", "C": "併計營利事業所得額結算申報,交易損失得自 10 年內之純益額中扣除", "D": "併計營利事業所得額結算申報,交易損失得自 10 年內之房地交易所得中減除"}, "answer": "C", "note": ""}, {"id": "tax-111-13", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 13, "question": "下列有關房地合一課徵所得稅之自住房地相關規定何者是正確的?1個人或其配偶、直系親屬辦竣戶籍\n登記、持有並居住於該房屋連續滿 6 年 2交易前 6 年內,無出租、供營業或執行業務使用 3個人與其\n配偶及未成年子女,無該自住房地以外之房地 4個人與其配偶及未成年子女於交易前 6 年內未曾適用此\n規定 5免稅所得額以不超過 400 萬元為限", "options": {"A": "135", "B": "234", "C": "245", "D": "1245"}, "answer": "C", "note": "答C給分"}, {"id": "tax-111-14", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 14, "question": "受益人不特定或尚未存在之信託財產發生收入,年度所得稅的納稅義務人為下列何者?", "options": {"A": "委託人", "B": "受託人", "C": "未來之受益人", "D": "委託人之配偶"}, "answer": "B", "note": ""}, {"id": "tax-111-15", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 15, "question": "下列何者屬於所得稅的特別扣除額項目?1長期照顧 2災害損失 3子女大學學費 4購屋借款利息", "options": {"A": "12", "B": "13", "C": "23", "D": "24"}, "answer": "B", "note": ""}, {"id": "tax-111-16", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 16, "question": "依所得稅法,納稅義務人提供帳簿文據,若無特殊情形,稽徵機關應於帳簿文據提送完全之日起,多久內\n發還?", "options": {"A": "5 日", "B": "7 日", "C": "14 日", "D": "30 日"}, "answer": "B", "note": ""}, {"id": "tax-111-17", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 17, "question": "總機構在中華民國境內之營利事業,其房地交易所得不併計營利事業所得額者,依下列何者稅率分開計算\n應納稅額?145% 235% 320% 415% 510%", "options": {"A": "僅3", "B": "僅12", "C": "123", "D": "12345"}, "answer": "C", "note": ""}, {"id": "tax-111-18", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 18, "question": "根據所得基本稅額條例,下列何者所得應計入個人 112 年度之基本所得額?1大陸地區來源所得 200 萬元\n2受控外國公司(Controlled Foreign Company)所得 300 萬元 3死亡人壽保險給付 2,000 萬元 4未上\n市櫃非新創事業公司股票交易所得 100 萬元 5非現金捐贈 50 萬元", "options": {"A": "123", "B": "145", "C": "235", "D": "245"}, "answer": "D", "note": ""}, {"id": "tax-111-19", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 19, "question": "下列有關受控外國公司(Controlled Foreign Company)所得計入個人 112 年度之基本所得額之規定何者是\n正確的?1個人及其關係人直接或間接持有在中華民國境外低稅負國家之關係企業股份合計達 50%以上\n2該關係企業於所在國家有實質營運活動 3個人或其與配偶及直系親屬合計持有該關係企業股份 10%\n以上 4併計依規定應計入基本所得額之海外所得", "options": {"A": "13", "B": "14", "C": "134", "D": "1234"}, "answer": "B", "note": ""}, {"id": "tax-111-20", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 20, "question": "根據營利事業所得稅查核準則,下列有關利息之認列何者是錯誤的?", "options": {"A": "依稅捐稽徵法第 38 條規定行政救濟程序確定應補繳稅款所加計之利息,以費用列支", "B": "因土地以外進貨借款所支付之利息,以財務費用列支", "C": "獨資之資本主所借貸之款項,以費用列支", "D": "因增建固定資產而借款在建造期間應付之利息費用,應作為該項資產之成本,以資本支出列帳"}, "answer": "C", "note": ""}, {"id": "tax-111-21", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 21, "question": "根據營利事業所得稅查核準則,下列費用併入製造成本的敘述何者是錯誤的?", "options": {"A": "產製特種貨物廠商繳納之特種貨物及勞務稅,應併入製造成本", "B": "製造工廠之水、電、瓦斯費,應攤入製造成本", "C": "應納貨物稅廠商繳納原物料之貨物稅,應併入製造成本", "D": "製造所耗之燃料費應列入製造成本"}, "answer": "A", "note": ""}, {"id": "tax-111-22", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 22, "question": "根據營利事業所得稅查核準則,下列有關薪資支出之認列何者是正確的?", "options": {"A": "公司董事兼任經理者之薪資屬盈餘分配,不得列為費用或損失", "B": "公司為發行員工認股權憑證獎酬公司員工者,核實認定為薪資費用", "C": "合夥組織執行業務之合夥人之薪資屬盈餘分配,不得列為費用或損失", "D": "按期定額給付之交通費及膳宿費,認列為交通費"}, "answer": "B", "note": ""}, {"id": "tax-111-23", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 23, "question": "營利事業銷售貨物時,依我國現行營利事業查核準則規定,如有隨銷售附贈禮券,該附贈禮券相對應之收\n入應於何時認列?", "options": {"A": "銷售時", "B": "禮券兌換時", "C": "年底時", "D": "禮券兌換期限屆滿時"}, "answer": "A", "note": ""}, {"id": "tax-111-24", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 24, "question": "依現行稅法,下列何者不是分期付款銷貨,當期損益的計算方法?", "options": {"A": "同業平均毛利法", "B": "全部毛利法", "C": "普通銷貨法", "D": "毛利百分比法"}, "answer": "A", "note": ""}, {"id": "tax-111-25", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 25, "question": "根據營利事業所得稅查核準則,下列有關職工退休金之認列何者是錯誤的?", "options": {"A": "適用勞動基準法之營利事業,依勞工退休金條例提繳之年金保險費,每年度得在不超過當年度已付薪資\n總額 20%限度內列支", "B": "非適用勞動基準法之營利事業定有職工退休辦法者,每年度得在不超過當年度已付薪資總額 4%限度內\n列支", "C": "營利事業設置職工退休基金,與該營利事業完全分離者,每年度得在不超過當年度已付薪資總額 8%限\n度內列支", "D": "受委任工作者提繳之退休金,每年度得在不超過當年度已付薪資總額 6%限度內列支"}, "answer": "A", "note": ""}, {"id": "tax-111-26", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 26, "question": "根據營利事業所得稅查核準則,下列有關捐贈之認列何者是錯誤的?", "options": {"A": "對政黨、政治團體及擬參選人之捐贈,以不超過所得額 10%為限,其總額並不得超過新臺幣 50 萬元", "B": "直接對大陸地區捐贈者,不得列為費用或損失", "C": "透過財團法人私立學校興學基金會指定對特定學校法人或私立學校之捐款,以不超過所得額 20%為限", "D": "營利事業透過合於所得稅法第 11 條第 4 項規定之機關、團體對災區受災居民救助及重建之捐贈,不受\n金額之限制"}, "answer": "C", "note": ""}, {"id": "tax-111-27", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 27, "question": "根據營利事業所得稅查核準則,下列有關福利金之提撥標準及費用認列何者是錯誤的?", "options": {"A": "創立時實收資本總額之 5%限度內一次提撥。每年得在不超過提撥金額 20%限度內,以費用列支", "B": "增資資本額之 5%限度內一次提撥。每年得在不超過提撥金額 20%限度內,以費用列支", "C": "每月營業收入總額內提撥 0.05%至 0.15%", "D": "下腳變價時提撥金額不得超過 20%限度內"}, "answer": "D", "note": ""}, {"id": "tax-111-28", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 28, "question": "根據營利事業所得稅查核準則,下列有關稅捐之認列何者是錯誤的?", "options": {"A": "依特種稅額計算繳納之營業稅以稅捐科目列支", "B": "加值型營業稅中不得扣抵之進項稅額不得列為成本費用或損失", "C": "營利事業扣繳他人所得稅款不得列為成本或捐費", "D": "購買房地所繳之契稅、印花稅等應併入房地之成本"}, "answer": "B", "note": ""}, {"id": "tax-111-29", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 29, "question": "營利事業在稽徵機關規定帳簿文據送交調查時間內,申請延期提示者,延長期限最長不得超過多久?可延\n長幾次?", "options": {"A": "1 個月;1 次", "B": "1 個月;2 次", "C": "2 個月;1 次", "D": "2 個月;2 次"}, "answer": "A", "note": ""}, {"id": "tax-111-30", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 30, "question": "下列何者進項稅額不得扣抵銷項稅額?1交際應酬用之貨物 2機器設備 3自用乘人小汽車 4勞軍\n用之貨物 5捐贈慈善單位之貨物", "options": {"A": "123", "B": "124", "C": "135", "D": "345"}, "answer": "C", "note": ""}, {"id": "tax-111-31", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 31, "question": "依現行稅法,有陪侍服務酒吧的特種飲食業,營業稅稅率是多少?", "options": {"A": "百分之五", "B": "百分之十", "C": "百分之十五", "D": "百分之二十五"}, "answer": "D", "note": ""}, {"id": "tax-111-32", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 32, "question": "依現行稅法,小規模營業人的定義為下列何者?1無固定營業場所 2規模狹小 3交易零星 4每月銷\n售額免用統一發票", "options": {"A": "123", "B": "234", "C": "124", "D": "134"}, "answer": "B", "note": ""}, {"id": "tax-111-33", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 33, "question": "營業人發行「憑券兌付一定數量之貨物」的商品禮券,應於何時開立統一發票?", "options": {"A": "兌付貨物時", "B": "出售禮券時", "C": "月底", "D": "年底"}, "answer": "B", "note": ""}, {"id": "tax-111-34", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 34, "question": "跨境電商銷售電子勞務予境內自然人,有關課徵營業稅之相關規定何者是錯誤的?", "options": {"A": "營業稅之納稅義務人為營業人", "B": "在境內無營業場所者,不須辦理稅籍登記", "C": "在境內無營業場所者,年銷售額超過 48 萬元,應自行辦理稅籍登記並報繳營業稅", "D": "在境內無營業場所者,年銷售額超過 48 萬元,應委託境內代理人辦理稅籍登記並報繳營業稅"}, "answer": "B", "note": ""}, {"id": "tax-111-35", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 35, "question": "依現行稅法,統一發票給獎經費,由全年營業稅收入總額中提出多少支應?", "options": {"A": "1%", "B": "3%", "C": "5%", "D": "10%"}, "answer": "B", "note": ""}, {"id": "tax-111-36", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 36, "question": "依現行稅法規定,下列應納遺產稅額,何者得申請分期繳納?", "options": {"A": "15 萬元", "B": "20 萬元", "C": "25 萬元", "D": "50 萬元"}, "answer": "D", "note": ""}, {"id": "tax-111-37", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 37, "question": "被繼承人為受死亡之宣告者,應自何日起算遺產稅的申報期間?", "options": {"A": "死亡次一日", "B": "判決宣告日", "C": "除籍日", "D": "收到判決書日"}, "answer": "B", "note": ""}, {"id": "tax-111-38", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 38, "question": "依加值型及非加值型營業稅法,下列何者不適用「視為銷售」之規定?", "options": {"A": "營業人銷售代銷貨物", "B": "營業人委託他人代銷貨物", "C": "因信託成立,委託人將貨物移轉給受託人", "D": "營業人以自己名義代購貨物交付給委託人"}, "answer": "C", "note": ""}, {"id": "tax-111-39", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 39, "question": "外國技藝表演業,將在我國境內演出 7 日,並於演出後於境內觀光旅遊 1 個月後出境,其表演收入應於何\n時報繳營業稅?", "options": {"A": "入境時", "B": "出境時", "C": "演出前 15 日內", "D": "演出結束後 15 日內"}, "answer": "D", "note": ""}, {"id": "tax-111-40", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 40, "question": "依查定計算營業稅額之特種飲食業,由主管稽徵機關隔多久填發繳款書通知繳納一次?", "options": {"A": "每月", "B": "每兩個月", "C": "每三個月", "D": "每六個月"}, "answer": "A", "note": ""}, {"id": "tax-111-41", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 41, "question": "依現行稅法,營業稅納稅義務人虛報進項稅額,除追繳稅款外,處多少罰鍰?", "options": {"A": "新臺幣一千五百元以上一萬五千元以下", "B": "新臺幣三千元以上三萬元以下", "C": "新臺幣五千元以上五萬元以下", "D": "所漏稅額五倍以下"}, "answer": "D", "note": ""}, {"id": "tax-111-42", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 42, "question": "受託人因公益信託義賣貨物之收入,除支付必要費用外全部做該公益使用,有關此銷售貨物收入,下列何\n者正確?", "options": {"A": "收入計入受託人之銷售額;課徵營業稅", "B": "收入計入受託人之銷售額;免徵營業稅", "C": "收入不計入受託人之銷售額;課徵營業稅", "D": "收入不計入受託人之銷售額;免徵營業稅"}, "answer": "D", "note": ""}, {"id": "tax-111-43", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 43, "question": "110 年營利事業基本稅額計徵,下列敘述何者正確?1基本所得額扣除新臺幣 100 萬元 2法定稅率最高\n不得超過百分之十五 3法定稅率最低不得低於百分之十 4徵收率是百分之十二", "options": {"A": "12", "B": "34", "C": "23", "D": "24"}, "answer": "D", "note": ""}, {"id": "tax-111-44", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 44, "question": "以自動販賣機從事下列何者行為應逐筆開立統一發票交付買受人?1銷售遊戲點數卡 2銷售食品\n3銷售飲料 4銷售書籍 5收取停車費", "options": {"A": "123", "B": "134", "C": "145", "D": "235"}, "answer": "D", "note": ""}, {"id": "tax-111-45", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 45, "question": "在下列何者情形,主管稽徵機關應停止營業人購買統一發票?1受停止營業處分 2無進貨事實虛報進項\n稅額 3遷移營業地址未辦理變更登記 4開立不實統一發票 5滯欠營業稅未繳清", "options": {"A": "12", "B": "14", "C": "234", "D": "235"}, "answer": "B", "note": ""}, {"id": "tax-111-46", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 46, "question": "111 年發生之繼承或贈與案件適用下列何者金額時,已依規定按物價指數進行調整?1喪葬費扣除額\n2遺產稅之免稅額 3配偶扣除額 4被繼承人職業上之工具 5贈與稅之免稅額", "options": {"A": "25", "B": "34", "C": "125", "D": "12345"}, "answer": "A", "note": ""}, {"id": "tax-111-47", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 47, "question": "下列何項財產不計入遺產總額?1公共設施保留地 2農業用地 3公眾通行道路之土地 4勞工之保\n險金額 5出價取得之專利權", "options": {"A": "25", "B": "34", "C": "123", "D": "134"}, "answer": "B", "note": ""}, {"id": "tax-111-48", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 48, "question": "下列何項贈與額屬於不計入贈與總額之項目?1老師支付學生之醫藥費 2夫妻相互贈與之財產 3無\n償供公眾通行之道路土地 4子女婚嫁時祖父母贈與不超過 100 萬元之財物 5農業用地", "options": {"A": "25", "B": "34", "C": "124", "D": "245"}, "answer": "A", "note": ""}, {"id": "tax-111-49", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 49, "question": "依現行稅法,下列關於贈與稅之計算,何者有誤?", "options": {"A": "一年內有三次贈與者,應合併計算其贈與額", "B": "配偶相互贈與之財產,不計入贈與總額", "C": "課稅贈與淨額,按單一稅率 10%課徵", "D": "附有負擔者,由受贈人負擔部分應自贈與額中扣除"}, "answer": "C", "note": ""}, {"id": "tax-111-50", "year": "111", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 50, "question": "被繼承人死亡後始經法院判決確定為其所有之財產,遺產稅納稅義務人應自判決確定之日起,多久時間內\n補申報遺產稅?", "options": {"A": "1 個月", "B": "3 個月", "C": "6 個月", "D": "1 年內"}, "answer": "C", "note": ""}, {"id": "accounting-112-1", "year": "112", "subject": "accounting", "subjectName": "會計學概要", "number": 1, "question": "甲公司 X2 年底應付薪資為$6,000,X3 年初未作任何轉回分錄,X3 年 1 月 10 日支付薪資$14,000,\n公司全數認列為薪資費用。X3 年 11 月 1 日預收六個月租金$30,000,全數認列為租金收入。若\nX3 年底未作任何更正與調整分錄前之淨利為$64,000,則 X3 年正確淨利應是多少?", "options": {"A": "$38,000", "B": "$50,000", "C": "$52,000", "D": "$60,000"}, "answer": "B", "note": ""}, {"id": "accounting-112-2", "year": "112", "subject": "accounting", "subjectName": "會計學概要", "number": 2, "question": "甲、乙二合夥人資本帳戶餘額分別為$50,000 及$80,000,損益分配比例為 4:6。丙經甲、乙\n同意投資$90,000 於該合夥組織並取得 25%之合夥權益。試問丙加入後,甲、乙、丙三人之資\n本額分別是多少?", "options": {"A": "$64,000;$101,000;$55,000", "B": "$66,000;$99,000;$55,000", "C": "$106,000;$164,000;$90,000", "D": "$108,000;$162,000;$90,000"}, "answer": "A", "note": ""}, {"id": "accounting-112-3", "year": "112", "subject": "accounting", "subjectName": "會計學概要", "number": 3, "question": "甲公司賒購商品一批,定價$200,000,商業折扣 15%,付款條件 2/10,n/30,目的地交貨,送\n貨運費$6,000,驗收時發現部分商品瑕疵退回$15,000。甲公司於 10 日內付清款項,則該批商\n品進貨淨額是多少?", "options": {"A": "$151,900", "B": "$154,105", "C": "$157,600", "D": "$157,900"}, "answer": "A", "note": ""}, {"id": "accounting-112-4", "year": "112", "subject": "accounting", "subjectName": "會計學概要", "number": 4, "question": "甲公司 X3 年初備抵損失有貸餘$20,400,X3 年已沖銷帳款再度收回之金額有$3,000,X3 年\n12 月 31 日應收帳款餘額為$195,000,且根據應收帳款帳齡分析表,估計期末應收帳款之淨變\n現價值為$180,000。若甲公司 X3 年度認列信用損失$5,400,則 X3 年實際發生的信用損失金\n額為何?", "options": {"A": "$2,400", "B": "$7,800", "C": "$10,800", "D": "$13,800"}, "answer": "D", "note": ""}, {"id": "accounting-112-5", "year": "112", "subject": "accounting", "subjectName": "會計學概要", "number": 5, "question": "甲公司存貨採定期盤存制,X2 年底期末存貨高估$30,000,X3 年底期末存貨低估$40,000,則\n上述兩項錯誤對 X3 年度淨利之影響為何?", "options": {"A": "低估$10,000", "B": "低估$70,000", "C": "低估$40,000", "D": "高估$10,000"}, "answer": "B", "note": ""}, {"id": "accounting-112-6", "year": "112", "subject": "accounting", "subjectName": "會計學概要", "number": 6, "question": "甲公司購置一組儲存設備,定價$1,400,000,取得商業折扣$140,000,支付營業稅$63,000,該\n營業稅依法屬可扣抵之進項稅額,安裝成本$25,000,測試成本$20,000,另支付一年期的產物\n保險$5,000。10 年後該儲存設備報廢時需進行環保工程處理,預期 10 年後的環保處理支出為\n$60,950,該項除役成本之現值為$50,000。試問該儲存設備入帳之成本為何?", "options": {"A": "$1,305,000", "B": "$1,355,000", "C": "$1,418,000", "D": "$1,423,000"}, "answer": "B", "note": ""}, {"id": "accounting-112-7", "year": "112", "subject": "accounting", "subjectName": "會計學概要", "number": 7, "question": "甲公司於 X2 年初購入設備,成本$420,000,估計耐用年限 6 年,殘值$90,000,以直線法提\n列折舊。X5 年初,甲公司支付$120,000 為設備進行全面檢修,預計可使設備延長 3 年之使用\n年限,殘值$72,000,則 X5 年底該設備的帳面金額為何?", "options": {"A": "$274,000", "B": "$304,000", "C": "$324,500", "D": "$339,500"}, "answer": "C", "note": ""}, {"id": "accounting-112-8", "year": "112", "subject": "accounting", "subjectName": "會計學概要", "number": 8, "question": "甲公司被同業控告侵犯專利權,並要求賠償,甲公司法律顧問評估甲公司勝訴機會微乎其微,\n可能的賠償金額在$1,500,000~$5,000,000 之間,其機率分布如下:\n金額 機率\n$1,500,000 10%\n$3,000,000 85%\n$5,000,000 5%\n則甲公司有關該訴訟之會計處理為何?", "options": {"A": "應認列負債準備$2,950,000", "B": "應認列負債準備$3,000,000", "C": "應認列負債準備$1,500,000,並附註揭露或有負債$3,500,000", "D": "僅附註揭露或有負債金額為$1,500,000~$5,000,000"}, "answer": "B", "note": ""}, {"id": "accounting-112-9", "year": "112", "subject": "accounting", "subjectName": "會計學概要", "number": 9, "question": "X3 年 1 月 1 日甲公司權益項目有普通股股本$2,000,000、資本公積-普通股發行溢價$200,000\n及保留盈餘$1,000,000,普通股每股面額$10。X3 年 3 月 1 日以每股$14 買回庫藏股票 10,000\n股,同年 7 月 1 日以每股$15 再發行庫藏股票 5,000 股,9 月 1 日以每股$11 再發行庫藏股票\n3,000 股,則有關 9 月 1 日之分錄何者正確?", "options": {"A": "借記保留盈餘$4,000", "B": "借記資本公積-庫藏股票交易$9,000", "C": "借記資本公積-普通股發行溢價$3,000", "D": "貸記庫藏股票$33,000"}, "answer": "A", "note": ""}, {"id": "accounting-112-10", "year": "112", "subject": "accounting", "subjectName": "會計學概要", "number": 10, "question": "甲公司 X3 年度銷貨成本為$860,000,其他相關資料如下:\n期 初 期 末\n應收帳款 $40,000 $41,000\n存貨 70,000 72,000\n應付帳款 36,000 32,000\n試問甲公司 X3 年度進貨付現金額是多少?", "options": {"A": "$858,000", "B": "$862,000", "C": "$864,000", "D": "$866,000"}, "answer": "D", "note": ""}, {"id": "accounting-112-11", "year": "112", "subject": "accounting", "subjectName": "會計學概要", "number": 11, "question": "若兩種會計處理方法提供的財務資訊均符合兩項基本品質特性,可另以強化品質特性協助選\n擇。下列何者為強化品質特性?1可了解性 2中立性 3完整性 4可比性 5可驗證性\n6可預測性 7時效性", "options": {"A": "1457", "B": "1456", "C": "237", "D": "2346"}, "answer": "A", "note": ""}, {"id": "accounting-112-12", "year": "112", "subject": "accounting", "subjectName": "會計學概要", "number": 12, "question": "有關公司債之說明何者正確?", "options": {"A": "票面利率反映債券持有人真正賺得之報酬率", "B": "當票面利率大於市場利率,公司債以折價發行", "C": "無論折價或溢價發行,每年的利息費用均為遞增", "D": "無論折價或溢價發行,每年之折溢價攤銷均為遞增"}, "answer": "D", "note": ""}, {"id": "accounting-112-13", "year": "112", "subject": "accounting", "subjectName": "會計學概要", "number": 13, "question": "甲公司 X2 年以每股$28 元購入乙公司股票 100,000 股(占乙公司流通在外股數 5%),甲公司\n持有目的為策略性投資,故分類為「透過其他綜合損益按公允價值衡量之金融資產」。X2 年\n底乙公司股價每股$35 元,X3 年 3 月底甲公司以每股$38 元將持有乙公司的半數股票售出,\n其餘半數直至年底均未出售(X3 年底每股股價$42)。甲公司無其他金融資產投資,試問與股\n票投資有關之交易如何影響 X3 年淨利?", "options": {"A": "不影響", "B": "增加$150,000", "C": "增加$350,000", "D": "增加$500,000"}, "answer": "A", "note": ""}, {"id": "accounting-112-14", "year": "112", "subject": "accounting", "subjectName": "會計學概要", "number": 14, "question": "某公司之存貨於 X3 年 9 月份因火災造成嚴重損失,以下為 X3 年 9 月份截至火災前存貨之\n相關資訊:存貨(9 月 1 日)$40,000,進貨$275,000,進貨退回$25,000,進貨運費$15,000,\n銷貨$295,000。該公司於火災後盤點存貨,發現有一批完好無損之存貨,其售價為$30,000。\n假設該公司之毛利率為 30%,試問此次火災損失造成該公司存貨損失之金額為何?", "options": {"A": "$98,500", "B": "$77,500", "C": "$68,500", "D": "$21,000"}, "answer": "B", "note": ""}, {"id": "accounting-112-15", "year": "112", "subject": "accounting", "subjectName": "會計學概要", "number": 15, "question": "甲公司於 X3 年初因併購乙公司而認列商譽$1,000,000,X3 年底評估相關現金產生單位時,\n認列商譽減損損失$50,000。X4 年底再次評估該現金產生單位時發現其可回收價值高於帳面\n金額$20,000。X4 年底有關商譽之會計處理何者正確?", "options": {"A": "甲公司可增加$20,000 至商譽之帳面金額", "B": "甲公司可增加$30,000 至商譽之帳面金額", "C": "甲公司可就分攤至商譽部分認列減損損失回升利益", "D": "已認列之商譽減損損失不能迴轉"}, "answer": "D", "note": ""}, {"id": "accounting-112-16", "year": "112", "subject": "accounting", "subjectName": "會計學概要", "number": 16, "question": "某公司 X3 年淨利為$500,000,其中薪資費用$30,000、利息費用$20,000、所得稅費用$30,000,\n試計算該公司之利息保障倍數為多少?", "options": {"A": "25", "B": "26.5", "C": "27.5", "D": "29"}, "answer": "C", "note": ""}, {"id": "accounting-112-17", "year": "112", "subject": "accounting", "subjectName": "會計學概要", "number": 17, "question": "某公司 X3 年綜合損益為$1,000,000,其他綜合損益$200,000。X3 年初流通在外普通股數為\n100,000 股,4 月 1 日發行新股 40,000 股,10 月 1 日購回庫藏股 20,000 股。試計算該公司 X3\n年每股盈餘為多少?", "options": {"A": "$8", "B": "$6.67", "C": "$6.4", "D": "$1.6"}, "answer": "C", "note": ""}, {"id": "accounting-112-18", "year": "112", "subject": "accounting", "subjectName": "會計學概要", "number": 18, "question": "某公司生產主要產品一批,主要成本為$90,000,加工成本為$70,000,直接材料成本與製造費\n用之比例為 5:3,試問該批產品之製造成本為何?", "options": {"A": "$40,000", "B": "$50,000", "C": "$110,000", "D": "$120,000"}, "answer": "D", "note": ""}, {"id": "accounting-112-19", "year": "112", "subject": "accounting", "subjectName": "會計學概要", "number": 19, "question": "某公司銷售 A 產品,每單位變動成本$60,固定成本$50,000,所得稅率 20%。若想獲得稅後\n淨利$60,000 需要銷售 3,125 單位。試求 A 產品每單位售價為何?", "options": {"A": "$40", "B": "$79.84", "C": "$95.2", "D": "$100"}, "answer": "D", "note": ""}, {"id": "accounting-112-20", "year": "112", "subject": "accounting", "subjectName": "會計學概要", "number": 20, "question": "某公司 X3 年營業活動淨現金流入為$110,000,當年度支付所得稅$6,000、應收票據減少數\n$46,000、應收帳款增加數$33,000、存貨增加數$10,000、預付費用減少數$12,000、應付帳款\n增加數$30,000、應付利息增加數$14,000、折舊及攤銷費用$18,000、處分不動產、廠房及設備\n利益$3,000。試求當年度稅前淨利為何?", "options": {"A": "$27,000", "B": "$36,000", "C": "$42,000", "D": "$45,000"}, "answer": "C", "note": ""}, {"id": "bookkeeping-112-1", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 1, "question": "記帳士受委任後,非有正當事由,不得終止其契約;如須終止契約,記帳士應於幾日前通知委任人?", "options": {"A": "7 日", "B": "10 日", "C": "15 日", "D": "30 日"}, "answer": "C", "note": ""}, {"id": "bookkeeping-112-2", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 2, "question": "不得充任記帳士之情形,下列何者不在範圍之內?", "options": {"A": "曾因業務上有詐欺、背信、侵占、偽造文書等犯罪行為,受有期徒刑一年以上刑之裁判確定", "B": "受破產之宣告尚未復權", "C": "曾服公職", "D": "受監護或輔助宣告尚未撤銷"}, "answer": "C", "note": ""}, {"id": "bookkeeping-112-3", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 3, "question": "有關記帳士在其他直轄市、縣市執行業務時,下列規定何者正確?", "options": {"A": "免向主管機關登記,免設分事務所", "B": "免向主管機關登記,應設分事務所", "C": "應向主管機關登記,應設分事務所", "D": "應向主管機關登記,免設分事務所"}, "answer": "D", "note": ""}, {"id": "bookkeeping-112-4", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 4, "question": "記帳士若違反記帳士暨記帳及報稅代理人防制洗錢與打擊資恐辦法規定,其相關之裁處及調查由下列\n何機關辦理?", "options": {"A": "法務部調查局", "B": "財政部委任各地區國稅局", "C": "經濟部商業司", "D": "金融監督管理委員會"}, "answer": "B", "note": ""}, {"id": "bookkeeping-112-5", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 5, "question": "張無忌於 107 年以前任職財政部中區國稅局彰化分局,109 年調任財政部北區國稅局新竹分局,110\n年 1 月 4 日轉任桃園市政府地方稅務局,在各稅捐機關任職期間皆擔任稅務職系稅務員,於 111 年 1\n月 4 日轉任財政部臺北國稅局主計室隨後於 112 年 1 月 1 日從臺北國稅局主計室會計股辦理退休離\n職,張員於 110 年考取記帳士並取得記帳士證書並準備於 112 年 2 月 1 日起執業,請問張員於 112 年\n2 月當下不得於何縣、市區域內執行記帳士職務?", "options": {"A": "桃園市", "B": "桃園市、臺北市", "C": "新竹市、桃園市、臺北市", "D": "彰化縣、新竹市、桃園市、臺北市"}, "answer": "A", "note": ""}, {"id": "bookkeeping-112-6", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 6, "question": "李記帳士係臺北市記帳士公會會員,依據記帳士法之規定,記帳士不得在登錄區域內,執行下列那項\n業務?", "options": {"A": "受委任辦理營業、變更、註銷、停業、復業及其他登記事項", "B": "受委任辦理各項稅捐稽徵案件之申報及申請事項", "C": "受委任辦理商業會計事務", "D": "受委任提起訴願、行政訴訟"}, "answer": "D", "note": ""}, {"id": "bookkeeping-112-7", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 7, "question": "記帳士某甲,因逃漏稅捐,經稅捐稽徵機關處分有案,記帳士懲戒委員會決議書於 112 年 10 月 18 日\n送達,若某甲不服,應於何時前向記帳士懲戒覆審委員會請求覆審?", "options": {"A": "112 年 11 月 6 日", "B": "112 年 11 月 7 日", "C": "112 年 11 月 16 日", "D": "112 年 11 月 17 日"}, "answer": "B", "note": ""}, {"id": "bookkeeping-112-8", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 8, "question": "張三 111 年 11 月記帳士考試及格,準備在高雄市左營區設立事務所執業,請問與其有關之相關機關,\n下列何者正確?1登錄執業機關為財政部高雄國稅局 2記帳士證書由考選部核發 3記帳士主管\n機關為高雄市政府 4稅務部分業務事件主管機關為財政部 5商業會計業務事件主管機關為經濟\n部商業司 6記帳士懲戒委員會處理懲戒事件,認為有犯罪嫌疑者,由記帳士懲戒委員會偵辦 7商\n業登記業務事件主管機關為財政部", "options": {"A": "1234567", "B": "12345", "C": "1245", "D": "145"}, "answer": "D", "note": ""}, {"id": "bookkeeping-112-9", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 9, "question": "記帳士、記帳及報稅代理人有下列情形之一者,依記帳士暨記帳及報稅代理人防制洗錢與打擊資恐辦\n法第 10 條第 1 項規定不須向法務部調查局申報?", "options": {"A": "酬金高於新臺幣四十萬元,有正當理由以現金、外幣現金、旅行支票、外幣匯票或其他無記名金融\n工具支付", "B": "酬金高於新臺幣五十萬元,客戶無正當理由,自行或要求多次或連續以低於新臺幣五十萬元之現金\n支付", "C": "明知無該客戶存在或有事實足認該客戶身分遭冒用", "D": "客戶為自然人,無正當理由拒絕與記帳士、記帳及報稅代理人見面或直接聯繫"}, "answer": "A", "note": ""}, {"id": "bookkeeping-112-10", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 10, "question": "為維持記帳士專業能力及服務之效果與品質,張記帳士投資自己至某大學會計研究所進修,並依照法令\n及財政部發布之其他攸關資料提供記帳士服務,此行為符合記帳士職業倫理道德規範中何項準則?", "options": {"A": "誠正準則之適任", "B": "基本原則之適任", "C": "行為準則之適任", "D": "務實準則之適任"}, "answer": "C", "note": ""}, {"id": "bookkeeping-112-11", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 11, "question": "下列有關記帳士職業倫理道德規範之敘述何者錯誤?", "options": {"A": "記帳士不得聘僱他記帳士事務所之現職人員", "B": "記帳士設立分事務所,均應由記帳士親自主持,不得委由助理員或其他人變相主持", "C": "凡違背記帳士職業倫理道德規範者,由所屬地方記帳士公會處理之", "D": "記帳士事務所名稱不得與已登錄之事務所名稱相同"}, "answer": "A", "note": ""}, {"id": "bookkeeping-112-12", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 12, "question": "下列有關記帳士之行為準則中,何者符合「適任」?1應遵守法律並依照法律及記帳士專業之要求辦\n理委任工作 2避免接受任何可能損害或被視為損害其專業判斷之特殊利益 3應持續進修以維持\n記帳士專業能力及服務之效果與品質 4應依照法令及財政部發布之其他攸關資料提供記帳士服務", "options": {"A": "12", "B": "34", "C": "13", "D": "24"}, "answer": "B", "note": ""}, {"id": "bookkeeping-112-13", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 13, "question": "記帳士應遵守之原則,不包括下列何者?", "options": {"A": "記帳士於蒐集、評估及溝通有關受任人委任工作之資訊時,應表現最高度之專業務實性", "B": "記帳士對所有攸關情況之評估應力求平衡,在作成判斷時不受個人利益或他人之不當影響", "C": "記帳士於提供委任人服務時,應能運用所需之知識、技能及經驗", "D": "記帳士應尊重其所獲得資訊之價值及所有權,且不得揭露此等資訊"}, "answer": "D", "note": ""}, {"id": "bookkeeping-112-14", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 14, "question": "書面之行政處分,符合一定情形者,得不記明理由,下列何者不包括在內?", "options": {"A": "一般處分經公告或刊登政府公報或新聞紙", "B": "有關專門知識、技能或資格所為之考試、檢定或鑑定等程序", "C": "處分相對人或利害關係人無待處分機關之說明已知悉或可知悉作成處分之理由", "D": "限制人民之權益"}, "answer": "D", "note": ""}, {"id": "bookkeeping-112-15", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 15, "question": "公法上之請求權,於請求權人假設為稅捐處,無法律另有規定,於 111 年 8 月 1 日已將 111 年房屋稅單\n合法送達欠稅人,依行政程序法第 131 條規定,該筆欠稅若至何時不移送強制執行其請求權即消滅?", "options": {"A": "113 年 8 月 1 日消滅", "B": "114 年 8 月 1 日消滅", "C": "115 年 8 月 1 日消滅", "D": "116 年 8 月 1 日消滅"}, "answer": "D", "note": ""}, {"id": "bookkeeping-112-16", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 16, "question": "行政機關作成限制之行政處分前,應給予該處分相對人陳述意見之機會。下列那些情形,行政機關得\n不給予陳述意見之機會?1作成同種類之處分不多 2行政處分所根據之事實,客觀上明白足以確認\n者 3限制自由或權利之內容及程度,顯屬重大 4為避免處分相對人隱匿、移轉財產或潛逃出境,\n依法律所為保全或限制出境之處分", "options": {"A": "12", "B": "34", "C": "24", "D": "23"}, "answer": "C", "note": ""}, {"id": "bookkeeping-112-17", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 17, "question": "依行政程序法規定,下列有關行政處分效力之敘述,何者錯誤?", "options": {"A": "無效之行政處分自始不生效力", "B": "行政處分之無效,行政機關不得依職權確認之", "C": "行政處分未經撤銷、廢止,或未因其他事由而失效者,其效力繼續存在", "D": "書面之行政處分自送達相對人及已知之利害關係人起;書面以外之行政處分自以其他適當方法通知\n或使其知悉時起,依送達、通知或使知悉之內容對其發生效力"}, "answer": "B", "note": ""}, {"id": "bookkeeping-112-18", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 18, "question": "下列有關行政處分以書面告知之救濟期間有錯誤之補救措施,何者正確?", "options": {"A": "應由該機關以通知更正之,並自通知送達之翌日起算法定期間", "B": "應由該機關以通知更正之,並自通知送達之日起算法定期間", "C": "應由該機關之上級機關以通知更正之,並自通知送達之翌日起算法定期間", "D": "應由該機關之上級機關以通知更正之,並自通知送達之日起算法定期間"}, "answer": "A", "note": ""}, {"id": "bookkeeping-112-19", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 19, "question": "會計憑證如因主管該項人員之故意或過失,致該項會計憑證毀損、缺少或滅失而致商業遭受損害時,\n該損害由誰賠償?", "options": {"A": "企業負責人", "B": "該主管人員", "C": "主辦會計", "D": "不用賠償"}, "answer": "B", "note": ""}, {"id": "bookkeeping-112-20", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 20, "question": "為增加公司(法人)之透明度,強化洗錢防制作為,依公司法第 22 條之 1 明定公司應每年定期以電\n子方式申報至中央主管機關建置或指定之資訊平臺,下列敘述何者錯誤?", "options": {"A": "申報對象與內容:董事、監察人、經理人及持有已發行股份總數或資本總額超過百分之十之股東之\n姓名或名稱、國籍、出生年月日或設立登記之年月日、身分證明文件號碼、持股數或出資額及其他\n中央主管機關指定之事項", "B": "其申報資料如有變動者,並應於變動後十日內為之。但符合一定條件之公司,不適用之", "C": "未依規定申報或申報之資料不實,經中央主管機關限期通知改正。屆期未改正者,處代表公司之董\n事新臺幣五萬元以上五十萬元以下罰鍰", "D": "經再限期通知改正仍未改正者,按次處新臺幣五十萬元以上五百萬元以下罰鍰,至改正為止。其情\n節重大者,得廢止公司登記"}, "answer": "B", "note": ""}, {"id": "bookkeeping-112-21", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 21, "question": "A 公司實收資本為 2,000 萬元,A 公司全部總資產為 2,200 萬元、總負債為 200 萬元,依公司法第 15\n條規定公司之業務及貸款限制,下列關於 A 公司貸與行為之敘述,何者正確?", "options": {"A": "A 公司得貸與常有業務往來之 B 有限公司共 600 萬元", "B": "A 公司得貸與無業務往來但有短期融資必要之 C 有限公司共 900 萬元", "C": "A 公司得貸與無業務往來但有短期融資必要之 D 有限公司共 1,000 萬元", "D": "A 公司得將資金貸與該公司 E 股東 200 萬元"}, "answer": "A", "note": ""}, {"id": "bookkeeping-112-22", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 22, "question": "某手搖飲料店以獨資商業設立於臺北市,隨著疫後復甦欲在中壢展店,請問該商號應該向下列那個主\n管機關申請登記?", "options": {"A": "臺北市政府", "B": "桃園市政府", "C": "財政部北區國稅局中壢稽徵所", "D": "經濟部商業司"}, "answer": "B", "note": ""}, {"id": "bookkeeping-112-23", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 23, "question": "公司下列那些人員之資料不用申報至中央主管機關建置或指定之資訊平臺?", "options": {"A": "董事", "B": "監察人", "C": "財務主管", "D": "經理人"}, "answer": "C", "note": ""}, {"id": "bookkeeping-112-24", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 24, "question": "下列所稱公司負責人,何者正確?1在無限公司為執行業務之股東 2在兩合公司為董事 3在有限\n公司為代表公司之股東 4在股份有限公司為董事", "options": {"A": "234", "B": "134", "C": "23", "D": "14"}, "answer": "D", "note": ""}, {"id": "bookkeeping-112-25", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 25, "question": "股份有限公司之經營,有顯著困難或重大損害時,符合下列那個條件之股東得向法院提出聲請解散?", "options": {"A": "持有已發行股份總數 10%以上股份之股東,且繼續持有期間達 6 個月以上", "B": "持有已發行股份總數 20%以上股份之股東", "C": "持有已發行股份總數 5%以上股份之股東,且繼續持有期間達 1 年以上", "D": "持有已發行股份總數 10%以上股份之股東"}, "answer": "A", "note": ""}, {"id": "bookkeeping-112-26", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 26, "question": "在帳務處理過程中,記帳錯誤如更正後影響總數者,依商業會計處理準則之規定,應如何處理?", "options": {"A": "在原錯誤上劃紅線二道", "B": "另開傳票更正", "C": "由更正人於更正處簽名或蓋章", "D": "將更正之數字或文字書寫於上"}, "answer": "B", "note": ""}, {"id": "bookkeeping-112-27", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 27, "question": "下列何者之會計處理會影響保留盈餘之數額?", "options": {"A": "以法定盈餘公積彌補虧損", "B": "提撥償債基金準備", "C": "現金增資溢價發行股票", "D": "調整前期損益"}, "answer": "D", "note": ""}, {"id": "bookkeeping-112-28", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 28, "question": "下列有關財務報表之敘述,何者錯誤?", "options": {"A": "財務報表包括資產負債表、綜合損益表、現金流量表及權益變動表", "B": "各款報表之附註,並非財務報表之一部分", "C": "債權人對於特定資產之權利應於財務報表附註揭露", "D": "年度財務報表之格式,除新成立之商業外,應採二年度對照方式"}, "answer": "B", "note": ""}, {"id": "bookkeeping-112-29", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 29, "question": "商業負責人應於會計年度終了後多久內,將商業之決算報表提請商業出資人、合夥人或股東承認?", "options": {"A": "一個月", "B": "二個月", "C": "三個月", "D": "六個月"}, "answer": "D", "note": ""}, {"id": "bookkeeping-112-30", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 30, "question": "記帳憑證保管期限屆滿,經下列何者核准,得予以銷毀?", "options": {"A": "商業負責人", "B": "主管機關", "C": "經理人", "D": "主辦會計"}, "answer": "A", "note": ""}, {"id": "bookkeeping-112-31", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 31, "question": "下列何者不是商業會計法所稱之主管機關?", "options": {"A": "經濟部", "B": "財政部", "C": "臺北市政府", "D": "新竹縣政府"}, "answer": "B", "note": ""}, {"id": "bookkeeping-112-32", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 32, "question": "下列有關應收帳款及應收票據之敘述,何者錯誤?", "options": {"A": "金額重大之應收關係人帳款及應收關係人票據,應單獨列示", "B": "分期付款銷貨之未實現利息收入,應列為應收帳款之減項", "C": "應收帳款以攤銷後成本衡量為原則;應收票據以票面金額衡量為原則", "D": "已提供擔保應收帳款及應收票據,應予揭露"}, "answer": "C", "note": ""}, {"id": "bookkeeping-112-33", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 33, "question": "下列發生於資產負債表日至財務報表通過日間之下列期後事項,何者不用揭露?", "options": {"A": "資本結構之變動", "B": "重大災害損失", "C": "重要訴訟案件終結", "D": "政府法令變更而不具重大影響者"}, "answer": "D", "note": ""}, {"id": "bookkeeping-112-34", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 34, "question": "下列有關損益計算之敘述,何者錯誤?", "options": {"A": "有支付員工退休金之義務者,應於員工在職期間依法提列,並認列為當期費用", "B": "分期付款銷貨收入得視其性質按毛利百分比攤算入帳", "C": "對業主分配之盈餘,不得作為費用或損失", "D": "特別股股利應認列為費用"}, "answer": "D", "note": ""}, {"id": "bookkeeping-112-35", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 35, "question": "主辦及經辦會計人員,有下列那種情形,應處新臺幣 3 萬元以上 15 萬元以下罰鍰?", "options": {"A": "不編製報表", "B": "毀損會計帳簿頁數", "C": "偽造或變造會計憑證", "D": "未設置會計帳簿"}, "answer": "A", "note": ""}, {"id": "bookkeeping-112-36", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 36, "question": "下列會計項目何者不屬於其他權益?", "options": {"A": "避險工具損益", "B": "國外營運機構財務報表換算之兌換差額", "C": "透過損益按公允價值衡量之金融資產未實現損益", "D": "未實現重估增值"}, "answer": "C", "note": ""}, {"id": "bookkeeping-112-37", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 37, "question": "下列敘述何者錯誤?", "options": {"A": "商業會計事務之處理,應置會計人員辦理", "B": "會計人員離職或變更職務時,應於七日內辦理交代", "C": "商業會計事務之處理,得委由會計師處理", "D": "股份有限公司主辦會計人員之任免,應由董事會以董事過半數之出席,及出席董事過半數之同意"}, "answer": "B", "note": ""}, {"id": "bookkeeping-112-38", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 38, "question": "公司因下列何種原因解散者,應進行清算?", "options": {"A": "合併", "B": "分割", "C": "破產", "D": "股東全體同意解散"}, "answer": "D", "note": ""}, {"id": "bookkeeping-112-39", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 39, "question": "張先生欲在臺北市設立公司,需向那一主管機關登記才能成立?", "options": {"A": "經濟部", "B": "財政部", "C": "內政部", "D": "臺北市政府"}, "answer": "AD", "note": "答A或D或AD者均給分"}, {"id": "bookkeeping-112-40", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 40, "question": "依商業會計法規定,商業應辦理之決算,下列敘述何者正確?", "options": {"A": "商業每屆決算應編製之報表,僅為財務報表及其註釋", "B": "所有商業之決算最遲應於次年 4 月 15 日辦理完竣", "C": "有分支機構之商業,於會計年度終了時,應將其本、分支機構之帳目合併辦理決算", "D": "決算報表可由代表商業之負責人授權經理人及主辦會計人員簽名或蓋章"}, "answer": "C", "note": ""}, {"id": "bookkeeping-112-41", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 41, "question": "會計憑證,應按日或按月裝訂成冊,以利管理,下列何者錯誤?", "options": {"A": "會計憑證為權責存在之憑證如未結債權、債務憑證,得另行保管", "B": "應予永久保存之憑證如商業設立登記事項所產生之資本簽證報告不得另行保管", "C": "另行裝訂較便之憑證,如商業與外界簽訂之合(契)約書,得另行保管", "D": "會計憑證有原始憑證者,應附於記帳憑證之後"}, "answer": "B", "note": ""}, {"id": "bookkeeping-112-42", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 42, "question": "桃園公司 111 會計年度終了日為 111 年 12 月 31 日,決算程序於 112 年 5 月 1 日辦理終了日,試問桃\n園公司 111 年度各項會計帳簿及財務報表,除應永久保存或有關未結會計事項者外,應至少保存至何\n時才能辦理銷毀程序?", "options": {"A": "116 年 12 月 31 日", "B": "117 年 5 月 1 日", "C": "121 年 12 月 31 日", "D": "122 年 5 月 1 日"}, "answer": "D", "note": ""}, {"id": "bookkeeping-112-43", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 43, "question": "自 112 年起,依商業會計處理準則第 16 條規定,長期性之投資不包括下列何者會計項目?", "options": {"A": "透過其他綜合損益按公允價值衡量之金融資產-非流動", "B": "按攤銷後成本衡量之金融資產-非流動", "C": "避險之金融資產-非流動", "D": "持有至到期日金融資產-非流動"}, "answer": "D", "note": ""}, {"id": "bookkeeping-112-44", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 44, "question": "李大雄以土地一筆抵繳甲公司之資本成為該公司股東,該筆土地之公告現值為$3,000,000,公允價值\n為$5,500,000,淨變現價值$6,500,000,原始購買價格為$2,500,000,請問甲公司資產負債表上該筆土\n地之價值如何表示?", "options": {"A": "$2,500,000", "B": "$3,000,000", "C": "$5,500,000", "D": "$6,500,000"}, "answer": "C", "note": ""}, {"id": "bookkeeping-112-45", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 45, "question": "甲公司會計人員於申報 111 年度營利事業所得稅時,發現交際費帳上金額$400,000,依營利事業所得\n稅查核準則規定所計算之限額為$250,000,甲公司會計人員應如何處理?", "options": {"A": "編製轉帳傳票調減交際費$150,000,以符合規定", "B": "依商業會計處理準則第 13 條規定,作帳上更正,借記現金,貸記交際費", "C": "不影響帳面記錄,僅作帳外調整後申報", "D": "將超過限額交際費之憑證抽換"}, "answer": "C", "note": ""}, {"id": "bookkeeping-112-46", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 46, "question": "甲公司遭掏空百億元資產下市後,假設該公司相關會計作業處理人員於事前曾表示拒絕或提出更\n正意見有確實證據者,下列何者依商業會計法第 73 條規定,得減輕或免除其刑?1商業負責人\n2查帳會計師 3主辦、經辦會計人員 4以電子方式處理會計資料之有關人員 5記帳士、記\n帳及報稅代理人", "options": {"A": "34", "B": "235", "C": "2345", "D": "12345"}, "answer": "A", "note": ""}, {"id": "bookkeeping-112-47", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 47, "question": "張三記帳士受甲公司委託處理會計事務。因甲公司財務經理李四的要求,張三在明知甲公司全年的真\n實銷貨超過新臺幣 3,000 萬元,所開立之統一發票卻遠低於新臺幣 3,000 萬元,在有銷貨事實卻不開\n發票亦不入帳之情況下,其目的在使甲公司得適用擴大書審的制度報稅。依商業會計法規定,試問張\n記帳士的這種行為可能應負何種法律責任?", "options": {"A": "因違法而處 1 年以下有期徒刑、拘役或科或併科新臺幣 15 萬元以下罰金", "B": "因違法而處 5 年以下有期徒刑、拘役或科或併科新臺幣 60 萬元以下罰金", "C": "因違法而處 3 年以下有期徒刑、拘役或科或併科新臺幣 60 萬元以下罰金", "D": "因違法,處新臺幣 60 萬元以下罰鍰"}, "answer": "B", "note": ""}, {"id": "bookkeeping-112-48", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 48, "question": "甲公司係乙公司的股東,因業務需要甲公司將成本$1,200,000、累計折舊$500,000、公允價值$600,000\n之貨車運輸設備贈與乙公司,則乙公司受贈該貨車時應如何記帳?", "options": {"A": "按貨車之帳面價值$700,000 入帳,即借:貨車設備$700,000;貸:捐贈收入$700,000", "B": "按貨車之帳面價值$700,000 入帳,即借:貨車設備$700,000;貸:資本公積-捐贈$700,000", "C": "按貨車之公允價值$600,000 入帳,即借:貨車設備$600,000;貸:資本公積-捐贈$600,000", "D": "按貨車之公允價值$600,000 入帳,即借:貨車設備$600,000;貸:捐贈收入$600,000"}, "answer": "C", "note": ""}, {"id": "bookkeeping-112-49", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 49, "question": "甲公司,有位於臺北市、桃園市、新竹市及苗栗縣等四筆土地,其中位於臺北市土地是屬投資之性質,\n桃園市土地是目前總公司之所在地,新竹市土地準備 3 年後為總公司預訂地,不打算作其他用途使\n用,苗栗縣土地為準備供銷售之用。依商業會計法第 51 條規定,那一塊土地得按公告現值辦理資產\n重估?", "options": {"A": "臺北市、桃園市、新竹市及苗栗縣四筆土地都可以", "B": "桃園市土地", "C": "臺北市及苗栗縣二筆非供公司自用的土地", "D": "桃園市及新竹市二筆供總公司自用的土地"}, "answer": "B", "note": ""}, {"id": "bookkeeping-112-50", "year": "112", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 50, "question": "甲公司 112 年 5 月有下列各項金流交易事項(單位:新臺幣),何者不符合商業會計法第 9 條之規定?\n1乙公司支付 120 萬元現金,向甲公司購買貨車乙輛 2王五君支付 150 萬元,向甲公司購買小客車\n乙輛 3丙公司支付 98 萬元,向甲公司購買貨車乙輛 4甲公司以支票存款支付臺灣銀行貸款本息\n300 萬元 5甲公司以活期存款取款條從臺灣銀行提款 105 萬元後,給付丁公司貨款", "options": {"A": "12345", "B": "2345", "C": "245", "D": "15"}, "answer": "D", "note": ""}, {"id": "tax-112-1", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 1, "question": "納稅義務人 112 年就稅捐案件申請復查,經復查決定後仍有應納稅款未繳納者,下列何種情形,納稅\n義務人雖已依法提起訴願,惟稅捐稽徵機關仍應依稅捐稽徵法第 39 條第 2 項規定移送強制執行?", "options": {"A": "納稅義務人無財產可供擔保", "B": "納稅義務人繳納之稅款已達復查決定應納稅額之 1/3", "C": "經稅捐稽徵機關核准,納稅義務人已就復查決定應納稅額之 1/3,提供相當擔保", "D": "納稅義務人繳納稅款確有困難者,稅捐稽徵機關已就相當於復查決定應納稅額之財產,通知有關機\n關,不得為移轉或設定他項權利"}, "answer": "A", "note": ""}, {"id": "tax-112-2", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 2, "question": "某國稅局查得我國居住之個人甲及乙分別欠繳稅款 80 萬元、200 萬元,我國公司 A、B 分別欠繳稅款\n220 萬元、300 萬元,均屬確定案件,因納稅義務人均未提供擔保且國稅局已採取稅捐保全措施,依\n稅捐稽徵法第 24 條規定,何者得由財政部函請內政部移民署限制其出境?", "options": {"A": "甲、乙", "B": "A 公司負責人、B 公司負責人", "C": "乙、A 公司負責人、B 公司負責人", "D": "甲、乙、A 公司負責人、B 公司負責人"}, "answer": "C", "note": ""}, {"id": "tax-112-3", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 3, "question": "財政部或經其指定之稅捐稽徵機關依稅捐稽徵法第 34 條第 1 項規定,公告重大欠稅案件或重大逃漏\n稅捐案件之欠稅人或逃漏稅捐人姓名或名稱與內容,下列何種案件,不包括在內?", "options": {"A": "經稅捐稽徵機關核定之案件,納稅義務人未依法申請復查者", "B": "經復查決定案件,納稅義務人未依法提起訴願者", "C": "經訴願決定案件,納稅義務人已依法提起行政訴訟者", "D": "經最高行政法院裁判確定,納稅義務人已依法提起再審者"}, "answer": "C", "note": ""}, {"id": "tax-112-4", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 4, "question": "納稅義務人以詐術或其他不正當方法逃漏稅捐,應依稅捐稽徵法規定處以刑罰者,下列敘述何者錯誤?", "options": {"A": "個人逃漏稅額在 1 千萬元以下者,處 5 年以下有期徒刑,併科 1 千萬元以下罰金", "B": "營利事業逃漏稅額在 1 千萬元以上者,處 1 年以上 7 年以下有期徒刑,併科 1 千萬元以上 1 億元以下\n罰金", "C": "幫助納稅義務人以詐術或其他不正當方法逃漏稅捐者,處 3 年以下有期徒刑,併科 1 百萬元以下罰金;\n幫助犯為會計師者,加重其刑至 1/2", "D": "納稅義務人為公司,且公司負責人與實際負責業務之人不同者,以實際負責業務之人為受處罰對象"}, "answer": "B", "note": ""}, {"id": "tax-112-5", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 5, "question": "有關稅捐稽徵法申請延期或分期繳納稅捐之規定,下列敘述何者正確?", "options": {"A": "納稅義務人因客觀事實發生財務困難,不能於法定期間內繳清稅捐者,得向稅捐稽徵機關申請延期 5 年\n繳納稅捐", "B": "納稅義務人因遭受天災,依稅捐稽徵法第 26 條申請延期繳納稅捐,經稅捐稽徵機關核准者,應自原訂\n繳納期間屆滿之翌日起,至繳納之日止,加計利息一併繳納", "C": "納稅義務人對核准分期繳納之任一期應繳稅捐,未如期繳納者,應就未繳清之餘額稅款一次全部繳清", "D": "納稅義務人經稅捐稽徵機關查獲應補徵鉅額稅捐並裁處罰鍰者,不得申請分期繳納稅捐"}, "answer": "C", "note": ""}, {"id": "tax-112-6", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 6, "question": "下列機關、人員向稅捐稽徵機關索取財稅資訊情形,依稅捐稽徵法第 33 條規定,何者不得提供?", "options": {"A": "監察院因調查需要,查詢特定人士 111 年所得資料", "B": "市議員因質詢需要,查詢該市市長 111 年納稅資料", "C": "國立大學因受託研究需要,索取 111 年度全國綜合所得稅結算申報件數及納稅義務人年齡級距分布\n情形", "D": "繼承人為申報遺產稅需要,查詢被繼承人死亡年度財產資料"}, "answer": "B", "note": ""}, {"id": "tax-112-7", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 7, "question": "下列有關法院執行拍賣或交債權人承受之土地、房屋及貨物之稅捐稽徵規定,何者錯誤?", "options": {"A": "該拍定之土地、房屋應課徵之土地增值稅、地價稅及房屋稅,優先於一切債權及抵押權", "B": "該拍賣貨物應課徵之營業稅,優先於一切債權及抵押權", "C": "法院應於拍定或承受 5 日內,將拍定或承受價額通知當地主管稅捐稽徵機關,由稽徵機關通知納稅\n義務人繳納土地增值稅、地價稅、房屋稅及營業稅", "D": "營利事業拍定之貨物為特種貨物者,所繳納之特種貨物及勞務稅,應列為該貨物之進貨成本或製造\n成本"}, "answer": "C", "note": ""}, {"id": "tax-112-8", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 8, "question": "甲公司經 A 稅捐稽徵機關核定 111 年度營利事業所得稅結算申報有應退稅款,惟該公司已積欠稅款如\n下:1A 稅捐稽徵機關核定 110 年度營利事業所得稅之罰鍰 2B 稅捐稽徵機關核定 109 年度營利事業\n所得稅之應補繳稅款 3A 稅捐稽徵機關核定 110 年營業稅應補繳稅款 4A 稅捐稽徵機關核定 109\n年營業稅之罰鍰。依稅捐稽徵法及其施行細則有關納稅義務人退稅之抵欠順序規定,下列何者正確?", "options": {"A": "1234", "B": "1324", "C": "1342", "D": "2134"}, "answer": "C", "note": ""}, {"id": "tax-112-9", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 9, "question": "依稅捐稽徵法第 49 條之 1 有關檢舉逃漏稅捐核發獎金規定,下列那些檢舉人不得領取獎金?1依公\n司指示逃漏稅捐之員工 2稅務人員 3因執行職務發現而為舉發之公務員 4經分析網路公開資\n訊而為舉發之民眾", "options": {"A": "僅12", "B": "僅23", "C": "123", "D": "1234"}, "answer": "C", "note": ""}, {"id": "tax-112-10", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 10, "question": "A 公司於 108 年 7 月 1 日開業,會計年度為曆年制,108 至 110 年度營利事業所得稅結算申報之核定\n純益率分別為 5%、11%及 8%,108 至 110 年度查帳核定當地同業之平均純益率分別為 8%、10%及\n10%,該公司 111 年 6 月因遭受水災致 111 年全部憑證均已滅失,稽徵機關依營利事業所得稅查核準\n則第 11 條第 2 項規定核定 A 公司該期間之所得額,適用之純益率為何?", "options": {"A": "8%", "B": "9%", "C": "9.3%", "D": "10%"}, "answer": "B", "note": ""}, {"id": "tax-112-11", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 11, "question": "依營利事業所得稅查核準則規定,應歸屬於營業成本之費用或損失,如誤列報於營業費用,並經稽徵\n機關審定轉正者,應將調整部分分攤在下列那一個會計項目?", "options": {"A": "期初存貨", "B": "期末存貨", "C": "銷貨成本", "D": "前期損益調整"}, "answer": "B", "note": ""}, {"id": "tax-112-12", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 12, "question": "依營利事業所得稅查核準則規定,營利事業對政黨、政治團體及擬參選人捐贈者,其可減除金額不得\n超過所得額多少比率,且總額不得超過新臺幣多少元?", "options": {"A": "1%;5 萬元", "B": "1%;10 萬元", "C": "5%;10 萬元", "D": "10%;50 萬元"}, "answer": "D", "note": ""}, {"id": "tax-112-13", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 13, "question": "甲公司 112 年購置 A 固定資產 20 萬元(耐用年限 1 年)、修繕 B 廠房地板花費 7 萬元(耐用年限 5\n年),依營利事業所得稅查核準則規定,當年度得認列之最高費用金額為何?", "options": {"A": "0 元", "B": "7 萬元", "C": "20 萬元", "D": "27 萬元"}, "answer": "D", "note": ""}, {"id": "tax-112-14", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 14, "question": "A 公司會計年度採曆年制,其出售甲房地之交易過程如下:1108 年 12 月 1 日簽訂不動產買賣契\n約 2109 年 10 月 20 日收取尾款 3110 年 12 月 21 日交付該房地 4111 年 1 月 2 日辦竣所有\n權移轉登記。依營利事業所得稅查核準則規定,其所得應歸屬年度為何?", "options": {"A": "108 年度", "B": "109 年度", "C": "110 年度", "D": "111 年度"}, "answer": "C", "note": ""}, {"id": "tax-112-15", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 15, "question": "A 公司 111 年 1 月向我國居住者個人甲承租房屋供倉庫之用,每月給付租金 20 萬元,押金 40 萬元,\n租期 2 年,嗣甲經稽徵機關依所得稅法規定核定該屋 111 年度當地一般標準租金 300 萬元,下列敘述\n何者錯誤?", "options": {"A": "A 公司每月給付甲之租金淨額為租金減除扣繳稅款後之餘額 18 萬元", "B": "A 公司 111 年度得列報租金支出 300 萬元", "C": "甲收取之押金應按郵政儲金一年期定期儲金固定利率計算租賃收入", "D": "甲經稽徵機關調整之標準租金部分,得減除必要損耗及費用"}, "answer": "B", "note": ""}, {"id": "tax-112-16", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 16, "question": "A 公司適用勞動基準法並依勞工退休金條例提繳勞工退休金,該公司 111 年給付員工薪資總額 180 萬\n元,提繳退休金 10.8 萬元,2 名員工自願從各自薪資 60 萬元中提繳退休金 2 萬元,下列敘述何者錯誤?", "options": {"A": "A 公司 111 年度可認列退休金費用為 10.8 萬元", "B": "2 名員工自願提繳 2 萬元退休金,不計入薪資收入課稅", "C": "A 公司申報該 2 名自願提繳員工 111 年度薪資所得扣繳憑單時,不包括其自願提繳退休金 2 萬元", "D": "2 名員工退休時領取原自願提繳之退休金,免併入計算退職所得"}, "answer": "D", "note": ""}, {"id": "tax-112-17", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 17, "question": "下列有關執行業務者課稅規定,何者錯誤?", "options": {"A": "營利事業給付會計師辦理所得稅申報簽證所給付之公費收入,應辦理扣繳申報", "B": "律師代理訴訟案件取得之勞務報酬,非屬營業稅課稅範圍", "C": "藥師親自主持之藥局經營藥品調劑及兼營銷售藥品業務之收入,應計算執行業務所得課徵綜合所得稅", "D": "中醫診所僅提供醫療勞務者,免辦理營業稅稅籍登記"}, "answer": "C", "note": ""}, {"id": "tax-112-18", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 18, "question": "A 公司給付員工薪資所得,扣繳義務人已依規定扣繳稅款,惟未依規定期限按實填報扣繳憑單,依所\n得稅法及稅捐稽徵法規定,何者錯誤?", "options": {"A": "經稽徵機關查獲者,應依所得稅法規定裁處罰鍰", "B": "扣繳義務人已自動按實填報扣繳憑單,且屬未經檢舉、未經稅捐稽徵機關或財政部指定之調查人員\n進行調查之案件,得依稅捐稽徵法規定,免除行為罰", "C": "扣繳義務人逾規定期限繳納所扣稅款者,應依稅捐稽徵法規定加徵滯納金", "D": "經稽徵機關查獲扣繳義務人侵占已扣繳稅款者,應依稅捐稽徵法規定,處以刑罰"}, "answer": "B", "note": ""}, {"id": "tax-112-19", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 19, "question": "我國營利事業持有中華民國境外 A 公司、B 公司及 C 公司(均為 100%持有股份),該 3 家公司所在國家\n之營利事業所得稅率分別為 12%、15%、18%,依所得稅法第 43 條之 3 規定,何者位於低稅負國家?", "options": {"A": "A", "B": "A 及 B", "C": "A、B、C 均是", "D": "A、B、C 均非"}, "answer": "A", "note": ""}, {"id": "tax-112-20", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 20, "question": "下列有關國外影片事業在中華民國境內出租影片之所得課稅規定,何者正確?", "options": {"A": "國外影片事業在中華民國境內無分支機構,經由營業代理人出租影片之收入,得向財政部申請核准\n以收入之 1/2 為在中華民國境內之營利事業所得額", "B": "國外影片事業出租影片之所得,無論該事業在中華民國境內有無分支機構,均屬應扣繳之所得", "C": "國外影片事業在中華民國境內設有分支機構者,得按片租收入 45%計算出租影片之成本", "D": "在中華民國境內無分支機構之國外影片事業,其出租影片之所得扣繳申報,由營業代理人之負責人\n為之"}, "answer": "C", "note": ""}, {"id": "tax-112-21", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 21, "question": "下列有關信託課稅規定,何者錯誤?", "options": {"A": "委託人為營利事業之他益信託契約,受益人享有信託利益之權利價值應於信託成立年度依規定課徵所\n得稅", "B": "信託契約之受益人不特定或尚未存在者,信託財產發生之收入,委託人應於所得發生年度計算所得申\n報納稅", "C": "因遺囑成立之信託,於遺囑人死亡時,其信託財產應依法課徵遺產稅", "D": "受託人因公益信託而標售或義賣之貨物與舉辦之義演收入,全部供作該公益事業之用者,免徵營業稅"}, "answer": "B", "note": ""}, {"id": "tax-112-22", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 22, "question": "我國國民甲 110 年 1 月 1 日以其境內財產成立以其子女乙為受益人之信託契約,乙取得美國國籍\n且長期居住國外,信託財產運用收入包括:1111 年 6 月 30 日銀行給付存款利息 100 萬元,已扣\n繳稅款 10 萬元 2112 年 6 月 30 日出售適用房地合一稅制房屋、土地,獲利 200 萬元,受託人\n於 113 年將信託利益給付予乙,依所得稅法有關信託所得課稅規定,下列敘述何者正確?", "options": {"A": "乙應將享有信託利益之權利價值,併入 110 年度之所得額,自行辦理申報納稅", "B": "受託人應於給付乙利益時,以信託財產運用之收入計算所得,向稽徵機關列單申報 113 年度所得憑單", "C": "乙取得信託利益屬房地合一稅制之交易所得,應按稅率 35%課徵所得稅", "D": "乙取得之信託利益應以受託人為納稅義務人辦理申報納稅"}, "answer": "C", "note": ""}, {"id": "tax-112-23", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 23, "question": "美國 A 公司在我國境內無固定營業場所及營業代理人,其與我國 B 公司簽訂技術合約,A 公司指派\n居住於美國之員工甲於 112 年 3 月 1 日出差至我國為 B 公司提供技術服務,甲於出差期間取得 A 公\n司給付之薪資 200 萬元,B 公司並給付 A 公司技術服務報酬 300 萬元,甲於同年 4 月 30 日返回美\n國,下列敘述何者正確?", "options": {"A": "甲應在離境前就取得 A 公司之薪資向國稅局辦理申報納稅", "B": "B 公司應就給付 A 公司之技術服務報酬 300 萬元辦理扣繳申報", "C": "A 公司應就取得之技術服務報酬 300 萬元,委託我國境內營利事業向國稅局辦理申報納稅", "D": "B 公司應就甲取得之薪資 200 萬元辦理扣繳申報"}, "answer": "B", "note": ""}, {"id": "tax-112-24", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 24, "question": "我國居住者個人甲 112 年取得收入如下:1薪資收入 200 萬元 2統一發票中獎獎金 1 千萬元 3借\n錢給朋友乙收取利息 5 萬元 4檢舉賄選取得法務部獎金 10 萬元 5A 銀行給付存款利息 12 萬元\n6出售適用房地合一稅制之房屋、土地之利得 250 萬元 7取得美國債券利息 20 萬元。依所得稅法\n規定,112 年度綜合所得總額及儲蓄投資特別扣除額金額各為何?", "options": {"A": "196.3 萬元、17 萬元", "B": "227 萬元、17 萬元", "C": "196.3 萬元、12 萬元", "D": "226.3 萬元、12 萬元"}, "answer": "C", "note": ""}, {"id": "tax-112-25", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 25, "question": "A 公司 111 年交易情形如下:1以 1 萬元向農民購入 10 公斤玉米 2給付會計師 110 年度所得稅結\n算申報之簽證費 10 萬元 3將自產轎車 1 輛(成本 80 萬元)提供員工尾牙抽獎 4給付 B 公司權\n利金 120 萬元並取得統一發票。依所得稅法相關法規,何者屬應扣繳之所得?", "options": {"A": "1234", "B": "123", "C": "14", "D": "23"}, "answer": "D", "note": ""}, {"id": "tax-112-26", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 26, "question": "A 公司為貿易業,111 年聘僱甲員工,每月薪資 6 萬元(內含甲自願提繳勞工退休金 3,600 元),共 12\n個月,每月另給付伙食費 5,000 元,年底給付 1 個月年終獎金,並以甲為受益人為其投保團體人壽保\n險,每年負擔保險費 3,000 元,甲當年應公司要求出差 2 次,共支領差旅費 4 萬元,A 公司應申報甲\n員工 111 年度薪資所得扣繳憑單之給付總額為何?", "options": {"A": "769,000 元", "B": "771,000 元", "C": "796,800 元", "D": "811,000 元"}, "answer": "ABCD", "note": "一律給分"}, {"id": "tax-112-27", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 27, "question": "依所得稅法規定,下列何種所得免納所得稅?1個人出售上市公司股票所得 2因繼承而取得之\n財產 3國立大學校長所領主管特支費 4上市公司幹部所領主管特支費 5個人接受公司贈與\n所取得之財產 6出售未發行股票之股權憑證所獲所得", "options": {"A": "123", "B": "235", "C": "256", "D": "456"}, "answer": "A", "note": ""}, {"id": "tax-112-28", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 28, "question": "依所得稅法及相關法規規定,下列有關扣繳義務人之敘述,何者正確?", "options": {"A": "依我國公司法成立之公司分配股利予非中華民國境內居住之個人股東,扣繳義務人為公司", "B": "我國居住者個人承租房屋居住所給付房東之租金,扣繳義務人為承租之個人", "C": "律師事務所每月給付員工之薪資,扣繳義務人為該事務所", "D": "有限合夥事業分配盈餘予總機構在我國境外之營利事業股東,扣繳義務人為有限合夥事業負責人"}, "answer": "D", "note": ""}, {"id": "tax-112-29", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 29, "question": "總機構在我國境外之營利事業,在我國境內經營下列何種業務,其成本費用分攤計算困難者,可向財\n政部申請按其營業收入15%作為其在我國境內之營利事業所得額?1承包營建工程 2經營國際運\n輸 3出租機器設備 4提供技術服務 5出租影片", "options": {"A": "1234", "B": "134", "C": "234", "D": "345"}, "answer": "B", "note": ""}, {"id": "tax-112-30", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 30, "question": "依所得稅法有關綜合所得稅之免稅額規定,下列何者得列報為受扶養親屬?", "options": {"A": "就讀軍校之已成年子女", "B": "已成年,在補習準備國考的子女", "C": "服役中之已成年子女", "D": "大學畢業被資遣,目前待業中的子女"}, "answer": "A", "note": ""}, {"id": "tax-112-31", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 31, "question": "我國居住者個人甲 112 年所得資料如下:1申報 112 年度綜合所得淨額 450 萬元,一般所得稅額 95.8\n萬元 2直接持有符合受控外國企業制度之中華民國境外關係企業股份 10%,該關係企業當年度盈餘\n換算新臺幣為 800 萬元 3交易在證券交易所上市之股票,利得 50 萬元 4對政府捐贈 800 萬元(實\n物及現金各 400 萬元)全數申報列舉扣除額 5取得美國有價證券利息 10 萬元。依所得基本稅額條\n例相關規定,112 年度基本所得額及基本稅額金額各為何?", "options": {"A": "490 萬元、0 萬元", "B": "850 萬元、36 萬元", "C": "940 萬元、54 萬元", "D": "990 萬元、64 萬元"}, "answer": "B", "note": ""}, {"id": "tax-112-32", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 32, "question": "依所得基本稅額條例規定,在計算營利事業基本所得額時,下列何者須計入?1依國際金融業務條例\n規定之免稅所得 2免稅之土地交易所得 3依所得稅法規定不計入所得額課稅之股利收入 4依\n企業併購法規定之免稅所得 5依所得稅法規定停徵所得稅之證券交易所得", "options": {"A": "12345", "B": "1345", "C": "2345", "D": "145"}, "answer": "D", "note": ""}, {"id": "tax-112-33", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 33, "question": "我國居住者個人甲及乙於 110 年合夥成立 A 商號,由甲負責經營,因每月銷售額未達使用統一發票\n標準而經核定為小規模營業人並採查定課徵營業稅,111 年均達營業稅起徵點,下列有關 A 商號及合\n夥人相關課稅情形,何者正確?", "options": {"A": "甲應於 112 年 5 月辦理 A 商號 111 年度營利事業所得稅結算申報,惟無須計算及繳納稅額", "B": "乙於 112 年 2 月取得 A 商號 111 年度之盈餘,應併入其 112 年度綜合所得總額課稅", "C": "A 商號於 111 年購買營業上使用之貨物或勞務,取得載有營業稅額之憑證,並依規定申報者,稽徵\n機關應按其進項稅額 10%,在查定稅額內扣減", "D": "A 商號 111 年出售適用房地合一稅制之房屋、土地,其交易所得應計入該商號之所得額"}, "answer": "C", "note": ""}, {"id": "tax-112-34", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 34, "question": "荷蘭公司與我國甲公司簽有顧問合約,不定期選派工程師到我國協助離岸風電相關業務,有關我國營\n業稅之徵免規定為何?", "options": {"A": "屬於境外銷售勞務,不課營業稅", "B": "屬於在我國境內銷售勞務,要課營業稅,由該工程師負責繳納", "C": "屬於在我國境內銷售勞務,但因工程師不是營業人,故不課營業稅", "D": "屬於在我國境內銷售勞務,要課營業稅,由甲公司負責繳納"}, "answer": "D", "note": ""}, {"id": "tax-112-35", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 35, "question": "中華民國境內無固定營業場所之外國營利事業之營業稅稽徵規定,下列敘述何者錯誤?", "options": {"A": "外國營利事業銷售勞務予我國境內營業人者,以買受人為營業稅納稅義務人", "B": "外國營利事業銷售電子勞務予我國境內自然人者,該外國營利事業應自行報繳營業稅", "C": "外國營利事業在中華民國境內銷售電子勞務予我國境內自然人者,應開立紙本發票", "D": "外國國際運輸事業在中華民國境內有代理人者,其在我國境內載貨出境,應由代理人開立統一發票"}, "answer": "C", "note": ""}, {"id": "tax-112-36", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 36, "question": "經營農、林、漁、牧業之公司下列銷售貨物情形,何者應課徵營業稅?", "options": {"A": "向漁民購入漁產,切割、清洗後即行出售", "B": "將自行生產玉米乾燥後即行出售", "C": "將種植之牧草收割後即行出售", "D": "將生產馬鈴薯製作薯條,冷凍後出售"}, "answer": "D", "note": ""}, {"id": "tax-112-37", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 37, "question": "我國 A 海運公司 112 年相關交易情形如下:1銷售國際運輸用之船舶 2進口國際運輸用之船舶 3進\n口經營國際貿易之我國船舶專用之燃料 4銷售供漁船使用之機器設備之用油。以上何種銷售情形免徵\n營業稅?", "options": {"A": "12", "B": "僅23", "C": "123", "D": "234"}, "answer": "D", "note": ""}, {"id": "tax-112-38", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 38, "question": "依加值型及非加值型營業稅法規定,保險業經營專屬本業、非專屬本業及再保費等收入之營業稅稅率,\n分別為何?", "options": {"A": "5%;5%;2%", "B": "2%;5%;1%", "C": "5%;5%;1%", "D": "5%;2%;1%"}, "answer": "C", "note": ""}, {"id": "tax-112-39", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 39, "question": "某有陪侍之酒吧本期銷售額 800 萬元,添購新音響設備 200 萬元,進項稅額 10 萬元,請問本期應繳\n營業稅多少元?", "options": {"A": "120 萬元", "B": "150 萬元", "C": "190 萬元", "D": "200 萬元"}, "answer": "D", "note": ""}, {"id": "tax-112-40", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 40, "question": "依加值型及非加值型營業稅法相關規定,有關銷售額之敘述,下列何者正確?1互易貨物應以換入\n或換出時價從高認定 2銷售額應包括銷售時收取之營業稅 3銷售額應包括應稅貨物之貨物稅\n4受託代購貨物者,其銷售額應以時價為準", "options": {"A": "12", "B": "13", "C": "24", "D": "34"}, "answer": "B", "note": ""}, {"id": "tax-112-41", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 41, "question": "依加值型及非加值型營業稅法規定,下列進項稅額何者不得扣抵銷項稅額?1勞軍用之電視機\n2公司送貨用之小貨車 3交際應酬用之貨物 4員工年終摸彩之貨物 5公司召開股東會贈送\n紀念品支出 6辦公處室水電費用", "options": {"A": "126", "B": "234", "C": "345", "D": "346"}, "answer": "C", "note": ""}, {"id": "tax-112-42", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 42, "question": "採查定課徵之某小規模營業人,查定每季營業額 42 萬元,當季進貨取得統一發票金額 25 萬元,進項\n稅額 12,500 元,並依規定申報其進項稅額。則其當季經查定之應納營業稅額為多少?", "options": {"A": "1,700 元", "B": "2,000 元", "C": "2,950 元", "D": "4,200 元"}, "answer": "C", "note": ""}, {"id": "tax-112-43", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 43, "question": "依加值型及非加值型營業稅法規定,營業人漏開統一發票經查獲者,一年內經查獲幾次,應停止其營\n業?為停止營業處分時,其期限最長不得超過幾個月?", "options": {"A": "2 次;2 個月", "B": "3 次;3 個月", "C": "3 次;6 個月", "D": "4 次;6 個月"}, "answer": "C", "note": ""}, {"id": "tax-112-44", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 44, "question": "忠孝公司本年 8 月向仁愛百貨公司購買商品禮券一批,總計新臺幣 120 萬元,取得百貨公司開立之電\n子統一發票。該禮券於 9 月中秋節前分發以犒賞員工。請問本筆發票進項稅額能否扣抵該公司之銷項\n稅額?如可扣抵,應自所申報之那一期銷項稅額扣抵?", "options": {"A": "不得扣抵", "B": "得扣抵,自申報 7、8 月當期之銷項稅額扣抵", "C": "得扣抵,自申報 9、10 月當期之銷項稅額扣抵", "D": "得扣抵,自員工持券兌付貨物當期銷項稅額扣抵"}, "answer": "A", "note": ""}, {"id": "tax-112-45", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 45, "question": "依遺產及贈與稅法規定,有關課稅範圍之敘述,下列何者錯誤?", "options": {"A": "甲贈與時為中華民國國民並經常居住中華民國境內,其贈與中華民國境外財產,應課徵贈與稅", "B": "乙贈與時為中華民國國民並經常居住中華民國境外,其贈與中華民國境外財產,應課徵贈與稅", "C": "丙贈與時為非中華民國國民並經常居住中華民國境內,其贈與中華民國境內財產,應課徵贈與稅", "D": "丁贈與時為非中華民國國民(前 2 年內自願喪失中華民國國籍)並經常居住中華民國境內,其贈與\n中華民國境外財產,應課徵贈與稅"}, "answer": "B", "note": ""}, {"id": "tax-112-46", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 46, "question": "甲於 112 年 6 月 2 日將所有土地贈與成年子女乙,下列何種情形不符合遺產及贈與稅法第 7 條以受贈\n人為納稅義務人之規定?", "options": {"A": "甲贈與後即行蹤不明", "B": "甲逾限未繳納贈與稅,且在中華民國境內無財產可供執行", "C": "甲於稅捐稽徵機關核定贈與稅前死亡", "D": "甲贈與後申請喪失中華民國國籍,遷居至國外"}, "answer": "D", "note": ""}, {"id": "tax-112-47", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 47, "question": "丙於 112 年 6 月 2 日死亡,其所遺財產如下:1自行創作之版畫 2向他人購入之專利權 3無償供\n公眾通行之道路土地經主管機關證明,且非屬建造房屋應保留之法定空地 4尚未收取之債權。以上\n何者不計入遺產總額課徵遺產稅?", "options": {"A": "13", "B": "24", "C": "123", "D": "1234"}, "answer": "A", "note": ""}, {"id": "tax-112-48", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 48, "question": "依遺產及贈與稅法相關規定,下列有關繼承財產為已在證券交易所上市之有價證券(以下簡稱上市股\n票)價值估定方式,何者錯誤?", "options": {"A": "繼承開始日該上市股票有買賣價格者,依該日該上市股票之收盤價估定", "B": "繼承開始日該上市股票無買賣價格者,依該日前最後一日該上市股票之收盤價估定", "C": "繼承開始日為該上市股票除權除息日者,依該日後一個月內該上市股票各日收盤價之平均價格估定", "D": "繼承開始日該上市股票價格有劇烈變動者,依繼承開始日前一個月內該上市股票各日收盤價之平均\n價格估定"}, "answer": "C", "note": ""}, {"id": "tax-112-49", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 49, "question": "關於遺產稅及贈與稅之申報規定,下列敘述何者正確?", "options": {"A": "遺產稅應由納稅義務人於被繼承人死亡之日起 6 個月內,向死亡地主管稽徵機關申報", "B": "贈與人在一年內贈與他人之財產總值超過贈與稅免稅額時,應於超過免稅額之贈與行為發生後 30\n日內,向主管稽徵機關辦理申報", "C": "同一贈與人在同一年內有兩次以上應申報納稅之贈與行為者,應分別申報計徵贈與稅", "D": "稽徵機關於查悉死亡事實後,應於 10 日內通知依限申報"}, "answer": "B", "note": ""}, {"id": "tax-112-50", "year": "112", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 50, "question": "郭君結婚時,其祖父、父親、母親及大哥各自分別贈與現金 100 萬元。依遺產及贈與稅法第 20 條規\n定,前述贈與得「不計入贈與總額」之金額為多少?", "options": {"A": "100 萬元", "B": "200 萬元", "C": "244 萬元", "D": "400 萬元"}, "answer": "B", "note": ""}, {"id": "accounting-113-1", "year": "113", "subject": "accounting", "subjectName": "會計學概要", "number": 1, "question": "甲公司於 X5 年中發現 A 設備因為保養良好,總耐用年限估計可延長 2 年,殘值不變,該設備\n購置於 X1 年 1 月 1 日,購入價格為$230,000,公司另支付安裝測試費用$30,000,當時估計耐\n用年限為 10 年,殘值為$10,000,採直線折舊法。請問甲公司 A 設備 X5 年之折舊費用應為:", "options": {"A": "$25,000", "B": "$20,000", "C": "$18,750", "D": "$16,875"}, "answer": "C", "note": ""}, {"id": "accounting-113-2", "year": "113", "subject": "accounting", "subjectName": "會計學概要", "number": 2, "question": "甲公司 X1 年 1 月 1 日以$8,648,870 的價格發行面額 5%、市場利率 4%之十年期公司債\n$8,000,000,每年付息一次,付息日為 12 月 31 日,採有效利率法攤銷公司債之溢折價。X3\n年 7 月 1 日甲公司於公開市場以 99 的價格加計利息買回面額$4,000,000 的債券。請問買回公\n司債的損益為何?", "options": {"A": "$194,695 損失", "B": "$194,695 利益", "C": "$294,695 損失", "D": "$294,695 利益"}, "answer": "D", "note": ""}, {"id": "accounting-113-3", "year": "113", "subject": "accounting", "subjectName": "會計學概要", "number": 3, "question": "甲公司 X3 年的稅後淨利為$1,054,000,X3 年全年有 200,000 股累積非參加特別股流通在外,\n每股面額為$10,股利率為 5%。已積欠 2 年之股利。X3 年 1 月 1 日普通股流通在外計 120,000\n股,4 月 1 日買回庫藏股 11,000 股,10 月 1 日現金增資 30,000 股。請問甲公司 X3 年度之基\n本每股盈餘為何?", "options": {"A": "$6.84", "B": "$7.00", "C": "$7.16", "D": "$8.00"}, "answer": "D", "note": ""}, {"id": "accounting-113-4", "year": "113", "subject": "accounting", "subjectName": "會計學概要", "number": 4, "question": "甲公司自 X1 年初開始營業,會計上按應計基礎認列售後服務保證成本,報稅時改採現金基\n礎。最近三年該公司會計上認列之售後服務保證費用與實際支出資料如下:\n年度 售後服務保證費用 保證費用實際支出\nX1 500,000 200,000\nX2 480,000 450,000\nX3 650,000 560,000\n各年度稅率均為 30%,無其他暫時性差異。請問甲公司 X3 年 12 月 31 日資產負債表上應有\n之遞延所得稅資產(負債)為何?", "options": {"A": "遞延所得稅資產$126,000", "B": "遞延所得稅負債$126,000", "C": "遞延所得稅資產$27,000", "D": "遞延所得稅負債$27,000"}, "answer": "A", "note": ""}, {"id": "accounting-113-5", "year": "113", "subject": "accounting", "subjectName": "會計學概要", "number": 5, "question": "甲公司 X5 年現金流量表中營業活動之淨現金流入為$6,500,000,已知折舊費用$2,250,000,\n出售設備利益$300,000,發放現金股利$980,000,持有供交易目的金融資產評價損失$650,000。\n甲公司 X5 年之淨利為何?", "options": {"A": "$3,600,000", "B": "$3,900,000", "C": "$4,250,000", "D": "$4,550,000"}, "answer": "B", "note": ""}, {"id": "accounting-113-6", "year": "113", "subject": "accounting", "subjectName": "會計學概要", "number": 6, "question": "甲公司在 X8 年 1 月 1 日成立,主管機關核准其發行面額$10 之普通股 45,000 股。甲公司 X8\n年度部分交易如下:(1)1 月 13 日以每股$17 發行 5,000 股普通股。(2)3 月 8 日以每股$15 發\n行 2,500 股普通股。(3)6 月 28 日以每股$12 買回 1,500 股普通股。(4)8 月 5 日以每股$16 發行\n1,500 股普通股。(5)10 月 16 日以每股$18 出售 1,000 股庫藏股票。甲公司對出售庫藏股票採\n先進先出法,若使用成本法處理庫藏股票交易,X8 年 12 月 31 日的資本公積餘額為多少?", "options": {"A": "$56,500", "B": "$61,500", "C": "$62,500", "D": "$64,500"}, "answer": "C", "note": ""}, {"id": "accounting-113-7", "year": "113", "subject": "accounting", "subjectName": "會計學概要", "number": 7, "question": "甲公司於 X1 年中買回公司之普通股,購買價格高於普通股之面值及原發行價格,但低於每\n股帳面價值。請問此項交易對股東權益的影響為何?", "options": {"A": "股東權益總額提高,每股帳面價值提高", "B": "股東權益總額提高,每股帳面價值降低", "C": "股東權益總額降低,每股帳面價值提高", "D": "股東權益總額降低,每股帳面價值降低"}, "answer": "C", "note": ""}, {"id": "accounting-113-8", "year": "113", "subject": "accounting", "subjectName": "會計學概要", "number": 8, "question": "乙公司 X7 年 6 月 30 日的股東權益如下:\n普通股,面額$10 $ 3,500,000\n資本公積 880,000\n保留盈餘 1,000,000\n乙公司於 X7 年 7 月 1 日宣告發放 5%股票股利,並於 7 月 31 日發放,普通股在股利宣告日\n的市價為$40,在發放日的市價為$42。關於股票股利之會計處理,乙公司應借記「保留盈餘」\n之金額為?", "options": {"A": "$175,000", "B": "$210,000", "C": "$700,000", "D": "$735,000"}, "answer": "AC", "note": "答A或C者均給分,"}, {"id": "accounting-113-9", "year": "113", "subject": "accounting", "subjectName": "會計學概要", "number": 9, "question": "甲公司 X2 年 12 月 5 日調整下列交易前之應付帳款餘額為$350,000:(1)甲公司於 X2 年 12 月\n26 日購入商品$165,000,付款條件 2/10,n/30。甲公司採用淨額法記錄應付帳款。該張進貨\n發票於 X3 年 1 月 3 日入帳及付款。(2)甲公司向乙公司進貨$60,000,雙方約定起運點交貨,\n乙公司於 X2 年 12 月 26 日交運,甲公司於 X3 年 1 月 6 日收到貨品。(3)甲公司於 X2 年 12\n月 22 日訂購貨品一批發票價格為$45,000,雙方約定目的地交貨。該批貨品於 X3 年 1 月 2 日\n送達。甲公司 X2 年 12 月 31 日之應付帳款餘額為多少?", "options": {"A": "$556,700", "B": "$571,700", "C": "$575,000", "D": "$616,700"}, "answer": "B", "note": ""}, {"id": "accounting-113-10", "year": "113", "subject": "accounting", "subjectName": "會計學概要", "number": 10, "question": "甲公司 X5 年銷售一種附有 2 年保證維修期限之玩具狗,依據公司過去經驗得知有 45%玩具\n狗不會發生損壞,35%玩具狗會發生小瑕疵,20%玩具狗則會發生重大瑕疵。每隻玩具狗發生\n小瑕疵和重大瑕疵時之平均修理費用分別為$120 及$400。甲公司 X5 年度共銷售 500 隻玩具\n狗,每隻售價為$1,500,X5 年實際發生的免費維修支出為$25,800。甲公司 X5 年 12 月 31 日\n估計產品保證負債餘額為何?", "options": {"A": "$25,800", "B": "$35,200", "C": "$61,000", "D": "$86,800"}, "answer": "B", "note": ""}, {"id": "accounting-113-11", "year": "113", "subject": "accounting", "subjectName": "會計學概要", "number": 11, "question": "甲公司 X6 年將銷售一款新型產品 Z,預估相關資料如下:產品 Z 單位售價$180,單位變動\n成本$140。產品 Z 的固定成本則包括租金$185,000,折舊費用$110,000,銷售費用$275,000,\n管理費用$130,000。甲公司適用的所得稅率為 20%。甲公司 X6 年欲賺得$300,000 之稅後利\n潤,應銷售多少單位產品 Z?", "options": {"A": "9,375 單位", "B": "25,000 單位", "C": "26,875 單位", "D": "31,250 單位"}, "answer": "C", "note": ""}, {"id": "accounting-113-12", "year": "113", "subject": "accounting", "subjectName": "會計學概要", "number": 12, "question": "丁公司債券投資的相關資料如下:\n公允價值\n成本 X5 年底 X6 年底\n透過損益按公允價值衡量 $400,000 $320,000 $420,000\n按攤銷後成本衡量 400,000 330,000 360,000\n丁公司 X6 年綜合損益表的金融資產評價損益為?", "options": {"A": "損失$20,000", "B": "利益$20,000", "C": "利益$100,000", "D": "利益$130,000"}, "answer": "C", "note": ""}, {"id": "accounting-113-13", "year": "113", "subject": "accounting", "subjectName": "會計學概要", "number": 13, "question": "李君為甲公司新進會計人員,正使用間接法來編製現金流量表,X4 年相關資料如下:權益法\n認列投資收益$66,000,購買一台機器付款$75,000,採權益法之長期股權投資收到股利\n$35,000,支付現金股利給股東$40,000,簽發票據$100,000 取得一筆土地。甲公司 X4 年度折\n舊費用$20,000。甲公司 X4 年度存貨增加$18,000,應收帳款淨額減少$27,000,應付帳款減少\n$30,000。甲公司 X4 年度淨利$140,000,期初現金餘額$30,000。甲公司 X4 年的營業活動淨\n現金流入為多少?", "options": {"A": "$68,000", "B": "$108,000", "C": "$144,000", "D": "$240,000"}, "answer": "AB", "note": "答A或B者均給分"}, {"id": "accounting-113-14", "year": "113", "subject": "accounting", "subjectName": "會計學概要", "number": 14, "question": "丙公司 X6 年 12 月 31 日帳上有零用金$1,000,A 銀行支票存款$25,000,B 銀行存款透支\n$5,000,以及顧客償還貨款寄來的郵局匯票$3,200。丙公司若帳上與銀行對帳單沒有任何差異,\nX6 年底資產負債表上的現金餘額為?", "options": {"A": "$1,000", "B": "$24,200", "C": "$26,000", "D": "$29,200"}, "answer": "D", "note": ""}, {"id": "accounting-113-15", "year": "113", "subject": "accounting", "subjectName": "會計學概要", "number": 15, "question": "乙公司於 X6 年 7 月初以$300,000 購入一台機器,估計耐用年限 5 年,殘值$20,000,使用直\n線法提列折舊。X7 年底由於經營環境改變使得該機器之價值有重大跡象顯示已經發生減損。\n乙公司於 X7 年底作減損測試,估計該機器之使用價值為$170,000,淨公允價值為$185,000,\n估計耐用年限不變。乙公司 X7 年應認列之減損損失為?", "options": {"A": "$25,000", "B": "$31,000", "C": "$40,000", "D": "$46,000"}, "answer": "B", "note": ""}, {"id": "accounting-113-16", "year": "113", "subject": "accounting", "subjectName": "會計學概要", "number": 16, "question": "甲公司於 X3 年初登記設立,核准發行普通股 160,000 股,每股面額 $10,該公司將分兩次\n發行,第一次於 X3 年初以每股$30 發行 1/2 股數,第二次則於 X3 年底發行剩餘股數。甲公\n司 X4 年初,帳列「資本公積一普通股溢價」為$3,360,000。甲公司第二次發行普通股時的每股\n發行價為何?", "options": {"A": "$21", "B": "$22", "C": "$31", "D": "$32"}, "answer": "D", "note": ""}, {"id": "accounting-113-17", "year": "113", "subject": "accounting", "subjectName": "會計學概要", "number": 17, "question": "乙公司 X2 年底部分帳戶餘額如下:應付帳款$25,500,長期抵押借款$100,000,估計產品保\n證負債$12,000,遞延所得稅負債$15,500,短期借款$22,000,備抵呆帳貸餘$3,500,短期應付\n票據$35,000,應付公司債$60,000(4 年後到期),累計減損$5,500。乙公司 X2 年底,資產負\n債表上應認列的流動負債金額為?", "options": {"A": "$94,500", "B": "$98,000", "C": "$100,000", "D": "$111,000"}, "answer": "A", "note": ""}, {"id": "accounting-113-18", "year": "113", "subject": "accounting", "subjectName": "會計學概要", "number": 18, "question": "乙公司 X4 年度銷貨總額為$2,000,000。乙公司 X4 年 12 月 31 日調整前應收帳款餘額為\n$500,000,備抵呆帳貸餘$28,000。X4 年 12 月 31 日應收帳款的帳齡分析如下:\n帳 齡 金 額 可能收回機率\n15天以內 $230,000 0.95\n16~30天 85,000 0.92\n31~45天 75,000 0.88\n46~60天 65,000 0.75\n61~90天 30,000 0.52\n超過90天 15,000 0.00\n乙公司若使用帳齡分析法提列呆帳,X4 年 12 月 31 日,應收帳款淨額為何?", "options": {"A": "$427,050", "B": "$442,050", "C": "$470,050", "D": "$500,000"}, "answer": "A", "note": ""}, {"id": "accounting-113-19", "year": "113", "subject": "accounting", "subjectName": "會計學概要", "number": 19, "question": "丙公司於 X4 年初開始營業,X4 年相關資料如下:淨利$650,000,庫藏股再發行價格超過成\n本$60,000,現金股利$240,000,提撥或有損失準備$75,000,股票股利$50,000。丙公司 X4 年\n12 月 31 日,保留盈餘應有的餘額為何?", "options": {"A": "$285,000", "B": "$360,000", "C": "$410,000", "D": "$420,000"}, "answer": "B", "note": ""}, {"id": "accounting-113-20", "year": "113", "subject": "accounting", "subjectName": "會計學概要", "number": 20, "question": "甲公司存貨使用定期盤存制度,X1 年 7 月份的期初存貨共 2,000 單位,單位成本$17,X1 年\n7 月份進貨與銷貨資料如下:\n7月05日 進貨450單位,每單位成本$20\n7月10日 銷貨500單位,每單位售價$36\n7月13日 銷貨350單位,每單位售價$42\n7月25日 進貨500單位,每單位成本$17.25\n甲公司使用成本與淨變現價值孰低法來評價存貨,每單位存貨於 X1 年 7 月底之淨變現價值\n為$18。在加權平均法下,甲公司 X1 年 7 月底的存貨金額為多少?", "options": {"A": "$34,000", "B": "$35,700", "C": "$36,750", "D": "$37,800"}, "answer": "C", "note": ""}, {"id": "bookkeeping-113-1", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 1, "question": "依記帳士法規定,下列何者非記帳士與委任人訂立之委任書與記帳士執行業務應設置簿冊,兩者皆應載明\n之法定事項?", "options": {"A": "委任案件內容", "B": "委任人之地址", "C": "酬金數額", "D": "委任日期"}, "answer": "C", "note": ""}, {"id": "bookkeeping-113-2", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 2, "question": "對於記帳士、記帳及報稅代理人及其設立或登錄執業之事務所,有關「洗錢防制與打擊資恐風險內部控制」\n措施之敘述,下列何者錯誤?", "options": {"A": "應依其風險及業務規模訂定相關的內控程序", "B": "應由負責人或指定管理階層人員核定,並監控相關控制程序之執行", "C": "應訂定相關訓練計畫,辦理自我審查或內部稽核,並作成書面紀錄", "D": "應每年更新相關的風險評估報告"}, "answer": "D", "note": ""}, {"id": "bookkeeping-113-3", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 3, "question": "下列何者非記帳士公會章程之必要記載事項?", "options": {"A": "經費及會計", "B": "記帳士紀律委員會之組織及風紀維持方法", "C": "章程之修改", "D": "會員之會費金額及收取方式"}, "answer": "D", "note": ""}, {"id": "bookkeeping-113-4", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 4, "question": "下列對於記帳士參加防制洗錢及打擊資恐在職訓練之敘述,何者正確?", "options": {"A": "接受此項訓練,與記帳士職業倫理道德規範無關", "B": "參加訓練前應向所屬公會報備", "C": "得以實體或視訊課程方式進行", "D": "每年訓練時數超過 2 小時部分不予認定"}, "answer": "C", "note": ""}, {"id": "bookkeeping-113-5", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 5, "question": "某候選人洽請李記帳士為其競選活動處理帳務申報事宜,但李記帳士擔心其並無類似經驗,且因時限考量,\n經評估後婉拒接受委任。請問李記帳士之作為,與我國記帳士職業倫理道德規範中的那一項要求關聯性最低?", "options": {"A": "誠正", "B": "務實", "C": "保密", "D": "適任"}, "answer": "C", "note": ""}, {"id": "bookkeeping-113-6", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 6, "question": "在記帳士事務所任職的助理黃君,有以下何種作為時,將被視為違反記帳士職業倫理道德規範?", "options": {"A": "未經客戶同意,洩漏業務上之秘密", "B": "依指示在特定時間將客戶相關的帳務資料文件等送交主管機關", "C": "拒絕客戶因貸款需求,協助美化財務報表之請託", "D": "記帳士職業倫理道德規範僅適用於記帳士,黃君係助理人員,因此並無適用問題"}, "answer": "A", "note": ""}, {"id": "bookkeeping-113-7", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 7, "question": "關於商業記帳本位與記帳文字之規定,下列敘述何者錯誤?", "options": {"A": "商業因業務需要,財務報表得以新臺幣、外幣併列方式編製", "B": "商業會計之記載,除記帳數字適用阿拉伯字外,應以我國文字為之", "C": "商業不得以外幣編製決算報表", "D": "商業記帳以仟元為單位,但得依交易之性質延長,改以元為單位"}, "answer": "D", "note": ""}, {"id": "bookkeeping-113-8", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 8, "question": "下列何者屬於對外會計事項?1倉庫失火未投保的存貨焚毀 2銀行撥款先前申貸的款項入帳 3繳納\n本期營業稅 4提列折舊 5發放現金股利 6業主自商業提取商品自用", "options": {"A": "1234", "B": "2356", "C": "1245", "D": "3456"}, "answer": "B", "note": ""}, {"id": "bookkeeping-113-9", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 9, "question": "商業自辦員工午餐,部分蔬果係購自市場小販,無法取得原始憑證。下列有關帳務處理之敘述,何者正確?", "options": {"A": "無法證明交易之事實,不可入帳", "B": "可根據其事實及金額作成憑證,由商業負責人或其指定人員簽章,憑以記帳", "C": "由採購人員開立內部憑證,經市場小販簽章後,憑以記帳", "D": "由會計人員依金額大小援例處理"}, "answer": "B", "note": ""}, {"id": "bookkeeping-113-10", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 10, "question": "依商業會計法之規定,下列有關會計帳簿之敘述,何者錯誤?", "options": {"A": "商業必須設置之會計帳簿,為普通序時帳簿及總分類帳簿", "B": "商業所置之各種會計帳簿,均應按其頁數順序編號,不得毀損", "C": "會計制度健全,使用總分類帳會計項目日計表者,得免設總分類帳簿", "D": "在同一會計年度內應連續記載,除已用盡外不得更換新帳簿"}, "answer": "C", "note": ""}, {"id": "bookkeeping-113-11", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 11, "question": "依商業會計法之規定,資產之折舊方法有那些?1平均法 2生產數量法 3加權平均法 4年數合計法\n5工作時間法", "options": {"A": "12345", "B": "僅1235", "C": "僅1245", "D": "僅2345"}, "answer": "C", "note": ""}, {"id": "bookkeeping-113-12", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 12, "question": "下列有關資產重估價之敘述,何者錯誤?", "options": {"A": "固定資產遇有物價指數上漲達 25%以上時,可依法令辦理重估價", "B": "供營業長期使用之自用土地,得依土地公告現值調整價值", "C": "重估或調整之資產而發生之增值,應列為未實現重估增值", "D": "經重估之固定資產,自重估年度起,以重估價值為基礎計提折舊"}, "answer": "D", "note": ""}, {"id": "bookkeeping-113-13", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 13, "question": "下列那一個會計項目,於編製財務報表時,不可列於資本項下?", "options": {"A": "普通股", "B": "海外存託憑證", "C": "可轉換特別股", "D": "具負債性質之特別股"}, "answer": "D", "note": ""}, {"id": "bookkeeping-113-14", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 14, "question": "甲君兩年前以 500 萬元購入土地一筆,今以該土地入股 A 公司,該筆土地目前公告現值 400 萬元,公允價\n值 800 萬元、淨變現價值 720 萬元,試問 A 公司資產負債表上該筆土地帳列金額?", "options": {"A": "400 萬元", "B": "500 萬元", "C": "720 萬元", "D": "800 萬元"}, "answer": "D", "note": ""}, {"id": "bookkeeping-113-15", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 15, "question": "依商業會計處理準則之規定,不可能同時出現於短期性及長期性投資之會計項目為何?", "options": {"A": "避險之金融資產", "B": "採用權益法之投資", "C": "以成本衡量之金融資產", "D": "按攤銷後成本衡量之金融資產"}, "answer": "B", "note": ""}, {"id": "bookkeeping-113-16", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 16, "question": "公開發行股票公司為他公司有限責任股東,其投資總額原則上不得超過公司實收股本 40%。除非符合下列\n那些條件之一,其投資總額不受公司實收股本 40%上限限制?1以投資為專業 2經代表已發行股份總數\n二分之一以上股東出席,出席股東二分之一以上同意之股東會決議 3經二分之一以上董事出席,出席董\n事二分之一以上同意之董事會決議 4公司章程另有規定 5經代表已發行股份總數三分之二以上股東\n出席,出席股東二分之一以上同意之股東會決議", "options": {"A": "124", "B": "134", "C": "135", "D": "145"}, "answer": "D", "note": ""}, {"id": "bookkeeping-113-17", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 17, "question": "商業會計法中,對於營業收入之認列,下列敘述何者正確?", "options": {"A": "採用現金收付制之商業,於交付商品時認列", "B": "分期付款銷貨收入,按淨利百分比法攤算入帳", "C": "勞務收入依其性質分段提供者,得分段認列", "D": "採用權責發生制之商業,於現金完成收付時認列"}, "answer": "C", "note": ""}, {"id": "bookkeeping-113-18", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 18, "question": "李君未依法取得代他人處理會計事務之資格,卻私下違規作業。因與客戶發生爭執,故意將某筆重大銷貨\n收入不為登帳,以致該年度財務報表產生不實的結果。請問:李君最高可能會被處以幾年以下有期徒刑或\n科新臺幣多少元以下罰金?", "options": {"A": "1 年;15 萬元", "B": "3 年;30 萬元", "C": "5 年;60 萬元", "D": "商業會計法上並無具體規定"}, "answer": "C", "note": ""}, {"id": "bookkeeping-113-19", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 19, "question": "主管機關依職權或利害關係人之申請,廢止公司登記,除命令解散或裁定解散外,應定多久期間,催告公\n司負責人聲明異議?", "options": {"A": "10 日", "B": "15 日", "C": "30 日", "D": "45 日"}, "answer": "C", "note": ""}, {"id": "bookkeeping-113-20", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 20, "question": "下列有關商業登記之敘述,何者錯誤?", "options": {"A": "商業設立分支機構,應於 15 日內申請登記", "B": "商業終止營業時,應於 3 個月內,申請歇業登記", "C": "商業停業期間,最長不得超過一年;但有正當理由,經商業所在地主管機關核准者,不在此限", "D": "商業遷移於原登記機關之管轄區域以外時,應向遷入區域之主管機關申請遷址之登記"}, "answer": "B", "note": ""}, {"id": "bookkeeping-113-21", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 21, "question": "商業在下列何種情事下,不可免繳相關規費?", "options": {"A": "因行政區域調整或門牌改編而申請變更登記", "B": "申請停業登記、復業登記", "C": "申請繼承登記", "D": "因法律變更或公務需要申請登記"}, "answer": "C", "note": ""}, {"id": "bookkeeping-113-22", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 22, "question": "下列何者屬於行政程序法第 92 條規定之行政處分?1行政機關依法律或法律授權所為之口頭警告 2行\n政機關租用辦公場所 3交通部氣象署提供氣候的相關資訊及氣象報導 4政府役政機關對役男兵役體\n位之判定 5國稅局對漏開發票之營業人科處罰鍰", "options": {"A": "12345", "B": "僅234", "C": "僅145", "D": "僅124"}, "answer": "C", "note": ""}, {"id": "bookkeeping-113-23", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 23, "question": "1記帳士2取得乙級會計事務技術士證照者3記帳及報稅代理人4退休稅務人員5會計師,以上依法有資\n格代他人處理商業會計事務為何者?", "options": {"A": "僅123", "B": "僅135", "C": "1235", "D": "1345"}, "answer": "B", "note": ""}, {"id": "bookkeeping-113-24", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 24, "question": "依記帳士法第 4 條規定,曾因業務上有詐欺、背信、侵占、偽造文書等犯罪行為,受有期徒刑幾年以上刑\n之裁判確定,不得充任記帳士?如已執行完畢或一部之執行而赦免已滿幾年者,仍得依規定充任記帳士?", "options": {"A": "一年、三年", "B": "一年、五年", "C": "三年、三年", "D": "三年、五年"}, "answer": "A", "note": ""}, {"id": "bookkeeping-113-25", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 25, "question": "記帳士職業倫理道德規範中「記帳士」係指:", "options": {"A": "取得財政部頒發記帳士證書之記帳士", "B": "執業之記帳士與記帳及報稅代理人", "C": "加入各直轄市及縣(市)記帳士公會之會員", "D": "從事記帳工作相關人員"}, "answer": "C", "note": ""}, {"id": "bookkeeping-113-26", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 26, "question": "下列有關記帳士執業規定,何者錯誤?", "options": {"A": "記帳士於執行業務前,應向主管機關申請登錄;日後有不得執業情事發生,應註銷登錄", "B": "記帳士以其登記開業之直轄市、縣市為主要執行業務區域;欲在其他直轄市、縣市執行業務時,應向主\n管機關登記,免設分事務所", "C": "曾任稅務機關審計職系人員者,自離職之日起三年內,不得於其最後任職機關所在地之直轄市、縣市區\n域內執行記帳士業務", "D": "記帳士應於其執行業務區域設立記帳士事務所。其事務所名稱,應註明「記帳士事務所」"}, "answer": "C", "note": ""}, {"id": "bookkeeping-113-27", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 27, "question": "依記帳士法規定,記帳士得在其登錄區域內執行之業務,包括:1受委任辦理營業、停業、復業登記事項\n2受委任辦理各項稅捐稽徵案件申報事項 3受委任辦理各項稅捐之訴願事項 4受委任辦理商業會計\n事務 5受委任辦理各項稅捐之查核簽證事項 6受理稅務諮詢事項", "options": {"A": "1245", "B": "僅1234", "C": "僅1246", "D": "12346"}, "answer": "C", "note": ""}, {"id": "bookkeeping-113-28", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 28, "question": "甲記帳士因業務之犯罪行為經判刑確定,何者得列舉事實,提出證據,報請主管機關將甲記帳士交付懲戒。\n1利害關係人 2法院 3業務事件主管機關 4記帳士公會 5記帳士執業所在地之直轄市(縣市)政府", "options": {"A": "124", "B": "僅134", "C": "1235", "D": "1345"}, "answer": "B", "note": ""}, {"id": "bookkeeping-113-29", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 29, "question": "依照商業會計法第 5 條規定,下列敘述何者正確?", "options": {"A": "商業會計事務之處理,得設置會計人員辦理之", "B": "有限公司其主辦會計人員之任免,應有全體董事過半數之同意", "C": "主辦會計人員之任免,公司章程有較高規定者,從其規定", "D": "會計人員應依法處理會計事務,其離職或變更職務時,應於十五日內辦理交代"}, "answer": "C", "note": ""}, {"id": "bookkeeping-113-30", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 30, "question": "依商業會計法第 10 條規定,商業之會計基礎,原則上應採權責發生制,但若在平時採用現金收付制者,\n應在何時依權責發生制予以調整?", "options": {"A": "調整時", "B": "結帳時", "C": "結算時", "D": "決算時"}, "answer": "D", "note": ""}, {"id": "bookkeeping-113-31", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 31, "question": "依商業會計法規定,下列那些敘述屬於會計事項?1水災倉庫存貨毀損 2喪失重要客戶,預計營業收入\n減少 3,000 萬元 3宣告盈餘分配股息紅利 4匯率變動,應收外幣帳款發生匯兌損失 5擔心原料庫存\n不足,向供應商電話預訂原料 500 萬元", "options": {"A": "僅134", "B": "僅135", "C": "1234", "D": "1345"}, "answer": "A", "note": ""}, {"id": "bookkeeping-113-32", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 32, "question": "下列何者不是財務報表必要之附註事項?", "options": {"A": "債權人對特定資產之權利", "B": "重大或有負債及未認列之合約承諾", "C": "盈餘分配之種類與金額", "D": "權益之重大事項"}, "answer": "C", "note": ""}, {"id": "bookkeeping-113-33", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 33, "question": "商業各項會計憑證,除應永久保存或有關未結會計事項外,至少需保存幾年?其保存期限之起算日為何?", "options": {"A": "5 年、會計年度終了", "B": "10 年、會計年度終了", "C": "5 年、年度決算程序辦理終了", "D": "10 年、年度決算程序辦理終了"}, "answer": "C", "note": ""}, {"id": "bookkeeping-113-34", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 34, "question": "依現行商業會計法規定,下列敘述何者錯誤?", "options": {"A": "資產及負債之原始認列,以成本為衡量原則", "B": "受贈資產按公允價值評價,視其性質列為資本公積、收入或遞延收入", "C": "存貨評價以成本與淨公允價值孰低衡量,跌價損失於發生當期列為銷貨成本", "D": "金融工具投資應視其性質採公允價值、成本或攤銷後成本衡量"}, "answer": "C", "note": ""}, {"id": "bookkeeping-113-35", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 35, "question": "依商業會計處理準則規定,下列那些資產,於資產減損後,當有證據顯示以前期間所認列之減損損失,可\n能已不存在或減少時,資產帳面金額仍不予迴轉?1採用權益法之投資 2投資性不動產 3以成本衡量\n之權益工具投資 4商譽 5按攤銷後成本衡量之金融資產", "options": {"A": "45", "B": "僅34", "C": "234", "D": "124"}, "answer": "B", "note": ""}, {"id": "bookkeeping-113-36", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 36, "question": "依照商業會計處理準則規定,庫藏股票是指公司收回已發行股票,尚未再出售或註銷者。試問其會計處理\n下列何者正確?", "options": {"A": "以股票面額列為股本減項,並註明股數", "B": "以股票面額列為權益減項,並註明股數", "C": "以買進成本列為股本減項,並註明股數", "D": "以買進成本列為權益減項,並註明股數"}, "answer": "D", "note": ""}, {"id": "bookkeeping-113-37", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 37, "question": "公司申報 112 年度營利事業所得稅帳列交際費 300 萬元,經查核交際費超限 25 萬元,試問最終綜合損益\n表帳列交際費金額為何?", "options": {"A": "25 萬元", "B": "275 萬元", "C": "300 萬元", "D": "325 萬元"}, "answer": "C", "note": ""}, {"id": "bookkeeping-113-38", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 38, "question": "依照商業會計法相關規定,下列有關損益計算與衡量之敘述,何者錯誤?", "options": {"A": "商業有支付員工退休金之義務者,應於員工在職期間依法提列,認列為當期費用", "B": "營業外之利息收入及利息費用應分別列示。但採權益法認列之投資損益,得以淨額列示", "C": "營業成本及營業費用應分別列示,兩者不能分別列示者,得合併為營業成本", "D": "商業對業主分配之盈餘,不得作為費用或損失。但具負債性質之特別股,其股利應認列為費用"}, "answer": "C", "note": ""}, {"id": "bookkeeping-113-39", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 39, "question": "商業之決算,應於會計年度終了後幾個月內辦理完竣?必要時得延長多久的期間?", "options": {"A": "2 個月、2 個月", "B": "2 個月、2.5 個月", "C": "3 個月、1 個月", "D": "3 個月、1.5 個月"}, "answer": "B", "note": ""}, {"id": "bookkeeping-113-40", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 40, "question": "商業負責人應於多久的期間內,將決算書表提請出資人、合夥人或股東承認。在無不法或不正當行為下,\n決算書表獲得承認後,可解除商業負責人及主辦會計人員對於該年度會計上之責任。", "options": {"A": "會計年度終了後二個月內", "B": "決算程序辦理終了二個月內", "C": "會計年度終了後六個月內", "D": "決算程序辦理終了六個月內"}, "answer": "C", "note": ""}, {"id": "bookkeeping-113-41", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 41, "question": "代表商業負責人,規避、妨礙或拒絕法院選派之檢查員,檢查會計帳簿報表及憑證,應處新臺幣 1 萬元以\n上 5 萬元以下罰鍰。試問該處罰機關為何?", "options": {"A": "法院", "B": "財政部", "C": "經濟部", "D": "商業所在地之直轄(縣)市政府"}, "answer": "A", "note": ""}, {"id": "bookkeeping-113-42", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 42, "question": "依商業會計處理準則規定,生產性植物歸屬於下列那一類別項目?", "options": {"A": "存貨", "B": "生物資產", "C": "不動產、廠房及設備", "D": "其他資產"}, "answer": "C", "note": ""}, {"id": "bookkeeping-113-43", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 43, "question": "下列有關經聽證做成行政處分之敘述,何者錯誤?", "options": {"A": "行政機關作成行政處分前,認為有必要舉行聽證者,得依職權舉行聽證", "B": "行政機關作成經聽證之行政處分,應斟酌全部聽證之結果", "C": "行政機關作成經聽證之行政處分,得以書面、言詞或其他方式通知當事人", "D": "不服經聽證作成行政處分之當事人,得免除訴願及其先行程序,直接提起行政訴訟"}, "answer": "C", "note": ""}, {"id": "bookkeeping-113-44", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 44, "question": "依公司法第 22 條之 1 規定,公司應每年定期將下列那些人之相關資料如姓名、國籍、持股數等向主管機\n關申報?1持有已發行股份總數 5%以上股東 2持有已發行股份總數 10%以上股東 3董事 4監察人\n5財務主管 ○6 經理人", "options": {"A": "1345", "B": "1346", "C": "2345", "D": "2346"}, "answer": "D", "note": ""}, {"id": "bookkeeping-113-45", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 45, "question": "試問記帳士法和記帳士職業倫理道德規範,其制定單位為何?", "options": {"A": "記帳士法:財政部;記帳士職業倫理道德規範:財政部", "B": "記帳士法:立法院;記帳士職業倫理道德規範:財政部", "C": "記帳士法:財政部;記帳士職業倫理道德規範:中華民國記帳士公會全國聯合會", "D": "記帳士法:立法院;記帳士職業倫理道德規範:中華民國記帳士公會全國聯合會"}, "answer": "D", "note": ""}, {"id": "bookkeeping-113-46", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 46, "question": "近年政府推動多項租稅改革,如股利所得課稅新制、房地合一 2.0 等,記帳士參加相關研習活動,持續進\n修以維持記帳士專業能力及服務之效果與品質,符合記帳士職業倫理道德規範何項準則?", "options": {"A": "基本準則之務實", "B": "基本準則之適任", "C": "行為準則之務實", "D": "行為準則之適任"}, "answer": "D", "note": ""}, {"id": "bookkeeping-113-47", "year": "113", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 47, "question": "臺北市政府核發建照,與指定某建築物為三級古蹟,此兩項行為依行政程序法第 92 條規定,下
