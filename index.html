,係由非貨幣性資產交換而來者,以換入資產之帳面金額衡量為原則", "D": "受贈資產按公允價值入帳,並視其性質列為資本公積、收入或遞延收入"}, "answer": "C", "note": ""}, {"id": "bookkeeping-115-14", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 14, "question": "依據商業會計法之規定,關於金融工具投資,下列何者非可採用之衡量方法?", "options": {"A": "成本", "B": "公允價值", "C": "攤銷後成本之方法衡量", "D": "淨變現價值"}, "answer": "D", "note": ""}, {"id": "bookkeeping-115-15", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 15, "question": "依最新修正通過的商業會計處理準則規定,下列那一個會計項目不屬於流動負債?", "options": {"A": "預收款項", "B": "應付票據", "C": "合約負債", "D": "應付公司債"}, "answer": "D", "note": ""}, {"id": "bookkeeping-115-16", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 16, "question": "依現行商業會計法及商業會計處理準則之規定,下列敘述何者錯誤?", "options": {"A": "法定盈餘是指依公司法及相關法律規定,自盈餘中指撥之公積,以限制股息及紅利之分派者", "B": "盈餘分配應俟股東同意或股東會決議後方可列帳。但有盈餘分配或虧損彌補之議案者,應在當期財\n務報表附註中註明", "C": "其他權益包含國外營運機構財務報表換算之兌換差額", "D": "庫藏股票,指公司收回已發行股票,尚未再出售或註銷者,應按成本法處理,列為權益之減項,並\n註明股數"}, "answer": "A", "note": ""}, {"id": "bookkeeping-115-17", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 17, "question": "依據商業會計法的規定,關於存貨的處理,下列敘述何者錯誤?", "options": {"A": "存貨以成本與淨變現價值孰低衡量,當存貨成本高於淨變現價值時,應將成本沖減至淨變現價值,\n沖減金額應於發生當期認列為銷貨成本", "B": "存貨係指持有供正常營業過程出售者;或正在製造過程中以供正常營業過程出售者;或將於製造過\n程或勞務提供過程中消耗之原料或物料", "C": "存貨成本計算方法得依其種類或性質,採用個別認定法、先進先出法、後進先出法或平均法計算之", "D": "存貨成本包括所有購買成本、加工成本及為使存貨達到目前之地點及狀態所發生之其他成本"}, "answer": "C", "note": ""}, {"id": "bookkeeping-115-18", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 18, "question": "現金流量表的現金及約當現金,不包含下列那一項?", "options": {"A": "庫存現金", "B": "可隨時轉換成定額現金且價值變動風險甚小之短期並具高度流動性之定期存款", "C": "活期存款", "D": "存出保證金"}, "answer": "D", "note": ""}, {"id": "bookkeeping-115-19", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 19, "question": "依商業會計處理準則規定,已辦理資產重估者,當發生減損時,應如何處理?", "options": {"A": "直接認列當期損失", "B": "提列累計減損", "C": "於當期利益範圍內認列減損損失", "D": "先減少未實現重估增值"}, "answer": "D", "note": ""}, {"id": "bookkeeping-115-20", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 20, "question": "依據商業會計法規定,下列何者並非「營業報告書」應包含的項目?", "options": {"A": "經營方針", "B": "營業計畫實施成果", "C": "盈餘分配議案", "D": "研究發展狀況"}, "answer": "C", "note": ""}, {"id": "bookkeeping-115-21", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 21, "question": "下列那些主體適用商業會計法的規範?1公司 2小規模之獨資、合夥 3非小規模之獨資、合夥\n4金融控股公司 5私立學校", "options": {"A": "僅124", "B": "僅134", "C": "僅135", "D": "1234"}, "answer": "B", "note": ""}, {"id": "bookkeeping-115-22", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 22, "question": "依民國 115 年 7 月 3 日修正發布(自 117 年 1 月 1 日施行)之商業會計處理準則規定,合約資產係指\n商業依合約約定,已移轉商品或勞務予客戶,惟仍未具無條件收取對價之權利。商業應於資產負債表\n日評估合約資產無法收回之金額,並提列適當之下列何項科目?", "options": {"A": "備抵折舊", "B": "其他費用", "C": "呆帳費用", "D": "備抵呆帳"}, "answer": "D", "note": ""}, {"id": "bookkeeping-115-23", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 23, "question": "下列關於現金流量表的敘述,何者正確?", "options": {"A": "現金流量表,指以現金及約當現金之流入與流出,彙總說明商業於特定日期之營業、投資及理財活\n動之現金流量", "B": "營業活動之現金流量大多來自主要的營收活動產生之現金流量", "C": "投資活動包含因銷售商品而收取之現金", "D": "理財活動包含償還借款所支付之現金"}, "answer": "B", "note": ""}, {"id": "bookkeeping-115-24", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 24, "question": "依據規定,資產負債表日至財務報表通過發布日之間發生之重大期後事項,應於財務報表中予以揭露。\n下列何者不屬於該條文所規範應揭露之重大期後事項?", "options": {"A": "因遭遇重大天然災害(如地震或火災),導致公司主要廠房與設備發生嚴重毀損", "B": "公司董事會決議進行鉅額現金增資,或發行重大可轉換公司債以改變資本結構", "C": "資產與負債區分流動性與非流動性之分類標準", "D": "公司決議進行重大業務重組,或簽約處分具備重大影響力之子公司"}, "answer": "C", "note": ""}, {"id": "bookkeeping-115-25", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 25, "question": "依商業會計處理準則第 15 條規定,短期性之投資中透過其他綜合損益按公允價值衡量之金融資產-流\n動,不包括下列何項會計項目?", "options": {"A": "以成本衡量之金融資產-流動", "B": "債務工具投資指該金融資產之合約條款產生特定日期之現金流量,完全為支付本金及流通在外本金\n金額之利息", "C": "指原始認列時作一不可撤銷之選擇,將公允價值變動列報於其他綜合損益之非持有供交易之權益工具\n投資", "D": "債務工具投資以收取合約現金流量及出售為目的之經營模式下持有之金融資產"}, "answer": "A", "note": ""}, {"id": "bookkeeping-115-26", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 26, "question": "依商業會計法之規定,下列敘述何者正確?", "options": {"A": "具有負債性質之特別股,其股利不應認列為費用", "B": "商業對業主分配之盈餘,得作為費用或損失", "C": "商業有支付員工退休金之義務者,應於支付時認列為當期費用", "D": "基於配合原則,與同一交易或其他事項有關之收入及費用,應適當認列"}, "answer": "D", "note": ""}, {"id": "bookkeeping-115-27", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 27, "question": "張三是 A 股份有限公司負責人,張三應於會計年度終了後至遲多久的時間內,將公司之決算報表提\n請股東承認,始符合商業會計法第 68 條之規定?", "options": {"A": "20 日內", "B": "1 個月內", "C": "2 個月內", "D": "6 個月內"}, "answer": "D", "note": ""}, {"id": "bookkeeping-115-28", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 28, "question": "依現行商業會計法及商業會計處理準則之規定,下列敘述何者錯誤?", "options": {"A": "商業在同一會計年度內所發生之全部收益,減除同期之全部成本、費用及損失後之差額,為本期綜\n合損益總額", "B": "申報營利事業所得稅時,各項所得計算依稅法規定所作調整,應不影響帳面紀錄", "C": "透過損益按公允價值衡量之金融資產(負債)淨損益、採用權益法認列之投資損益、兌換損益及處\n分投資損益,得以其淨額列示", "D": "所得稅費用係指包含於決定本期損益中,且本期應實際繳納之所得稅"}, "answer": "D", "note": ""}, {"id": "bookkeeping-115-29", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 29, "question": "甲公司於 115 年 7 月發生下列各項金流交易事項。依據商業會計法第 9 條之規定,下列那一項交易處\n理不符合規定?", "options": {"A": "甲公司向乙供應商採購原物料,以現金支付貨款新臺幣 98 萬元", "B": "甲公司出售報廢之機器設備,向自然人丙收取現金價款新臺幣 120 萬元", "C": "甲公司支付丁公司辦公室租金與押金共新臺幣 150 萬元,甲公司開立未載明受款人之支票交付之", "D": "甲公司償還銀行貸款本息新臺幣 300 萬元,約定由公司之支票存款帳戶直接扣款轉帳"}, "answer": "C", "note": ""}, {"id": "bookkeeping-115-30", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 30, "question": "AI 股份有限公司為一股票上市公司,近期執行庫藏股買回計畫,自資本市場收回已發行之普通股股\n票 100 萬股,買進總成本計新臺幣 10 億元,該批股票之總面額為 1,000 萬元。該批股票目前尚未再\n出售或註銷。依據商業會計處理準則第 31 條規定,針對該批庫藏股票之會計處理,下列何者正確?", "options": {"A": "應按股票面額 1,000 萬元入帳,列為「股本」之減項,並註明收回 100 萬股", "B": "應按股票面額 1,000 萬元入帳,列為「權益」之減項,並註明收回 100 萬股", "C": "應按買進成本 10 億元入帳,列為「權益」之減項,並註明收回 100 萬股", "D": "應按買進成本 10 億元入帳,列為「股本」之減項,並註明收回 100 萬股"}, "answer": "C", "note": ""}, {"id": "bookkeeping-115-31", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 31, "question": "A 貨運公司本月份向 B 汽車公司購入 2 輛同款小貨車,其中一輛備供營業銷售使用,另一輛則留供\n公司內部送貨使用。依據商業會計法,關於此兩輛汽車之會計科目分類與後續資產重估價(或重估增\n值)之處理,下列敘述何者正確?", "options": {"A": "兩輛汽車皆應帳列「存貨」,且皆不得辦理資產重估", "B": "兩輛汽車皆應帳列「運輸設備」,且皆得依規定辦理資產重估", "C": "備供銷售者應帳列「存貨」,內部送貨用者應帳列「運輸設備」,且兩輛汽車皆得辦理資產重估", "D": "備供銷售者應帳列「存貨」且不得辦理資產重估;內部送貨用者應帳列「運輸設備」,且得依規定\n辦理資產重估"}, "answer": "D", "note": ""}, {"id": "bookkeeping-115-32", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 32, "question": "公司法第 18 條規定,公司名稱專用權之敘述,下列何者正確?", "options": {"A": "公司名稱,應使用我國文字,且不得使用外語譯音", "B": "二公司名稱中標明不同業務種類或可資區別之文字者,仍視為相同", "C": "公司不得使用易於使人誤認其與其他一般團體有關之名稱", "D": "經解散、撤銷或廢止登記之公司,自解散、撤銷或廢止登記之日起,逾十年未清算完結,或經宣告\n破產之公司,自破產登記之日起,逾十年未獲法院裁定破產終結者,其公司名稱得為他人申請核准\n使用,不受第 18 條第 1 項規定之限制"}, "answer": "D", "note": ""}, {"id": "bookkeeping-115-33", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 33, "question": "根據商業會計處理準則第 15 條有關流動資產的規範,下列關於「應收票據」與「應收帳款」的會計\n處理與揭露規定,何者錯誤?", "options": {"A": "金額重大之應收關係人票據與應收關係人帳款,皆應單獨列示", "B": "已提供擔保之應收票據與應收帳款,皆應於財務報表予以揭露", "C": "因營業而發生之應收票據,應與非因營業而發生之應收票據分別列示", "D": "資產負債表日皆應評估無法收回應收票據與應收帳款之金額,並應予揭露"}, "answer": "D", "note": ""}, {"id": "bookkeeping-115-34", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 34, "question": "依行政程序法之規定,關於行政處分方式之敘述,下列何者正確?", "options": {"A": "行政處分以書面作成為必要", "B": "法令無特別規定時,行政處分可以言詞方式作成", "C": "行政處分如無書面,任何人皆可請求作成書面", "D": "以書面以外的方式所為之行政處分,經相對人請求作成書面時,行政機關均不得拒絕"}, "answer": "B", "note": ""}, {"id": "bookkeeping-115-35", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 35, "question": "依行政程序法規定,關於行政處分之更正,下列敘述何者錯誤?", "options": {"A": "行政處分之更正,應於訴願程序終結前為之", "B": "行政處分有誤寫、誤算或其他類此之顯然錯誤情形者,處分機關得更正之", "C": "行政處分之更正,得由處分機關依申請為之", "D": "行政處分之更正,應附記於原處分書及其正本;如不能附記者,應製作更正書,以書面通知相對人\n及已知之利害關係人"}, "answer": "A", "note": ""}, {"id": "bookkeeping-115-36", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 36, "question": "商業負責人、主辦及經辦會計人員或依法受託代他人處理會計事務之人員有下列那一項情事,不會處\n五年以下有期徒刑、拘役或科或併科新臺幣六十萬元以下罰金?", "options": {"A": "以明知為不實之事項,而填製會計憑證或記入帳冊", "B": "故意使應保存之會計憑證、會計帳簿報表滅失毀損", "C": "違反商業會計法第六章、第七章規定,編製內容顯不確實之決算報表", "D": "偽造或變造會計憑證、會計帳簿報表內容或毀損其頁數"}, "answer": "C", "note": ""}, {"id": "bookkeeping-115-37", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 37, "question": "甲先生為公司負責人,欲以資本額 1,000 萬在臺南市安平區設立公司從事業務,須向那一個主管機關\n辦理公司設立登記才能成立?", "options": {"A": "經濟部", "B": "財政部", "C": "南區國稅局", "D": "臺南市政府"}, "answer": "D", "note": ""}, {"id": "bookkeeping-115-38", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 38, "question": "關於公司負責人,下列敘述何者正確?", "options": {"A": "有限公司之發起人", "B": "有限公司之董事", "C": "有限公司之重整監督人", "D": "股份有限公司之股東"}, "answer": "B", "note": ""}, {"id": "bookkeeping-115-39", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 39, "question": "依據公司法規定,有關公司權利能力之限制,下列敘述何者正確?", "options": {"A": "公司若為他公司無限責任股東或合夥事業之合夥人,需經過股東特別決議", "B": "公司負責人違反公司法或章程之規定而為轉投資時,由轉投資公司負損害賠償責任", "C": "有限公司為國內其他公司之有限責任股東,轉投資金額原則上不得超過本公司實收資本額的 40%", "D": "公司會計項目「股東往來」為借方餘額時,適用公司法第 15 條規定"}, "answer": "D", "note": ""}, {"id": "bookkeeping-115-40", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 40, "question": "依公司法規定,股份有限公司經理人的委任、解任及報酬應由下列何者決定?", "options": {"A": "董事會", "B": "股東會", "C": "董事長", "D": "監察人"}, "answer": "A", "note": ""}, {"id": "bookkeeping-115-41", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 41, "question": "主管機關依職權廢止公司登記,除命令解散或裁定解散外,應定多久期間催告公司負責人聲明異議?", "options": {"A": "15 日", "B": "20 日", "C": "30 日", "D": "45 日"}, "answer": "C", "note": ""}, {"id": "bookkeeping-115-42", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 42, "question": "依現行公司法第 393 條規定,公司下列登記事項主管機關應予公開,任何人得向主管機關申請查閱、\n抄錄或複製,惟不包含下列何者?", "options": {"A": "執行業務或代表公司之股東與董事、監察人姓名及持股", "B": "協力廠商或主要客戶資料", "C": "有無複數表決權特別股、對於特定事項具否決權特別股", "D": "資本總額或實收資本額"}, "answer": "B", "note": ""}, {"id": "bookkeeping-115-43", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 43, "question": "甲股份有限公司為公開發行股票之公司,乙公司與丙公司皆為甲公司之法人股東。今甲公司召開股東會\n進行董事及監察人改選。依據公司法及相關法令規定,下列關於法人股東當選董監事之敘述,何者錯誤?", "options": {"A": "乙公司得直接以法人身分當選為甲公司之董事,但須指定自然人代表行使職務,且乙公司得依職務\n關係隨時改派該代表補足原任期", "B": "乙公司不得自己以法人身分當選為甲公司董事之同時,又推派其代表人以自然人身分當選為甲公司\n之董事", "C": "丙公司若以自然人代表人身分參選,當代表人有數人時,得同時當選或擔任為甲公司之董事及監察人", "D": "丙公司得由其自然人代表人當選為甲公司之董事,該當選之代表不受董事任期之絕對保障,丙公司\n得依職務關係隨時改派補足原任期"}, "answer": "C", "note": ""}, {"id": "bookkeeping-115-44", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 44, "question": "老王想創業當老闆,但應留意公司或商業於完成設立登記後,其營運管理均須遵循新修正之公司法及\n商業登記法規範,下列何者非民國 114 年 12 月 26 日所修正的事項?", "options": {"A": "公司或商業於申請設立登記後,應參加各級政府機關或其指定非營利組織辦理之勞動權益講習", "B": "為強化雇主防詐意識,公司或商業於設立登記後應參加各級政府機關或其指定非營利組織辦理之防\n止詐騙講習", "C": "中央主管機關應於其資訊網站註記公司或商業參加勞動權益講習與否之情形", "D": "115 年 6 月 26 日施行"}, "answer": "B", "note": ""}, {"id": "bookkeeping-115-45", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 45, "question": "甲手搖飲料店以獨資商號型態設立,總號設於臺北市。因應業務擴展,擬於高雄市鳳山區設立一處分\n支機構(分店)。依商業登記法規定,關於該鳳山分店之「分支機構登記」,下列敘述何者正確?", "options": {"A": "應向財政部高雄國稅局鳳山分局申請", "B": "應向高雄市政府申請", "C": "應向臺北市政府辦理總號變更登記即可", "D": "應向經濟部商業發展署申請"}, "answer": "B", "note": ""}, {"id": "bookkeeping-115-46", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 46, "question": "依據記帳士職業倫理道德規範,下列何者不是記帳士應遵守的基本原則?", "options": {"A": "信賴", "B": "誠正", "C": "保密", "D": "務實"}, "answer": "A", "note": ""}, {"id": "bookkeeping-115-47", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 47, "question": "依記帳士職業倫理道德規範,記帳士於執行業務時,應避免接受可能損害或被視為損害專業判斷之特\n殊利益,此係符合下列何項行為準則?", "options": {"A": "信賴", "B": "務實", "C": "保密", "D": "適任"}, "answer": "B", "note": ""}, {"id": "bookkeeping-115-48", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 48, "question": "依記帳士職業倫理道德規範,記帳士於執行業務時,應謹慎使用及保護其在執行業務過程中所獲得之\n資訊,此係符合下列何項準則?", "options": {"A": "基本原則之保密", "B": "行為準則之適任", "C": "基本原則之務實", "D": "行為準則之保密"}, "answer": "D", "note": ""}, {"id": "bookkeeping-115-49", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 49, "question": "李記帳士受甲公司委任處理商業會計事務及稅務申報。某日,甲公司負責人因公司虧損且急需向銀行\n申請融資,遂授意李記帳士協助「調整」財務報表,將部分營業費用遞延以美化帳面。李記帳士拒絕\n配合,並堅持必須依照商業會計法及現行會計準則如實入帳。甲公司負責人便威脅將全面終止委任且\n拒付已完成的稅務申報酬金。李記帳士不為所動,仍依據真實憑證編製報表,並依規定處理後續。關\n於李記帳士之行為,下列符合記帳士職業倫理道德規範之敘述何者正確?", "options": {"A": "李記帳士依據真實憑證編製報表符合「基本原則之公正客觀」;而其不畏懼甲公司負責人威脅終止\n委任及扣留酬金,獨立客觀執行業務,則符合「行為準則之獨立性」", "B": "李記帳士拒絕配合造假,符合倫理規範中「行為準則之誠正」", "C": "李記帳士不受終止委任且拒付已完成的稅務申報酬金的威脅,符合「基本原則之保密」", "D": "李記帳士不為所動,依法拒絕配合造假,符合「基本原則之適任」"}, "answer": "B", "note": ""}, {"id": "bookkeeping-115-50", "year": "115", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 50, "question": "張記帳士於每年五月份所得稅結算申報期間,秉持服務精神,積極參與財政部國稅局的納稅服務,協助民眾\n完成報稅作業並提供相關稅務諮詢,張記帳士的行為主要符合記帳士職業倫理道德規範下列那一項準則?", "options": {"A": "保密行為準則", "B": "誠正行為準則", "C": "務實行為準則", "D": "適任行為準則"}, "answer": "C", "note": ""}, {"id": "tax-115-1", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 1, "question": "依照稅捐稽徵法第 1 條之 1,有關解釋函令效力和稅務違章案件裁罰規定,下列敘述何者錯誤?", "options": {"A": "財政部依稅捐稽徵法或稅法所發布之解釋函令,對於據以申請之案件發生效力。但有利於納稅義務\n人者,對於尚未核課確定案件適用之", "B": "財政部發布解釋函令,變更已發布解釋函令之法令見解,如不利於納稅義務人者,自發布日起或財\n政部指定之將來一定期日起,發生效力", "C": "財政部發布解釋函令,變更已發布解釋函令之法令見解,如不利於納稅義務人者,於發布日或財政\n部指定之將來一定期日前,應核課而未核課之稅捐,不適用該變更後之解釋函令", "D": "財政部發布之稅務違章案件裁罰金額或倍數參考表變更時,有利於納稅義務人者,對於已核課確定\n之案件適用之"}, "answer": "D", "note": ""}, {"id": "tax-115-2", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 2, "question": "有關稅捐稽徵法對於核課期間之規定,下列敘述何者錯誤?", "options": {"A": "依法應由納稅義務人申報繳納之稅捐,已在規定期間內申報,且無故意以詐欺或其他不正當方法逃\n漏稅捐者,核課期間為 5 年,自申報日起算", "B": "依法應由納稅義務人申報繳納之稅捐,未在規定期間內申報,或故意以詐欺或其他不正當方法逃漏\n稅捐者,核課期間為 7 年,自規定申報期間屆滿日起算", "C": "依法應由稅捐稽徵機關依稅籍底冊或查得資料核定之稅捐,其核課期間為 5 年,自該稅捐所屬徵期\n屆滿之翌日起算", "D": "依法應由納稅義務人實貼之印花稅,核課期間為 5 年,自依法應貼用印花稅票日起算"}, "answer": "B", "note": ""}, {"id": "tax-115-3", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 3, "question": "納稅義務人符合稅捐稽徵法第 26 條之 1 規定,不能於法定期間內繳清稅捐者,得於規定納稅期限內,\n向稽徵機關申請分期繳納,若應繳稅款個人在新臺幣多少元以上,營利事業在新臺幣多少元以上,稅\n捐稽徵機關得要求納稅義務人提供相當擔保?", "options": {"A": "個人:50 萬元,營利事業:100 萬元", "B": "個人:100 萬元,營利事業:150 萬元", "C": "個人:100 萬元,營利事業:200 萬元", "D": "個人:150 萬元,營利事業:300 萬元"}, "answer": "C", "note": ""}, {"id": "tax-115-4", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 4, "question": "依照稅捐稽徵法第 31 條規定,納稅義務人對逃漏那些稅捐涉有犯罪嫌疑之案件,稽徵機關得敘明事\n由,聲請當地司法機關簽發搜索票後,會同當地警察或自治人員,進入藏置帳簿、文件或證物之處所,\n實施搜查?1所得稅 2房屋稅 3營業稅 4印花稅", "options": {"A": "僅12", "B": "僅13", "C": "123", "D": "134"}, "answer": "B", "note": ""}, {"id": "tax-115-5", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 5, "question": "依稅捐稽徵法第 21 條規定,稅捐核課期間屆滿時,因天災、事變或不可抗力之事由致未能作成核定\n稅捐處分者,自妨礙事由消滅之日起算,最長於多久期間內,其時效不完成?", "options": {"A": "1 個月", "B": "3 個月", "C": "6 個月", "D": "1 年"}, "answer": "C", "note": ""}, {"id": "tax-115-6", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 6, "question": "稅捐稽徵法第 35 條規定,納稅義務人對於核定稅捐之處分如有不服,依核定稅額通知書載有應補徵\n稅額者,應於繳款書送達後,於繳納期間屆滿之翌日起幾天內,申請復查?", "options": {"A": "10 天", "B": "15 天", "C": "20 天", "D": "30 天"}, "answer": "D", "note": ""}, {"id": "tax-115-7", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 7, "question": "依現行所得稅法相關規定,自 113 年 1 月 1 日起,納稅義務人扶養幾歲以下的子女,可自綜合所得總\n額中減除幼兒學前特別扣除額,第一名子女可減除幼兒學前特別扣除額金額為何?", "options": {"A": "5 歲,15 萬元", "B": "5 歲,18 萬元", "C": "6 歲,15 萬元", "D": "6 歲,18 萬元"}, "answer": "C", "note": ""}, {"id": "tax-115-8", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 8, "question": "甲死亡後遺有土地、房屋及未繳稅款,土地另設有銀行抵押權,並有普通債權人主張債權。繼承人準\n備分割遺產並清償債務,下列敘述何者正確?", "options": {"A": "納稅義務人死亡後,其欠繳稅捐即不再徵收", "B": "繼承人得先分割遺產,再依各自取得遺產的比例清償欠稅", "C": "繼承人應按法定受清償順序繳清欠稅後,始得分割遺產", "D": "繼承人應先清償所有普通債權,再繳納欠稅"}, "answer": "C", "note": ""}, {"id": "tax-115-9", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 9, "question": "依現行所得稅法第 17 條規定,下列那些受納稅義務人扶養之親屬,免稅額可增加百分之五十?195\n歲的父親 280 歲岳母 371 歲哥哥 419 歲的弟弟 512 歲的兒子 65 歲姪子", "options": {"A": "僅12", "B": "123", "C": "125", "D": "1245"}, "answer": "C", "note": ""}, {"id": "tax-115-10", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 10, "question": "甲君 114 年度薪資收入總額 3,000,000 元,當年度發生與提供勞務直接相關且由所得人負擔的必要費\n用如下:職業專用服裝費 100,000 元、進修訓練費 120,000 元、交通支出 50,000 元;114 年度薪資所\n得特別扣除額 218,000 元。採最利於甲君之方式計算,114 年度之薪資所得金額為下列何者?", "options": {"A": "2,670,000 元", "B": "2,720,000 元", "C": "2,760,000 元", "D": "2,782,000 元"}, "answer": "D", "note": ""}, {"id": "tax-115-11", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 11, "question": "甲納稅義務人扶養配偶與一個未成年女兒,115 年度甲和所有受扶養親屬的健保費共 42,000 元,勞工\n保險費 15,000 元;健保以外人身保險費每人每年各 30,000 元。試問甲 116 年 5 月申報 115 年度綜合\n所得稅時,可列舉扣除的保險費金額?", "options": {"A": "114,000 元", "B": "129,000 元", "C": "132,000 元", "D": "147,000 元"}, "answer": "B", "note": ""}, {"id": "tax-115-12", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 12, "question": "甲於 108 年 1 月 1 日購入一棟不動產,持有 2 年後過世,由其配偶乙繼承該不動產。乙持有 5 年後過\n世,由其兒子丙繼承,丙持有滿 4 年後將該不動產出售。依現行所得稅法相關規定,丙出售該不動產,\n計算房地合一稅時,持有期間以幾年計算?", "options": {"A": "4 年", "B": "7 年", "C": "9 年", "D": "11 年"}, "answer": "D", "note": ""}, {"id": "tax-115-13", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 13, "question": "甲個人於 110 年 3 月 1 日以 1,200 萬元購入一棟不動產,並於當日辦妥所有權移轉登記,113 年 7 月\n1 日出售並辦理所有權移轉登記,成交價 1,800 萬元,未提示因取得、改良及移轉而支付之費用。依\n土地稅法第 30 條第 1 項規定公告土地現值計算之土地漲價總數額為 200 萬元,試問甲應繳納房地合\n一稅金額(提示:持有房屋、土地之期間超過二年,未逾五年者,稅率為 35%)?", "options": {"A": "69.2 萬元", "B": "80 萬元", "C": "121.1 萬元", "D": "129.5 萬元"}, "answer": "D", "note": ""}, {"id": "tax-115-14", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 14, "question": "個人出售符合房地合一課稅規定的房屋、土地,不論有無應納稅額,應於房屋、土地所有權移轉登記\n日之次日起算幾日內自行填具申報書,檢附相關文件,向該管稽徵機關辦理申報?", "options": {"A": "10 日", "B": "15 日", "C": "20 日", "D": "30 日"}, "answer": "D", "note": ""}, {"id": "tax-115-15", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 15, "question": "下列何者非屬所得稅法明定依物價指數調整的扣除額?", "options": {"A": "標準扣除額", "B": "身心障礙特別扣除額", "C": "保險費列舉扣除上限金額", "D": "薪資所得特別扣除額"}, "answer": "C", "note": ""}, {"id": "tax-115-16", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 16, "question": "依照營利事業所得稅查核準則規定,營利事業承包之工程工期在一年以上,但歸屬於合約之成本無法\n辨認,得採何種方法,計算工程損益?", "options": {"A": "完工比例法", "B": "全部完工法", "C": "成本回收法", "D": "工程進度比例法"}, "answer": "C", "note": ""}, {"id": "tax-115-17", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 17, "question": "依照統一發票使用辦法第 15 條規定,營業人每筆銷售額與銷項稅額合計未滿新臺幣多少元之交易,\n除買受人要求者外,得免逐筆開立統一發票?", "options": {"A": "10 元", "B": "20 元", "C": "30 元", "D": "50 元"}, "answer": "D", "note": ""}, {"id": "tax-115-18", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 18, "question": "下列關於營利事業所得稅申報與扣繳制度之敘述,何者正確?", "options": {"A": "營利事業上年度結算申報營利事業所得稅應納稅額之二分之一在新臺幣 5,000 元以下者,得免辦理\n暫繳", "B": "營利事業若上一年度無應納稅額者,仍一律必須辦理暫繳申報", "C": "自 114 年 1 月 1 日起施行之所得稅法修正規定,將扣繳義務人改為事業或公司組織本身,不再是公\n司負責人個人", "D": "若扣繳義務人逾期未扣繳,罰則處罰對象僅為公司之法定代理人個人"}, "answer": "C", "note": ""}, {"id": "tax-115-19", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 19, "question": "依照所得基本稅額條例相關規定,基本所得額減除法定之扣除金額後乘以徵收率為基本稅額。試問營\n利事業基本稅額之稅率區間為下列何者?", "options": {"A": "最低不得低於 10%,最高不得超過 15%", "B": "最低不得低於 10%,最高不得超過 20%", "C": "最低不得低於 12%,最高不得超過 15%", "D": "最低不得低於 12%,最高不得超過 20%"}, "answer": "C", "note": ""}, {"id": "tax-115-20", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 20, "question": "根據營利事業所得稅不合常規移轉訂價查核準則第 11 條規定,下列何者非屬適用於無形資產移轉及\n使用之常規交易方法?", "options": {"A": "可比較未受控交易法", "B": "利潤分割法", "C": "再售價格法", "D": "收益法"}, "answer": "C", "note": ""}, {"id": "tax-115-21", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 21, "question": "依照營利事業所得稅查核準則相關規定,營利事業為員工投保之團體人壽保險,以被保險員工為受益\n人,營利事業負擔之保險費,每人每月保險費合計在多少元以內部分,免視為被保險員工之薪資所得;\n超過部分,視為對員工之補助費,應轉列為被保險員工之何種所得?", "options": {"A": "2,000 元;薪資所得", "B": "2,000 元;其他所得", "C": "3,000 元;薪資所得", "D": "3,000 元;其他所得"}, "answer": "A", "note": ""}, {"id": "tax-115-22", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 22, "question": "依照營利事業所得稅查核準則相關規定,有關呆帳損失之提列,下列敘述何者錯誤?", "options": {"A": "提列備抵呆帳,以應收帳款及應收票據為限,不包括已貼現之票據", "B": "債權中有逾期 2 年,經催收後,未經收取本金或利息者,視為實際發生呆帳損失", "C": "分期付款銷貨採毛利百分比法計算損益者,其應收債權,不得提列備抵呆帳", "D": "分期付款銷貨採普通銷貨法計算損益者,其分期付款售價與成本之差額部分之債權,不得提列備抵呆帳"}, "answer": "D", "note": ""}, {"id": "tax-115-23", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 23, "question": "依照營利事業所得稅查核準則相關規定,經營小客車租賃業務之營利事業,115 年新購置營業用乘人\n小客車,其計提折舊之成本限額為何?", "options": {"A": "150 萬元", "B": "250 萬元", "C": "350 萬元", "D": "500 萬元"}, "answer": "D", "note": ""}, {"id": "tax-115-24", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 24, "question": "甲公司經營食品買賣業務,114 年 3 月 1 日購入乘人小客車一部,購入成本 400 萬元,耐用年限 5 年,\n殘值 50 萬元。試問依營利事業所得稅查核準則相關規定,115 年度該乘人小客車可認列折舊金額為何?", "options": {"A": "43.75 萬元", "B": "58.33 萬元", "C": "61.25 萬元", "D": "70 萬元"}, "answer": "A", "note": ""}, {"id": "tax-115-25", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 25, "question": "依照營利事業所得稅查核準則相關規定,有關利息之認列,下列敘述何者錯誤?", "options": {"A": "非營業所必須之借款利息,不予認定", "B": "資本利息為盈餘之分配,不得列為費用或損失", "C": "各種稅法規定加計之滯納利息,不得以費用列支", "D": "因房屋、土地以外進貨借款所支付之利息,應以財務費用列支"}, "answer": "C", "note": ""}, {"id": "tax-115-26", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 26, "question": "個人和營利事業(非起造人)出售符合房地合一課稅之房屋、土地,其房地合一稅課稅方式,下列敘\n述何者正確?", "options": {"A": "個人和營利事業都採分離課稅", "B": "個人和營利事業都採分開計稅合併報繳", "C": "個人採分離課稅,營利事業採分開計稅合併報繳", "D": "個人採分開計稅合併報繳,營利事業採分離課稅"}, "answer": "C", "note": ""}, {"id": "tax-115-27", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 27, "question": "甲公司成立於 114 年 9 月 1 日並開始營業,採曆年制,年底結算其課稅所得額為 50,000 元,試問甲\n公司 114 年度營利事業所得稅應納稅額為何?", "options": {"A": "0 元", "B": "5,000 元", "C": "8,500 元", "D": "10,000 元"}, "answer": "B", "note": ""}, {"id": "tax-115-28", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 28, "question": "營利事業列報交通費時,應依規定取得合法原始憑證。下列報支的交通費中,何者並不符合營利事業\n所得稅查核準則第 74 條規定?", "options": {"A": "專案人員搭乘計程車前往客戶廠區,因司機無法開立發票,改由出差人填具經手人證明核實認列", "B": "行銷主管駕駛自己的轎車行經 ETC 車道,至外縣市參展,其支付之通行費以經手人證明為憑核實\n認列", "C": "總經理搭乘高速鐵路當日往返臺北與高雄拜訪重要供應商,因回程票根遺失,改以經手人證明報支\n該趟往返高鐵車資", "D": "研發工程師搭乘國內航線飛機前往澎湖進行現地測試,因回程登機證遺失,直接以經手人(即工程\n師本人)之切結證明作為唯一原始憑證報銷"}, "answer": "D", "note": ""}, {"id": "tax-115-29", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 29, "question": "某生鮮超市銷售一批依法免徵營業稅的未加工生鮮蔬菜,金額為新臺幣$10,000 元。請問該超市在開\n立統一發票與申報營業稅時,下列做法何者正確?", "options": {"A": "發票課稅別勾選「應稅」,銷項稅額填$500,並按 5%申報繳納營業稅", "B": "發票課稅別勾選「免稅」,銷項稅額填$0,並申報為免稅銷售額", "C": "發票課稅別勾選「零稅率」,銷項稅額填$0,且完全不需要向國稅局申報", "D": "發票課稅別勾選「免稅」,銷項稅額填$500,但申報時可全額申請全數退還"}, "answer": "B", "note": ""}, {"id": "tax-115-30", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 30, "question": "乙與配偶於 115 年度至非健保特約的人工生殖機構進行試管嬰兒療程;該機構是衛生福利部人工生殖\n技術補助方案的特約機構,且本次療程已獲主管機關核准補助。經計算,當年度支付療程費用共\n480,000 元,其中 30,000 元為營養補充品;政府補助 120,000 元,另有 50,000 元由保險給付。乙於申\n報 115 年度綜合所得稅時,關於人工生殖支出部分,得列舉扣除的醫藥及生育費為何?", "options": {"A": "0 元", "B": "280,000 元", "C": "360,000 元", "D": "480,000 元"}, "answer": "B", "note": ""}, {"id": "tax-115-31", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 31, "question": "適用加值型及非加值型營業稅法相關規定,計算一般稅額之營業人,其進項稅額憑證,未於當期申報\n者,得延至次期申報扣抵。次期仍未申報者,應於申報扣抵當期敘明理由。但進項稅額憑證之申報扣\n抵期間以幾年為限?", "options": {"A": "1 年", "B": "3 年", "C": "5 年", "D": "10 年"}, "answer": "D", "note": ""}, {"id": "tax-115-32", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 32, "question": "依照加值型及非加值型營業稅法規定,為因應經濟特殊情況,調節物資供應,對進口那些貨物應徵之\n營業稅,得由行政院機動調整?1小麥 2稻米 3玉米 4大麥 5黃豆", "options": {"A": "僅124", "B": "僅135", "C": "1245", "D": "1345"}, "answer": "D", "note": ""}, {"id": "tax-115-33", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 33, "question": "依加值型及非加值型營業稅法規定,有關營業稅課徵稅率,下列敘述何者錯誤?", "options": {"A": "銷售農產品之小規模營業人營業稅稅率 1%", "B": "證券業經營專屬本業之銷售額營業稅率 2%", "C": "夜總會、有娛樂節目之特種飲食業營業稅稅率 15%", "D": "銀行業經營專屬本業之銷售額營業稅率 5%"}, "answer": "A", "note": ""}, {"id": "tax-115-34", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 34, "question": "依加值型及非加值型營業稅法第 19 條規定,下列有關進項稅額扣抵規定,何者錯誤?", "options": {"A": "酬勞員工個人之貨物或勞務,其進項稅額不得扣抵", "B": "為協助國防建設使用之貨物或勞務,其進項稅額可以扣抵", "C": "非供本業及附屬業務使用之貨物或勞務,其進項稅額不得扣抵", "D": "營業人專營第 8 條免稅貨物或勞務,其進項稅額得申請退還"}, "answer": "D", "note": ""}, {"id": "tax-115-35", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 35, "question": "依加值型及非加值型營業稅法第 10 條規定,營業稅稅率最低不得少於 5%,最高不得超過下列何者?\n又其徵收率由那個機關決定?", "options": {"A": "7%;財政部", "B": "7%;行政院", "C": "10%;財政部", "D": "10%;行政院"}, "answer": "D", "note": ""}, {"id": "tax-115-36", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 36, "question": "依照加值型及非加值型營業稅法相關規定,查定計算營業稅額之小規模營業人,購買營業上使用之貨\n物,取得載有營業稅額之憑證,並依規定申報者,主管稽徵機關應按其進項稅額百分之多少,在查定\n稅額內扣減?", "options": {"A": "1%", "B": "5%", "C": "10%", "D": "20%"}, "answer": "C", "note": ""}, {"id": "tax-115-37", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 37, "question": "依照加值型及非加值型營業稅法相關規定,為防止逃漏、控制稅源及促進統一發票之推行,財政部應\n訂定統一發票給獎辦法;其經費由全年營業稅收入總額中提出多少百分比,以資支應?", "options": {"A": "1%", "B": "3%", "C": "5%", "D": "10%"}, "answer": "B", "note": ""}, {"id": "tax-115-38", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 38, "question": "依照加值型及非加值型營業稅法相關規定,有關營業稅之報繳,下列敘述何者錯誤?", "options": {"A": "查定計算營業稅額之小規模營業人,由主管稽徵機關查定銷售額及稅額,每三個月填發繳款書通知\n繳納一次", "B": "營業人銷售或貨物適用零稅率者,得申請以每個月為一期,於次月 15 日前申報營業稅", "C": "查定計算營業稅額之典當業,由主管稽徵機關查定銷售額及稅額,每三個月填發繳款書通知繳納一次", "D": "查定計算營業稅額之特種飲食業,由主管稽徵機關查定銷售額及稅額,每三個月填發繳款書通知繳\n納一次"}, "answer": "D", "note": ""}, {"id": "tax-115-39", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 39, "question": "依照加值型及非加值型營業稅法第 3 條規定,有關視為銷售貨物,下列敘述何者錯誤?", "options": {"A": "營業人銷售代銷貨物,視為銷售貨物", "B": "營業人委託他人代銷貨物,視為銷售貨物", "C": "營業人以委託人名義代為購買貨物交付委託人,視為銷售貨物", "D": "營業人以其購買供銷售之貨物,轉供營業人自用,視為銷售貨物"}, "answer": "C", "note": ""}, {"id": "tax-115-40", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 40, "question": "下列貨物或勞務之營業稅稅率何者為零?1外銷貨物 2醫院提供之醫療勞務 3銷售與保稅區營業人供營\n運之貨物 4銷售與國際運輸用船舶所使用之貨物 5依法設立之免稅商店銷售與過境或出境旅客之貨物", "options": {"A": "僅123", "B": "僅134", "C": "1245", "D": "1345"}, "answer": "D", "note": ""}, {"id": "tax-115-41", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 41, "question": "某大豆加工廠將原先免徵營業稅的生大豆銷售,向財政部申請核准放棄免稅,改為適用一般稅率,以\n便扣抵進項稅額。根據我國加值型及非加值型營業稅法規定,該加工廠經核准放棄免稅後,在下列期\n限內不得再申請變更、恢復為免稅?", "options": {"A": "自核准之日起 3 年內", "B": "自核准之日起 5 年內", "C": "自核准之日起 10 年內", "D": "自核准之日起 15 年內"}, "answer": "A", "note": ""}, {"id": "tax-115-42", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 42, "question": "關於我國加值型及非加值型營業稅法中零稅率與免稅之敘述,下列何者正確?", "options": {"A": "適用零稅率者,銷售額適用 0%稅率,進項稅額可以申請退還;適用免稅者,其銷售時免徵營業稅,\n進項稅額不得扣抵或退還", "B": "適用零稅率與適用免稅者,兩者在報繳營業稅時,其購進貨物所支付的進項稅額,皆可向財政部國\n稅局申請全額退還", "C": "適用零稅率與免稅的營業人,一律都不可以申請放棄其原有的應稅或免稅身分", "D": "適用零稅率者在銷售時不需要向海關或財政部國稅局申報銷售額;適用免稅者則必須每期按 5%稅\n率申報"}, "answer": "A", "note": ""}, {"id": "tax-115-43", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 43, "question": "依照統一發票使用辦法,有關免用或免開統一發票規定,下列敘述何者錯誤?", "options": {"A": "小規模營業人得免用或免開統一發票", "B": "醫院提供之醫療勞務得免用或免開統一發票", "C": "職業學校對外營業之實習商店,得免用或免開統一發票", "D": "營業人取得之賠償收入,得免用或免開統一發票"}, "answer": "C", "note": ""}, {"id": "tax-115-44", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 44, "question": "甲公司在 115 年 5 月底銷售貨物給乙公司,甲公司在開立三聯式統一發票時,不小心將金額 100,000 元\n誤寫為 10,000 元,且該發票已交付給乙公司。根據統一發票使用辦法與相關規定,甲公司應如何處理?", "options": {"A": "因為已經交付,甲公司無法收回作廢,只需在下個月(6 月)開立另一張 90,000 元的補差額發票給\n乙公司", "B": "直接在原發票存根聯、扣抵聯、收執聯上塗改錯誤金額,並由開立人加蓋負責人印章", "C": "由買受人(乙公司)在其留存的發票扣抵聯與收執聯上,將金額塗改後蓋上乙公司發票章", "D": "應收回原發票的扣抵聯及收執聯,註明「作廢」字樣並黏貼於存根聯上,另行開立一張正確金額的\n發票交付乙公司"}, "answer": "D", "note": ""}, {"id": "tax-115-45", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 45, "question": "依現行遺產及贈與稅法第 6 條規定,遺產稅納稅義務人包括下列何者?1遺囑執行人 2繼承人 3\n受遺贈人 4遺產管理人", "options": {"A": "僅23", "B": "僅123", "C": "僅234", "D": "1234"}, "answer": "C", "note": ""}, {"id": "tax-115-46", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 46, "question": "依現行遺產及贈與稅法第 23 條規定,被繼承人死亡遺有財產者,納稅義務人應於多久的時間內,向\n戶籍所在地主管稽徵機關辦理遺產稅申報?", "options": {"A": "被繼承人死亡之日起算三個月內", "B": "被繼承人死亡之次日起算三個月內", "C": "被繼承人死亡之日起算六個月內", "D": "被繼承人死亡之次日起算六個月內"}, "answer": "D", "note": ""}, {"id": "tax-115-47", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 47, "question": "依現行遺產及贈與稅法第 30 條規定,遺產稅納稅義務人確有困難,不能一次繳納現金時,得於納稅\n期限,向稽徵機關申請分期繳納或實物抵繳,試問申請分期繳納或實物抵繳,其應納稅額規定各為何?", "options": {"A": "分期繳納與實物抵繳之應納稅額皆為 30 萬元以上", "B": "分期繳納:應納稅額沒有限額規定;實物抵繳:應納稅額 30 萬元以上", "C": "分期繳納:應納稅額 30 萬元以上;實物抵繳:應納稅額沒有限額規定", "D": "分期繳納與實物抵繳之應納稅額皆為 50 萬元以上"}, "answer": "B", "note": ""}, {"id": "tax-115-48", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 48, "question": "甲於 115 年 9 月 25 日死亡,遺有配偶乙和 3 名成年子女,配偶乙拋棄繼承。甲被繼承人遺產總額\n4,000 萬,其中包括死亡前 1 年贈與配偶乙之現金 1,500 萬。被繼承人甲遺產稅應納稅額 236 萬,試\n問其配偶乙應負擔遺產稅金額為何?", "options": {"A": "0 元", "B": "59 萬元", "C": "88.5 萬元", "D": "118 萬元"}, "answer": "C", "note": ""}, {"id": "tax-115-49", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 49, "question": "根據遺產及贈與稅法第 17 條之 1 規定,計算配偶剩餘財產差額分配請求權扣除數額時,被繼承人死\n亡前 2 年內贈與配偶之財產,法律上應如何歸類處理?", "options": {"A": "視為被繼承人之現存財產", "B": "視為配偶之婚後特有財產", "C": "直接免予計入遺產總額且不納入差額分配計算", "D": "視為配偶之無償取得財產,直接列為請求權之扣除項目"}, "answer": "A", "note": ""}, {"id": "tax-115-50", "year": "115", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 50, "question": "為防範科技新貴「假買賣、真贈與」,財政部國稅局導入大數據嚴查二親等財產移轉。某 AI 半導體廠\n總經理將名下 2,000 萬元股票過戶給 26 歲兒子並申報為買賣。依遺產及贈與稅法規定,下列何種情\n況可「免視同贈與」?", "options": {"A": "雙方簽訂契約,由父親允許兒子分期 20 年無息償還股款", "B": "股票完全係按照過戶當天的集中市場收盤價進行登記,無法提出支付價款給父親的證明", "C": "兒子能提出過去投資或工作等自行賺取之金流,且非由父親貸與或提供擔保", "D": "兒子過戶後立刻以該筆股票辦理質押貸款,並將貸款資金匯給父親作為股款"}, "answer": "C", "note": ""}];
const KEY='bookkeeperQuizV1';
let state={}; try { state=JSON.parse(localStorage.getItem(KEY)||'{}')||{}; } catch {}
state.wrong=state.wrong||{};state.fav=state.fav||{};state.seen=state.seen||{};state.history=state.history||[];
let session=null;
function save(){try { localStorage.setItem(KEY,JSON.stringify(state)); } catch {}updateCounts();}
function selectedSubjects(){return [...document.querySelectorAll('.subject-card.active')].map(x=>x.dataset.subject)}
function toggleSubject(el){el.classList.toggle('active'); if(!selectedSubjects().length) el.classList.add('active'); el.setAttribute('aria-pressed',el.classList.contains('active')); refreshEligible();}
function parseRange(s){if(!s.trim())return null;let set=new Set();for(const part of s.split(',')){let p=part.trim();if(!p)continue;if(p.includes('-')){let [a,b]=p.split('-').map(Number);if(Number.isFinite(a)&&Number.isFinite(b))for(let i=Math.max(1,Math.min(a,b));i<=Math.min(100,Math.max(a,b));i++)set.add(i)}else{let n=Number(p);if(Number.isFinite(n))set.add(n)}}return set}
function getPool(){let subs=selectedSubjects(),src=document.getElementById('source').value, r=parseRange(document.getElementById('range').value);let q=QUESTIONS.filter(x=>subs.includes(x.subject)&&(document.getElementById('year').value==='all'||x.year===document.getElementById('year').value));if(r)q=q.filter(x=>r.has(x.number));if(src==='wrong')q=q.filter(x=>state.wrong[x.id]);if(src==='fav')q=q.filter(x=>state.fav[x.id]);if(src==='unseen')q=q.filter(x=>!state.seen[x.id]);return q}
function refreshEligible(){document.getElementById('selectedPool').textContent=QUESTIONS.filter(x=>selectedSubjects().includes(x.subject)).length;document.getElementById('eligible').textContent='符合條件：'+getPool().length+' 題'}
['source','year','range'].forEach(id=>document.addEventListener('input',e=>{if(e.target.id===id)refreshEligible()}));
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(){let pool=getPool();if(!pool.length){alert('目前沒有符合條件的題目，請調整設定。');return}if(document.getElementById('shuffleQ').checked)pool=shuffle(pool);let c=document.getElementById('count').value;if(c!=='all')pool=pool.slice(0,Math.min(Number(c),pool.length));session={questions:pool,index:0,answers:{},checked:{},started:Date.now(),mode:document.getElementById('mode').value,shuffleO:document.getElementById('shuffleO').checked,optionOrders:{},minutes:Number(document.getElementById('minutes').value),timer:null};document.getElementById('home').style.display='none';document.getElementById('view').classList.remove('active');document.getElementById('quiz').classList.add('active');if(session.minutes)session.timer=setInterval(updateTimer,1000);document.getElementById('timer').textContent=''; if(session.minutes)updateTimer();renderQ();document.getElementById('quiz').scrollIntoView()}
function updateTimer(){let left=session.minutes*60-Math.floor((Date.now()-session.started)/1000);if(left<=0){clearInterval(session.timer);document.getElementById('timer').textContent='時間到，請完成剩餘題目';return}document.getElementById('timer').textContent='⏱ '+Math.floor(left/60)+':'+String(left%60).padStart(2,'0')}
function current(){return session.questions[session.index]}
function renderQ(){let q=current(),n=session.questions.length;document.getElementById('qIndex').textContent=`第 ${session.index+1} / ${n} 題`;document.getElementById('qMeta').textContent=`${q.year} 年｜${q.subjectName}｜原題第 ${q.number} 題`;document.getElementById('bar').style.width=((session.index+1)/n*100)+'%';document.getElementById('qText').innerHTML=escapeHtml(q.question)+paperLink(q);document.getElementById('favBtn').textContent=state.fav[q.id]?'★':'☆';document.getElementById('favBtn').classList.toggle('on',!!state.fav[q.id]);let keys=['A','B','C','D'];if(session.shuffleO&&!q.paper){if(!session.optionOrders[q.id])session.optionOrders[q.id]=shuffle(keys);keys=session.optionOrders[q.id]}let box=document.getElementById('options');box.innerHTML='';keys.forEach((orig,i)=>{let display=['A','B','C','D'][i],d=document.createElement('button');d.className='option';d.setAttribute('aria-pressed',session.answers[q.id]===orig);d.disabled=!!session.checked[q.id];d.dataset.value=orig;d.innerHTML=`<strong>${display}.</strong> ${escapeHtml(q.options[orig])}`;if(session.answers[q.id]===orig)d.classList.add('selected');if(session.mode==='practice'&&session.checked[q.id]){if(isCorrect(q,orig))d.classList.add('correct');if(session.answers[q.id]===orig&&!isCorrect(q,orig))d.classList.add('wrong')}d.onclick=()=>choose(orig);box.appendChild(d)});let fb=document.getElementById('feedback');fb.classList.remove('show');fb.innerHTML='';if(session.mode==='practice'&&session.checked[q.id])showFeedback();document.getElementById('submitOne').style.display=session.mode==='practice'?'inline-block':'none';document.getElementById('answered').textContent='已作答 '+Object.keys(session.answers).length+' / '+n+' 題';
document.getElementById('nextBtn').disabled=session.index===n-1&&!ready();
document.getElementById('submitOne').disabled=!session.answers[q.id]||!!session.checked[q.id];
document.getElementById('nextBtn').textContent=session.index===n-1?(session.mode==='exam'?'交卷':'完成練習'):'下一題'}
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function choose(v){let q=current();if(session.mode==='practice'&&session.checked[q.id])return;session.answers[q.id]=v;renderQ()}
function submitCurrent(){let q=current();if(!session.answers[q.id]){alert('請先選一個答案。');return}session.checked[q.id]=true;state.seen[q.id]=true;if(isCorrect(q,session.answers[q.id]))delete state.wrong[q.id];else state.wrong[q.id]=true;save();renderQ()}
function isCorrect(q, answer) {
  return !!answer && q.answer.includes(answer);
}
function paperLink(q) {
  if (!q.paper) return '';
  const scans = (q.images || []).map(src =>
    '<a class="scan" href="'+src+'" target="_blank" rel="noopener"><img loading="lazy" src="'+src+'" alt="試題原卷頁面，點選可放大"></a>'
  ).join('');
  return '<br><a target="_blank" rel="noopener" href="papers/'+q.year+'/'+encodeURIComponent(q.paper)+'">開啟完整試題 PDF</a>'+scans;
}
function ready() {
  const completed = session.mode === 'practice' ? session.checked : session.answers;
  return session.questions.every(q => completed[q.id]);
}
function goUnanswered() {
  const completed = session.mode === 'practice' ? session.checked : session.answers;
  const index = session.questions.findIndex(q => !completed[q.id]);
  session.index = index < 0 ? session.questions.length - 1 : index;
  renderQ();
}
function leaveQuiz() {
  if (Object.keys(session.answers).length && !confirm('返回設定會清除本次作答。確定返回？')) return;
  clearInterval(session.timer);
  session = null;
  closeView();
}
function answerDetails(q) {
  const order = session.optionOrders[q.id] || ['A','B','C','D'];
  const label = key => 'ABCD'[order.indexOf(key)] + '．' + escapeHtml(q.options[key]);
  const mine = session.answers[q.id];
  const note = q.note ? '<p>' + escapeHtml(q.note) + '</p>' : '';
  const explanation = q.explanation || {};
  return `<dl>
    <dt>我的答案</dt><dd class="${isCorrect(q,mine)?'answer-good':'answer-bad'}">${label(mine)}</dd>
    <dt>正確答案</dt><dd>${order.filter(key=>isCorrect(q,key)).map(label).join('<br>')}${note}</dd>
    <dt>解題說明</dt><dd>${escapeHtml(explanation.reason || '原卷只附標準答案，逐題解法尚未補上。')}</dd>
    <dt>名詞定義</dt><dd>${escapeHtml(explanation.terms || '尚未整理')}</dd>
    <dt>用到的公式</dt><dd>${escapeHtml(explanation.formulas || '尚未整理')}</dd>
  </dl>`;
}
function showFeedback() {
  const feedback = document.getElementById('feedback');
  feedback.classList.add('show');
  feedback.innerHTML = answerDetails(current());
}
function restartQuiz() {
  session = {...session, index:0, answers:{}, checked:{}, optionOrders:{}, started:Date.now(), finished:false, timer:null};
  document.getElementById('view').classList.remove('active');
  document.getElementById('quiz').classList.add('active');
  document.getElementById('timer').textContent='';
  if (session.minutes) {
    session.timer = setInterval(updateTimer,1000);
    updateTimer();
  }
  renderQ();
  document.getElementById('quiz').scrollIntoView();
}
function showReview() {
  const total = session.questions.length;
  const correct = session.questions.filter(q=>isCorrect(q,session.answers[q.id])).length;
  const items = session.questions.map((q,i) => {
    const order = session.optionOrders[q.id] || ['A','B','C','D'];
    const options = order.map(key=>'<li>'+escapeHtml(q.options[key])+'</li>').join('');
    return `<article class="review"><h3>${i+1}．民國 ${q.year} 年｜${q.subjectName}｜原題第 ${q.number} 題</h3>
    <p>${escapeHtml(q.question)}${paperLink(q)}</p>${q.paper?'':'<ol type="A">'+options+'</ol>'}${answerDetails(q)}</article>`;
  });
  document.getElementById('viewTitle').textContent='本次成績與逐題檢視';
  document.getElementById('viewBody').innerHTML=`<p><strong>${Math.round(correct/total*100)} 分</strong> · 答對 ${correct} / ${total} 題</p>
    <button class="primary" onclick="restartQuiz()">重做這份測驗</button>${items.join('')}`;
  document.getElementById('view').scrollIntoView();
}

function prevQ(){if(session.index>0){session.index--;renderQ()}}
function nextQ(){let q=current();if(session.mode==='practice'&&!session.checked[q.id]){alert('請先作答並按「確認答案」。');return}if(session.mode==='exam'&&session.index===session.questions.length-1){finishQuiz();return}if(session.mode==='practice'&&session.index===session.questions.length-1){finishQuiz();return}session.index++;renderQ()}
function toggleFavCurrent(){let q=current();if(state.fav[q.id])delete state.fav[q.id];else state.fav[q.id]=true;save();renderQ()}
function finishQuiz(){if(!session||session.finished||!ready())return;session.finished=true;if(session.timer)clearInterval(session.timer);let total=session.questions.length,correct=0,answered=0;for(const q of session.questions){let a=session.answers[q.id];if(a){answered++;state.seen[q.id]=true;if(isCorrect(q,a)){correct++;delete state.wrong[q.id]}else state.wrong[q.id]=true}}let score=Math.round(correct/total*100);state.history.unshift({time:new Date().toLocaleString('zh-TW'),total,answered,correct,score,mode:session.mode,subjects:[...new Set(session.questions.map(q=>q.subjectName))].join('＋')});state.history=state.history.slice(0,50);save();document.getElementById('quiz').classList.remove('active');document.getElementById('view').classList.add('active');document.getElementById('viewTitle').textContent='本次成績';showReview()}
function showView(type){document.getElementById('home').style.display='none';document.getElementById('quiz').classList.remove('active');document.getElementById('view').classList.add('active');if(type==='history'){document.getElementById('viewTitle').textContent='歷史成績';let rows=state.history.map(h=>`<tr><td>${h.time}</td><td>${h.subjects}</td><td>${h.mode==='exam'?'模擬考':'即時練習'}</td><td>${h.correct}/${h.total}</td><td><strong>${h.score}</strong></td></tr>`).join('');document.getElementById('viewBody').innerHTML=rows?`<table><thead><tr><th>時間</th><th>科目</th><th>模式</th><th>答對</th><th>分數</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="empty">尚無歷史成績</div>'}else{let ids=type==='wrong'?state.wrong:state.fav;let list=QUESTIONS.filter(q=>ids[q.id]);document.getElementById('viewTitle').textContent=type==='wrong'?'錯題本':'收藏題';document.getElementById('viewBody').innerHTML=list.length?list.map(q=>`<div style="padding:12px 0;border-bottom:1px solid #e4ebf4"><strong>${q.subjectName}｜第${q.number}題</strong><div style="margin-top:5px">${escapeHtml(q.question)}</div><div class="hint" style="margin-top:5px">答案：${q.answer}</div></div>`).join(''):'<div class="empty">目前沒有題目</div>'}}
function closeView(){document.getElementById('view').classList.remove('active');document.getElementById('quiz').classList.remove('active');document.getElementById('home').style.display='block';refreshEligible()}
function updateCounts(){document.getElementById('wrongCount').textContent=Object.keys(state.wrong).length;document.getElementById('favCount').textContent=Object.keys(state.fav).length}
