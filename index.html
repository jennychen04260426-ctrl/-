 "note": ""}, {"id": "bookkeeping-99-46", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 46, "question": "B 股份有限公司於向主管機關申請辦理登記時,未依規定提出所有應備文件,依公司法規定,下列敘述何\n者正確?", "options": {"A": "主管機關直接退回申請案,而不受理登記", "B": "主管機關於受理申請案後,應先限期令其改正補齊文件,於改正合法後,方予以登記", "C": "主管機關於受理申請案後,先予以登記,並限期令其改正補齊文件,未於期限內改正,則註銷其所申\n請之登記", "D": "主管機關於受理申請案後,得視缺失情況嚴重與否,決定是否先予以登記,或先令其改正補齊文件後\n再辦理登記"}, "answer": "B", "note": ""}, {"id": "bookkeeping-99-47", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 47, "question": "依公司法規定,主管機關應予公示於其資訊網站上供任何人得查閱之公司登記事項,不包括下列那一項?", "options": {"A": "公司章程", "B": "公司資本總額", "C": "監察人所持有之股數", "D": "董事長以外之其他董事的姓名"}, "answer": "A", "note": ""}, {"id": "bookkeeping-99-48", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 48, "question": "B 股份有限公司於向主管機關申請辦理發行新股變更登記時,依公司法相關規定,下列敘述何者正確?", "options": {"A": "可由 B 股份有限公司董事會授權公司任何一位經理或專任職員代理申請辦理變更登記", "B": "經由主管機關同意,可由 B 股份有限公司董事會授權任何有行為能力人代理申請辦理變更登記", "C": "B 股份有限公司雖可授權代理人申請辦理變更登記,但代理人資格以會計師或律師為限", "D": "B 股份有限公司不得授權他人代理申請辦理變更登記,而須由董事長申請辦理之"}, "answer": "C", "note": ""}, {"id": "bookkeeping-99-49", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 49, "question": "依公司法規定,經濟部應訂定關於受理公司各種業務的規費,而其所訂規費並未包括以下那一種?", "options": {"A": "審查費", "B": "認證費", "C": "抄錄費", "D": "登記費"}, "answer": "B", "note": ""}, {"id": "bookkeeping-99-50", "year": "99", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 50, "question": "B 股份有限公司於向主管機關申請辦理變更登記後,始發覺其向主管機關申請登記之內容,因主管機關之\n疏失而發生錯誤,則依公司法規定,下列敘述何者正確?", "options": {"A": "B 股份有限公司得向主管機關申請更正", "B": "B 股份有限公司應向主管機關申請更正", "C": "主管機關視疏失錯誤之情況嚴重與否,自行裁量決定是否進行更正", "D": "B 股份有限公司重新向主管機關申請辦理變更登記"}, "answer": "A", "note": ""}, {"id": "chinese-99-1", "year": "99", "subject": "chinese", "subjectName": "國文", "number": 1, "question": "~題\n 石器時代以後,中國人把古老的、用過好幾世紀的石斧、石刀供奉了起來;......整個商 周到春\n秋,中國人瘋狂地愛上了從石頭中復活的玉的生命。他們不用石頭來雕刻或建築,他們不剝削石頭\n外在的形狀、體積和重量;他們卻一心愛上了石頭內在的精魂。他們從沉睡的、懵懂的石頭中呼喚\n起了玉。那玉,是石頭的又一種變貌。玉,石之美者,被大海、被風砂淘洗,在歷劫的時刻一剎那\n凝固,而今,石中的玉要一一被中國人的親膩喚醒,成為玉璧、玉琮,成為天地間不朽的方和圓。\n 用手輕輕摩娑,用臉頰去親膩,玉裏有古老中國的夢和記憶。石頭和玉,不過一念之間,執著\n了,便成寶玉,捨棄了,不過大地上一塊無牽無掛的頑石罷了。脫離了玉的夢魘之後,中國人也在\n石頭上雕刻,最早是刻字立碑,佛教傳來以後就開始刻佛像。......這些石刻並不從山上被切割分離\n下來,而是把人為的形狀刻在山石壁上。那摩崖和佛像,和自然中的石頭、樹木混雜在一起,成為\n自然的一部分。(蔣勳〈石頭〉)\n就本文敘述而觀,所謂「石頭滄桑史」的故事順序,何者正確?", "options": {"A": "做工具的石斧→被雕刻的石頭→受供奉的玉璧", "B": "被雕刻的石頭→做工具的石斧→受供奉的玉璧", "C": "做工具的石斧→受供奉的玉璧→被雕刻的石頭", "D": "被雕刻的石頭→受供奉的玉璧→做工具的石斧"}, "answer": "C", "note": ""}, {"id": "chinese-99-2", "year": "99", "subject": "chinese", "subjectName": "國文", "number": 2, "question": "所謂「石頭內在的精魂」,在本文中當指何者?", "options": {"A": "石頭的堅硬度", "B": "石頭的不朽性", "C": "玉的潔淨瑩潤", "D": "玉的方圓變貌"}, "answer": "C", "note": ""}, {"id": "chinese-99-3", "year": "99", "subject": "chinese", "subjectName": "國文", "number": 3, "question": "請選出非屬於本文中有關「石頭與玉」辯證關係的敘述?", "options": {"A": "頑石與寶玉", "B": "刻字立碑與摩崖佛像", "C": "沉睡懵懂的石頭與親膩喚醒的玉", "D": "石頭外在的形狀與石頭內在的精魂"}, "answer": "B", "note": ""}, {"id": "chinese-99-4", "year": "99", "subject": "chinese", "subjectName": "國文", "number": 4, "question": "根據本文的「石頭觀」,選出正確的敘述?", "options": {"A": "佛教東傳,中國人習於將佛像刻於山石壁上", "B": "商周春秋,中國人瘋狂愛上石頭的外形體積", "C": "崖上佛像,是中國石頭雕刻藝術的最早源起", "D": "玉之美者,來自於石頭歷盡滄桑的斑剝皴皺"}, "answer": "A", "note": ""}, {"id": "chinese-99-5", "year": "99", "subject": "chinese", "subjectName": "國文", "number": 5, "question": "就本文的玉石論述,選出正確的選項?", "options": {"A": "「摩崖」和「佛像」是自然的形狀", "B": "「玉琮」和「玉璧」是方圓的禮器", "C": "「寶玉」和「頑石」是鮮明的對立", "D": "「雕刻」和「建築」是美玉的大用\n閱讀下文回答"}, "answer": "B", "note": ""}, {"id": "chinese-99-6", "year": "99", "subject": "chinese", "subjectName": "國文", "number": 6, "question": "~題\n 金世成,長山人。素不檢。忽出家作頭陀。類顛,啗不潔以為美。犬羊遺穢於前,輒伏噉之。\n自號為佛。愚民婦異其所為,執弟子禮者以千萬計。金訶使食屎,無敢違者。創殿閣,所費不貲,\n人咸樂輸之。邑令南公惡其怪,執而笞之,使修聖廟。門人競相告曰:「佛遭難!」爭募救之。宮\n殿旬月而成,其金錢之集,尤捷於酷吏之追呼也。\n 異史氏曰:「予聞金道人,人皆就其名而呼之,謂為『今世成佛』。品至啗穢,極矣。笞之不足辱,\n罰之適有濟,南令公處法何良也!然學宮圮而煩妖道,亦士大夫之羞矣。」(蒲松齡〈金世成〉)\n99年專門職業及技術人員高等考試建築師、技師\n考試暨普通考試不動產經紀人、記帳士考試試題 代號:\n等 別: 普通考試\n類 科: 不動產經紀人、記帳士\n科 目: 國文(作文與測驗) \n全一張\n(背面)\n60110\n60210 \n作者認為金世成的身分最像是下列何者?", "options": {"A": "轉世活佛", "B": "逐臭之夫", "C": "宗教騙徒", "D": "正派大師"}, "answer": "C", "note": ""}, {"id": "chinese-99-7", "year": "99", "subject": "chinese", "subjectName": "國文", "number": 7, "question": "作者認為信徒對金世成的膜拜心態,比較接近下列那個選項?", "options": {"A": "正信", "B": "迷信", "C": "堅信", "D": "互信"}, "answer": "B", "note": ""}, {"id": "chinese-99-8", "year": "99", "subject": "chinese", "subjectName": "國文", "number": 8, "question": "文中「邑令南公惡其怪,執而笞之,使修聖廟」,聖廟應該是下列何種廟?", "options": {"A": "佛寺", "B": "道觀", "C": "關帝廟", "D": "孔子廟"}, "answer": "D", "note": ""}, {"id": "chinese-99-9", "year": "99", "subject": "chinese", "subjectName": "國文", "number": 9, "question": "文中「創殿閣,所費不貲,人咸樂輸之」的解說,下列何者正確?", "options": {"A": "創建殿閣,費用昂貴,信徒卻都樂於捐輸", "B": "創建殿閣,費用不足,信徒卻都樂於捐輸", "C": "殿閣受創,費用昂貴,信徒卻都樂於捐輸", "D": "殿閣受創,費用不足,信徒卻都樂於捐輸"}, "answer": "A", "note": ""}, {"id": "chinese-99-10", "year": "99", "subject": "chinese", "subjectName": "國文", "number": 10, "question": "臧克家〈老哥哥〉:「秋是懷人的季候。深宵裏,床頭上叫著蟋蟀,涼風吹一縷月光穿過紙窗\n來。在這沒法合緊眼的當兒,一個意態龍鍾的老人的影像便朦朧在我眼前了。」文中運用月光、\n蟋蟀夜鳴,醞釀思念氛圍,下列那個選項與此相近?", "options": {"A": "開秋兆涼氣,蟋蟀出床帷", "B": "但聞四壁蟲聲唧唧,如助余之嘆息", "C": "羅帳含月思心傷,蟋蟀夜鳴斷人腸", "D": "明月樓高休獨倚,酒入愁腸,化作相思淚"}, "answer": "C", "note": ""}, {"id": "chinese-99-11", "year": "99", "subject": "chinese", "subjectName": "國文", "number": 11, "question": "簡媜〈蓮眾〉一文中寫道:「早晨,閒步寶橋過,有晨霧渺渺,有竹風徐徐,有蓮韻隱隱,有\n水聲潺潺」,其中使用最多的修辭技巧是什麼?", "options": {"A": "雙聲", "B": "雙關", "C": "疊字", "D": "疊韻"}, "answer": "C", "note": ""}, {"id": "chinese-99-12", "year": "99", "subject": "chinese", "subjectName": "國文", "number": 12, "question": "下列文句,成語運用與語意的連貫,正確的是:", "options": {"A": "他捐錢幫助那些沒有錢繳午餐費的學童,真是具有「抱薪救火」的情操", "B": "這次比賽由於時間緊迫,倉促之間,所挑選出來的選手都是「一時之選」,成績恐怕不理想", "C": "為了讓大家過個平安的春節,警方犧牲休假,全力打擊犯罪,頗收「風行草偃」之效", "D": "一個人能降低物質的要求,培養容人的雅量,才能「懲忿窒欲」,表現出過人的修養"}, "answer": "D", "note": ""}, {"id": "chinese-99-13", "year": "99", "subject": "chinese", "subjectName": "國文", "number": 13, "question": "下列文句表達「孝親」之思最正確的是:", "options": {"A": "父母的恩情終身難報,只祈禱「在天願為比翼鳥,在地願為連理枝」,得以永遠承歡膝下", "B": "「胡馬依北風,越鳥巢南枝」,能夠時時陪伴父母才是孝子應有的作為", "C": "為了回報父母的恩情,只有發揮「一飯三吐哺,一沐三握髮」的精神照顧年老體衰的父母", "D": "「烏有反哺之情,羊有跪乳之義」,身為萬物之靈的我們,更應恭敬奉養雙親,回報養育之恩"}, "answer": "D", "note": ""}, {"id": "chinese-99-14", "year": "99", "subject": "chinese", "subjectName": "國文", "number": 14, "question": "曾鞏〈墨池記〉:「羲之之書,晚乃善。則其所能,蓋亦以精力自致者,非天成也。」可見王羲之\n在書法藝術上的成就主要得力於:", "options": {"A": "無師自通", "B": "名師指點", "C": "家學薰陶", "D": "深造有得"}, "answer": "D", "note": ""}, {"id": "chinese-99-15", "year": "99", "subject": "chinese", "subjectName": "國文", "number": 15, "question": "下列「」中的成語,使用正確的是:", "options": {"A": "聆聽法師的開示,虔誠信徒莫不深感「醍醐灌頂」,受益匪淺", "B": "李生家中貧寒,但見「山楶藻梲」,有如廢墟", "C": "兵書上說要知己知彼,才能「克紹箕裘」,贏得勝利", "D": "張老師和學生一向「鴻案相莊」,相處得十分融洽"}, "answer": "A", "note": ""}, {"id": "chinese-99-16", "year": "99", "subject": "chinese", "subjectName": "國文", "number": 16, "question": "曹丕《典論.論文》:「故西伯幽而演《易》,周旦顯而制禮;不以隱約而弗務,不以康樂而加思。」意謂:", "options": {"A": "演《易》制禮之時代有明暗之別", "B": "西伯以隱約的態度演《易》,周公以康樂的心情制禮", "C": "二人制作之心志,不因窮通而更改", "D": "《易》理隱微難明,禮制明白易曉"}, "answer": "C", "note": ""}, {"id": "chinese-99-17", "year": "99", "subject": "chinese", "subjectName": "國文", "number": 17, "question": "以下臺灣文學作家的說明,何者完全正確?", "options": {"A": "洪醒夫小說中的人物,往往對鄉民們的貧困、迷信,有著高度的關懷與同情,故其有「彰化媽\n祖」的美譽", "B": "楊逵《亞細亞的孤兒》被公認為抗日文學的代表作,象徵日據時代知識分子迷惘的處境", "C": "黃春明投稿〈送報伕〉,成為臺灣首位進軍日本中央文壇的作家", "D": "鍾理和的長篇小說《笠山農場》充滿自傳性質,他的生平故事曾被拍成電影《原鄉人》"}, "answer": "D", "note": ""}, {"id": "chinese-99-18", "year": "99", "subject": "chinese", "subjectName": "國文", "number": 18, "question": "1絕巧棄利,少私寡欲 2己立立人,己達達人 3託是非於賞罰,屬輕重於權衡 4愛人若\n愛其身,視人之室若其室\n以上文句,表達的思想依序是:", "options": {"A": "道家/儒家/法家/墨家", "B": "儒家/墨家/法家/道家", "C": "法家/道家/墨家/儒家", "D": "墨家/儒家/道家/法家"}, "answer": "A", "note": ""}, {"id": "chinese-99-19", "year": "99", "subject": "chinese", "subjectName": "國文", "number": 19, "question": "「我無爾詐,爾無我虞」(《左傳.宣公十五年》)所言及的道德修養與下列何者相近?", "options": {"A": "言忠信,行篤敬(《論語.衛靈公》)", "B": "君子成人之美,不成人之惡(《論語.顏淵》)", "C": "小人閑居,為不善,無所不至(《禮記.大學》)", "D": "吉人之辭寡,躁人之辭多(劉義慶《世說新語.品藻》)"}, "answer": "A", "note": ""}, {"id": "chinese-99-20", "year": "99", "subject": "chinese", "subjectName": "國文", "number": 20, "question": "《四書》為古代知識分子必讀的書籍,下列敘述錯誤的是:", "options": {"A": "《論語.述而》:「子不語怪、力、亂、神。」可見孔子是", "B": "相當理性而務實的\n孟子斥異端,放淫辭,他所排斥的是梁惠王、齊宣王之流", "C": "《大學》:「大學之道,在明明德,在親民,在止於至善。」此即所謂三綱領", "D": "《中庸》:「天命之謂性,率性之謂道。」所講的性與孟子的性善說相通"}, "answer": "B", "note": ""}, {"id": "tax-99-1", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 1, "question": "稅捐稽徵法所稱的稅捐,不包括下列何者?", "options": {"A": "營業稅", "B": "土地稅", "C": "所得稅", "D": "反傾銷稅"}, "answer": "D", "note": ""}, {"id": "tax-99-2", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 2, "question": "依稅捐稽徵法規定,稅捐稽徵人員因調查取得納稅義務人之課稅資料,對下列何者應絕對保守秘密?", "options": {"A": "立法機關", "B": "已取得民事確定判決或其他執行名義債權人", "C": "受理稅務訴訟之法院", "D": "監察機關"}, "answer": "A", "note": ""}, {"id": "tax-99-3", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 3, "question": "依稅捐稽徵法第 39 條規定,下列何者情形不具有使租稅核課處分暫緩執行之效力?", "options": {"A": "納稅義務人已依法申請復查", "B": "納稅義務人提起訴願並對復查決定之應納稅額繳納半數者", "C": "納稅義務人提起訴願並經稽徵機關核准提供相當擔保者", "D": "納稅義務人提起訴願並具狀向法院聲請停止執行"}, "answer": "D", "note": ""}, {"id": "tax-99-4", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 4, "question": "依稅捐稽徵法規定,納稅義務人被限制出境之期間,自內政部入出國及移民署限制出境之日起,不得逾\n幾年?", "options": {"A": "五年", "B": "三年", "C": "二年", "D": "一年"}, "answer": "A", "note": ""}, {"id": "tax-99-5", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 5, "question": "依據稅捐稽徵法規定,財產為公同共有時,以下列何人為納稅義務人?", "options": {"A": "全體公同共有人協議後推派之管理人", "B": "稽徵機關指定之一人或數人", "C": "全體公同共有人為納稅義務人", "D": "公同共有人僅各自按其應有部分為納稅義務人"}, "answer": "C", "note": ""}, {"id": "tax-99-6", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 6, "question": "依稅捐稽徵法規定,課稅處分有下列何種瑕疵,不屬於申請查對更正之範圍?", "options": {"A": "課稅事實認定錯誤", "B": "計算錯誤", "C": "重複", "D": "記載錯誤"}, "answer": "A", "note": ""}, {"id": "tax-99-7", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 7, "question": "依稅捐稽徵法規定,納稅義務人因天災遲誤申請復查期間者,一般於天災消滅後多久期限內,可以申請\n回復原狀?", "options": {"A": "六個月內", "B": "三個月內", "C": "二個月內", "D": "一個月內"}, "answer": "D", "note": ""}, {"id": "tax-99-8", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 8, "question": "所得稅法中所規定的「災害損失」扣除項目,不包括下列那一項損失?", "options": {"A": "因地震所受損失", "B": "因水災所受損失", "C": "因遭搶劫所受損失", "D": "因風災所受損失"}, "answer": "C", "note": ""}, {"id": "tax-99-9", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 9, "question": "依所得稅法規定,下列何種所得必須繳納所得稅?", "options": {"A": "國民中學教師之薪資所得", "B": "依國家賠償法規定取得之賠償金", "C": "人身保險之保險給付", "D": "國立大學教師之薪資所得"}, "answer": "D", "note": ""}, {"id": "tax-99-10", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 10, "question": "依所得稅法規定,下列何者屬於綜合所得稅所稱薪資所得?", "options": {"A": "個人領取的終身俸", "B": "律師收取當事人委任訴訟之報酬", "C": "受僱會計師領取事務所發放之年終獎金", "D": "出家人向信徒化緣收入"}, "answer": "C", "note": ""}, {"id": "tax-99-11", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 11, "question": "甲與乙是一對只有執行業務來源所得之夫妻,依我國所得稅法規定,其所得申報課稅方式為何?", "options": {"A": "合併申報並合併計算", "B": "合併申報但分開計算", "C": "分開申報但合併計算", "D": "由其自行選擇"}, "answer": "A", "note": ""}, {"id": "tax-99-12", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 12, "question": "依所得稅法規定,扣繳義務人未於限期責令補繳之限期內補繳應扣未扣或短扣之稅款,最高可按應扣未\n扣或短扣之稅額處幾倍之罰鍰?", "options": {"A": "五倍", "B": "三倍", "C": "二倍", "D": "一倍"}, "answer": "B", "note": ""}, {"id": "tax-99-13", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 13, "question": "依所得稅法規定,納稅義務人未依規定期限辦理結算申報者,稽徵機關應即填具滯報通知書,送達納稅\n義務人,限於接到滯報通知書之日起幾日內補辦結算申報?", "options": {"A": "七日內", "B": "十日內", "C": "十五日內", "D": "三十日內"}, "answer": "C", "note": ""}, {"id": "tax-99-14", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 14, "question": "短期票券到期兌償金額超過首次發售價格部分之利息所得,依所得稅法及相關法規規定,其扣繳率應為\n百分之幾,不併計綜合所得總額?", "options": {"A": "百分之七", "B": "百分之十", "C": "百分之十二", "D": "百分之二十"}, "answer": "B", "note": ""}, {"id": "tax-99-15", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 15, "question": "依所得稅法規定,於下列何種情形,稽徵機關不得設算租賃收入?", "options": {"A": "以財產出典取得典價而未申報者", "B": "房屋出租,其約定之租金,顯較當地一般租金為低者", "C": "將房屋無償借與胞弟開餐廳者", "D": "將房屋無償借與已成年子女供住宅使用且已提出法院公證書者"}, "answer": "D", "note": ""}, {"id": "tax-99-16", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 16, "question": "依所得稅法規定,納稅義務人在中華民國境內租屋供自住且非供營業或執行業務使用者,其所支付之租\n金,每一申報戶每年扣除數額以幾萬元為限?", "options": {"A": "十二萬", "B": "十八萬", "C": "二十四萬", "D": "三十萬"}, "answer": "A", "note": ""}, {"id": "tax-99-17", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 17, "question": "依現行所得稅法規定,課稅級距之金額每遇消費者物價指數較上次調整年度之指數上漲累計達百分之幾\n以上時,應按上漲程度調整?", "options": {"A": "百分之一", "B": "百分之二", "C": "百分之三", "D": "百分之五"}, "answer": "C", "note": ""}, {"id": "tax-99-18", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 18, "question": "個人已依所得基本稅額條例規定計算及申報基本所得額,有漏報或短報致短漏稅額之情事者,處以所漏\n稅額多少倍以下之罰鍰?", "options": {"A": "一倍", "B": "二倍", "C": "三倍", "D": "一至十倍"}, "answer": "B", "note": ""}, {"id": "tax-99-19", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 19, "question": "依所得基本稅額條例及相關法規規定,基本稅額的現行徵收率各為多少?", "options": {"A": "營利事業 20%;個人 20%", "B": "營利事業 20%;個人 10%", "C": "營利事業 10%;個人 20%", "D": "營利事業 10%;個人 10%"}, "answer": "C", "note": ""}, {"id": "tax-99-20", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 20, "question": "依所得基本稅額條例及相關法規規定,下列何項 99 年度收入或支出應記入個人 99 年度之基本所得額?", "options": {"A": "申報綜合所得稅之現金捐贈扣除額 15 萬元", "B": "海外證券交易所得 150 萬元", "C": "公開上市之股票的交易所得", "D": "死亡保險給付 1,500 萬元"}, "answer": "B", "note": ""}, {"id": "tax-99-21", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 21, "question": "某營利事業於 99 年 10 月 18 日購置豪華轎車一部,依平均法計提折舊,其成本 5,800,000 元,估計使用\n五年,預估殘值 100,000 元,設 99 年度該汽車帳列折舊費用 285,000 元。依營利事業所得稅查核準則規\n定,其 99 年度應予帳外調整減列之折舊費用為多少元?", "options": {"A": "215,555 元", "B": "205,000 元", "C": "180,333 元", "D": "165,000 元"}, "answer": "D", "note": ""}, {"id": "tax-99-22", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 22, "question": "依營利事業所得稅查核準則規定,營利事業依勞工退休金條例等相關法規規定,為不適用勞動基準法之\n本國籍工作者或委任經理人提繳之退休金,每年度得在不超過當年度已付薪資總額多少限度內,以費用\n列支?", "options": {"A": "4%", "B": "6%", "C": "8%", "D": "15%"}, "answer": "B", "note": ""}, {"id": "tax-99-23", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 23, "question": "依營利事業所得稅查核準則規定,營建業合建分售(或分成)之廣告費,應由地主與建主按何種方式分\n攤?", "options": {"A": "按其售價比例分攤", "B": "按其建坪比例分攤", "C": "按其土地公告現值及房屋評定標準價格之比例分攤", "D": "按其合約約定分攤"}, "answer": "A", "note": ""}, {"id": "tax-99-24", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 24, "question": "依營利事業所得稅查核準則規定,營利事業分期付款之銷貨,其當期損益「不得」依下列何種方法計算?", "options": {"A": "普通銷貨法", "B": "差價攤計法", "C": "毛利百分比法", "D": "全部毛利法"}, "answer": "B", "note": ""}, {"id": "tax-99-25", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 25, "question": "依營利事業所得稅查核準則規定,外銷損失金額每筆在新臺幣多少元以下者,得免附國外公證或檢驗機\n構出具之證明文件?", "options": {"A": "200,000 元", "B": "300,000 元", "C": "400,000 元", "D": "500,000 元"}, "answer": "D", "note": ""}, {"id": "tax-99-26", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 26, "question": "某公司製品原料耗用數量,不符合營利事業所得稅查核準則第 58 條根據有關帳證紀錄予以核實認定之規\n定,且財政部未定有通常水準,亦無同業原料耗用情形可資比照,則該公司原料耗用依序首先應按下列\n何項核定?", "options": {"A": "按該公司上年度核定情形核定", "B": "按該公司前五年度核定之平均數核定", "C": "按該公司前三年度核定之平均數核定", "D": "由稽徵機關調查核定"}, "answer": "A", "note": ""}, {"id": "tax-99-27", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 27, "question": "依營利事業所得稅查核準則有關規定,下列敘述何者正確?", "options": {"A": "固定資產未達規定耐用年數而毀滅或廢棄者,全部應於事前報請稽徵機關核備,以其未折減餘額列為\n該年度之損失", "B": "帳列應付費用,逾二年尚未給付者,應該轉列其他收入", "C": "開辦費之攤提,最低不得少於五年", "D": "商品盤損之科目,僅係對於存貨採永續盤存制或經核准採零售價法者適用之"}, "answer": "D", "note": ""}, {"id": "tax-99-28", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 28, "question": "依營利事業所得稅查核準則規定,營利事業之董事長、總經理、經理、廠長國內出差膳雜費,每人每日\n之限額為多少元?", "options": {"A": "700 元", "B": "600 元", "C": "500 元", "D": "沒有金額限制"}, "answer": "A", "note": ""}, {"id": "tax-99-29", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 29, "question": "依營利事業所得稅查核準則規定,下列何項廣告費應報經稽徵機關核備,始准予以認列?", "options": {"A": "以車輛巡迴宣傳之各項費用", "B": "樣品進口關稅與宣傳費等", "C": "營建業樣品屋之成本", "D": "參加義賣、特賣之各項費用"}, "answer": "D", "note": ""}, {"id": "tax-99-30", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 30, "question": "依營利事業所得稅查核準則規定,已依職工福利金條例提撥福利金及經中央政府核准列支福利費用者,\n其員工醫藥費應如何處理?", "options": {"A": "以薪資科目列報,計算限額", "B": "以職工福利費科目列報,計算限額", "C": "以職工福利費科目列報,核實認定", "D": "不得列報"}, "answer": "C", "note": ""}, {"id": "tax-99-31", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 31, "question": "依加值型及非加值型營業稅法規定,進口下列何種貨物應課徵營業稅?", "options": {"A": "肥料", "B": "麵粉", "C": "國際運輸用之船舶、航空器及遠洋漁船", "D": "金條、金塊、金片、金幣及純金之金飾或飾金"}, "answer": "B", "note": ""}, {"id": "tax-99-32", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 32, "question": "小規模營業人等以進項稅額百分之十扣減查定稅額者,依加值型及非加值型營業稅法及相關法規規定,其\n進項憑證應分別於一、四、七、十月之幾日前,向主管稽徵機關申報並以當期各月份之進項憑證為限?", "options": {"A": "5 日", "B": "10 日", "C": "15 日", "D": "20 日"}, "answer": "A", "note": ""}, {"id": "tax-99-33", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 33, "question": "依加值型及非加值型營業稅法規定,外國之事業、機關、團體、組織,在中華民國境內無固定營業場所\n者,其於多久時間內在中華民國境內從事參加展覽或臨時商務活動而購買貨物或勞務支付加值型營業稅\n達一定金額,得申請退稅?", "options": {"A": "一個月", "B": "二個月", "C": "半年", "D": "一年"}, "answer": "D", "note": ""}, {"id": "tax-99-34", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 34, "question": "星辰餐飲店為依特種稅額計稅之營業人,且在營業時間有職業性演唱節目,依加值型及非加值型營業稅\n法規定其營業稅稅率為多少?", "options": {"A": "5%", "B": "10%", "C": "15%", "D": "25%"}, "answer": "C", "note": ""}, {"id": "tax-99-35", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 35, "question": "依加值型及非加值型營業稅法規定,核准由總機構合併申報銷售額、應納或溢付營業稅額者,其所有其\n他固定營業場所:", "options": {"A": "仍應向所在地主管稽徵機關申報銷售額及進項憑證", "B": "仍應向所在地主管稽徵機關申報銷售額,但無須申報進項憑證", "C": "仍應向所在地主管稽徵機關申報進項憑證,但無須申報銷售額", "D": "無須另行申報"}, "answer": "A", "note": ""}, {"id": "tax-99-36", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 36, "question": "靡葫公司銷售商品一批,售價 1,200,000 元。銷售時未依法開立統一發票,且於申報當期銷售額時亦未列\n入申報,違反加值型及非加值型營業稅法第 51 條第 3 款規定,據稅務違章案件裁罰金額或倍數參考表,\n應按所漏稅額處三倍之漏稅罰;另該公司未依法給與憑證,違反稅捐稽徵法第 44 條規定,應依規定處以\n行為罰。本案件應裁處之罰鍰金額為多少?", "options": {"A": "600,000 元", "B": "300,000 元", "C": "240,000 元", "D": "180,000 元"}, "answer": "D", "note": ""}, {"id": "tax-99-37", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 37, "question": "山明公司進貨一批 100,000 元,數日後以售價 120,000 元(不含稅)銷售予水秀公司。若買賣雙方為按一般\n稅額計稅之營業人,則依加值型及非加值型營業稅法之規定水秀公司須支付予山明公司之稅額為多少元?", "options": {"A": "6,000 元", "B": "5,000 元", "C": "1,000 元", "D": "0 元"}, "answer": "A", "note": ""}, {"id": "tax-99-38", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 38, "question": "依加值型及非加值型營業稅法規定,下列有關經營衍生性金融商品、公司債、金融債券之營業稅,何者\n敘述正確?", "options": {"A": "銷售額、佣金及手續費均免稅", "B": "銷售額免稅,佣金及手續費應稅", "C": "銷售額應稅,佣金及手續費免稅", "D": "銷售額、佣金及手續費均應稅"}, "answer": "B", "note": ""}, {"id": "tax-99-39", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 39, "question": "依加值型及非加值型營業稅法規定,下列何情況營業人僅須向主管稽徵機關申報核備,不須再申請登記?", "options": {"A": "設立", "B": "合併", "C": "變更", "D": "復業"}, "answer": "D", "note": ""}, {"id": "tax-99-40", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 40, "question": "中古車商三民公司於 99 年 5 月以 210,000 元向四維保險公司購入舊乘人小汽車乙輛,於 99 年 11 月出售\n該汽車,售價 140,000 元,銷項稅額 7,000 元。依加值型及非加值型營業稅法規定,三民公司於申報該汽\n車銷售額之當期,可申報扣抵該汽車之銷項稅額為多少元?", "options": {"A": "7,000 元", "B": "10,000 元", "C": "105,000 元", "D": "0 元"}, "answer": "A", "note": ""}, {"id": "tax-99-41", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 41, "question": "依加值型及非加值型營業稅法規定,營業人未依規定期限申報銷售額或統一發票明細表,其逾三十日者,\n按核定應納稅額加徵多少怠報金?", "options": {"A": "3‰", "B": "1%", "C": "3%", "D": "30%"}, "answer": "D", "note": ""}, {"id": "tax-99-42", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 42, "question": "依加值型及非加值型營業稅法及相關法規規定,營業人以貨物或勞務與他人交換貨物或勞務者,其銷售\n額應如何認定?", "options": {"A": "以換出貨物之時價認定", "B": "以換入貨物之時價認定", "C": "以換出或換入貨物之時價,從高認定", "D": "以換出或換入貨物之時價,從低認定"}, "answer": "C", "note": ""}, {"id": "tax-99-43", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 43, "question": "依加值型及非加值型營業稅法及相關法規規定,下列何者之進項稅額得扣抵銷項稅額?", "options": {"A": "因辦理員工伙食購買主、副食等之進項稅額", "B": "購置供工作場所穿著之工作服之進項稅額", "C": "贈送股東紀念品之進項稅額", "D": "對外國政府捐贈之進項稅額"}, "answer": "B", "note": ""}, {"id": "tax-99-44", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 44, "question": "某餐飲業為按一般稅額計稅之營業人,其向顧客收取餐飲費 6,300 元並加收一成服務費 630 元,依加值型\n及非加值型營業稅法及相關法規規定,該筆交易之銷售額為多少元?", "options": {"A": "6,000 元", "B": "6,300 元", "C": "6,600 元", "D": "6,930 元"}, "answer": "C", "note": ""}, {"id": "tax-99-45", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 45, "question": "依加值型及非加值型營業稅法規定,下列有關國際運輸事業自中華民國境內載運客貨出境者之銷售額,\n何項錯誤?", "options": {"A": "海運事業-客運:自中華民國境內承載旅客出境至中華民國境外第一站間之票價", "B": "海運事業-貨運:自中華民國境內承運貨物出口之全部運費", "C": "空運事業-客運:自中華民國境內承載旅客至中華民國境外第一站間之票價", "D": "空運事業-貨運:自中華民國境內承運貨物出口之全程運費"}, "answer": "A", "note": ""}, {"id": "tax-99-46", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 46, "question": "依遺產及贈與稅法規定,被繼承人贈與繼承人之財產,在死亡前多久以內應視為遺產,併入其遺產總額\n課徵遺產稅?", "options": {"A": "五年內", "B": "三年內", "C": "二年內", "D": "一年內"}, "answer": "C", "note": ""}, {"id": "tax-99-47", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 47, "question": "依遺產及贈與稅法及其他相關法規規定,被繼承人遺有配偶者,應自遺產總額中扣除多少元,免徵遺產稅?", "options": {"A": "一百萬元", "B": "二百萬元", "C": "三百五十萬元", "D": "四百四十五萬元"}, "answer": "D", "note": ""}, {"id": "tax-99-48", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 48, "question": "依遺產及贈與稅法及其他相關法規規定,被繼承人職業上之工具,其 99 年的總價值在新臺幣多少元以下\n者,不計入遺產總額?", "options": {"A": "72 萬", "B": "50 萬", "C": "45 萬", "D": "30 萬"}, "answer": "C", "note": ""}, {"id": "tax-99-49", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 49, "question": "依遺產及贈與稅法規定,納稅義務人對依法應申報之遺產,已申報而有漏報或短報情事者,應按所漏稅\n額處以幾倍以下之罰鍰?", "options": {"A": "三倍", "B": "二倍", "C": "一倍至三倍", "D": "二倍至三倍"}, "answer": "B", "note": ""}, {"id": "tax-99-50", "year": "99", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 50, "question": "依遺產及贈與稅法規定,甲將作農業使用之農業用地贈與其子乙,乙享有免納贈與稅優惠,但其必須自\n承受之日起幾年內,繼續作農業使用?", "options": {"A": "十五年內", "B": "十年內", "C": "七年內", "D": "五年內"}, "answer": "D", "note": ""}, {"id": "accounting-100-1", "year": "100", "subject": "accounting", "subjectName": "會計學概要", "number": 1, "question": "仁愛公司提供下列資料,請您用毛利率法為其估算期末存貨:期初存貨$90,000,進貨$300,000,進貨折\n讓$10,000,進貨運費$4,000,銷貨淨額$562,000,銷貨運費$8,000,正常毛利率為 45%,則期末存貨估計\n數應為:", "options": {"A": "$74,900", "B": "$79,300", "C": "$82,900", "D": "$66,900"}, "answer": "A", "note": ""}, {"id": "accounting-100-2", "year": "100", "subject": "accounting", "subjectName": "會計學概要", "number": 2, "question": "下列何種資產之減損損失得迴轉?1不動產 2存貨 3專利權 4商譽", "options": {"A": "僅12", "B": "僅123", "C": "僅134", "D": "1234"}, "answer": "B", "note": ""}, {"id": "accounting-100-3", "year": "100", "subject": "accounting", "subjectName": "會計學概要", "number": 3, "question": "會計上通常以「成本」(而非「清算價值」)來列示資產的價值,主要是基於:", "options": {"A": "會計期間假設", "B": "繼續經營假設", "C": "企業個體假設", "D": "貨幣單位衡量假設"}, "answer": "B", "note": ""}, {"id": "accounting-100-4", "year": "100", "subject": "accounting", "subjectName": "會計學概要", "number": 4, "question": "八德公司簽發一張 3 年期、不附息、面額$2,270,000 之票據,以購入公平市價為$1,800,000 之土地一筆,\n則該公司對二者之差價$470,000 應如何處理?", "options": {"A": "借記「應付票據折價」,並逐年攤銷為利息費用", "B": "借記「應付票據折價」,並逐年攤銷為土地成本之增加", "C": "貸記「應付票據折價」,並逐年攤銷為購買土地利得", "D": "不予處理"}, "answer": "A", "note": ""}, {"id": "accounting-100-5", "year": "100", "subject": "accounting", "subjectName": "會計學概要", "number": 5, "question": "一般而言,企業為維護專利權而發生訴訟之成本,應如何處理?", "options": {"A": "若勝訴,則資本化;若敗訴,則列為費用", "B": "不論勝訴或敗訴,皆列為費用", "C": "一律資本化", "D": "視公司政策而定"}, "answer": "B", "note": ""}, {"id": "accounting-100-6", "year": "100", "subject": "accounting", "subjectName": "會計學概要", "number": 6, "question": "下列何者為公司需作必要調整分錄之相關會計假設、原則與基礎?1經濟個體假設 2會計期間假設 \n3繼續經營假設 4歷史成本原則 5收入認列原則 6配合原則 應計基礎", "options": {"A": "僅256", "B": "僅2356", "C": "僅256", "D": "123456"}, "answer": "C", "note": ""}, {"id": "accounting-100-7", "year": "100", "subject": "accounting", "subjectName": "會計學概要", "number": 7, "question": "甲公司於 X1 年 4 月 1 日發行面額$5,000,000、票面利率 5%,每年 7 月 1 日及 1 月 1 日付息之 10 年期公\n司債,加計應計利息後該公司共得款$4,912,500。則該公司債之發行價格為:", "options": {"A": "97.0", "B": "97.3", "C": "97.7", "D": "101.2"}, "answer": "A", "note": ""}, {"id": "accounting-100-8", "year": "100", "subject": "accounting", "subjectName": "會計學概要", "number": 8, "question": "下列何種金融資產需評估是否減損,且認列之減損金額得迴轉或減少?1以公平價值衡量且公平價值變\n動認列為損益之金融資產 2以攤銷後成本衡量之金融資產 3以成本衡量之金融資產 4備供出售之\n金融資產", "options": {"A": "僅23", "B": "僅24", "C": "僅234", "D": "1234"}, "answer": "B", "note": ""}, {"id": "accounting-100-9", "year": "100", "subject": "accounting", "subjectName": "會計學概要", "number": 9, "question": "公司進行下列何者交易後,會影響其流通在外股數?1買賣庫藏股 2現金增資 3現金減資 4發放\n股票股利 5股票分割", "options": {"A": "僅1234", "B": "僅1235", "C": "僅1245", "D": "12345"}, "answer": "D", "note": ""}, {"id": "accounting-100-10", "year": "100", "subject": "accounting", "subjectName": "會計學概要", "number": 10, "question": "甲公司 X1 年初簽發一面額$5,000,000,票面與市場利率同為 12%,20 年期,每年年底本息平均攤還之應\n付票據以購置設備。關於該票據本金與利息部分於甲公司 X1 年財務報表表達之影響,下列敘述何者正確?", "options": {"A": "負債權益比率降低", "B": "流動比率降低", "C": "利息保障倍數增加", "D": "應付帳款週轉率降低"}, "answer": "B", "note": ""}, {"id": "accounting-100-11", "year": "100", "subject": "accounting", "subjectName": "會計學概要", "number": 11, "question": "下列何種會計方法偏向「資產負債表法」之精神?1先進先出法 2後進先出法 3應收帳款百分比法 \n4銷貨百分比法", "options": {"A": "僅13", "B": "僅14", "C": "僅123", "D": "僅124"}, "answer": "A", "note": ""}, {"id": "accounting-100-12", "year": "100", "subject": "accounting", "subjectName": "會計學概要", "number": 12, "question": "下列有關存貨之會計處理或程序,何為採永續盤存制之公司於正常狀況下編製年度財務報告時,無需執\n行或選用者?1盤點期末存貨 2成本流程假設(先進先出法...等) 3毛利率法 4零售價法 5成\n本與淨變現價值孰低法", "options": {"A": "僅34", "B": "僅134", "C": "僅1234", "D": "12345"}, "answer": "A", "note": ""}, {"id": "accounting-100-13", "year": "100", "subject": "accounting", "subjectName": "會計學概要", "number": 13, "question": "甲公司 X1 年之應收帳款週轉率為 20,存貨週轉率為 40,若 X1 年共計 360 天,且甲公司所有存貨均以\n現金購入,則該公司之營業週期為:", "options": {"A": "6 天", "B": "20 天", "C": "27 天", "D": "70 天"}, "answer": "C", "note": ""}, {"id": "accounting-100-14", "year": "100", "subject": "accounting", "subjectName": "會計學概要", "number": 14, "question": "甲公司於 X1 年期末對其當日帳面價值$800,000 之生產設備進行減損測試,經評估該設備之公平價值為\n$700,000,出售之直接銷售成本為$150,000,後續期間使用時將產生淨現金流入為$1,200,000(折現值\n$780,000),則甲公司當期應認列該設備減損損失之金額為:", "options": {"A": "$0", "B": "$20,000", "C": "$100,000", "D": "$250,000"}, "answer": "B", "note": ""}, {"id": "accounting-100-15", "year": "100", "subject": "accounting", "subjectName": "會計學概要", "number": 15, "question": "甲、乙、丙三公司於本期以相同溢價價格取得相同數量之上市公司債券,均分類為「以公平價值衡量且\n公平價值變動認列為損益之金融資產」,且取得之交易成本均認列為當期費用。惟就溢價部分,甲、乙\n公司係分別以利息法與直線法進行攤銷,丙公司則選擇不攤銷。關於該金融資產所有本期會計處理對三\n公司本期淨利影響之差異,下列敘述何者正確?", "options": {"A": "甲公司本期淨利最低", "B": "乙公司本期淨利最低", "C": "丙公司本期淨利最低", "D": "甲、乙、丙三公司本期淨利相同"}, "answer": "D", "note": ""}, {"id": "accounting-100-16", "year": "100", "subject": "accounting", "subjectName": "會計學概要", "number": 16, "question": "藍天公司之產品售價每單位為$40,單位生產成本包括直接原料$6、直接人工$7、製造費用$10(其中 60%\n為固定成本)。該公司最近接獲一筆特殊海外訂單,欲訂購 50,000 單位產品,所需增加之成本除生產成\n本外,另有每單位$5 之運費。若該公司目前有足夠的產能可供生產此訂單,則其願意接受此訂單的最低\n售價為:", "options": {"A": "$17", "B": "$22", "C": "$24", "D": "$28"}, "answer": "B", "note": ""}, {"id": "accounting-100-17", "year": "100", "subject": "accounting", "subjectName": "會計學概要", "number": 17, "question": "甲公司本期壞帳費用$90,應收帳款資料如下:\n期初 期末\n應收帳款 $100 $340 \n備抵壞帳 (70) (120) \n$30 $220\n甲公司以間接法編製之現金流量表中營業活動部分,因應收帳款與壞帳費用之調整,共計應由淨利減除\n之金額為:", "options": {"A": "$190", "B": "$240", "C": "$280", "D": "$330"}, "answer": "A", "note": ""}, {"id": "accounting-100-18", "year": "100", "subject": "accounting", "subjectName": "會計學概要", "number": 18, "question": "和平公司採定期盤存制,已知其去年底的存貨高估$15,000,而今年底的存貨又低估$9,000,則今年度的\n淨利會因這兩項錯誤而:", "options": {"A": "低估$9,000", "B": "低估$24,000", "C": "高估$6,000", "D": "高估$24,000"}, "answer": "B", "note": ""}, {"id": "accounting-100-19", "year": "100", "subject": "accounting", "subjectName": "會計學概要", "number": 19, "question": "信義公司去年期末存貨金額為$15,000,其中包含下列項目:寄銷在外商品$4,500,在途進貨$5,100(目的\n地交貨),承銷他人商品$3,750。則該公司去年期末存貨正確金額為:", "options": {"A": "$6,150", "B": "$10,500", "C": "$11,250", "D": "$15,000"}, "answer": "A", "note": ""}, {"id": "accounting-100-20", "year": "100", "subject": "accounting", "subjectName": "會計學概要", "number": 20, "question": "合歡公司 99 年度淨利為$20,000,已知當年度曾提列折舊$5,000,另有處分資產利益$3,000,則該年度「\n營業活動之現金流量」為:", "options": {"A": "$18,000", "B": "$22,000", "C": "$25,000", "D": "$28,000"}, "answer": "B", "note": ""}, {"id": "accounting-100-21", "year": "100", "subject": "accounting", "subjectName": "會計學概要", "number": 21, "question": "忠孝公司今年初備抵呆帳有貸餘$15,000。今年 4/15,公司確定有一筆帳款$10,000 無法收回,因而加以沖\n銷;但經過公司鍥而不捨的追討,該帳款又得以於今年 12/1 收回$3,000。今年底公司依應收帳款餘額\n($500,000)的 2%估列呆帳。則今年底調整後備抵呆帳的貸餘為:", "options": {"A": "$2,000", "B": "$5,000", "C": "$8,000", "D": "$10,000"}, "answer": "D", "note": ""}, {"id": "accounting-100-22", "year": "100", "subject": "accounting", "subjectName": "會計學概要", "number": 22, "question": "在銀行存款調節表中,「存款不足退票」應作為:", "options": {"A": "公司帳現金餘額的減項", "B": "銀行對帳單餘額的加項", "C": "公司帳現金餘額的加項", "D": "銀行對帳單餘額的減項"}, "answer": "A", "note": ""}, {"id": "accounting-100-23", "year": "100", "subject": "accounting", "subjectName": "會計學概要", "number": 23, "question": "四維公司於 97 年初購入設備:成本$330,000,估計可使用 4 年,殘值為$30,000,採直線法提列折舊;99 年\n初發生改良支出$70,000,該支出能使設備之使用年限延長 2 年(即至 102 年底),殘值不變。則 99 年底\n該設備應提列折舊為:", "options": {"A": "$75,000", "B": "$61,667", "C": "$55,000", "D": "$37,500"}, "answer": "C", "note": ""}, {"id": "accounting-100-24", "year": "100", "subject": "accounting", "subjectName": "會計學概要", "number": 24, "question": "欣欣商店合夥人甲與乙之資本額分別為$200,000 及$300,000,今丙想加入合夥,徵得所有合夥人之同意,\n向乙購買 1/2 股權,付現$200,000,則欣欣商店帳冊紀錄上丙合夥人之資本為:", "options": {"A": "$300,000", "B": "$250,000", "C": "$200,000", "D": "$150,000"}, "answer": "D", "note": ""}, {"id": "accounting-100-25", "year": "100", "subject": "accounting", "subjectName": "會計學概要", "number": 25, "question": "正常餘額為借餘的帳戶包括:", "options": {"A": "資產、費用及股本", "B": "資產、收入及負債", "C": "資產、股利及費用", "D": "收入、負債及股本"}, "answer": "C", "note": ""}, {"id": "bookkeeping-100-1", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 1, "question": "王五參加 99 年記帳士考試及格,領有及格證書,準備於 100 年在臺北市松山區設立事務所執行業務,下\n列有關敘述何者錯誤?", "options": {"A": "記帳士主管機關為財政部", "B": "向財政部申請核發記帳士證書", "C": "向臺北市國稅局辦理登錄執業", "D": "向臺北市政府辦理登錄執業"}, "answer": "D", "note": ""}, {"id": "bookkeeping-100-2", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 2, "question": "陳先生參加 97 年記帳士考試及格,領有及格證書,依記帳士證書核發辦法規定,下列有關其申請記帳士\n證書事宜,何者正確?", "options": {"A": "向考選部申請記帳士證書", "B": "記帳士證書遺失或滅失時,向財政部申請換發", "C": "記帳士證書污損或破損時,向財政部申請補發", "D": "在破產之宣告尚未復權期間,不能向財政部請領、換發、補發"}, "answer": "D", "note": ""}, {"id": "bookkeeping-100-3", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 3, "question": "張記帳士僅登錄臺中市為其執行業務區域,下列何者是其可執行之業務?1受委任辦理臺中市各項稅捐\n之復查 2受委任辦理彰化縣營業稅申報 3受委任辦理臺中市營業登記 4受委任辦理臺中市商業會\n計事務 5受委任辦理臺中市營利事業所得稅之查核簽證申報", "options": {"A": "12345", "B": "1234", "C": "134", "D": "34"}, "answer": "C", "note": ""}, {"id": "bookkeeping-100-4", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 4, "question": "依記帳士法之相關規定,下列敘述何者錯誤?", "options": {"A": "記帳士不得受委任辦理稅捐稽徵案件之復查申請", "B": "各級記帳士公會理事長之連任以一次為限", "C": "記帳士公會不得拒絕具有公會會員資格者加入", "D": "曾任稅務機關稅務職系人員者,自離職之日起三年內,不得於其最後任職機關所在地直轄市、縣市區\n域內執行記帳士職務"}, "answer": "A", "note": ""}, {"id": "bookkeeping-100-5", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 5, "question": "商業公會如以其名義受委任辦理營業、變更、註銷、停業、復業及其他登記事項,依記帳士法規定應如\n何處理?", "options": {"A": "不違法,可辦理該項業務", "B": "違反記帳士法第 34 條規定,處新臺幣 3 萬元以上 15 萬元以下罰鍰", "C": "違反記帳士法第 34 條規定,處新臺幣 10 萬元以下罰鍰", "D": "涉及犯罪行為移送司法機關偵辦"}, "answer": "B", "note": ""}, {"id": "bookkeeping-100-6", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 6, "question": "記帳士從事委任業務應切實依相關規定辦理,下列何者係依記帳士法與職業道德規範,記帳士不得為之行\n為?", "options": {"A": "嚴守業務機密", "B": "未取得會計師資格,以會計師、會計師事務所之名義刊登廣告招攬業務或執行會計師業務", "C": "對於業務事件主管機關通知提示有關文件或答覆有關查詢事項,以超然、客觀、正直工作態度處理之", "D": "對於受委任事件,盡善良管理人之注意義務,以保障委任人及其利害關係人之權益"}, "answer": "B", "note": ""}, {"id": "bookkeeping-100-7", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 7, "question": "記帳士因業務上有詐欺、背信、侵占、偽造文書等犯罪行為,受有期徒刑一年以上刑之裁判確定者,或\n受記帳士法所定除名處分者,下列敘述何者正確?1不得充任記帳士 2其已充任者,撤銷或廢止其記帳\n士證書 3其記帳士證書得申請或重新申請 4其記帳士證書不得申請或重新申請 5得報考記帳士考試 \n6不得報考記帳士考試 依記帳士法及記帳士考試規則之規範,等於永遠不得從事記帳士工作", "options": {"A": "1246", "B": "1235", "C": "1246", "D": "1236"}, "answer": "A", "note": ""}, {"id": "bookkeeping-100-8", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 8, "question": "甲公司與李記帳士簽訂委任書,委託李記帳士為甲公司記帳及報稅,李記帳士代理甲公司向臺中市國稅局\n報繳本期營業稅,因李記帳士的疏忽導致漏報銷售額,致甲公司被國稅局處以罰鍰,依記帳士法與職業道\n德規範,李記帳士因懈怠或疏忽,致委任人甲公司或其利害關係人受有損害時,下列敘述何者正確?", "options": {"A": "並未違反相關法規規定,不予處理", "B": "李記帳士應負賠償責任,以保障委任人及其利害關係人之權益", "C": "由臺中市國稅局對李記帳士,課以行為罰", "D": "由臺中市記帳士公會予以處分"}, "answer": "B", "note": ""}, {"id": "bookkeeping-100-9", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 9, "question": "吳記帳士於臺中市執行業務之事宜,下列敘述何者不正確?", "options": {"A": "執行報稅業務時,其業務事件主管機關為「財政部」", "B": "執行處理商業會計事務時,其業務事件主管機關為「經濟部」", "C": "涉有犯罪嫌疑者,移送司法機關偵辦", "D": "涉有犯罪嫌疑者,移送記帳士懲戒委員會處理即可"}, "answer": "D", "note": ""}, {"id": "bookkeeping-100-10", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 10, "question": "陳記帳士未加入記帳士公會,即執行記帳士業務,違反記帳士法第 19 條規定,下列處理何者正確?", "options": {"A": "由主管機關直接裁罰", "B": "由利害關係人、業務事件主管機關或記帳士公會報請主管機關交付懲戒", "C": "由業務事件主管機關直接裁罰", "D": "由司法機關裁罰"}, "answer": "B", "note": ""}, {"id": "bookkeeping-100-11", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 11, "question": "下列何者非屬現金科目?", "options": {"A": "償債基金", "B": "可隨時解約且不損及本金之定期存款", "C": "可隨時解約且不損及本金之可轉讓定存單", "D": "支票存款"}, "answer": "A", "note": ""}, {"id": "bookkeeping-100-12", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 12, "question": "關於租賃資產與出租資產之歸類,下列何者正確?", "options": {"A": "租賃資產歸類在固定資產項下;出租資產歸類在其他資產項下", "B": "租賃資產歸類在其他資產項下;出租資產歸類在固定資產項下", "C": "租賃資產與出租資產均歸類在固定資產項下", "D": "租賃資產與出租資產均歸類在其他資產項下"}, "answer": "A", "note": ""}, {"id": "bookkeeping-100-13", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 13, "question": "下列何者得不適用商業會計法之規定:1免用統一發票之小規模之合夥或獨資商業 2使用統一發票之\n合夥或獨資商業 3信用合作社 4小規模公司 5公營事業公司主辦會計人員之任免 6學校", "options": {"A": "123456", "B": "156", "C": "12346", "D": "1256"}, "answer": "B", "note": ""}, {"id": "bookkeeping-100-14", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 14, "question": "商業使用電子方式處理會計資料後,下列敘述何者不正確?", "options": {"A": "會計實務重點在會計之記錄及編製財務報表", "B": "會計實務重點在驗證會計資料,防止發生錯誤", "C": "應建立內部控制,且內部控制應以書面規範", "D": "財務報表仍應依商業會計處理準則之規定辦理"}, "answer": "A", "note": ""}, {"id": "bookkeeping-100-15", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 15, "question": "依商業會計處理準則第 3 條之規定,記帳憑證、帳簿及財務報表之名稱及格式,由下列何者公告?", "options": {"A": "財政部", "B": "經濟部", "C": "立法院", "D": "國稅局"}, "answer": "B", "note": ""}, {"id": "bookkeeping-100-16", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 16, "question": "有關財務報表之註釋,下列敘述何者錯誤?", "options": {"A": "財務報表之註釋非屬財務報表之一部分", "B": "註釋之主要目的是以更詳細的資料幫助財務報表之閱表人能了解財務報表數字中無法表達之意涵", "C": "資本結構之變動之期後事項,財務報表應予必要之註釋", "D": "表達方式:得於財務報表上各有關科目後以括弧列明,或以附註或附表方式為之"}, "answer": "A", "note": ""}, {"id": "bookkeeping-100-17", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 17, "question": "臺中汽車公司本月有下列各項現金交易(單位:新臺幣),何者不符合商業會計法第 9 條之規定?1甲君\n支付 120 萬元,向臺中汽車公司購買小客車乙輛 2乙公司支付 150 萬元,向臺中汽車公司買貨車乙輛 \n3丙公司支付 90 萬元,向臺中汽車公司購買貨車乙輛 4臺中汽車公司以活期存款取款條轉帳支付第一銀\n行借款 200 萬元 5臺中汽車公司以活期存款取款條從銀行提款 110 萬元後,給付臺北公司貨款", "options": {"A": "12345", "B": "2345", "C": "245", "D": "25"}, "answer": "D", "note": ""}, {"id": "bookkeeping-100-18", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 18, "question": "依商業會計法第 9 條之規定,商業之支出達一定金額者,應使用匯票、本票、支票、劃撥、電匯、轉帳\n或其他經主管機關核定之支付工具或方法,並應載明下列何項?", "options": {"A": "付款銀行", "B": "受款人", "C": "保證人", "D": "承辦人"}, "answer": "B", "note": ""}, {"id": "bookkeeping-100-19", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 19, "question": "丙公司購入一批存貨成本$150,000,期末評價之淨變現價值為$170,000,請問會計上應如何處理?", "options": {"A": "維持存貨成本於$150,000", "B": "借記「存貨」$20,000,貸記「存貨漲價利益」$20,000", "C": "借記「存貨」$20,000,貸記「資本公積」$20,000", "D": "借記「存貨」$20,000,貸記「未實現重估增值」$20,000"}, "answer": "A", "note": ""}, {"id": "bookkeeping-100-20", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 20, "question": "甲公司係乙公司的股東,今甲公司將成本$1,000,000、累計折舊$400,000、公平價值$500,000 之機器設備贈\n與乙公司,則乙公司受贈該機器應按何金額入帳?", "options": {"A": "按機器之帳面價值$600,000 入帳,即借:機器設備$600,000 貸:捐贈收入$600,000", "B": "按機器之帳面價值$600,000 入帳,即借:機器設備$600,000 貸:資本公積-捐贈$600,000", "C": "按機器之公平價值$500,000 入帳,即借:機器設備$500,000 貸:捐贈收入$500,000", "D": "按機器之公平價值$500,000 入帳,即借:機器設備$500,000 貸:資本公積-捐贈$500,000"}, "answer": "D", "note": ""}, {"id": "bookkeeping-100-21", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 21, "question": "丁公司向銀行借款,銀行要求補償性存款(留於銀行活期存款中),則此一補償性存款列報於何種項目\n不正確?", "options": {"A": "現金", "B": "因短期借款而發生應列為流動資產", "C": "因長期借款而發生者,則應列為其他資產", "D": "因長期借款而發生者,則應列為長期投資"}, "answer": "A", "note": ""}, {"id": "bookkeeping-100-22", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 22, "question": "甲公司目前供營業使用辦公室地基,經依公告現值調整後而發生之增值為 100 萬元,估計土地增值稅準\n備為 20 萬元,下列有關此筆土地重估之處理何者正確?", "options": {"A": "土地增值稅準備 20 萬元,應列資本公積項下", "B": "列業主權益項下之未實現重估增值為 100 萬元", "C": "列業主權益項下之未實現重估增值為 80 萬元", "D": "土地增值稅準備 20 萬元,應列流動負債項下"}, "answer": "C", "note": ""}, {"id": "bookkeeping-100-23", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 23, "question": "甲公司 100 年底期末存貨成本 900 萬元,依逐項比較所計得之淨變現價值為 810 萬元,原帳上已有備抵\n存貨跌價損失 50 萬元,則有關期末存貨之處理何者正確?", "options": {"A": "採成本與淨變現價值孰低評價,其存貨成本可採用後進先出法", "B": "採成本與時價孰低評價,其存貨成本可採用後進先出法", "C": "100 年應認列存貨跌價損失為 90 萬元,備抵存貨跌價損失為 90 萬元", "D": "備抵存貨跌價損失列為存貨減項,存貨跌價損失列為銷貨成本加項"}, "answer": "D", "note": ""}, {"id": "bookkeeping-100-24", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 24, "question": "乙公司未依商業會計法第 23 條規定設置基本帳簿,依商業會計法第 76 條第 1 款之規定,對代表商業之\n負責人、經理人、主辦及經辦會計人員有何處罰?", "options": {"A": "處新臺幣 6 萬元以上 30 萬元以下罰鍰", "B": "處新臺幣 1 萬元以上 5 萬元以下罰鍰", "C": "處新臺幣 3 萬元以上 15 萬元以下罰鍰", "D": "予以警告"}, "answer": "A", "note": ""}, {"id": "bookkeeping-100-25", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 25, "question": "甲公司應收債權發生呆帳之可能性很大或已發生,但其會計上故意未予適當估列或沖轉,則下列之敘述\n何者不正確?", "options": {"A": "違反商業會計法第 71 條第 4 款:「故意遺漏會計事項不為記錄,致使財務報表發生不實之結果。」", "B": "僅對主辦及經辦會計人員,處 5 年以下有期徒刑、拘役或科或併科新臺幣 60 萬元以下罰金", "C": "違反商業會計法第 45 條規定,對債權未評價及估列備抵呆帳", "D": "造成損益計算不正確"}, "answer": "B", "note": ""}, {"id": "bookkeeping-100-26", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 26, "question": "獨資合夥組織適用以下會計原則及相關會計法令之優先順序為:1商業會計法 2商業會計處理準則 \n3財務會計準則公報 4財務會計準則公報之解釋 5國際財務會計準則公報 6會計學理 權威團\n體發布之會計文獻", "options": {"A": "1→2→3→4→5→6→", "B": "2→3→1→5→4→→6", "C": "3→2→1→5→4→→6", "D": "2→1→3→5→4→→6"}, "answer": "A", "note": ""}, {"id": "bookkeeping-100-27", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 27, "question": "依商業會計法之規定,下列何者非商業負責人?", "options": {"A": "執行業務或代表公司之股東", "B": "董事長", "C": "執行業務之合夥人", "D": "主辦會計在執行職務範圍內"}, "answer": "D", "note": ""}, {"id": "bookkeeping-100-28", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 28, "question": "關於股份有限公司主辦會計人員之任免,其法定應執行程序為:", "options": {"A": "應由董事會以董事過半數之出席,及出席董事過半數之同意", "B": "應有全體股東過半數之同意", "C": "應有全體無限責任股東過半數之同意", "D": "應有全體股東三分之二以上之同意"}, "answer": "A", "note": ""}, {"id": "bookkeeping-100-29", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 29, "question": "未依法取得代他人處理會計事務之資格而擅自代他人處理商業會計事務,經查獲後三年內再犯者,應如\n何處罰?", "options": {"A": "處新臺幣 10 萬元以下罰金", "B": "處 1 年以下有期徒刑、拘役或科或併科新臺幣 15 萬元以下罰金", "C": "處新臺幣 6 萬元以上 30 萬元以下罰鍰", "D": "處 5 年以下有期徒刑、拘役或科或併科新臺幣 60 萬元以下罰金"}, "answer": "B", "note": ""}, {"id": "bookkeeping-100-30", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 30, "question": "下列何者係屬行政程序法第 92 條規定之行政處分?1國稅局對營業人漏開發票者科處罰鍰 2行政機關\n租用辦公場所 3交通部中央氣象局提供氣候的相關資訊及氣象報導 4政府役政機關對役男兵役體位\n之判定 5財政部所頒布之稅務違章案件減免處罰標準 6稅捐稽徵機關核發課稅通知書 警察對道\n路交通違規者開立的罰單 監理機關與民間某修車廠簽約,將汽車檢驗權限委託其行使 臺中市政\n府就某建築指定為古蹟", "options": {"A": "123456", "B": "13456", "C": "146", "D": "146"}, "answer": "D", "note": ""}, {"id": "bookkeeping-100-31", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 31, "question": "行政機關作成行政處分時,處分機關未告知救濟期間或告知之救濟期間有錯誤時,依行政程序法第 98 條\n規定,相對人或利害關係人提起救濟效力,下列何者錯誤?", "options": {"A": "未告知救濟期間者,行政處分無效", "B": "通知更正,自通知送達之翌日起算法定期間", "C": "通知更正,但信賴原告知較長期間,於原告知之期間內為之者,視為於法定期間內所為", "D": "告知錯誤未為更正,致遲誤原時間者,自處分書送達後一年內聲明不服時,視為於法定期間內所為"}, "answer": "A", "note": ""}, {"id": "bookkeeping-100-32", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 32, "question": "依行政程序法第 111 條之規定,行政處分有下列何種情形者,該行政處分無效?", "options": {"A": "未記載理由", "B": "未舉行聽證", "C": "未給予該處分相對人陳述意見之機會", "D": "應以證書方式作成而未給予證書者"}, "answer": "D", "note": ""}, {"id": "bookkeeping-100-33", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 33, "question": "依行政程序法第 112 條之規定,行政處分一部分無效者,若除去該無效部分,行政處分不能成立者,該\n行政處分之效力為何?", "options": {"A": "部分無效", "B": "全部無效", "C": "得撤銷", "D": "得廢止"}, "answer": "B", "note": ""}, {"id": "bookkeeping-100-34", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 34, "question": "依據行政程序法第 122 條規定,非授予利益之合法行政處分之廢止,下列何者錯誤?", "options": {"A": "原則上,得由原處分機關依職權為全部或一部之廢止", "B": "廢止後,依法行政機關應重新為相同內容之行政處分者,則不得廢止", "C": "依法令、一般法律原則或行政規則等其他原因不許廢止者,則不得廢止", "D": "對受益人因信賴該處分致遭受財產上之損失,應給予合理之補償"}, "answer": "D", "note": ""}, {"id": "bookkeeping-100-35", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 35, "question": "甲公司、乙公司皆設立於臺北市,甲公司實收資本額新臺幣 7 億元,乙公司實收資本額新臺幣 2 億元,\n請問甲、乙公司之公司登記受理機關為何?", "options": {"A": "甲公司、乙公司皆係經濟部", "B": "甲公司係經濟部,乙公司係臺北市政府", "C": "甲公司、乙公司皆係財政部", "D": "甲公司係臺北市政府,乙公司係經濟部"}, "answer": "B", "note": ""}, {"id": "bookkeeping-100-36", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 36, "question": "關於股份有限公司之登記,下列敘述何者正確?", "options": {"A": "由董事長備具申請書,連同應備之文件一份,向中央主管機關申請", "B": "得由記帳士代理申請", "C": "申請設立登記經核准後繳納登記費", "D": "登記後不得申請更正"}, "answer": "A", "note": ""}, {"id": "bookkeeping-100-37", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 37, "question": "股份有限公司發起設立者,應於 15 日內向主管機關申請為設立之登記,其登記期限自何時起算?", "options": {"A": "應自公司章程訂立後起算", "B": "應於創立會完結後起算", "C": "應自公司負責人就任後起算", "D": "應自代表公司之負責人就任後起算"}, "answer": "D", "note": ""}, {"id": "bookkeeping-100-38", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 38, "question": "關於公司經理人之委任或解任,下列何者非為應登記之事項?", "options": {"A": "經理人之住所或居所", "B": "經理人之身分證統一編號", "C": "經理人之性別", "D": "經理人到職或離職年、月、日"}, "answer": "C", "note": ""}, {"id": "bookkeeping-100-39", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 39, "question": "依公司法及相關法規之規定,下列何者不須辦理登記?", "options": {"A": "公司增資", "B": "募集、清償公司債", "C": "設立分公司", "D": "公司解散"}, "answer": "B", "note": ""}, {"id": "bookkeeping-100-40", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 40, "question": "有關商業登記之事項,下列何者正確?", "options": {"A": "免使用統一發票之小規模商業,得免依商業登記法申請登記", "B": "商業資本額達 50 萬元以上者需提供資本證明文件", "C": "商業之名稱得使用「公司」字樣", "D": "乙獨資商行其所在地為臺中市,其商業登記主管機關及商業會計事務之管理機關皆為臺中市政府"}, "answer": "D", "note": ""}, {"id": "bookkeeping-100-41", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 41, "question": "有關分公司之登記,下列何者不正確?", "options": {"A": "公司設立分公司,應於設立後十五日內,向主管機關申請登記", "B": "分公司登記採登記對抗主義", "C": "與本公司同一縣市均須辦分公司登記", "D": "分公司無營業之必要時,應申請停業登記"}, "answer": "D", "note": ""}, {"id": "bookkeeping-100-42", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 42, "question": "有關公司暫停營業之事宜,下列何者不正確?", "options": {"A": "暫停營業一個月以上者,應於停止營業前或停止營業之日起十五日內申請為停業之登記", "B": "復業前或復業後十五日內申請為復業之登記", "C": "已依營業稅法規定申報停、復業核備者,仍須申請停、復業登記", "D": "申請停業或延展開業期間,每次最長不得超過一年"}, "answer": "C", "note": ""}, {"id": "bookkeeping-100-43", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 43, "question": "有關營利事業登記制度之事宜,下列何者不正確?", "options": {"A": "公司登記係以營利為目的之公司組織取得法人資格之登記,依公司法申請", "B": "商業登記係以營利為目的之獨資合夥商業取得主體資格之登記,依商業登記法申請", "C": "營業登記係營業人於開始營業前向稽徵機關申請營業登記,依加值型及非加值型營業稅法申請", "D": "公司登記、商業登記及營業登記之代理人,以會計師、律師、記帳士、記帳及報稅代理業務人為限"}, "answer": "D", "note": ""}, {"id": "bookkeeping-100-44", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 44, "question": "依公司法第 388 條規定,主管機關對於公司登記之申請,認為有違反本法或不合法定程式者,下列何者\n不正確?", "options": {"A": "應令其改正,非俟改正合法後,不予登記", "B": "主管機關僅形式上審查其是否「違反本法」或「不合法定程式」而已,如其申請形式上合法,即准予\n登記,不再為實質之審查", "C": "公司之設立或其他登記事項如涉及偽造、變造文書時,主管機關則直接撤銷或廢止其登記", "D": "公司之設立或其他登記事項如涉及偽造、變造文書時,須經裁判確定後,始撤銷或廢止其登記"}, "answer": "C", "note": ""}, {"id": "bookkeeping-100-45", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 45, "question": "依記帳士法與職業道德規範及相關管理辦法,下列何者為記帳士或記帳及報稅代理業務人應拒絕接受委\n任之情事?", "options": {"A": "委任人提供必要之帳簿文據憑證或關係文件", "B": "委任人意圖為不實不當之記帳、報稅", "C": "委任人無隱瞞或欺騙而可為公正詳實之記帳報稅代理", "D": "委任人正派經營事業"}, "answer": "B", "note": ""}, {"id": "bookkeeping-100-46", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 46, "question": "關於會計帳簿,下列敘述何者有誤?", "options": {"A": "在同一會計年度內應連續記載", "B": "在同一會計年度內,除已用盡外不得更換新帳簿", "C": "更換新帳簿時,應於舊帳簿空白頁上,逐頁加蓋「空白作廢」戳記或截角作廢,並在空白首頁加填\n「以下空白作廢」字樣", "D": "更換新帳簿後,應立即將舊帳簿銷毀"}, "answer": "D", "note": ""}, {"id": "bookkeeping-100-47", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 47, "question": "依中華民國記帳士職業道德規範,記帳士對於委辦事項,應予保密,但下列何者除外?", "options": {"A": "報經財政部核准者", "B": "經委託人同意或依法令規定者", "C": "依記帳士專業判斷為不須保密者", "D": "報經記帳士公會核准者"}, "answer": "B", "note": ""}, {"id": "bookkeeping-100-48", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 48, "question": "依中華民國記帳士職業道德規範之前言,下列何者非為制定中華民國記帳士職業道德規範之目的?", "options": {"A": "建立本業信譽", "B": "端正社會風氣", "C": "維持記帳士之社會形象", "D": "協助納稅義務人記帳及履行納稅義務"}, "answer": "D", "note": ""}, {"id": "bookkeeping-100-49", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 49, "question": "依中華民國記帳士職業道德規範,下列敘述何者正確?", "options": {"A": "記帳士設立之分事務所,得委由助理員主持", "B": "記帳士如聘雇他記帳士之現職人員,得徵詢他記帳士之意見", "C": "記帳士事務所名稱得與已登錄之事務所名稱相同", "D": "記帳士所有業務之對外文件,一律由記帳士簽名或蓋章"}, "answer": "B", "note": ""}, {"id": "bookkeeping-100-50", "year": "100", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 50, "question": "依中華民國記帳士職業道德規範,關於記帳士業務延攬,下列敘述何者錯誤?", "options": {"A": "不得利誘", "B": "不得刊登廣告宣傳", "C": "不得不正當抑價", "D": "不得詆毀同業"}, "answer": "B", "note": ""}, {"id": "chinese-100-1", "year": "100", "subject": "chinese", "subjectName": "國文", "number": 1, "question": "「不流,是那家民宿藝品店的店名。『橫江孤鶴,不與時流』是店主人處世的理念與經\n營理念。不流,即不俗,所以小小店面,氣氛安雅,諸寶並陳,往往令人驚喜。」文中\n「不流」意指:", "options": {"A": "不同流合污,當自許清高", "B": "不流於時髦,當復古守舊", "C": "不流於形式,當充實內在", "D": "不隨波逐流,當清新脫俗"}, "answer": "D", "note": ""}, {"id": "chinese-100-2", "year": "100", "subject": "chinese", "subjectName": "國文", "number": 2, "question": "「子生而母危,鏹積而盜窺,何喜非憂也;貧可以節用,病可以保身,何憂非喜也。故\n達人當順逆一視,而欣戚兩忘。」文中達人的生命態度是:", "options": {"A": "不以物喜,不以己悲", "B": "得之我幸,不得我命", "C": "樂以天下,憂以天下", "D": "逆來順受,憂喜參半"}, "answer": "A", "note": ""}, {"id": "chinese-100-3", "year": "100", "subject": "chinese", "subjectName": "國文", "number": 3, "question": "彭輕生子曰:「往者可知,來者不可知。」子墨子曰:「籍設而親在百里之外,則遇難\n焉,期以一日也,及之則生,不及則死。今有固車良馬於此,又有奴馬四隅之輪於此,\n使子擇焉,子將何乘?」對曰:「乘良馬固車,可以速至。」子墨子曰:「焉在不知來。」\n可知墨子認為未來之事:", "options": {"A": "可以預言", "B": "無法掌握", "C": "應順其自然", "D": "應操之在我"}, "answer": "D", "note": ""}, {"id": "chinese-100-4", "year": "100", "subject": "chinese", "subjectName": "國文", "number": 4, "question": "「遠公在廬山中,雖老,講論不輟。弟子中或有惰者,遠公曰:『桑榆之光,理無遠照,\n但願朝陽之暉,與時並明耳。』執經登坐,諷誦朗暢,詞色甚苦,高足之徒,皆肅然增\n敬。」文中執經講學的遠公面對怠惰弟子的心態是:", "options": {"A": "自責未能導其向學", "B": "憂慮弟子失去學習能力", "C": "諷諭弟子不懂及時把握良機", "D": "期盼弟子能有光明的前途"}, "answer": "D", "note": ""}, {"id": "chinese-100-5", "year": "100", "subject": "chinese", "subjectName": "國文", "number": 5, "question": "「人有亡鈇者,意其鄰之子。視其行步,竊鈇也;顏色,竊鈇也;言語,竊鈇也;動作\n態度,無為而不竊鈇也。俄而抇其谷而得其鈇,他日復見其鄰人之子,動作態度無似竊\n鈇者。」此則故事意在說明為人處事應:", "options": {"A": "審慎觀察,小心求證", "B": "避免猜疑,不落偏見", "C": "追根究底,明察秋毫", "D": "先聽其言,後觀其行"}, "answer": "B", "note": ""}, {"id": "chinese-100-6", "year": "100", "subject": "chinese", "subjectName": "國文", "number": 6, "question": "「吾觀四時,寒來暑往,往來如奔;吾觀萬物,秋落春榮,榮落相續;吾觀人事,禍福\n倚伏,則維其常。」意謂:", "options": {"A": "天地運行有其常道,人能安時而處順,則無入而不自得", "B": "大自然的寒來暑往,人事的禍福吉凶,互相牽引影響", "C": "四時輪替,萬物變化,增添無數賞心悅目的美景", "D": "人生禍福無常,猶如四時的輪替,怎不令人感傷"}, "answer": "A", "note": ""}, {"id": "chinese-100-7", "year": "100", "subject": "chinese", "subjectName": "國文", "number": 7, "question": "「凡操千曲而後曉聲,觀千劍而後識器。」二句強調學者當:", "options": {"A": "貪多務得,細大不捐", "B": "博覽群觀,多方學習", "C": "登高必自卑,行遠必自邇", "D": "戒慎乎其所不睹,恐懼乎其所不聞\n100年專門職業及技術人員高等考試建築師、技師、第2次\n食品技師考試暨普通考試不動產經紀人、記帳士考試試題 代號:\n等 別: 普通考試\n類 科: 不動產經紀人、記帳士\n科 目: 國文(作文與測驗) \n全一張\n(背面)\n60110\n60210"}, "answer": "B", "note": ""}, {"id": "chinese-100-8", "year": "100", "subject": "chinese", "subjectName": "國文", "number": 8, "question": "「也只有沿著堅硬的環節/向天空/步步高升/才是你不變的志向/也只有綠/才是你一\n生想說的/那句話/在忠臣傳裡/才能讀到/茹冰飲雪/終於成為你生命的全部/雖然\n偶爾你也喜歡化妝/穿好一襲墨衣/去鄭板橋畫裡」。上則詩文,所描述的對象應該是:", "options": {"A": "梅", "B": "柳", "C": "竹", "D": "松"}, "answer": "C", "note": ""}, {"id": "chinese-100-9", "year": "100", "subject": "chinese", "subjectName": "國文", "number": 9, "question": "郁永河〈竹枝詞〉:「胸背斕斑直到腰,爭誇錯錦勝鮫綃。冰肌玉腕都文遍,只有雙蛾\n不解描。」所描寫的是:", "options": {"A": "亂髮赤膊的打扮", "B": "黥面紋身的習俗", "C": "鮮彩艷麗的服飾", "D": "五官深刻的容貌"}, "answer": "B", "note": ""}, {"id": "chinese-100-10", "year": "100", "subject": "chinese", "subjectName": "國文", "number": 10, "question": "下列各語詞,何者不是比喻形容音樂或歌聲的美妙動聽:", "options": {"A": "流魚出聽", "B": "新鶯出谷", "C": "沉魚落雁", "D": "珠落玉盤"}, "answer": "C", "note": ""}, {"id": "chinese-100-11", "year": "100", "subject": "chinese", "subjectName": "國文", "number": 11, "question": "下列引號中的「樹」字,何者之詞性與其他三者不同:", "options": {"A": "十年之計,莫如「樹」木(《管子.權修》)", "B": "風「樹」之感,夙自纏心(《南齊書.虞玩之傳》)", "C": "「樹」德務滋,除惡務本(《書經.泰誓下》)", "D": "標「樹」芳迹,示諸後代(北齊.孝昭帝〈為僧稠起塔詔〉)"}, "answer": "B", "note": ""}, {"id": "chinese-100-12", "year": "100", "subject": "chinese", "subjectName": "國文", "number": 12, "question": "「社會上如果(ㄇㄧˊ)漫豪奢的風氣,人人以(ㄇㄧˊ)衣玉食的生活相誇耀,則輕\n者將(ㄇㄧˇ)忘良心善性,失卻自我;重者或作奸犯科,危害家國!」以上文句中,\n由注音符號所替代的字,正確的字形依序應是:", "options": {"A": "迷/禰/彌", "B": "瀰/靡/弭", "C": "襧/瀰/迷", "D": "弭/糜/彌"}, "answer": "B", "note": ""}, {"id": "chinese-100-13", "year": "100", "subject": "chinese", "subjectName": "國文", "number": 13, "question": "題辭應用非常廣泛,下列何者不適用於祝賀男女婚嫁:", "options": {"A": "頌祝岡陵", "B": "笙磬同音", "C": "大道之始", "D": "鐘鼓樂之\n閱讀下文,回答第"}, "answer": "A", "note": ""}, {"id": "chinese-100-14", "year": "100", "subject": "chinese", "subjectName": "國文", "number": 14, "question": "~題\n曾子之妻之市,其子隨之而泣,其母曰:「女還,顧反為女殺彘。」適市來,曾子欲捕彘\n殺之,妻止之曰:「特與嬰兒戲耳。」曾子曰:「嬰兒非與戲也。嬰兒非有知也,待父母\n而學者也,聽父母之教,今子欺之,是教子欺也。母欺子,子而不信其母,非以成教也。」\n遂烹彘也。(節錄自《韓非子.外儲說左上》)\n「特與嬰兒戲耳」句中的「嬰兒」是指:", "options": {"A": "市場中的小孩子", "B": "鄰居的小孩子", "C": "曾子的兒子", "D": "曾子的孫子"}, "answer": "C", "note": ""}, {"id": "chinese-100-15", "year": "100", "subject": "chinese", "subjectName": "國文", "number": 15, "question": "文中多處使用「之」字。下列解釋何者正確:", "options": {"A": "曾子之妻「之」市→的", "B": "捕彘殺「之」→了", "C": "妻止「之」曰→之後", "D": "今子欺「之」→他"}, "answer": "D", "note": ""}, {"id": "chinese-100-16", "year": "100", "subject": "chinese", "subjectName": "國文", "number": 16, "question": "「嬰兒非有知也,待父母而學者也」意謂:", "options": {"A": "父母的言行是小孩子學習模仿的對象", "B": "小孩子天資聰穎,學習過程不用父母多費心", "C": "父母與兒女關係密切,所以要一起學習", "D": "小孩子的天賦無限,父母不該多方限制其發展"}, "answer": "A", "note": ""}, {"id": "chinese-100-17", "year": "100", "subject": "chinese", "subjectName": "國文", "number": 17, "question": "這個寓言故事說明了:", "options": {"A": "教育環境的影響", "B": "循循善誘的效果", "C": "身教言教的重要", "D": "適度獎勵的重要\n閱讀下文,回答第"}, "answer": "C", "note": ""}, {"id": "chinese-100-18", "year": "100", "subject": "chinese", "subjectName": "國文", "number": 18, "question": "~題\n苗劉之亂,張魏公在秀州,議舉勤王之師。一夕獨坐,從者皆寢。忽一人持刀立燭後,公\n知為刺客,徐問曰:「豈非苗傅、劉正彥遣汝來殺我乎?」曰:「然!」公曰:「若是則\n取吾首以去,可也。」曰:「我亦知書,豈肯為賊用?況公忠義如此,何忍害公?恐防閑\n不嚴,有繼至者,故來相告耳。」公問:「欲金帛乎?」哂曰:「殺公何患無財?」「然\n則留事我乎?」曰:「有老母在河北,未可留也。」問其姓名,俛而不答,攝衣躍而登屋,\n屋瓦無聲。時方月明,去如飛。\n「防閑不嚴」意思是:", "options": {"A": "不能嚴禁閒言閒語", "B": "防範措施做得不夠謹嚴", "C": "無法嚴懲士兵偷閒怠惰", "D": "無法懲治賦閒在家的人"}, "answer": "B", "note": ""}, {"id": "chinese-100-19", "year": "100", "subject": "chinese", "subjectName": "國文", "number": 19, "question": "下列何者是張魏公的行為表現:", "options": {"A": "冷靜處理危機", "B": "用財物賄賂刺客", "C": "用正氣降服刺客", "D": "以退為進勸服刺客"}, "answer": "A", "note": ""}, {"id": "chinese-100-20", "year": "100", "subject": "chinese", "subjectName": "國文", "number": 20, "question": "上文中刺客的特質,下列選項何者不正確:", "options": {"A": "孝順", "B": "輕功了得", "C": "忠心護主", "D": "有所不殺"}, "answer": "C", "note": ""}, {"id": "tax-100-1", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 1, "question": "依據我國加值型及非加值型營業稅法第 32 條之規定,營業人對於應稅貨物或勞務之定價,下列何者正確?", "options": {"A": "開出未稅價,營業稅外加", "B": "定價應內含營業稅", "C": "對消費者及營業人皆開未稅價", "D": "應視其為專營或兼營之營業人而有不同"}, "answer": "B", "note": ""}, {"id": "tax-100-2", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 2, "question": "下列有關我國加值型及非加值型營業稅納稅義務人之敘述何者錯誤?", "options": {"A": "免稅農業用油、漁業用油有轉讓或移作他用而不符免稅規定者為買受人", "B": "為銷售貨物或勞務之營業人", "C": "外國之事業、機關、團體、組織,在中華民國境內無固定營業場所者,納稅義務人為其所銷售勞務之\n買受人", "D": "為進口貨物之收貨人或持有人"}, "answer": "A", "note": ""}, {"id": "tax-100-3", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 3, "question": "下列何者非屬加值型及非加值型營業稅法第 5 條所稱之「進口」?", "options": {"A": "貨物自國外進入中華民國境內者", "B": "貨物自國外進入中華民國境內之保稅區", "C": "保稅貨物自保稅區進入中華民國境內之其他地區者", "D": "保稅貨物自政府核定之加工出口區進入中華民國境內之其他地區者"}, "answer": "B", "note": ""}, {"id": "tax-100-4", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 4, "question": "加值型及非加值型營業稅法施行細則第 8 條所稱娛樂節目,係指在營業時間有樂器表演人數達幾人以上\n者?", "options": {"A": "1 人", "B": "2 人", "C": "3 人", "D": "4 人"}, "answer": "B", "note": ""}, {"id": "tax-100-5", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 5, "question": "委由郵政機構出口適用零稅率者,依加值型及非加值型營業稅法施行細則第 11 條規定,其離岸價格超過\n新臺幣多少元,仍應報經海關出口,免檢附證明文件?", "options": {"A": "1 萬元", "B": "3 萬元", "C": "5 萬元", "D": "10 萬元"}, "answer": "C", "note": ""}, {"id": "tax-100-6", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 6, "question": "下列何者之進項稅額,依加值型及非加值型營業稅法第 19 條規定,可扣抵銷項稅額?", "options": {"A": "酬勞員工個人之貨物", "B": "交際應酬用之貨物", "C": "購進之貨物未依規定取得並保存憑證", "D": "供勞軍用之非供本業使用貨物"}, "answer": "D", "note": ""}, {"id": "tax-100-7", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 7, "question": "個人有上市、上櫃股票之證券交易所得,應如何課徵所得基本稅額?", "options": {"A": "無須計入基本所得額中計算及繳稅", "B": "免計入綜合所得總額繳納一般所得稅,但須計入基本所得額中課稅", "C": "依規定計入基本所得額,但可扣除 600 萬元", "D": "應扣除購入成本與費用後計入基本所得額"}, "answer": "A", "note": ""}, {"id": "tax-100-8", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 8, "question": "依加值型及非加值型營業稅法第 41 條規定,貨物進口時,應徵之營業稅,由誰代徵之?", "options": {"A": "海關", "B": "國稅局", "C": "稅捐稽徵處", "D": "進口人"}, "answer": "A", "note": ""}, {"id": "tax-100-9", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 9, "question": "依據我國加值型及非加值型營業稅法第 48 條之規定,營業人開立統一發票,應行記載事項未依規定記載\n或所載不實者,除通知限期改正或補辦外,應按統一發票所載銷售額,處多少罰鍰,其金額最低不得少\n於新臺幣 1,500 元,最高不得超過新臺幣 15,000 元?", "options": {"A": "1%", "B": "2%", "C": "5%", "D": "10%"}, "answer": "A", "note": ""}, {"id": "tax-100-10", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 10, "question": "下列何者不是所得稅法第 61 條及營利事業資產重估價辦法所規定,遇有物價上漲達百分之二十五時,得\n實施資產重估價之項目?", "options": {"A": "營業權", "B": "土地", "C": "森林", "D": "著作權"}, "answer": "B", "note": ""}, {"id": "tax-100-11", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 11, "question": "大發公司為依加值型及非加值型營業稅法第四章第一節計算稅額之營業人,若大發公司出租其房屋取得\n押金收入 100 萬元,該年一月一日郵政定期儲金一年期固定利率為 2.52%,試問大發公司每月押金收入\n之銷售額為多少?", "options": {"A": "2,000 元", "B": "2,100 元", "C": "2,520 元", "D": "3,000 元"}, "answer": "A", "note": ""}, {"id": "tax-100-12", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 12, "question": "依營業人開立銷售憑證時限表規定,關於開立銷售憑證時限,下列何者錯誤?", "options": {"A": "買賣業銷售貨物以發貨時為限", "B": "雜誌社有關印刷費之營業以交件時為限", "C": "以娛樂設備或演技供人視聽玩賞以娛身心之營業以結算時為限", "D": "報社有關廣告費之營業以交件時為限"}, "answer": "D", "note": ""}, {"id": "tax-100-13", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 13, "question": "小規模營業人、依法取得從事按摩資格之視覺功能障礙者經營,且全部由視覺功能障礙者提供按摩勞務\n之按摩業,及其他經財政部規定免予申報銷售額之營業人,其營業稅稅率為多少?", "options": {"A": "1%", "B": "2%", "C": "5%", "D": "0.1%"}, "answer": "A", "note": ""}, {"id": "tax-100-14", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 14, "question": "統一發票扣抵聯經載明「違章補開」者,下列有關扣抵或扣減之規定何者正確?", "options": {"A": "「違章補開」者只能作為扣抵銷項稅額之憑證", "B": "「違章補開」者只能作為扣減查定稅額之憑證", "C": "「違章補開」者可以作為扣抵銷項稅額與扣減查定稅額之憑證", "D": "「違章補開」者不能作為扣抵銷項稅額或扣減查定稅額之憑證,但因買受人檢舉而補開者,不在此限"}, "answer": "D", "note": ""}, {"id": "tax-100-15", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 15, "question": "營業人向在中華民國境內無固定營業場所之外國之事業、機關、團體、組織購買勞務,其給付額屬銀行\n業、保險業、信託投資等業之專屬本業勞務者,應按多少比率計算營業稅額,由勞務買受人繳納之?", "options": {"A": "2%", "B": "3%", "C": "5%", "D": "10%"}, "answer": "B", "note": ""}, {"id": "tax-100-16", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 16, "question": "依稅捐稽徵法第 6 條規定,下列何項稅捐之徵收,優先於一切債權及抵押權?", "options": {"A": "地價稅", "B": "所得稅", "C": "貨物稅", "D": "營業稅"}, "answer": "AD", "note": "答A或D或AD者均給分"}, {"id": "tax-100-17", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 17, "question": "依稅捐稽徵法第 2 條規定所稱之稅捐不包括下列何者?", "options": {"A": "關稅", "B": "地價稅", "C": "房屋稅", "D": "土地增值稅"}, "answer": "A", "note": ""}, {"id": "tax-100-18", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 18, "question": "依稅捐稽徵法之規定,下列敘述何者錯誤?", "options": {"A": "納稅義務人如發現繳納通知文書有記載、計算錯誤或重複時,於規定核課期間內,得要求稅捐稽徵機\n關,查對更正", "B": "依法應由納稅義務人申報繳納之稅捐,已在規定期間內申報,且無故意以詐欺或其他不正當方法逃漏\n稅捐者,其核課期間為五年", "C": "為稽徵稅捐所發之各種文書,得向納稅義務人之代理人以為送達", "D": "為稽徵土地稅或房屋稅所發之各種文書,得以使用人為應受送達人"}, "answer": "A", "note": ""}, {"id": "tax-100-19", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 19, "question": "老王有一棟房屋因無力繳納 A 銀行房屋抵押貸款之利息而被法拍,若該房屋拍定價格為 500 萬元,應納\n土地增值稅 80 萬元,該房屋應繳之房屋稅 10 萬元,積欠 A 銀行房貸 400 萬元,另老王尚積欠綜合所得\n稅 100 萬元,試問若不考慮其他稅捐與費用,法拍後 A 銀行可以收回多少房屋貸款?", "options": {"A": "310 萬元", "B": "320 萬元", "C": "390 萬元", "D": "400 萬元"}, "answer": "D", "note": ""}, {"id": "tax-100-20", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 20, "question": "甲公司對於財政部高雄市國稅局核定之營利事業所得稅額不服,經申請復查後未獲變更,請問甲公司應\n向下列那一機關提起訴願?", "options": {"A": "財政部", "B": "財政部高雄市國稅局", "C": "高雄高等行政法院", "D": "高雄市政府"}, "answer": "A", "note": ""}, {"id": "tax-100-21", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 21, "question": "經行政訴訟程序終結判決,應補繳稅款者,稅捐稽徵機關應於接到行政法院判決書正本後十日內,填發\n補繳稅款繳納通知書,通知納稅義務人繳納。並應按補繳稅額,依下列那一年度郵政儲金一年期定期儲\n金固定利率,按日加計利息,一併徵收?", "options": {"A": "原應繳納年度", "B": "申請復查年度", "C": "判決確定年度", "D": "各年度一月一日"}, "answer": "D", "note": ""}, {"id": "tax-100-22", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 22, "question": "黃先生於 100 年 5 月 20 日申報 99 年度個人綜合所得稅,若假設黃先生無故意以詐欺或其他不正當方法\n逃漏稅捐,請問黃先生之核課期間應由那一天起算?", "options": {"A": "100 年 5 月 20 日", "B": "100 年 5 月 21 日", "C": "100 年 5 月 31 日", "D": "100 年 6 月 1 日"}, "answer": "A", "note": ""}, {"id": "tax-100-23", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 23, "question": "吳先生住家為自用住宅多年,因為稅捐稽徵處誤將吳先生之地價稅稅率以一般稅率千分之十計算並收取\n15 年之久,試問依照稅捐稽徵法的規定,吳先生最多可以退回幾年的稅款?", "options": {"A": "2 年", "B": "5 年", "C": "10 年", "D": "15 年"}, "answer": "D", "note": ""}, {"id": "tax-100-24", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 24, "question": "下列何者不得列為所得稅法第 17 條規定免稅額之扶養親屬?", "options": {"A": "納稅義務人大學畢業但尚在補習班補習研究所考試之二十四歲女兒", "B": "納稅義務人年滿六十歲之父親", "C": "配偶之十八歲弟弟", "D": "納稅義務人之十二歲兒子"}, "answer": "A", "note": ""}, {"id": "tax-100-25", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 25, "question": "下列何者不是所得稅法第 17 條所稱之列舉扣除額項目?", "options": {"A": "購屋借款利息", "B": "房屋租金支出", "C": "災害損失", "D": "教育學費"}, "answer": "D", "note": ""}, {"id": "tax-100-26", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 26, "question": "下列何者不是所得稅法施行細則第 10 條之 1 所稱不可抗力之災害?", "options": {"A": "蟲災", "B": "竊盜損失", "C": "戰禍", "D": "風災"}, "answer": "B", "note": ""}, {"id": "tax-100-27", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 27, "question": "依所得稅法第 5 條之 1 規定,綜合所得稅之身心障礙特別扣除額基準,應依所得水準及基本生活變動情\n形調整,多久評估一次?", "options": {"A": "2 年", "B": "4 年", "C": "1 年", "D": "3 年"}, "answer": "D", "note": ""}, {"id": "tax-100-28", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 28, "question": "目前臺灣地區人民有香港來源所得者,應如何納稅?", "options": {"A": "應併同臺灣地區來源所得課徵所得稅", "B": "應併同臺灣地區來源所得課徵所得稅,但其在香港地區已繳納之稅額,准自應納稅額中扣抵", "C": "免稅", "D": "採 20%分離課稅"}, "answer": "C", "note": ""}, {"id": "tax-100-29", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 29, "question": "某甲取得我國 B 公司所發放之股利淨額 8,000 元,可扣抵稅額 2,000 元,試問某甲應如何申報該筆所得?", "options": {"A": "申報營利所得 1 萬元", "B": "申報營利所得 8,000 元", "C": "申報利息所得 1 萬元", "D": "申報利息所得 8,000 元"}, "answer": "A", "note": ""}, {"id": "tax-100-30", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 30, "question": "孫先生為我國境內之居住者,若孫先生參加百貨公司周年慶摸彩,抽獎獲得汽車一部,價值 80 萬元,試\n問應如何課稅?", "options": {"A": "機會中獎之所得免稅", "B": "機會中獎之所得採 10%分離課稅", "C": "機會中獎之所得採 20%分離課稅", "D": "應併入孫先生之綜合所得中申報納稅"}, "answer": "D", "note": ""}, {"id": "tax-100-31", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 31, "question": "李君為我國境內之居住者,若李君取得營利事業之贈與 500 萬元,試問李君應如何申報納稅?", "options": {"A": "取得營利事業之贈與免稅", "B": "扣除 220 萬元贈與免稅額後繳納贈與稅", "C": "應併入李君之其他所得申報納稅", "D": "應採 20%分離課稅"}, "answer": "C", "note": ""}, {"id": "tax-100-32", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 32, "question": "自民國 100 年度起,總機構在中華民國境內經營海運業務之營利事業,符合一定要件,經中央目的事業\n主管機關核定者,其海運業務收入得選擇按船舶淨噸位計算營利事業所得額,但一經選定,應連續適用\n幾年,不得變更?", "options": {"A": "2 年", "B": "3 年", "C": "5 年", "D": "10 年"}, "answer": "D", "note": ""}, {"id": "tax-100-33", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 33, "question": "下列有關獨資、合夥組織之營利事業辦理結算申報之敘述何者正確?", "options": {"A": "應計算及繳納營利事業所得稅結算稅額", "B": "應計算營利事業所得稅結算稅額但無須繳納", "C": "其營利事業所得額應由獨資資本主、合夥組織合夥人依規定列為營利所得,申報綜合所得稅", "D": "兩稅合一之後獨資合夥企業只需辦理暫繳申報,無須繳納營利事業所得稅"}, "answer": "C", "note": ""}, {"id": "tax-100-34", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 34, "question": "張小姐為非中華民國境內居住之個人,若張小姐有美國投資收益 500 萬元,應如何申報繳納我國之所得\n基本稅額?", "options": {"A": "須申報但無須繳納所得基本稅額", "B": "扣除 100 萬元後之餘額計入基本所得額中", "C": "應將 500 萬元全數計入基本所得額中", "D": "無須申報與繳納所得基本稅額"}, "answer": "D", "note": ""}, {"id": "tax-100-35", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 35, "question": "依所得基本稅額條例施行細則第 12 條規定,營利事業計算基本稅額係以基本所得額減除新臺幣多少元,再\n乘上徵收率?", "options": {"A": "200 萬", "B": "300 萬", "C": "400 萬", "D": "600 萬"}, "answer": "A", "note": ""}, {"id": "tax-100-36", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 36, "question": "依照我國營利事業所得稅查核準則規定,下列營利事業繳納之稅捐,何者可依法以稅捐費用列支?", "options": {"A": "購買土地、房屋所繳納之契稅、印花稅", "B": "進口貨物所繳納之關稅", "C": "對本事業所擁有之不動產課徵之房屋稅、地價稅", "D": "出售土地所繳納之土地增值稅"}, "answer": "C", "note": ""}, {"id": "tax-100-37", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 37, "question": "依照我國營利事業所得稅查核準則規定,下列營利事業未實現之費用或損失,何者不得列為當年度費用\n或損失?", "options": {"A": "按權益法認列之投資損失", "B": "依勞工退休金條例提繳之勞工退休金", "C": "商品存貨按成本與淨變現價值孰低為準估價之跌價損失", "D": "依職工福利金條例成立職工福利委員會提撥之職工福利金"}, "answer": "A", "note": ""}, {"id": "tax-100-38", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 38, "question": "依照營利事業所得稅查核準則之相關規定,下列營利事業之利息支出,何者得直接列為當年度利息費用?", "options": {"A": "因增建固定資產而借款在建造期間應付之利息費用", "B": "購買土地之借款利息", "C": "行政救濟程序確定應補繳稅款所加計之利息", "D": "向金融業以外之借款利息,超過利率標準部分"}, "answer": "C", "note": ""}, {"id": "tax-100-39", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 39, "question": "營利事業購置自用豪華轎車一部價值 300 萬元,購入日期為 99 年 1 月 1 日,可使用 5 年,依平均法計提\n折舊,預估殘值為 50 萬元,依照營利事業所得稅查核準則之相關規定,請計算其 99 年可認列之折舊費\n用為若干?", "options": {"A": "400,000 元", "B": "416,667 元", "C": "500,000 元", "D": "600,000 元"}, "answer": "A", "note": ""}, {"id": "tax-100-40", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 40, "question": "營利事業購置固定資產,其耐用年限超過 2 年,而支出金額不超過新臺幣多少元者,得以其成本列為當\n年度費用?", "options": {"A": "6 萬元", "B": "8 萬元", "C": "10 萬元", "D": "20 萬元"}, "answer": "B", "note": ""}, {"id": "tax-100-41", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 41, "question": "欣欣公司分期付款之銷貨,依營利事業所得稅查核準則第 16 條規定,若其當期損益採用毛利百分比法計\n算,則其分期付款期限為何?", "options": {"A": "15 個月以上者", "B": "14 個月以上者", "C": "13 個月以上者", "D": "12 個月以上者"}, "answer": "C", "note": ""}, {"id": "tax-100-42", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 42, "question": "依營利事業所得稅查核準則第 81 條規定,有關福利金提撥標準及費用認列規定,下列何者有誤?", "options": {"A": "增資資本額之百分之五限度內一次提撥", "B": "創立時實收資本總額之百分之五限度內一次提撥", "C": "每月營業收入總額內提撥百分之○‧○五至○‧一五", "D": "下腳變價時,提撥百分之五十"}, "answer": "D", "note": ""}, {"id": "tax-100-43", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 43, "question": "依營利事業所得稅查核準則第 102 條及第 103 條規定,下列何者錯誤?", "options": {"A": "災害損失應列為當年度損失。但損失較為鉅大者,得於三年內平均攤列", "B": "員工因遭受災害傷亡,其由各該事業支付及取得醫院出具之證明書據之醫藥費,可核實認定該費用或\n損失", "C": "聘請外籍人員來臺服務,附有聘僱合約者,其到任之行李運送費用,可核實認定該費用或損失", "D": "因業務需要免費發給員工之工作服,可核實認定該費用或損失"}, "answer": "A", "note": ""}, {"id": "tax-100-44", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 44, "question": "甲公司出售一間辦公室,買賣契約簽約日為 98 年 12 月 30 日,因一些因素考量,買賣雙方約定於 99 年 1 月\n10 日實際交付,另於 100 年 2 月 1 日辦理所有權移轉登記,依營利事業所得稅查核準則第 24 條之 2 規定,\n其出售所得應歸屬那一年度?", "options": {"A": "97 年度", "B": "98 年度", "C": "99 年度", "D": "100 年度"}, "answer": "C", "note": ""}, {"id": "tax-100-45", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 45, "question": "營利事業因八八水災,當年度關係所得額之全部原始憑證滅失,該滅失憑證所屬期間之所得額,依營利\n事業所得稅查核準則第 11 條規定,稽徵機關得依該事業以前幾個年度經稽徵機關核定純益率之平均數核\n定之?", "options": {"A": "1 年", "B": "2 年", "C": "3 年", "D": "4 年"}, "answer": "C", "note": ""}, {"id": "tax-100-46", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 46, "question": "依遺產及贈與稅法第 6 條及第 7 條規定,下列何者錯誤?", "options": {"A": "有遺囑執行人者,遺產稅之納稅義務人為繼承人", "B": "贈與稅之納稅義務人除法律另有規定外,原則上為贈與人", "C": "贈與人行蹤不明者,以受贈人為納稅義務人", "D": "贈與人死亡時贈與稅尚未核課,以受贈人為納稅義務人"}, "answer": "A", "note": ""}, {"id": "tax-100-47", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 47, "question": "某乙於 100 年 10 月 16 日星期日死亡,若某乙持有我國上市 C 公司之股票 100 萬股,試問應以那一天之\n價格計算 C 公司股票價值課徵遺產稅?", "options": {"A": "10 月 14 日之收盤價", "B": "10 月 17 日之開盤價", "C": "10 月 17 日之收盤價", "D": "10 月 16 日公司之資產淨值"}, "answer": "A", "note": ""}, {"id": "tax-100-48", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 48, "question": "謝先生以自己的資金 2,000 萬元無償替其朋友購買一塊土地,若該土地公告現值為 800 萬元,請問依照遺\n產及贈與稅法規定,其視為贈與之金額為多少?", "options": {"A": "128 萬元", "B": "320 萬元", "C": "800 萬元", "D": "2,000 萬元"}, "answer": "C", "note": ""}, {"id": "tax-100-49", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 49, "question": "趙老大與其妻李仙女二人於長女結婚時分別贈與長女嫁妝 100 萬元,也分別再給長女現金 200 萬元,假\n設趙老大與其妻李仙女當年度都未贈與任何財產給任何人,有關當年度應計入贈與之淨額,下列何者正\n確?", "options": {"A": "趙老大贈與淨額 80 萬元,李仙女 0 元", "B": "趙老大贈與淨額 100 萬元,李仙女 0 元", "C": "趙老大贈與淨額 0 元,李仙女 80 萬元", "D": "趙老大贈與淨額 0 元,李仙女 0 元"}, "answer": "D", "note": ""}, {"id": "tax-100-50", "year": "100", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 50, "question": "吉米是經常居住於臺中市之美國人,若吉米將其在中華民國境內之財產贈與給經常居住在高雄市的我國\n國民張三,試問吉米應向下列那一個財政部國稅局申報贈與稅?", "options": {"A": "臺灣省中區國稅局", "B": "臺灣省南區國稅局", "C": "高雄市國稅局", "D": "臺北市國稅局"}, "answer": "D", "note": ""}, {"id": "accounting-101-1", "year": "101", "subject": "accounting", "subjectName": "會計學概要", "number": 1, "question": "大華公司 X1 年 5 月 31 日銀行對帳單上存款餘額$173,280,此外,經查證得知公司在五月份有存款不足\n支票$20,900,未兌現支票$40,200,在途存款$52,000,銀行手續費$150,則大華公司 5 月 31 日銀行存款\n正確金額應為多少?", "options": {"A": "$185,080", "B": "$161,480", "C": "$164,030", "D": "$140,430"}, "answer": "A", "note": ""}, {"id": "accounting-101-2", "year": "101", "subject": "accounting", "subjectName": "會計學概要", "number": 2, "question": "仁愛公司期末漏記應付租金之調整分錄,試問其影響為:", "options": {"A": "負債及權益高列", "B": "負債及權益低列", "C": "負債低列,權益高列", "D": "負債高列,權益低列"}, "answer": "C", "note": ""}, {"id": "accounting-101-3", "year": "101", "subject": "accounting", "subjectName": "會計學概要", "number": 3, "question": "金華公司 X1 年度之銷貨淨額為$2,500,000,X1 年 12 月 31 日之應收帳款為$340,000,壞帳採應收帳款餘\n額百分比法估列,壞帳率為期末應收帳款之 5%。X1 年備抵壞帳之期初餘額為貸餘$14,000,在 X1 年內\n沖銷之壞帳金額為$25,000。試問金華公司 X1 年 12 月 31 日備抵壞帳之調整後餘額為:", "options": {"A": "$3,000", "B": "$17,000", "C": "$28,000", "D": "$31,000"}, "answer": "B", "note": ""}, {"id": "accounting-101-4", "year": "101", "subject": "accounting", "subjectName": "會計學概要", "number": 4, "question": "期聯公司在 X1 年進貨$1,200,000,付款的條件為 3/15,n/60,假設一年以 360 天計,則此筆帳款隱含的\n利率為:", "options": {"A": "18%", "B": "21%", "C": "24%", "D": "72%"}, "answer": "C", "note": ""}, {"id": "accounting-101-5", "year": "101", "subject": "accounting", "subjectName": "會計學概要", "number": 5, "question": "橘子公司在 X1 年 7 月 15 日賒銷$12,000,付款條件為 2/10,n/30,此批銷貨在 7 月 18 日有$800 的銷貨\n退回。若橘子公司在 7 月 24 日收現,則此交易實際收到的現金為何?", "options": {"A": "$12,000", "B": "$11,760", "C": "$11,200", "D": "$10,976"}, "answer": "D", "note": ""}, {"id": "accounting-101-6", "year": "101", "subject": "accounting", "subjectName": "會計學概要", "number": 6, "question": "下列有關零用金之敘述,何者錯誤?", "options": {"A": "設立時貸記現金", "B": "使用時不作分錄", "C": "使用時貸記現金", "D": "補充時借記相關費用"}, "answer": "C", "note": ""}, {"id": "accounting-101-7", "year": "101", "subject": "accounting", "subjectName": "會計學概要", "number": 7, "question": "公司帳載現金餘額為$9,700,已知第 109 號支票之面額為$6,800,帳上卻誤記為$8,600,又銀行代收票據\n一紙$2,500,公司尚未入帳,則正確的現金餘額應為:", "options": {"A": "$14,000", "B": "$10,400", "C": "$12,000", "D": "$13,400"}, "answer": "A", "note": ""}, {"id": "accounting-101-8", "year": "101", "subject": "accounting", "subjectName": "會計學概要", "number": 8, "question": "公司賒購用品$1,800,將使財務報表產生何種影響?", "options": {"A": "資產減少$1,800,收入增加$1,800", "B": "一種資產增加$1,800,另一種資產減少$1,800", "C": "資產增加$1,800,負債增加$1,800", "D": "資產減少$1,800,權益增加$1,800"}, "answer": "C", "note": ""}, {"id": "accounting-101-9", "year": "101", "subject": "accounting", "subjectName": "會計學概要", "number": 9, "question": "財務報表中說明公司所採用會計方法的部分在:", "options": {"A": "公司簡介", "B": "資產負債表", "C": "財務報表附註", "D": "審計查核報告書"}, "answer": "C", "note": ""}, {"id": "accounting-101-10", "year": "101", "subject": "accounting", "subjectName": "會計學概要", "number": 10, "question": "寶麗公司在 X1 年 1 月 1 日與 12 月 31 日之保留盈餘分別為$41,000 與$58,000,X1 年間公司之收益總額\n為$52,000,費損總額為$23,500。在沒有其他事件的情況下,寶麗公司 X1 年之股利為:", "options": {"A": "$70,500", "B": "$28,500", "C": "$17,000", "D": "$11,500"}, "answer": "D", "note": ""}, {"id": "accounting-101-11", "year": "101", "subject": "accounting", "subjectName": "會計學概要", "number": 11, "question": "中山公司 X9 年期初存貨$5,000,進貨$35,000,期末存貨$11,000,現金銷貨$5,000,銷貨毛利$11,000,期\n初應收帳款$8,000,收回應收帳款$26,000,則期末之應收帳款餘額為:", "options": {"A": "$22,000", "B": "$43,000", "C": "$25,000", "D": "$17,000"}, "answer": "D", "note": ""}, {"id": "accounting-101-12", "year": "101", "subject": "accounting", "subjectName": "會計學概要", "number": 12, "question": "豆枝公司在 X1 年出售大華公司股票獲得現金$120,000,並向豐豐銀行借款$50,000,其後處分大直的一塊\n土地獲得現金$18,000,此外,以現金$27,000 購入小星公司股票 300 張,並以$20,000 現金購回庫藏股。\n請計算豆枝公司 X1 年之投資活動現金流量:", "options": {"A": "$111,000", "B": "$123,000", "C": "$141,000", "D": "$161,000"}, "answer": "A", "note": ""}, {"id": "accounting-101-13", "year": "101", "subject": "accounting", "subjectName": "會計學概要", "number": 13, "question": "根據下列資料以零售價法估計期末存貨:\n期初存貨:成本 $1,000,零售價 $2,000 \n進 貨:成本$12,000,零售價$18,000 \n銷 貨: 零售價$12,500", "options": {"A": "$5,000", "B": "$6,250", "C": "$3,575", "D": "$4,875"}, "answer": "D", "note": ""}, {"id": "accounting-101-14", "year": "101", "subject": "accounting", "subjectName": "會計學概要", "number": 14, "question": "幕亮公司期末存貨為$80,000,進貨為$120,000,銷貨成本為$100,000,試問,幕亮公司期初存貨為:", "options": {"A": "$60,000", "B": "$100,000", "C": "$120,000", "D": "$140,000"}, "answer": "A", "note": ""}, {"id": "accounting-101-15", "year": "101", "subject": "accounting", "subjectName": "會計學概要", "number": 15, "question": "大發公司 X1 年 1 月 1 日以$500,000 購入設備,耐用年限十年,殘值$50,000,採直線法提列折舊,若 X4\n年底作減損測試,估計該資產之使用價值為$270,000,公允價值為$300,000,則 X4 年應認列之減損損失\n為:", "options": {"A": "$0", "B": "$20,000", "C": "$30,000", "D": "$50,000"}, "answer": "B", "note": ""}, {"id": "accounting-101-16", "year": "101", "subject": "accounting", "subjectName": "會計學概要", "number": 16, "question": "大名公司因颱風造成產品泡水情形,該泡水產品之成本為$190,000,定價為$270,000,今估計需花費$20,000\n修理該產品後,可依定價之 2/3 出售。該泡水產品之淨變現價值為:", "options": {"A": "$160,000", "B": "$170,000", "C": "$180,000", "D": "$190,000"}, "answer": "A", "note": ""}, {"id": "accounting-101-17", "year": "101", "subject": "accounting", "subjectName": "會計學概要", "number": 17, "question": "大為公司 X1 年期末存貨低估,將對 X1 年之財務報表造成何種影響?", "options": {"A": "淨利高估", "B": "銷貨成本高估", "C": "保留盈餘高估", "D": "負債高估"}, "answer": "B", "note": ""}, {"id": "accounting-101-18", "year": "101", "subject": "accounting", "subjectName": "會計學概要", "number": 18, "question": "某公司產銷電子產品,並提供客戶兩年內享有免費修理服務,X5 年度銷貨收入為$4,000,000,估計維修\n費用為銷貨收入的 3%,若 X6 年度實際發生修理費用為$100,000,則支付維修費用時應:", "options": {"A": "借記維修費用$100,000", "B": "借記應付維修費用$100,000", "C": "借記維修費用$120,000", "D": "借記應付維修費用$120,000"}, "answer": "B", "note": ""}, {"id": "accounting-101-19", "year": "101", "subject": "accounting", "subjectName": "會計學概要", "number": 19, "question": "某一公司債之面額$100,000,利率 8%,期限為十年,在發行日係依 105 出售,則到期還本時應借記「應\n付公司債」的金額為:", "options": {"A": "$105,000", "B": "$95,000", "C": "$100,000", "D": "$108,000"}, "answer": "C", "note": ""}, {"id": "accounting-101-20", "year": "101", "subject": "accounting", "subjectName": "會計學概要", "number": 20, "question": "小米公司自國外購入一台機器,定價為$300,000,由於小米公司在期限內付款,因此享有 2%的現金折扣,\n其他相關支出包含運費$12,000、關稅$15,000、安裝及試車費$32,000,此外,運送途中司機接到$5,000 之\n罰單,而公司為此機器購入未來 1 年期之保險$20,000。則此機器之成本為何?", "options": {"A": "$300,000", "B": "$353,000", "C": "$359,000", "D": "$378,000"}, "answer": "B", "note": ""}, {"id": "accounting-101-21", "year": "101", "subject": "accounting", "subjectName": "會計學概要", "number": 21, "question": "甲公司本年度稅前淨利$270,000,所得稅率 25%,年初流通在外普通股為 100,000 股,7 月 1 日收回普通\n股 20,000 股,則當年度稅後每股盈餘為:", "options": {"A": "$3.00", "B": "$2.025", "C": "$2.5", "D": "$2.25"}, "answer": "D", "note": ""}, {"id": "accounting-101-22", "year": "101", "subject": "accounting", "subjectName": "會計學概要", "number": 22, "question": "達馬公司 X1 年 1 月 1 日有流通在外普通股 1,200,000 股,X1 年 5 月 1 日達馬公司增資發行 240,000 股,\n該公司在 X1 年 9 月 1 日再增資發行 600,000 股,則達馬公司 X1 年加權平均流通在外股數為:", "options": {"A": "1,200,000 股", "B": "1,560,000 股", "C": "1,620,000 股", "D": "2,040,000 股"}, "answer": "B", "note": ""}, {"id": "accounting-101-23", "year": "101", "subject": "accounting", "subjectName": "會計學概要", "number": 23, "question": "東方公司 X1 年的期初在製品存貨為$5,000,本年投入直接原料$23,000,直接人工$15,000,間接製造成\n本分攤率為直接人工成本的 80%,期末在製品存貨為$8,000,則本期製成品成本為:", "options": {"A": "$63,000", "B": "$53,750", "C": "$47,000", "D": "$35,000"}, "answer": "C", "note": ""}, {"id": "accounting-101-24", "year": "101", "subject": "accounting", "subjectName": "會計學概要", "number": 24, "question": "大樑公司發行面額$100,5 年期,利率 3%之公司債,若發行當時市場利率為 5%,則此公司債為:", "options": {"A": "溢價發行", "B": "折價發行", "C": "平價發行", "D": "貼價發行"}, "answer": "B", "note": ""}, {"id": "accounting-101-25", "year": "101", "subject": "accounting", "subjectName": "會計學概要", "number": 25, "question": "大宇公司 X8 年度資料:發行公司債得款$500,000,現付公司債利息$50,000,現購存貨$95,000,現購庫\n藏股$150,000,現購機器設備$350,000,發行特別股收現$400,000,支付特別股現金股利$100,000,則其\n融資活動的淨現金流入為:", "options": {"A": "$900,000", "B": "$800,000", "C": "$650,000", "D": "$600,000"}, "answer": "C", "note": ""}, {"id": "bookkeeping-101-1", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 1, "question": "依據我國記帳士法之規定,下列有關不得充任記帳士之資格規定,何者錯誤?", "options": {"A": "受監護或輔助宣告尚未撤銷者", "B": "經公立醫院證明有精神病者", "C": "曾因業務上有詐欺、背信、侵占、偽造文書等犯罪行為,受有期徒刑未達一年之裁判確定者", "D": "受破產之宣告尚未復權者"}, "answer": "C", "note": ""}, {"id": "bookkeeping-101-2", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 2, "question": "依據我國記帳士法之規定,記帳士於執行業務前,應向那一單位申請登錄?", "options": {"A": "財政部所屬各地區國稅局", "B": "各地區稅捐稽徵處", "C": "縣市政府財政局", "D": "經濟部"}, "answer": "A", "note": ""}, {"id": "bookkeeping-101-3", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 3, "question": "依據我國記帳士法之規定,曾任稅務機關稅務職系人員者,自離職之日起幾年內,不得於其最後任職機\n關所在地之直轄市、縣市區域內執行記帳士職務?", "options": {"A": "一年內", "B": "二年內", "C": "三年內", "D": "五年內"}, "answer": "C", "note": ""}, {"id": "bookkeeping-101-4", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 4, "question": "老王是合格之記帳士,在臺北市登記開業並執行業務,若老王想到臺中執行業務,則下列敘述何者正確?", "options": {"A": "應向主管機關登記,免設分事務所", "B": "應向主管機關登記,並應設分事務所", "C": "不必向主管機關登記,只需另設分事務所", "D": "記帳士只能在其登記開業之縣市執行業務,不得跨區執行業務"}, "answer": "A", "note": ""}, {"id": "bookkeeping-101-5", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 5, "question": "依據我國記帳士法之規定,下列有關記帳士執行業務之敘述,何者錯誤?", "options": {"A": "記帳士接受委任代理各項業務,應與委任人訂立委任書", "B": "記帳士接受委任代理各項業務,須將委任書留存於事務所內,不得附送受理機關", "C": "記帳士執行業務所設置之事務所名稱,應註明「記帳士事務所」", "D": "經登錄之記帳士,因停業、復業或原登錄事項有變更時,應向其原登錄之機關申報備查"}, "answer": "B", "note": ""}, {"id": "bookkeeping-101-6", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 6, "question": "依據我國記帳士法之規定,記帳士在登錄區域內,不得執行下列那一項業務?", "options": {"A": "受委任辦理營業、變更、註銷、停業、復業及其他登記事項", "B": "受委任向財政部提起稅務案件訴願", "C": "受理稅務諮詢事項", "D": "受委任辦理商業會計事務"}, "answer": "B", "note": ""}, {"id": "bookkeeping-101-7", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 7, "question": "依據我國記帳士法之規定,記帳士因懈怠或疏忽,致委任人或其利害關係人受有損害時,應由誰負責?", "options": {"A": "記帳士免責,因為記帳士只負責提供財務資訊", "B": "須由利害關係人負責", "C": "須由委任人自行負責", "D": "記帳士應負賠償責任"}, "answer": "D", "note": ""}, {"id": "bookkeeping-101-8", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 8, "question": "依據我國記帳士法之規定,記帳士受委任後,非有正當事由,不得終止其契約。如須終止契約,應於幾\n日前通知委任人,在未得委任人同意前,不得終止進行?", "options": {"A": "五日前", "B": "十日前", "C": "二十日前", "D": "一個月前"}, "answer": "B", "note": ""}, {"id": "bookkeeping-101-9", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 9, "question": "依據我國記帳士法之規定,直轄市及縣(市)記帳士公會,應由該行政區域內開業記帳士多少人以上發\n起組織之?", "options": {"A": "十人", "B": "三十人", "C": "五十人", "D": "一百人"}, "answer": "B", "note": ""}, {"id": "bookkeeping-101-10", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 10, "question": "下列何者不是記帳士應交付懲戒之事項?", "options": {"A": "逃漏稅捐,經稅捐稽徵機關處分有案者", "B": "違反記帳士公會章程之規定,情節重大者", "C": "因業務之犯罪行為經檢察官起訴,但尚未判刑確定者", "D": "受行政處分,情節重大,足以影響記帳士信譽者"}, "answer": "C", "note": ""}, {"id": "bookkeeping-101-11", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 11, "question": "記帳錯誤如更正後影響總數者,應:", "options": {"A": "另開傳票更正", "B": "在原錯誤上劃紅線二道,將更正之數字或文字書寫於上", "C": "由更正人於原錯誤上更正處簽名", "D": "由更正人於原錯誤上更正處蓋章"}, "answer": "A", "note": ""}, {"id": "bookkeeping-101-12", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 12, "question": "記帳及報稅代理業務人自民國 97 年以後每年應完成多少小時以上之相關專業訓練?", "options": {"A": "四十八小時", "B": "三十六小時", "C": "三十小時", "D": "二十四小時"}, "answer": "D", "note": ""}, {"id": "bookkeeping-101-13", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 13, "question": "依據我國記帳士法之規定,下列有關記帳士交付懲戒之敘述,何者錯誤?", "options": {"A": "記帳士應付懲戒者,由記帳士懲戒委員會處理之", "B": "記帳士懲戒委員會應將交付懲戒事件,通知被付懲戒人,並命其於通知送達之翌日起二十日內提出答\n辯或到會陳述", "C": "被懲戒人對於記帳士懲戒委員會之決議不服者,得於決議書送達之翌日起二十日內,向財政部提起訴願", "D": "記帳士懲戒委員會處理懲戒事件,認為有犯罪嫌疑者,應即移送司法機關偵辦"}, "answer": "C", "note": ""}, {"id": "bookkeeping-101-14", "year": "101", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 14, "question": "依據我國商業會計法之規定,有關公司組織之商業,其主辦會計人員任免之規定,下列何者錯誤?", "options": {"A": "股份有限公司,應由董事會以董事過半數之出席,及出席董事過半數之同意", "B": "在有限公司,應有全體股東過半數之同意", "C": "在無限公司、兩合公司,應有全體無限責任股東過半數之同意", "D": "有關主辦會計人員之
