成本的資料如下:X1 年底成本$151,000,淨變現價值$145,000;X2 年\n底成本$193,000,淨變現價值$190,000;X3 年底成本$178,000,淨變現價值$179,000。另假設甲公司以備\n抵存貨跌價損失科目記錄期末存貨之評價結果,則 X3 年底存貨評價分錄應借記:", "options": {"A": "備抵存貨跌價損失$3,000", "B": "備抵存貨跌價損失$8,000", "C": "備抵存貨跌價損失$9,000", "D": "備抵存貨跌價損失$1,000"}, "answer": "A", "note": ""}, {"id": "accounting-103-11", "year": "103", "subject": "accounting", "subjectName": "會計學概要", "number": 11, "question": "下列那一項會加強現金支出的控制:", "options": {"A": "所有的現金支出均由現金收入中支付", "B": "不可由同一人掌管出納及編製銀行存款調節表", "C": "現金支出之授權及出納由同一人擔任", "D": "支票的準備與審核由同一人擔任"}, "answer": "B", "note": ""}, {"id": "accounting-103-12", "year": "103", "subject": "accounting", "subjectName": "會計學概要", "number": 12, "question": "甲公司 X1 年 1 月 1 日備抵壞帳餘額為$14,000(貸餘),當年度沖銷壞帳為$6,000,收回沖銷的壞帳\n為$2,000。根據以往經驗,期末應收帳款的 5%會成為壞帳,甲公司 X1 年 12 月 31 日的應收帳款為\n$300,000。則 X1 年度的壞帳費用為:", "options": {"A": "$15,000", "B": "$11,000", "C": "$9,000", "D": "$5,000"}, "answer": "D", "note": ""}, {"id": "accounting-103-13", "year": "103", "subject": "accounting", "subjectName": "會計學概要", "number": 13, "question": "甲公司購置機器一部,買價$560,000,另付安裝費及試車費$60,000,採直線法折舊,估計可用 6 年,殘\n值為$20,000,使用滿三年後,於第四年初發現機器僅能再用 2 年,且無殘值,則第四年終應計提折舊:", "options": {"A": "$100,000", "B": "$130,000", "C": "$150,000", "D": "$160,000"}, "answer": "D", "note": ""}, {"id": "accounting-103-14", "year": "103", "subject": "accounting", "subjectName": "會計學概要", "number": 14, "question": "請閱讀下方原卷的選擇題第 14 題，再選 A、B、C 或 D。", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "A", "note": "", "paper": "103170_1302_會計學概要.pdf", "images": ["pages/103/1302-4.jpg"]}, {"id": "accounting-103-15", "year": "103", "subject": "accounting", "subjectName": "會計學概要", "number": 15, "question": "請閱讀下方原卷的選擇題第 15 題，再選 A、B、C 或 D。", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "A", "note": "", "paper": "103170_1302_會計學概要.pdf", "images": ["pages/103/1302-4.jpg"]}, {"id": "accounting-103-16", "year": "103", "subject": "accounting", "subjectName": "會計學概要", "number": 16, "question": "甲公司生 本年度成本資 : g"]}, {"id": "accounting-103-23", "year": "103", "subject": "accounting", "subjectName": "會計學概要", "number": 23, "question": "下列有關零用 敘述,何者正確?", "options": {"A": "平日零星支付時,應借記各項費用,", "B": "設置時,應借記零用金,貸記現金", "C": "採不定額預付制", "D": "補充零用金時,應"}, "answer": "B", "note": ""}, {"id": "accounting-103-24", "year": "103", "subject": "accounting", "subjectName": "會計學概要", "number": 24, "question": "下列有關銀行往來調節表中未兌現支票之敘述", "options": {"A": "需作補正分錄", "B": "應列為", "C": "應列為銀行對帳單餘額之減項", "D": "應列為公司帳面存款餘額之減項"}, "answer": "C", "note": ""}, {"id": "accounting-103-25", "year": "103", "subject": "accounting", "subjectName": "會計學概要", "number": 25, "question": "請閱讀下方原卷的選擇題第 25 題，再選 A、B、C 或 D。", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "A", "note": "", "paper": "103170_1302_會計學概要.pdf", "images": ["pages/103/1302-4.jpg"]}, {"id": "bookkeeping-103-1", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 1, "question": "依據我國記帳士法之規定,下列何者非不得充任記帳士之情事?", "options": {"A": "曾有欠繳稅捐或罰鍰之紀錄者", "B": "曾因業務上有詐欺、背信、侵占、偽造文書等犯罪行為,受有期徒刑一年以上刑之裁判確定者", "C": "受破產之宣告尚未復權者", "D": "曾服公職而受撤職處分,其停止任用期間尚未屆滿者"}, "answer": "A", "note": ""}, {"id": "bookkeeping-103-2", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 2, "question": "依據我國記帳士法之規定,下列敘述何者錯誤?", "options": {"A": "記帳士因業務之犯罪行為經判刑確定者,應付懲戒", "B": "違反記帳士公會章程之規定,情節重大者,應付懲戒", "C": "記帳士受申誡處分三次以上者,應另受停止執行業務之處分", "D": "記帳士受停止執行業務處分累計滿三年者,應予除名"}, "answer": "D", "note": ""}, {"id": "bookkeeping-103-3", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 3, "question": "依據我國記帳士法之規定,下列敘述何者正確?", "options": {"A": "記帳士登錄後,可以申請不加入記帳士公會,自行執業", "B": "記帳士公會得拒絕具有會員資格者加入", "C": "記帳士因懈怠或疏忽,致委任人或其利害關係人受有損害時,應負賠償責任", "D": "記帳士受委任後,非有正當事由,不得終止其契約。如須終止契約,應於 30 日前通知委任人"}, "answer": "C", "note": ""}, {"id": "bookkeeping-103-4", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 4, "question": "依據我國記帳士法之規定,下列何者不是記帳士在其登錄區域內可執行之業務?", "options": {"A": "受委任代訴願人提起訴願", "B": "受委任辦理各項稅捐稽徵案件之申報及申請事項", "C": "受委任辦理營業、變更、註銷、停業、復業及其他登記事項", "D": "受理稅務諮詢事項"}, "answer": "A", "note": ""}, {"id": "bookkeeping-103-5", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 5, "question": "同級記帳士公會理事長若連任,依記帳士法第 23 條規定其可連續擔任理事長一職最長為幾年?", "options": {"A": "四年", "B": "六年", "C": "八年", "D": "十年"}, "answer": "C", "note": ""}, {"id": "bookkeeping-103-6", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 6, "question": "依記帳士法第 12 條規定,經登錄之記帳士因原登錄事項有變更時,應自事實發生之日起幾日內,向其原登\n錄之機關申報備查?", "options": {"A": "十五日", "B": "二十日", "C": "三十日", "D": "四十五日"}, "answer": "C", "note": ""}, {"id": "bookkeeping-103-7", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 7, "question": "依記帳士法第 35 條規定之管理辦法第 14 條規定,記帳及報稅代理業務人經下列何者核准登錄,方得在登錄\n執行業務區域內,繼續執行相關業務?", "options": {"A": "國稅局", "B": "財政部", "C": "稅捐稽徵處", "D": "經濟部"}, "answer": "A", "note": ""}, {"id": "bookkeeping-103-8", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 8, "question": "依記帳士法第 34 條規定未依法取得記帳士資格,擅自執行受委任辦理各項稅捐稽徵案件之申報及申請事項,\n除依第 35 條第一項或其他法令規定得執行報稅業務者外,由主管機關依下列那一項處罰?", "options": {"A": "新臺幣一萬元以上五萬元以下罰鍰", "B": "新臺幣六萬元以上三十萬元以下罰鍰", "C": "新臺幣三萬元以上十五萬元以下罰鍰", "D": "新臺幣十萬元以上三十萬元以下罰鍰"}, "answer": "C", "note": ""}, {"id": "bookkeeping-103-9", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 9, "question": "依記帳士法第 30 條規定記帳士懲戒委員會處理懲戒事件,認為有犯罪嫌疑者,應即移送下列那一個單位偵辦?", "options": {"A": "經濟部", "B": "財政部", "C": "國稅局", "D": "司法機關"}, "answer": "D", "note": ""}, {"id": "bookkeeping-103-10", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 10, "question": "依記帳士法第 14 條明文規定,下列何者不是委任書應載明事項?", "options": {"A": "受委任人之證書字號", "B": "委任案件內容及委任權限", "C": "委任日期", "D": "委任酬金數額"}, "answer": "D", "note": ""}, {"id": "bookkeeping-103-11", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 11, "question": "依據我國最新修正商業會計法之規定,下列敘述何者錯誤?", "options": {"A": "商業必須設置之會計帳簿,為普通序時帳簿及總分類帳簿", "B": "製造業或營業範圍較大者,並得設置記錄成本之帳簿,或必要之特種序時帳簿及各種明細分類帳簿", "C": "會計制度健全,使用總分類帳會計項目日計表者,得免設總分類帳簿", "D": "商業所置會計帳簿,均應按其頁數順序編號,不得毀損"}, "answer": "C", "note": ""}, {"id": "bookkeeping-103-12", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 12, "question": "依據我國最新修正商業會計法之規定,商業負責人、主辦及經辦會計人員或依法受託代他人處理會計事務之\n人員有下列情事之一者,處五年以下有期徒刑、拘役或科或併科新臺幣六十萬元以下罰金,但不包括下列\n那一情事?", "options": {"A": "以明知為不實之事項,而填製會計憑證或記入帳冊", "B": "偽造或變造會計憑證、會計帳簿報表內容或毀損其頁數", "C": "未依法取得代他人處理會計事務之資格而擅自代他人處理商業會計事務", "D": "故意遺漏會計事項不為記錄,致使財務報表發生不實之結果"}, "answer": "C", "note": ""}, {"id": "bookkeeping-103-13", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 13, "question": "依據我國最新修正商業會計法之規定,下列有關會計憑證之敘述何者錯誤?", "options": {"A": "對外憑證之正本或存根均應依次編定字號,並應將其副本或存根,裝訂成冊;其正本之誤寫或收回作廢者,\n可以不必將其黏附於原號副本或存根之上", "B": "記帳憑證及會計帳簿,應由代表商業之負責人、經理人、主辦及經辦會計人員簽名或蓋章負責", "C": "記帳憑證得由代表商業之負責人授權經理人、主辦或經辦會計人員簽名或蓋章", "D": "會計憑證,應按日或按月裝訂成冊,有原始憑證者,應附於記帳憑證之後"}, "answer": "A", "note": ""}, {"id": "bookkeeping-103-14", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 14, "question": "依據我國最新修正商業會計法之規定,下列敘述何者錯誤?", "options": {"A": "金融工具投資應視其性質採公允價值、成本或攤銷後成本之方法衡量", "B": "存貨以成本與淨變現價值孰低衡量,當存貨成本高於淨變現價值時,應將成本沖減至淨變現價值", "C": "上述存貨沖減金額應於發生當期認列為營業費用", "D": "具有控制能力或重大影響力之長期股權投資,採用權益法處理"}, "answer": "C", "note": ""}, {"id": "bookkeeping-103-15", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 15, "question": "依據我國最新修正商業會計法之規定,下列敘述何者錯誤?", "options": {"A": "資產及負債之原始認列,以成本衡量為原則", "B": "商業在決定財務報表之會計項目金額時,應視實際情形,選擇適當之衡量基礎,但不得以歷史成本衡量", "C": "資產之取得,係由非貨幣性資產交換而來者,以公允價值衡量為原則。但公允價值無法可靠衡量時,以換\n出資產之帳面金額衡量", "D": "受贈資產按公允價值入帳,並視其性質列為資本公積、收入或遞延收入"}, "answer": "B", "note": ""}, {"id": "bookkeeping-103-16", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 16, "question": "依據我國最新修正商業會計法之規定,下列敘述何者錯誤?", "options": {"A": "報導期間經濟效益之減少,以資產流出、消耗或負債增加等方式減少權益,是為權益", "B": "因過去事項所產生之資源,該資源由商業控制,並預期帶來經濟效益之流入,是為資產", "C": "因過去事項所產生之現時義務,預期該義務之清償,將導致經濟效益之資源流出,是為負債", "D": "報導期間經濟效益之增加,以資產流入、增值或負債減少等方式增加權益(但不含業主投資而增加之權\n益),是為收益"}, "answer": "A", "note": ""}, {"id": "bookkeeping-103-17", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 17, "question": "依據我國最新修正商業會計法之規定,各項會計帳簿及財務報表,除有關未結會計事項者外,應於年度決算\n程序辦理終了後,至少保存多少年?", "options": {"A": "一年", "B": "三年", "C": "五年", "D": "十年"}, "answer": "D", "note": ""}, {"id": "bookkeeping-103-18", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 18, "question": "依據我國最新修正商業會計法之規定,會計事項應按發生次序逐日登帳,至遲不得超過多久的時間?", "options": {"A": "二天", "B": "一星期", "C": "一個月", "D": "二個月"}, "answer": "D", "note": ""}, {"id": "bookkeeping-103-19", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 19, "question": "依商業登記法第 3 條規定,商業之完整定義是指下列何者?", "options": {"A": "獨資組織之營利事業", "B": "獨資、合夥組織之營利事業", "C": "公司", "D": "公司或獨資、合夥組織之營利事業"}, "answer": "B", "note": ""}, {"id": "bookkeeping-103-20", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 20, "question": "依據我國最新修正商業會計法之規定,下列敘述何者錯誤?", "options": {"A": "商業會計之記載,除記帳數字適用阿拉伯字外,應以我國文字為之", "B": "商業會計之記載因事實上之需要,而須加註或併用外國文字,或當地通用文字者,仍以我國文字為準", "C": "商業應以國幣為記帳本位", "D": "但因業務實際需要,而以外國貨幣記帳者,允許在其決算報表中以外國貨幣表達,免將外國貨幣折合國幣"}, "answer": "D", "note": ""}, {"id": "bookkeeping-103-21", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 21, "question": "某甲是開心有限公司負責人,依據我國最新修正商業會計法第 68 條規定,其應於會計年度終了後幾個月內,\n將公司之決算報表提請股東承認?", "options": {"A": "三個月", "B": "六個月", "C": "一個月", "D": "二個月"}, "answer": "B", "note": ""}, {"id": "bookkeeping-103-22", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 22, "question": "依據我國最新修正商業會計法第 58 條規定,商業在同一會計年度內所發生之全部收益,減除同期之全部成\n本、費用及損失後之差額是指下列何者?", "options": {"A": "本期綜合損益總額", "B": "本期營業淨利", "C": "本期稅前純益", "D": "本期稅後純益"}, "answer": "A", "note": ""}, {"id": "bookkeeping-103-23", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 23, "question": "依據我國最新修正商業會計法第 12 條規定,下列何者得依其實際業務情形、會計事務之性質,訂定其會計制度?", "options": {"A": "商業", "B": "同業公會訂定,報請中央主管機關備查", "C": "經濟部", "D": "財政部"}, "answer": "A", "note": ""}, {"id": "bookkeeping-103-24", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 24, "question": "依據我國最新修正商業會計法之規定,下列敘述何者正確?", "options": {"A": "原始憑證是用來證明處理會計事項人員之責任,而為記帳所根據之憑證", "B": "記帳憑證是用來證明會計事項之經過,而為造具記帳憑證所根據之憑證", "C": "外來憑證係指給與商業本身以外之人的憑證", "D": "會計事項之發生,均應取得、給予或自行編製足以證明之會計憑證"}, "answer": "D", "note": ""}, {"id": "bookkeeping-103-25", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 25, "question": "依據我國最新修正商業會計法第 5 條規定,甲有限公司之主辦會計人員的任免,除章程有較高規定者外,應\n如何授權同意?", "options": {"A": "全體無限責任股東過半數之同意", "B": "由董事會以董事過半數之出席,及出席董事過半數之同意", "C": "全體股東過半數之同意", "D": "由股東會以股東過半數之出席,及出席股東過半數之同意"}, "answer": "C", "note": ""}, {"id": "bookkeeping-103-26", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 26, "question": "依商業會計處理準則第 3 條規定,記帳憑證、帳簿及財務報表之名稱及格式,應由下列何者公告?", "options": {"A": "財政部", "B": "經濟部", "C": "國稅局", "D": "稅捐稽徵處"}, "answer": "B", "note": ""}, {"id": "bookkeeping-103-27", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 27, "question": "依商業會計處理準則第 23 條規定,其他負債金額超過多少,應按其性質分別列示?", "options": {"A": "負債總額 5%", "B": "負債總額 10%", "C": "資產總額 5%", "D": "資產總額 10%"}, "answer": "A", "note": ""}, {"id": "bookkeeping-103-28", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 28, "question": "小規模之合夥或獨資商業之認定標準,依據我國最新修正商業會計法第 82 條規定,應由下列何者斟酌各直\n轄市、縣(市)區內經濟情形定之?", "options": {"A": "財政部", "B": "法務部", "C": "經濟部", "D": "內政部"}, "answer": "C", "note": ""}, {"id": "bookkeeping-103-29", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 29, "question": "依據我國最新修正商業會計法第 65 條規定,商業之決算應於會計年度終了後二個月內辦理完竣;必要時得\n延長多久?", "options": {"A": "一個月", "B": "二個月", "C": "二個半月", "D": "三個月"}, "answer": "C", "note": ""}, {"id": "bookkeeping-103-30", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 30, "question": "依據我國最新修正商業會計法第 36 條及第 38 條有關會計憑證之規定,下列何者錯誤?", "options": {"A": "會計憑證應按年裝訂成冊", "B": "會計憑證為權責存在之憑證或應予永久保存或另行裝訂較方便者,得另行保管。但須互註日期及編號", "C": "各項會計憑證,除應永久保存或有關未結會計事項者外,應於年度決算程序辦理終了後,至少保存五年", "D": "各項會計帳簿及財務報表,應於年度決算程序辦理終了後,至少保存十年。但有關未結會計事項者,不在此限"}, "answer": "A", "note": ""}, {"id": "bookkeeping-103-31", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 31, "question": "代表商業之負責人規避、妨礙或拒絕依據我國最新修正商業會計法第 70 條所規定之檢查,依同法第 79 條及\n第 81 條規定,其罰鍰應由下列何者裁罰?", "options": {"A": "經濟部", "B": "法院", "C": "財政部", "D": "直轄市政府"}, "answer": "B", "note": ""}, {"id": "bookkeeping-103-32", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 32, "question": "主辦會計違反我國最新修正商業會計法第 25 條規定,不設置應備之會計帳簿目錄,依同法第 79 條規定,應\n依下列那一項處罰?", "options": {"A": "新臺幣一萬元以上五萬元以下罰鍰", "B": "新臺幣三萬元以上十五萬元以下罰鍰", "C": "新臺幣六萬元以上三十萬元以下罰鍰", "D": "新臺幣十萬元以上罰金"}, "answer": "A", "note": ""}, {"id": "bookkeeping-103-33", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 33, "question": "依據我國行政程序法之規定,處分機關告知之救濟期間有錯誤時,應由該機關以通知更正之,並自何時起算\n法定期間?", "options": {"A": "通知送達之日起算", "B": "通知送達之翌日起算", "C": "通知送達十日後起算", "D": "通知送達三十日後起算"}, "answer": "B", "note": ""}, {"id": "bookkeeping-103-34", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 34, "question": "依據我國行政程序法之規定,下列有關行政處分之敘述何者錯誤?", "options": {"A": "行政處分係指行政機關就公法上具體事件所為之決定或其他公權力措施,而對外直接發生法律效果之單方\n行政行為", "B": "行政機關作成行政處分有裁量權時,得為附款,如期限、條件等", "C": "行政處分得以書面、言詞或其他方式為之", "D": "以書面以外方式所為之行政處分,其相對人或利害關係人不得要求作成書面處分"}, "answer": "D", "note": ""}, {"id": "bookkeeping-103-35", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 35, "question": "依據我國行政程序法之規定,對於行政處分聲明不服,因處分機關未為告知或告知錯誤致向無管轄權之機關\n為之者,該機關應於幾日內移送有管轄權之機關,並通知當事人?", "options": {"A": "三日內", "B": "十日內", "C": "二十日內", "D": "三十日內"}, "answer": "B", "note": ""}, {"id": "bookkeeping-103-36", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 36, "question": "依據我國行政程序法之規定,下列有關行政處分撤銷之敘述何者錯誤?", "options": {"A": "違法行政處分於法定救濟期間經過後即不得撤銷", "B": "違法行政處分於法定救濟期間經過後,原處分機關得依職權為全部或一部之撤銷", "C": "撤銷對公益有重大危害者,不得撤銷", "D": "受益人無行政程序法第 119 條所列信賴不值得保護之情形,而信賴授予利益之行政處分,其信賴利益顯然\n大於撤銷所欲維護之公益者,不得撤銷"}, "answer": "A", "note": ""}, {"id": "bookkeeping-103-37", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 37, "question": "依行政程序法第 131 條規定,公法上之請求權,於請求權人為行政機關時,除法律另有規定外,因幾年間不\n行使而消滅?", "options": {"A": "十年", "B": "七年", "C": "五年", "D": "三年"}, "answer": "C", "note": ""}, {"id": "bookkeeping-103-38", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 38, "question": "依行政程序法第 112 條規定,行政處分一部分無效者,其他部分仍為有效。但除去該無效部分,行政處分不\n能成立者,其效力為何?", "options": {"A": "全部無效", "B": "部分無效", "C": "全部有效", "D": "部分有效"}, "answer": "A", "note": ""}, {"id": "bookkeeping-103-39", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 39, "question": "依據我國公司法之規定,下列敘述何者錯誤?", "options": {"A": "無限公司係指二人以上股東所組織,對公司債務負連帶無限清償責任之公司", "B": "兩合公司係指一人以上無限責任股東,與一人以上有限責任股東所組織,其無限責任股東對公司債務負連\n帶無限清償責任;有限責任股東就其出資額為限,對公司負其責任之公司", "C": "有限公司係指由二人以上股東所組織,就其出資額為限,對公司負其責任之公司", "D": "股份有限公司係指二人以上股東或政府、法人股東一人所組織,全部資本分為股份;股東就其所認股份,\n對公司負其責任之公司"}, "answer": "C", "note": ""}, {"id": "bookkeeping-103-40", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 40, "question": "依公司法第 13 條規定,一家非以投資為專業之公司,實收股本為 1,000 萬元,淨值為 1,200 萬元,如為他公\n司有限責任股東時,原則上(排除其他例外相關規定)其所有投資總額上限為多少?", "options": {"A": "400 萬元", "B": "480 萬元", "C": "500 萬元", "D": "600 萬元"}, "answer": "A", "note": ""}, {"id": "bookkeeping-103-41", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 41, "question": "依據我國公司法之規定,公司得依章程規定置經理人,下列有關公司經理人之委任、解任及報酬規定何者錯誤?", "options": {"A": "無限公司、兩合公司須有全體無限責任股東全數同意", "B": "有限公司須有全體股東過半數同意", "C": "股份有限公司應由董事會以董事過半數之出席,及出席董事過半數同意之決議行之", "D": "公司章程有較高規定者,從其規定"}, "answer": "A", "note": ""}, {"id": "bookkeeping-103-42", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 42, "question": "下列何者不是商業登記法第 10 條規定之商業負責人?", "options": {"A": "出資人", "B": "出資人之法定代理人", "C": "董事長", "D": "經理人"}, "answer": "C", "note": ""}, {"id": "bookkeeping-103-43", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 43, "question": "依公司法第 387 條明文規定,下列何者不是公司登記或認許之申請人或代理人?", "options": {"A": "代表公司之負責人", "B": "記帳士", "C": "會計師", "D": "律師"}, "answer": "B", "note": ""}, {"id": "bookkeeping-103-44", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 44, "question": "依公司法第 15 條規定,一家公司實收股本為 2,000 萬元,淨值為 3,000 萬元,公司間有短期融通資金之必要\n時,該融資金額不得超過多少?", "options": {"A": "800 萬元", "B": "1,000 萬元", "C": "1,200 萬元", "D": "1,500 萬元"}, "answer": "C", "note": ""}, {"id": "bookkeeping-103-45", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 45, "question": "依記帳士職業倫理道德規範(102 年 12 月 4 日第二屆第 3 次會員代表大會通過)規定,下列何者不是記帳\n士應遵守之基本原則?", "options": {"A": "誠正", "B": "獨立", "C": "保密", "D": "適任"}, "answer": "B", "note": ""}, {"id": "bookkeeping-103-46", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 46, "question": "依據我國最新修正商業會計法之規定,下列敘述何者錯誤?", "options": {"A": "以會計事項發生之時序為主而為記錄者,稱為序時帳簿", "B": "日記簿或分錄簿屬於普通序時帳簿", "C": "以會計事項歸屬之會計項目為主而記錄者,稱為分類帳簿", "D": "現金簿、銷貨簿、進貨簿等,屬於總分類帳簿"}, "answer": "D", "note": ""}, {"id": "bookkeeping-103-47", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 47, "question": "依據我國記帳士法之規定,被懲戒人對於記帳士懲戒委員會之決議不服者,得於決議書送達之翌日起多久期\n限內,向記帳士懲戒覆審委員會請求覆審?", "options": {"A": "十日內", "B": "二十日內", "C": "一個月內", "D": "二個月內"}, "answer": "B", "note": ""}, {"id": "bookkeeping-103-48", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 48, "question": "依據我國公司法之規定,公司不得為他公司無限責任股東或合夥事業之合夥人;如為他公司有限責任股東時,\n其所有投資總額,除以投資為專業或公司章程另有規定或經依相關規定,取得股東同意或股東會決議者外,\n不得超過本公司實收股本之多少比例?", "options": {"A": "百分之十", "B": "百分之二十", "C": "百分之四十", "D": "百分之五十"}, "answer": "C", "note": ""}, {"id": "bookkeeping-103-49", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 49, "question": "下列有關記帳士職業道德規範之敘述何者錯誤?", "options": {"A": "記帳士設立分事務所,應由記帳士親自主持,不得委由助理員或其他人變相主持", "B": "記帳士如聘僱他記帳士之現職人員,不得徵詢他記帳士之意見", "C": "記帳士不得允諾他人假藉自己名義執行業務,或假藉其他記帳士名義執行業務", "D": "記帳士事務所名稱不得與已登錄之事務所名稱相同"}, "answer": "B", "note": ""}, {"id": "bookkeeping-103-50", "year": "103", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 50, "question": "下列有關記帳士業務延攬規範之敘述何者錯誤?", "options": {"A": "記帳士不得以廣告方式延攬業務", "B": "記帳士不得以詆毀同業或其他不正當方法延攬業務", "C": "記帳士不得直接或間接暗示相關利害關係或以利誘方式招攬業務", "D": "記帳士不得以不正當之抑價方式,延攬業務"}, "answer": "A", "note": ""}, {"id": "chinese-103-1", "year": "103", "subject": "chinese", "subjectName": "國文", "number": 1, "question": "下列各選項前後的詞語,意義相近的是:", "options": {"A": "剛愎自用/擇善固執", "B": "八面玲瓏/八面威風", "C": "山窮水盡/柳暗花明", "D": "飛揚跋扈/不可一世"}, "answer": "D", "note": ""}, {"id": "chinese-103-2", "year": "103", "subject": "chinese", "subjectName": "國文", "number": 2, "question": "風靜了,我是/默默的雪。他在/敗葦間穿行,好落寞的人/神色,遣人一朝是/\n東京八十萬禁軍教頭/如今行船,悄悄/向梁山落草/山是憂愁的樣子(楊牧) \n此詩所寫人物應為:", "options": {"A": "屈原", "B": "項羽", "C": "林沖", "D": "岳飛"}, "answer": "C", "note": ""}, {"id": "chinese-103-3", "year": "103", "subject": "chinese", "subjectName": "國文", "number": 3, "question": "「碩鼠碩鼠,無食我黍!三歲貫女,莫我肯顧。逝將去女,適彼樂土。樂土樂土,\n爰得我所。」(《詩經‧魏風‧碩鼠》)詩中之「碩鼠」是用以說明:", "options": {"A": "執政者的貪污腐敗", "B": "百姓不知勤於農耕", "C": "天災對農作的傷害", "D": "鼠患對農村的摧殘"}, "answer": "A", "note": ""}, {"id": "chinese-103-4", "year": "103", "subject": "chinese", "subjectName": "國文", "number": 4, "question": "如果有一個文化活動,四周以菊花和柳樹布置,並張貼著「口吟歸去來,頭戴漉酒\n巾」的對聯,可以推測這個活動和那個古人有關?", "options": {"A": "屈原", "B": "陶潛", "C": "杜甫", "D": "周敦頤"}, "answer": "B", "note": ""}, {"id": "chinese-103-5", "year": "103", "subject": "chinese", "subjectName": "國文", "number": 5, "question": "曹操〈短歌行〉:「月明星稀,烏鵲南飛。繞樹三匝,何枝可依?山不厭高,水不\n厭深。周公吐哺,天下歸心。」引文中「山不厭高,水不厭深」,意指:", "options": {"A": "品德崇高", "B": "廣納賢才", "C": "景色壯麗", "D": "胸羅萬象"}, "answer": "B", "note": ""}, {"id": "chinese-103-6", "year": "103", "subject": "chinese", "subjectName": "國文", "number": 6, "question": "《論語‧先進》:「夫子喟然歎曰:吾『與』點也。」文句中「與」字的意義和用\n法,和下列選項中那一個相同?", "options": {"A": "選賢「與」能,講信修睦", "B": "日月逝矣,歲不我「與」", "C": "或乞醯焉,乞諸其鄰而「與」之", "D": "暴虎馮河,死而無悔者,吾不「與」也"}, "answer": "D", "note": ""}, {"id": "chinese-103-7", "year": "103", "subject": "chinese", "subjectName": "國文", "number": 7, "question": "下列楹聯何者使用正確?", "options": {"A": "書房:琴瑟永諧千歲樂,芝蘭同介百年春", "B": "廳堂:舉目思祖功宗德,存心為孝子賢孫", "C": "宗祠:門前莫約頻來客,座上同觀未見書", "D": "園亭:水色山光皆畫本,花香鳥語是詩情"}, "answer": "D", "note": ""}, {"id": "chinese-103-8", "year": "103", "subject": "chinese", "subjectName": "國文", "number": 8, "question": "「人類所造作的世間的種種現象,迷塞了我的心眼,隱蔽了我的本性,使我對於擾\n攘奔逐的地球上的生活,漸漸習慣,視為人生的當然而恬不為怪。實則墮地時的\n我的本性,已經斵喪無餘了。」(豐子愷〈阿難〉)本段話認為人隨著年齡與閱\n歷,會漸漸習慣的是:", "options": {"A": "人情練達", "B": "剛愎成性", "C": "絕聖棄智", "D": "矯飾偽行"}, "answer": "D", "note": ""}, {"id": "chinese-103-9", "year": "103", "subject": "chinese", "subjectName": "國文", "number": 9, "question": "黃崑巖:「有教養的人是有智慧的人,要達到這境界,光是有知識還不能稱得上有\n教養。教養的重要要素是對自己存在的意義充分了解,而這種自覺出自於自身對周\n遭環境的相對位置的正確概念。自身與環境,包括自身與別人或與社會的關係要弄\n清楚。知道了這種關係脈絡,我們的進退才有分寸又能見好就收。」(《給青年學\n生的十封信》)下列選項何者合乎文中所說教養的特質?", "options": {"A": "寬以待人,嚴以律己", "B": "忠人之事,克盡己職", "C": "知己知彼,行己有方", "D": "捨己為公,有容乃大"}, "answer": "C", "note": ""}, {"id": "chinese-103-10", "year": "103", "subject": "chinese", "subjectName": "國文", "number": 10, "question": "我們的社會結構原則,建立在一系列不等同的價值取向上面。這個價值系列的頂端\n是天下、國家,底部躺著個人。這個「個人」,格物致知的修身工夫,意義不在探\n討「本人」存在的意義,也不是為了追求對外在世界的認知,而是為了把自己準備\n完善,以實現家族、國家和天下的和諧穩定。(劉大任〈賭〉)下列選項何者最接\n近上文所述之文化?", "options": {"A": "個人主義", "B": "群體主義", "C": "存在主義", "D": "人本主義"}, "answer": "B", "note": ""}, {"id": "chinese-103-11", "year": "103", "subject": "chinese", "subjectName": "國文", "number": 11, "question": "皮克斯動畫導演柏德曾說:「員工士氣往往對電影預算帶來最大衝擊,但卻從來不\n會顯現在預算表上。如果員工士氣低落,那麼你花的每一塊錢,實際上只會得到兩\n毛五的價值。如果員工士氣高,那麼你花的每一塊錢,可能創造出三塊錢的價值。\n每家公司都應該更重視員工士氣。」關於這段話表達的主旨,最適當的詮釋是:", "options": {"A": "員工士氣是電影成敗的關鍵", "B": "員工士氣高可提高經費運用的產值", "C": "員工士氣的高低落差可達到十二倍", "D": "預算表並不能精確估算完整的收支情形"}, "answer": "B", "note": ""}, {"id": "chinese-103-12", "year": "103", "subject": "chinese", "subjectName": "國文", "number": 12, "question": "「當你越是潛水射魚的高手時,你的漁獲就會越少,因你會選擇你要的魚而不是濫\n射。當你越是了解老人們的固執時,你就越是敬畏大自然的一切神靈,你就有義務\n為山林的樹木祈福。」(夏曼‧藍波安〈敬畏海的神靈〉)下列選項何者較接近前\n文意旨?", "options": {"A": "技進乎道,藝通乎神", "B": "敬天愛物,取之有節", "C": "擇善固執,持志以終", "D": "雅好山水,悠然自得"}, "answer": "B", "note": ""}, {"id": "chinese-103-13", "year": "103", "subject": "chinese", "subjectName": "國文", "number": 13, "question": "有些物品褪流行了,必須丟掉,才有空間容納新產品;有些價值觀落伍了,必須拋\n棄,才能合乎時潮;有些道德觀過於迂腐,必須刪除,方能與時俱進,跟上所謂時\n代的腳步。 \n是這樣嗎?願意尊重每一樣物品或食品被製造、種植出來所費的時間與勞力,因此\n物盡其用,絕不浪費,是否已被掃入阿嬤級思維而遭到恥笑?(改寫自簡媜〈活得\n像一條流浪狗〉) \n根據上文,作者的態度是:", "options": {"A": "品德為尚", "B": "愛屋及烏", "C": "與時推移", "D": "恆常惜物"}, "answer": "D", "note": ""}, {"id": "chinese-103-14", "year": "103", "subject": "chinese", "subjectName": "國文", "number": 14, "question": "孟嘗君特雞鳴狗盜之雄耳,豈足以言得士?不然,擅齊之強,得一士焉,宜可以南面\n而制秦,尚何取雞鳴狗盜之力哉?(王安石〈讀孟嘗君傳〉)王安石認為孟嘗君:", "options": {"A": "虛心求才", "B": "掩耳盜鈴", "C": "不得賢士", "D": "可制秦國"}, "answer": "C", "note": ""}, {"id": "chinese-103-15", "year": "103", "subject": "chinese", "subjectName": "國文", "number": 15, "question": "忽逢桃花林,夾岸數百步,中無雜樹,芳草鮮美,落英繽紛。漁人甚異之,復前行,\n欲窮其林。林盡水源,便得一山。山有小口,髣髴若有光。便捨船,從口入。初極\n狹,纔通人。復行數十步,豁然開朗。土地平曠,屋舍儼然,有良田、美池、桑竹\n之屬。阡陌交通,雞犬相聞。其中往來種作,男女衣著,悉如外人。黃髮垂髫,並\n怡然自樂。見漁人,乃大驚,問所從來,具答之。便要還家,設酒殺雞作食。村中\n聞有此人,咸來問訊,自云先世避秦時亂,率妻子邑人來此絕境,不復出焉,遂與\n外人間隔。問今是何世,乃不知有漢,無論魏晉!(陶淵明〈桃花源記〉) \n根據上文,下列敘述何者正確?", "options": {"A": "「芳草鮮美,落英繽紛」指暮春三月,草長花落,果實豐收可期", "B": "「黃髮垂髫,並怡然自樂」指當地男童、女童無不自在歡樂嬉遊", "C": "「便要還家,設酒殺雞作食」指設宴為漁夫餞行,要求儘速離開", "D": "「不知有漢,無論魏晉」指對於中國各朝代遞嬗沿革,並不了解"}, "answer": "D", "note": ""}, {"id": "chinese-103-16", "year": "103", "subject": "chinese", "subjectName": "國文", "number": 16, "question": "袁宗道〈答友人〉:「學未至圓通,合己見則是,違己見則非。如以南方之舟,笑\n北方之車;以鶴脛之長,憎鳧脛之短也。夫不責己之有見,而責人之異見,豈不悖\n哉!」下列選項何者最切合本文旨意?", "options": {"A": "學至圓通易於責人", "B": "強調眾謀之中必有異見", "C": "人常以己之長而責人之短", "D": "意志堅定者不為異說動搖"}, "answer": "C", "note": ""}, {"id": "chinese-103-17", "year": "103", "subject": "chinese", "subjectName": "國文", "number": 17, "question": "一秀才買柴,曰:「荷薪者過來。」賣柴者因「過來」二字明白,擔到面前。\n問曰:「其價幾何?」因「價」字明白,說了價錢。秀才曰:「外實而內虛,烟\n多而焰少,請損之。」賣柴者不知說甚,荷的去了。......有一官府下鄉,問父\n老曰:「近來黎庶何如?」父老曰:「今年梨樹好,只是蟲喫了些。」根據上文,\n選擇最符合意旨的選項:", "options": {"A": "志不同道不合,不相為謀", "B": "秀才、官員恃才傲物,賣弄所學", "C": "平民百姓學識不足,無法與人溝通", "D": "秀才、官員咬文嚼字,不能有效傳達訊息"}, "answer": "D", "note": ""}, {"id": "chinese-103-18", "year": "103", "subject": "chinese", "subjectName": "國文", "number": 18, "question": "蓋鹿耳門內浩瀚之勢,不異大海,其下實皆淺沙,若深水可行舟處,不過一綫,而\n又左右盤曲,非素熟水道者,不敢輕入,所以稱險。(郁永河《裨海紀遊》)清朝\n時期鹿耳門水道以「險」著稱的主要原因是:", "options": {"A": "水勢浩瀚磅礡,有如大海", "B": "河道彎曲複雜,容易迷路", "C": "水下淤積多沙,航道彎狹", "D": "水域危險著稱,嚮導難尋 \n閱讀下文,回答第 19~20 題 \n我問老闆,為什麼不放走呢? \n他說,他也不忍心看小鳥這樣,想放走,又捨不得。 \n我好想伸手打開籠子,任鳥自飛,可是我沒有。 \n後來,我又下山幾次,小鳥依舊在籠子裏。我第一次那種激盪的心緒,越來越平穩了。 \n到最近一次去小店,返程時,走到半山,才猛然想到,剛才在鳥籠旁出出入入,不知經\n過多少次,竟然不曾看牠一眼,眉頭瞬間黯了下來。 \n我不是悲小鳥,而是悲自己。(粟耘〈塵埃譜〉)"}, "answer": "C", "note": ""}, {"id": "chinese-103-19", "year": "103", "subject": "chinese", "subjectName": "國文", "number": 19, "question": "依上文,作者在悲自己什麼?", "options": {"A": "婦人之仁", "B": "麻木不仁", "C": "老眼昏花", "D": "老來健忘"}, "answer": "B", "note": ""}, {"id": "chinese-103-20", "year": "103", "subject": "chinese", "subjectName": "國文", "number": 20, "question": "文中「我第一次那種激盪的心緒,越來越平穩了」,下列選項何者較接近其義涵?", "options": {"A": "習焉不察,久之而成自然", "B": "平和恬淡,修養鍛鍊心性", "C": "動心忍性,增益其所不能", "D": "聖人無情,不為外物所累"}, "answer": "A", "note": ""}, {"id": "tax-103-1", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 1, "question": "下列何者不是稅捐稽徵法的適用範圍?", "options": {"A": "營業稅", "B": "關稅", "C": "所得稅", "D": "土地稅"}, "answer": "B", "note": ""}, {"id": "tax-103-2", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 2, "question": "大利光公司於 103 年 5 月 5 日辦理 102 年度營利事業所得稅結算申報,依現行稅捐稽徵法之規定,其核課期\n間自何時算起?", "options": {"A": "103 年 5 月 1 日", "B": "103 年 5 月 5 日", "C": "103 年 5 月 6 日", "D": "103 年 6 月 1 日"}, "answer": "B", "note": ""}, {"id": "tax-103-3", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 3, "question": "在中華民國境內之營利事業,其已確定之應納稅捐逾法定繳納期限尚未繳納完畢,所欠繳稅款及已確定之罰\n鍰單計或合計,在新臺幣多少元以上者;另其在行政救濟程序終結前,在新臺幣多少元以上,得由財政部\n函請內政部入出國及移民署限制其負責人出境,但已提供相當擔保者,應解除其限制?", "options": {"A": "一百萬元,一百五十萬元", "B": "一百五十萬元,三百萬元", "C": "二百萬元,二百五十萬元", "D": "二百萬元,三百萬元"}, "answer": "D", "note": ""}, {"id": "tax-103-4", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 4, "question": "依稅捐稽徵法規定,若以黃金做為稅款之相當擔保品,則應按幾折計價?", "options": {"A": "七折", "B": "八折", "C": "九折", "D": "無須折價計算"}, "answer": "C", "note": ""}, {"id": "tax-103-5", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 5, "question": "依稅捐稽徵法第 27 條規定,納稅義務人對核准延期或分期繳納之任何一期應繳稅捐,未如期繳納者,稅捐\n稽徵機關應於該期繳納期間屆滿之翌日起三日內,就未繳清之餘額稅款,發單通知納稅義務人,且限幾日\n內一次全部繳清?", "options": {"A": "八日", "B": "十日", "C": "十五日", "D": "二十日"}, "answer": "B", "note": ""}, {"id": "tax-103-6", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 6, "question": "依稅捐稽徵法第 20 條規定,逾期繳納稅捐應加徵滯納金者,每逾二日按滯納數額加徵百分之多少的滯納金?\n而逾幾日仍未繳納者,移送法院強制執行?", "options": {"A": "百分之一,30 日", "B": "百分之一,45 日", "C": "百分之二,30 日", "D": "百分之二,45 日"}, "answer": "A", "note": ""}, {"id": "tax-103-7", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 7, "question": "依所得稅法第 60 條規定,一般情況下營利事業之著作權,應按幾年為計算攤折之標準?", "options": {"A": "五年", "B": "十年", "C": "十五年", "D": "無規定"}, "answer": "C", "note": ""}, {"id": "tax-103-8", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 8, "question": "依所得稅法規定,綜合所得稅納稅義務人結算申報所列報之免稅及扣除項目或金額,超過規定之限制,致短\n繳稅款,經稽徵機關核定補繳者,除補徵稅額外,亦應按日加計利息。而此一應加計之利息金額不超過多\n少元者,免予加計徵收?", "options": {"A": "一千二百元", "B": "一千五百元", "C": "一千八百元", "D": "二千元"}, "answer": "B", "note": ""}, {"id": "tax-103-9", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 9, "question": "王梅小姐 102 年度之綜合所得總額為 350 萬元,當年度捐贈給財團法人董氏基金會之捐款為 30 萬元,試問\n102 年度王小姐可以申報之捐贈列舉扣除額為多少元?", "options": {"A": "35 萬元", "B": "20 萬元", "C": "30 萬元", "D": "70 萬元"}, "answer": "C", "note": ""}, {"id": "tax-103-10", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 10, "question": "依所得稅法規定,自中華民國一百零一年一月一日起,符合規定條件之納稅義務人,得就五歲以下之子女,\n每人每年扣除幼兒學前特別扣除額為多少元?", "options": {"A": "25,000 元", "B": "15,000 元", "C": "50,000 元", "D": "核實認列"}, "answer": "A", "note": ""}, {"id": "tax-103-11", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 11, "question": "王午 102 年度就讀研究所在職專班支付學費 45,000 元,王午長子就讀某國立大學二年級學費 50,000 元,\n王午長女就讀某私立五專四年級學費 100,000 元,則得列入王午 102 年度綜合所得稅申報之教育學費特別\n扣除額為多少元?", "options": {"A": "25,000 元", "B": "150,000 元", "C": "50,000 元", "D": "195,000 元"}, "answer": "C", "note": ""}, {"id": "tax-103-12", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 12, "question": "適用勞動基準法之營利事業,依勞動基準法提撥之勞工退休準備金,或依勞工退休金條例提繳之勞工退休金\n或年金保險費,每年度得在不超過當年度已付薪資總額的多少限度內,以費用列支?", "options": {"A": "10%", "B": "6%", "C": "15%", "D": "4%"}, "answer": "C", "note": ""}, {"id": "tax-103-13", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 13, "question": "關於綜合所得稅列舉扣除之房屋租金支出,下列敘述何者正確?", "options": {"A": "範圍包括納稅義務人、配偶及受扶養親屬之房屋租金支出", "B": "租屋地點不限中華民國境內或境外", "C": "自住或供營業使用皆可", "D": "申報有購屋借款利息者,不得扣除"}, "answer": "D", "note": ""}, {"id": "tax-103-14", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 14, "question": "依所得稅法規定,營利事業持有之短期票券發票日在中華民國九十九年一月一日以後者,其利息所得應如何\n課稅?", "options": {"A": "無須課稅", "B": "計入營利事業所得額課稅", "C": "分離課稅,扣繳稅率為 10%", "D": "分離課稅,扣繳稅率為 15%"}, "answer": "B", "note": ""}, {"id": "tax-103-15", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 15, "question": "關於綜合所得稅列舉扣除額之規定,下列何項「未」有上限之規定?", "options": {"A": "對於教育、文化、公益、慈善機構或團體之捐贈總額", "B": "國民年金保險", "C": "付與公立醫院、全民健康保險特約醫療院所之未受有保險給付部分的醫藥費及生育費", "D": "購屋借款利息"}, "answer": "C", "note": ""}, {"id": "tax-103-16", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 16, "question": "關於 102 年度起我國個人基本所得額之計算,下列敘述何者正確?", "options": {"A": "應加計非上市櫃證券交易所得、私募證券投資信託基金之受益憑證之交易所得", "B": "應加計所得基本稅額條例施行後所訂立之所有人壽保險及年金保險,受益人受領之保險給付", "C": "受益人受領之人壽保險及年金保險給付,每一申報戶全年合計數在新臺幣三千萬元以下部分,免予計入", "D": "應加計於申報綜合所得稅時減除之非現金捐贈金額"}, "answer": "D", "note": ""}, {"id": "tax-103-17", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 17, "question": "營利事業於一百零二年度以後出售其持有滿幾年以上屬所得稅法第四條之一規定之股票者,於計算其當年度\n證券交易所得時,減除其當年度出售持有滿相同年度以上股票之交易損失,餘額為正者,以餘額半數計入\n當年度證券交易所得?", "options": {"A": "一年", "B": "三年", "C": "五年", "D": "七年"}, "answer": "B", "note": ""}, {"id": "tax-103-18", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 18, "question": "依所得基本稅額條例規定,基本所得額每遇消費者物價指數較上次調整年度之指數上漲累計達百分之多少以\n上時,按上漲程度調整之?", "options": {"A": "百分之三", "B": "百分之五", "C": "百分之十", "D": "無指數調整規定"}, "answer": "C", "note": ""}, {"id": "tax-103-19", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 19, "question": "在臺以新臺幣支付國外佣金者,原則上應在不超過出口貨物價款多少範圍內取具國外代理商或代銷商名義出\n具之收據為憑予以認定?", "options": {"A": "百分之一", "B": "百分之二", "C": "百分之三", "D": "百分之四"}, "answer": "C", "note": ""}, {"id": "tax-103-20", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 20, "question": "營利事業依營利事業所得稅查核準則規定列支之製造費用及營業費用,如係取得小規模營利事業出具之普通\n收據,其全年累計金額以不超過當年度經稽徵機關核定之製造費用及營業費用之總額多少為限,超過部分,\n不予認定?", "options": {"A": "百分之三十", "B": "百分之二十", "C": "千分之二十", "D": "千分之三十"}, "answer": "D", "note": ""}, {"id": "tax-103-21", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 21, "question": "依營利事業所得稅查核準則規定,修繕費支出其效能非幾年內所能耗竭者,應作為資本支出?", "options": {"A": "一年", "B": "二年", "C": "三年", "D": "五年"}, "answer": "B", "note": ""}, {"id": "tax-103-22", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 22, "question": "營利事業之捐贈,依政治獻金法規定,對政黨、政治團體及擬參選人之捐贈,以不超過所得額百分之十為限,\n其總額並不得超過新臺幣多少萬元?", "options": {"A": "十萬元", "B": "二十萬元", "C": "三十萬元", "D": "五十萬元"}, "answer": "D", "note": ""}, {"id": "tax-103-23", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 23, "question": "依營利事業所得稅查核準則規定,資產之交換,應如何入帳?", "options": {"A": "如時價能可靠衡量,應以時價入帳,但不認列交換損益", "B": "如時價能可靠衡量,應以時價入帳,如有交換利益,應予認列", "C": "一律以換出資產之帳面價值入帳", "D": "一律以換入資產之帳面價值入帳,並認列交換損益"}, "answer": "B", "note": ""}, {"id": "tax-103-24", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 24, "question": "營利事業對合於運動產業發展條例第二十六條、中小企業發展基金之捐贈,應如何列為當年度捐贈費用?", "options": {"A": "不受金額限制,全數可列為捐贈費用", "B": "以不超過當年度所得額百分之十為限,其總額並不得超過新臺幣五十萬元", "C": "以不超過當年度所得額百分之二十為限,其總額並不得超過新臺幣一千萬元", "D": "不得列為費用或損失"}, "answer": "A", "note": ""}, {"id": "tax-103-25", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 25, "question": "依營利事業所得稅查核準則規定,應收帳款、應收票據及各項欠款債權經依法列為呆帳損失後收回者,除了\n可就其收回之數額轉回備抵呆帳外,還可如何處理?", "options": {"A": "列為收回年度之銷貨成本減項", "B": "列為收回年度之營業收入", "C": "列為收回年度之非營業收入", "D": "列為未分配盈餘減項"}, "answer": "C", "note": ""}, {"id": "tax-103-26", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 26, "question": "依營利事業所得稅查核準則規定,有關營利事業交際費之列支,下列敘述何者錯誤?", "options": {"A": "皆須依規定取有憑證,並經查明與業務有關者,始在限額內予以認定", "B": "與進貨有關的交際費列支限額標準高於與銷貨有關的交際費列支限額標準", "C": "委託會計師簽證申報者,其交際費列支限額與適用藍色申報書者相同", "D": "屬於交際性質之餽贈支出,仍以交際費認定"}, "answer": "B", "note": ""}, {"id": "tax-103-27", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 27, "question": "營利事業為員工投保之團體人壽保險、團體健康保險及團體傷害保險,其由營利事業負擔之保險費,以營利\n事業或被保險員工及其家屬為受益人者,准予認定為保險費。且其中每人每月保險費合計在新臺幣多少元\n以內部分,免視為被保險員工之薪資所得?", "options": {"A": "一千五百元", "B": "一千八百元", "C": "二千元", "D": "二千四百元"}, "answer": "C", "note": ""}, {"id": "tax-103-28", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 28, "question": "依營利事業所得稅查核準則規定,營利事業承包工程採全部完工法計算工程損益,其承包工程之工期有跨年\n度者,其管理費用應於何時列報?", "options": {"A": "費用發生之年度列報", "B": "工程完工年度列報", "C": "於施工期間平均分攤", "D": "按工時進度比例法分年度列報"}, "answer": "A", "note": ""}, {"id": "tax-103-29", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 29, "question": "外國國際運輸事業,在中華民國境內,無固定營業場所而有代理人在中華民國境內銷售勞務,其代理人應於\n載運客、貨出境之次期開始幾日內,就銷售額按規定稅率,計算營業稅額,並依規定申報繳納?", "options": {"A": "10 日", "B": "15 日", "C": "30 日", "D": "45 日"}, "answer": "B", "note": ""}, {"id": "tax-103-30", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 30, "question": "下列何項「非」為免徵營業稅之貨物或勞務?", "options": {"A": "醫院、診所、療養院提供之病房住宿及膳食", "B": "飼料", "C": "銷售衍生性金融商品及公司債所收取的佣金及手續費", "D": "碾米加工"}, "answer": "C", "note": ""}, {"id": "tax-103-31", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 31, "question": "下列何項農作物之銷售為我國「加值型及非加值型營業稅法」第 8 條所列之免徵範圍?", "options": {"A": "麵粉", "B": "黃豆", "C": "大豆", "D": "小米"}, "answer": "A", "note": ""}, {"id": "tax-103-32", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 32, "question": "依法取得從事按摩資格之視覺功能障礙者之營業人,且全部由視覺功能障礙者提供按摩勞務之按摩業,其營\n業稅稅率為?", "options": {"A": "百分之一", "B": "百分之二", "C": "百分之五", "D": "百分之零點一"}, "answer": "A", "note": ""}, {"id": "tax-103-33", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 33, "question": "小規模營業人查定銷售額 450,000 元,申報可扣抵進項稅額 3,000 元,應納營業稅額為?", "options": {"A": "4,500 元", "B": "4,200 元", "C": "3,700 元", "D": "3,000 元"}, "answer": "B", "note": ""}, {"id": "tax-103-34", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 34, "question": "甲公司本期銷售額 200,000 元,銷項稅額 10,000 元;銷貨退回 4,000 元,銷項稅額 200 元,可扣抵進項稅額\n16,000 元,則當期申報營業稅為?", "options": {"A": "應納 5,800 元", "B": "應納 6,200 元", "C": "溢付 5,800 元", "D": "溢付 6,200 元"}, "answer": "D", "note": ""}, {"id": "tax-103-35", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 35, "question": "營業人依法申請營業登記之事項有變更,或營業人合併、轉讓、解散或廢止時,均應於事實發生之日起幾日\n內填具申請書,向主管稽徵機關申請變更或註銷營業登記?", "options": {"A": "10 日", "B": "15 日", "C": "30 日", "D": "45 日"}, "answer": "B", "note": ""}, {"id": "tax-103-36", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 36, "question": "營業人開立統一發票,應行記載事項未依規定記載或所載不實者,除通知限期改正或補辦外,按統一發票所\n載銷售額,處多少罰鍰並得連續處罰之?", "options": {"A": "百分之一", "B": "百分之二", "C": "百分之三", "D": "百分之五"}, "answer": "A", "note": ""}, {"id": "tax-103-37", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 37, "question": "依加值型及非加值型營業稅法規定,現行銀行業、保險業經營銀行、保險本業銷售額之稅率為?", "options": {"A": "百分之一", "B": "百分之二", "C": "百分之三", "D": "百分之五"}, "answer": "D", "note": ""}, {"id": "tax-103-38", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 38, "question": "下列何項農作物之進口,其營業稅之課徵「非」為行政院可因應經濟特殊情況,調節物資供應而機動調整者?", "options": {"A": "稻米", "B": "小麥", "C": "大麥", "D": "玉米"}, "answer": "A", "note": ""}, {"id": "tax-103-39", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 39, "question": "適用加值型計稅之營業人,其進項稅額憑證,若未於當期申報者,得延期申報扣抵並敘明理由。但進項稅額\n憑證之申報扣抵期間,以幾年為限?", "options": {"A": "五年", "B": "七年", "C": "十年", "D": "無限制"}, "answer": "C", "note": ""}, {"id": "tax-103-40", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 40, "question": "關於國際運輸事業自中華民國境內載運客貨出境者,其銷售額之計算,下列敘述何者錯誤?", "options": {"A": "海運事業是指自中華民國境內承載旅客出境或承運貨物出口之全部票價或運費", "B": "空運事業之貨運部分是指自中華民國境內承運貨物出口之全程運費", "C": "空運事業之客運部分是指自中華民國境內承載旅客至境外目的地間之全部票價,包含轉機", "D": "承運貨物出口之國際空運事業,如因航線限制等原因,在航程中途將承運之貨物改由其他國際空運事業之\n航空器轉載者,按承運貨物出口國際空運事業實際承運之航程運費計算"}, "answer": "C", "note": ""}, {"id": "tax-103-41", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 41, "question": "依加值型及非加值型營業稅法規定,關於營業人銷售貨物或勞務之銷售額,下列敘述何者錯誤?", "options": {"A": "為營業人銷售貨物或勞務所收取之全部代價", "B": "包括該項貨物應徵之貨物稅", "C": "不包括本次銷售之營業稅額", "D": "包括該項貨物應徵之菸酒稅,但菸品健康福利捐不包括在內"}, "answer": "D", "note": ""}, {"id": "tax-103-42", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 42, "question": "依所得稅法規定,納稅義務人未依規定期限辦理結算申報者,稽徵機關應即填具滯報通知書,送達納稅義務\n人,限於接到滯報通知書之日起幾日內補辦結算申報?", "options": {"A": "10 日", "B": "15 日", "C": "30 日", "D": "45 日"}, "answer": "B", "note": ""}, {"id": "tax-103-43", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 43, "question": "現行外國之事業、機關、團體、組織在中華民國境內,無固定營業場所而有銷售供教育、研究或實驗使用之\n勞務予公私立各級學校、教育或研究機關者,其營業稅之處理下列何項正確?", "options": {"A": "應由勞務買受人於給付報酬之次期開始十日內,就給付額依所定稅率計算營業稅額繳納之", "B": "應由勞務買受人於給付報酬之次期開始十五日內,就給付額依所定稅率計算營業稅額繳納之", "C": "由外國之事業、機關、團體、組織自行計算營業稅額並繳納之", "D": "勞務買受人無須就給付額依所定稅率計算營業稅額繳納之"}, "answer": "D", "note": ""}, {"id": "tax-103-44", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 44, "question": "經常居住於高雄市之美國人,若將其在中華民國境內之財產贈與我國國民,試問應向下列那一個機關申報\n贈與稅?", "options": {"A": "美國國稅局", "B": "受贈人戶籍地之國稅局", "C": "財政部高雄國稅局", "D": "財政部臺北國稅局"}, "answer": "D", "note": ""}, {"id": "tax-103-45", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 45, "question": "呂先生 102 年全年度共計獲得稿費收入 300,000 元,則申報 102 年度綜合所得稅之課稅所得為何?(假設\n稿費收入之必要費用為收入 30%)", "options": {"A": "執行業務所得 84,000 元", "B": "其他所得 120,000 元", "C": "薪資所得 120,000 元", "D": "薪資所得 84,000 元"}, "answer": "A", "note": ""}, {"id": "tax-103-46", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 46, "question": "納稅義務人因天災、事變或遭受重大財產損失,不能於法定期間內繳清稅捐者,得於規定納稅期間內,向稅\n捐稽徵機關申請延期或分期繳納,其延期或分期繳納之期間,不得逾幾年?", "options": {"A": "一年", "B": "三年", "C": "五年", "D": "七年"}, "answer": "B", "note": ""}, {"id": "tax-103-47", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 47, "question": "假設王曉慶於 102 年 10 月 20 日星期日死亡,若王曉慶持有我國上市甲公司之股票 100 萬股,試問應以那一\n天之價格計算甲公司股票價值課徵遺產稅?", "options": {"A": "102 年 10 月 18 日之收盤價", "B": "102 年 10 月 21 日之開盤價", "C": "102 年 10 月 21 日之收盤價", "D": "102 年 10 月 20 日公司之資產淨值"}, "answer": "A", "note": ""}, {"id": "tax-103-48", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 48, "question": "若被繼承人之遺產中包括一家興櫃公司之股票,試問如何估定此一興櫃股票之遺產價值?(設當日該檔股票\n有買賣價格,且近期價格無劇烈變動)", "options": {"A": "依繼承開始日該股票之收盤價估定之", "B": "依繼承開始日該股票之當日加權平均成交價估定之", "C": "依繼承開始日前最後一日該股票之收盤價估定之", "D": "依繼承開始日前最後一日該股票之加權平均成交價估定之"}, "answer": "B", "note": ""}, {"id": "tax-103-49", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 49, "question": "被繼承人之配偶依民法第一千零三十條之一規定主張配偶剩餘財產差額分配請求權且自遺產總額中扣除者,\n若納稅義務人未於稽徵機關核發稅款繳清證明書或免稅證明書之日起幾年內,給付該請求權金額之財產予\n被繼承人之配偶者,稽徵機關應就未給付部分追繳應納稅賦?", "options": {"A": "一年內", "B": "二年內", "C": "三年內", "D": "五年內"}, "answer": "A", "note": ""}, {"id": "tax-103-50", "year": "103", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 50, "question": "遺產稅及贈與稅納稅義務人,除有申請延期繳納稅款外,應於稽徵機關送達核定納稅通知書之日起幾個月內,\n繳清應納稅款?", "options": {"A": "一個月內", "B": "二個月內", "C": "三個月內", "D": "六個月內"}, "answer": "B", "note": ""}, {"id": "accounting-104-1", "year": "104", "subject": "accounting", "subjectName": "會計學概要", "number": 1, "question": "大哲公司 X1 年 1 月 1 日發行一面額$1,400,000,四年到期之公司債,每年年底付息,票面利率 5%之公司\n債。發行時市場利率為 4%,因此大哲公司之發行價格為 103.63。大哲公司 X4 年初以票面金額至市場上\n買回,大哲公司採利息法攤銷。下列敘述何者正確?", "options": {"A": "大哲公司不必認列任何損益", "B": "大哲公司應認列$38,852 非常損失", "C": "大哲公司應認列$26,406 非常利益", "D": "大哲公司應認列$13,463 的其他利益"}, "answer": "D", "note": ""}, {"id": "accounting-104-2", "year": "104", "subject": "accounting", "subjectName": "會計學概要", "number": 2, "question": "丁公司發行兩種股票:普通股,每股面額$10,流通在外股數 100,000 股;特別股,累積非參加,每股面\n額$20,流通在外股數 25,000 股,股利率 5%。丁公司於 X4 年未分配任何股利,X5 年 3 月 15 日分配現\n金股利$80,000。請問特別股於 X5 年度可分配之現金股利為:", "options": {"A": "$25,000", "B": "$50,000", "C": "$60,000", "D": "$80,000"}, "answer": "B", "note": ""}, {"id": "accounting-104-3", "year": "104", "subject": "accounting", "subjectName": "會計學概要", "number": 3, "question": "大同公司採用年數合計法提列折舊,X4 年 7 月 1 日購入一新設備,成本$160,000,估計殘值為$10,000,可\n使用五年。試問大同公司 X6 年年底對該設備應提列之折舊金額為多少?", "options": {"A": "$25,000", "B": "$30,000", "C": "$35,000", "D": "$45,000"}, "answer": "C", "note": ""}, {"id": "accounting-104-4", "year": "104", "subject": "accounting", "subjectName": "會計學概要", "number": 4, "question": "大豐公司本年度應收帳款期末餘額為$80,000,其中$10,000 為已過期帳款 60 天;公司評估後認為,已過\n期帳款約有 50%無法收回,未過期部分約 5%無法收回,調整前之備抵壞帳為借方餘額$1,000。根據上述\n資料,請問大豐公司本年度應收帳款淨額應為多少?", "options": {"A": "$9,500", "B": "$8,500", "C": "$70,500", "D": "$71,500"}, "answer": "D", "note": ""}, {"id": "accounting-104-5", "year": "104", "subject": "accounting", "subjectName": "會計學概要", "number": 5, "question": "大公企業會計本年度期末發現下列錯誤,期初存貨高估$5,000,期末存貨低估$8,000。在沒有調整前,\n下列何者是大公企業可能產生的錯誤?", "options": {"A": "淨利低估$13,000", "B": "銷貨成本低估$13,000", "C": "銷貨成本高估$5,000", "D": "業主權益高估$13,000"}, "answer": "A", "note": ""}, {"id": "accounting-104-6", "year": "104", "subject": "accounting", "subjectName": "會計學概要", "number": 6, "question": "甲公司 X4 年 6 月 30 日銀行存款的帳上餘額為$83,950,銀行對帳單之銀行存款餘額為$80,200。其中,當\n月銀行存款的調節項目如下:\n銀行手續費 $ 250\n銀行代收票據 9,500\n在途存款 22,000\n未兌現支票 9,000\n請問甲公司在 X4 年 6 月 30 日之正確銀行存款為:", "options": {"A": "$83,950", "B": "$93,200", "C": "$102,450", "D": "$106,200"}, "answer": "B", "note": ""}, {"id": "accounting-104-7", "year": "104", "subject": "accounting", "subjectName": "會計學概要", "number": 7, "question": "乙公司 X4 年度之綜合損益表所示如下:\n綜合損益表\n銷貨收入 $50,000 \n銷貨成本 (20,000) \n銷貨毛利 $30,000 \n折舊 $3,000 \n其他營業費用 7,000 (10,000) \n淨利 $20,000 \n本期其他綜合損益 0 \n本期綜合損益總額 $20,000 \n X4 年度流動項目之金額變動如下:\n應收帳款 增加$5,000\n存貨 增加$4,000\n預付保險費 減少$2,000\n應付帳款 減少$2,100\n應付費用 增加$4,000\n 請問乙公司 X4 年度營業活動之淨現金流入(出)為:", "options": {"A": "$14,900", "B": "$17,900", "C": "$24,900", "D": "$25,100"}, "answer": "B", "note": ""}, {"id": "accounting-104-8", "year": "104", "subject": "accounting", "subjectName": "會計學概要", "number": 8, "question": "在其他條件不變下,大名企業產品每單位售價為$150,每單位變動製造成本$50,固定製造成本$500,000,\n每單位變動行銷成本$40,固定行銷成本$100,000。請問大名企業的損益兩平點銷售單位為多少?", "options": {"A": "4,000 單位", "B": "5,000 單位", "C": "8,333 單位", "D": "10,000 單位"}, "answer": "D", "note": ""}, {"id": "accounting-104-9", "year": "104", "subject": "accounting", "subjectName": "會計學概要", "number": 9, "question": "大成企業 10 月 1 日預付一年產物保險費$24,000,當天會計入帳時以保險費入帳。請問 12 月 31 日有關此\n一筆調整分錄,下列敘述何者正確?", "options": {"A": "借記保險費$6,000", "B": "借記預付保險費$18,000", "C": "貸記保險費$6,000", "D": "貸記預付保險費$18,000"}, "answer": "B", "note": ""}, {"id": "accounting-104-10", "year": "104", "subject": "accounting", "subjectName": "會計學概要", "number": 10, "question": "小明在編製試算表時發現借方餘額比貸方餘額多出$90,如果小明過帳時只有發生一項錯誤,下列何者最\n可能為小明發生之錯誤?", "options": {"A": "過帳時將一筆借方$90 的金額,誤過入貸方項目", "B": "過帳時將一筆$20,090 的金額,貸方誤記為$20,009", "C": "過帳時將一筆$18,540 的金額,貸方誤記為$18,450", "D": "將一筆賒購進貨$90 的交易,誤記成現金交易"}, "answer": "C", "note": ""}, {"id": "accounting-104-11", "year": "104", "subject": "accounting", "subjectName": "會計學概要", "number": 11, "question": "丁公司於 X4 年度之普通股流通在外股數之相關資料如下:1 月 1 日 1,000 股,3 月 1 日增資發行 500\n股,5 月 1 日發放股票股利 20%,11 月 1 日買回庫藏股 300 股。請問丁公司進行每股盈餘之計算時,X4\n年度加權平均流通在外之普通股股數為:", "options": {"A": "1,500 股", "B": "1,567 股", "C": "1,650 股", "D": "2,100 股"}, "answer": "C", "note": ""}, {"id": "accounting-104-12", "year": "104", "subject": "accounting", "subjectName": "會計學概要", "number": 12, "question": "丁公司於 X3 年 1 月 1 日簽發一張面額$100,000,票面利率為 10%,每年 12 月 31 日付息之 3 年期票據進\n行借款,簽發當時之市場利率為 12%。此票據於 X4 年 12 月 31 日之餘額應為〔註:(1)複利現值請四捨五\n入後,以小數點後五位數為計算基礎;(2)其他計算之金額請以整數值(元)為表達〕:", "options": {"A": "$95,197", "B": "$96,621", "C": "$98,216", "D": "$100,000"}, "answer": "C", "note": ""}, {"id": "accounting-104-13", "year": "104", "subject": "accounting", "subjectName": "會計學概要", "number": 13, "question": "依循國際會計準則第 37 號「負債準備、或有負債及或有資產」,下列有關「或有負債」之敘述何者錯誤?", "options": {"A": "不得認列或有負債", "B": "因過去事項產生之現時義務,很有可能需要流出具經濟效益之資源以清償該義務", "C": "因過去事項產生之現時義務,該經濟義務之金額無法充分可靠地衡量", "D": "因過去事項產生之可能義務,其存在與否僅能由一個或多個未能完全由企業所控制之不確定未來事項\n之發生或不發生加以證實"}, "answer": "B", "note": ""}, {"id": "accounting-104-14", "year": "104", "subject": "accounting", "subjectName": "會計學概要", "number": 14, "question": "戊公司於 X4 年 12 月底因火災造成 60%之存貨損失,存貨之相關資料如下:\n X3 年 X4 年\n銷貨淨額 $450,000 $500,000\n期初存貨 30,000 28,000\n進貨 245,000 340,000\n進貨運費 5,000 20,000\n期末存貨 28,000 ? \n戊公司於 X4 年 12 月底因火災造成之存貨損失數為:", "options": {"A": "$28,000", "B": "$43,200", "C": "$64,800", "D": "$108,000"}, "answer": "C", "note": ""}, {"id": "accounting-104-15", "year": "104", "subject": "accounting", "subjectName": "會計學概要", "number": 15, "question": "根據國際會計準則第 41 號「農業」,下列何者並非該準則列舉之生物資產?", "options": {"A": "綿羊", "B": "乳牛", "C": "棉花", "D": "人造森林之林木"}, "answer": "C", "note": ""}, {"id": "accounting-104-16", "year": "104", "subject": "accounting", "subjectName": "會計學概要", "number": 16, "question": "根據國際會計準則第 2 號「存貨」之規範中,對於性質與用途類似之所有存貨,應採用相同之成本公式。\n惟下列何者為該準則不允許之成本計算公式?", "options": {"A": "成本個別認定法", "B": "先進先出法", "C": "加權平均成本法", "D": "後進先出法"}, "answer": "D", "note": ""}, {"id": "accounting-104-17", "year": "104", "subject": "accounting", "subjectName": "會計學概要", "number": 17, "question": "丙公司於 X1 年 1 月 1 日購買成本$120,000,估計可使用 8 年,無殘值之設備一部,公司採用直線法提列\n折舊。X3 年 12 月 31 日設備之使用價值$72,000,淨公允價值為$70,000,X5 年 12 月 31 日使用價值$36,000,\n淨公允價值為$39,000,X6 年 12 月 31 日使用價值$35,000,淨公允價值為$31,000。請問 X6 年 12 月 31\n日資產負債表之設備餘額為:", "options": {"A": "$26,000", "B": "$30,000", "C": "$31,000", "D": "$35,000"}, "answer": "B", "note": ""}, {"id": "accounting-104-18", "year": "104", "subject": "accounting", "subjectName": "會計學概要", "number": 18, "question": "X4 年 10 月 1 日丁公司以現金買回流通在外普通股 1,000 股為庫藏股票,買回成本每股$15,而 11 月 15 日\n以每股$17 出售半數庫藏股票,12 月 16 日以每股$12 出售剩餘之庫藏股票。請問 X4 年 12 月 16 日出售庫\n藏股票時,丁公司應以「資本公積-庫藏股票交易」(借記或貸記)與金額進行如下之正確記錄:", "options": {"A": "借記:1,000", "B": "借記:1,500", "C": "貸記:1,000", "D": "貸記:1,500"}, "answer": "A", "note": ""}, {"id": "accounting-104-19", "year": "104", "subject": "accounting", "subjectName": "會計學概要", "number": 19, "question": "甲公司採用曆年制會計年度,在 X4 年 12 月 31 日資產負債表中,該公司會計部門正斟酌一項報表表達問\n題。該公司積欠之負債中,$200,000 將於 X5 年 2 月 16 日到期,甲公司打算與銀行完成再融資協議,將\n$200,000 負債延長至 X6 年予以清償,而此協議已於 X5 年 1 月 31 日完成雙方之再融資合約,董事會並\n於 X5 年 3 月 31 日通過 X4 年度之財務報表並宣布。請問此$200,000 負債於 X4 年 12 月 31 日的資產負債\n表應如何表達?", "options": {"A": "流動負債", "B": "長期負債", "C": "$100,000 為流動負債,$100,000 為長期負債", "D": "$200,000 轉為股東權益項目"}, "answer": "A", "note": ""}, {"id": "accounting-104-20", "year": "104", "subject": "accounting", "subjectName": "會計學概要", "number": 20, "question": "戊公司根據國際會計準則第 16 號「不動產、廠房及設備」,並於 X4 年 12 月 31 日對於設備進行重估價\n模式,當時設備之帳面金額為$300,000,原始成本$500,000,累計折舊$200,000,而設備之公允價值為\n$360,000。請問戊公司於 X4 年 12 月 31 日採用重估模式後,設備之帳面金額為:", "options": {"A": "$200,000", "B": "$300,000", "C": "$360,000", "D": "$500,000"}, "answer": "C", "note": ""}, {"id": "accounting-104-21", "year": "104", "subject": "accounting", "subjectName": "會計學概要", "number": 21, "question": "下列何項資產係屬投資性不動產適用範圍?", "options": {"A": "土地開發公司自用之土地", "B": "人壽保險公司持有為賺取租金或資本增值之不動產", "C": "電子公司持有為擴建廠房使用", "D": "建設公司持有準備於營業過程中出售之不動產"}, "answer": "B", "note": ""}, {"id": "accounting-104-22", "year": "104", "subject": "accounting", "subjectName": "會計學概要", "number": 22, "question": "請問下列何者為財務報表的外部使用者?", "options": {"A": "公司經理人", "B": "公司股東", "C": "公司員工", "D": "公司的董事"}, "answer": "BC", "note": "答B或C或BC者均給分"}, {"id": "accounting-104-23", "year": "104", "subject": "accounting", "subjectName": "會計學概要", "number": 23, "question": "乙公司於 X3 年 10 月 15 日簽發一張 90 天期,5%,面額$300,000 的票據一張,藉此票據以清償即將到期\n的帳款。若一年以 360 天計算,此票據之到期日應為:", "options": {"A": "X3 年 12 月 31 日", "B": "X4 年 1 月 13 日", "C": "X4 年 1 月 15 日", "D": "X4 年 1 月 31 日"}, "answer": "B", "note": ""}, {"id": "accounting-104-24", "year": "104", "subject": "accounting", "subjectName": "會計學概要", "number": 24, "question": "大甲公司過去向小乙公司購入一項工具專利權,$1,000,000,目前該專利權帳面價值為$600,000。然而,\n公司本年度發現中丙公司仿製公司專利,經訴訟後獲得勝訴,訴訟費用合計$200,000。重新評估該專利權\n可使用兩年預計產生$450,000 之淨現金流量折現值,另外經估價該專利權之淨公允價值為$400,000。請問\n下列敘述何者正確?", "options": {"A": "維護專利權勝訴的費用$200,000,應列為當年度費用", "B": "專利權餘額應採用現金流量折現值加本年度專利權訴訟維護費用$470,000 列為專利權成本", "C": "專利權應採用帳面價值$600,000 攤銷", "D": "本年度專利權應用可收回現值價值與公允價值較低者列帳"}, "answer": "A", "note": ""}, {"id": "accounting-104-25", "year": "104", "subject": "accounting", "subjectName": "會計學概要", "number": 25, "question": "X2 年 12 月 31 日,乙公司已發行之普通股 10,000 股,每股面額$10,同時,累積與完全參加特別股 2,000\n股,每股面額$25,股利率 5%。X3 年度乙公司宣告並發放現金股利$15,000,X4 年並未宣告現金股利。\n請問當乙公司採用曆年制會計年度,X4 年 12 月 31 日「應付現金股利」之餘額為:", "options": {"A": "$0", "B": "$2,500", "C": "$5,000", "D": "$15,000"}, "answer": "A", "note": ""}, {"id": "bookkeeping-104-1", "year": "104", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 1, "question": "請閱讀下方原卷的選擇題第 1 題，再選 A、B、C 或 D。", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "C", "note": "", "paper": "104170_1201_記帳相關法規概要.pdf", "images": ["pages/104/1201-1.jpg"]}, {"id": "bookkeeping-104-2", "year": "104", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 2, "question": "請閱讀下方原卷的選擇題第 2 題，再選 A、B、C 或 D。", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "C", "note": "", "paper": "104170_1201_記帳相關法規概要.pdf", "images": ["pages/104/1201-1.jpg"]}, {"id": "bookkeeping-104-3", "year": "104", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 3, "question 讀(下聯)", "C": "傳家有道惟忠厚(上聯) 處世無奇但率真(下聯)", "D": "萬馬奔騰氣象新(上聯) 百花齊放春光好(下聯)"}, "answer": "C", "note": ""}, {"id": "chinese-104-5", "year": "104", "subject": "chinese", "subjectName": "國文", "number": 5, "question": "貫雲石〈清江引〉:「若還與他相見時,道個真傳示。不是不修書,不是無才思,\n遶清江買不得天樣紙。」\n下列選項何者與本文的意義相近?", "options": {"A": "世態人情經歷多", "B": "帳前滴盡英雄淚", "C": "知榮知辱牢緘口", "D": "人生自是有情痴"}, "answer": "D", "note": ""}, {"id": "chinese-104-6", "year": "104", "subject": "chinese", "subjectName": "國文", "number": 6, "question": "李魁賢〈飛蚊症〉:「堅持一甲子的清白/視網膜上突然/出現了飛蚊/不會妨礙\n視線/只是干擾/我的視覺意識/意識卻困擾了生命的意志/我對女兒說:『實在/\n不甘願羣蚊亂舞的餘生』/女兒卻淡淡地說:『那沒有什麼呀/我從小就這樣長大\n的呀』/我質問她從來都沒提起過/女兒竟說:『我以為人的眼睛都是這樣的呀』/\n啊 原來結構性的病變/早就從下一代著手了/無論體質、語言、生活習慣......」\n下列對詩人寫作意旨的說明何者錯誤?", "options": {"A": "以視覺微恙寄寓社會症候", "B": "強調自主發聲,以對抗衰老", "C": "清白指的是堅持不隨波逐流", "D": "感嘆下一代已將病態視為常態"}, "answer": "B", "note": ""}, {"id": "chinese-104-7", "year": "104", "subject": "chinese", "subjectName": "國文", "number": 7, "question": "依文意判斷,下列對聯歌詠孔子的是:", "options": {"A": "曰帝曰侯曰聖人 名光日月", "B": "風雪江天 弔古賸一輪明月\n安蜀安漢安天下 志在春秋 衣冠丘隴 招魂有萬古梅花", "C": "德配天地 泗水文章昭日月", "D": "正氣常存 俎豆至今尊帝里\n道貫古今 杏壇禮樂冠華夷 孤忠立極 神靈宜近接黌宮"}, "answer": "C", "note": ""}, {"id": "chinese-104-8", "year": "104", "subject": "chinese", "subjectName": "國文", "number": 8, "question": "在生活裏,一切都好像是正常和必須的,所以我們一切的反應也都是從容和有規有\n矩的。但是,在面對着只屬於生命的那些獨特時刻裏,卻總會有一種壓力迎面而來,\n讓我們覺得猶疑、戰慄和身不由己。\n十九歲那年,站在山坡上,遠遠望去,彷彿所有的峯巒、所有的江流都充滿了一種\n令人振奮的希望。而二十年後再來登臨,再來遠遠地望過去,山巒與江流外面的世\n界就是我們曾經摸索追尋、跌倒再爬起來、哭過也笑過的那一個世界。在灰紫色的\n暮靄裏,所有的過去井然有序地在我眼前排列開來,我發現,我竟然能夠很輕易地\n就分辨了出來,那些時刻是屬於生活,而那些時刻是只屬於我的生命的了。\n因此,就真的好像我寫的那兩句詩了:\n--所有的時刻都很倉惶而又模糊\n 除非你能停下來 遠遠地回顧 (席慕蓉〈兩種時刻〉)\n下列敘述何者最貼近本文意旨?", "options": {"A": "回首來時路,一切了然於心", "B": "坐看雲起時,一切盡付笑談中", "C": "船過水無痕,過去的就別計較了", "D": "人生如朝露,活在當下及時行樂"}, "answer": "A", "note": ""}, {"id": "chinese-104-9", "year": "104", "subject": "chinese", "subjectName": "國文", "number": 9, "question": "「天生萬物,有美有不美,有才有不才。萬具枯骨,才造得一員名將;小兵小卒,\n豈能都成為有名的英雄?世上有坐轎的,有抬轎的;有坐席的主人和賓客,有端茶\n上菜的侍僕。」\n本文旨在說明:", "options": {"A": "天生我才必有用", "B": "職業無貴賤,行行出狀元", "C": "天之生材不齊,無法一律均等", "D": "一人的成功往往建立在眾人的付出之上"}, "answer": "C", "note": ""}, {"id": "chinese-104-10", "year": "104", "subject": "chinese", "subjectName": "國文", "number": 10, "question": "華歆、王朗俱乘船避難,有一人欲依附,歆輒難之。朗曰:「幸尚寬,何為不可?」\n後賊追至,王欲捨所攜人。歆曰:「本所以疑,正為此耳。既已納其自託,寧可以\n急相棄邪?」遂攜拯如初。世以此定華、王之優劣。(《世說新語.德性》)\n下列選項何者最近於華歆助人之道?", "options": {"A": "勿為德不卒", "B": "飲水不忘挖井人", "C": "人人為我,我為人人", "D": "病人之病,憂人之憂"}, "answer": "A", "note": ""}, {"id": "chinese-104-11", "year": "104", "subject": "chinese", "subjectName": "國文", "number": 11, "question": "「且夫水之積也不厚,則其負大舟也無力。覆杯水於坳堂之上,則芥為之舟;置杯焉\n則膠,水淺而舟大也。風之積也不厚,則其負大翼也無力。」(《莊子‧逍遙遊》)\n本段意指:", "options": {"A": "積少成多方能致富", "B": "積重難返徒勞無功", "C": "積累實力乃能成就大事", "D": "積極向上始克有所作為"}, "answer": "C", "note": ""}, {"id": "chinese-104-12", "year": "104", "subject": "chinese", "subjectName": "國文", "number": 12, "question": "「決定海岸管理方式時,讓在地社區扮演舉足輕重的角色是很重要的。」莫里斯強\n調。該組織贏得廣大英國人民支持與信任的原因之一,就在於積極邀請民眾參與。\n海神計畫不做黑箱作業,而是主動「和在地社區一起深入探討各種方案、檢視證據、\n確立問題的解決之道,幫助他們了解和適應海岸面臨的變化。」\n而且,不管立意如何良善、設計如何精良,英國國民信託堅持不能強迫居民接受任\n何方案,而是兼具感性與想像力,長時間與居民溝通對話,達成共識,互相學習。\n「重點是,我們不能高高在上地自以為是,而是要讓民眾感受到他們的意見是被聆\n聽與重視的,就算我們不盡然同意他們的看法。」莫里斯提醒。\n一開始,國民信託會與當地社區討論,一起確立當地獨特的重要性,並徵詢遊客的\n意見,達成共識。而這份共識不僅將成為未來經營管理的有用依據,也是將居民納\n入國民信託計畫的陣營,共同為環境努力。(賴慧玲〈英國國民信託啟示:給自己\n一個改變現況的機會〉)\n依上文,有關英國國民信託的敘述,下列選項何者正確?", "options": {"A": "莫里斯分享海神計畫中有關海岸管理方式的經驗", "B": "國民信託會邀請當地居民對談,從未有過不同意見", "C": "國民信託會以專家建議為主,輔以在地社區居民的意見", "D": "英國國民信託能獲得民眾的支持,主因在於立意良善、設計精良"}, "answer": "A", "note": ""}, {"id": "chinese-104-13", "year": "104", "subject": "chinese", "subjectName": "國文", "number": 13, "question": "新生南路這條路(此為瑠公圳最大幹道,它如安東街、延吉街等,亦是瑠公圳眾多\n支渠中之要者),若我今日想來,是昔年臺北最重要、最素美的市內河景,亦是我\n臺北孩子不自禁生負某種自卑感之下卻猶能以之緬懷而深感尊嚴的一處地標。它未\n必被視為古蹟;若林安泰古厝之拆遷、理教總公所(西本願寺)之毀於火焚、新生\n報舊址之改建、公賣局木造樓舍及臺大醫學院木造樓舍之拆除......,固極可惜,也\n還罷了,然這城市之內一泓天成溪流,南北迆邐好幾公里,河上樹影,春花秋月,\n實臺北市即使趨奔現代,也不宜改觀這一抹與「現代」毫不相悖的活水氣質。一九\n七二年之覆蓋填掩,固為臺北多占了幾畝陸地,卻令臺北意欲晉身世界大都會原本\n極可羨人,並又生死攸關的一條天生麗質血管就這麼斷然結紮了。(舒國治〈水城\n臺北〉)\n舒國治描述水道與人生活的關聯,一九七二年覆蓋填掩瑠公圳的行為無異「結紮」\n一語,乃在強調水道之於城市人生活間具備何種意義:", "options": {"A": "反應人生時間的無情流逝", "B": "涵攝生命源頭與流動活力", "C": "提供放鬆心神與休閒遊憩", "D": "鼓勵投入勞動與後代繁衍"}, "answer": "B", "note": ""}, {"id": "chinese-104-14", "year": "104", "subject": "chinese", "subjectName": "國文", "number": 14, "question": "時髦與美沒有必然的關係,它與習慣有關係。人類對事物的愛好是從新奇開始,然\n後是熟習,最後是麻木。當熟習一種造型的時候,產生感情上水乳交融的關係,並\n未考慮到美醜。可是並非與美感毫無關係。舉例說,今天的年輕人喜歡把頭髮染成\n棕色,這是自日本傳來的一種流行。年輕人開始是好奇,久而久之,竟覺得頭髮不\n染就過於老派,因此大家都染,已經很習慣了。可是我們年紀大的人看他們染髮也\n許看不慣,身為旁觀者,卻看得出有的頭髮染得恰如其分,有些染得過分,因此失\n了美感。如果冷靜下來,即使在時尚中,仍然可以辨別美醜。因為美的一些基本原\n則仍然是可以通用的。這就是說,時髦本身與美無關,但它仍然要受到美的批判。\n只是在流行之中,人的美感反應受到麻醉,常常忽略了客觀的美感判斷。所以對我\n而言,時髦是美感的麻醉劑,是應該非常注意的,雖然不能避免卻不可沉迷其中。\n(漢寶德〈時髦與美感〉)\n根據上文,下列選項何者錯誤?", "options": {"A": "時髦與美感沒有任何關係", "B": "時髦是一種流行,代表時尚", "C": "時髦與習慣具有密切的關係", "D": "時髦麻醉美感,容易失去美感判斷"}, "answer": "A", "note": ""}, {"id": "chinese-104-15", "year": "104", "subject": "chinese", "subjectName": "國文", "number": 15, "question": "請閱讀下列兩段文字,選擇對此兩段文字內容、意旨最正確的詮釋:\n宋人或得玉,獻諸司城子罕,子罕不受。獻玉者曰:「以示玉人,玉人以為寶,故\n敢獻之。」子罕曰:「我以不貪為寶,爾以玉為寶,若以與我,皆喪寶也。不若人\n有其寶。」\n公儀休為魯相,......客有遺相魚者,相不受。客曰:「聞君嗜魚,故遺君魚,何故\n不受?」公儀休曰:「以嗜魚,故不受也。今為相,能自給魚。今受魚而免相,誰\n復給我魚者?吾故不受也。」", "options": {"A": "子罕與公儀休重操守而不接受饋贈", "B": "子罕能實踐「己所不欲,勿施於人」", "C": "公儀休不接受贈魚,乃因「由奢入儉」難", "D": "子罕能推己及人,不願奪人所愛,不忍他人喪其寶"}, "answer": "A", "note": ""}, {"id": "chinese-104-16", "year": "104", "subject": "chinese", "subjectName": "國文", "number": 16, "question": "「《莊子‧秋水篇》寫道:『井蛙不可以語於海者,拘於墟也。夏蟲不可以語於冰\n者,篤於時也。曲士不可以語於道者,束於教也。』拘於墟是為□□所限,篤於時\n是為□□所限,束於教是被□□所限。」(陳冠學〈對稱〉)\n本文中□□,依序應為:", "options": {"A": "生命/環境/宗教", "B": "視野/境界/思想", "C": "時間/空間/信仰", "D": "空間/時間/教條"}, "answer": "D", "note": ""}, {"id": "chinese-104-17", "year": "104", "subject": "chinese", "subjectName": "國文", "number": 17, "question": "「隋趙車丸為齊州別駕。東鄰有桑葚落其家,車丸悉拾還其主。......及詔入朝,父老揮\n涕曰:『別駕在官,水火不與百姓交,不敢以盃酒相送。公清如水,請酌一盃水奉\n餞。』車丸受飲之。後為原州司馬,在道夜行,馬逸入田中,暴人禾。車丸駐馬待明,\n訪知禾主,酬直而去。」(王罃《群書類編故事》)\n由此足見趙車丸:", "options": {"A": "吹毛求疵,事事計較", "B": "清廉正直,不欺暗室", "C": "處事謹慎,公而忘私", "D": "不貪小錢,私受大錢"}, "answer": "B", "note": ""}, {"id": "chinese-104-18", "year": "104", "subject": "chinese", "subjectName": "國文", "number": 18, "question": "賦稅是國家施政的根基和重要制度,下列文字是春秋時代鄭國大夫子產面對國人抗\n稅時的記載:\n鄭子產作丘賦,國人謗之,曰:「其父死於路,己為蠆尾,以令於國,國將若之何?」\n子寬以告,子產曰:「何害?苟利社稷,死生以之,且吾聞為善者不改其度,故能\n有濟也。民不可逞,度不可改。詩曰:『禮義不愆,何恤於人言?』吾不遷矣。」\n(《左傳.昭公四年》)\n根據上文所述,面對國人的抗爭、毀謗,下列選項何者與子產的自述不同:", "options": {"A": "不可放縱民意而隨意更改國家制度", "B": "只要有利於國家,個人生命在所不顧", "C": "只要所作所為不違背禮義,不必在乎別人的批評", "D": "能堅持執行國家所訂定的政策,才能得到人民的幫助\n依下文回答第 19~20 題:\n鄭人有欲買履者,先自度其足,而置之其坐。至之市,而忘操之。已得履,乃曰:「吾\n忘持度。」反歸取之。及反,市罷,遂不得履。人曰:「何不試之以足?」曰:「寧信\n度,無自信也。」(《韓非子.外儲說左上》〈鄭人買履〉)"}, "answer": "D", "note": ""}, {"id": "chinese-104-19", "year": "104", "subject": "chinese", "subjectName": "國文", "number": 19, "question": "鄭人欲買鞋,先自度其足,「自度」是指自己:", "options": {"A": "穿舊鞋", "B": "帶磅秤", "C": "量尺寸", "D": "設計鞋"}, "answer": "C", "note": ""}, {"id": "chinese-104-20", "year": "104", "subject": "chinese", "subjectName": "國文", "number": 20, "question": "由「寧信度,無自信也」,可知鄭人:", "options": {"A": "毫無信義", "B": "非常健忘", "C": "老實忠厚", "D": "捨本逐末"}, "answer": "D", "note": ""}, {"id": "tax-104-1", "year": "104", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 1, "question": "請閱讀下方原卷的選擇題第 1 題，再選 A、B、C 或 D。", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "D", "note": "", "paper": "104170_1204_稅務相關法規概要.pdf", "images": ["pages/104/1204-3.jpg"]}, {"id": "tax-104-2", "year": "104", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 2, "question": "請閱讀下方原卷的選擇題第 2 題，再選 A、B、C 或 D。", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "A", "note": "", "paper": "104170_1204_稅務相關法規概要.pdf", "images": ["pages/104/1204-3.jpg", "pages/104/1204-4.jpg"]}, {"id": "tax-104-3", "year": "104", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 3, "question": "請閱讀下方原卷的選擇題第 3 題，再選 A、B、C 或 D。", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "A", "note": "", "paper": "104170_1204_稅務相關法規概要.pdf", "images": ["pages/104/1204-3.jpg", "pages/104/1204-4.jpg"]}, {"id": "tax-104-4", "year": "104", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 4, "question":
