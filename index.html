inese", "subjectName": "國文", "number": 14, "question": "下列選項,何者不符合「防微杜漸」的觀念?", "options": {"A": "為之於未有,治之於未亂", "B": "聖人不病,以其病病,是以不病", "C": "大道廢,有仁義;六親不和,有孝慈", "D": "不貴難得之貨,使民不為盜;不見可欲,使民心不亂"}, "answer": "C", "note": ""}, {"id": "chinese-107-15", "year": "107", "subject": "chinese", "subjectName": "國文", "number": 15, "question": "「今夫世俗愜意事,如美食大官,高貲華屋,皆眾人所必爭,而造物者之所甚靳,\n有不可得者。」作者認為「世俗愜意事」之所以難於謀取的原因為何?", "options": {"A": "世俗無德者多,故不具取得資格", "B": "造物者亦以此為貴,故吝於給予", "C": "對於命中所無之事,自不可強求", "D": "僧多粥少,上蒼亦不能有求必應"}, "answer": "D", "note": ""}, {"id": "chinese-107-16", "year": "107", "subject": "chinese", "subjectName": "國文", "number": 16, "question": "王安石〈遊褒禪山記〉:「余於仆碑,又以悲夫古書之不存,後世之謬其傳而莫能\n名者,何可勝道也哉!此所以學者不可以不深思而慎取之也。」根據文意,下列敘\n述何者最符合作者的慨歎本意?", "options": {"A": "古書流傳訛誤以致真相難明,故為學必須謹言慎行", "B": "古書保存不易以致求知困難,故為學必須拜師學藝", "C": "古書亡佚以致真相本意難明,故為學必須慎思明辨", "D": "古書傳世不多以致訪求困難,故為學必須廣泛蒐羅"}, "answer": "C", "note": ""}, {"id": "chinese-107-17", "year": "107", "subject": "chinese", "subjectName": "國文", "number": 17, "question": "甲、上邪!我欲與君相知,長命無絕衰。山無陵,江水為竭;冬雷震震,夏雨雪;\n天地合,乃敢與君絕\n乙、枕前發盡千般願,要休且待青山爛。水面上秤錘浮,直待黃河徹底枯。白日參\n辰見,北斗迴南面。休即未能休,且待三更見日頭\n根據上引詩歌,下列詮釋何者正確?", "options": {"A": "甲詩描述種種氣候的異象,以隱晦的方式暗示戀情不見容於社會", "B": "乙詩不僅以天地起誓,還藉秤錘、睡枕為喻,鄭重表達婚約之盼", "C": "兩首詩歌都藉由四季的更迭表現時光荏苒,襯托戀人的情感日篤", "D": "兩首詩歌都以大自然的異常景象反襯愛情的堅貞,強調至死不渝"}, "answer": "D", "note": ""}, {"id": "chinese-107-18", "year": "107", "subject": "chinese", "subjectName": "國文", "number": 18, "question": "夫國家作事,以公共為心者,人必樂而從之;以私奉為心者,人必咈(ㄈㄨˊ)而\n叛之。故燕昭築金臺,天下稱其賢。殷紂作玉杯,百代傳其惡,蓋為人與為己殊也。\n(陸贄〈奉天請罷瓊林大盈二庫狀〉)\n根據上文,下列選項何者錯誤?", "options": {"A": "「咈而叛之」意謂人民違逆不願服從", "B": "「以公共為心」和「以私奉為心」的差別在動機不同", "C": "「殷紂作玉杯,百代傳其惡」的原因是:製作玉杯將使人人為己而忘公", "D": "「燕昭築金臺,天下稱其賢」的原因是:築黃金臺招致賢才,為國家之公利"}, "answer": "C", "note": ""}, {"id": "chinese-107-19", "year": "107", "subject": "chinese", "subjectName": "國文", "number": 19, "question": "「說國賊懷奸從佞,遣愚夫等輩生嗔;說忠臣負屈銜冤,鐵心腸也須下淚。講鬼\n怪令羽士心寒膽戰;論閨怨遣佳人綠慘紅愁。說人頭廝挺,令武士快心;言兩陣\n對圓,使雄夫壯志。談呂相青雲得路,遣才人著意群書;演霜林白日升天,教隱\n士如初學道。」\n下列敘述,何者最能詮釋上文有關說書人表演的描述?", "options": {"A": "說書藝術具有移人性情的感染力,能讓怯者勇、薄者敦", "B": "說書藝術首重想像虛構,才能針砭時政、喚起聽眾共鳴", "C": "說書人的講述反映市井生活,販夫走卒經常成為故事中的主角", "D": "說書人須清楚交代故事人物的經歷,才能證明自己的學識淵博"}, "answer": "A", "note": ""}, {"id": "chinese-107-20", "year": "107", "subject": "chinese", "subjectName": "國文", "number": 20, "question": "尺棰當猛虎,奮呼而操擊;徒手遇蜥蜴,變色而卻步;人之情也。知此者,可以將\n矣。袒裼而按劍,則烏獲不敢逼;冠冑衣甲,據兵而寢,則童子彎弓殺之矣。故善\n用兵者以形固。夫能以形固,則力有餘矣。(蘇洵〈心術〉)\n文中「能以形固」之意,下列說明何者最正確?", "options": {"A": "攻其無備,出其不意", "B": "善戰者因其勢而利導之", "C": "不戰而屈人之兵,善之善者", "D": "善用兵者,使之無所顧,有所恃"}, "answer": "D", "note": ""}, {"id": "tax-107-1", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 1, "question": "依加值型及非加值型營業稅法(以下簡稱營業稅法)相關規定,下列何者得免用或免開統一發票? 1公\n用事業 2理髮業 3計程車業 4幼稚園提供之教育勞務", "options": {"A": "123", "B": "124", "C": "134", "D": "234"}, "answer": "D", "note": ""}, {"id": "tax-107-2", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 2, "question": "依營業稅法相關規定,依特種稅額計算之行業中,下列何者得申請按加值型營業稅計算應納稅額?", "options": {"A": "保險業出租不動產收入", "B": "銀行業之利息收入", "C": "特種飲食業", "D": "典當業"}, "answer": "A", "note": ""}, {"id": "tax-107-3", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 3, "question": "依營業稅法相關規定,下列何者並非得扣抵稅額之進項憑證應記載之事項?", "options": {"A": "交易日期", "B": "營業人名稱", "C": "營業人統一編號", "D": "營業人電話號碼"}, "answer": "D", "note": ""}, {"id": "tax-107-4", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 4, "question": "依營業稅法相關規定,下列進項稅額中,何者可扣抵銷項稅額?", "options": {"A": "公司招待員工旅遊之住宿費用", "B": "年節送禮給客戶之費用", "C": "購入小貨車供載貨用", "D": "捐贈公益慈善團體之支出"}, "answer": "C", "note": ""}, {"id": "tax-107-5", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 5, "question": "依營業稅法相關規定,下列營業人,何者得申請以每 1 個月為一期,於次月 15 日前向主管稽徵機關申報\n銷售額、應納或溢付營業稅額?", "options": {"A": "小規模營業人", "B": "提供與外銷有關勞務之營業人", "C": "專營免稅營業人", "D": "典當業"}, "answer": "B", "note": ""}, {"id": "tax-107-6", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 6, "question": "依相關稅法規定,總機構在我國境內之甲公司,民國(下同)107 年中出售公司名下於 105 年購入之土地\n一筆,該土地相關之租稅負擔何者正確?", "options": {"A": "免納營業稅,但需繳納營利事業所得稅", "B": "免納營利事業所得稅,但需繳納營業稅", "C": "免納營業稅及營利事業所得稅", "D": "需同時繳納營業稅及營利事業所得稅"}, "answer": "A", "note": ""}, {"id": "tax-107-7", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 7, "question": "依營業稅法規定,下列有關非加值型營業稅稅率之規定,何者錯誤?", "options": {"A": "銀行業本業收入為 5%", "B": "夜總會收入為 15%", "C": "保險業再保費收入為 0.1%", "D": "酒店收入為 25%"}, "answer": "C", "note": ""}, {"id": "tax-107-8", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 8, "question": "光華中古車行今年 5 月中,分別以 105,000 元向張先生,及以 126,000 元向李先生購入各一輛舊乘人小汽\n車,前者於同年 5 月以含稅 94,500 元出售,後者於 6 月以含稅 157,500 元出售,則 5、6 月可申報扣抵舊\n乘人小汽車進項稅額多少元?", "options": {"A": "4,500 元", "B": "10,500 元", "C": "11,000 元", "D": "12,000 元"}, "answer": "B", "note": ""}, {"id": "tax-107-9", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 9, "question": "依現行營利事業所得稅查核準則(以下簡稱查核準則)規定,下列那些費用或損失之認列,應以實現者\n為限?", "options": {"A": "勞工退休準備金", "B": "兌換損失", "C": "存貨跌價損失", "D": "呆帳損失"}, "answer": "B", "note": ""}, {"id": "tax-107-10", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 10, "question": "依現行查核準則規定,下列各項費用認列標準之敘述,何者正確?", "options": {"A": "營利事業單件購置之固定資產,其耐用年限超過兩年,而支出金額不超過 8 萬元者,得列為當年度費用", "B": "非適用勞動基準法之營利事業定有職工退休辦法者,每年度得在不超過當年度已付薪資總額 6%限度\n內,提列退休金準備,並以費用列支", "C": "營利事業對政黨之捐贈,以不超過所得額 20%為限,其可扣除總額不得超過 50 萬元", "D": "營利事業透過財團法人私立學校興學基金會,對未指定特定私立學校之捐款,不得超過所得額 25%"}, "answer": "A", "note": ""}, {"id": "tax-107-11", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 11, "question": "依現行所得稅法規定,非小規模之獨資、合夥組織營利事業,應如何申報繳納所得稅?", "options": {"A": "只需申報營利事業所得額,不必繳納營利事業所得稅,直接歸課獨資資本主或合夥組織合夥人之綜合\n所得稅", "B": "需先申報並繳納 20%的營利事業所得稅,稅後純益再歸課獨資資本主或合夥組織合夥人之綜合所得稅", "C": "需先申報並計算其營利事業所得額與稅額,並以其全年應納稅額之半數,減除尚未抵繳之扣繳稅額,\n計算其應納之營利事業所得稅結算稅額,於申報前自行繳納", "D": "獨資、合夥組織之營利事業所得額減除全年應納稅額半數後之餘額,應由獨資資本主或合夥組織合夥\n人列為營利所得,課徵綜合所得稅"}, "answer": "A", "note": ""}, {"id": "tax-107-12", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 12, "question": "依所得稅法規定,下列親屬何者年滿 70 歲,其免稅額可增加 50%?", "options": {"A": "伯父", "B": "姐姐", "C": "岳母", "D": "舅舅"}, "answer": "C", "note": ""}, {"id": "tax-107-13", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 13, "question": "依相關稅法規定,有關捐贈課免稅之敘述,下列何者錯誤?", "options": {"A": "個人捐贈給各級政府之財產,可全數自其綜合所得總額中減除", "B": "遺贈人捐贈給公有事業機構之財產,可不計入其遺產總額", "C": "個人捐贈給依法登記為財團法人組織且符合行政院規定標準之教育、文化、公益、慈善、宗教團體之\n財產,未超過綜合所得總額 20%部分,可自其綜合所得總額中減除", "D": "個人捐贈給公股持股超過 50%之事業,可不計入其贈與總額"}, "answer": "D", "note": ""}, {"id": "tax-107-14", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 14, "question": "甲公司會計年度採曆年制,於 107 年 11 月 1 日開始營業,當年度的營利事業所得額為 100,000 元,則甲\n公司 107 年度營利事業所得稅應納稅額為:", "options": {"A": "0 元", "B": "16,000 元", "C": "17,000 元", "D": "20,000 元"}, "answer": "D", "note": ""}, {"id": "tax-107-15", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 15, "question": "依現行所得稅法規定,下列何項個人所得應併入綜合所得總額課徵綜合所得稅?", "options": {"A": "出售於 100 年中繼承取得土地之交易所得", "B": "未超過 18 萬之稿費收入", "C": "百貨公司周年慶之中奬奬金", "D": "大學入學考試命題酬勞"}, "answer": "C", "note": ""}, {"id": "tax-107-16", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 16, "question": "依現行所得稅法規定,下列何項綜合所得稅之扣除額,需為納稅義務人本人、配偶或其受扶養直系親屬\n相關支出才可適用? 1人身保險費 2捐贈 3租金支出 4財產交易損失", "options": {"A": "12", "B": "13", "C": "23", "D": "34"}, "answer": "B", "note": ""}, {"id": "tax-107-17", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 17, "question": "依稅捐稽徵法規定,稅捐稽徵機關對於納稅義務人逃漏下列何項稅捐,認為涉有犯罪嫌疑之案件,得聲\n請當地司法機關簽發搜索票實施搜索? 1營利事業所得稅 2營業稅 3貨物稅 4證券交易稅", "options": {"A": "12", "B": "34", "C": "13", "D": "24"}, "answer": "A", "note": ""}, {"id": "tax-107-18", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 18, "question": "依稅捐稽徵法規定,納稅義務人於 107 年 6 月 3 日申報其 106 年度之綜合所得稅,核課期間至何時屆滿?", "options": {"A": "112 年 6 月 2 日", "B": "112 年 5 月 31 日", "C": "114 年 5 月 31 日", "D": "114 年 6 月 2 日"}, "answer": "C", "note": ""}, {"id": "tax-107-19", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 19, "question": "依遺產及贈與稅法(以下稱遺贈稅法)規定,張君死亡前 2 年內處分之下列財產,何者免依規定併入其\n死亡時遺產總額課稅?", "options": {"A": "贈與配偶之房屋", "B": "贈與姪子結婚時價值 100 萬元之財物", "C": "無償讓與女兒之債權", "D": "無償承擔父親之債務"}, "answer": "B", "note": ""}, {"id": "tax-107-20", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 20, "question": "依現行遺贈稅法規定,下列何項行為需課徵贈與稅?", "options": {"A": "逾請求權時效無償免除債務", "B": "將淨值 500 萬元未上市公司股票以 300 萬元賣給他人", "C": "向父親購買房屋能提出支付價款之確實證明,且其價款非向父親借貸取得", "D": "債務人依破產法破產,債權人因而有部分債權無法收回"}, "answer": "B", "note": ""}, {"id": "tax-107-21", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 21, "question": "依營業稅法規定,下列何項貨物或勞務之銷售免徵營業稅?", "options": {"A": "證券公司代客買賣上市股票收取之手續費收入", "B": "適用非加值型營業稅之營業人,銷售其非經常買進、賣出而持有之固定資產", "C": "投資顧問公司提供之理財諮詢勞務", "D": "電影院播映電影之票價收入"}, "answer": "B", "note": ""}, {"id": "tax-107-22", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 22, "question": "依現行相關稅法規定,有關納稅義務人權利保護之規定,下列敘述何者錯誤?", "options": {"A": "納稅者為維持自己及受扶養親屬享有符合人性尊嚴之基本生活所需之費用,不得加以課稅。所稱維持\n基本生活所需之費用,指最近一年全國每人可支配所得平均數百分之六十定之", "B": "財政部不得依所發布之行政命令減少納稅義務人法定之納稅義務", "C": "稅法基於特定政策所擬定之租稅優惠應經稅式支出評估", "D": "稽徵機關應設置適當場所聆聽納稅義務人陳情案件"}, "answer": "A", "note": ""}, {"id": "tax-107-23", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 23, "question": "依稅捐稽徵法規定,有關稅捐之移送強制執行,下列敘述何者錯誤?", "options": {"A": "逾期未繳納之稅捐,即可移送強制執行", "B": "納稅義務人已依規定申請復查者,得暫緩移送強制執行", "C": "稅捐稽徵機關認為移送強制執行不當者,得申請撤回", "D": "納稅義務人對復查決定之應納稅額未繳納半數者應移送強制執行"}, "answer": "A", "note": ""}, {"id": "tax-107-24", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 24, "question": "依所得稅法相關規定,按一般稅額計算營業稅之營利事業自國外進貨,進口時下列何項不得列為其進貨\n成本?", "options": {"A": "關稅", "B": "貨物稅", "C": "進貨運費", "D": "營業稅"}, "answer": "D", "note": ""}, {"id": "tax-107-25", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 25, "question": "依現行營業稅法規定,關於小規模營業人之營業稅課徵方式,下列敘述何者正確?", "options": {"A": "應依非加值型營業稅課徵", "B": "各種行業之小規模營業人的稅率均為 1%", "C": "二個月查定課徵營業稅", "D": "符合一定條件者,其進項稅額 10%可扣減查定之營業稅額"}, "answer": "D", "note": ""}, {"id": "tax-107-26", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 26, "question": "小宸公司 107 年度之課稅所得為 500 萬元,當年度出售上市股票產生損失 200 萬元,適用促進民間參與\n公共建設法之免稅所得為 300 萬元,請計算其基本所得稅額為多少?", "options": {"A": "96 萬元", "B": "90 萬元", "C": "66 萬元", "D": "30 萬元"}, "answer": "B", "note": ""}, {"id": "tax-107-27", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 27, "question": "依現行所得稅法規定,阿宸公司(我國境內營利事業)107 年度之國內所得為 300 萬元,其日本分公司之\n稅後所得 200 萬元,已納日本所得稅 55 萬元。請問阿宸公司可自應納營利事業所得稅中扣抵之國外稅額\n為多少元?", "options": {"A": "400,000 元", "B": "433,500 元", "C": "510,000 元", "D": "550,000 元"}, "answer": "C", "note": ""}, {"id": "tax-107-28", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 28, "question": "依現行所得稅法規定,個人居住者因財政部公告之調職、非自願離職或其他非自願性因素,交易於 105\n年後購入、持有期間在二年以下之房屋、土地者,該交易之所得稅稅率為多少?", "options": {"A": "15%", "B": "20%", "C": "35%", "D": "45%"}, "answer": "B", "note": ""}, {"id": "tax-107-29", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 29, "question": "依現行所得稅法規定,個人非居住者交易於 105 年後購入、持有房屋、土地之期間超過十年者,該交易\n之所得稅稅率為多少?", "options": {"A": "15%", "B": "20%", "C": "35%", "D": "45%"}, "answer": "C", "note": ""}, {"id": "tax-107-30", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 30, "question": "依現行所得稅法規定,個人居住者 107 年度之下列何種所得應採分離課稅,無須計入綜合所得總額?", "options": {"A": "公司債之利息", "B": "檢舉逃漏稅之獎金", "C": "統一發票之中獎獎金", "D": "104 年以前購入之房屋之出售所得"}, "answer": "ABC", "note": "答A或B或C或AB或AC或BC或ABC者均給分"}, {"id": "tax-107-31", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 31, "question": "依營業稅法相關規定,有關銷售額之敘述,下列何者錯誤?", "options": {"A": "互易貨物應以換入或換出時價從高認定", "B": "銷售額應包括應稅貨物之貨物稅", "C": "以較時價為低之價格銷售而無正當理由時,稽徵機關得以時價認定其銷售額", "D": "受託代購貨物者,其銷售額應以時價為準"}, "answer": "D", "note": ""}, {"id": "tax-107-32", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 32, "question": "依遺贈稅法規定,有關分期繳納及實物抵繳之敘述,下列何者正確?", "options": {"A": "應納稅額須在 30 萬元以上", "B": "分期繳納最多分 12 期", "C": "分期繳納每期間隔不超過 3 個月", "D": "得以納稅義務人所有之境內外課徵標的物抵繳"}, "answer": "A", "note": ""}, {"id": "tax-107-33", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 33, "question": "我國國民王先生(居住者,無配偶)107 年中因病去世,遺有國內銀行存款 7,000 萬元、國外銀行存款 2,000\n萬元,由獨生女(17 歲 3 個月)繼承遺產。請問其遺產稅應納稅額為多少元?", "options": {"A": "5,715,500 元", "B": "8,715,500 元", "C": "8,790,500 元", "D": "8,975,000 元"}, "answer": "B", "note": ""}, {"id": "tax-107-34", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 34, "question": "107 年度黃先生取得境外來源所得 80 萬元,黃太太取得境外來源所得 1,000 萬元。該申報戶之綜合所得\n總額為 700 萬元、綜合所得淨額為 650 萬元。請問該申報戶之基本所得稅額為多少元?", "options": {"A": "196 萬元", "B": "202 萬元", "C": "212 萬元", "D": "222 萬元"}, "answer": "C", "note": ""}, {"id": "tax-107-35", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 35, "question": "北宸公司經營製造業,106 年 1 月 1 日購置乘人小客車一輛供公務使用,購入成本為 400 萬元,殘值 50 萬\n元,耐用年限 5 年,採直線法提列折舊。請問其 106 年度依所得稅法規定,可認列之折舊費用為多少元?", "options": {"A": "262,500 元", "B": "400,000 元", "C": "437,500 元", "D": "500,000 元"}, "answer": "C", "note": ""}, {"id": "tax-107-36", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 36, "question": "中宸公司帳列營業毛利 5,000 萬元,營業費用 3,000 萬元,非營業損失 200 萬元。營業費用中包括對公立\n大學捐贈 300 萬元及直接對私立大學捐贈 400 萬元。請問該公司依所得稅法規定,全年可認列之捐贈費\n用為多少元?", "options": {"A": "4,636,363 元", "B": "5,000,000 元", "C": "6,200,000 元", "D": "7,400,000 元"}, "answer": "B", "note": ""}, {"id": "tax-107-37", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 37, "question": "小宸公司經會計師查核簽證申報,本年度全年銷貨收入 2,000 萬元(內含已取得外匯之外銷收入 500 萬\n元),進貨成本 1,000 萬元。其依所得稅法規定,可認列之交際費上限為多少元?(提示:以銷貨為目的,\n全年銷貨貨價在 3,000 萬元以下者,以不超過全年銷貨貨價 4.5‰為限;經核准使用藍色申報書者,以不\n超過全年銷貨貨價 6‰為限。以進貨為目的,全年進貨貨價在 3,000 萬元以下者,以不超過全年進貨貨價\n1.5‰為限;經核准使用藍色申報書者,以不超過全年進貨貨價 2‰為限。)", "options": {"A": "240,000 元", "B": "210,000 元", "C": "205,000 元", "D": "182,500 元"}, "answer": "A", "note": ""}, {"id": "tax-107-38", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 38, "question": "納稅義務人黃小姐有兩戶自用房產,107 年度之房屋貸款利息支出分別為 15 萬元與 25 萬元,同年亦有銀\n行利息收入 20 萬元,均取具合法憑證。依所得稅法規定,黃小姐至多得申報之購屋借款利息扣除額為多\n少元?", "options": {"A": "5 萬元", "B": "20 萬元", "C": "30 萬元", "D": "40 萬元"}, "answer": "A", "note": ""}, {"id": "tax-107-39", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 39, "question": "依所得稅法規定,納稅義務人扶養之下列親屬或家屬,何者不得自其綜合所得總額減除免稅額?", "options": {"A": "年滿 70 歲以上之姑姑", "B": "未滿 60 歲但失業無工作收入之岳父", "C": "年滿 20 歲待業中無工作收入之弟弟", "D": "年滿 20 歲在國外就讀大學(經教育部認可、具正式學籍)之子女"}, "answer": "C", "note": ""}, {"id": "tax-107-40", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 40, "question": "總機構設於我國境內之大宸公司,107 年以 1,200 萬元出售其於 105 年以 1,100 萬元購入之房地產,用以\n計算土地增值稅之土地漲價總數額為 60 萬元,應納土地增值稅為 20 萬元,交易仲介費 50 萬元,無其他\n費用。依所得稅法規定,該筆交易應如何計入營利事業所得額?", "options": {"A": "以零計入", "B": "虧損 10 萬元", "C": "虧損 20 萬元", "D": "虧損 30 萬元"}, "answer": "A", "note": ""}, {"id": "tax-107-41", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 41, "question": "依所得稅法規定,有關個人申請房地合一所得稅重購退稅之敘述,下列何者錯誤?", "options": {"A": "自完成移轉登記之日起算二年內,重購自住房屋、土地", "B": "於重購自住房屋、土地完成移轉登記次日起算五年內,申請退還", "C": "按重購價額與出售價額之差額,自已繳稅額計算退還", "D": "重購之自住房屋、土地,於重購後五年內改作其他用途或再行移轉時,應追繳原退還稅額"}, "answer": "C", "note": ""}, {"id": "tax-107-42", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 42, "question": "依所得稅法規定,黃小姐於 108 年 1 月出售其於 107 年 3 月繼承取得之不動產,該筆不動產係黃小姐之\n父親於 106 年 8 月購入。請問該筆房地交易之所得稅稅率為多少?", "options": {"A": "15%", "B": "20%", "C": "35%", "D": "45%"}, "answer": "C", "note": ""}, {"id": "tax-107-43", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 43, "question": "依現行所得稅法規定,公司計算未分配盈餘應加徵營利事業所得稅時,下列何者不屬於可自未分配盈餘\n中減除之項目?", "options": {"A": "彌補次一年度虧損", "B": "已由當年度盈餘分配之股利或盈餘", "C": "依其他法律規定,由當年度盈餘提列之特別盈餘公積", "D": "依其他法律規定,應由稅後純益轉為資本公積者"}, "answer": "A", "note": ""}, {"id": "tax-107-44", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 44, "question": "依現行所得稅法規定,有關 107 年度之股利所得課稅之敘述,下列何者錯誤?", "options": {"A": "公益團體獲配自國內其他營利事業發放之股利所得,應計入其收入", "B": "有限合夥組織之營利事業獲配自國內其他營利事業發放之股利所得,應計入其所得", "C": "公司組織之營利事業獲配自國內其他營利事業發放之股利所得,不必計入其所得", "D": "合作社營利事業獲配自國內其他營利事業發放之股利所得,不必計入其所得"}, "answer": "B", "note": ""}, {"id": "tax-107-45", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 45, "question": "依現行所得稅法規定,107 年度個人居住者取得股利所得時,其所得稅之申報繳納方式,下列敘述何者正確?", "options": {"A": "可選擇合併計稅合併報繳或分離課稅兩種方式", "B": "可選擇分開計稅合併報繳或分離課稅兩種方式", "C": "可選擇合併計稅合併報繳或分開計稅合併報繳兩種方式", "D": "可選擇以扣繳方式完稅"}, "answer": "C", "note": ""}, {"id": "tax-107-46", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 46, "question": "依現行所得稅法規定,有關個人所得類別之敘述,下列何者正確?", "options": {"A": "出售自用二手珠寶之所得為營利所得", "B": "多層次傳銷個人參加人因下層直銷商進貨而取得之業績獎金,屬於執行業務所得", "C": "銷售傳統型(非電腦)彩券之甲類經銷商,取得之所得為其他所得", "D": "開計程車所取得之報酬為租賃所得"}, "answer": "B", "note": ""}, {"id": "tax-107-47", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 47, "question": "依所得稅法規定,下列何者不屬於執行業務所得?", "options": {"A": "領有演出執照的街頭藝人之表演酬勞", "B": "領有記帳士證書但受僱於記帳士事務所而取得之勞務報酬", "C": "作家取得之稿費", "D": "保險經紀人取得之佣金收入"}, "answer": "B", "note": ""}, {"id": "tax-107-48", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 48, "question": "依所得稅法規定,勞務報酬是依據下列何項條件認定是否為我國境內之來源所得?", "options": {"A": "勞務提供地", "B": "所得給付地", "C": "給付所得者之居住地", "D": "取得所得者之國籍"}, "answer": "A", "note": ""}, {"id": "tax-107-49", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 49, "question": "依所得稅法相關規定,關於個人居住者之認定,下列敘述何者正確?", "options": {"A": "具我國戶籍者,在一課稅年度內完全未於境內居住,應認定為居住者", "B": "具我國國籍但無戶籍者,在一課稅年度內於境內居住滿 31 天,應認定為居住者", "C": "具我國戶籍者,在一課稅年度內於境內居住合計 1 天以上未滿 31 天,但在我國擁有房地產,應認定為\n居住者", "D": "無我國國籍與戶籍,在一課稅年度內於境內居住滿 183 天,應認定為居住者"}, "answer": "D", "note": ""}, {"id": "tax-107-50", "year": "107", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 50, "question": "黃小姐 106 年度出租房地產,租期自 106 年 1 月 1 日至 107 年 12 月 31 日,出租時一次收取兩年期租金\n80 萬元,押金 20 萬元。假設未留存相關費用單據,郵政儲金一年期定期儲金固定利率為 1%。請問黃小\n姐 106 年度申報之租賃所得為多少元?", "options": {"A": "229,140 元", "B": "230,000 元", "C": "457,140 元", "D": "458,000 元"}, "answer": "C", "note": ""}, {"id": "accounting-108-1", "year": "108", "subject": "accounting", "subjectName": "會計學概要", "number": 1, "question": "下列敘述何者錯誤?", "options": {"A": "可比較性係指同一公司各年間均採用相同的會計方法", "B": "忠實表達係指會計資訊品質可確保免於錯誤", "C": "攸關的會計資訊係指其具有改變決策的能力", "D": "重大性係指公司規模可能影響投資人或債權人之決策"}, "answer": "B", "note": ""}, {"id": "accounting-108-2", "year": "108", "subject": "accounting", "subjectName": "會計學概要", "number": 2, "question": "甲公司在 20X1 年底各帳戶之餘額為:現金$5,000、應收帳款$13,000、設備$86,000、應付帳\n款$4,000、預收收入$2,000、普通股股本$50,000 及庫藏股$2,800。另外,保留盈餘在 20X1\n年期初餘額為$44,500,本期發放現金股利$3,400。試問甲公司 20X1 年之本期淨利為多少?", "options": {"A": "$2,900", "B": "$4,100", "C": "$9,700", "D": "$13,700"}, "answer": "C", "note": ""}, {"id": "accounting-108-3", "year": "108", "subject": "accounting", "subjectName": "會計學概要", "number": 3, "question": "下列敘述何者錯誤?", "options": {"A": "結帳後試算表中僅包含實帳戶", "B": "無法藉由試算表發現重複過帳之錯誤", "C": "甲公司向銀行借款,若期末漏作利息之調整分錄,則將低估負債,高估本期淨利", "D": "分別依現金基礎及權責發生制所計得之本期損益必然相同"}, "answer": "D", "note": ""}, {"id": "accounting-108-4", "year": "108", "subject": "accounting", "subjectName": "會計學概要", "number": 4, "question": "張三與李四合夥成立商店,約定盈餘分配之考慮條件有三:依各合夥人當期期初權益餘額\n之 10%設算資金成本;設算薪資:張三$36,000、李四$32,000;剩餘之損益則平均分配。\n若 20X1 年初,合夥人張三與李四之權益餘額分別為$250,000、$350,000。20X1 年合夥商店\n之本期淨利為$114,000,試問 20X1 年之盈餘如何分配與各合夥人?", "options": {"A": "張三$54,000、李四$60,000", "B": "張三$47,000、李四$67,000", "C": "張三$68,000、李四$46,000", "D": "張三$57,000、李四$57,000"}, "answer": "A", "note": ""}, {"id": "accounting-108-5", "year": "108", "subject": "accounting", "subjectName": "會計學概要", "number": 5, "question": "甲公司收到乙客戶之訂單,成交金額$34,000,付款條件 2/15,n/30。然因甲公司並無存貨,\n故向供應商購買該訂單所需之商品,其進貨成本為$22,000、進貨運費為$3,000。甲公司於 3\n月 5 日將該批商品交與乙客戶,並支付運費$1,200。乙客戶於 3 月 18 日償付半數貨款,其\n餘貨款則於 3 月 31 日償清。試問甲公司銷售此批商品之毛利為多少?", "options": {"A": "$7,460", "B": "$8,320", "C": "$8,660", "D": "$9,000"}, "answer": "C", "note": ""}, {"id": "accounting-108-6", "year": "108", "subject": "accounting", "subjectName": "會計學概要", "number": 6, "question": "甲、乙合夥人之損益分配比例為 6:4,在其資本帳戶餘額為甲$40,000、乙$25,000 時,丙經\n甲、乙同意投資$45,000 於該合夥公司並取得 1/4 之合夥權益。若商譽不入帳,則丙加入後,\n甲、乙、丙三人之資本額分別為:", "options": {"A": "$40,000;$25,000;$45,000", "B": "$50,500;$32,000;$27,500", "C": "$49,500;$33,000;$27,500", "D": "$48,750;$33,750;$27,500"}, "answer": "B", "note": ""}, {"id": "accounting-108-7", "year": "108", "subject": "accounting", "subjectName": "會計學概要", "number": 7, "question": "甲公司收到銀行寄來 6 月份之銀行對帳單,經查相關資料有:銀行對帳單餘額$56,000、存\n款不足退票$3,000、銀行代收票據$4,200 並收取服務費$100,未兌現支票$3,500、在途存款\n$2,400。試問甲公司 6 月 30 日調整前現金帳戶餘額為多少?", "options": {"A": "$56,000", "B": "$54,900", "C": "$53,800", "D": "$47,800"}, "answer": "C", "note": ""}, {"id": "accounting-108-8", "year": "108", "subject": "accounting", "subjectName": "會計學概要", "number": 8, "question": "20X1 年初,甲公司之應收帳款餘額為$53,000、備抵呆帳餘額$2,000。20X1 年甲公司賒銷\n$84,000,並收回帳款$92,000,另因客觀證據顯示客戶無力還款而沖銷帳款$1,800。甲公司\n期末評估其未來可能無法收回之帳款為應收帳款餘額的 4%,試問 20X1 年財務報表應表達:", "options": {"A": "呆帳費用$1,728、應收帳款淨額$41,272", "B": "呆帳費用$1,728、應收帳款淨額$41,472", "C": "呆帳費用$3,528、應收帳款淨額$43,000", "D": "呆帳費用$1,528、應收帳款淨額$41,472"}, "answer": "D", "note": ""}, {"id": "accounting-108-9", "year": "108", "subject": "accounting", "subjectName": "會計學概要", "number": 9, "question": "甲公司於 20X0 年、20X1 年期末盤點存貨均發生錯誤,20X0 年底高估存貨$3,000、20X1 年\n底低估存貨$2,500。試問 20X0 年及 20X1 年之存貨盤點錯誤對 20X1 年底財務報表有何影響\n(不考慮所得稅)?", "options": {"A": "資產高估$3,000", "B": "權益低估$5,500", "C": "銷貨成本高估$5,500", "D": "本期淨利低估$2,500"}, "answer": "C", "note": ""}, {"id": "accounting-108-10", "year": "108", "subject": "accounting", "subjectName": "會計學概要", "number": 10, "question": "聚優公司於 2018 年 10 月 15 日以$800,000 購入一塊土地以供建廠之用。土地上原有一棟舊\n大樓已經移除,其拆除後的廢料將予以出售。2019 年 10 月其他相關成本及出售廢料收入如\n下所示:\n移除舊大樓的成本 $ 70,000\n購地合約與過戶所支付之代書費 10,000\n產權保險費 16,000\n出售拆除舊大樓之廢料 8,000\n聚優公司在 2018 年 12 月 31 日的財務狀況表上,土地的成本應列示金額為:", "options": {"A": "$826,000", "B": "$888,000", "C": "$862,000", "D": "$896,000"}, "answer": "ABCD", "note": "一律給分"}, {"id": "accounting-108-11", "year": "108", "subject": "accounting", "subjectName": "會計學概要", "number": 11, "question": "下列為八里公司之財務資訊:\n銀行存款餘額 $ 16,457\n郵票 375\n匯票 21,800\n零用金餘額 3,150\n顧客交來之遠期支票 25,867\n銀行退回之存款不足支票 33,910\n零找金 2,570\n貨幣市場基金 80,000\n根據上列資訊,試問八里公司應認列為「現金及約當現金」之金額為:", "options": {"A": "$184,129", "B": "$162,329", "C": "$81,954", "D": "$43,977"}, "answer": "D", "note": ""}, {"id": "accounting-108-12", "year": "108", "subject": "accounting", "subjectName": "會計學概要", "number": 12, "question": "甲公司於 20X1 年初以成本$105,000 購置設備,估計使用年限為 6 年,殘值$15,000,以直線\n法提列折舊。20X4 年初,甲公司為提高該設備之效率而加裝馬達,共支出$42,000。另外,\n20X4 年 6 月進行例行性維修,支出$6,000。該設備之估計使用年限、殘值均不受影響。甲公\n司誤將 20X4 年之相關支出全數認列為當期費用,試問該錯誤將如何影響 20X4 年損益(不\n考慮所得稅)?", "options": {"A": "本期淨利低估$19,000", "B": "本期淨利低估$23,000", "C": "本期淨利低估$28,000", "D": "本期淨利低估$32,000"}, "answer": "C", "note": ""}, {"id": "accounting-108-13", "year": "108", "subject": "accounting", "subjectName": "會計學概要", "number": 13, "question": "甲公司於 20X0 年 3 月 1 日向乙銀行借款$30,000,訂於 20X3 年 2 月 28 日償還。後於 20X3\n年 2 月 6 日另向丙銀行借款$30,000 以償還 20X3 年到期之銀行借款,丙銀行借款將於 20X4\n年 5 月 1 日到期。試問甲公司 20X2 年底資產負債表應如何表達相關負債?", "options": {"A": "流動負債$30,000", "B": "長期負債$30,000", "C": "長期負債$60,000", "D": "流動負債$30,000、長期負債$30,000"}, "answer": "A", "note": ""}, {"id": "accounting-108-14", "year": "108", "subject": "accounting", "subjectName": "會計學概要", "number": 14, "question": "仁正公司在 2018 年發生下列成本:\n尋找程序替代方案的測試費 $ 380,000\n新產品之行銷研究成本 250,000\n對形成某一程序的修正費用 510,000\n仁富公司對仁正公司所提供的研發服務 425,000\n則仁正公司在 2018 年損益表上應列示的研發費用為:", "options": {"A": "$510,000", "B": "$935,000", "C": "$1,315,000", "D": "$1,565,000"}, "answer": "C", "note": ""}, {"id": "accounting-108-15", "year": "108", "subject": "accounting", "subjectName": "會計學概要", "number": 15, "question": "甲公司於 20X1 年 12 月 31 日發行面值$500,000,票面利率 6%,5 年期公司債,付息日為每\n年 12 月 31 日。發行當時市場利率為 8%,發行價格$460,100。甲公司在 20X2 年 12 月 31 日\n付息後,支付現金$260,000 至市場買回面值$250,000 之公司債並註銷。若甲公司以利息法攤\n銷溢折價,試問買回公司債之清償損益為多少?", "options": {"A": "清償損失$1,000", "B": "清償損失$25,960", "C": "清償損失$26,546", "D": "清償損失$29,950"}, "answer": "C", "note": ""}, {"id": "accounting-108-16", "year": "108", "subject": "accounting", "subjectName": "會計學概要", "number": 16, "question": "甲公司在 20X1 年 3 月 2 日以每股$15 購入庫藏股 5,000 股,並於 5 月 20 日以每股$18 出售\n2,000 股庫藏股。若甲公司對於庫藏股交易係採成本法處理,試問 20X1 年庫藏股相關交易對\n權益之影響為何?", "options": {"A": "庫藏股增加$75,000", "B": "股東權益減少$45,000", "C": "保留盈餘增加$36,000", "D": "資本公積增加$6,000"}, "answer": "D", "note": ""}, {"id": "accounting-108-17", "year": "108", "subject": "accounting", "subjectName": "會計學概要", "number": 17, "question": "甲公司為乙客戶生產產品一批,該批產品之主要成本$96,000、加工成本$97,200,製造費用\n為直接人工成本的 80%。該批產品之製造成本為多少?", "options": {"A": "$139,200", "B": "$150,000", "C": "$151,200", "D": "$193,200"}, "answer": "A", "note": ""}, {"id": "accounting-108-18", "year": "108", "subject": "accounting", "subjectName": "會計學概要", "number": 18, "question": "甲公司於 2019 年 4 月 1 日以 102 加計應計利息發行面額為$1,000,000,利率 9%之應付公司\n債。該公司債所記載之日期為 2019 年 1 月 1 日發行,每年於 1 月 1 日及 7 月 1 日各付息一\n次。甲公司另外支付$15,000 的債券發行成本。試問甲公司可自本次公司債之發行收到多少\n現金?", "options": {"A": "$1,020,000", "B": "$1,042,500", "C": "$1,027,500", "D": "$1,030,000"}, "answer": "C", "note": ""}, {"id": "accounting-108-19", "year": "108", "subject": "accounting", "subjectName": "會計學概要", "number": 19, "question": "厚富公司所生產的柳橙汁之標準成本如下:\n標準數量(小時) 標準價格(費率)\n直接材料 5 磅 $?(每磅)\n直接人工 2 小時 $16(每小時)\n變動製造費用 1.8 小時 $10(每小時)\n若每一瓶柳橙汁的標準變動成本為$58,則直接材料的標準價格為何?", "options": {"A": "$1.74", "B": "$4.60", "C": "$2.50", "D": "$1.60"}, "answer": "D", "note": ""}, {"id": "accounting-108-20", "year": "108", "subject": "accounting", "subjectName": "會計學概要", "number": 20, "question": "安吉公司在 2018 年的財務報表顯示下列資料:本期淨利$480,000,應收帳款減少$10,000,\n存貨增加$25,000,預付費用增加$18,000;應付帳款增加$27,000,遞延所得稅負債減少\n$15,000;當年折舊費用為$80,000,債券投資溢價攤銷數為$6,000;應付公司債折價攤銷數\n為$20,000;出售機器利得$55,000。試問安吉公司在 2018 年來自營業活動的現金流量為:", "options": {"A": "$470,000", "B": "$510,000", "C": "$560,000", "D": "$498,000"}, "answer": "B", "note": ""}, {"id": "bookkeeping-108-1", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 1, "question": "王記帳士僅登錄彰化縣為其執行業務區域,下列何者是其可受委任之稅務行政救濟案件?", "options": {"A": "彰化縣各項稅捐之復查、訴願、行政訴訟", "B": "彰化縣各項稅捐之復查、訴願", "C": "彰化縣各項稅捐之訴願、行政訴訟", "D": "彰化縣各項稅捐之復查"}, "answer": "D", "note": ""}, {"id": "bookkeeping-108-2", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 2, "question": "有關記帳士業務事件的主管機關下列何者正確?", "options": {"A": "稅務:財政部,商業會計:經濟部,商業登記:經濟部", "B": "稅務:國稅局,商業會計:金融監督管理委員會,商業登記:內政部", "C": "稅務:財政部,商業會計:金融監督管理委員會,商業登記:經濟部", "D": "稅務:財政部,商業會計:財政部,商業登記:財政部"}, "answer": "A", "note": ""}, {"id": "bookkeeping-108-3", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 3, "question": "李記帳士受記帳士法所定除名處分,下列何者敘述錯誤?", "options": {"A": "不得充任記帳士", "B": "已充任記帳士者,撤銷或廢止其記帳士證書", "C": "不得應考記帳士考試", "D": "撤銷或廢止原因消滅後,得依記帳士法之規定充任記帳士及請領記帳士證書"}, "answer": "D", "note": ""}, {"id": "bookkeeping-108-4", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 4, "question": "李四未依法取得記帳士或記帳及報稅代理業務人資格,卻擅自代他人處理商業會計事務及營利事業所得\n稅結算申報,處罰之依據下列何者敘述正確?", "options": {"A": "皆依記帳士法第 34 條", "B": "皆依商業會計法第 74 條", "C": "商業會計事務:商業會計法第 74 條,營利事業所得稅結算申報:記帳士法第 34 條", "D": "商業會計事務:記帳士法第 34 條,營利事業所得稅結算申報:商業會計法第 74 條"}, "answer": "C", "note": ""}, {"id": "bookkeeping-108-5", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 5, "question": "依記帳士法規定,記帳士欲在登記開業區域以外之其他縣市執行業務時,應如何辦理?", "options": {"A": "向財政部登記,免設分事務所", "B": "向其他縣市國稅分局登記,並設分事務所", "C": "向其他縣市政府登記,免設分事務所", "D": "向其他縣市政府登記,並設分事務所"}, "answer": "A", "note": ""}, {"id": "bookkeeping-108-6", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 6, "question": "記帳士不得在登錄區域內受委任執行下列那種業務?", "options": {"A": "稅務諮詢", "B": "辦理各項稅捐稽徵案件之申報及申請", "C": "各項稅捐之查核簽證申報", "D": "辦理商業會計事項"}, "answer": "C", "note": ""}, {"id": "bookkeeping-108-7", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 7, "question": "依記帳士法規定,記帳士受到申誡處分多少次以上,應另受停止執行業務處分;受停止執行業務處分累\n計滿幾年者,應予除名?", "options": {"A": "3 次;5 年", "B": "3 次;4 年", "C": "5 次;3 年", "D": "5 次:4 年"}, "answer": "A", "note": ""}, {"id": "bookkeeping-108-8", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 8, "question": "按記帳士法規定,記帳士接受委任後,因正當理由須終止契約,應於幾日前通知委任人?", "options": {"A": "30 日", "B": "20 日", "C": "15 日", "D": "10 日"}, "answer": "D", "note": ""}, {"id": "bookkeeping-108-9", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 9, "question": "財務報表之會計項目分類,上期與本期不一致時,應如何處理?", "options": {"A": "採二年度對照方式,以當年度及上年度之金額併列表達", "B": "應重新予以分類並附註說明之", "C": "重新分類", "D": "附註說明"}, "answer": "B", "note": ""}, {"id": "bookkeeping-108-10", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 10, "question": "甲君於民國 108 年 8 月 15 日在南投縣獨資設立南投商行營業,登記資本額新臺幣四萬元,下列何者敘述\n正確?", "options": {"A": "其商業會計事務主管機關、辦理商業登記機關皆為經濟部", "B": "不適用商業會計法之規定、免依商業登記法辦理商業登記", "C": "得不適用商業會計法之規定、免依商業登記法辦理商業登記", "D": "得不適用商業會計法之規定"}, "answer": "D", "note": ""}, {"id": "bookkeeping-108-11", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 11, "question": "有關財務報表附註,下列何者敘述錯誤?", "options": {"A": "視為財務報表之一部分", "B": "附註不可編製重要會計項目明細表", "C": "單獨列示於資產負債表、綜合損益表、權益變動表、現金流量表之後", "D": "幫助閱表人了解財務報表"}, "answer": "B", "note": ""}, {"id": "bookkeeping-108-12", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 12, "question": "台中公司之負責人違反商業會計法第 9 條規定,以現金 120 萬元購置原料一批,依同法第 78 條規定,應\n依下列那一項處罰?", "options": {"A": "處新臺幣三萬元以上十五萬元以下罰鍰", "B": "處新臺幣一萬元以上五萬元以下罰鍰", "C": "處新臺幣三萬元以上十萬元以下罰鍰", "D": "處新臺幣六萬元以上三十萬元以下罰鍰"}, "answer": "A", "note": ""}, {"id": "bookkeeping-108-13", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 13, "question": "乙海產行 8 月份分別自漁民購進鮮漁一批,無法取得原始憑證;自丙海產行購進漁貨一批,取得普通收\n據;自丁水產公司購進漁產加工品一批,取得統一發票;惟承辦人員疏忽,收據、發票皆遺失,依商業\n會計法第 19 條規定,下列處理何者正確?", "options": {"A": "皆應根據事實及金額作成憑證,由商業負責人或其指定人員簽名或蓋章,憑以記帳", "B": "皆應根據事實及金額作成憑證,由商業負責人或其指定人員簽名或蓋章,憑以記帳,並經辦及主管該\n事項之人員,分別或共同證明", "C": "皆應根據事實及金額作成憑證,由商業負責人得令經辦及主管該事項之人員,分別或共同證明,憑以\n記帳", "D": "取得丁公司蓋有統一發票專用章之存根聯影本替代,作原始憑證;漁民、丙海產行之進貨部分應根據\n事實及金額作成憑證,由商業負責人或其指定人員簽名或蓋章,憑以記帳,而漁民進貨部分另須經辦\n及主管該事項之人員,分別或共同證明"}, "answer": "D", "note": ""}, {"id": "bookkeeping-108-14", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 14, "question": "下列憑證、帳簿及報表:1原始憑證 2記帳憑證 3帳簿目錄 4帳簿 5決算報表 何者經辦會計\n須簽名或蓋章?", "options": {"A": "12345", "B": "1234", "C": "234", "D": "123"}, "answer": "C", "note": ""}, {"id": "bookkeeping-108-15", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 15, "question": "丙公司分別投資 A 公司、B 公司及 C 公司股票,原始認列時被指定為透過損益按公允價值衡量之金融資產,\nA 公司股票作為銀行短期借款之質押,B 公司股票作為承包 9 個月工期營建工程之保證金,C 公司股票作\n為承包三年工期營建工程之保證金,則投資 A 公司、B 公司及 C 公司股票,於資產負債表應如何列示?", "options": {"A": "皆列於流動資產之透過損益按公允價值衡量之金融資產—流動", "B": "皆列於流動資產之其他流動資產", "C": "A 公司及 B 公司股票:皆列流動資產之其他流動資產,C 公司股票:非流動資產", "D": "A 公司股票:流動資產之透過損益按公允價值衡量之金融資產—流動,B 公司股票:流動資產之其他\n流動資產,C 公司股票:流動資產之非流動資產"}, "answer": "C", "note": ""}, {"id": "bookkeeping-108-16", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 16, "question": "會計憑證應按日或按月裝訂成冊,有原始憑證者,應附於記帳憑證之後,下列何者不得另行保管?", "options": {"A": "為權責存在之憑證", "B": "整理結算及結算後轉入帳目", "C": "憑證應予永久保存", "D": "另行裝訂較便者"}, "answer": "B", "note": ""}, {"id": "bookkeeping-108-17", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 17, "question": "乙公司投資丙公司債,投資目的為依合約定期收取固定的金額,以回收投資的本金與利息,該公司債將\n於 109 年 9 月 30 日到期,下列何者敘述正確?", "options": {"A": "108 年度資產負債表應列流動資產,應以公允價值衡量", "B": "108 年度資產負債表應列非流動資產,應以攤銷後成本衡量", "C": "108 年度資產負債表應列流動資產,應以攤銷後成本衡量", "D": "108 年度資產負債表應列非流動資產,應以公允價值衡量"}, "answer": "C", "note": ""}, {"id": "bookkeeping-108-18", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 18, "question": "甲公司 107 年 12 月 31 日有營利事業所得稅之應收退稅款及應付所得稅,則該兩項應收、應付所得稅款,\n於 107 年度資產負債表應如何列示?", "options": {"A": "應收退稅款:流動資產之其他應收款,應付所得稅:流動負債之其他應付款", "B": "應收退稅款:流動資產之其他流動資產,應付所得稅:流動負債之其他流動負債", "C": "應收退稅款:流動資產之本期所得稅資產,應付所得稅:流動負債之本期所得稅負債", "D": "應收退稅款:流動資產之應收帳款,應付所得稅:流動負債之應付帳款"}, "answer": "C", "note": ""}, {"id": "bookkeeping-108-19", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 19, "question": "水湳公司折價發行 3 年期公司債,關於應付公司債之折價,按有效利息法攤銷時,下列何者敘述正確?", "options": {"A": "應付公司債折價,於應付公司債評價時,應列為應付公司債之加項", "B": "於債券流通期間,應付公司債折價逐期攤銷,則應付公司債帳面價值,逐期增加", "C": "利息費用逐期減少", "D": "折價攤銷數額逐期減少"}, "answer": "B", "note": ""}, {"id": "bookkeeping-108-20", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 20, "question": "甲公司係租賃業,關於甲公司其營業外收益及費損,下列何者敘述錯誤?", "options": {"A": "租金收入屬營業收入", "B": "利息收入及利息費用,得以其淨額列示", "C": "兌換損失及兌換利益,得以其淨額列示", "D": "採用權益法認列之投資收益及投資損失,得以其淨額列示"}, "answer": "B", "note": ""}, {"id": "bookkeeping-108-21", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 21, "question": "商業會計法所稱商業,係指下列那一項規定?", "options": {"A": "以營利為目的之事業,其範圍依商業登記法、公司法及其他法律規定", "B": "以營利為目的之公司、獨資或合夥組織", "C": "以營利為目的之事業,其範圍依公司法、證券交易法及其他法律規定", "D": "以營利為目的之公司組織"}, "answer": "A", "note": ""}, {"id": "bookkeeping-108-22", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 22, "question": "甲公司係以電子方式處理會計事務,為了爭取上市上櫃的核准,公司高層故意要會計人員多記錄收入部分\n交易事項,少記錄成本費用交易事項,使帳上獲利提高,相關會計作業處理人員於事前曾表示拒絕或提出\n更正意見有確實證據者,下列何者依商業會計法第 73 條規定,得減輕或免除其刑:1商業負責人 2依法\n受託代他人處理會計事務之人員 3經辦會計人員 4主辦會計 5以電子方式處理會計資料之有關人員", "options": {"A": "12345", "B": "2345", "C": "245", "D": "345"}, "answer": "D", "note": ""}, {"id": "bookkeeping-108-23", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 23, "question": "無活絡市場之債務工具投資之衡量基礎為:", "options": {"A": "成本", "B": "攤銷後成本", "C": "公允價值", "D": "淨變現價值"}, "answer": "B", "note": ""}, {"id": "bookkeeping-108-24", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 24, "question": "依商業會計法第 66 條規定,商業每屆決算應編製下列那些報表?1財務報表 2營業報告書 3盈餘分\n派表 4年度預算表", "options": {"A": "12", "B": "23", "C": "14", "D": "13"}, "answer": "A", "note": ""}, {"id": "bookkeeping-108-25", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 25, "question": "分期付款銷貨之未實現利息收入,應列在下列何處?", "options": {"A": "單獨列示於流動負債", "B": "列示於應收帳款的減項", "C": "列示於銷貨收入的減項", "D": "列示於利息收入的減項"}, "answer": "B", "note": ""}, {"id": "bookkeeping-108-26", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 26, "question": "依商業會計處理準則規定,下列何項係屬營業外收益及費損?", "options": {"A": "透過損益按公允價值衡量之金融資產淨損益", "B": "存貨跌價損失", "C": "固定資產重估增值", "D": "會計原則變動之累積影響數"}, "answer": "A", "note": ""}, {"id": "bookkeeping-108-27", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 27, "question": "依商業會計法第 42 條之規定,下列何者錯誤?", "options": {"A": "受贈資產按公允價值入帳", "B": "受贈資產按其性質列為資本公積", "C": "受贈資產按其性質列為遞延收入", "D": "受贈資產按其性質列為保留盈餘"}, "answer": "D", "note": ""}, {"id": "bookkeeping-108-28", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 28, "question": "依據我國商業會計法之規定,下列有關存貨評價與處理之敘述,何者錯誤?", "options": {"A": "商業存貨、存料、在製品、製成品、副產品等存貨之衡量,以實際成本為原則", "B": "成本高於淨變現價值時,跌價損失應列為非營業損失", "C": "所謂淨變現價值,係指企業預期正常營業出售存貨所能取得之淨額", "D": "存貨成本計算方法得依其種類或性質,採用個別認定法、先進先出法或平均法"}, "answer": "B", "note": ""}, {"id": "bookkeeping-108-29", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 29, "question": "金融工具投資分類在流動資產者,不可能包括下列那一項?", "options": {"A": "備供出售金融資產", "B": "持有到期日金融資產", "C": "採用權益法之投資", "D": "無活絡市場之債務工具投資"}, "answer": "C", "note": ""}, {"id": "bookkeeping-108-30", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 30, "question": "生產性植物應分類為下列何者?", "options": {"A": "生物資產", "B": "不動產、廠房及設備", "C": "投資性不動產", "D": "存貨"}, "answer": "B", "note": ""}, {"id": "bookkeeping-108-31", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 31, "question": "商業各項原始憑證及記帳憑證,其保存期限之起算日為:", "options": {"A": "營利事業所得稅申報完成日", "B": "資產負債表日", "C": "年度決算程序辦理終了日", "D": "會計年度終了日"}, "answer": "C", "note": ""}, {"id": "bookkeeping-108-32", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 32, "question": "台中公司與蔡記帳士簽訂委任書,委託蔡記帳士為台中公司記帳及報稅,蔡記帳士未經台中公司許可,\n洩漏業務上之秘密,就該事件下列何者敘述正確?", "options": {"A": "非屬應付懲戒事項", "B": "由台中公司列舉事實,提出證據直接請財政部交付懲戒", "C": "由台中公司列舉事實,提出證據,送交業務管轄稅捐稽徵機關,報請財政部交付懲戒", "D": "由台中公司列舉事實,提出證據,直接交付記帳士懲戒委員會處理"}, "answer": "BC", "note": "答B或C者均給分"}, {"id": "bookkeeping-108-33", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 33, "question": "請問下列何者不符綜合損益表中收益的定義:", "options": {"A": "出售資產利益", "B": "減損迴轉利益", "C": "出售庫藏股股票利益", "D": "金融資產評價利益"}, "answer": "C", "note": ""}, {"id": "bookkeeping-108-34", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 34, "question": "商業之財務報表,下列敘述何者正確?", "options": {"A": "財務報表上之會計項目應依財務會計準則之規定,作適當之分類及歸併,不得任意調整", "B": "財務報表之編製,不論定期或不定期均應以會計年度為之", "C": "年度財務報表之格式,除新成立商業外,應採二年度對照方式", "D": "年度財務報表之格式,除非公開發行公司外,應採二年度對照方式"}, "answer": "C", "note": ""}, {"id": "bookkeeping-108-35", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 35, "question": "未記明理由之書面行政處分,且非屬行政程序法第 111 條之無效者,依行政程序法規定,下列何者敘述\n錯誤?", "options": {"A": "未限制人民之權益者,得不記明理由", "B": "如必須記明理由者,該瑕疵行政處分更正後即可完善", "C": "已於事後記明之補正行為,僅得於訴願程序終結前為之", "D": "已於事後記明之補正行為,得不經訴願程序者,僅得於向行政法院起訴前為之"}, "answer": "B", "note": ""}, {"id": "bookkeeping-108-36", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 36, "question": "依行政程序法第 103 條規定,行政機關得不給予處分相對人陳述意見之機會,不包括下列何種情形?", "options": {"A": "情況急迫,如予陳述意見之機會,顯然違背相對人利益者", "B": "大量作成相同種類之處分", "C": "行政強制執行時所採取之各種處置", "D": "行政處分所根據之事實,客觀上明白足以確認者"}, "answer": "A", "note": ""}, {"id": "bookkeeping-108-37", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 37, "question": "公法上之請求權,於請求權人為甲行政機關,無法律另有規定,至 107 年 12 月 31 日止已經過 4 年,甲\n行政機關於 108 年 7 月 1 日作成為實現該權利之 A 行政處分,如 A 行政處分1被撤銷或廢止或其他事由\n而溯及既往失效時、2不得訴請撤銷或因其他原因失其效力後,則該請求權至何時時效完成而消滅?", "options": {"A": "1109 年 1 月 1 日消滅、2113 年 12 月 31 日消滅", "B": "1114 年 1 月 1 日消滅、2118 年 7 月 1 日消滅", "C": "1109 年 1 月 1 日消滅、2113 年 7 月 1 日消滅", "D": "1114 年 1 月 1 日消滅、2118 年 12 月 31 日消滅"}, "answer": "C", "note": ""}, {"id": "bookkeeping-108-38", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 38, "question": "依據行政程序法第 98 條規定,處分機關告知之救濟期間有錯誤時,應由該機關以通知更正之,並自何時\n起算法定期間?", "options": {"A": "發現錯誤之日起算", "B": "發現錯誤之翌日起算", "C": "通知送達之日起算", "D": "通知送達之翌日起算"}, "answer": "D", "note": ""}, {"id": "bookkeeping-108-39", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 39, "question": "依公司法第 22 條之 1 第 1 項規定,有關公司應每年定期申報之敘述,下列何者錯誤?", "options": {"A": "對象:董事、監察人、經理人及持有已發行股份總數或資本總額超過百分之十之股東", "B": "申報方式:電子方式申報", "C": "資料申報至:法務部", "D": "立法目的:配合推動洗錢防制,建構法人透明度"}, "answer": "C", "note": ""}, {"id": "bookkeeping-108-40", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 40, "question": "非公開發行股票公司,財務報導期間結束日,其財務報表,不必先經會計師查核簽證後,提請股東同意\n或股東常會承認者為何?", "options": {"A": "實收資本額達新臺幣三千萬元以上", "B": "實收資本額未達新臺幣三千萬元,營業收入淨額達新臺幣六千萬元", "C": "實收資本額未達新臺幣三千萬元,參加勞工保險員工人數達一百人", "D": "外國公司專撥在中華民國境內分公司營業所用之資金,達新臺幣三千萬元以上"}, "answer": "B", "note": ""}, {"id": "bookkeeping-108-41", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 41, "question": "下列有關公司之清算,何者敘述正確?", "options": {"A": "經法院宣告破產,或因合併及變更組織而解散之公司,必須進行清算", "B": "經解散、撤銷或廢止登記之公司,其法人人格即消滅", "C": "經解散、撤銷或廢止之公司,於清算時期中,不可經營業務", "D": "經法院宣告破產,或因合併及變更組織而解散之公司,其法人人格應即歸於消滅"}, "answer": "D", "note": ""}, {"id": "bookkeeping-108-42", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 42, "question": "依公司法規定,股份有限公司經理人之委任應由下列何者決定?", "options": {"A": "董事長", "B": "全體股東過半數同意", "C": "應由董事會以董事過半數之出席,及出席董事過半數同意", "D": "應由董事會以董事過三分之一出席,及出席董事過半數同意"}, "answer": "C", "note": ""}, {"id": "bookkeeping-108-43", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 43, "question": "按公司法第 393 條第 2 項規定,公司所登記事項,主管機關應予以公開之事項,不包括下列何者?", "options": {"A": "公司名稱", "B": "公司所在地;設有分公司者,其所在地", "C": "股息紅利分配比例限額", "D": "有無複數表決權特別股"}, "answer": "C", "note": ""}, {"id": "bookkeeping-108-44", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 44, "question": "未經設立登記,不得以公司名義經營業務或為其他法律行為。違反此項規定者,行為人應給予何種處罰?", "options": {"A": "一年以下有期徒刑、拘役或科或併科新臺幣十五萬元以下罰金", "B": "二年以下有期徒刑、拘役或科或併科新臺幣十萬元以上五十萬元以下罰金", "C": "處新臺幣四萬元以上二十萬元以下之罰鍰", "D": "處新臺幣五萬元以上五十萬元以下之罰鍰"}, "answer": "A", "note": ""}, {"id": "bookkeeping-108-45", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 45, "question": "依據我國商業登記法之規定,登記事項有變更時,除繼承之登記外,應自事實發生之日起幾日內,申請\n變更登記?", "options": {"A": "30 日內", "B": "20 日內", "C": "15 日內", "D": "10 日內"}, "answer": "C", "note": ""}, {"id": "bookkeeping-108-46", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 46, "question": "李記帳士係桃園市記帳士公會會員,關於其行為涉及職業倫理道德之處理,下列敘述何者正確?", "options": {"A": "如違反記帳士職業倫理道德規範,依中華民國記帳士公會全國聯合會之內規及行政指引加以評估及處理", "B": "如違反記帳士職業倫理道德規範,依桃園市記帳士公會之內規及行政指引加以評估及處理", "C": "如有行為準則未規範之特定行為,非屬適用範圍,無法以紀律加以處分", "D": "如有行為準則未規範之特定行為,非屬適用範圍,報請轄區國稅局處理"}, "answer": "A", "note": ""}, {"id": "bookkeeping-108-47", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 47, "question": "林記帳士於每年所得稅結算申報期間,皆積極與熱心至國稅局擔任志工,協助納稅義務人辦理綜合所得\n稅結算申報,林記帳士之行為符合記帳士職業倫理道德規範中那一項規範?", "options": {"A": "基本原則之務實", "B": "基本原則之適任", "C": "行為準則之務實", "D": "行為準則之適任"}, "answer": "C", "note": ""}, {"id": "bookkeeping-108-48", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 48, "question": "依中華民國記帳士職業倫理道德規範相關規定,下列何者為該規範制訂之目的?", "options": {"A": "砥礪記帳士專業之道德文化", "B": "指導記帳士避免遭受行政處罰", "C": "記帳士如何協助客戶避稅的相關規範", "D": "提高記帳士在執行業務過程中所獲得資訊之價值"}, "answer": "A", "note": ""}, {"id": "bookkeeping-108-49", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 49, "question": "王記帳士之客戶甲商行,酬金高於新臺幣五十萬元,甲商行無正當理由,自行或要求多次或連續以低於\n新臺幣五十萬元之現金支付,王記帳士配合客戶要求,未依記帳士暨記帳及報稅代理人防制洗錢與打擊\n資恐辦法規定,向法務部調查局申報,王記帳士之行為違反記帳士職業倫理道德規範中那一項規範?", "options": {"A": "基本原則之誠正", "B": "基本原則之保密", "C": "行為準則之誠正", "D": "行為準則之保密"}, "answer": "C", "note": ""}, {"id": "bookkeeping-108-50", "year": "108", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 50, "question": "依記帳士職業倫理道德規範,記帳士於執行業務時,應依照法令及財政部發布之其他攸關資料提供記帳\n士服務,此係符合下列何項行為準則?", "options": {"A": "誠正", "B": "務實", "C": "保密", "D": "適任"}, "answer": "D", "note": ""}, {"id": "tax-108-1", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 1, "question": "稅捐稽徵法第 21 條所稱應由稅捐稽徵機關依稅籍底冊或查得資料核定課徵之稅捐,下列那幾種稅包括在\n其中?1地價稅 2土地增值稅 3房屋稅 4使用牌照稅 5印花稅 6查定課徵之娛樂稅", "options": {"A": "1234", "B": "12346", "C": "1346", "D": "13456"}, "answer": "C", "note": ""}, {"id": "tax-108-2", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 2, "question": "納稅義務人對於核定稅捐之處分如有不服,因天災事變或其他不可抗力之事由,遲誤申請復查期間者,\n於其原因消滅後多久內得提出具體證明,申請回復原狀?又遲誤申請復查期間已逾多久者,不得申請?", "options": {"A": "一個月;六個月", "B": "一個月;一年", "C": "45 天;六個月", "D": "45 天;一年"}, "answer": "B", "note": ""}, {"id": "tax-108-3", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 3, "question": "依稅捐稽徵法,稅捐稽徵機關認定課徵租稅之構成要件事實時,應以下列何者為依據?1形式外觀之法\n律行為 2實質經濟事實關係 3形式外觀之法律關係 4實質經濟利益之歸屬與享有", "options": {"A": "12", "B": "13", "C": "23", "D": "24"}, "answer": "D", "note": ""}, {"id": "tax-108-4", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 4, "question": "稅捐稽徵法所稱相當擔保,下列何者錯誤?", "options": {"A": "黃金,按九折計算", "B": "經中央銀行掛牌之外幣、核准上市之有價證券,按八折計算", "C": "政府發行經規定可十足提供公務擔保之公債,按其市值計算", "D": "銀行存款單摺,按存款本金額計值"}, "answer": "C", "note": ""}, {"id": "tax-108-5", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 5, "question": "依所得稅法施行細則規定,公司之應付股利,於股東會決議分配盈餘之日起,幾個月內尚未給付者,視\n同給付?", "options": {"A": "3 個月", "B": "6 個月", "C": "8 個月", "D": "12 個月"}, "answer": "B", "note": ""}, {"id": "tax-108-6", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 6, "question": "所得稅法中關於薪資所得之計算,除了薪資所得特別扣除額可減除外,與提供勞務直接相關且由所得人\n負擔之下列必要費用合計金額超過薪資所得特別扣除額者,亦得檢附相關證明文件核實自薪資收入中減\n除該必要費用。試問下列何者不包括在內?", "options": {"A": "職業專用服裝費", "B": "進修訓練費", "C": "通勤交通費", "D": "職業上工具支出"}, "answer": "C", "note": ""}, {"id": "tax-108-7", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 7, "question": "依稅捐稽徵法,納稅義務人得在從事特定交易行為前,提供相關證明文件,向稅捐稽徵機關申請諮詢,\n稅捐稽徵機關應於多久內答覆?", "options": {"A": "6 個月", "B": "9 個月", "C": "12 個月", "D": "18 個月"}, "answer": "A", "note": ""}, {"id": "tax-108-8", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 8, "question": "臺北市稅捐稽徵處有應退納稅義務人某甲之 107 年土地增值稅,若某甲 107 年在臺北市仍有下列稅款相\n關積欠,依稅捐稽徵法規定,何者應優先抵繳?", "options": {"A": "地價稅", "B": "房屋稅之滯納金", "C": "土地增值稅之滯報金", "D": "使用牌照稅"}, "answer": "C", "note": ""}, {"id": "tax-108-9", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 9, "question": "依現行所得稅法,符合資格者之長期照顧特別扣除額,每人每年得扣除金額是多少?", "options": {"A": "2 萬 5 千元", "B": "12 萬元", "C": "20 萬元", "D": "核實認列"}, "answer": "B", "note": ""}, {"id": "tax-108-10", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 10, "question": "臺北市林先生的兒子目前因在校就讀故租屋在外縣市,設其 107 年度 1 月至 12 月之每月租金為$12,000,\n假設林先生採列舉扣除額申報所得稅,且未申報有購屋借款利息,試問林先生申報 107 年度綜合所得稅\n時可列舉其受扶養兒子多少的房屋租金支出?", "options": {"A": "不可列舉扣除", "B": "$12,000", "C": "$120,000", "D": "$144,000"}, "answer": "C", "note": ""}, {"id": "tax-108-11", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 11, "question": "所得基本稅額條例施行細則規定,期貨交易所得(非到期前指定平倉者),其交易成本應採何種方法計\n算之?", "options": {"A": "先進先出法", "B": "個別辨認法", "C": "加權平均法", "D": "由公司自由決定"}, "answer": "A", "note": ""}, {"id": "tax-108-12", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 12, "question": "新北市張先生 106 年度有財產交易損失 4 萬元,當年度無任何財產交易所得;另外,其 107 年度有財產\n交易所得 7 萬元,且 107 年度亦有另一項財產交易損失 5 萬元,試問張先生辦理 107 年度所得稅結算申\n報時,可申報多少的財產交易損失特別扣除?", "options": {"A": "不可扣除", "B": "5 萬元", "C": "7 萬元", "D": "9 萬元"}, "answer": "C", "note": ""}, {"id": "tax-108-13", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 13, "question": "公司分配股利給非境內居住的個人或總機構在中華民國境外的營利事業時,扣繳率為多少?", "options": {"A": "百分之十", "B": "百分之十五", "C": "百分之二十", "D": "百分之二十一"}, "answer": "D", "note": ""}, {"id": "tax-108-14", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 14, "question": "臺北市陳先生 107 年度的綜合所得淨額為新臺幣$500 萬,另其當年度有香港的利息所得$120 萬,並領到\n受益人與要保人皆為自己的年金保險金$50 萬,當年度未上市櫃股票交易所得$80 萬,及當年度綜合所得\n稅有申報減除$70 萬的非現金捐贈金額。試問陳先生當年度的基本所得額為多少?", "options": {"A": "$620 萬", "B": "$690 萬", "C": "$740 萬", "D": "$770 萬"}, "answer": "B", "note": ""}, {"id": "tax-108-15", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 15, "question": "依勞工退休金條例規定自願提繳之退休金或年金保險費,合計在每月工資多少範圍內,不計入提繳年度\n薪資收入課所得稅?", "options": {"A": "6%", "B": "10%", "C": "15%", "D": "20%"}, "answer": "A", "note": ""}, {"id": "tax-108-16", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 16, "question": "下列關於投資收益之敘述,何者錯誤?", "options": {"A": "公司、合作社、有限合夥及醫療社團法人投資於國內其他營利事業之投資收益,自中華民國八十七年\n一月一日起所獲配之股利或盈餘,不計入所得額", "B": "營利事業投資於其他公司,倘被投資公司當年度經股東同意或股東會決議不分配盈餘時,得免列投資\n收益", "C": "營利事業投資於其他公司之投資收益,應以被投資公司所訂分派股息及紅利基準日之年度為權責發生\n年度", "D": "股份有限公司之營利事業將庫藏股票交易溢價作為資本公積時,應計入所得額課稅"}, "answer": "D", "note": ""}, {"id": "tax-108-17", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 17, "question": "依現行所得稅法,某甲係中華民國境內居住之個人於年度中死亡,遺有配偶為中華民國境內居住之個人,\n其配偶於次年所得稅開徵期間合併辦理結算申報,某甲之免稅額得減除多少?", "options": {"A": "全額", "B": "二分之一", "C": "三分之一", "D": "按該年度死亡前日數,占全年日數之比例換算減除"}, "answer": "A", "note": ""}, {"id": "tax-108-18", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 18, "question": "文山有限公司 107 年全年課稅所得額 40 萬元,依現行所得稅法規定,其應納 107 年度營利事業所得稅為\n多少?", "options": {"A": "$68,000", "B": "$72,000", "C": "$76,000", "D": "$80,000"}, "answer": "B", "note": ""}, {"id": "tax-108-19", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 19, "question": "依所得基本稅額條例,下列何者不適用「每遇消費者物價指數較上次調整年度之指數上漲累計達百分之\n十以上時,按上漲程度調整之」?", "options": {"A": "營利事業之扣除額", "B": "個人之扣除額", "C": "未計入綜合所得總額之非中華民國來源所得", "D": "每一申報戶保險死亡給付之全年合計數"}, "answer": "C", "note": ""}, {"id": "tax-108-20", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 20, "question": "有關營利事業出租資產之會計處理,下列敘述何者錯誤?", "options": {"A": "融資租賃之認定與會計處理,依國際會計準則第十七號或企業會計準則公報第二十號規定辦理", "B": "營利事業首次採用國際財務報導準則以前尚未期滿之租賃合約,應依國際會計準則第十七號規定進行\n重分類", "C": "屬融資租賃者,其資產出售價格與未折減餘額之差額,應列為未實現出售損益,予以遞延以後年度,\n按租賃期間調整折舊、其他收入或支出", "D": "屬營業租賃者,租金給付及資產出售價格均為時價,應按資產出售價格與未折減餘額之差額,立即認\n列損益"}, "answer": "B", "note": ""}, {"id": "tax-108-21", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 21, "question": "一般營利事業職工每人每月伙食費,包括加班誤餐費,在新臺幣多少範圍內,免視為員工之薪資所得?", "options": {"A": "$1,800", "B": "$2,000", "C": "$2,400", "D": "$3,000"}, "answer": "C", "note": ""}, {"id": "tax-108-22", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 22, "question": "關於營利事業成本費用之認定,下列敘述何者錯誤?", "options": {"A": "非營業所必需之借款利息,不予認定為利息費用", "B": "依所得稅法規定補繳暫繳稅款所加計之利息,不得以費用列支", "C": "出售土地繳納之土地增值稅,不得列為成本費用或損失", "D": "依加值型及非加值型營業稅法規定不得扣抵之進項稅款,得就其支出之性質按原支出項目列支"}, "answer": "B", "note": ""}, {"id": "tax-108-23", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 23, "question": "依營利事業所得稅查核準則,營利事業承包工程採成本回收法計算工程損益,其承包工程之工期有跨年\n度者,其管理費用應如何認列?", "options": {"A": "於費用發生之年度列報,不得遞延", "B": "依工程之工期年度,平均列報", "C": "依工程之完工程度,按比例列報", "D": "累積於工程完工時,一次認列"}, "answer": "A", "note": ""}, {"id": "tax-108-24", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 24, "question": "關於企業固定資產的折舊,下列敘述何者錯誤?", "options": {"A": "營利事業在同一會計年度內,對不同種類之固定資產,得依規定採用不同方法提列折舊", "B": "固定資產之折舊,應按不短於固定資產耐用年數表規定之耐用年數提列折舊", "C": "固定資產耐用年數之變更須事先申請稽徵機關核准", "D": "營利事業之折舊應按每一固定資產分別計算"}, "answer": "C", "note": ""}, {"id": "tax-108-25", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 25, "question": "基隆延平股份有限公司成立 40 年,107 年度關係所得額之部分原始憑證,因遭受不可抗力災害以致滅失,\n依營利事業所得稅查核準則,107 年之所得額,稽徵機關得依該公司多久前經稽徵機關核定純益率之平均\n數核定?", "options": {"A": "前一個年度", "B": "前三個年度", "C": "前五個年度", "D": "前七個年度"}, "answer": "B", "note": ""}, {"id": "tax-108-26", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 26, "question": "依營利事業所得稅查核準則,營利事業 107 年繳納之稅捐以費用列帳,如於 108 年收到退稅款,該筆退\n稅款應如何處理?", "options": {"A": "於 107 年以費用科目沖回", "B": "列為 107 年非營業收入", "C": "於 108 年以費用科目沖回", "D": "列為 108 年非營業收入"}, "answer": "D", "note": ""}, {"id": "tax-108-27", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 27, "question": "按現行營利事業所得稅查核準則,下列何者不是營建業已興建完成但未出售或已轉供自用之房地,依工\n程別房地成本分攤的方法?", "options": {"A": "收入法", "B": "土地公告現值法", "C": "建坪比例法", "D": "評定現值法"}, "answer": "B", "note": ""}, {"id": "tax-108-28", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 28, "question": "營利事業修繕固定資產,耐用年限 5 年,依現行營利事業所得稅查核準則,該修繕支出金額不超過新臺\n幣多少元者,得列為當年度費用?", "options": {"A": "8 萬元", "B": "15 萬元", "C": "30 萬元", "D": "50 萬元"}, "answer": "A", "note": ""}, {"id": "tax-108-29", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 29, "question": "非適用勞動基準法之營利事業,定有職工退休辦法但未設置獨立之職工退休基金,其年度已支付的薪資\n總額 2,000 萬元。按現行營利事業所得稅查核準則,該年度最多得提列以費用項目列支的職工退休金準備\n是多少?", "options": {"A": "40 萬元", "B": "80 萬元", "C": "120 萬元", "D": "300 萬元"}, "answer": "B", "note": ""}, {"id": "tax-108-30", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 30, "question": "依加值型及非加值型營業稅法,由主管稽徵機關查定銷售額及計算稅額之有娛樂節目之餐飲店營業人,\n其營業稅多久由主管稽徵機關填發繳款書通知繳納一次?", "options": {"A": "每一個月", "B": "每二個月", "C": "每三個月", "D": "每六個月"}, "answer": "A", "note": ""}, {"id": "tax-108-31", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 31, "question": "依一般稅額規定計稅之營業人,進項稅額憑證未於當期申報者,其申報扣抵期間,最長以多久為限?", "options": {"A": "3 年", "B": "5 年", "C": "7 年", "D": "10 年"}, "answer": "D", "note": ""}, {"id": "tax-108-32", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 32, "question": "農產品批發市場之承銷人向農產品批發市場承購農產品,在同一市場或運往其他批發市場交易之銷售\n額,營業稅率是多少?", "options": {"A": "免稅", "B": "0.1%", "C": "1%", "D": "5%"}, "answer": "B", "note": ""}, {"id": "tax-108-33", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 33, "question": "若營業人購入物品當作中秋節交際應酬使用,並以進貨科目列帳,且該物品已支付進項稅額,營業人以\n該貨物餽贈客戶而無償移轉時,下列何者正確?", "options": {"A": "免視為銷售貨物,並免開立統一發票", "B": "視為銷售貨物,但免開立統一發票", "C": "免視為銷售貨物,需開立統一發票", "D": "視為銷售貨物,需開立統一發票"}, "answer": "D", "note": ""}, {"id": "tax-108-34", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 34, "question": "租賃公司出租之自用汽車,因承租人遲延返還而加收之違約金,依現行加值型及非加值型營業稅法規定:", "options": {"A": "屬銷售額,應開立統一發票", "B": "屬銷售額,免開立統一發票", "C": "不屬銷售額,應開立統一發票", "D": "不屬銷售額,免開立統一發票"}, "answer": "A", "note": ""}, {"id": "tax-108-35", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 35, "question": "查定計算營業稅額之小規模營業人,購買營業上使用之貨物,取得載有營業稅額之憑證,並依規定申報\n且其查定稅額達起徵點者,其進項稅額得扣減多少?", "options": {"A": "不得扣減", "B": "10%", "C": "50%", "D": "100%"}, "answer": "B", "note": ""}, {"id": "tax-108-36", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 36, "question": "營業人漏開統一發票或於統一發票上短開銷售額,於法定申報期限前經查獲者,應就其所漏稅額繳納稅\n款,並應按該稅額處幾倍以下罰鍰?另營業人之前項情形,一年內經查獲達幾次者,停止其營業?", "options": {"A": "三倍;三次", "B": "三倍;五次", "C": "五倍;三次", "D": "五倍;五次"}, "answer": "C", "note": ""}, {"id": "tax-108-37", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 37, "question": "外國公司在中華民國境內無固定營業場所而有銷售勞務者,應由勞務買受人於給付報酬之次期開始多久\n內,就給付額依適用稅率計算營業稅額繳納之?", "options": {"A": "15 日", "B": "20 日", "C": "25 日", "D": "30 日"}, "answer": "A", "note": ""}, {"id": "tax-108-38", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 38, "question": "下列何者得免用或免開統一發票?1報社銷售之廣告 2政府機關標售廢棄之物資 3醫院診所提供之\n醫療勞務 4電視臺之廣告播映", "options": {"A": "12", "B": "23", "C": "24", "D": "14"}, "answer": "B", "note": ""}, {"id": "tax-108-39", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 39, "question": "營業人發行商品禮券,禮券上已載明憑券兌付一定數量之貨物者,應於何時開立統一發票?", "options": {"A": "出售禮券時", "B": "兌付貨物時", "C": "購入貨物時", "D": "印製禮券時"}, "answer": "A", "note": ""}, {"id": "tax-108-40", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 40, "question": "下列貨物或勞務何者非屬免徵營業稅之範圍?", "options": {"A": "郵政、電信機關依法經營之業務", "B": "飼料", "C": "麵粉", "D": "金融債券交易時收取之手續費"}, "answer": "D", "note": ""}, {"id": "tax-108-41", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 41, "question": "外國之事業、機關、團體、組織在中華民國境內無固定營業場所,銷售電子勞務予境內自然人者,下列\n何者為營業稅之納稅義務人?", "options": {"A": "無須繳納營業稅", "B": "外國之事業、機關、團體、組織", "C": "電子勞務之買受人", "D": "營業人或買受人協調擇一繳納"}, "answer": "B", "note": ""}, {"id": "tax-108-42", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 42, "question": "為防止逃漏、控制稅源及促進統一發票之推行,財政部得訂定統一發票給獎辦法;其經費由全年營業稅\n收入總額中提出百分之多少以資支應?", "options": {"A": "百分之一", "B": "百分之二", "C": "百分之三", "D": "百分之五"}, "answer": "C", "note": ""}, {"id": "tax-108-43", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 43, "question": "下列何者適用之營業稅法定稅率最低?", "options": {"A": "一般小規模營業人", "B": "農產品批發市場之承銷人", "C": "保險業之再保費收入", "D": "國際運輸用之船舶、航空器及遠洋漁船"}, "answer": "D", "note": ""}, {"id": "tax-108-44", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 44, "question": "營業人連續營業幾年以上,每年營業額達多少元以上,且申報無虧損者,得向稽徵機關申請以進項憑證\n編列之明細表,代替進項稅額扣抵聯申報?", "options": {"A": "三年;五千萬", "B": "三年;一億元", "C": "五年;五千萬", "D": "五年;一億元"}, "answer": "B", "note": ""}, {"id": "tax-108-45", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 45, "question": "贈與人有以下何種情形,以受贈人為納稅義務人?1行蹤不明 2和受贈人屬二親等以內親屬 3逾法\n定繳納期限尚未繳納贈與稅,且在中華民國境內無財產可供執行 4死亡時贈與稅尚未核課", "options": {"A": "123", "B": "234", "C": "124", "D": "134"}, "answer": "D", "note": ""}, {"id": "tax-108-46", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 46, "question": "遺產及贈與稅法所訂之下列那些金額,每遇消費者物價指數較上次調整之指數累計上漲達百分之十以上\n時,自次年起按上漲程度調整之?1免稅額 2被繼承人之喪葬費用扣除額 3被繼承人之配偶扣除額\n4父母於子女婚嫁時所贈與之財物金額", "options": {"A": "123", "B": "124", "C": "134", "D": "234"}, "answer": "A", "note": ""}, {"id": "tax-108-47", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 47, "question": "關於統一發票之敘述,下列何者錯誤?", "options": {"A": "買受人為非營業人者,應以定價開立", "B": "營業人開立雲端發票之單價、金額及總計不得以外幣列示", "C": "營業人使用統一發票,應按時序開立", "D": "營業人使用統一發票,應於扣抵聯及收執聯加蓋規定之統一發票專用章"}, "answer": "B", "note": ""}, {"id": "tax-108-48", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 48, "question": "被繼承人死亡前幾年贈與下列那些人之財產,應於被繼承人死亡時,視為被繼承人之遺產,併入其遺產\n總額徵稅?1前三年、配偶 2前二年、兒子 3前二年、女婿 4前二年、父母", "options": {"A": "123", "B": "134", "C": "124", "D": "234"}, "answer": "D", "note": ""}, {"id": "tax-108-49", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 49, "question": "臺北市民劉先生 107 年度有下列之贈與行為。捐贈中華民國紅十字會現金$220 萬;結婚嫁妝$250 萬贈與\n女兒;贈與長子未上市櫃公司股票 10 萬股,贈與當日股票每股收盤價$25,每股資產淨值$20;將作農業\n使用的農地贈與次子,市價$500 萬,公告現值$300 萬;將市價$1,000 萬,公告現值$700 萬的土地贈與配\n偶。試問劉先生 107 年度的贈與總額?", "options": {"A": "$350 萬", "B": "$400 萬", "C": "$450 萬", "D": "$650 萬"}, "answer": "A", "note": ""}, {"id": "tax-108-50", "year": "108", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 50, "question": "新北市張先生於民國 108 年 7 月過世,死亡時遺留財產如下:土地市價$1,000 萬,公告地價$500 萬,公\n告現值$700 萬;房屋市價$1,500 萬,評定標準價值$600 萬;上市公司股票 1 萬股,死亡當日收盤價$30,\n當日加權平均成交價$20;於民國 107 年 1 月贈與妻子現金$200 萬、民國 106 年 5 月贈與長子$150 萬;\n職業上所需交通工具$40 萬元。試問張先生 108 年度遺產總額為多少?", "options": {"A": "$1,330 萬", "B": "$1,520 萬", "C": "$1,530 萬", "D": "$1,578 萬"}, "answer": "C", "note": ""}, {"id": "accounting-109-1", "year": "109", "subject": "accounting", "subjectName": "會計學概要", "number": 1, "question": "甲公司生產標準化產品,7 月份有關成本資料如下,請問應分攤至產品成本之製造費用總額為何?\n直接材料$100,000,工廠電費$20,000,間接人工$70,000,辦公大樓租金$60,000,間接材料$50,000,\n直接人工$90,000,利息費用$40,000", "options": {"A": "$140,000", "B": "$200,000", "C": "$330,000", "D": "$390,000"}, "answer": "A", "note": ""}, {"id": "accounting-109-2", "year": "109", "subject": "accounting", "subjectName": "會計學概要", "number": 2, "question": "乙公司生產甲產品一批,其製造成本為$100,000,主要成本為$70,000,製造費用為直接材料成本\n之 75%,該批產品之加工成本為何?", "options": {"A": "$70,000", "B": "$60,000", "C": "$40,000", "D": "$30,000"}, "answer": "B", "note": ""}, {"id": "accounting-109-3", "year": "109", "subject": "accounting", "subjectName": "會計學概要", "number": 3, "question": "甲公司所有會計項目皆有正常餘額。下列七個會計項目中,有幾個項目結帳時須借記「損益彙總」\n(Income Summary)?1預付費用 2薪資費用 3進貨退回 4銷貨運費 5利息收入 6折\n舊費用 7備抵呆帳", "options": {"A": "2 個", "B": "3 個", "C": "4 個", "D": "5 個"}, "answer": "B", "note": ""}, {"id": "accounting-109-4", "year": "109", "subject": "accounting", "subjectName": "會計學概要", "number": 4, "question": "甲公司之會計部門於 X1 年 8 月 1 日設立零用金帳戶,金額為$5,000。8 月 31 日撥補零用金時,\n以下為相關支出憑單:影印紙$341,快遞費用$632,文具用品費$456,燈具維修費$531,且保管\n零用金的保險箱內尚有現金共$3,000。試問,8 月 31 日撥補零用金時之撥補金額?", "options": {"A": "$1,931", "B": "$2,040", "C": "$1,960", "D": "$2,000"}, "answer": "D", "note": ""}, {"id": "accounting-109-5", "year": "109", "subject": "accounting", "subjectName": "會計學概要", "number": 5, "question": "甲公司於 X9 年 5 月 1 日開始販售吃到飽餐券,每月限量販售 80 張,每張售價$180,每張限用 1\n人/次,以「預收收入」列記;由於餐券物超所值,且無使用期限規定,故每月 1 日開售後均隨即\n售罄。若 5 月份共計有 62 張餐券被使用,且 6 月 30 日調整後「預收收入」之金額為$5,940(貸\n餘)。下列有關 6 月份調整分錄之敘述,何者正確?", "options": {"A": "借:預收收入$11,160", "B": "借:預收收入$11,700", "C": "借:預收收入$5,940", "D": "借:預收收入$8,460"}, "answer": "B", "note": ""}, {"id": "accounting-109-6", "year": "109", "subject": "accounting", "subjectName": "會計學概要", "number": 6, "question": "丁公司採用永續盤存制處理存貨事宜,期初存貨 100 件,成本$12,000,今年僅進貨一批 500 件,\n期末存貨 200 件,若比較先進先出法與移動加權平均法,則先進先出法之銷貨成本較移動加權平\n均法少$400,請問今年進貨單價為何?", "options": {"A": "$121", "B": "$124", "C": "$132", "D": "$133.33"}, "answer": "C", "note": ""}, {"id": "accounting-109-7", "year": "109", "subject": "accounting", "subjectName": "會計學概要", "number": 7, "question": "丙公司 X8 年部分會計項目資料如下:\n1 月 1 日 12 月 31 日\n銷貨收入 $0 $132,000\n應收帳款(總額) 3,000 6,700\n存貨 4,000 5,000\n預收收入 9,000 11,000\n若丙公司 X8 年並未沖銷應收帳款,試依上述資料,計算丙公司 X8 年度自客戶處收得之現金數:", "options": {"A": "$130,300", "B": "$129,300", "C": "$133,700", "D": "$126,300"}, "answer": "A", "note": ""}, {"id": "accounting-109-8", "year": "109", "subject": "accounting", "subjectName": "會計學概要", "number": 8, "question": "乙公司期初帳載備抵呆帳餘額為$250,000(貸餘),期末應收帳款總額$4,000,000。若乙公司估計\n按應收帳款總額之 3%提列備抵呆帳,且當期呆帳損失為$190,000,請問當期沖銷多少呆帳?", "options": {"A": "$60,000", "B": "$180,000", "C": "$320,000", "D": "$560,000"}, "answer": "C", "note": ""}, {"id": "accounting-109-9", "year": "109", "subject": "accounting", "subjectName": "會計學概要", "number": 9, "question": "下列關於「股票股利」和「股票分割」之影響,那幾項正確?\n股票股利 股票分割\n1資產和負債 不變 不變\n2股本 增加 增加\n3各股東持股比例 不變 不變\n4保留盈餘 減少 不變\n5股東權益總額 不變 增加\n6正式分錄 不需要 需要", "options": {"A": "僅123", "B": "僅134", "C": "僅1245", "D": "123456"}, "answer": "B", "note": ""}, {"id": "accounting-109-10", "year": "109", "subject": "accounting", "subjectName": "會計學概要", "number": 10, "question": "甲公司 X7 年 6 月 1 日向乙銀行辦理 5 年期分期償還借款,借款總額$60,000,有效利率和票面利\n率都是 8%,自 X8 年 5 月 31 日開始還款,每年 5 月 31 日償還固定金額$15,027,請問 X9 年 5 月\n31 日還款中償還之本金為多少(答案四捨五入至元)?", "options": {"A": "$11,045", "B": "$10,227", "C": "$11,429", "D": "$11,929"}, "answer": "A", "note": ""}, {"id": "accounting-109-11", "year": "109", "subject": "accounting", "subjectName": "會計學概要", "number": 11, "question": "下列有關試算表之敘述,何者正確?", "options": {"A": "調整後試算表和結帳後試算表各會計項目的差異源自於調整分錄", "B": "結帳後試算表中無收入、費用、保留盈餘等會計項目", "C": "調整後試算表和結帳後試算表中,會計項目「現金」之金額一樣", "D": "期末提列「折舊費用」時,金額計算錯誤,調整分錄借貸方皆少提列$500,會導致試算表不平衡"}, "answer": "C", "note": ""}, {"id": "accounting-109-12", "year": "109", "subject": "accounting", "subjectName": "會計學概要", "number": 12, "question": "甲公司於 X1 年 10 月 1 日以現金$20,000,000 取得乙公司 20%普通股,投資成本與取得股權淨值\n間無差異,並將此次交易以權益法處理。若乙公司 X1 年之淨利為$5,000,000,董事會決定於年底\n發放現金股利$2,500,000 給予乙公司之股東。假設其他條件不變,則下列敘述何者正確?", "options": {"A": "甲公司 X1 年期末總資產因收到現金股利而增加$4,000,000", "B": "甲公司 X1 年期末淨利因認列權益法投資利益而增加$100,000", "C": "甲公司 X1 年期末現金因收到乙公司所發放之現金股利而增加$500,000", "D": "甲公司 X1 年期末所持有乙公司普通股因收到現金股利而增加$2,500,000"}, "answer": "C", "note": ""}, {"id": "accounting-109-13", "year": "109", "subject": "accounting", "subjectName": "會計學概要", "number": 13, "question": "請就下列數據計算銷貨毛利率:銷貨收入$270,000,銷貨退回$20,000,銷貨運費$10,000,銷貨成\n本$100,000,薪資費用$59,000,進貨折扣$1,000", "options": {"A": "0.6", "B": "0.5833", "C": "0.604", "D": "0.324"}, "answer": "A", "note": ""}, {"id": "accounting-109-14", "year": "109", "subject": "accounting", "subjectName": "會計學概要", "number": 14, "question": "甲公司於 X9 年 4 月 1 日以$382,680 發行 5 年期,票面利率 4%,每年 3 月 31 日付息一次,面額\n$400,000 之債券,發行時有效利率 5%。請計算該債券於發行期間 5 年之利息費用總額:", "options": {"A": "$62,680", "B": "$80,000", "C": "$95,670", "D": "$97,320"}, "answer": "D", "note": ""}, {"id": "accounting-109-15", "year": "109", "subject": "accounting", "subjectName": "會計學概要", "number": 15, "question": "甲公司收到銀行寄發之貸項通知書,請問有可能是下列那個原因導致的?", "options": {"A": "銀行支付「保付支票」", "B": "銀行收取銀行服務費通知", "C": "公司到期託收票據收現", "D": "銀行通知客戶存款不足退票"}, "answer": "C", "note": ""}, {"id": "accounting-109-16", "year": "109", "subject": "accounting", "subjectName": "會計學概要", "number": 16, "question": "甲公司有關 X1 年存貨的資料如下:期初存貨成本$675,000,當年度進貨總額為$2,500,000,進貨\n運費為$450,000,進貨退回及折讓為$172,500,當年度銷貨收入為$3,500,000。按同業存貨水準與\n甲公司過去之經驗,甲公司之正常毛利率估計約為 20%。甲公司於 X1 年 12 月 31 日實地盤點存\n貨後確認,存貨成本為$600,000,試估計甲公司之存貨盤存盈虧金額為何?", "options": {"A": "$397,500", "B": "$225,000", "C": "$652,500", "D": "$52,500"}, "answer": "D", "note": ""}, {"id": "accounting-109-17", "year": "109", "subject": "accounting", "subjectName": "會計學概要", "number": 17, "question": "公司買回庫藏股時會發生下列那種情況(假設其他條件都不變)?", "options": {"A": "資產總額增加", "B": "每股盈餘減少", "C": "現金總額增加", "D": "普通股權益報酬率變大"}, "answer": "D", "note": ""}, {"id": "accounting-109-18", "year": "109", "subject": "accounting", "subjectName": "會計學概要", "number": 18, "question": "甲公司 X1 年 1 月 1 日之流通在外普通股數總計為 400,000 股。甲公司在 X1 年相關交易如\n下:4 月 1 日購回普通股 30,000 股,7 月 1 日再辦理現金減資減少普通股 40,000 股,9 月 1\n日發行普通股 30,000 股,11 月 1 日再出售庫藏股 30,000 股。試問,甲公司 X1 年之加權平\n均流通在外股數?", "options": {"A": "390,000", "B": "370,000", "C": "372,500", "D": "350,000"}, "answer": "C", "note": ""}, {"id": "accounting-109-19", "year": "109", "subject": "accounting", "subjectName": "會計學概要", "number": 19, "question": "甲公司 X1 年簽約代理德國進口之最新電器用品,相關成本如下:銷售店面租金$400,000,德\n國原廠給甲公司的單位進貨成本為$150,且每賣出一單位產品需回饋$10 給德國母公司。每年\n廣告宣傳費$100,000,每單位售價$200。試問,甲公司 X1 年達成損益平衡時該產品之銷貨收\n入金額?", "options": {"A": "$1,600,000", "B": "$2,500,000", "C": "$3,250,000", "D": "$2,000,000"}, "answer": "B", "note": ""}, {"id": "accounting-109-20", "year": "109", "subject": "accounting", "subjectName": "會計學概要", "number": 20, "question": "甲公司 X1 年 8 月 31 日之現金帳面餘額為$455,710,銀行對帳單餘額為$392,337,經核對後發現\n以下交易:\n 8 月 29 日存入乙銀行之支票$77,389,銀行尚未入帳\n公司銀行存款所產生之利息$647,公司尚未入帳\n公司開立給丙公司用以支付應付帳款之支票$13,567 尚未兌現\n公司開立給丁公司之支票$6,432,公司帳上誤記為$6,234\n試問,8 月 31 日正確之銀行存款餘額為何?", "options": {"A": "$442,790", "B": "$456,159", "C": "$469,528", "D": "$456,555"}, "answer": "B", "note": ""}, {"id": "bookkeeping-109-1", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 1, "question": "依商業會計法規定,商業應將因營業及非因營業所產生之應收帳款及應收票據分別列示,是基於:", "options": {"A": "充分揭露", "B": "可比較性", "C": "時效性", "D": "攸關性"}, "answer": "A", "note": ""}, {"id": "bookkeeping-109-2", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 2, "question": "依記帳士法規定,下列何者為記帳士與委任人訂立之委任書與記帳士執行業務設置簿冊皆應載明之事\n項?1委任人之地址 2委任權限 3委任案件內容 4酬金數額 5委任日期", "options": {"A": "123", "B": "135", "C": "234", "D": "345"}, "answer": "B", "note": ""}, {"id": "bookkeeping-109-3", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 3, "question": "甲商號受疫情影響生意大幅衰退,欲終止營業。下列有關應辦理事項及時限之敘述,何者正確?", "options": {"A": "應於 7 日內申請停業登記", "B": "應於 15 日內申請歇業登記", "C": "應於 30 日內申請廢止登記", "D": "應於 6 個月內申請繼承登記"}, "answer": "B", "note": ""}, {"id": "bookkeeping-109-4", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 4, "question": "依記帳士法規定,有關充任記帳士之情事,下列敘述何者正確?", "options": {"A": "曾因業務上有侵占、偽造文書等犯罪行為,受有期徒刑 1 年以上刑之裁判確定,但受緩刑之宣告者,\n不得充任記帳士", "B": "曾服公職而受免除職務處分,自處分確定日起已屆滿 5 年者,得充任記帳士", "C": "受破產之宣告尚未復權,已充任記帳士者,停止其執行業務,並撤銷其記帳士證書", "D": "受監護或輔助宣告已撤銷者,得依規定執行業務,並重新請領記帳士證書"}, "answer": "B", "note": ""}, {"id": "bookkeeping-109-5", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 5, "question": "依記帳士法規定,記帳士應交付懲戒之情事,下列敘述何者正確?", "options": {"A": "因業務上涉及侵占、偽造文書之犯罪行為,正由法院審理中,尚未判刑確定者", "B": "逃漏稅捐,正由稅捐稽徵機關調查中者", "C": "記帳士經登錄後,尚未加入記帳士公會,即因特殊原因而開始執行業務,事後已立即補申請加入記\n帳士公會", "D": "記帳士證書遺失已依規定申請補發"}, "answer": "C", "note": ""}, {"id": "bookkeeping-109-6", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 6, "question": "依記帳士法規定,有關記帳士之執行業務,下列敘述何者正確?", "options": {"A": "記帳士事務所名稱,應註明「稅務記帳士事務所」", "B": "記帳士請領記帳士證書後,30 日內應向主管機關申請登錄", "C": "經登錄之記帳士,原登錄事項有變更時,應自事實發生之日起 15 日內,向其原登錄之機關申報備查", "D": "自行申請註銷資格者,仍應註銷登錄"}, "answer": "D", "note": ""}, {"id": "bookkeeping-109-7", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 7, "question": "依記帳士法第 25 條規定,各級記帳士公會應將公會章程等各款事項,申報下列何機關?", "options": {"A": "中央人民團體主管機關及所在地人民團體主管機關", "B": "中央社會團體主管機關及所在地主管機關", "C": "所在地人民團體主管機關及主管機關", "D": "所在地社會團體主管機關及稽徵主管機關"}, "answer": "C", "note": ""}, {"id": "bookkeeping-109-8", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 8, "question": "依記帳士法及相關法規規定,有關記帳及報稅代理人之執行業務,下列敘述何者錯誤?", "options": {"A": "非加入記帳及報稅代理人公會,不得執行業務", "B": "每年未完成至少 24 小時以上之相關專業訓練,次年度不得繼續執業", "C": "記帳及報稅代理人應設置簿冊,簿冊應保存 5 年", "D": "登錄後經註銷者,不得執行記帳及報稅代理業務;其擅自執行業務者,由記帳及報稅代理人懲戒委\n員會處理之"}, "answer": "D", "note": ""}, {"id": "bookkeeping-109-9", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 9, "question": "依商業會計處理準則規定,下列何項資產不需於資產負債表日進行減損測試?", "options": {"A": "備供出售金融資產", "B": "存貨", "C": "以成本衡量之權益工具投資", "D": "採權益法之投資"}, "answer": "B", "note": ""}, {"id": "bookkeeping-109-10", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 10, "question": "商業於申報營利事業所得稅時,若發現各項所得之計算與一般公認會計原則不符時,應如何處理?", "options": {"A": "按所得稅會計處理方式,另作分錄記載", "B": "平時依一般公認會計原則入帳,報稅時再依稅法規定作帳外調整,不影響帳面紀錄", "C": "究應採一般公認會計原則或稅法規定處理,依個案商請主管稽徵機關輔導", "D": "以上皆可,只要前後期一致"}, "answer": "B", "note": ""}, {"id": "bookkeeping-109-11", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 11, "question": "商業在合併、分割、收購、解散、終止或轉讓時,下列何者不屬於商業會計法認可之資產計價方式?", "options": {"A": "公允價值", "B": "實際成交價格", "C": "帳面金額", "D": "淨變現價值"}, "answer": "D", "note": ""}, {"id": "bookkeeping-109-12", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 12, "question": "耐用年限屆滿仍可繼續供營業上使用之資產,有關折舊之提列,在商業會計法上有何規定?", "options": {"A": "應就殘值繼續提列折舊", "B": "得就殘值繼續提列折舊", "C": "應就公允價值繼續提列折舊", "D": "得就淨變現價值繼續提列折舊"}, "answer": "B", "note": ""}, {"id": "bookkeeping-109-13", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 13, "question": "下列有關生產性植物之敘述,何者正確?", "options": {"A": "在會計上應分類為生物資產-非流動", "B": "只能以公允價值減出售成本衡量", "C": "其所有權有受限制及作為擔保品者應予揭露", "D": "因存活年限估計不易,可不提折舊"}, "answer": "C", "note": ""}, {"id": "bookkeeping-109-14", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 14, "question": "商業會計法對於支出效益之敘述,下列何者錯誤?", "options": {"A": "支出之效益及於以後各期者,列為資產", "B": "支出之效益僅及於當期者,列為費用", "C": "支出無效益者,列為損失", "D": "數額較為鉅大之損失不宜全部由本期分擔者,得分期認列"}, "answer": "D", "note": ""}, {"id": "bookkeeping-109-15", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 15, "question": "依商業會計法之規定,應於決算報表上簽名或蓋章之人,並無不法或不正當行為時,於該決算報表獲\n得承認後可解除對於該年度會計上之責任者,為:1代表商業之負責人 2經理人 3主辦會計人員\n4經辦會計人員", "options": {"A": "123", "B": "234", "C": "13", "D": "34"}, "answer": "C", "note": ""}, {"id": "bookkeeping-109-16", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 16, "question": "會計年度採曆年制之商業,其決算最晚須於次年的何時完成?", "options": {"A": "2 月底", "B": "3 月 15 日", "C": "4 月 15 日", "D": "5 月 15 日"}, "answer": "D", "note": ""}, {"id": "bookkeeping-109-17", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 17, "question": "依商業會計法規定,營業收入認列之方式,下列何者正確?", "options": {"A": "採用現金收付制之商業,於交付商品時認列", "B": "勞務收入依其性質分段提供者應用成本回收法認列", "C": "採權責發生制之商業,於交付貨品或提供勞務完畢之時認列", "D": "分期付款銷貨收入應視其性質按毛利百分比攤算入帳"}, "answer": "C", "note": ""}, {"id": "bookkeeping-109-18", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 18, "question": "依商業會計處理準則規定,下列何項非屬權益項目?", "options": {"A": "待彌補虧損", "B": "國外營運機構財務報表換算之兌換差額", "C": "資本公積", "D": "股東會已決議而尚未發放之現金股利"}, "answer": "D", "note": ""}, {"id": "bookkeeping-109-19", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 19, "question": "已支付所得稅金額超過本期及前期應付金額之部分,稱為:", "options": {"A": "遞延所得稅資產", "B": "本期所得稅資產", "C": "本期所得稅負債", "D": "遞延所得稅負債"}, "answer": "B", "note": ""}, {"id": "bookkeeping-109-20", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 20, "question": "依商業會計處理準則第 44 條規定,商業發生於那一段期間之重大事項為期後事項?", "options": {"A": "決算辦理完成日至股東常會決議日", "B": "資產負債表日至停止過戶日", "C": "資產負債表日至財務報表通過日", "D": "決算辦理完成日至董事會決議日"}, "answer": "C", "note": ""}, {"id": "bookkeeping-109-21", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 21, "question": "依商業會計處理準則規定,下列有關記帳憑證保管之敘述,何者正確?1應至少保存 5 年 2保管期\n限屆滿經會計經理核准後得予銷毀 3需由經辦會計人員簽章 4裝訂時記帳憑證應附於原始憑證\n之後作為附件 5應製作目錄備查", "options": {"A": "135", "B": "1245", "C": "1235", "D": "2345"}, "answer": "A", "note": ""}, {"id": "bookkeeping-109-22", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 22, "question": "依商業會計處理準則規定,商業資產負債表權益項目之內容,下列敘述何者錯誤?", "options": {"A": "資本公積,指公司因股本交易所產生之權益,應按其性質分別列示", "B": "符合負債性質之特別股不可認列為資本項目", "C": "盈餘分配或虧損彌補應俟股東同意或股東會同意後方可列帳", "D": "法定盈餘公積指依法令或盈餘分派之議案,自盈餘中指撥之公積,以限制股息及紅利之分派者"}, "answer": "D", "note": ""}, {"id": "bookkeeping-109-23", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 23, "question": "依商業會計處理準則第 24 條規定,商業應於資產負債表日對於非流動資產項目評估是否有減損之\n跡象,下列何者屬於應評估減損之會計項目?1採用權益法之投資 2生物資產 3投資性不動產\n4無形資產 5礦產資源 6持有至到期日金融資產", "options": {"A": "1256", "B": "1346", "C": "2346", "D": "1245"}, "answer": "B", "note": ""}, {"id": "bookkeeping-109-24", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 24, "question": "依商業會計處理準則規定,關於不動產、廠房及設備之衡量,下列敘述何者錯誤?", "options": {"A": "指用於商品、農業產品或勞務之生產或提供之不動產、廠房及設備", "B": "指出租予他人或供管理目的而持有之不動產、廠房及設備", "C": "指為賺取租金而由所有者所持有之不動產", "D": "預期使用期間超過 1 年之有形資產,會計項目包括生產性植物在內"}, "answer": "C", "note": ""}, {"id": "bookkeeping-109-25", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 25, "question": "依商業會計處理準則規定,關於應收票據之處理,下列敘述何者正確?", "options": {"A": "業已確定無法收回者,應予揭露", "B": "資產負債表日應評估無法收回之金額,應予揭露", "C": "已提供擔保者,應予轉銷", "D": "應收票據以攤銷後成本衡量,但未付息之短期應收票據若折現之影響不大,得以票面金額衡量"}, "answer": "D", "note": ""}, {"id": "bookkeeping-109-26", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 26, "question": "依商業會計法及相關法規規定,關於記帳憑證之敘述,下列何者錯誤?", "options": {"A": "記帳憑證之編製應以原始憑證為依據,原始憑證應附於記帳憑證之後作為附件", "B": "記帳憑證保管期限屆滿,經經理人之核准,得予以銷毀", "C": "為證明權責存在之憑證或應永久或另行裝訂較便之原始憑證,得另行彙訂保管", "D": "記帳憑證應由代表商業之負責人、經理人、主辦及經辦會計人員簽名或蓋章負責"}, "answer": "B", "note": ""}, {"id": "bookkeeping-109-27", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 27, "question": "甲記帳士受 B 公司委任,處理會計事務及稅務申報事宜,涉以虛開之不實發票,填製 B 公司之會計\n憑證並登入帳簿,依商業會計法規定,甲記帳士應受何項處罰?", "options": {"A": "處 3 年以下有期徒刑、拘役或科或併科新臺幣 30 萬元以下罰金", "B": "處 3 年以下有期徒刑、拘役或科或併科新臺幣 60 萬元以下罰金", "C": "處 1 年以下有期徒刑、拘役或科或併科新臺幣 15 萬元以下罰金", "D": "處 5 年以下有期徒刑、拘役或科或併科新臺幣 60 萬元以下罰金"}, "answer": "D", "note": ""}, {"id": "bookkeeping-109-28", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 28, "question": "甲公司為有分支機構之商業,依商業會計法規定,商業負責人應於何時將公司之決算報表提請股東承\n認;其本、分支機構應如何辦理決算?", "options": {"A": "決算程序辦理終了後 6 個月內;分開辦理決算", "B": "決算辦理完竣後 2 個月內,必要時得延長 2 個半月;合併辦理決算", "C": "會計年度終了後 6 個月內;合併辦理決算", "D": "商業負責人簽名蓋章後 6 個月內;分開辦理決算"}, "answer": "C", "note": ""}, {"id": "bookkeeping-109-29", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 29, "question": "依商業會計法規定,有關營業收入認列之時點,下列敘述何者錯誤?", "options": {"A": "營業收入應於交易完成時認列", "B": "勞務收入依其性質分段提供者仍應一次認列", "C": "分期付款銷貨得視其性質按毛利百分比法攤算入帳", "D": "採用權責發生制之商業,指交付貨品或勞務完畢之時認列"}, "answer": "B", "note": ""}, {"id": "bookkeeping-109-30", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 30, "question": "依商業會計法規定,商業具有控制能力或重大影響力之長期股權投資,應採用下列何種方法衡量?", "options": {"A": "公允價值法", "B": "成本法", "C": "權益法", "D": "攤銷後成本法"}, "answer": "C", "note": ""}, {"id": "bookkeeping-109-31", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 31, "question": "依商業會計法及相關法規規定,關於原始憑證之敘述,下列何者錯誤?", "options": {"A": "原始憑證為證明處理會計事項人員之責任,而為記帳所根據之憑證", "B": "原始憑證係自其商業本身以外之人所取得者,稱為外來憑證", "C": "商業外來憑證及對外憑證,應由開具人簽名或蓋章", "D": "員工薪資扣繳憑單及買賣契約書均屬於原始憑證之範圍"}, "answer": "A", "note": ""}, {"id": "bookkeeping-109-32", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 32, "question": "依商業會計法規定,商業得免設普通序時帳簿之情形,下列敘述何者正確?", "options": {"A": "內部控制制度健全,使用明細分類帳會計項目日報表者", "B": "會計制度健全,使用總分類帳會計項目日計表者", "C": "內部控制制度健全,使用總分類帳會計項目日計表及特種序時帳簿者", "D": "會計制度健全,使用特種序時帳簿會計項目日計表者"}, "answer": "B", "note": ""}, {"id": "bookkeeping-109-33", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 33, "question": "甲企業社設立於臺南市,登記資本額為新臺幣 6 萬元,會計事務擬委由記帳士代為處理,依商業會計\n法規定,其商業會計事務之管理機關,下列何者正確?", "options": {"A": "臺南市政府", "B": "得不受商業會計法之規範", "C": "財政部", "D": "經濟部"}, "answer": "A", "note": ""}, {"id": "bookkeeping-109-34", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 34, "question": "依商業會計處理準則規定,下列何者應列為綜合損益表之本期其他綜合損益項目?", "options": {"A": "未實現重估增值", "B": "透過損益按公允價值衡量之金融資產(負債)淨損益", "C": "備供出售金融資產已實現損益", "D": "停業單位損益"}, "answer": "A", "note": ""}, {"id": "bookkeeping-109-35", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 35, "question": "商業因過去事件而負有現時義務,且很有可能需要流出具經濟效益之資源以清償該義務,及該義務之\n金額能可靠估計時,應認列為:", "options": {"A": "負債準備", "B": "或有負債", "C": "其他應付款", "D": "先作備忘錄,待實際支付時再行認列"}, "answer": "A", "note": ""}, {"id": "bookkeeping-109-36", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 36, "question": "記帳士對於所有攸關情況之評估應力求平衡,在作成判斷時不受個人利益或他人之不當影響,符合記\n帳士職業倫理道德規範下列何項準則?", "options": {"A": "基本原則之適任", "B": "基本原則之務實", "C": "行為準則之務實", "D": "行為準則之誠正"}, "answer": "B", "note": ""}, {"id": "bookkeeping-109-37", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 37, "question": "行政處分之內容違反公共秩序或善良風俗者,屬於:", "options": {"A": "無效之行政處分", "B": "得撤銷之行政處分", "C": "得廢止之行政處分", "D": "得補正之行政處分"}, "answer": "A", "note": ""}, {"id": "bookkeeping-109-38", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 38, "question": "違法行政處分經原作成行政處分之機關撤銷後,其行政處分之效力為:", "options": {"A": "自撤銷日起失效", "B": "溯及既往失其效力", "C": "為保障受益人權益,對其有利部分不因原行政處分被撤銷而失效", "D": "依個案經利害關係人申請後由上級主管機關公告"}, "answer": "B", "note": ""}, {"id": "bookkeeping-109-39", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 39, "question": "下列何種行為屬於行政程序法所稱之行政處分?", "options": {"A": "財政部頒布之稅務違章案件減免處罰標準", "B": "道路交通安全的宣導", "C": "交通部中央氣象局提供的降雨量資訊及颱風預報", "D": "核發建照"}, "answer": "D", "note": ""}, {"id": "bookkeeping-109-40", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 40, "question": "公司法第 16 條有關公司對外為保證人之規定,下列敘述何者正確?", "options": {"A": "公司負責人經董事過半數之出席及出席董事過半數同意,得為任何保證人", "B": "公司依公司章程規定,得為任何保證人", "C": "公司為保障股東之權益,不得為任何保證人", "D": "公司得經全體股東同意為對外保證人"}, "answer": "B", "note": ""}, {"id": "bookkeeping-109-41", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 41, "question": "乙記帳士受 A 公司委任代為處理會計事務,卻意圖規避、妨礙或拒絕法院所選派之檢查員,檢查 A\n公司之會計帳簿及憑證,依商業會計法規定,乙記帳士應受下列何項處罰,並應由何機關裁罰之?", "options": {"A": "處新臺幣 3 萬元以上 15 萬元以下罰鍰/經濟部", "B": "處新臺幣 3 萬元以上 15 萬元以下罰鍰/法院", "C": "處新臺幣 1 萬元以上 5 萬元以下罰鍰/法院", "D": "處新臺幣 1 萬元以上 5 萬元以下罰鍰/經濟部"}, "answer": "C", "note": ""}, {"id": "bookkeeping-109-42", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 42, "question": "下列對於記帳士提供專業服務時應注意事項之敘述,何者正確?1以合標準之方法完成 2依限完成\n3依法完成 4以受委任人之最大利益為主 5以有類似客戶作為是否接受新客戶委任之判斷準則", "options": {"A": "123", "B": "134", "C": "234", "D": "245"}, "answer": "A", "note": ""}, {"id": "bookkeeping-109-43", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 43, "question": "下列對於記帳士工作的描述,何者錯誤?1協助納稅義務人完納稅捐 2作為徵納雙方溝通之橋樑\n3協助納稅義務人完成稅務登記 4協助稽徵機關簡化稅政 5以委任人之最大利益為優先考量", "options": {"A": "12", "B": "34", "C": "35", "D": "45"}, "answer": "D", "note": ""}, {"id": "bookkeeping-109-44", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 44, "question": "下列有關公司經理人競業禁止之敘述,何者錯誤?", "options": {"A": "不得自營或為他人經營同類之業務", "B": "不得兼任其他營利事業之經理人", "C": "有限公司經全體股東過半數同意者,可不受限制", "D": "股份有限公司經股東會以股東過半數之出席,及出席股東過半數同意之決議行之者,可不受限制"}, "answer": "CD", "note": "答C或D或CD者均給分"}, {"id": "bookkeeping-109-45", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 45, "question": "在記帳士職業倫理道德規範中,下列何項基本原則係提供外界對記帳士判斷寄予信賴之基礎?", "options": {"A": "誠正", "B": "務實", "C": "保密", "D": "適任"}, "answer": "A", "note": ""}, {"id": "bookkeeping-109-46", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 46, "question": "依公司法規定,下列對於外國公司之敘述,何者錯誤?", "options": {"A": "依照外國法律組織登記", "B": "需以營利為目的", "C": "於法令限制內,與本國公司有同一之權利能力", "D": "須經外交部認許,方可在中華民國境內營業"}, "answer": "D", "note": ""}, {"id": "bookkeeping-109-47", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 47, "question": "依商業會計處理準則規定,關於外來憑證及對外憑證應記載事項,下列何者錯誤?", "options": {"A": "負責人姓名", "B": "憑證名稱", "C": "統一編號", "D": "交易內容及金額"}, "answer": "A", "note": ""}, {"id": "bookkeeping-109-48", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 48, "question": "商業之主辦會計人員,可能因下列何項情事之發生而被科處罰金?", "options": {"A": "以明知為不實之事項,而填製會計憑證或記入帳冊", "B": "違反規定,不按時記帳", "C": "規避、妨礙或拒絕法院之檢查", "D": "未依規定在決算報表簽章"}, "answer": "A", "note": ""}, {"id": "bookkeeping-109-49", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 49, "question": "依商業登記法規定,下列何者屬於應依法申請登記之商業?", "options": {"A": "小規模攤販", "B": "以僱用員工操作為主之家庭手工業", "C": "以自任操作為主之小規模家庭手工業", "D": "每月銷售額未達營業稅起徵點之小規模商業"}, "answer": "B", "note": ""}, {"id": "bookkeeping-109-50", "year": "109", "subject": "bookkeeping", "subjectName": "記帳相關法規概要", "number": 50, "question": "依商業會計處理準則規定,關於流動負債之處理,下列敘述何者正確?", "options": {"A": "避險之衍生金融負債,應以公允價值衡量", "B": "存出保證用之票據,於保證責任終止時可收回註銷者,應改列為其他應付款", "C": "應付稅捐應列為其他流動負債項下", "D": "已提供擔保之應付帳款,應列為應付帳款之減項,並揭露擔保品及金額"}, "answer": "A", "note": ""}, {"id": "tax-109-1", "year": "109", "subject": "tax", "subjectName": "稅務相關法規概要", "number": 1, "question": "下列那些項目應計入綜合所得總額合併計稅?1領取醫療保險給付 20 萬元 2抽中百貨公司舉辦之\n活動獎金 50 萬元 3母親贈與現金 250 萬元 4年終獎金 15 萬元 5公司給付每月伙食費 2,400\n元,全年合計 28,800 元", "options": {"A": "135", "B": "24", "C": "12", "D": "1245"}, "answer": "B", "note": ""}, {"id": "tax-109-2", "year": "109", "subject": "tax", "subjec
